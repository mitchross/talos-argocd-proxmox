name: Cluster CI

on:
  pull_request:
    paths:
      - infrastructure/**
      - monitoring/**
      - my-apps/**
      - scripts/**
      - scripts/validate-argocd-apps.sh
      - .github/workflows/cluster-ci.yml
      - .github/renovate.json5
  push:
    branches:
      - main
    paths:
      - infrastructure/**
      - monitoring/**
      - my-apps/**
      - scripts/**
      - scripts/validate-argocd-apps.sh
      - .github/workflows/cluster-ci.yml
      - .github/renovate.json5

permissions:
  contents: read

concurrency:
  group: cluster-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match the binaries bundled in Argo CD v3.5.2: a render that only passes with other versions proves nothing.
  # Argo CD 3.5+ renders with Helm 4 only.
  KUSTOMIZE_VERSION: 5.8.1
  HELM_VERSION: 4.2.1
  KUBECONFORM_VERSION: v0.7.0
  KUBERNETES_VERSION: 1.37.0

jobs:
  posthog-injector-proxy:
    name: PostHog injector proxy regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s infrastructure/networking/posthog-injector/tests -v

  pi-request-hook:
    name: Pi request hook regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test scripts/pi/qwen-sampling.test.mjs

  argocd-structure:
    name: ArgoCD Structure Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate ArgoCD app topology
        run: bash ./scripts/validate-argocd-apps.sh

      - name: Reject inline executable YAML bodies
        run: bash ./scripts/validate-no-inline-scripts.sh

      - name: Test scoped Longhorn PV mount-option migration
        run: python3 -m unittest discover -s scripts/tests -p test_longhorn_mount_options.py -v

  temporal-release-contract:
    name: Temporal Release Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: ${{ env.KUSTOMIZE_VERSION }}
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: python3 -m pip install pyyaml
      - run: python3 -m unittest discover -s scripts/tests -p test_temporal_deployments.py -v

  truenas-csi-contract:
    name: TrueNAS CSI Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: ${{ env.KUSTOMIZE_VERSION }}

      - name: Validate official TrueNAS CSI deployment
        run: bash ./scripts/validate-truenas-csi.sh

  render-and-schema:
    name: Kustomize Render and Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: ${{ env.KUSTOMIZE_VERSION }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Render all kustomizations
        run: |
          set -euo pipefail
          # _archive/ apps are not deployed and sit one level deeper, so their ../ links do not resolve.
          mapfile -t dirs < <(find infrastructure monitoring my-apps -type f -name kustomization.yaml -not -path '*/_archive/*' -exec dirname {} \; | sort -u)

          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "No kustomization directories found."
            exit 1
          fi

          : > /tmp/all-manifests.yaml
          for dir in "${dirs[@]}"; do
            echo "Rendering ${dir}"
            rendered="$(mktemp)"
            kustomize build "${dir}" --enable-helm > "${rendered}"

            # Components intentionally build to an empty stream when rendered
            # alone. Every other kustomization is an app, base, or overlay and
            # must produce at least one Kubernetes object. This catches phantom
            # Synced/Healthy Applications such as the former empty Kafka app.
            if ! grep -q '^kind:' "${rendered}"; then
              if grep -q '^kind: Component$' "${dir}/kustomization.yaml"; then
                echo "Expected empty Component render: ${dir}"
              else
                echo "ERROR: ${dir} rendered zero Kubernetes objects"
                exit 1
              fi
            fi

            cat "${rendered}" >> /tmp/all-manifests.yaml
            rm -f "${rendered}"
            echo "---" >> /tmp/all-manifests.yaml
          done

      - name: Generate CRD schemas
        # Without these, -ignore-missing-schemas silently skips every CR whose CRD the datree catalog lacks (kopiur, longhorn, temporal...).
        # Schemas come from the rendered stream, so they track chart versions in git.
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || pip3 install --quiet pyyaml
          python3 ./scripts/generate-crd-schemas.py \
            /tmp/all-manifests.yaml /tmp/crd-schemas --min-schemas 100

      - name: Validate Kubernetes schemas
        run: |
          set -euo pipefail
          # Filter a known kubeconform false positive:
          # - Gitea Helm-rendered Service gitea-http: targetPort triggers a
          #   oneOf ambiguity in the Kubernetes Service schema.
          csplit -z -f /tmp/doc- /tmp/all-manifests.yaml '/^---$/' '{*}' > /dev/null
          : > /tmp/filtered-manifests.yaml
          for f in /tmp/doc-*; do
            if grep -q 'kind: Service' "$f" && grep -q 'name: gitea-http' "$f"; then
              continue
            fi
            cat "$f" >> /tmp/filtered-manifests.yaml
          done

          # Generated schemas first: they are the exact CRDs this repo deploys,
          # so they win over the catalog's copy where both exist.
          kubeconform \
            -summary \
            -strict \
            -ignore-missing-schemas \
            -kubernetes-version "${KUBERNETES_VERSION}" \
            -schema-location '/tmp/crd-schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/filtered-manifests.yaml

      - name: Verify CRD schema controls
        # Require a real pass and the exact timeout error; crashes/skips do not count.
        run: |
          set -euo pipefail
          schema='/tmp/crd-schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          kubeconform -strict -summary -output json -schema-location "$schema" \
            ./scripts/tests/fixtures/crd-schema-valid.yaml > /tmp/crd-valid.json
          jq -e '.summary == {valid: 1, invalid: 0, errors: 0, skipped: 0}' /tmp/crd-valid.json

          status=0
          kubeconform -strict -summary -output json -schema-location "$schema" \
            ./scripts/tests/fixtures/crd-schema-canary.yaml > /tmp/crd-canary.json || status=$?
          cat /tmp/crd-canary.json
          test "$status" -eq 1
          jq -e --arg message "additional properties 'timeout' not allowed" '
            .summary == {valid: 0, invalid: 1, errors: 0, skipped: 0} and
            (.resources | length) == 1 and
            .resources[0].status == "statusInvalid" and
            .resources[0].validationErrors == [{
              path: "/spec/hooks/beforeSnapshot/0", msg: $message
            }]
          ' /tmp/crd-canary.json

      - name: Validate kopiur backup coverage
        # Runs on the RENDERED stream (covers Helm PVCs). Fails on a backed-up PVC without dataSourceRef (recreates EMPTY in DR)
        # or a namespace without the kopiur repo label; only warns on mover securityContext and backup-exempt annotation gaps.
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || pip3 install --quiet pyyaml
          python3 ./scripts/validate-kopiur-coverage.py /tmp/all-manifests.yaml

      - name: Validate VPA policy safety and coverage
        # Uses the same aggregate render as schema validation so Helm-generated
        # workloads and operator CR targets are checked, not just raw YAML.
        run: |
          set -euo pipefail
          python3 ./scripts/validate-vpa-policies.py /tmp/all-manifests.yaml

      - name: Validate metrics discovery and capability-aware Argo render
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p test_monitoring_contract.py -v
          python3 -m unittest discover -s scripts/tests -p test_ai_observability.py -v
          python3 -m unittest discover -s my-apps/ai/presenton/scripts -p 'test_*.py' -v
          python3 -m unittest discover -s my-apps/ai/comfyui/scripts -p 'test_*.py' -v
          python3 -m unittest discover -s my-apps/personal-projects/news-reader/tests -v
          python3 -m unittest discover -s monitoring/ai-ops/_archive/holmesgpt/tests -v
          python3 -m unittest discover -s my-apps/development-infra/posthog/tests -v
          python3 -m unittest discover -s scripts/tests -p test_qwen_reasoning.py -v
          kustomize build infrastructure/controllers/argocd --enable-helm \
            --helm-kube-version "${KUBERNETES_VERSION}" \
            --helm-api-versions monitoring.coreos.com/v1 > /tmp/argocd-with-monitoring.yaml
          python3 scripts/validate-monitoring-contract.py /tmp/all-manifests.yaml \
            --argocd-capabilities /tmp/argocd-with-monitoring.yaml

  otel-collector-validate:
    name: OpenTelemetry Collector Config Validation
    # `otelcol validate` on each rendered collector config rejects pipelines that reference a removed receiver at PR time.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: ${{ env.KUSTOMIZE_VERSION }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v${{ env.HELM_VERSION }}

      - name: Validate all OpenTelemetryCollector configs
        run: bash ./scripts/validate-otel-configs.sh

  renovate-config-validate:
    name: Renovate Config Validation
    # An invalid rule (e.g. matchUpdateTypes combined with versioning) stops Renovate opening PRs repo-wide; catch it before merge.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 20 silently resolves an old Renovate that rejects `managerFilePatterns`; Renovate >=41 needs Node 22+.
          node-version: '22'

      - name: Validate Renovate config
        run: |
          set -euo pipefail
          # The validator looks at the filename to decide global vs repo
          # config; .github/renovate.json5 is treated as global, which
          # surfaces the same packageRules / managers errors we care about.
          npx --yes --package=renovate renovate-config-validator --strict .github/renovate.json5

  shellcheck:
    name: Shell Script Lint (Informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck on scripts
        run: |
          set -euo pipefail
          find infrastructure monitoring my-apps scripts -type f -name '*.sh' -not -path '*/charts/*' -print0 \
            | xargs -0 shellcheck -S warning
