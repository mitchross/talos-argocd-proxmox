name: Cluster health smoke tests
on:
  pull_request:
    paths:
      - scripts/validate-cluster-health.sh
      - scripts/tests/test_cluster_health.py
      - .github/workflows/cluster-health-tests.yml
  push:
    branches: [main]
    paths:
      - scripts/validate-cluster-health.sh
      - scripts/tests/test_cluster_health.py
      - .github/workflows/cluster-health-tests.yml
permissions:
  contents: read
jobs:
  smoke-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s scripts/tests -p test_cluster_health.py -v
      - run: shellcheck scripts/validate-cluster-health.sh
