name: Frigate go2rtc image

on:
  pull_request:
    paths:
      - '.github/workflows/frigate-go2rtc-image.yml'
      - 'my-apps/home/frigate/go2rtc-image/**'
      - 'my-apps/home/frigate/deployment.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/frigate-go2rtc-image.yml'
      - 'my-apps/home/frigate/go2rtc-image/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frigate-go2rtc-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mitchross/frigate-go2rtc
  CONTEXT: my-apps/home/frigate/go2rtc-image

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate image version
        id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          tag="$(cat "$CONTEXT/VERSION")"
          [[ "$tag" =~ ^b101-[a-f0-9]{7}-v[0-9]+$ ]]
          grep -Fq "image: $IMAGE:$tag" my-apps/home/frigate/deployment.yaml
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA:$CONTEXT/VERSION" 2>/dev/null; then
            old_tag="$(git show "$BASE_SHA:$CONTEXT/VERSION")"
            if ! git diff --quiet "$BASE_SHA" HEAD -- "$CONTEXT/Dockerfile"; then
              [[ "$old_tag" != "$tag" ]] || { echo 'Bump VERSION when changing the binary image'; exit 1; }
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve published image tags
        id: published
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'Image tag already exists; bump VERSION to publish a new binary.'
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Build and test; publish only from main
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.published.outputs.exists != 'true' }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
