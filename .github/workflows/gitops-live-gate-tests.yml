name: GitOps live prerequisite tests
on:
  pull_request:
    paths:
      - scripts/gitops-live-gate.py
      - scripts/tests/test_gitops_live_gate.py
      - .github/workflows/gitops-live-gate-tests.yml
  push:
    branches: [main]
    paths:
      - scripts/gitops-live-gate.py
      - scripts/tests/test_gitops_live_gate.py
      - .github/workflows/gitops-live-gate-tests.yml
permissions:
  contents: read
jobs:
  prerequisite-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s scripts/tests -p test_gitops_live_gate.py -v
