name: GitOps transition risk
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static-risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.8.1'
      - uses: azure/setup-helm@v4.3.1
        with:
          version: 'v4.3.0'
      - run: python3 -m pip install pyyaml
      - name: Test transition detection
        run: python3 -m unittest discover -s scripts/tests -p test_gitops_risk.py -v
      - name: Compare proposed merge tree with current main
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/gitops-risk-check.py --format json > gitops-risk.json
      - name: Show report
        if: always() && github.event_name == 'pull_request'
        run: cat gitops-risk.json
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: gitops-risk
          path: gitops-risk.json
