name: Home Assistant power tests

on:
  pull_request:
    paths:
      - my-apps/home-automation/home-assistant/**
      - .github/workflows/home-assistant-tests.yml
  push:
    branches: [main]
    paths:
      - my-apps/home-automation/home-assistant/**
      - .github/workflows/home-assistant-tests.yml

permissions:
  contents: read

jobs:
  power-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install aiohttp
      - run: python -m unittest discover -s my-apps/home-automation/home-assistant/tests -v
