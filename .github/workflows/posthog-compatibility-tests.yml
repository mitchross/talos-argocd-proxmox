name: PostHog compatibility tests

on:
  pull_request:
    paths:
      - 'my-apps/development-infra/posthog/**'
      - '.github/workflows/posthog-compatibility-tests.yml'
  push:
    branches: [main]
    paths:
      - 'my-apps/development-infra/posthog/**'
      - '.github/workflows/posthog-compatibility-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s my-apps/development-infra/posthog/tests -v
