name: vLLM model cache
on:
  pull_request:
    paths:
      - 'my-apps/ai/vllm/**'
      - 'scripts/tests/test_vllm_model_cache.py'
      - '.github/workflows/vllm-model-cache-tests.yml'
  push:
    branches: [main]
    paths:
      - 'my-apps/ai/vllm/**'
      - 'scripts/tests/test_vllm_model_cache.py'
      - '.github/workflows/vllm-model-cache-tests.yml'
permissions:
  contents: read
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s scripts/tests -p test_vllm_model_cache.py -v
