name: VPN egress tests

on:
  pull_request:
    paths:
      - infrastructure/networking/vpn-egress/**
      - .github/workflows/vpn-egress-tests.yml
  push:
    branches: [main]
    paths:
      - infrastructure/networking/vpn-egress/**
      - .github/workflows/vpn-egress-tests.yml

permissions:
  contents: read

jobs:
  controller-and-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      # gateway.sh tests mock ip, wg and curl; they need bash and jq (both on ubuntu-latest).
      - run: python -m pytest -v infrastructure/networking/vpn-egress/tests
      - run: shellcheck infrastructure/networking/vpn-egress/scripts/gateway.sh
