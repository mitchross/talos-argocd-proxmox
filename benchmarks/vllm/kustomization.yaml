apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Standalone, manual-apply-only: OUTSIDE every ArgoCD ApplicationSet scan path on purpose,
# because an immutable benchmark Job would fight ArgoCD if it were auto-discovered.
#
#   kubectl apply  -k benchmarks/vllm
#   kubectl delete -k benchmarks/vllm
#
# The `vllm` namespace already exists (owned by my-apps/ai/vllm); we only add the Job.
namespace: vllm

resources:
  - job.yaml
