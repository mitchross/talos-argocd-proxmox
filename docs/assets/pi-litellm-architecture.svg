<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">How pi's LLM traffic flows, and where it gets logged</title>
  <desc id="desc">Diagram showing pi on the workstation choosing between a direct, unlogged vLLM route and a LiteLLM-proxied route (manual model switch or the kimi-consult subagent), with LiteLLM resolving requests to either the self-hosted vLLM backend or Moonshot's Kimi K3 API and logging every proxied call to self-hosted PostHog, with secrets flowing in from 1Password.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17212b" flood-opacity="0.12"/></filter>
    <marker id="at" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#087e8b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="av" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c4fd6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#dc5f5f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="ad" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#344250" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="ay" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#c58a25" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .t{font:700 36px Inter,ui-sans-serif,system-ui,sans-serif;fill:#17212b}.st{font:400 19px Inter,ui-sans-serif,system-ui,sans-serif;fill:#586775}
      .h{font:700 21px Inter,ui-sans-serif,system-ui,sans-serif;fill:#17212b}.b{font:500 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#455563}
      .l{font:700 14px Inter,ui-sans-serif,system-ui,sans-serif}.sm{font:500 14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#586775}
      .n{font:700 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff}
      .connector{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
      .packet{stroke:#fff;stroke-width:2}
      @media (prefers-reduced-motion:reduce){.packet{display:none}}
    </style>
  </defs>
  <rect width="1600" height="860" fill="#fff"/>
  <text x="70" y="60" class="t">How pi's LLM traffic flows, and where it gets logged</text>
  <text x="70" y="94" class="st">Model selection, subagent escalation, proxy routing, and PostHog observability.</text>

  <text x="70" y="143" class="l" fill="#586775">OUTSIDE THE CLUSTER</text>
  <rect x="70" y="165" width="280" height="96" rx="7" fill="#dff4f6" stroke="#9fd3da" filter="url(#s)"/>
  <text x="210" y="201" text-anchor="middle" class="h">pi (TUI)</text><text x="210" y="229" text-anchor="middle" class="b">your workstation</text>
  <rect x="430" y="165" width="280" height="96" rx="7" fill="#fde8e8" stroke="#e4a6a6" filter="url(#s)"/>
  <text x="570" y="201" text-anchor="middle" class="h">1Password</text><text x="570" y="229" text-anchor="middle" class="b">litellm item, vault homelab-prod</text>
  <rect x="790" y="153" width="340" height="120" rx="7" fill="#fff3df" stroke="#e7b95e" filter="url(#s)"/>
  <text x="960" y="192" text-anchor="middle" class="h">Moonshot API</text>
  <text x="960" y="220" text-anchor="middle" class="b">api.moonshot.ai</text>
  <text x="960" y="245" text-anchor="middle" class="sm">external SaaS — real $ per call</text>

  <text x="150" y="303" text-anchor="middle" class="sm" fill="#087e8b">default — unlogged</text>
  <text x="620" y="288" text-anchor="middle" class="sm" fill="#7c4fd6">/model switch or kimi-consult — logged</text>
  <text x="1000" y="335" text-anchor="middle" class="sm" fill="#c58a25">$ real cost per call</text>

  <rect x="70" y="315" width="1460" height="430" rx="10" fill="#f3f6f8" stroke="#cbd6dd" stroke-width="2"/>
  <rect x="94" y="338" width="260" height="38" rx="5" fill="#344250"/>
  <text x="224" y="363" text-anchor="middle" class="n">IN THE TALOS CLUSTER</text>

  <rect x="105" y="410" width="435" height="280" rx="8" fill="#fff" stroke="#9fd3da" filter="url(#s)"/>
  <text x="322" y="452" text-anchor="middle" class="h">vLLM</text>
  <text x="322" y="479" text-anchor="middle" class="b">2x RTX 3090 · qwen3.6-27b</text>
  <rect x="140" y="520" width="365" height="80" rx="6" fill="#dff4f6"/>
  <text x="322" y="554" text-anchor="middle" class="h">GPU inference</text>
  <text x="322" y="578" text-anchor="middle" class="sm">same backend, direct or via LiteLLM</text>
  <rect x="140" y="615" width="365" height="60" rx="6" fill="#e9edf0"/>
  <text x="322" y="650" text-anchor="middle" class="b">$0 cost — self-hosted</text>

  <rect x="580" y="410" width="435" height="280" rx="8" fill="#fff" stroke="#c9b3f0" filter="url(#s)"/>
  <text x="797" y="452" text-anchor="middle" class="h">LiteLLM proxy</text>
  <text x="797" y="479" text-anchor="middle" class="b">the only box doing real work</text>
  <rect x="615" y="520" width="365" height="56" rx="6" fill="#ece3fb"/>
  <text x="797" y="553" text-anchor="middle" class="b">validates Bearer master_key</text>
  <rect x="615" y="586" width="365" height="56" rx="6" fill="#ece3fb"/>
  <text x="797" y="619" text-anchor="middle" class="b">resolves the real backend + key</text>
  <rect x="615" y="652" width="365" height="56" rx="6" fill="#ece3fb"/>
  <text x="797" y="685" text-anchor="middle" class="b">fires success/failure_callback: posthog</text>

  <rect x="1055" y="410" width="435" height="280" rx="8" fill="#fff" stroke="#87c7a3" filter="url(#s)"/>
  <text x="1272" y="452" text-anchor="middle" class="h">PostHog (self-hosted)</text>
  <text x="1272" y="479" text-anchor="middle" class="b">self-hosted event pipeline</text>
  <rect x="1090" y="520" width="365" height="56" rx="6" fill="#e1f3e8"/>
  <text x="1272" y="553" text-anchor="middle" class="b">capture endpoint</text>
  <rect x="1090" y="586" width="365" height="56" rx="6" fill="#e1f3e8"/>
  <text x="1272" y="619" text-anchor="middle" class="b">ClickHouse (event store)</text>
  <rect x="1090" y="652" width="365" height="56" rx="6" fill="#e1f3e8"/>
  <text x="1272" y="685" text-anchor="middle" class="b">Traces / Generations / Users</text>

  <path id="pi-vllm" class="connector" d="M210 261 V335 H250 V400" stroke="#70bcc4" marker-end="url(#at)"/>
  <circle class="packet" r="6" fill="#087e8b" opacity="0"><set attributeName="opacity" to="1" begin=".01s" fill="freeze"/><animateMotion dur="2.4s" repeatCount="indefinite" begin="-.2s"><mpath href="#pi-vllm"/></animateMotion></circle>

  <path id="pi-litellm" class="connector" d="M290 261 V300 H700 V400" stroke="#a98ee0" marker-end="url(#av)"/>
  <circle class="packet" r="6" fill="#7c4fd6" opacity="0"><set attributeName="opacity" to="1" begin=".01s" fill="freeze"/><animateMotion dur="2.4s" repeatCount="indefinite" begin="-.6s"><mpath href="#pi-litellm"/></animateMotion></circle>

  <path id="op-litellm" class="connector" d="M570 261 V330 H900 V400" stroke="#dc8c8c" marker-end="url(#ar)"/>
  <circle class="packet" r="6" fill="#dc5f5f" opacity="0"><set attributeName="opacity" to="1" begin=".01s" fill="freeze"/><animateMotion dur="2.4s" repeatCount="indefinite" begin="-1s"><mpath href="#op-litellm"/></animateMotion></circle>

  <path id="litellm-moonshot" class="connector" d="M955 410 V273" stroke="#d8ad55" marker-end="url(#ay)"/>
  <circle class="packet" r="6" fill="#c58a25" opacity="0"><set attributeName="opacity" to="1" begin=".01s" fill="freeze"/><animateMotion dur="3.2s" repeatCount="indefinite" begin="-.5s"><mpath href="#litellm-moonshot"/></animateMotion></circle>

  <path id="litellm-vllm" class="connector" d="M580 553 H540" stroke="#7b8995" marker-end="url(#ad)"/>
  <circle class="packet" r="5" fill="#344250" opacity="0"><set attributeName="opacity" to="1" begin=".01s" fill="freeze"/><animateMotion dur="1.4s" repeatCount="indefinite" begin="-1.1s"><mpath href="#litellm-vllm"/></animateMotion></circle>

  <path id="litellm-posthog" class="connector" d="M1015 619 H1055" stroke="#7b8995" marker-end="url(#ad)"/>
  <circle class="packet" r="5" fill="#344250" opacity="0"><set attributeName="opacity" to="1" begin=".01s" fill="freeze"/><animateMotion dur="1.4s" repeatCount="indefinite" begin="-.3s"><mpath href="#litellm-posthog"/></animateMotion></circle>

  <rect x="70" y="770" width="1460" height="52" rx="6" fill="#17212b"/>
  <text x="800" y="803" text-anchor="middle" style="font:600 17px Inter,ui-sans-serif,system-ui,sans-serif;fill:#fff">Only requests through LiteLLM get logged to PostHog — the direct vanillax-vllm path is free but invisible to it.</text>
</svg>
