<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="100%" style="max-width: 820px; background-color: white;" role="img" aria-labelledby="pnl-title" aria-describedby="pnl-desc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" xml:space="preserve">
  <title id="pnl-title">What survives a cluster nuke and rebuilds it</title>
  <desc id="pnl-desc">The cluster and everything in it dies on a nuke. Three things survive off-cluster: the Git repo, Kopia snapshots in RustFS S3, and 1Password. Git rebuilds every object, the snapshots refill every disk, and 1Password recreates every secret in the new cluster, with no manual steps.</desc>
  <defs>
    <marker id="pnl-ar" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#087e8b" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="320" fill="#ffffff"/>

  <!-- old cluster (dies) -->
  <rect x="20" y="60" width="200" height="180" rx="10" fill="#fbe9e5" stroke="#dd8371" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="120" y="46" text-anchor="middle" fill="#c24d3e" font-size="11" font-weight="700" letter-spacing="1.5">DIES ON NUKE</text>
  <text x="120" y="95" text-anchor="middle" fill="#17212b" font-size="15" font-weight="600">The cluster</text>
  <text x="120" y="126" text-anchor="middle" fill="#52616d" font-size="12.5">every pod &amp; object</text>
  <text x="120" y="148" text-anchor="middle" fill="#52616d" font-size="12.5">every Longhorn disk</text>
  <text x="120" y="170" text-anchor="middle" fill="#52616d" font-size="12.5">the databases</text>
  <line x1="55" y1="205" x2="185" y2="221" stroke="#c24d3e" stroke-width="2" stroke-linecap="round"/>
  <line x1="185" y1="205" x2="55" y2="221" stroke="#c24d3e" stroke-width="2" stroke-linecap="round"/>

  <!-- survivors -->
  <text x="410" y="46" text-anchor="middle" fill="#a8771c" font-size="11" font-weight="700" letter-spacing="1.5">SURVIVES · OFF-CLUSTER</text>
  <rect x="310" y="60" width="200" height="52" rx="8" fill="#e1f3e8" stroke="#7bc397" stroke-width="1.5"/>
  <text x="410" y="82" text-anchor="middle" fill="#17212b" font-size="13.5" font-weight="600">Git repo</text>
  <text x="410" y="100" text-anchor="middle" fill="#52616d" font-size="11.5">every manifest, the whole design</text>

  <rect x="310" y="124" width="200" height="52" rx="8" fill="#fff3df" stroke="#d8ad55" stroke-width="1.5"/>
  <text x="410" y="146" text-anchor="middle" fill="#17212b" font-size="13.5" font-weight="600">RustFS S3 · Kopia</text>
  <text x="410" y="164" text-anchor="middle" fill="#52616d" font-size="11.5">hourly snapshots — your data</text>

  <rect x="310" y="188" width="200" height="52" rx="8" fill="#fff3df" stroke="#d8ad55" stroke-width="1.5"/>
  <text x="410" y="210" text-anchor="middle" fill="#17212b" font-size="13.5" font-weight="600">1Password</text>
  <text x="410" y="228" text-anchor="middle" fill="#52616d" font-size="11.5">every secret &amp; password</text>

  <!-- new cluster -->
  <rect x="620" y="92" width="180" height="116" rx="10" fill="#e1f3e8" stroke="#7bc397" stroke-width="2"/>
  <text x="710" y="46" text-anchor="middle" fill="#2e7d4f" font-size="11" font-weight="700" letter-spacing="1.5">REBUILT</text>
  <text x="710" y="138" text-anchor="middle" fill="#17212b" font-size="15" font-weight="600">New cluster</text>
  <text x="710" y="162" text-anchor="middle" fill="#52616d" font-size="12.5">same apps, same data</text>

  <!-- arrows survivors -> new cluster -->
  <path d="M514 86 C570 86 580 112 616 118" fill="none" stroke="#087e8b" stroke-width="2" marker-end="url(#pnl-ar)"/>
  <path d="M514 150 H616" fill="none" stroke="#087e8b" stroke-width="2" marker-end="url(#pnl-ar)"/>
  <path d="M514 214 C570 214 580 188 616 182" fill="none" stroke="#087e8b" stroke-width="2" marker-end="url(#pnl-ar)"/>
  <text x="562" y="76" text-anchor="middle" fill="#087e8b" font-size="11.5" font-weight="600">rebuilds objects</text>
  <text x="562" y="142" text-anchor="middle" fill="#087e8b" font-size="11.5" font-weight="600">refills disks</text>
  <text x="562" y="240" text-anchor="middle" fill="#087e8b" font-size="11.5" font-weight="600">recreates secrets</text>

  <text x="120" y="286" text-anchor="middle" fill="#52616d" font-size="12">nothing in here is precious</text>
  <text x="710" y="286" text-anchor="middle" fill="#52616d" font-size="12">no manual steps in between</text>
</svg>
