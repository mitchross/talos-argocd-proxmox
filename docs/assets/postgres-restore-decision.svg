<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="100%" style="max-width: 820px; background-color: white;" role="img" aria-labelledby="prd-title" aria-describedby="prd-desc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" xml:space="preserve">
  <title id="prd-title">The three outcomes when a backed-up PVC is created</title>
  <desc id="prd-desc">When a PVC is created there are exactly three outcomes. If a snapshot exists and the repository is reachable, the disk fills from the newest snapshot and then binds with data — the normal path. If the repository is unreachable, the disk waits Pending and retries, and never binds empty — the safe failure. A brand-new database with no snapshot yet binds empty once, then hourly backups begin and it is protected forever.</desc>
  <defs>
    <marker id="prd-g" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#2e7d4f" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="prd-w" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#7a868a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="prd-m" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#52616d" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="300" fill="#ffffff"/>

  <rect x="30" y="110" width="170" height="80" rx="8" fill="#dff4f6" stroke="#70bcc4" stroke-width="1.5"/>
  <text x="115" y="143" text-anchor="middle" fill="#17212b" font-size="14" font-weight="600">PVC created</text>
  <text x="115" y="165" text-anchor="middle" fill="#52616d" font-size="12">(rebuild or rollback)</text>

  <path d="M204 128 C260 100 280 66 336 56" fill="none" stroke="#2e7d4f" stroke-width="2" marker-end="url(#prd-g)"/>
  <path d="M204 150 H336" fill="none" stroke="#7a868a" stroke-width="2" marker-end="url(#prd-w)"/>
  <path d="M204 172 C260 200 280 234 336 244" fill="none" stroke="#52616d" stroke-width="2" marker-end="url(#prd-m)"/>

  <text x="268" y="86" text-anchor="middle" fill="#2e7d4f" font-size="11.5" font-weight="600">snapshot exists</text>
  <text x="268" y="140" text-anchor="middle" fill="#7a868a" font-size="11.5" font-weight="600">S3 unreachable</text>
  <text x="268" y="226" text-anchor="middle" fill="#52616d" font-size="11.5" font-weight="600">brand-new DB</text>

  <rect x="340" y="20" width="450" height="72" rx="8" fill="#e1f3e8" stroke="#7bc397" stroke-width="1.5"/>
  <text x="360" y="48" fill="#2e7d4f" font-size="11" font-weight="700" letter-spacing="1">THE NORMAL PATH</text>
  <text x="360" y="70" fill="#17212b" font-size="13.5" font-weight="600">Fills from the newest snapshot → binds WITH data</text>

  <rect x="340" y="114" width="450" height="72" rx="8" fill="#f3f6f8" stroke="#cbd6dd" stroke-width="1.5"/>
  <text x="360" y="142" fill="#7a868a" font-size="11" font-weight="700" letter-spacing="1">THE SAFE FAILURE</text>
  <text x="360" y="164" fill="#17212b" font-size="13.5" font-weight="600">Waits Pending + retries — never binds empty</text>

  <rect x="340" y="208" width="450" height="72" rx="8" fill="#ffffff" stroke="#cbd6dd" stroke-width="1.5"/>
  <text x="360" y="236" fill="#52616d" font-size="11" font-weight="700" letter-spacing="1">FIRST DEPLOY ONLY</text>
  <text x="360" y="258" fill="#17212b" font-size="13.5" font-weight="600">Binds empty once → hourly backups begin → protected forever</text>
</svg>
