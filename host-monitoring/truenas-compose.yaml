services:
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.13.1@sha256:011e2d12c5bff759b90804bda642664775d7b4b127bf5148539bb82d3f590bb7
    network_mode: host
    pid: host
    restart: unless-stopped
    read_only: true
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - --web.listen-address=192.168.10.133:9100
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.udev.data=/host/run/udev/data
      - --no-collector.textfile
    volumes:
      - /:/host:ro,rslave
  smartctl-exporter:
    image: docker.io/prometheuscommunity/smartctl-exporter:v0.15.0@sha256:a76e08dbf5db4781fefd1ed81c65ad46ae8d2849dae6b6d3acebcde2fc4e59d6
    network_mode: host
    pid: host
    restart: unless-stopped
    user: "0:0"
    privileged: true
    read_only: true
    mem_limit: 256m
    command:
      - --web.listen-address=192.168.10.133:9633
      - --smartctl.interval=60s
      - --smartctl.rescan=5m
      - --smartctl.powermode-check=standby
    volumes:
      # Mount live /dev at /dev: a container-created device list can retain removed drives.
      - /dev:/dev:ro,rslave
      - /sys:/sys:ro
      - /run/udev:/run/udev:ro
