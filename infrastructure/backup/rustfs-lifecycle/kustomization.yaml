apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rustfs-lifecycle
resources:
  - namespace.yaml
  - externalsecret.yaml
  - postgres-backups-lifecycle-job.yaml

# The generator's name-suffix hash is load-bearing: a new CM name forces ArgoCD to recreate
# the hook Job, so it mounts the updated lifecycle.json instead of racing a stale CM.
configMapGenerator:
  - name: postgres-backups-lifecycle
    files:
      - lifecycle.json
  - name: postgres-backups-lifecycle-scripts
    files:
      - scripts/apply-postgres-backups-lifecycle.sh
