connect:
  # Every ExternalSecret resolves through this; a single replica parked on the shed node stalled refresh cluster-wide.
  replicas: 2
  # `preferred`, not `required`: a required rule would wedge the 2nd replica
  # Pending forever if the cluster ever drops to one worker.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app: onepassword-connect
            topologyKey: kubernetes.io/hostname
  api:
    enabled: true
    resources:
      requests:
        memory: "150Mi"
        cpu: "100m"
      limits:
        memory: "300Mi"
  sync:
    enabled: true 
    resources:
      requests:
        memory: "150Mi"
        cpu: "100m"
      limits:
        memory: "300Mi"
  
  # This is the correct parameter for the credentials secret name
  credentialsName: "1password-credentials"    # Instead of credentialsSecret
  credentialsKey: "1password-credentials.json"

operator:
  create: true
  # Operator stays at 1 — do NOT scale with connect: the chart has no leader election, so a 2nd replica races the first.
  token:
    name: "1password-operator-token"    # This sets the secret name for the operator token
    key: "token"                        # The key within the secret
  resources:
    requests:
      memory: "150Mi"
      cpu: "100m"
    limits:
      memory: "300Mi"
  autoRestart: true
  pollingInterval: 300