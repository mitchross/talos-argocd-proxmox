apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: database
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  # Render each generated Application with Go templates. In an expression such
  # as `{{ .path.basename }}`, the leading `.` means "the current generator
  # result" (the template context). The Git generator supplies its matched
  # directory as the `path` object: `.path.basename` is the final directory
  # name, while `.path.path` is the complete repository-relative path.
  # Example: `infrastructure/database/redis/redis-instance` produces
  # `.path.basename = redis-instance` and `.path.path` equal to that full
  # path, so the generated Application is named `database-redis-instance` and
  # renders manifests from that directory.
  # `missingkey=error` stops generation when a field is absent instead of
  # silently creating an Application with an empty name, path, or namespace.
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  # Preserve skip-reconcile annotation during DR recovery
  # Without this, the ApplicationSet controller strips manual annotations
  ignoreApplicationDifferences:
  - jsonPointers:
    - /metadata/annotations/argocd.argoproj.io~1skip-reconcile
    # Immutable-dataSourceRef escape hatch (VolSync-era, redis-instance):
    # preserve a manual ServerSideDiff=false annotation while its Bound PVC
    # still carries the old immutable dataSourceRef. Removable once that PVC
    # is recreated without it (redis is backup-exempt going forward).
    - /metadata/annotations/argocd.argoproj.io~1compare-options
  generators:
  - git:
      repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
      revision: main
      directories:
      - path: infrastructure/database/*/*
  template:
    metadata:
      name: 'database-{{ .path.basename }}'
      annotations:
        argocd.argoproj.io/manifest-generate-paths: '{{ .path.path }}'
        argocd.argoproj.io/sync-wave: "4"
      labels:
        app.kubernetes.io/part-of: database
    spec:
      project: infrastructure
      revisionHistoryLimit: 3
      source:
        repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .path.basename }}'
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: false
          allowEmpty: false
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - RespectIgnoreDifferences=true
        - FailOnSharedResource=true
        retry:
          # Bounded retry — see root.yaml. Unbounded -1 plus a misbehaving
          # PreSync hook can wedge the entire app-of-apps behind a stale
          # manifest snapshot (incidents 2026-04-20, 2026-05-01).
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 10m
      ignoreDifferences:
      - group: ""
        kind: PersistentVolumeClaim
        jsonPointers:
        - /spec/dataSource
        - /spec/dataSourceRef
        - /spec/volumeName
