apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: infrastructure
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  # The Git generator supplies .path.basename for the app name and .path.path for its manifest directory.
  # Domain prefixes distinguish app names; missingkey=error rejects incomplete generator results.
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  # No resources-finalizer on generated apps: if a path drops out of the generator (move race,
  # typo) only the Application is removed and re-adopted; workloads and PVCs keep running.
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
  - git:
      repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
      revision: main
      directories:
      # cert-manager has a wave-1 Application; listing it here would double-manage it.
      - path: infrastructure/networking/external-dns
      - path: infrastructure/networking/cloudflared
      - path: infrastructure/networking/gateway
      - path: infrastructure/gpu/gpu-priority-classes
      # The gpu-operator chart owns the device plugin; Talos extensions supply the CDI driver/toolkit.
      - path: infrastructure/gpu/nvidia-gpu-operator
      - path: infrastructure/gpu/intel-gpu-plugin
      - path: infrastructure/scheduling/node-feature-discovery
      - path: infrastructure/scheduling/metrics-server
      - path: infrastructure/scheduling/descheduler
      # KEDA and Temporal use standalone wave-4 apps to avoid an AppSet render-cache loop.
      # OTEL has a wave-6 app so Collector health cannot gate workload discovery.
      - path: infrastructure/platform/container-registry
      - path: infrastructure/storage/csi-driver-nfs
      - path: infrastructure/storage/csi-driver-smb
      # Official TrueNAS CSI: dynamic RWX NFS only for the initial canary.
      # Longhorn stays default; static/pre-existing NFS stays on nfs.csi.k8s.io.
      - path: infrastructure/storage/truenas-csi
      - path: infrastructure/storage/local-storage
      - path: infrastructure/storage/talos-fstrim
      - path: infrastructure/storage/longhorn-selinux
      # Longhorn and snapshot-controller have wave-1 apps so storage precedes the wave-2 kopiur operator.
      - path: infrastructure/backup/rustfs-lifecycle
  template:
    metadata:
      name: 'infrastructure-{{ .path.basename }}'
      annotations:
        argocd.argoproj.io/manifest-generate-paths: '{{ .path.path }}'
        argocd.argoproj.io/sync-wave: "4"
      labels:
        app.kubernetes.io/part-of: infrastructure
    spec:
      project: infrastructure
      revisionHistoryLimit: 3
      source:
        repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .path.basename }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - RespectIgnoreDifferences=true
        - FailOnSharedResource=true
        retry:
          # Bound retries so stuck hooks cannot hold the app tree on stale manifests indefinitely.
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 10m
      ignoreDifferences:
      - group: ""
        kind: PersistentVolumeClaim
        jsonPointers:
        - /spec/dataSource
        - /spec/dataSourceRef
        - /spec/volumeName
