apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  # Git generator: `.path.basename` = last dir name (app name + namespace), `.path.path` = repo-relative path.
  # missingkey=error fails generation instead of silently creating an Application with an empty name/path/namespace.
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
  - git:
      repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
      revision: main
      directories:
      # cert-manager is a standalone Wave-1 app (core-dependencies/cert-manager-app.yaml) — do NOT re-add it here or it is double-managed.
      - path: infrastructure/controllers/external-dns
      - path: infrastructure/controllers/gpu-priority-classes
      - path: infrastructure/controllers/node-feature-discovery
      # No nvidia-device-plugin: on Talos 1.13 the gpu-operator chart owns the device plugin over the CDI driver/toolkit system extensions.
      - path: infrastructure/controllers/nvidia-gpu-operator
      - path: infrastructure/controllers/metrics-server
      # keda + temporal-worker-controller (Wave 4) and opentelemetry-operator (Wave 5) are standalone apps, NOT listed here:
      # adding generator paths via this AppSet hit a repo-server render-cache loop that kept reverting them.
      - path: infrastructure/networking/cloudflared
      - path: infrastructure/networking/gateway
      - path: infrastructure/storage/container-registry
      - path: infrastructure/storage/csi-driver-nfs
      - path: infrastructure/storage/csi-driver-smb
      # Official TrueNAS CSI: dynamic RWX NFS only for the initial canary.
      # Longhorn stays default; static/pre-existing NFS stays on nfs.csi.k8s.io.
      - path: infrastructure/storage/truenas-csi
      - path: infrastructure/storage/local-storage
      - path: infrastructure/storage/talos-fstrim
      # longhorn and snapshot-controller are standalone Wave-1 apps so storage is healthy before the kopiur operator (Wave 2).
      - path: infrastructure/storage/rustfs-lifecycle
  template:
    metadata:
      name: 'infrastructure-{{ .path.basename }}'
      annotations:
        argocd.argoproj.io/manifest-generate-paths: '{{ .path.path }}'
        argocd.argoproj.io/sync-wave: "4"
      labels:
        app.kubernetes.io/part-of: infrastructure
    spec:
      project: infrastructure
      revisionHistoryLimit: 3
      source:
        repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .path.basename }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - RespectIgnoreDifferences=true
        - FailOnSharedResource=true
        retry:
          # Bounded retry — see root.yaml. Unbounded -1 plus a misbehaving PreSync hook wedges the app-of-apps.
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 10m
      ignoreDifferences:
      - group: ""
        kind: PersistentVolumeClaim
        jsonPointers:
        - /spec/dataSource
        - /spec/dataSourceRef
        - /spec/volumeName
