apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: monitoring
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  # The Git generator supplies .path.basename for the app name and .path.path for its manifest directory.
  # missingkey=error rejects incomplete generator results instead of creating malformed Applications.
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  # No resources-finalizer on generated apps: if a path drops out of the generator (move race,
  # typo) only the Application is removed and re-adopted; workloads and PVCs keep running.
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
  - git:
      repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
      revision: main
      directories:
      # monitoring/<type>/<app> (metrics, logs, tracing); the app name uses only the last folder.
      - path: monitoring/*/*
      - path: monitoring/*/_archive
        exclude: true
  template:
    metadata:
      name: 'monitoring-{{ .path.basename }}'
      labels:
        app.kubernetes.io/part-of: monitoring
      annotations:
        argocd.argoproj.io/manifest-generate-paths: '{{ .path.path }}'
        argocd.argoproj.io/sync-wave: "5"
    spec:
      project: monitoring
      revisionHistoryLimit: 3
      source:
        repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .path.basename }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - RespectIgnoreDifferences=true
        - FailOnSharedResource=true
        retry:
          # Bound retries so stuck hooks cannot hold the app tree on stale manifests indefinitely.
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 10m
      info:
      - name: 'Description'
        value: 'Monitoring component: {{ .path.basename }}'
