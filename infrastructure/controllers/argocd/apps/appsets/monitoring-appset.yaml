apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  # Git generator: `.path.basename` = last dir name (app name + namespace), `.path.path` = repo-relative path.
  # missingkey=error fails generation instead of silently creating an Application with an empty name/path/namespace.
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
  - git:
      repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
      revision: main
      directories:
      - path: monitoring/*
  template:
    metadata:
      name: 'monitoring-{{ .path.basename }}'
      annotations:
        argocd.argoproj.io/manifest-generate-paths: '{{ .path.path }}'
        argocd.argoproj.io/sync-wave: "5"
    spec:
      project: monitoring
      revisionHistoryLimit: 3
      source:
        repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .path.basename }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - RespectIgnoreDifferences=true
        - FailOnSharedResource=true
        retry:
          # Bounded retry — see root.yaml. Unbounded -1 plus a misbehaving PreSync hook wedges the app-of-apps.
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 10m
      info:
      - name: 'Description'
        value: 'Monitoring component: {{ .path.basename }}'
