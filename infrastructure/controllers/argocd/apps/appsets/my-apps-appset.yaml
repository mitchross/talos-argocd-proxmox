apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: my-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: applications
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  # The Git generator supplies .path.basename for the app name and .path.path for its manifest directory.
  # missingkey=error rejects incomplete generator results instead of creating malformed Applications.
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  # Preserve per-app diff overrides while bound PVCs retain immutable dataSourceRef values that differ from Git.
  ignoreApplicationDifferences:
  - jsonPointers:
    - /metadata/annotations/argocd.argoproj.io~1compare-options
  generators:
  - git:
      repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
      revision: main
      directories:
      # project-nomad is intentionally one bundled app at my-apps/knowledge/project-nomad.
      # Its child folders are resources, not generated apps.
      - path: my-apps/*/*
      # Components render empty alone; exclude them to avoid phantom Synced/Healthy Applications.
      - path: my-apps/common/*
        exclude: true
      # `_archive/` parks retired apps: excluded, so Argo prunes them; kopiur keeps their backups (repo onNamespaceDelete: Orphan).
      - path: my-apps/*/_archive
        exclude: true
      # Strimzi lives here as a dev tool but is deployed by custom-entrypoints/strimzi-app.yaml (wave 4, namespace kafka).
      - path: my-apps/development/strimzi
        exclude: true
  template:
    metadata:
      name: 'my-apps-{{ .path.basename }}'
      labels:
        app.kubernetes.io/part-of: applications
        platform.vanillax.dev/category: '{{ index .path.segments 1 }}'
      annotations:
        argocd.argoproj.io/manifest-generate-paths: '{{ .path.path }}'
        argocd.argoproj.io/sync-wave: "6"
        # Use client-side diff: SSA dry-runs reject immutable dataSourceRef changes on bound PVCs.
        # The PVC ignore rules below mask this drift until claims are recreated.
        argocd.argoproj.io/compare-options: ServerSideDiff=false
    spec:
      project: my-apps
      revisionHistoryLimit: 3
      source:
        repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .path.basename }}'
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - RespectIgnoreDifferences=true
        - FailOnSharedResource=true
        retry:
          # Bound retries so stuck hooks cannot hold the app tree on stale manifests indefinitely.
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 10m
      ignoreDifferences:
      # App-level PVC ignores are required by RespectIgnoreDifferences during sync; global diff ignores alone are insufficient.
      - group: ""
        kind: PersistentVolumeClaim
        jsonPointers:
        - /spec/dataSource
        - /spec/dataSourceRef
        - /spec/volumeName
      # imagePullPolicy may differ from Git due to previous Kyverno admission mutation
      - group: apps
        kind: StatefulSet
        jqPathExpressions:
        - .spec.template.spec.containers[].imagePullPolicy
        - .spec.template.spec.initContainers[].imagePullPolicy
        - .spec.volumeClaimTemplates[].apiVersion
        - .spec.volumeClaimTemplates[].kind
      # kopiur controller defaults these spec fields after apply → cosmetic
      # OutOfSync on every backed-up app. Ignore only the defaulted fields.
      - group: kopiur.home-operations.com
        kind: SnapshotPolicy
        jsonPointers:
        - /spec/defaultDeletionPolicy
        - /spec/groupBy
        jqPathExpressions:
        - .spec.sources[].sourcePathStrategy
        - .spec.sources[].readOnly

      info:
      - name: 'Description'
        value: 'Application: {{ .path.basename }}'
