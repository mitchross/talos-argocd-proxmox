apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: my-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  # Git generator: `.path.basename` = last dir name (app name + namespace), `.path.path` = repo-relative path.
  # missingkey=error fails generation instead of silently creating an Application with an empty name/path/namespace.
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  # Preserve per-app compare-options while any Bound PVC still carries an older immutable dataSourceRef than git.
  ignoreApplicationDifferences:
  - jsonPointers:
    - /metadata/annotations/argocd.argoproj.io~1compare-options
  generators:
  - git:
      repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
      revision: main
      directories:
      # project-nomad is intentionally one bundled app at my-apps/home/project-nomad.
      # Its child folders are resources, not generated apps.
      - path: my-apps/*/*
      # my-apps/common/* are Kustomize Components (empty render) — without this exclude the generator creates
      # phantom zero-resource Applications. Guarded by validate-argocd-apps.sh Check 8.
      - path: my-apps/common/*
        exclude: true
  template:
    metadata:
      name: 'my-apps-{{ .path.basename }}'
      annotations:
        argocd.argoproj.io/manifest-generate-paths: '{{ .path.path }}'
        argocd.argoproj.io/sync-wave: "6"
        # ServerSideDiff=false: the SSA dry-run on a Bound PVC whose immutable dataSourceRef differs from git is
        # rejected ("spec is immutable") → ComparisonError. Client-side diff + the PVC ignoreDifferences below avoid it.
        argocd.argoproj.io/compare-options: ServerSideDiff=false
    spec:
      project: my-apps
      revisionHistoryLimit: 3
      source:
        repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .path.basename }}'
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - RespectIgnoreDifferences=true
        - FailOnSharedResource=true
        retry:
          # Bounded retry — see root.yaml. Unbounded -1 plus a misbehaving PreSync hook wedges the app-of-apps.
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 10m
      ignoreDifferences:
      # Global PVC ignores don't suffice: RespectIgnoreDifferences=true only honors APP-level rules at sync time;
      # without these, immutable restore fields retry forever on Bound PVCs.
      - group: ""
        kind: PersistentVolumeClaim
        jsonPointers:
        - /spec/dataSource
        - /spec/dataSourceRef
        - /spec/volumeName
      # imagePullPolicy may differ from Git due to previous Kyverno admission mutation
      - group: apps
        kind: StatefulSet
        jqPathExpressions:
        - .spec.template.spec.containers[].imagePullPolicy
        - .spec.template.spec.initContainers[].imagePullPolicy
        - .spec.volumeClaimTemplates[].apiVersion
        - .spec.volumeClaimTemplates[].kind
      # kopiur controller defaults these spec fields after apply → cosmetic
      # OutOfSync on every backed-up app. Ignore only the defaulted fields.
      - group: kopiur.home-operations.com
        kind: SnapshotPolicy
        jsonPointers:
        - /spec/defaultDeletionPolicy
        - /spec/groupBy
        jqPathExpressions:
        - .spec.sources[].sourcePathStrategy
        - .spec.sources[].readOnly

      info:
      - name: 'Description'
        value: 'Application: {{ .path.basename }}'
