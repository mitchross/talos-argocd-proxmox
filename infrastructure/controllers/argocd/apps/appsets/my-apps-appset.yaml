apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: my-apps
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: applications
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  # Render each generated Application with Go templates. In an expression such
  # as `{{ .path.basename }}`, the leading `.` means "the current generator
  # result" (the template context). The Git generator supplies its matched
  # directory as the `path` object: `.path.basename` is the final directory
  # name, while `.path.path` is the complete repository-relative path.
  # Example: `my-apps/knowledge/karakeep` produces `.path.basename = karakeep` and
  # `.path.path = my-apps/knowledge/karakeep`, so Argo creates Application
  # `my-apps-karakeep` in namespace `karakeep` and renders that exact folder.
  # `missingkey=error` stops generation when a field is absent instead of
  # silently creating an Application with an empty name, path, or namespace.
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
  - git:
      repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
      revision: main
      directories:
      - path: my-apps/*/*
      # my-apps/common/* holds shared Kustomize Components (kind: Component),
      # consumed via `components:` from app kustomizations — they are not apps.
      # kustomize (5.4+) builds a Component directory as an EMPTY render, so
      # without this exclude the generator creates a phantom zero-resource
      # Application (e.g. my-apps-kopiur-backup, Synced/Healthy, manages
      # nothing). Guarded by validate-argocd-apps.sh Check 8.
      - path: my-apps/common/*
        exclude: true
      # `_archive/` parks retired apps: excluded, so Argo prunes them; kopiur keeps their backups (repo onNamespaceDelete: Orphan).
      - path: my-apps/*/_archive
        exclude: true
  template:
    metadata:
      name: 'my-apps-{{ .path.basename }}'
      labels:
        app.kubernetes.io/part-of: applications
        platform.vanillax.dev/category: '{{ index .path.segments 1 }}'
      annotations:
        argocd.argoproj.io/manifest-generate-paths: '{{ .path.path }}'
        argocd.argoproj.io/sync-wave: "6"
        # Server-side diff, so a field deleted from Git is removed live.
        # With SSA and the old client-side diff, removed fields never showed
        # as a diff and stayed live while the app read Synced (2026-11-06:
        # strata kept reverted env vars for 6 h).
        # Before a kopiur dataSourceRef repoint (live PVC differs from Git
        # in an immutable field), the SSA dry-run fails with "spec is
        # immutable". In that PR, switch just that app off with
        #   ServerSideDiff={{ if eq .path.basename "APP" }}false{{ else }}true{{ end }}
        # and drop the condition once the PVC is recreated.
        argocd.argoproj.io/compare-options: ServerSideDiff=true
    spec:
      project: my-apps
      revisionHistoryLimit: 3
      source:
        repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .path.basename }}'
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        # No RespectIgnoreDifferences here. On Argo v3.6.1 it rewrites every
        # resource from live before applying, even with no ignore rule for it,
        # so HTTPRoute rule edits never reached live (argo-cd#26588, fix
        # pending in #30675). Tested 2026-11-05: a sync without it applied the
        # stuck deal-scout route at once.
        # ApplyOutOfSyncOnly keeps the one job it did for us: a PVC whose only
        # drift is an ignored restore field counts as Synced, so it is never
        # re-applied and never hits "spec is immutable".
        - ApplyOutOfSyncOnly=true
        - FailOnSharedResource=true
        retry:
          # Bounded retry — see root.yaml. Unbounded -1 plus a misbehaving
          # PreSync hook can wedge the entire app-of-apps behind a stale
          # manifest snapshot (incidents 2026-04-20, 2026-05-01). selfHeal: true
          # kicks a fresh sync against current git on the next reconcile.
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 10m
      ignoreDifferences:
      # PVC restore diff noise is ignored globally; HTTPRoute/ExternalSecret list defaults live in Git.
      # These PVC ignores keep Bound PVCs Synced, so ApplyOutOfSyncOnly skips
      # them; otherwise immutable restore fields keep retrying forever.
      - group: ""
        kind: PersistentVolumeClaim
        jsonPointers:
        - /spec/dataSource
        - /spec/dataSourceRef
        - /spec/volumeName
      # imagePullPolicy may differ from Git due to previous Kyverno admission mutation
      - group: apps
        kind: StatefulSet
        jqPathExpressions:
        - .spec.template.spec.containers[].imagePullPolicy
        - .spec.template.spec.initContainers[].imagePullPolicy
        - .spec.volumeClaimTemplates[].apiVersion
        - .spec.volumeClaimTemplates[].kind
      # kopiur controller defaults these spec fields after apply → cosmetic
      # OutOfSync on every backed-up app. Ignore only the defaulted fields.
      # Never ignore a path inside a list (`.spec.sources[].*`): with
      # RespectIgnoreDifferences (still on in other appsets) Argo CD swaps Git's whole list for live's
      # (argo-cd#26588, #25284). sourcePathStrategy/readOnly are set in my-apps/common/kopiur-backup.
      - group: kopiur.home-operations.com
        kind: SnapshotPolicy
        jsonPointers:
        - /spec/defaultDeletionPolicy
        - /spec/groupBy

      info:
      - name: 'Description'
        value: 'Application: {{ .path.basename }}'
