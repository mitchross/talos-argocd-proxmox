# Argo CD CRDs are versioned with the RC runtime instead of the stable Helm
# chart. Fresh bootstrap seeds these same CRDs before Argo starts; this
# Application then adopts and self-heals them from the pinned upstream tag.
#
# Intentionally uses the default project: it exists before projects.yaml and
# permits this pinned upstream source during bootstrap. No resources finalizer:
# deleting this Application must never cascade-delete the Argo CD CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/manifest-generate-paths: manifests/crds
  labels:
    app.kubernetes.io/part-of: infrastructure
spec:
  project: default
  revisionHistoryLimit: 3
  source:
    repoURL: https://github.com/argoproj/argo-cd.git
    targetRevision: v3.6.0-rc1
    path: manifests/crds
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - ServerSideApply=true
    - FailOnSharedResource=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
