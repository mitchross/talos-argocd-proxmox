# Kustomize renders the OCI chart from helmCharts; includeCRDs installs the backup CRDs with the operator.
# The operator and populator must be healthy before later apps create restore PVCs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kopiur-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/manifest-generate-paths: infrastructure/backup/kopiur-operator
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
    targetRevision: main
    path: infrastructure/backup/kopiur-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: kopiur-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # required — renders large CRDs without the 256KB annotation limit
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
