# Critical: Longhorn must be deployed after Cilium (wave 1)
# Storage layer depends on networking being fully operational
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/manifest-generate-paths: infrastructure/storage/longhorn
  labels:
    app.kubernetes.io/part-of: infrastructure
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
    targetRevision: main
    path: infrastructure/storage/longhorn
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      # Bounded retry — see root.yaml. Unbounded -1 plus a misbehaving PreSync hook wedges the app-of-apps.
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
  # Do NOT add a blanket `ConfigMap /data` or `Setting /value` ignore: with RespectIgnoreDifferences=true ArgoCD
  # stops APPLYING the field, making every Longhorn defaultSettings value in git decorative while still Synced.
  ignoreDifferences:
  - group: ""
    kind: Secret
    jsonPointers:
    - /data
