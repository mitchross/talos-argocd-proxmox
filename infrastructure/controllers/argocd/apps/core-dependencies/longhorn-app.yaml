# Critical: Longhorn must be deployed after Cilium (wave 1)
# Storage layer depends on networking being fully operational
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/manifest-generate-paths: infrastructure/storage/longhorn
  labels:
    app.kubernetes.io/part-of: infrastructure
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
    targetRevision: main
    path: infrastructure/storage/longhorn
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      # Bounded retry — see root.yaml. Unbounded -1 plus a misbehaving
      # PreSync hook can wedge the entire app-of-apps behind a stale
      # manifest snapshot (incidents 2026-04-20, 2026-05-01). selfHeal: true
      # kicks a fresh sync against current git on the next reconcile.
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
  # Longhorn health checks ensure storage is ready before
  # other applications that need PVCs can be deployed
  # Do NOT re-add a blanket `ConfigMap /data` or `Setting /value` ignore here.
  # With RespectIgnoreDifferences=true those don't just hide a diff, they stop
  # ArgoCD APPLYING the field — and settings reach Longhorn only via
  #   values.yaml defaultSettings -> longhorn-default-setting ConfigMap
  #     -> Longhorn's ConfigMap controller -> Setting CRs
  # so ignoring either end made every Longhorn setting in git decorative. The
  # cluster ran storage-over-provisioning at 600 while git said 200/300 and
  # ArgoCD still reported Synced.
  ignoreDifferences:
  - group: ""
    kind: Secret
    jsonPointers:
    - /data
