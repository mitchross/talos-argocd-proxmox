# Standalone Application avoids the infrastructure AppSet render-cache revert loop.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/manifest-generate-paths: infrastructure/scheduling/keda
  labels:
    app.kubernetes.io/part-of: infrastructure
spec:
  project: infrastructure
  revisionHistoryLimit: 3
  source:
    repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
    targetRevision: main
    path: infrastructure/scheduling/keda
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # KEDA core excludes monitoring CRs; keda-observability installs them after Prometheus CRDs exist.
      - RespectIgnoreDifferences=true
      - Replace=false
    retry:
      # Bound retries so stuck hooks cannot hold the app tree on stale manifests indefinitely.
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 10m
