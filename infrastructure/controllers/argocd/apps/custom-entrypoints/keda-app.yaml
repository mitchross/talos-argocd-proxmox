# Standalone (not via the infrastructure AppSet): adding AppSet generator paths hit a repo-server render-cache loop.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/manifest-generate-paths: infrastructure/controllers/keda
  labels:
    app.kubernetes.io/part-of: infrastructure
spec:
  project: infrastructure
  revisionHistoryLimit: 3
  source:
    repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
    targetRevision: main
    path: infrastructure/controllers/keda
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # KEDA core renders ZERO monitoring.coreos.com resources (SMs live in keda-observability) — no SkipDryRunOnMissingResource needed.
      - RespectIgnoreDifferences=true
      - Replace=false
    retry:
      # Bounded retry — see root.yaml. Unbounded -1 plus a misbehaving PreSync hook wedges the app-of-apps.
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 10m
