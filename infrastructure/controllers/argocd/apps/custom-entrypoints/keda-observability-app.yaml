# ServiceMonitors split out of the KEDA core app (Wave 4): monitoring.coreos.com CRDs don't exist until
# kube-prometheus-stack (Wave 5), so these sync at Wave 6. Core apps must never render monitoring CRs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda-observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/manifest-generate-paths: infrastructure/controllers/keda-observability
  labels:
    app.kubernetes.io/part-of: infrastructure
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
    targetRevision: main
    path: infrastructure/controllers/keda-observability
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=false
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    # Observability-only escape hatch: if monitoring CRDs are momentarily absent
    # this app still syncs without wedging. Core apps must NEVER rely on this.
    - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
