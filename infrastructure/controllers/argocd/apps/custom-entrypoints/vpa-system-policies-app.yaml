apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Keep the historical Application identity and reconcile it before the
  # monitoring (wave 5) and user-app (wave 6) owners. This makes the one-PR
  # handoff deterministic: the old owner prunes before new owners adopt.
  # PostHog policies remain here while that Application is sync-blocked.
  name: vpa-recommendations
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/manifest-generate-paths: infrastructure/controllers/vpa-system-policies
  labels:
    app.kubernetes.io/part-of: infrastructure
spec:
  project: infrastructure
  revisionHistoryLimit: 3
  source:
    repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
    targetRevision: main
    path: infrastructure/controllers/vpa-system-policies
  destination:
    server: https://kubernetes.default.svc
    namespace: vertical-pod-autoscaler
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
      - Replace=false
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 10m
