# Merge only webhook.github.secret into the Helm-owned argocd-secret.
# Its value must match the GitHub webhook HMAC secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-github-webhook-secret
  namespace: argocd
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: webhook.github.secret
      remoteRef:
        key: argocd-github-webhook
        property: secret
