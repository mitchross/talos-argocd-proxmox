# GitHub -> ArgoCD push-webhook secret (1Password homelab-prod / argocd-github-webhook, field `secret`); without it Argo only sees pushes via the 3-min poll.
# creationPolicy: Merge — ESO adds only the `webhook.github.secret` key to the Helm-owned argocd-secret; Helm keeps everything else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-github-webhook-secret
  namespace: argocd
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: webhook.github.secret
      remoteRef:
        key: argocd-github-webhook
        property: secret
