apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - ns.yaml
  - externalsecret-webhook.yaml
  # http-route.yaml lives in infrastructure/networking/gateway/ (wave 4): listed here at wave 0 it deadlocks bootstrap with no Gateway.
  # root.yaml is NOT listed: bootstrap-applied once by scripts/bootstrap-argocd.sh; listing it creates a circular SSA-ownership / cascade-delete hazard.
helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: "10.4.0" # Pinned chart; appVersion v3.5.1
    releaseName: argocd
    namespace: argocd
    valuesFile: values.yaml
    includeCRDs: true
