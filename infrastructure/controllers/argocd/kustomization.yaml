apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - ns.yaml
  - externalsecret-webhook.yaml
  # HTTPRoute lives with the wave-4 Gateway to avoid blocking wave-0 bootstrap.
  # root.yaml is applied by scripts/bootstrap-argocd.sh; including it here creates circular ownership.
helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: "10.9.2"
    releaseName: argocd
    namespace: argocd
    valuesFile: values.yaml
    includeCRDs: true
