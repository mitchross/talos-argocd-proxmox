apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  annotations:
    # Cache hint: without this, any commit anywhere in the repo re-renders the root app-of-apps tree.
    argocd.argoproj.io/manifest-generate-paths: infrastructure/controllers/argocd/apps
    # Must stay client-side diff: the SSA dry-run rejects child Application/ApplicationSet objects on required
    # status fields → root wedges in ComparisonError. ignoreDifferences on /status does NOT help.
    argocd.argoproj.io/compare-options: ServerSideDiff=false
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  # MUST stay `default`: the named AppProjects are created BY this app via projects.yaml,
  # so pointing root at one of them deadlocks a fresh bootstrap.
  project: default
  source:
    repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
    path: infrastructure/controllers/argocd/apps
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      # Bounded retry: an unbounded -1 op holds a frozen manifest snapshot forever and wedges every new push
      # behind it; with a limit the op fails and selfHeal starts a FRESH op against current git.
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: argoproj.io
    kind: Application
    jsonPointers:
    - /status
    - /operation
  - group: argoproj.io
    kind: ApplicationSet
    jsonPointers:
    - /status
