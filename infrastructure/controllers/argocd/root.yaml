apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  annotations:
    # Only apps/ changes invalidate the root manifest cache.
    argocd.argoproj.io/manifest-generate-paths: .
    # Use client-side diff: SSA dry-runs of child Applications can fail CRD status validation.
    # Ignoring /status does not bypass that API validation.
    argocd.argoproj.io/compare-options: ServerSideDiff=false
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  # Root must use the built-in default project: it creates the named projects itself.
  project: default
  source:
    repoURL: https://github.com/mitchross/talos-argocd-proxmox.git
    path: infrastructure/controllers/argocd/apps
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      # Retry count is not a deadline; controller.sync.timeout.seconds bounds operation age.
      # This seed is applied at bootstrap, not reconciled by the root app itself.
      refresh: true
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: argoproj.io
    kind: Application
    jsonPointers:
    - /status
    - /operation
  - group: argoproj.io
    kind: ApplicationSet
    jsonPointers:
    - /status
