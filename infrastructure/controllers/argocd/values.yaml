# ConfigMaps and feature flags
configs:
  params:
    server.insecure: "true"
    # Performance: increase parallel status checks (default 20, ~1 per 20 apps)
    controller.status.processors: "50"
    # Performance: increase concurrent sync operations (default 10)
    controller.operation.processors: "25"
    # Bound the whole sync operation, including retries and health waits; polling is separate.
    controller.sync.timeout.seconds: "1800"
    # Performance: limit concurrent manifest generations to prevent OOM
    reposerver.parallelism.limit: "5"
    # Limit stale manifest-cache entries to 1h; see argoproj/argo-cd#26530.
    reposerver.repo.cache.expiration: "1h"
    # Performance: increase repo-server timeout for large Helm charts like prometheus-stack
    controller.repo.server.timeout.seconds: "300"
    # Server-side diff applies CRD defaults before comparison; this key belongs in configs.params, not configs.cm.
    controller.diff.server.side: "true"
  cm:
    url: "https://argocd.vanillax.me"
    # Langfuse declares an EndpointSlice for RustFS; excluding it leaves S3 without a backend.
    resource.exclusions: |
      - apiGroups:
        - ''
        kinds:
        - Endpoints
      - apiGroups:
        - coordination.k8s.io
        kinds:
        - Lease
      - apiGroups:
        - authentication.k8s.io
        - authorization.k8s.io
        kinds:
        - SelfSubjectReview
        - TokenReview
        - LocalSubjectAccessReview
        - SelfSubjectAccessReview
        - SelfSubjectRulesReview
        - SubjectAccessReview
      - apiGroups:
        - certificates.k8s.io
        kinds:
        - CertificateSigningRequest
      - apiGroups:
        - cert-manager.io
        kinds:
        - CertificateRequest
      - apiGroups:
        - cilium.io
        kinds:
        - CiliumIdentity
        - CiliumEndpoint
        - CiliumEndpointSlice
      - apiGroups:
        - kyverno.io
        - reports.kyverno.io
        - wgpolicyk8s.io
        kinds:
        - PolicyReport
        - ClusterPolicyReport
        - EphemeralReport
        - ClusterEphemeralReport
        - AdmissionReport
        - ClusterAdmissionReport
        - BackgroundScanReport
        - ClusterBackgroundScanReport
        - UpdateRequest
    # Keep Helm inflation enabled and retain the default load restrictor.
    kustomize.buildOptions: "--enable-helm"
    # Keep a tracking label as well as the annotation to tolerate operator reconciliation.
    application.resourceTrackingMethod: "annotation+label"
    timeout.reconciliation: "180s"
    timeout.reconciliation.jitter: "60s"
    # Hard refresh expires manifest and live-state caches; self-heal cannot fix drift hidden by stale comparisons.
    # Keep a bounded refresh interval; raise it only if repo-server load requires it.
    timeout.hard.reconciliation: "15m"
    # Ignore only defaulted parentRef group/kind; ignoring entire refs would silently suppress Gateway re-parenting.
    resource.customizations.ignoreDifferences.gateway.networking.k8s.io_HTTPRoute: |
      jqPathExpressions:
      - .spec.parentRefs[].group
      - .spec.parentRefs[].kind
      - .spec.rules[].backendRefs[].group
      - .spec.rules[].backendRefs[].kind
      - .spec.rules[].backendRefs[].weight
    resource.customizations.ignoreDifferences.external-secrets.io_ExternalSecret: |
      jqPathExpressions:
      - .metadata.generation
      - .metadata.finalizers
      - .spec.data[].remoteRef.conversionStrategy
      - .spec.data[].remoteRef.decodingStrategy
      - .spec.data[].remoteRef.metadataPolicy
      - .spec.data[].remoteRef.nullBytePolicy
      - .spec.target.deletionPolicy
    resource.customizations.ignoreDifferences._PersistentVolumeClaim: |
      jqPathExpressions:
      - .spec.dataSourceRef
      - .spec.dataSource
      - .spec.volumeName
    # CRDs — K8s API server adds conversion and generation fields
    # NOTE: .status ignored globally by ArgoCD 3.0+ (PR #22230)
    resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
      jqPathExpressions:
      - .metadata.generation
      - .spec.conversion
    # OpenTelemetry operator mutates collector after creation
    resource.customizations.ignoreDifferences.opentelemetry.io_OpenTelemetryCollector: |
      jqPathExpressions:
      - .metadata.generation
      - .metadata.annotations
    # Secrets managed by cert-manager/webhooks — caBundle and cert data change
    resource.customizations.ignoreDifferences.all: |
      managedFieldsManagers:
      - kube-controller-manager
      - kube-scheduler
    # Argo passes the live resource as obj; Lua returns hs.status and hs.message.
    # Propagate child Application health: Progressing holds the next sync wave, Healthy releases it.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
    # Kafka has no built-in Argo health check; gate wave-1 topics on the wave-0 broker becoming ready.
    resource.customizations.health.kafka.strimzi.io_Kafka: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Waiting for Strimzi reconciliation"
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, c in ipairs(obj.status.conditions) do
          if c.type == "Ready" and c.status == "True" then
            hs.status = "Healthy"
            hs.message = c.message or "Kafka is ready"
            return hs
          elseif c.type == "NotReady" and c.status == "True" then
            hs.status = "Degraded"
            hs.message = c.message or c.reason or "Kafka is not ready"
            return hs
          end
        end
      end
      return hs
    # Report current-generation rollout failures, including failed candidate gate workflows.
    resource.customizations.health.temporal.io_WorkerDeployment: |
      local hs = {status = "Progressing", message = "Waiting for Temporal WorkerDeployment reconciliation"}
      if obj.status == nil then return hs end
      local generation = obj.metadata and obj.metadata.generation
      if generation ~= nil and obj.status.observedGeneration ~= generation then
        hs.message = "Waiting for controller to observe the new generation"
        return hs
      end
      local ready = nil
      local progressing = nil
      for _, c in ipairs(obj.status.conditions or {}) do
        if generation == nil or c.observedGeneration == generation then
          if c.type == "Ready" then ready = c end
          if c.type == "Progressing" then progressing = c end
        end
      end
      if ready ~= nil and ready.status == "True" then
        return {status = "Healthy", message = ready.message or ready.reason}
      end
      local target = obj.status.targetVersion or {}
      for _, gate in ipairs(target.testWorkflows or {}) do
        if gate.status == "Failed" or gate.status == "Canceled" or gate.status == "Terminated" or gate.status == "TimedOut" then
          return {status = "Degraded", message = "Candidate gate " .. (gate.workflowID or "unknown") .. ": " .. gate.status}
        end
      end
      if progressing ~= nil and progressing.status == "False" and progressing.reason ~= "RolloutComplete" then
        return {status = "Degraded", message = progressing.message or progressing.reason}
      end
      local errors = {
        ConnectionNotFound = true, ClusterConnectionUnsupported = true,
        AuthSecretInvalid = true, TemporalClientCreationFailed = true,
        TemporalStateFetchFailed = true, PlanGenerationFailed = true,
        PlanExecutionFailed = true, InvalidSpec = true
      }
      if ready ~= nil then
        hs.message = ready.message or ready.reason or hs.message
        if ready.status == "False" and errors[ready.reason] then hs.status = "Degraded" end
      elseif progressing ~= nil then
        hs.message = progressing.message or progressing.reason or hs.message
      end
      return hs
# Argo CD server settings
server:
  # One schedulable worker / one physical failure domain: extra replicas do
  # not add availability. Revisit when workers span multiple hosts.
  replicas: 1
  env:
    - name: ARGOCD_GRPC_MAX_SIZE_MB
      value: "200"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
  resources:
    requests:
      cpu: 50m
      memory: 512Mi  # Increased from 256Mi (was below VPA lowerBound)
    limits:
      memory: 1Gi
# ApplicationSet controller settings
applicationSet:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
  resources:
    requests:
      cpu: 100m  # 2x VPA target for safety margin
      memory: 128Mi
    limits:
      memory: 512Mi  # Reduced from 1Gi
# Enable redis-ha only with at least three schedulable nodes across real failure domains.
redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
# Argo CD controller settings
controller:
  env:
    # Performance: increase K8s API client throughput
    - name: ARGOCD_K8S_CLIENT_QPS
      value: "50"
    - name: ARGOCD_K8S_CLIENT_BURST
      value: "100"
    # Performance: split large app trees across Redis keys
    - name: ARGOCD_APPLICATION_TREE_SHARD_SIZE
      value: "100"
    # Keep GOMEMLIMIT near 90% of the container memory limit to trigger GC before OOM.
    - name: GOMEMLIMIT
      value: "5500MiB"
  metrics:
    enabled: true
    applicationLabels:
      enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
  resources:
    requests:
      cpu: 2000m
      memory: 4Gi   # Increased from 1536Mi (was below VPA lowerBound)
    limits:
      memory: 6Gi   # Increased from 4Gi to accommodate memory growth
# Argo CD repo-server settings
repoServer:
  # One schedulable worker today; scale with real worker failure domains.
  replicas: 1
  env:
    - name: ARGOCD_EXEC_TIMEOUT
      value: "3m"
    # Keep GOMEMLIMIT near 90% of the container memory limit to trigger GC before OOM.
    - name: GOMEMLIMIT
      value: "3600MiB"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
  resources:
    requests:
      cpu: 1000m   # low steady reservation; bursts to 4000m on big renders
      memory: 768Mi  # Reduced from 1Gi (VPA target only 523Mi)
    limits:
      memory: 4Gi  # Keep at 4Gi (VPA upperBound: 3.95Gi for large Helm charts)
# Dex is disabled. Argo CD is exposed only through the internal Gateway and
# intentionally uses local admin authentication in this single-operator lab.
dex:
  enabled: false
notifications:
  # No triggers, subscriptions, or delivery services are configured. Enable
  # this only when a concrete notification destination is added.
  enabled: false
# The Redis secret-init hook can wedge sync tracking; keep it disabled while using the existing auth Secret.
redisSecretInit:
  enabled: false
