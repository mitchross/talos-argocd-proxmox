# Add leader election namespace to prevent RBAC permissions errors
global:
  leaderElection:
    # This should be the same namespace cert-manager is installed into
    namespace: cert-manager
crds:
  enabled: true
  keep: true
# Use the modern, structured configuration for controller settings
config:
  apiVersion: controller.config.cert-manager.io/v1alpha1
  kind: ControllerConfiguration
  enableGatewayAPI: true
# extraArgs can still be used for flags not available in the structured config
extraArgs:
  # "--enable-gateway-api" has been moved to the 'config' block above
  - "--dns01-recursive-nameservers-only"
  # Firewalla intercepts plain DNS, including queries sent to public resolver
  # IPs. DoH keeps split-horizon DNS from hiding public ACME TXT records.
  - "--dns01-recursive-nameservers=https://cloudflare-dns.com/dns-query"
  - "--dns01-check-retry-period=10s"
  - "--max-concurrent-challenges=60"
  - "--enable-certificate-owner-ref=true"
# Pin to the control plane: the failurePolicy=Fail webhook must stay reachable node-locally from the API server.
# NEVER remove the toleration: control plane nodes carry a NoSchedule taint.
nodeSelector:
  kubernetes.io/os: linux
  node-role.kubernetes.io/control-plane: ""
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

# Security context for improved container security - This section is well-configured
securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  seccompProfile:
    type: RuntimeDefault
# Resource limits for production workloads - This section is well-configured
resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 20m
    memory: 128Mi
webhook:
  # The admission endpoint itself — the component that must stay reachable from
  # the API server. Same placement as the controller above.
  nodeSelector:
    kubernetes.io/os: linux
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 15m
      memory: 128Mi
cainjector:
  # cainjector populates the webhook's caBundle; a split placement would make
  # webhook readiness depend on a cross-node call again.
  nodeSelector:
    kubernetes.io/os: linux
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  resources:
    limits:
      memory: 384Mi
    requests:
      cpu: 20m
      memory: 192Mi
