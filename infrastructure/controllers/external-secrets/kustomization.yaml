apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-secrets

commonAnnotations:
  argocd.argoproj.io/sync-wave: "1"

resources:
- external-secret.yaml
- cluster-secret-store.yaml
helmCharts:
- name: external-secrets
  repo: https://charts.external-secrets.io
  version: 2.10.0
  releaseName: external-secrets
  valuesFile: values.yaml
  includeCRDs: true
# ESO CRDs (~620KB) exceed the 256KB last-applied annotation cap on client-side apply; the resource-level
# ServerSideApply=true annotation forces SSA even if Argo's per-resource manager state drifts (argo-cd#11269).
patches:
- patch: |
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: externalsecrets.external-secrets.io
      annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
        "api-approved.kubernetes.io": "unapproved, request-not-required"
        "external-secrets.io/conversion-strategy": "none"
- patch: |
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: clustersecretstores.external-secrets.io
      annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
        "api-approved.kubernetes.io": "unapproved, request-not-required"
        "external-secrets.io/conversion-strategy": "none"
- patch: |
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: secretstores.external-secrets.io
      annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
- patch: |
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: clusterexternalsecrets.external-secrets.io
      annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
- patch: |
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: pushsecrets.external-secrets.io
      annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
- patch: |
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: clusterpushsecrets.external-secrets.io
      annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
- patch: |
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: clustergenerators.generators.external-secrets.io
      annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
- patch: |
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: generatorstates.generators.external-secrets.io
      annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
