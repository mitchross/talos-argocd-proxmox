# KEDA: Temporal workers scale on task-queue depth via the Temporal scaler, not CPU/memory.

# cert-manager for webhook certs: the default cert-gen hook Job deadlocks under ArgoCD (SA deleted before it runs).
certificates:
  autoGenerated: false
  certManager:
    enabled: true
    generateCA: true

operator:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

metricsServer:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

webhooks:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

# Metrics services stay ON; ServiceMonitors stay OFF here — the monitoring.coreos.com CRDs don't exist until wave 5.
# They live in keda-observability (wave 6). Do NOT re-enable these here.
prometheus:
  metricServer:
    enabled: true
    serviceMonitor:
      enabled: false
  operator:
    enabled: true
    serviceMonitor:
      enabled: false
  webhooks:
    enabled: true
    serviceMonitor:
      enabled: false
