apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Do NOT add a top-level `namespace:` transformer: the MutatingAdmissionPolicy kinds below are
# cluster-scoped and unknown to the kubectl-bundled Kustomize schema.

resources:
  # kopiur has no mover node affinity; restrict staged-PVC movers to workers that actually have Longhorn disks.
  - mover-storage-node-policy.yaml
  # Longhorn's CSI attacher Deployment is created dynamically, so its pods are patched at admission.
  - longhorn-csi-attacher-retry-policy.yaml

# OCI chart rendered locally like every other chart here — no AppProject sourceRepos exception needed.
helmCharts:
  - name: kopiur
    repo: oci://ghcr.io/home-operations/charts
    # renovate: datasource=docker depName=ghcr.io/home-operations/charts/kopiur
    # Chart version == app version. Pre-1.0: re-verify the 8 CRDs on every bump.
    version: 0.10.7
    releaseName: kopiur
    namespace: kopiur-system
    # NEVER remove includeCRDs: true — it IS the CRD lifecycle here (helm doesn't manage crds/ on upgrade).
    includeCRDs: true
    valuesFile: values.yaml
    # Chart kubeVersion floor is >=1.32; without this, helm templates with default capabilities (v1.31) and the render fails.
    # Keep loosely in step with the real cluster version (omni/cluster-template/cluster-template.yaml).
    kubeVersion: "1.36.3"

# Upstream RBAC gap: kopiur-mover gets `*/status` but not the parent resources, so movers 403 and a
# Restore sits in "Restoring" with no status. Drop once upstream fixes it.
patches:
  - target:
      kind: ClusterRole
      name: kopiur-mover
    patch: |-
      - op: add
        path: /rules/-
        value:
          apiGroups: ["kopiur.home-operations.com"]
          resources:
            - snapshots
            - restores
            - repositories
            - clusterrepositories
            - maintenances
            - snapshotpolicies
            - repositoryreplications
          verbs: ["get"]
