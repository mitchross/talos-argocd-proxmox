# Longhorn V1 clone PVCs bind before they're attachable; the attacher's 5-min max backoff makes a done kopiur backup look stuck.
# Longhorn creates the attacher Deployment dynamically, so mutate its pods at admission. longhorn/longhorn#13335
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: longhorn-csi-attacher-retry.vanillax.dev
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: longhorn-csi-attacher
      expression: >-
        object.metadata.namespace == "longhorn-system" &&
        has(object.metadata.labels) &&
        "app" in object.metadata.labels &&
        object.metadata.labels["app"] == "csi-attacher" &&
        object.spec.containers.size() > 0 &&
        object.spec.containers[0].name == "csi-attacher"
    - name: retry-ceiling-not-already-set
      expression: >-
        !object.spec.containers[0].args.exists(a,
          a.startsWith("--retry-interval-max="))
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [JSONPatch{
            op: "add",
            path: "/spec/containers/0/args/-",
            value: "--retry-interval-max=30s"
          }]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: longhorn-csi-attacher-retry.vanillax.dev
spec:
  policyName: longhorn-csi-attacher-retry.vanillax.dev
