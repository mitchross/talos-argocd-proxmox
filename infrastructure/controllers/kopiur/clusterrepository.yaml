# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
# Endpoint is the bare host:port of the S3 API (:30292, NOT the console :30293); cluster-scoped secretRefs MUST carry a namespace.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: cluster-kopia
spec:
  backend:
    s3:
      bucket: kopiur
      prefix: "" # dedicated bucket — kopia repo lives at the bucket root
      endpoint: 192.168.10.133:30292
      region: us-east-1
      tls:
        disableTls: true # RustFS is plain HTTP — confirmed vs s3-minio-http.yaml
      auth:
        secretRef:
          name: kopiur-rustfs
          namespace: kopiur-system
  encryption:
    passwordSecretRef:
      name: kopiur-rustfs
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  create:
    enabled: true
  parameters:
    epoch:
      # Compaction trails two epochs behind; at kopia's 24h default this repo's index blobs only ever grow.
      minDuration: 6h
  # Opening this repo takes ~90s (index-blob merge); the 120s default deadline kills the connect,
  # marks the repo Degraded, and Degraded blocks the very maintenance that would compact the index.
  bootstrap:
    failurePolicy:
      activeDeadlineSeconds: 600
  # No credentialProjection: the ClusterExternalSecret fans kopiur-rustfs into every consumer namespace.
  allowedNamespaces:
    # The same label drives the ESO cred fanout (externalsecret.yaml) — onboarding an app = one namespace label.
    # kopiur-system must carry it too, else the managed Maintenance CR hits webhook tenancy_denied.
    selector:
      matchLabels:
        kopiur.home-operations.com/repo: cluster-kopia
