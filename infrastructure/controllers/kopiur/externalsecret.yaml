# Fans `kopiur-rustfs` into every namespace labeled kopiur.home-operations.com/repo=cluster-kopia (kopiur-system + consumers).
# No credentialProjection (needs cluster-wide secrets RBAC): Secret name and keys MUST match the ClusterRepository's secretRefs.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: kopiur-rustfs
spec:
  externalSecretName: kopiur-rustfs
  refreshTime: 1m
  namespaceSelector:
    matchLabels:
      kopiur.home-operations.com/repo: cluster-kopia
  externalSecretSpec:
    refreshInterval: 1m
    secretStoreRef:
      kind: ClusterSecretStore
      name: 1password
    target:
      name: kopiur-rustfs
      creationPolicy: Owner
      template:
        engineVersion: v2
        data:
          KOPIA_PASSWORD: "{{ .password }}"
          AWS_ACCESS_KEY_ID: "{{ .accessKey }}"
          AWS_SECRET_ACCESS_KEY: "{{ .secretKey }}"
    data:
      - secretKey: password
        remoteRef:
          key: rustfs
          property: kopia_password
      - secretKey: accessKey
        remoteRef:
          key: rustfs
          property: rustfs-workload-access-key
      - secretKey: secretKey
        remoteRef:
          key: rustfs
          property: rustfs-workload-secret-key
