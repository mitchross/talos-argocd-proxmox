# Coral USB TPU -> feature.node.kubernetes.io/custom-usb.coral-tpu=true.
# Both vendor IDs are needed: 18d1 = normal mode, 1a6e = DFU/bootloader mode.
apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: coral-tpu-rule
spec:
  rules:
  - name: "google-coral-usb"
    labels:
      "custom-usb.coral-tpu": "true"
    matchFeatures:
    - feature: usb.device
      matchExpressions:
        vendor:
          op: In
          value:
          - "18d1"
          - "1a6e"
