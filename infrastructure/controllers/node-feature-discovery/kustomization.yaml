apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ns.yaml
  - coral-tpu-rule.yaml
  - zigbee-dongle-rule.yaml
  - rtl-sdr-rule.yaml
# https://kubernetes-sigs.github.io/node-feature-discovery/v0.16/deployment/helm.html
helmCharts:
  - name: node-feature-discovery
    repo: https://kubernetes-sigs.github.io/node-feature-discovery/charts
    version: 0.19.0
    releaseName: nfd
    includeCRDs: true
    namespace: node-feature-discovery
    valuesInline:
      worker:
        # The shed node is tainted; without this NFD never labels its USB devices.
        tolerations:
          - key: node.vanillax.dev/link
            operator: Equal
            value: wifi
            effect: NoSchedule
        config:
          core:
            # Run NFD periodically to catch any changes
            sleepInterval: 60s
            # Explicitly enable sources for clarity
            sources: ["pci", "system", "usb", "cpu"]
          sources:
            pci:
              # Class 03 = Display controller (NVIDIA GPUs).
              deviceClassWhitelist:
                - "03"
              # This config creates the label that your workloads expect:
              # e.g. feature.node.kubernetes.io/pci-0300_10de.present
              deviceLabelFields:
                - "class"
                - "vendor"
            usb:
              # Discover USB accelerators (Coral TPU, etc.)
              # ff = vendor-specific, fe = application-specific
              deviceClassWhitelist:
                - "ff"
                - "fe"
              deviceLabelFields:
                - "class"
                - "vendor"
                - "device"
