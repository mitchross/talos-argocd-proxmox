apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gpu-operator
resources:
- namespace.yaml
- external-secret.yaml
- time-slicing-config.yaml
- powerlimit-daemonset.yaml    # Caps each GPU at 290W and reapplies after driver reloads
# cluster-policy.yaml intentionally not included — the Helm chart generates its
# own ClusterPolicy from valuesInline below. Keeping both would cause a conflict.

# Talos system extensions ship the driver + toolkit and write CDI specs; the chart manages only device plugin, GFD, validator.
helmCharts:
- name: gpu-operator
  repo: https://helm.ngc.nvidia.com/nvidia
  # renovate: datasource=helm depName=gpu-operator registryUrl=https://helm.ngc.nvidia.com/nvidia
  version: v26.7.0
  releaseName: gpu-operator
  namespace: gpu-operator
  includeCRDs: true
  valuesInline:
    operator:
      # `operator.defaultRuntime` was deprecated in gpu-operator v26.3 —
      # containerd is the only supported runtime anyway, so we don't set it.
      runtimeClass: nvidia
    # Talos system extensions own the driver + toolkit on the node.
    driver:
      enabled: false
    toolkit:
      enabled: false
    # Talos writes CDI specs to /run/cdi; `cdi.default` is deprecated in v26.3+, so only opt in here.
    cdi:
      enabled: true
    # We already run siderolabs/node-feature-discovery cluster-wide.
    nfd:
      enabled: false
    # The -production nvidia kmod extension puts driver libs at /usr/local/lib, NOT /usr/local/glibc/usr/lib;
    # the wrong path makes the validator init container mkdir on Talos' read-only rootfs (CreateContainerError).
    hostPaths:
      driverInstallDir: /usr/local/lib
    devicePlugin:
      enabled: true
      config:
        name: time-slicing-config
        default: config.yaml
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: gpu
        operator: Equal
        value: "true"
        effect: NoSchedule
    gfd:
      enabled: true
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: gpu
        operator: Equal
        value: "true"
        effect: NoSchedule
    # DCGM exporter runs standalone in monitoring/prometheus-stack; a second one collides on ServiceMonitor labels.
    dcgm:
      enabled: false
    dcgmExporter:
      enabled: false
    migManager:
      enabled: false
    validator:
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: gpu
        operator: Equal
        value: "true"
        effect: NoSchedule
    nodeStatusExporter:
      enabled: true
    daemonsets:
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: gpu
        operator: Equal
        value: "true"
        effect: NoSchedule

patches:
# The bundled CRD supports this field, but our disabled DCGM exporter does not use it and the external-schema CI catalog lags v26.7.
- target:
    kind: ClusterPolicy
    name: cluster-policy
  patch: |-
    - op: remove
      path: /spec/dcgmExporter/serviceMonitor/scrapeTimeout
