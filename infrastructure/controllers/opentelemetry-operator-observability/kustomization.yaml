# Deployed via custom-entrypoints/opentelemetry-operator-observability-app.yaml at a wave AFTER kube-prometheus-stack.
# The bootstrap OTel operator app must keep rendering ZERO monitoring.coreos.com CRs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opentelemetry
resources:
  - servicemonitor.yaml
  - collector-servicemonitor.yaml
  - collector-alerts.yaml
