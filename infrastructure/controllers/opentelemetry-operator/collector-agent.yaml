apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-agent
  namespace: opentelemetry
spec:
  mode: daemonset
  serviceAccount: otel-agent
  tolerations:
  - operator: Exists
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1Gi
  volumeMounts:
  - name: varlogpods
    mountPath: /var/log/pods
    readOnly: true
  volumes:
  - name: varlogpods
    hostPath:
      path: /var/log/pods
  env:
  - name: K8S_NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  config:
    receivers:
      # Scrape pod logs from filesystem (more reliable than K8s API)
      filelog:
        include:
        - /var/log/pods/*/*/*.log
        exclude:
        # Never feed the collectors or Loki back into Loki; backend failures otherwise amplify their own retry logs.
        - /var/log/pods/opentelemetry_*/**
        - /var/log/pods/loki-stack_*/**
        start_at: end
        retry_on_failure:
          enabled: true
        include_file_path: true
        include_file_name: false
        operators:
        # Parse CRI container log format
        - type: container
          id: container-parser
          max_log_size: 102400
        # Extract k8s metadata from file path
        - type: regex_parser
          id: extract_metadata_from_filepath
          regex: '^.*\/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_(?P<uid>[a-f0-9\-]+)\/(?P<container_name>[^\._]+)\/(?P<restart_count>\d+)\.log$'
          parse_from: attributes["log.file.path"]
        - type: move
          from: attributes.namespace
          to: resource["k8s.namespace.name"]
        - type: move
          from: attributes.pod_name
          to: resource["k8s.pod.name"]
        - type: move
          from: attributes.container_name
          to: resource["k8s.container.name"]
        - type: move
          from: attributes.uid
          to: resource["k8s.pod.uid"]
        - type: move
          from: attributes.restart_count
          to: resource["k8s.container.restart_count"]
        - type: add
          field: resource["k8s.node.name"]
          value: EXPR(env("K8S_NODE_NAME"))

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 768
        spike_limit_mib: 192
      batch:
        timeout: 5s
        send_batch_size: 1024
        send_batch_max_size: 1024

    exporters:
      # Forward application logs to the gateway
      otlp/gateway:
        endpoint: otel-gateway-collector.opentelemetry.svc.cluster.local:4317
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          max_elapsed_time: 30s
        sending_queue:
          enabled: true
          queue_size: 64

    service:
      telemetry:
        logs:
          level: warn
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, batch]
          exporters: [otlp/gateway]
