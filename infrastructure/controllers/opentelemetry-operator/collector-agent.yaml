apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-agent
  namespace: opentelemetry
spec:
  mode: daemonset
  # Allow logging updates on the remaining nodes when one of six nodes is offline.
  daemonSetUpdateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
  # The Kubernetes distribution omits tcp_log; Talos sends JSON lines to node-local loopback.
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.158.0
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  securityContext:
    runAsUser: 0
  serviceAccount: otel-agent
  tolerations:
  - operator: Exists
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1Gi
  volumeMounts:
  - name: node-log-queue
    mountPath: /var/lib/otel-node-logs
  - name: varlogpods
    mountPath: /var/log/pods
    readOnly: true
  volumes:
  - name: node-log-queue
    hostPath:
      path: /var/local/otel-node-logs
      type: DirectoryOrCreate
  - name: varlogpods
    hostPath:
      path: /var/log/pods
  env:
  - name: K8S_NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  config:
    extensions:
      file_storage/node_logs:
        directory: /var/lib/otel-node-logs
        create_directory: true
        fsync: true
        compaction:
          directory: /var/lib/otel-node-logs
          on_start: true
    receivers:
      tcp_log/talos:
        listen_address: 127.0.0.1:6050
        max_log_size: 256KiB
        max_connections: 64
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0s
        resource:
          service.name: talos-system
          host.name: EXPR(env("K8S_NODE_NAME"))
          k8s.node.name: EXPR(env("K8S_NODE_NAME"))
        operators:
        - type: json_parser
          timestamp:
            parse_from: attributes["talos-time"]
            layout_type: gotime
            layout: '2006-01-02T15:04:05.999999999Z07:00'
          severity:
            parse_from: attributes["talos-level"]
        - type: move
          from: attributes.msg
          to: body
          if: 'attributes.msg != nil'
      # Scrape pod logs from filesystem (more reliable than K8s API)
      filelog:
        include:
        - /var/log/pods/*/*/*.log
        exclude:
        # Never feed the collectors or Loki back into Loki; backend failures otherwise amplify their own retry logs.
        - /var/log/pods/opentelemetry_*/**
        - /var/log/pods/loki-stack_*/**
        start_at: end
        retry_on_failure:
          enabled: true
        include_file_path: true
        include_file_name: false
        operators:
        # Parse CRI container log format
        - type: container
          id: container-parser
          max_log_size: 102400
        # Extract k8s metadata from file path
        - type: regex_parser
          id: extract_metadata_from_filepath
          regex: '^.*\/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_(?P<uid>[a-f0-9\-]+)\/(?P<container_name>[^\._]+)\/(?P<restart_count>\d+)\.log$'
          parse_from: attributes["log.file.path"]
        - type: move
          from: attributes.namespace
          to: resource["k8s.namespace.name"]
        - type: move
          from: attributes.pod_name
          to: resource["k8s.pod.name"]
        - type: move
          from: attributes.container_name
          to: resource["k8s.container.name"]
        - type: move
          from: attributes.uid
          to: resource["k8s.pod.uid"]
        - type: move
          from: attributes.restart_count
          to: resource["k8s.container.restart_count"]
        - type: add
          field: resource["k8s.node.name"]
          value: EXPR(env("K8S_NODE_NAME"))

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 768
        spike_limit_mib: 192
      batch:
        timeout: 5s
        send_batch_size: 1024
        send_batch_max_size: 1024

    exporters:
      # Persist system logs before batching; pod logs retain their existing gateway pipeline.
      otlphttp/node_logs:
        endpoint: http://loki-gateway.loki-stack.svc.cluster.local/otlp
        headers:
          X-Scope-OrgID: "1"
        retry_on_failure:
          enabled: true
          max_elapsed_time: 0s
        sending_queue:
          storage: file_storage/node_logs
          num_consumers: 1
          sizer: bytes
          queue_size: 33554432
          block_on_overflow: true
          batch:
            flush_timeout: 1s
            min_size: 65536
            max_size: 262144
      # Forward application logs to the gateway
      otlp/gateway:
        endpoint: otel-gateway-collector.opentelemetry.svc.cluster.local:4317
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          max_elapsed_time: 30s
        sending_queue:
          enabled: true
          queue_size: 64

    service:
      extensions: [file_storage/node_logs]
      telemetry:
        logs:
          level: warn
      pipelines:
        logs/node:
          receivers: [tcp_log/talos]
          processors: [memory_limiter]
          exporters: [otlphttp/node_logs]
        logs:
          receivers: [filelog]
          processors: [memory_limiter, batch]
          exporters: [otlp/gateway]
