# Public, unauthenticated, write-only OTLP/HTTP ingest for the radar-ng mobile app; reads stay on gateway-internal.
# The backend Service otel-gateway-collector (4318) is created by the operator from OpenTelemetryCollector/otel-gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: otel-gateway
  namespace: opentelemetry
  labels:
    # external-dns filters on this label (--label-filter); without it no CNAME is created.
    external-dns: "true"
  annotations:
    # MUST sync after the collectors (wave 1): the backendRef Service only exists once the operator
    # reconciles the collector CR, so at wave 0 this route never goes Healthy and the app deadlocks.
    argocd.argoproj.io/sync-wave: "2"
    # Repo rule: set per-route so the CNAME stays pinned to the tunnel if the Gateway annotation ever moves.
    external-dns.alpha.kubernetes.io/target: vanillax.me
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-external
      namespace: gateway
      # Pin to the HTTPS listener — without sectionName the route binds the
      # plain-HTTP :80 listener too, serving OTLP ingest unencrypted.
      sectionName: https
  hostnames:
    - otel.vanillax.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/
      backendRefs:
        - group: ""
          kind: Service
          name: otel-gateway-collector
          port: 4318
          weight: 1
