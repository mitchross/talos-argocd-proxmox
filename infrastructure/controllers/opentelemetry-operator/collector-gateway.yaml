apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
  namespace: opentelemetry
spec:
  mode: deployment
  replicas: 1
  serviceAccount: otel-gateway
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
            # 4 MiB cap protects the public otel.vanillax.me endpoint from fill-storage floods; normal batches are <1 MiB.
            max_request_body_size: 4194304
            # CORS "*" is safe because the endpoint is write-only (reads are on internal Grafana); needed for Expo-web builds.
            cors:
              allowed_origins:
                - "*"
              allowed_headers:
                - "*"
              max_age: 7200

    processors:
      # MUST be first in every pipeline so backpressure happens before k8sattributes/batch allocate. Tuned for the 1Gi limit.
      memory_limiter:
        check_interval: 1s
        limit_mib: 800
        spike_limit_mib: 200

      # Enrich with Kubernetes metadata from API server
      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: false
        extract:
          metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.node.name
          - k8s.container.name
          - k8s.deployment.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.replicaset.name
          labels:
          # Distinct tag names — both previously mapped to `app`, so the
          # app.kubernetes.io/name value silently overwrote the app label.
          - tag_name: app
            key: app
            from: pod
          - tag_name: app_name
            key: app.kubernetes.io/name
            from: pod
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
        - sources:
          - from: resource_attribute
            name: k8s.pod.name
          - from: resource_attribute
            name: k8s.namespace.name

      # Set service.name from app label if not already set
      resource:
        attributes:
        - key: service.name
          from_attribute: app
          action: upsert
        - key: k8s.cluster.name
          value: talos-prod
          action: upsert

      # Batch for efficient export
      batch:
        timeout: 10s
        # Keep OTLP->Loki requests under Loki's tenant burst limit; ~6 MiB catch-up batches hit 429s.
        send_batch_size: 1024
        send_batch_max_size: 2048

    exporters:
      # Tempo - traces via OTLP gRPC
      otlp/tempo:
        endpoint: tempo.monitoring.svc.cluster.local:4317
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          max_elapsed_time: 30s
        sending_queue:
          enabled: true
          queue_size: 64

      # Loki - logs via OTLP HTTP
      otlphttp/loki:
        endpoint: http://loki-gateway.loki-stack.svc.cluster.local/otlp
        headers:
          X-Scope-OrgID: "1"
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          max_elapsed_time: 30s
        sending_queue:
          enabled: true
          queue_size: 128

    service:
      telemetry:
        logs:
          level: warn
      pipelines:
        logs:
          # Every receiver listed here must be defined under receivers: above, or the collector refuses to boot.
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [otlphttp/loki]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [otlp/tempo]
