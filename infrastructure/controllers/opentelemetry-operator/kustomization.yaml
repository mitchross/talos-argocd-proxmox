apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opentelemetry
resources:
  - ns.yaml
  - rbac.yaml
  - collector-agent.yaml
  - collector-gateway.yaml
  - collector-gateway-httproute.yaml
  - instrumentation.yaml

# Cold-start deadlock guard: the Fail webhooks register before the operator is up, so CRs applied in the same pass abort the sync forever.
# NEVER ship an operator and the CRs its own webhook admits in the same wave.
patches:
  - target:
      kind: Instrumentation
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "1"
  - target:
      kind: OpenTelemetryCollector
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "1"
helmCharts:
  - name: opentelemetry-operator
    repo: https://open-telemetry.github.io/opentelemetry-helm-charts
    version: 0.122.0
    releaseName: opentelemetry-operator
    namespace: opentelemetry
    valuesFile: values.yaml
    includeCRDs: true
