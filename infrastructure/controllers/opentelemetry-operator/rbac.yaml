---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-agent
  namespace: opentelemetry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-gateway
  namespace: opentelemetry
---
# otel-gateway: k8sattributes processor metadata enrichment
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-gateway
rules:
# k8sattributes processor
- apiGroups: [""]
  resources: ["pods", "namespaces", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-gateway
subjects:
- kind: ServiceAccount
  name: otel-gateway
  namespace: opentelemetry
roleRef:
  kind: ClusterRole
  name: otel-gateway
  apiGroup: rbac.authorization.k8s.io
