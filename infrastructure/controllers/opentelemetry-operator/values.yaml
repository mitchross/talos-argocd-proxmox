manager:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  # A chart-rendered ServiceMonitor races the kube-prometheus-stack CRD install (both wave 5) on a fresh nuke.
  # It lives in opentelemetry-operator-observability (wave 6) instead. Do NOT re-enable here.
  serviceMonitor:
    enabled: false

admissionWebhooks:
  certManager:
    enabled: true
