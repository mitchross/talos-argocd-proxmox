# Temporal Worker Controller (Public Preview): TemporalWorkerDeployment CRs automate Worker Versioning.

# cert-manager issues the webhook cert. Cluster already has cert-manager
# (wave 4) and this is the Temporal-recommended path.
certmanager:
  install: false   # we already run cert-manager cluster-wide
  enabled: true
webhookCertificate:
  certManager:
    enabled: true

# TOP-LEVEL KEYS. The chart has no `controller:` block — it reads `replicas`
# and `resources` at the root. This file used to nest both under `controller:`,
# where Helm silently ignored them: the chart default of replicas: 2 stayed in
# effect and the pods ran with the chart's resource numbers, not ours. Two
# managers is not a redundancy win here, it is the cause of the recurring
# ManagerIdentity wedge — see the note on namespace.yaml.
replicas: 1

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
