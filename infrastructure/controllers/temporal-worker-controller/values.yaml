# Temporal Worker Controller (Public Preview): TemporalWorkerDeployment CRs automate Worker Versioning.

# cert-manager issues the webhook cert. Cluster already has cert-manager
# (wave 4) and this is the Temporal-recommended path.
certmanager:
  install: false   # we already run cert-manager cluster-wide
  enabled: true
webhookCertificate:
  certManager:
    enabled: true

# Chart releases do not advance appVersion monotonically, so pin the controller independently.
image:
  # Use the upstream image again once temporalio/temporal-worker-controller#577 ships.
  repository: ghcr.io/mitchross/temporal-worker-controller
  tag: v1.10.1-inactive-1ea3da5@sha256:2d04646414a6adbf0c7a946b01128e046941cd5d07c7dd95a11c568d1950915e

# Top-level, not under `controller:` — the chart has no such key and ignores it.
# Two managers contend for the same ManagerIdentity, so keep this at 1.
replicas: 1

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
