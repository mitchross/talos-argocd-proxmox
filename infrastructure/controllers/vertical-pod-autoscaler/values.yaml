# VPA 1.7 ships InPlaceOrRecreate GA — do NOT pass --feature-gates=InPlaceOrRecreate (unknown flag now).
# certGen is a hook-style Job (broken under ArgoCD): keep it off. PDBs off: minAvailable:1 on 1 replica blocks Talos drains.

admissionController:
  enabled: true
  replicas: 1
  podDisruptionBudget:
    enabled: false
  certGen:
    enabled: false
  certManager:
    enabled: true
    createSelfSignedIssuer:
      enabled: true
  # failurePolicy stays Ignore (chart default) so a down admission controller can't deadlock scheduling.
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 512Mi

updater:
  enabled: true
  replicas: 1
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 512Mi

recommender:
  enabled: true
  replicas: 1
  podDisruptionBudget:
    enabled: false
  # Default floors (25m/250Mi PER CONTAINER) manufactured ~10Gi of phantom requests across ~80 tiny apps; keep these low.
  extraArgs:
    - --pod-recommendation-min-memory-mb=64
    - --pod-recommendation-min-cpu-millicores=15
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
