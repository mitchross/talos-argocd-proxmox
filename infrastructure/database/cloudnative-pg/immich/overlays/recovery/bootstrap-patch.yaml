apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
spec:
  bootstrap:
    recovery:
      source: immich-recovery-source
      database: immich
      owner: immich
      secret:
        name: immich-app-secret
      recoveryTarget:
        # v6 also contains a failed base-backup attempt from the empty
        # post-2026-07-29 cluster. Pin the last completed data-bearing backup
        # instead of trusting chronological "latest" selection.
        backupID: "20260728T020000"
      # No recoveryTarget → restore to latest-WAL available on S3.
      # See gitea/overlays/recovery/bootstrap-patch.yaml for rationale.
  # Plugin-shape externalClusters (replaces the deprecated in-tree
  # barmanObjectStore field on externalClusters[]; removed in CNPG 1.30.0).
  # Reuses the prod ObjectStore CR (base/objectstore.yaml) — the only thing
  # that differs from the prod path is the serverName, which selects the
  # PRIOR lineage subtree on the same RustFS bucket. Migration plan:
  # docs/plans/cnpg-plugin-migration.md.
  externalClusters:
    - name: immich-recovery-source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          # Reuse the prod ObjectStore (same bucket, same creds, same
          # endpoint). Only serverName changes between live writes and
          # recovery reads.
          barmanObjectName: immich-objectstore
          # Data-bearing recovery lineage. Base writes to fresh v9; v7 and v8
          # are empty post-rebuild lineages and must never be selected as a
          # restore source. backupID above pins the verified 2026-07-28 backup.
          serverName: immich-database-v6
