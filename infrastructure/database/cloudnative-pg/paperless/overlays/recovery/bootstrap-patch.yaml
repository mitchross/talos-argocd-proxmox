apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-database
spec:
  bootstrap:
    recovery:
      source: paperless-recovery-source
      database: paperless
      owner: paperless
      secret:
        name: paperless-app-secret
      recoveryTarget:
        # CRITICAL: v6 contains a successful 2026-07-30 backup of the empty
        # post-rebuild database (different PostgreSQL system ID). Without this
        # pin, "latest" restores that empty backup instead of the last
        # data-bearing backup from before the 2026-07-29 nuke.
        backupID: "20260728T050000"
  # Plugin-shape externalClusters (replaces the deprecated in-tree
  # barmanObjectStore field on externalClusters[]; removed in CNPG 1.30.0).
  # Reuses the prod ObjectStore CR (base/objectstore.yaml) — the only thing
  # that differs from the prod path is the serverName, which selects the
  # PRIOR lineage subtree on the same RustFS bucket. Migration plan:
  # docs/plans/cnpg-plugin-migration.md.
  externalClusters:
    - name: paperless-recovery-source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          # Reuse the prod ObjectStore (same bucket, same creds, same
          # endpoint). Only serverName changes between live writes and
          # recovery reads.
          barmanObjectName: paperless-objectstore
          # Data-bearing recovery lineage. Base writes to fresh v9; v7 and v8
          # are empty post-rebuild lineages. backupID above avoids the newer
          # empty base backup that polluted this otherwise valid v6 catalog.
          serverName: paperless-database-v6
