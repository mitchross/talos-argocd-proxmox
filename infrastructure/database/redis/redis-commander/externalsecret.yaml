apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-commander-auth
  namespace: redis
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: redis-commander-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        REDIS_HOSTS: "local:redis-master.redis-instance.svc.cluster.local:6379:0:{{ .redis_password }}"
        HTTP_PASSWORD: "{{ .redis_password }}"
  data:
    - secretKey: redis_password
      remoteRef:
        key: redis-instance
        property: password
