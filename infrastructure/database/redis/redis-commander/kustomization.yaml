apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: redis
labels:
  # includeSelectors: true == old commonLabels (labels on selectors + pod templates).
  # Keep true: live selectors are immutable; flipping forces delete/recreate.
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: redis-commander
      app.kubernetes.io/managed-by: argocd
resources:
  - namespace.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
