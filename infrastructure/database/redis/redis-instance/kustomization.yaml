apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: redis-instance
labels:
  # includeSelectors: true == old commonLabels (labels on selectors + pod templates).
  # Keep true: live selectors are immutable; flipping forces delete/recreate.
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: redis
      app.kubernetes.io/managed-by: argocd
resources:
  - namespace.yaml
  - pvc.yaml
  - externalsecret.yaml
helmCharts:
  - name: redis
    repo: oci://registry-1.docker.io/bitnamicharts
    version: 28.3.10
    releaseName: redis
    namespace: redis-instance
    includeCRDs: true
    valuesInline:
      architecture: standalone
      auth:
        enabled: true
        existingSecret: redis-auth
        existingSecretPasswordKey: redis-password
      # Disposable cache, not a system of record: keep modules but never persist AOF (a corrupt AOF tail wedges startup).
      commonConfiguration: |-
        loadmodule /opt/bitnami/redis/lib/redis/modules/redisearch.so
        loadmodule /opt/bitnami/redis/lib/redis/modules/rejson.so
        appendonly no
        save ""
      master:
        # Chart "nano" preset caps CPU at 150m and throttled a third of the time; no CPU limit.
        resourcesPreset: none
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { memory: 512Mi }
        persistence:
          enabled: true
          size: 10Gi
          storageClass: longhorn
          existingClaim: redis-master-0
        service:
          type: ClusterIP
          ports:
            redis: 6379
      metrics:
        enabled: true
        serviceMonitor:
          enabled: false
          interval: 1m
