apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: intel-npu-plugin
  namespace: intel-npu-plugin
  labels:
    app.kubernetes.io/name: intel-npu-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: intel-npu-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intel-npu-plugin
    spec:
      automountServiceAccountToken: false
      # Set by the NFD intel-npu-rule (Intel PCI class 1200). The node also needs the Talos intel-npu extension.
      nodeSelector:
        feature.node.kubernetes.io/custom-pci.intel-npu: "true"
      tolerations:
      - operator: Exists
      containers:
      - name: intel-npu-plugin
        image: intel/intel-npu-plugin:0.37.1@sha256:cdcf6f4c662c0d1ee4e3fc841a56e1a097706c880f8f98fd3ff51d7a8f02b547
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: devfs
          mountPath: /dev/accel
          readOnly: true
        - name: sysfs
          mountPath: /sys/class/accel
          readOnly: true
        - name: kubeletsockets
          mountPath: /var/lib/kubelet/device-plugins
      volumes:
      - name: devfs
        hostPath:
          path: /dev/accel
      - name: sysfs
        hostPath:
          path: /sys/class/accel
      - name: kubeletsockets
        hostPath:
          path: /var/lib/kubelet/device-plugins
