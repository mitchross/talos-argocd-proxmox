# Consumed by the GPU Operator's device plugin via devicePlugin.config.name in kustomization.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: time-slicing-config
  namespace: gpu-operator
data:
  config.yaml: |
    version: v1
    flags:
      migStrategy: "none"
      failOnInitError: false
      nvidiaDriverRoot: "/"
      plugin:
        passDeviceSpecs: true
        deviceListStrategy: "volume-mounts"
        deviceIDStrategy: "uuid"
    # No sharing.timeSlicing block on purpose: whole-card allocation so two VRAM-heavy pods never share a card and OOM.
    resources:
      nvidia.com/gpu:
        pattern: "*"
