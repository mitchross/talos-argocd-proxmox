# HTML responses pass through this proxy on their way from the external Gateway to cloudflared.
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

# Hosts that get the tracker. Umami finds each website by hostname (data-website-id="auto"),
# so a new subdomain needs no change here. 0 = analytics, API and redirect hosts, and radar.
map $host $umami_host {
    default 0;
    ingest-umami.vanillax.me 0;
    umami.vanillax.me 0;
    libreddit.vanillax.me 0;
    otel.vanillax.me 0;
    radar.vanillax.me 0;
    radar-ng-api.vanillax.me 0;
    radar-l2-shadow.vanillax.me 0;
    argocd-webhook.vanillax.me 0;
    vanillax.me 1;
    ~\.vanillax\.me$ 1;
}

map $uri $umami_path {
    default 1;
    "~*\.(js|mjs|css|png|jpe?g|gif|svg|ico|woff2?|ttf|eot|webp|avif|mp4|webm|json|xml|txt|map|wasm|pdf|zip)$" 0;
}

# Page requests go to @umami. Ask for gzip there: Anubis rejects 1 in 64 challenged
# browsers whose Accept-Encoding lacks it, and @umami unzips before tagging.
# Browser page loads only: SSE, fetch and API calls pass through untouched.
map $http_accept $umami_html {
    default 0;
    "~*text/html" 1;
}

map "$umami_host:$umami_path:$request_method:$umami_html" $umami_page {
    default 0;
    "1:1:GET:1" 1;
}

map $umami_page $umami_accept_encoding {
    default $http_accept_encoding;
    1 "gzip";
}

# Anubis sets this cookie only on its challenge page; skip it so a visit is not counted twice.
map $upstream_http_set_cookie $umami_challenge {
    default 0;
    "~techaro\.lol-anubis-cookie-verification=[^;\s]" 1;
}

# An empty search disables sub_filter, preserving headers and body on bypassed responses.
map "$umami_page:$status:$umami_challenge" $umami_search {
    default "";
    "~^1:2[0-9][0-9]:0$" "</head>";
}

# Opt a browser out with localStorage.setItem('umami.disabled', '1'); DNT browsers are skipped.
# recorder.js records only once script.js has a session, so the opt-outs cover replay too.
map $host $umami_snippet {
    default '<script defer src="https://ingest-umami.vanillax.me/script.js" data-website-id="auto" data-do-not-track="true"></script><script defer src="https://ingest-umami.vanillax.me/recorder.js" data-website-id="auto"></script><!-- Umami (injected in-cluster) --></head>';
}

# Redlib's own CSP only allows 'self'; widen it for the Umami tag. Other hosts keep their CSP.
map $host $csp_override {
    default "";
    redlib.vanillax.me "default-src 'none'; font-src 'self'; script-src 'self' blob: https://ingest-umami.vanillax.me https://static.cloudflareinsights.com; manifest-src 'self'; media-src 'self' data: blob: about:; style-src 'self' 'unsafe-inline'; base-uri 'none'; img-src 'self' data:; form-action 'self'; frame-ancestors 'none'; connect-src 'self' https://ingest-umami.vanillax.me https://cloudflareinsights.com; worker-src blob:;";
}

map $csp_override $csp_out {
    default $csp_override;
    "" $upstream_http_content_security_policy;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 0;

    # Proxy settings live at server level so both locations share them.
    proxy_ssl_server_name on;
    proxy_ssl_name $host;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding $umami_accept_encoding;
    # No buffering: SSE/streaming responses pass straight through; sub_filter still works chunk-wise.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    # Empty $csp_out adds no header, so hosts without a CSP stay without one.
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy $csp_out always;

    location / {
        error_page 418 = @umami;
        if ($umami_page) {
            return 418;
        }
        proxy_pass https://cilium-gateway-gateway-external.gateway.svc.cluster.local:443;
    }

    location @umami {
        proxy_pass https://cilium-gateway-gateway-external.gateway.svc.cluster.local:443;
        # gunzip only unzips for clients that "can't" take gzip; matching every user agent says so.
        gunzip on;
        gzip_disable ".";
        sub_filter $umami_search $umami_snippet;
        sub_filter_once on;
    }
}

# Probe on a separate port so application /healthz routes keep reaching their origin.
server {
    listen 8081;
    server_name _;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 404; }
}
