# Lets the Hermes agent read Cilium's config (MTU, tunnel, routing) for network checks; this one ConfigMap only.
# Lives here, not in my-apps/development/hermes, because that kustomization forces namespace hermes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-cilium-config-reader
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [cilium-config]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-cilium-config-reader
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: hermes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-cilium-config-reader
