---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: first-pool
  namespace: kube-system
  annotations:
    # Apply AFTER Cilium core is running to prevent IP pool disruption
    argocd.argoproj.io/sync-wave: "1"
    # Prevent unnecessary syncs that disrupt LoadBalancer IPs
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  blocks:
    - cidr: "192.168.10.32/27"
      # Reserved: .49 gateway-external, .50 gateway-internal, .52 gateway-internal-technitium.
  allowFirstLastIPs: "No"
  serviceSelector:
    matchLabels: {}
