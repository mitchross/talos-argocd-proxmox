apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# kubePrism (localhost:7445) handles control plane HA via Omni's SideroLink
# Only need service LoadBalancer resources for applications

# NOTE: Apply ip-pool.yaml and l2-policy.yaml AFTER Cilium is running
# These require Cilium CRDs to be installed first

resources:
 - ip-pool.yaml
 - l2-policy.yaml
 - policies/block-lan-access.yaml

helmCharts:
- name: cilium
  repo: https://helm.cilium.io
  # Split-xDS stale-policy replay (Envoy NACK on new stream) is unfixed in ALL 1.20.x incl.
  # rc.0 — recovery: restart cilium-agent FIRST, then that node's cilium-envoy.
  version: 1.20.1
  releaseName: cilium
  includeCRDs: true
  namespace: kube-system
  valuesFile: values.yaml

generatorOptions:
  disableNameSuffixHash: true
