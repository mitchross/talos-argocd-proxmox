apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# kubePrism (localhost:7445) handles control plane HA via Omni's SideroLink
# Only need service LoadBalancer resources for applications

# NOTE: Apply ip-pool.yaml and l2-policy.yaml AFTER Cilium is running
# These require Cilium CRDs to be installed first

resources:
 - ip-pool.yaml
 - l2-policy.yaml
 - policies/block-lan-access.yaml

helmCharts:
- name: cilium
  repo: https://helm.cilium.io
  # Never set envoy.xdsMode: split on 1.20.x — it replays stale NetworkPolicy resources and
  # NACK-wedges a node's CNI (unfixed upstream); ADS is fixed as of 1.20.1.
  version: 1.20.1
  releaseName: cilium
  includeCRDs: true
  namespace: kube-system
  valuesFile: values.yaml

generatorOptions:
  disableNameSuffixHash: true
