apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# kubePrism (localhost:7445) handles control plane HA via Omni's SideroLink
# Only need service LoadBalancer resources for applications

# NOTE: Apply ip-pool.yaml and l2-policy.yaml AFTER Cilium is running
# These require Cilium CRDs to be installed first

resources:
 - ip-pool.yaml
 - l2-policy.yaml
 - policies/block-lan-access.yaml

helmCharts:
- name: cilium
  repo: https://helm.cilium.io
  # Pinned to rc.0: 1.20.0 final split-xDS replays stale NetworkPolicy resources on new
  # streams (Envoy NACK wedged hp's CNI 2026-08-16); betting the regression landed after rc.0.
  version: 1.20.0-rc.0
  releaseName: cilium
  includeCRDs: true
  namespace: kube-system
  valuesFile: values.yaml

generatorOptions:
  disableNameSuffixHash: true
