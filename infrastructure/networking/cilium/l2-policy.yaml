---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
  namespace: kube-system
  annotations:
    # Apply AFTER Cilium core is running to prevent announcement disruption
    argocd.argoproj.io/sync-wave: "1"
    # Prevent unnecessary syncs that disrupt L2 announcements
    argocd.argoproj.io/compare-options: IgnoreExtraneous
spec:
  # CRITICAL: Enable L2 announcements for LoadBalancer IPs
  loadBalancerIPs: true

  # Matches Talos eth/ens interfaces, including eth0.
  interfaces:
    - ^(eth|ens)\d+$


  # Announce for all LoadBalancer services
  serviceSelector:
    matchLabels: {}

  # NoSchedule taints do not prevent L2 lease ownership; exclude the Wi-Fi node here.
  nodeSelector:
    matchLabels:
      node.vanillax.dev/link: wired
    matchExpressions: []
