# ARTEX runs agent commands a prompt can steer: default deny both ways, DNS only; the app adds each flow.
# Must be live before any artex pod exists: docs/domains/networking/policy.md#the-artex-namespace.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: artex-namespace-baseline
spec:
  description: "artex namespace: default deny ingress and egress, DNS to kube-dns only"
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: artex
  enableDefaultDeny:
    ingress: true
    egress: true
  # An empty rule switches ingress to default deny without allowing a peer.
  ingress:
    - {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
