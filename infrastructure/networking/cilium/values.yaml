# Cilium Helm Values for the Talos Threadripper GPU + workers production cluster
# ArgoCD Sync Wave: 0 (Foundation - must deploy before everything else)
annotations:
  argocd.argoproj.io/sync-wave: "0"

# IMPORTANT: cluster.name must match the --set cluster.name used during initial
# cilium install at bootstrap. Mismatched names break Hubble certificate SANs.
cluster:
  name: talos-threadripper-gpu-workers
  id: 2

# Kubernetes API Configuration (kubePrism via SideroLink)
k8sServiceHost: localhost
k8sServicePort: "7445"

# Kube-proxy Replacement
kubeProxyReplacement: true

# Talos-specific Security Context (required for init containers)
securityContext:
  capabilities:
    ciliumAgent:
    - CHOWN
    - KILL
    - NET_ADMIN
    - NET_RAW
    - IPC_LOCK
    - SYS_ADMIN
    - SYS_RESOURCE
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    cleanCiliumState:
    - NET_ADMIN
    - SYS_ADMIN
    - SYS_RESOURCE

# Talos-specific cgroup configuration
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

# Tunnel, not native routing: the Wi-Fi worker's media bridge drops inbound-first frames for
# unknown pod IPs, so cross-node pod traffic must stay encapsulated. UDP 8472 must pass between nodes.
routingMode: tunnel
tunnelProtocol: vxlan

# IPAM Configuration
ipam:
  mode: kubernetes

# Enable Socket-level Load Balancing (critical for pod-to-service connectivity)
socketLB:
  enabled: true
  hostNamespaceOnly: false

# Enable Bandwidth Manager for better TCP performance
bandwidthManager:
  enabled: true
  bbr: true # Enable BBR congestion control

# BPF Host Routing
bpf:
  masquerade: true
  ctTcpTimeout: 21600
  ctAnyTimeout: 3600
  # Performance: pre-allocate BPF map entries (reduces per-packet latency)
  preallocateMaps: true

# BIG TCP requires native routing — must stay off under VXLAN. Changing this
# alters pod GSO sizes; existing pods need a restart to pick it up.
enableIPv4BIGTCP: false

# One agent at a time: the chart default of 2 could restart two of the three
# nodes' agents simultaneously.
updateStrategy:
  rollingUpdate:
    maxUnavailable: 1

# L2 Announcements for LoadBalancer Services
l2announcements:
  enabled: true
  # Increase lease duration to reduce API calls
  leaseDuration: "15s"
  leaseRenewDeadline: "5s"
  leaseRetryPeriod: "2s"

# XDP is REQUIRED for Talos L2 announcements (cilium/cilium#36829) but unsupported under VXLAN —
# best-effort silently falls back to tc. Verify LB IPs still answer ARP after any routing change.
loadBalancer:
  acceleration: best-effort

# L2 announcer lease load: QPS = #services / leaseRenewDeadline; 20 leaves headroom.
k8sClientRateLimit:
  qps: 20
  burst: 40

# Cilium's default endpoint-create limit (0.5/s, burst 4) 429s the sandbox storm after a node
# restart; auto-adjust stays on and tunes these back toward observed endpoint-generation time.
extraConfig:
  api-rate-limit: "endpoint-create=rate-limit:2/s,rate-burst:16,parallel-requests:8,max-wait-duration:30s"

# 1.20 ADS mode livelocks after the last L7 listener drains (cilium/cilium#47624,
# Gateways all 403) — stay on split xDS for the whole 1.20 line.
envoy:
  xdsMode: split

# Gateway API Support
gatewayAPI:
  enabled: true
  # CRITICAL FIX: Use Local externalTrafficPolicy to preserve source IP
  # and enable proper connection tracking. This fixes intermittent connectivity.
  externalTrafficPolicy: Local
  # Enable session affinity for consistent routing
  sessionAffinity: true
  sessionAffinityTimeoutSeconds: 10800 # 3 hours

# Agent memory limit keeps headroom on purpose — endpoint maps grow with churn and pods hit the old 2Gi limit.
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 3Gi

# Hubble (Observability)
hubble:
  enabled: true 
  # Performance: increase event queue to prevent drops under load
  eventQueueSize: 16384
  relay:
    enabled: true
  ui:
    enabled: true

# Operator Configuration
operator:
  # Required hostname anti-affinity below spreads the two replicas. Drop to 1 if only one
  # worker is schedulable — the 2nd replica would stay Pending and hang the app.
  replicas: 2
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 1Gi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            io.cilium/app: operator
        topologyKey: kubernetes.io/hostname
