tunnel: threadripper
protocol: http2
credentials-file: /etc/cloudflared/credentials/credentials.json
metrics: 0.0.0.0:2000
no-autoupdate: true
loglevel: info
transport-loglevel: warn
ingress:
  - hostname: hello.vanillax.me
    service: hello_world
  # Wildcard is intentional: only ExternalDNS-published hostnames reach the tunnel, internal
  # services have no Cloudflare DNS, and HTTPRoutes enforce hostnames (explicit alt: config-explicit.yaml.example).
  - hostname: "*.vanillax.me"
    service: https://cilium-gateway-gateway-external.gateway.svc.cluster.local:443
    originRequest:
      noTLSVerify: true
      originServerName: "*.vanillax.me"
  - hostname: vanillax.me
    service: https://cilium-gateway-gateway-external.gateway.svc.cluster.local:443
    originRequest:
      noTLSVerify: true
      originServerName: vanillax.me
  - service: http_status:404
