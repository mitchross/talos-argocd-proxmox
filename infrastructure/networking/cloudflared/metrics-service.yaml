apiVersion: v1
kind: Service
metadata:
  name: cloudflared-metrics
  namespace: cloudflared
  labels:
    app: cloudflared
spec:
  selector:
    app: cloudflared
  ports:
    # Service, not PodMonitor: the pod declares no containerPort for 2000, and PodMonitor drops undeclared ports.
    - name: metrics
      port: 2000
      targetPort: 2000
