apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  selector:
    matchLabels:
      app: cloudflared
  podMetricsEndpoints:
    # The metrics listener (config.yaml `metrics:`) has no named containerPort.
    - portNumber: 2000
      interval: 30s
