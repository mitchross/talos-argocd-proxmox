# ExternalDNS Helm Values for Cloudflare Integration
# Automatically manages DNS records for HTTPRoutes with external-dns annotations

# Provider Configuration
provider:
  name: cloudflare

# Cloudflare-specific settings
cloudflare:
  proxied: true # Enable Cloudflare proxy for all records

# Source Configuration - Watch Gateway API HTTPRoutes
sources:
  - gateway-httproute

domainFilters:
  - vanillax.me

# sync also deletes, but only records whose TXT owner is txtOwnerId below (upsert-only would never delete).
policy: sync

# Registry - use TXT records to track ownership
registry: txt
txtOwnerId: talos-cluster
txtPrefix: "external-dns-"

# Only HTTPRoutes labelled external-dns=true (attached to the external Gateway) get DNS records.
extraArgs:
  # Match the existing Gateway and HTTPRoute annotations to preserve DNS targets.
  - --annotation-prefix=external-dns.alpha.kubernetes.io/
  - --label-filter=external-dns=true
  - --gateway-label-filter=external-dns-gateway=gateway-external
  - --cloudflare-proxied

logLevel: info
logFormat: text

resources:
  requests:
    cpu: 128m
    memory: 192Mi
  limits:
    memory: 384Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

podSecurityContext:
  fsGroup: 65534
  runAsNonRoot: true
  runAsUser: 65534
  seccompProfile:
    type: RuntimeDefault

# Token comes from the cloudflare-api-token Secret (ExternalSecret -> 1Password).
env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: api-token

interval: 1m

# Trigger loop on create - faster propagation for new records
triggerLoopOnEvent: true

image:
  tag: v0.23.0@sha256:1854499e2b08cee47c40a08e356bff20dcb192dbcfde8378fc3f900f12cad5a3
