# HTML responses pass through this proxy on their way from the external Gateway to cloudflared.
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

# Radar initializes PostHog itself; ingest and API/proxy hosts must never receive the snippet.
map $host $ph_host {
    default 0;
    ingest-posthog.vanillax.me 0;
    posthog.vanillax.me 0;
    redlib.vanillax.me 0;
    libreddit.vanillax.me 0;
    otel.vanillax.me 0;
    radar-ng-api.vanillax.me 0;
    argocd-webhook.vanillax.me 0;
    radar.vanillax.me 0;
    vanillax.me 1;
    ~\.vanillax\.me$ 1;
}

map $uri $ph_path {
    default 1;
    "~*\.(js|mjs|css|png|jpe?g|gif|svg|ico|woff2?|ttf|eot|webp|avif|mp4|webm|json|xml|txt|map|wasm|pdf|zip)$" 0;
}

# Only eligible page requests need uncompressed upstream markup; Cloudflare recompresses it.
map "$ph_host:$ph_path:$request_method" $ph_accept_encoding {
    default $http_accept_encoding;
    "1:1:GET" "";
}

# An empty search disables sub_filter, preserving headers and body on bypassed responses.
map "$ph_host:$ph_path:$request_method:$status" $ph_search {
    default "";
    "~^1:1:GET:2[0-9][0-9]$" "</head>";
}

# Visiting any page once with ?ph_optout=1 opts that browser out (posthog-js persists it) so operator visits never count.
map $host $ph_snippet {
    default '<!-- PostHog Analytics (injected in-cluster) --><script> !function(t,e){var o,n,p,r;e.__SV||(window.posthog=e,e._i=[],e.init=function(i,s,a){function g(t,e){var o=e.split(".");2==o.length&&(t=t[o[0]],e=o[1]),t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}}(p=t.createElement("script")).type="text/javascript",p.crossOrigin="anonymous",p.async=!0,p.src=s.api_host.replace(".i.posthog.com","-assets.i.posthog.com")+"/static/array.js",(r=t.getElementsByTagName("script")[0]).parentNode.insertBefore(p,r);var u=e;for(void 0!==a?u=e[a]=[]:a="posthog",u.people=u.people||[],u.toString=function(t){var e="posthog";return"posthog"!==a&&(e+="."+a),t||(e+=" (stub)"),e},u.people.toString=function(){return u.toString(1)+".people (stub)"},o="init capture register register_once register_for_session unregister unregister_for_session getFeatureFlag getFeatureFlagPayload isFeatureEnabled reloadFeatureFlags updateEarlyAccessFeatureEnrollment getEarlyAccessFeatures on onFeatureFlags onSessionId getSurveys getActiveMatchingSurveys renderSurvey canRenderSurvey getNextSurveyStep identify setPersonProperties group resetGroups setPersonPropertiesForFlags resetPersonPropertiesForFlags setGroupPropertiesForFlags resetGroupPropertiesForFlags reset get_distinct_id getGroups get_session_id get_session_replay_url alias set_config startSessionRecording stopSessionRecording sessionRecordingStarted captureException loadToolbar get_property getSessionProperty createPersonProfile opt_in_capturing opt_out_capturing has_opted_in_capturing has_opted_out_capturing clear_opt_in_out_capturing debug".split(" "),n=0;n<o.length;n++)g(u,o[n]);e._i.push([i,s,a])},e.__SV=1)}(document,window.posthog||[]); posthog.init("phc_nVGz6VWXyHrgijw9ct2t76jQAv2LBXnmTb5AydCqpUJM", { api_host: "https://ingest-posthog.vanillax.me", ui_host: "https://ingest-posthog.vanillax.me", disable_compression: true, loaded: function(posthog) { posthog.startSessionRecording(); } }); if (location.search.ind