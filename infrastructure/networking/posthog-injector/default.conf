}

# Umami is off for every host until umami-sites.map gives it a real website UUID.
map $host $umami_website_id {
    default "";
    include /etc/nginx/umami-sites.map;
}

# Loads Umami's tracker only after umamiConsent.grant(); DNT/GPC, storage errors, umami.disabled,
# a PostHog opt-out or ?ph_optout=1 all mean no. No recorder is ever loaded.
map $umami_website_id $umami_snippet {
    "" "";
    default '<!-- Umami consent loader (added in-cluster) --><script>!function(w,d,id){var K="umami.consent";function dnt(){var n=w.navigator||{};return n.doNotTrack=="1"||n.doNotTrack=="yes"||w.doNotTrack=="1"||n.msDoNotTrack=="1"||n.globalPrivacyControl===true}function ok(){if(dnt()||id.length!=36||/[^0-9a-f-]/.test(id))return false;try{var s=w.localStorage;if(s.getItem("umami.disabled"))return false;for(var i=0;i<s.length;i++){var k=s.key(i);if(k&&k.indexOf("__ph_opt_in_out_")==0&&s.getItem(k)=="0")return false}return s.getItem(K)=="granted"}catch(e){return false}}function deny(){try{w.localStorage.setItem(K,"denied");w.localStorage.setItem("umami.disabled","1")}catch(e){}}function load(){if(w.__umamiLoader||w.umami||!ok()||d.querySelector("script[data-website-id]"))return;w.__umamiLoader=1;var t=d.createElement("script");t.defer=true;t.src="https://ingest-umami.vanillax.me/script.js";t.setAttribute("data-website-id",id);t.setAttribute("data-do-not-track","true");t.setAttribute("data-domains",location.hostname);t.setAttribute("data-before-send","__umamiBeforeSend");d.head.appendChild(t)}w.__umamiBeforeSend=function(type,p){return ok()?p:null};w.umamiConsent={grant:function(){try{w.localStorage.setItem(K,"granted")}catch(e){}load()},revoke:function(){deny();location.reload()}};if(location.search.indexOf("ph_optout=1")>-1)deny();load()}(window,document,"$umami_website_id");</script>';
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 0;

    location / {
        proxy_pass https://cilium-gateway-gateway-external.gateway.svc.cluster.local:443;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding $ph_accept_encoding;
        # No buffering: SSE/streaming responses pass straight through; sub_filter still works chunk-wise.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        sub_filter $ph_search '$ph_snippet$umami_snippet</head>';
        sub_filter_once on;
    }
}

# Probe on a separate port so application /healthz routes keep reaching their origin.
server {
    listen 8081;
    server_name _;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 404; }
}
