}

server {
    listen 8080;
    server_name _;
    client_max_body_size 0;

    location / {
        proxy_pass https://cilium-gateway-gateway-external.gateway.svc.cluster.local:443;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding $ph_accept_encoding;
        # No buffering: SSE/streaming responses pass straight through; sub_filter still works chunk-wise.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        sub_filter $ph_search $ph_snippet;
        sub_filter_once on;
    }
}

# Probe on a separate port so application /healthz routes keep reaching their origin.
server {
    listen 8081;
    server_name _;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 404; }
}
