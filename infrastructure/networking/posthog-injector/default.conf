# HTML responses pass through this proxy on their way from the external Gateway to cloudflared.
map $http_upgrade $connection_upgrade { default upgrade; "" close; }

# Umami website ID per host (rows created by my-apps/development-infra/umami/scripts/websites.sql).
# Empty = never inject: analytics, API and redirect hosts, and radar (loads Umami itself).
map $host $umami_site {
    default "";
    ingest-umami.vanillax.me "";
    umami.vanillax.me "";
    libreddit.vanillax.me "";
    otel.vanillax.me "";
    radar.vanillax.me "";
    radar-ng-api.vanillax.me "";
    radar-l2-shadow.vanillax.me "";
    argocd-webhook.vanillax.me "";
    apps.vanillax.me c87c8c44-69f3-4647-bb5c-12c810aa7aef;
    bench.vanillax.me 05113581-12df-4529-a771-240073ea3bd9;
    deals.vanillax.me 0d25cd9d-b47e-4ec1-b688-4199890f8d49;
    excalidraw.vanillax.me a8b10991-46b2-4283-bd35-1ccb23bfc139;
    geocode.vanillax.me f9178010-2df1-4d81-b20c-094aa9c4694b;
    homelab.vanillax.me 2f6a027a-b8c1-4ed4-9605-d2a408441525;
    it-tools.vanillax.me a0a55c1e-e018-4757-a350-4fa16b13f66f;
    karakeep.vanillax.me 2da77add-7f25-433e-b30d-bec623cf0bc1;
    kiwix.vanillax.me 94b3c7f2-8ff3-4b94-8d9d-3e0a3ede03ba;
    maps.vanillax.me b10d6cdd-a11e-420b-be47-528568deba09;
    news.vanillax.me a3e06ce0-7d7b-405d-83d2-50d173fa94e4;
    redlib.vanillax.me d33a4be6-a593-4fe0-8795-b9214ce263c5;
    search.vanillax.me f0c551a0-826d-41e6-90fa-d769bbb153e9;
    vert.vanillax.me 43c210fb-4112-47c2-9ad8-ddd6ff12da97;
    worldmonitor.vanillax.me 20e07135-77fd-4d0c-ac83-266d7b4bdab8;
    vanillax.me 5c437932-a77e-4246-b52f-2899204818c1;
    ~\.vanillax\.me$ 5c437932-a77e-4246-b52f-2899204818c1;
}

map $umami_site $ph_host {
    default 1;
    "" 0;
}

map $uri $ph_path {
    default 1;
    "~*\.(js|mjs|css|png|jpe?g|gif|svg|ico|woff2?|ttf|eot|webp|avif|mp4|webm|json|xml|txt|map|wasm|pdf|zip)$" 0;
}

# Only eligible page requests need uncompressed upstream markup; Cloudflare recompresses it.
map "$ph_host:$ph_path:$request_method" $ph_accept_encoding {
    default $http_accept_encoding;
    "1:1:GET" "";
}

# An empty search disables sub_filter, preserving headers and body on bypassed responses.
map "$ph_host:$ph_path:$request_method:$status" $ph_search {
    default "";
    "~^1:1:GET:2[0-9][0-9]$" "</head>";
}

# Opt a browser out with localStorage.setItem('umami.disabled', '1'); DNT browsers are skipped.
# recorder.js records only once script.js has a session, so the opt-outs cover replay too.
map $host $ph_snippet {
    default '<script defer src="https://ingest-umami.vanillax.me/script.js" data-website-id="$umami_site" data-do-not-track="true"></script><script defer src="https://ingest-umami.vanillax.me/recorder.js" data-website-id="$umami_site"></script><!-- Umami (injected in-cluster) --></head>';
}

# Redlib's own CSP only allows 'self'; widen it for the Umami tag. Other hosts keep their CSP.
map $host $csp_override {
    default "";
    redlib.vanillax.me "default-src 'none'; font-src 'self'; script-src 'self' blob: https://ingest-umami.vanillax.me https://static.cloudflareinsights.com; manifest-src 'self'; media-src 'self' data: blob: about:; style-src 'self' 'unsafe-inline'; base-uri 'none'; img-src 'self' data:; form-action 'self'; frame-ancestors 'none'; connect-src 'self' https://ingest-umami.vanillax.me https://cloudflareinsights.com; worker-src blob:;";
}

map $csp_override $csp_out {
    default $csp_override;
    "" $upstream_http_content_security_policy;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 0;

    location / {
        proxy_pass https://cilium-gateway-gateway-external.gateway.svc.cluster.local:443;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding $ph_accept_encoding;
        # No buffering: SSE/streaming responses pass straight through; sub_filter still works chunk-wise.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        sub_filter $ph_search $ph_snippet;
        sub_filter_once on;
        # Empty $csp_out adds no header, so hosts without a CSP stay without one.
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy $csp_out always;
    }
}

# Probe on a separate port so application /healthz routes keep reaching their origin.
server {
    listen 8081;
    server_name _;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 404; }
}
