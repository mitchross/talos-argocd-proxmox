apiVersion: apps/v1
kind: Deployment
metadata:
  name: posthog-injector
  namespace: posthog-injector
  labels:
    app.kubernetes.io/name: posthog-injector
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: posthog-injector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posthog-injector
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101   # nginx-unprivileged's built-in non-root nginx user
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: posthog-injector
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:26b0bf6fbf07297983cb341998d79c831508787de26627dd2a112321b9c3a4af
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: health
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp   # unprivileged image keeps pid + proxy temp files here
      volumes:
        - name: conf
          configMap:
            name: posthog-injector-nginx
        - name: tmp
          emptyDir: {}
