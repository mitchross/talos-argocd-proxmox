apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: posthog-injector

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - vpa.yaml

configMapGenerator:
  # Hash suffix rolls the Deployment when the proxy config or snippet changes.
  - name: posthog-injector-nginx
    files:
      - default.conf
