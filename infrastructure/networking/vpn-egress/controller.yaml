apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpn-egress-controller
  namespace: vpn-egress
  labels:
    app: vpn-egress-controller
spec:
  replicas: 0  # paused; set back to 1 to resume
  # Never two controllers at once: the old one stops before the new one starts.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: vpn-egress-controller
  template:
    metadata:
      labels:
        app: vpn-egress-controller
    spec:
      serviceAccountName: vpn-egress-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          # Stock image; the app is controller.py + index.html from the ConfigMap. Same pin as vllm's helpers.
          image: python:3.15-alpine@sha256:2b4b04f31a4a009c1fadf7ce9338471f288488199cf43dcd1af71f244ea550aa
          command: ["python3", "/app/controller.py"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          envFrom:
            - configMapRef:
                name: vpn-egress-config
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: vpn-egress-controller-app
---
apiVersion: v1
kind: Service
metadata:
  name: vpn-egress-controller
  namespace: vpn-egress
  labels:
    app: vpn-egress-controller
spec:
  selector:
    app: vpn-egress-controller
  ports:
    - name: http
      port: 80
      targetPort: http
