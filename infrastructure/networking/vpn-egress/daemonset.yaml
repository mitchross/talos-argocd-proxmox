apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vpn-gateway
  namespace: vpn-egress
  labels:
    app: vpn-gateway
spec:
  selector:
    matchLabels:
      app: vpn-gateway
  # One gateway at a time: each restart moves that node's pods to the other gateways.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: vpn-gateway
    spec:
      serviceAccountName: vpn-gateway
      # The WireGuard link must live in the node's namespace, where Cilium can use it as an egress device.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 15
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - hp-elite-gen13
                      - mini-pc-dell-ultra-worker
                      - hp-elite-gen12
      containers:
        - name: gateway
          image: ghcr.io/linuxserver/wireguard:1.0.20260223-r0-ls129@sha256:236f9a9a89c701bc83f6d41007157dc77361114d14e56a08e846bb4499622e97
          # Bypass the image's s6 init; we only need its wg, iproute2, curl and jq.
          command: ["/bin/bash", "/scripts/gateway.sh"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: proton
              mountPath: /etc/proton
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: vpn-gateway-scripts
        - name: proton
          secret:
            secretName: proton-wireguard
            defaultMode: 0400
