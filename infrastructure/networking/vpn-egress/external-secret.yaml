# One Proton WireGuard config per gateway node, base64-encoded in 1Password.
# A key is valid for one tunnel only: two nodes sharing a key break each other.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proton-wireguard
  namespace: vpn-egress
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: proton-wireguard
    creationPolicy: Owner
  data:
    - secretKey: hp-elite-gen13
      remoteRef:
        key: proton-wireguard-egress
        property: hp-elite-gen13
        decodingStrategy: Base64
    - secretKey: mini-pc-dell-ultra-worker
      remoteRef:
        key: proton-wireguard-egress
        property: mini-pc-dell-ultra-worker
        decodingStrategy: Base64
    - secretKey: hp-elite-gen12
      remoteRef:
        key: proton-wireguard-egress
        property: hp-elite-gen12
        decodingStrategy: Base64
