# index requires each field to match; downloaded hooks and DNS never enter host configuration.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vpn-1
  namespace: vpn-egress
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: vpn-1
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        wg-vpn1.conf: |
          [Interface]
          {{ index (regexFindAll `(?m)^[ \t]*PrivateKey[ \t]*=[ \t]*[^ \t\r\n#][^\r\n#]*` .config 1) 0 }}
          {{ index (regexFindAll `(?m)^[ \t]*Address[ \t]*=[ \t]*10\.2\.0\.2/32[ \t]*\r?$` .config 1) 0 }}
          Table = 100
          MTU = 1420

          [Peer]
          {{ index (regexFindAll `(?m)^[ \t]*PublicKey[ \t]*=[ \t]*[^ \t\r\n#][^\r\n#]*` .config 1) 0 }}
          {{ index (regexFindAll `(?m)^[ \t]*Endpoint[ \t]*=[ \t]*[^ \t\r\n#][^\r\n#]*` .config 1) 0 }}
          AllowedIPs = 0.0.0.0/0
          PersistentKeepalive = 25
  data:
  - secretKey: config
    remoteRef:
      key: talos-cluster-global-vpn-config
      property: config-1
      decodingStrategy: Base64
