# Each floating VPN has its own key; sharing one key knocks the other tunnel offline.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proton-wireguard
  namespace: vpn-egress
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: proton-wireguard
    creationPolicy: Owner
  data:
    - secretKey: config-1
      remoteRef:
        key: talos-cluster-global-vpn-config
        property: config-1
        decodingStrategy: Base64
    - secretKey: config-2
      remoteRef:
        key: talos-cluster-global-vpn-config
        property: config-2
        decodingStrategy: Base64
    - secretKey: config-3
      remoteRef:
        key: talos-cluster-global-vpn-config
        property: config-3
        decodingStrategy: Base64
