# The cluster's one Proton WireGuard config, base64-encoded in 1Password.
# The Secret key is the gateway node's name: the gateway reads /etc/proton/<node>.
# A WireGuard key works in one place only, so never reuse this config elsewhere.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proton-wireguard
  namespace: vpn-egress
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: proton-wireguard
    creationPolicy: Owner
  data:
    - secretKey: hp-elite-gen13
      remoteRef:
        key: talos-cluster-global-vpn-config
        property: config
        decodingStrategy: Base64
