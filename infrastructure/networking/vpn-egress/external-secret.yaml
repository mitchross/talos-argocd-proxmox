# Three Proton WireGuard configs, one per gateway node, base64-encoded in one 1Password item.
# The Secret key is the node name: each gateway reads /etc/proton/<node>.
# A WireGuard key works in one place only: two nodes sharing a key knock each other offline.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proton-wireguard
  namespace: vpn-egress
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: proton-wireguard
    creationPolicy: Owner
  data:
    - secretKey: hp-elite-gen13
      remoteRef:
        key: talos-cluster-global-vpn-config
        property: config-1
        decodingStrategy: Base64
    - secretKey: mini-pc-dell-ultra-worker
      remoteRef:
        key: talos-cluster-global-vpn-config
        property: config-2
        decodingStrategy: Base64
    - secretKey: hp-elite-gen12
      remoteRef:
        key: talos-cluster-global-vpn-config
        property: config-3
        decodingStrategy: Base64
