# LAN only: the internal Gateway (192.168.10.52, Technitium DNS), like Longhorn and Headlamp.
# Never attach this to gateway-external; the toggle has no login of its own.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vpn-egress
  namespace: vpn-egress
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal-technitium
      namespace: gateway
      sectionName: https
  hostnames:
    - "vpn.vanillax.me"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: vpn-egress-controller
          port: 80
          weight: 1
