apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpn-gateway
  namespace: vpn-egress
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: vpn-gateway
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      # WireGuard crypto runs in kernel softirq, not in this container; it only runs a control loop.
      - containerName: gateway
        controlledResources: ["cpu", "memory"]
        controlledValues: RequestsOnly
        maxAllowed:
          cpu: 200m
          memory: 128Mi
