apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vpn-1
  namespace: vpn-egress
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vpn-1
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
    - containerName: wireguard
      controlledResources:
      - cpu
      - memory
      controlledValues: RequestsOnly
      maxAllowed:
        cpu: 200m
        memory: 128Mi
---
