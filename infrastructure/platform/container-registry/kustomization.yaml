apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: container-registry

resources:
  - namespace.yaml
  - kopiur/registry.yaml
  - deployment.yaml
  - service.yaml
  - pvc.yaml
  - httproute.yaml
  - gc-cronjob.yaml
  - vpa.yaml

# Uniform kopiur backup fields for the stub in kopiur/ (same component my-apps uses).
components:
  - ../../../my-apps/common/kopiur-backup

configMapGenerator:
  - name: registry-config
    files:
      - config.yml
  - name: registry-gc-scripts
    files:
      - scripts/run-garbage-collection.sh
