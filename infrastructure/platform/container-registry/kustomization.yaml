apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# INTENTIONAL OUTLIER in kube-system: moving it means recreating the registry PVC (kube-system PVCs have
# no kopiur restore path) and repointing every image reference. Revisit only if the registry is rebuilt.
namespace: kube-system

resources:
  - deployment.yaml
  - service.yaml
  - pvc.yaml
  - httproute.yaml
  - gc-cronjob.yaml

configMapGenerator:
  - name: registry-config
    files:
      - config.yml
  - name: registry-gc-scripts
    files:
      - scripts/run-garbage-collection.sh
