apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry
  namespace: container-registry
  annotations:
    # Immutable dataSourceRef on a Bound PVC — mask the SSA dry-run diff.
    argocd.argoproj.io/compare-options: ServerSideDiff=false
    argocd.argoproj.io/sync-options: ServerSideApply=false
  labels:
    app.kubernetes.io/name: container-registry
    app.kubernetes.io/component: infrastructure
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # kopiur restore-before-bind (CRs in kopiur/registry.yaml); root-owned data, see namespace.yaml.
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: registry-restore
