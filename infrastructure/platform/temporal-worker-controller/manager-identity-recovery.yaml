apiVersion: batch/v1
kind: CronJob
metadata:
  name: temporal-worker-controller-identity-recovery
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 240
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: temporal-worker-controller-service-account
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: recover-manager-identity
              image: temporalio/admin-tools:1.32.0@sha256:a9f84fb9a374b2374fe2e67c8efc0468ff3f1c66c8a0b14597ec86e349e62bca
              imagePullPolicy: IfNotPresent
              command:
                - /scripts/recover-manager-identity.sh
              env:
                - name: CONTROLLER_IDENTITY
                  value: temporal-worker-controller/temporal-worker-controller
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: TEMPORAL_ADDRESS
                  value: temporal-frontend.temporal.svc.cluster.local:7233
                - name: TEMPORAL_NAMESPACE
                  value: default
              resources:
                requests:
                  cpu: 10m
                  memory: 768Mi
                limits:
                  # The 550 MiB CLI thrashed its executable cache under a 128 MiB cap.
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: recovery-script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: recovery-script
              configMap:
                name: temporal-worker-controller-identity-recovery-scripts
                defaultMode: 0555
