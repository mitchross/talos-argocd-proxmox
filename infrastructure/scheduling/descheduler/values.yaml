# Rebalances on memory *requests* (what blocks scheduling), not live use. Guards: docs/domains/scheduling/descheduler.md.
kind: CronJob
schedule: "*/30 * * * *"
successfulJobsHistoryLimit: 1
failedJobsHistoryLimit: 1
image:
  tag: v0.36.0@sha256:7ca92c0a7b4f1c51d306409da6b832005fcadb224e384795646376726734c6e5
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
deschedulerPolicy:
  maxNoOfPodsToEvictPerNode: 3
  profiles:
    - name: balance
      pluginConfig:
        - name: DefaultEvictor
          args:
            nodeFit: true
            podProtections:
              # emptyDir is scratch space; pods using it may move.
              defaultDisabled:
                - PodsWithLocalStorage
              extraEnabled:
                - PodsWithPVC
              config:
                PodsWithPVC:
                  # best-effort data locality: a move = full Longhorn volume copy (disk-writes.md). Plain `longhorn` reattaches over the network.
                  protectedStorageClasses:
                    - name: longhorn-flash
                    - name: longhorn-wired-ha
                    - name: longhorn-kopiur-staging-local
        - name: RemoveDuplicates
          args:
            namespaces:
              exclude:
                - kube-system
                - longhorn-system
        # Memory only (cpu/pods omitted = 100% = ignored): under 55% receives, over 65% sheds. The 10-pt gap stops ping-pong.
        - name: LowNodeUtilization
          args:
            # kube-system pods (hubble) carry no requests, so evicting them never lowers the node and they bounce every run.
            evictableNamespaces:
              exclude:
                - kube-system
                # Evicting Longhorn CSI/manager pods restarts attach and backup work cluster-wide.
                - longhorn-system
            thresholds:
              memory: 55
            targetThresholds:
              memory: 65
      plugins:
        balance:
          enabled:
            - RemoveDuplicates
            - LowNodeUtilization
