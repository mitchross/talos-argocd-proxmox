apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keda

resources:
  - namespace.yaml

# KEDA includes the Temporal external scaler; no separate addon is needed.
helmCharts:
  - name: keda
    repo: https://kedacore.github.io/charts
    # renovate: datasource=helm depName=keda registryUrl=https://kedacore.github.io/charts
    version: 2.21.0
    releaseName: keda
    namespace: keda
    includeCRDs: true
    valuesFile: values.yaml
