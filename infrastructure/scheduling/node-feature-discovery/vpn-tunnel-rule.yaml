apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: vpn-tunnels
spec:
  rules:
  - name: vpn-1
    labels:
      vpn-tunnel: '1'
    matchFeatures:
    - feature: network.virtual
      matchExpressions:
        name:
          op: In
          value:
          - wg-vpn1
  - name: vpn-2
    labels:
      vpn-tunnel: '2'
    matchFeatures:
    - feature: network.virtual
      matchExpressions:
        name:
          op: In
          value:
          - wg-vpn2
  - name: vpn-3
    labels:
      vpn-tunnel: '3'
    matchFeatures:
    - feature: network.virtual
      matchExpressions:
        name:
          op: In
          value:
          - wg-vpn3
