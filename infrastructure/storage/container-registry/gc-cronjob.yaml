# Weekly registry GC; without it the PVC fills silently and pushes fail. The registry is
# flipped read-only first because a push during the sweep corrupts the store.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: registry-gc
  namespace: kube-system
  labels:
    app.kubernetes.io/name: container-registry
    app.kubernetes.io/component: maintenance
spec:
  schedule: "0 4 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: registry-gc
          containers:
            - name: gc
              # NOT registry.k8s.io/kubectl: it is distroless (no bash), so this script dies with StartError.
              image: docker.io/alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
              command: [/bin/bash, -euo, pipefail, -c]
              args:
                - /opt/repo-scripts/run-garbage-collection.sh
              volumeMounts:
                - name: repo-scripts
                  mountPath: /opt/repo-scripts
                  readOnly: true
          volumes:
            - name: repo-scripts
              configMap:
                name: registry-gc-scripts
                defaultMode: 0555
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-gc
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: registry-gc
  namespace: kube-system
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: registry-gc
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: registry-gc
    namespace: kube-system
roleRef:
  kind: Role
  name: registry-gc
  apiGroup: rbac.authorization.k8s.io
