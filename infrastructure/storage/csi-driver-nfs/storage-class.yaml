# Canonical 10G NFS mount-option set. Duplicated in truenas-csi/storageclass.yaml
# (single-string format) — keep both in lockstep when tuning.

# ComfyUI NFS storage class (10G)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-comfyui-10g
provisioner: nfs.csi.k8s.io
parameters:
  server: 192.168.10.133
  share: /mnt/ai-pool/comfyui
reclaimPolicy: Retain
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4.1
  - nolock
  - tcp
  - rsize=1048576
  - wsize=1048576
  - noatime
  - nconnect=16
---
# llama-cpp NFS storage class (10G)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-llama-cpp-10g
provisioner: nfs.csi.k8s.io
parameters:
  server: 192.168.10.133
  share: /mnt/ai-pool/llama-cpp
reclaimPolicy: Retain
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4.1
  - nolock
  - tcp
  - rsize=1048576
  - wsize=1048576
  - noatime
  - nconnect=16
---
# Dynamic NFS CSI provisioning creates a subdir per PVC; pre-existing shares need static PVs.

# Immich photos - read-only mount to TrueNAS photo library
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-immich-photos
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - nolock
    - tcp
    - rsize=1048576
    - wsize=1048576
    - noatime
    - nconnect=16
    - ro
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: nfs-immich-photos
    volumeAttributes:
      server: "192.168.10.133"
      share: "/mnt/BigTank/photos/All"
