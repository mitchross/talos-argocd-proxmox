apiVersion: v1
kind: Namespace
metadata:
  name: csi-driver-smb
  annotations:
    argocd.argoproj.io/sync-wave: "-1"  # PSS privileged labels must exist before driver pods start.
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
