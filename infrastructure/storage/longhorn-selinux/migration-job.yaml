apiVersion: batch/v1
kind: Job
metadata:
  name: longhorn-selinux-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: longhorn-selinux
    spec:
      serviceAccountName: longhorn-selinux
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: python:3.14-slim
          command: [python, /scripts/reconcile.py, /policy/policy.json]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: policy
              mountPath: /policy
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: longhorn-selinux-scripts
        - name: policy
          configMap:
            name: longhorn-selinux-policy
