# libmount in the CSI plugin strips context= unless libselinux sees /etc/selinux/config; without it every
# Longhorn volume mounts unlabeled_t and each pod write is audited. Longhorn owns the DaemonSet, so inject at admission.
apiVersion: v1
kind: ConfigMap
metadata:
  name: longhorn-csi-selinux-config
  namespace: longhorn-system
data:
  config: |
    SELINUX=permissive
    SELINUXTYPE=targeted
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: longhorn-csi-selinux-config.vanillax.dev
spec:
  # Ignore: a broken policy must never stop the CSI plugin from starting (it would only lose the label).
  failurePolicy: Ignore
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: longhorn-csi-plugin
      expression: >-
        object.metadata.namespace == "longhorn-system" &&
        has(object.metadata.labels) &&
        "app" in object.metadata.labels &&
        object.metadata.labels["app"] == "longhorn-csi-plugin" &&
        object.spec.containers.exists(c, c.name == "longhorn-csi-plugin")
    - name: not-already-mounted
      expression: >-
        !has(object.spec.volumes) ||
        !object.spec.volumes.exists(v, v.name == "selinux-config")
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              volumes: [Object.spec.volumes{
                name: "selinux-config",
                configMap: Object.spec.volumes.configMap{
                  name: "longhorn-csi-selinux-config",
                  optional: true
                }
              }],
              containers: [Object.spec.containers{
                name: "longhorn-csi-plugin",
                volumeMounts: [Object.spec.containers.volumeMounts{
                  name: "selinux-config",
                  mountPath: "/etc/selinux",
                  readOnly: true
                }]
              }]
            }
          }
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: longhorn-csi-selinux-config.vanillax.dev
spec:
  policyName: longhorn-csi-selinux-config.vanillax.dev
