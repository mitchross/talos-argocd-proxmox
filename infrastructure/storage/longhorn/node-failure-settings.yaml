# ONLY settings absent from values.yaml defaultSettings belong here: anything declared in
# both places has its Setting CR silently overwritten by the longhorn-default-setting ConfigMap.

---
# Delete pods on a down node so volumes reattach elsewhere instead of staying faulted.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: node-down-pod-deletion-policy
  namespace: longhorn-system
value: "delete-both-statefulset-and-deployment-pod"

---
# Without this, PVCs whose replicas are all lost stick in Terminating.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: orphan-resource-auto-deletion
  namespace: longhorn-system
value: "replica-data;instance"

---
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: node-drain-policy
  namespace: longhorn-system
value: "block-if-contains-last-replica"

---
# INTENTIONALLY 1: a mass-restore bootstrap overloads any engine on this hardware and faults
# volumes faster than rebuilds drain them. Raise to 2-3 only after a passed DR drill shows headroom.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: concurrent-replica-rebuild-per-node-limit
  namespace: longhorn-system
value: "1"

---
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: disable-scheduling-on-cordoned-node
  namespace: longhorn-system
value: "true"

---
# Automatically detach volumes on node failure after timeout
# This allows volumes to be reattached to healthy nodes
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: kubernetes-cluster-autoscaler-enabled
  namespace: longhorn-system
value: "true"

---
# Auto-delete pods when volumes are detached unexpectedly
# Helps recover from node failures more quickly
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: auto-delete-pod-when-volume-detached-unexpectedly
  namespace: longhorn-system
value: "true"

---
# V2 (SPDK) reactor cores; inert on V1 but the 2-core default wedges a rebuild under restore churn.
# Name must be the consolidated `data-engine-cpu-mask` — the legacy `v2-data-engine-cpu-mask` is rejected.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: data-engine-cpu-mask
  namespace: longhorn-system
value: '{"v2":"0xf"}'
