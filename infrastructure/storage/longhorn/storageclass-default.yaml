apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
    # Parameters are immutable: to change them, delete the live StorageClass once; ArgoCD re-creates it.
    argocd.argoproj.io/sync-options: Replace=true
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
mountOptions:
  - context=system_u:object_r:ephemeral_t:s0
parameters:
  # Two copies on different wired nodes: one dead node must not strand a volume.
  numberOfReplicas: "2"
  nodeSelector: "wired-storage"
  replicaSoftAntiAffinity: "disabled"
  replicaZoneSoftAntiAffinity: "disabled"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: "ext4"
  # Off: best-effort re-copies the whole volume whenever its pod lands on another node (reboots, drains).
  dataLocality: "disabled"
  disableRevisionCounter: "true"
  dataEngine: "v1"
  unmapMarkSnapChainRemoved: "ignored"
  backupTargetName: "default"
