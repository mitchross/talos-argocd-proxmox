# Fast-flash tier for fsync-heavy workloads (see docs/domains/storage/storage-tiers.md). The Proxmox
# VG `ssd-ent` must stay THICK LVM — lvmthin serializes fsync and silently makes this tier a downgrade.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-flash
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
    # Parameters are immutable: to change them, delete the live StorageClass once; ArgoCD re-creates it.
    argocd.argoproj.io/sync-options: Replace=true
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
mountOptions:
  - context=system_u:object_r:ephemeral_t:s0
parameters:
  # Two copies on two `flash` disks, so a node drain copies nothing (#3663, #3664).
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fsType: "ext4"
  # Pins volumes to Longhorn disks tagged `flash` — see the
  # node.longhorn.io/default-disks-config annotation in the Omni cluster template.
  diskSelector: "flash"
  # No copy follows the pod. NEVER strict-local: the scheduler can't see diskSelector and attach deadlocks.
  dataLocality: "disabled"
