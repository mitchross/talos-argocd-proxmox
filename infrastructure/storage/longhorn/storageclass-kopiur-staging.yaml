# Temporary snapshot clones mounted by kopiur backup movers. WFFC schedules the
# mover first so its node becomes Longhorn's placement hint.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-kopiur-staging-local
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
    # Parameters are immutable: to change them, delete the live StorageClass once; ArgoCD re-creates it.
    argocd.argoproj.io/sync-options: Replace=true
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
mountOptions:
  - context=system_u:object_r:ephemeral_t:s0
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  fsType: "ext4"
  dataEngine: "v1"
  # NEVER strict-local: clone provisioning can ignore the WFFC hint (longhorn#12792)
  # and strict-local turns that into a permanent attach deadlock + Forbid backup stall.
  dataLocality: "disabled"
  # Clone churn lands on the enterprise flash only; the 850 EVO / 660p Longhorn disks were absorbing ~440 GB/day of it.
  diskSelector: "clone-ok"
  disableRevisionCounter: "true"
  unmapMarkSnapChainRemoved: "ignored"
