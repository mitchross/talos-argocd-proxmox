# One-copy class for caches that rebuild themselves. Use it only as a generic ephemeral volume, so a
# dead replica node costs a cache, never a stuck pod; see docs/domains/storage/storage-tiers.md.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-scratch
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
    # Parameters are immutable, so Argo deletes and re-creates the class; PVs never reference it after binding.
    argocd.argoproj.io/sync-options: Replace=true,Force=true
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
mountOptions:
  - context=system_u:object_r:ephemeral_t:s0
parameters:
  numberOfReplicas: "1"
  nodeSelector: "wired-storage"
  staleReplicaTimeout: "30"
  fsType: "ext4"
  dataEngine: "v1"
  # clone-ok = ssd-flash + hp-sff-ssd2: two disks on two nodes, and it keeps the worn 660p out.
  diskSelector: "clone-ok"
  dataLocality: "disabled"
  disableRevisionCounter: "true"
  unmapMarkSnapChainRemoved: "ignored"
