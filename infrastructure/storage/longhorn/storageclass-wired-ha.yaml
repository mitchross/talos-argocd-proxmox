# Two-copy RWO tier for availability-critical state on trusted wired storage nodes.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-wired-ha
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
    # Parameters are immutable: to change them, delete the live StorageClass once; ArgoCD re-creates it.
    argocd.argoproj.io/sync-options: Replace=true
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
mountOptions:
  - context=system_u:object_r:ephemeral_t:s0
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fsType: "ext4"
  dataEngine: "v1"
  nodeSelector: "wired-storage"
  dataLocality: "best-effort"
  # Only read when a volume is created; change replicaAutoBalance on existing volumes per volume.
  replicaAutoBalance: "best-effort"
  replicaSoftAntiAffinity: "disabled"
  replicaZoneSoftAntiAffinity: "disabled"
  replicaDiskSoftAntiAffinity: "disabled"
  disableRevisionCounter: "true"
  unmapMarkSnapChainRemoved: "ignored"
