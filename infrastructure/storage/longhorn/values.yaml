# UI-applied settings are overwritten on Helm upgrade — manage every setting here.
# V1 data engine only (V2 retired, see docs/disaster-recovery.md); engines can't be flipped on a live cluster.
# Shed node is tainted node.vanillax.dev/link=wifi:NoSchedule; Longhorn must still run there
# (manager, CSI, instance-manager) so the node and its disk register.
global:
  tolerations:
    - key: node.vanillax.dev/link
      operator: Equal
      value: wifi
      effect: NoSchedule
defaultSettings:
  taintToleration: "node.vanillax.dev/link=wifi:NoSchedule"
  # NOTE: Longhorn 1.10 consolidates settings for V1/V2 data engines. Use either
  # a single scalar or a JSON string with per-engine values like {"v1":"...","v2":"..."} when needed.
  defaultDataPath: "/var/lib/longhorn"
  storageMinimalAvailablePercentage: "10"
  # Without this Longhorn ignores the node default-disks-config annotation and only creates defaultDataPath.
  createDefaultDiskLabeledNodes: "true"
  # Disk annotations own reservations; a non-zero global % would add a second, implicit reservation.
  storageReservedPercentageForDefaultDisk: "0"
  # Budget = disk size * this % against DECLARED PVC size. Never drop to 100%:
  # a DR restore doubles declared demand via `prime-*` PVCs and deadlocks the rebuild.
  storageOverProvisioningPercentage: "200"
  allowRecurringJobWhileVolumeDetached: "true"
  replicaAutoBalance: "best-effort"
  # Plain scalars only — per-engine JSON strings trip "mismatched data engines" errors.
  fastReplicaRebuildEnabled: "true"
  engineReplicaTimeout: "8"
  # Percent of allocatable CPU per instance-manager pod (NOT cores); chart default is 12.
  guaranteedInstanceManagerCPU: "8"
  # No guaranteedInstanceManagerMemory setting exists — the key renders into the ConfigMap but is silently ignored.
  # Performance: prefer local disk for reads when replica is on same node
  defaultDataLocality: "best-effort"
  # Each failed kopiur backup burns a snapshot slot; a full volume can never back up again without a manual purge.
  snapshotMaxCount: "30"
  autoCleanupSystemGeneratedSnapshot: "true"
  # Allow Longhorn to auto-upgrade volume engines after manager upgrades
  concurrentAutomaticEngineUpgradePerNodeLimit: "3"
  # Allow detached volumes to rebuild replicas (fixes VolSync clone volumes
  # stuck in VolumeCloneCopyCompleteAwaitingHealthy with replica count > 1)
  offlineReplicaRebuilding: "true"
# -- Disables the pre-upgrade check job. This is recommended for GitOps tools
# like ArgoCD to prevent sync failures.
preUpgradeChecker:
  jobEnabled: false
persistence:
  # -- The chart-created `longhorn` StorageClass, cluster default. NEVER rename it —
  # 40+ PVCs, the kopiur backup contract and CLAUDE.md reference `storageClassName: longhorn`.
  defaultClass: true
  # -- Default replica count. Stay at 1 until a second trustworthy wired storage
  # worker exists and is measured; off-cluster durability is kopiur backups to RustFS.
  defaultClassReplicaCount: 1
  # -- Default filesystem type.
  defaultFsType: ext4
  defaultDataLocality: best-effort
  # -- Reclaim policy for the default storage class.
  reclaimPolicy: Delete
# -- Disable the default ingress creation, as you are managing it with a
# separate HTTPRoute resource.
ingress:
  enabled: false
# One operator-facing UI replica is sufficient for this homelab.
longhornUI:
  replicas: 1
