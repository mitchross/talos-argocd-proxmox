apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-backups-lifecycle-apply
  namespace: rustfs-lifecycle
  annotations:
    # Hook so it re-applies on every Sync without "field is immutable" errors; PUT bucket-lifecycle is idempotent.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  # Bound wall-clock so a stuck aws call (RustFS down, missing creds) cannot wedge the Application's sync.
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: postgres-backups-lifecycle
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aws-cli
          # renovate: datasource=docker depName=public.ecr.aws/aws-cli/aws-cli
          image: public.ecr.aws/aws-cli/aws-cli:2.36.34
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rustfs-admin-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-admin-credentials
                  key: AWS_SECRET_ACCESS_KEY
            # Region is required by SigV4 even though RustFS ignores it.
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            # Skip the IMDS lookup attempt — we're not on EC2 and the probe
            # adds latency / spurious "could not connect" log noise.
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: HOME
              value: /tmp
          command:
            - sh
            - -c
            - /opt/repo-scripts/apply-postgres-backups-lifecycle.sh
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: lifecycle
              mountPath: /lifecycle
              readOnly: true
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: lifecycle
          configMap:
            name: postgres-backups-lifecycle
        - name: repo-scripts
          configMap:
            name: postgres-backups-lifecycle-scripts
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
