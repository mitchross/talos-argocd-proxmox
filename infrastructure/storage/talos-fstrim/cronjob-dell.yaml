# Dell worker: Talos EPHEMERAL /var plus the dedicated SSD at /var/mnt/longhorn-dell-ssd.
# Scheduled after the dual-RTX worker so Longhorn maintenance I/O never overlaps on both nodes.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: talos-fstrim-dell
  namespace: talos-fstrim
  labels:
    app.kubernetes.io/name: talos-fstrim
    app.kubernetes.io/component: node-maintenance
    app.kubernetes.io/instance: dell-worker
spec:
  schedule: "30 5 * * 0"
  timeZone: America/Detroit
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: talos-fstrim
            app.kubernetes.io/component: node-maintenance
            app.kubernetes.io/instance: dell-worker
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          nodeSelector:
            node.vanillax.dev/class: dell-worker
          hostPID: true
          containers:
            - name: fstrim
              image: docker.io/library/alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu

                  echo "[fstrim] $(date -u +%Y-%m-%dT%H:%M:%SZ) trimming /var"
                  nsenter --mount=/proc/1/ns/mnt -- \
                    /usr/local/sbin/fstrim --verbose /var
                  echo "[fstrim] $(date -u +%Y-%m-%dT%H:%M:%SZ) /var completed"

                  echo "[fstrim] $(date -u +%Y-%m-%dT%H:%M:%SZ) trimming Dell SSD"
                  nsenter --mount=/proc/1/ns/mnt -- \
                    /usr/local/sbin/fstrim --verbose /var/mnt/longhorn-dell-ssd
                  echo "[fstrim] $(date -u +%Y-%m-%dT%H:%M:%SZ) Dell SSD completed"
              securityContext:
                privileged: true
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 5m
                  memory: 8Mi
                limits:
                  cpu: 100m
                  memory: 32Mi
              volumeMounts:
                - name: dev
                  mountPath: /dev
                - name: host
                  mountPath: /host
                  readOnly: true
          volumes:
            - name: dev
              hostPath:
                path: /dev
                type: Directory
            - name: host
              hostPath:
                path: /
                type: Directory
