# Talos does not schedule fstrim itself; Proxmox discard=on only passes through what the guest sends.
# Keep targets explicit: fstrim --all would also walk kubelet-mounted Longhorn workload filesystems.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: talos-fstrim
  namespace: talos-fstrim
  labels:
    app.kubernetes.io/name: talos-fstrim
    app.kubernetes.io/component: node-maintenance
spec:
  # The initial reclaim saturated host I/O while releasing hundreds of GiB.
  # Run future, incremental passes in a quiet local-time maintenance window.
  schedule: "30 4 * * 0"
  timeZone: America/Detroit
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: talos-fstrim
            app.kubernetes.io/component: node-maintenance
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          # These three filesystems exist together only on the dual-RTX worker.
          nodeSelector:
            gpu-worker: "true"
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
            - key: gpu
              operator: Equal
              value: "true"
              effect: NoSchedule
          hostPID: true
          containers:
            - name: fstrim
              image: docker.io/library/alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - /opt/repo-scripts/trim-node-filesystems.sh
              securityContext:
                privileged: true
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 5m
                  memory: 8Mi
                limits:
                  cpu: 100m
                  memory: 32Mi
              volumeMounts:
                - name: repo-scripts
                  mountPath: /opt/repo-scripts
                  readOnly: true
                # This matches Talos's own util-linux extension test pod. The
                # fstrim binary lives on the host at /usr/local/sbin/fstrim.
                - name: dev
                  mountPath: /dev
                - name: host
                  mountPath: /host
                  readOnly: true
          volumes:
            - name: repo-scripts
              configMap:
                name: talos-fstrim-scripts
                defaultMode: 0555
            - name: dev
              hostPath:
                path: /dev
                type: Directory
            - name: host
              hostPath:
                path: /
                type: Directory
