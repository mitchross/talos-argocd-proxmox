apiVersion: v1
kind: ConfigMap
metadata:
  name: truenas-csi-config
data:
  # Keys ARE the driver's env-var names; controller and node DaemonSet both envFrom this whole ConfigMap.
  # TrueNAS SCALE 26 JSON-RPC 2.0 WebSocket API.
  TRUENAS_URL: "wss://192.168.10.133/api/current"
  # TrueNAS currently uses a private/self-signed certificate on this endpoint.
  TRUENAS_INSECURE_SKIP_VERIFY: "true"
  TRUENAS_DEFAULT_POOL: "BigTank"
  TRUENAS_NFS_SERVER: "192.168.10.133"
  # Required by the driver even with no iSCSI StorageClass. IQN base MUST equal the appliance's
  # Target Global Base Name (still FreeNAS-era) — a mismatch bakes a wrong IQN into every PV.
  TRUENAS_ISCSI_PORTAL: "192.168.10.133:3260"
  TRUENAS_ISCSI_IQN_BASE: "iqn.2005-10.org.freenas.ctl"

