site_name: talos-argocd-proxmox
site_description: GitOps Kubernetes homelab on Talos OS, ArgoCD, Cilium, Longhorn, with self-managing applications
site_url: https://mitchross.github.io/talos-argocd-proxmox/
repo_url: https://github.com/mitchross/talos-argocd-proxmox
repo_name: mitchross/talos-argocd-proxmox
edit_uri: edit/main/docs/

docs_dir: docs

# Broken intra-doc anchors are warnings (build runs with --strict in CI,
# so a warning = failed deploy = caught before it ships).
validation:
  links:
    anchors: warn

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra_css:
  - assets/kopiur-playground.css
  - assets/nav-tweaks.css
  - assets/diagram-docs.css
  - assets/motion.css

extra_javascript:
  - assets/kopiur-playground.js
  # Adds body.motion-on, which is what arms the reveal rules in motion.css.
  # Without it every page renders fully static — never blank.
  - assets/motion.js

nav:
  - Start here:
      - The big picture: index.md
      - The easy guide: easy-guide.md
      - Course — survive a cluster wipe: learn/course.md
      - Glossary: glossary.md
      - How these docs are written: documentation-standard.md
  - GitOps and ArgoCD:
      - How ArgoCD deploys this repo: domains/argocd/argocd.md
      - Entrypoints and sync waves: domains/argocd/entrypoints.md
      - Check a risky change before merge: domains/argocd/gitops-risk-check.md
      - Check the live cluster before the next phase: domains/argocd/live-prerequisite-gate.md
      - Manifest cache contract: domains/argocd/manifest-cache-contract.md
  - Storage:
      - Storage architecture: storage-architecture.md
      - Disk map — which disk holds what: domains/storage/disk-map.md
      - NAS flash pool layout and buy list: domains/storage/nas-flash-pool.md
      - Pick a StorageClass: domains/storage/storage-tiers.md
      - Move a PVC to another StorageClass: domains/storage/pvc-storageclass-migration.md
      - Disk writes and SSD wear: domains/storage/disk-writes.md
      - Longhorn volumes and SELinux labels: domains/storage/selinux-mount-context.md
      - Collect storage evidence (read-only): domains/storage/collecting-storage-evidence.md
      - NAS performance and RAM: nas-performance.md
      - TrueNAS special-vdev stall runbook: truenas-special-vdev-stall-runbook.md
  - Backups and recovery:
      - How kopiur backup and restore work: domains/storage/kopiur-backup-architecture.md
      - Try it — kopiur playground: kopiur-playground.md
      - "Mover permissions (the #1 gotcha)": domains/storage/kopiur-mover-permissions.md
      - Backup validation contract: domains/storage/backup-validation-contract.md
      - Backup repository setup: backup-repository-setup.md
      - Kopia maintenance: domains/storage/kopia-maintenance-plan.md
      - RustFS credential runbook: domains/rustfs/credential-runbook.md
      - Run Postgres here: domains/cnpg/run-postgres-plain-english.md
      - Disaster recovery runbook: disaster-recovery.md
  - Networking:
      - Topology: domains/networking/topology.md
      - Cilium policies: domains/networking/policy.md
      - Split DNS with Technitium: domains/networking/technitium-vanillax-me-migration.md
  - Hardware and hosts:
      - Hardware overview: inventory/index.md
      - Fleet inventory: inventory/2026-11-03-fleet-inventory.md
      - Minis, RAM and M.2 slots: inventory/2026-11-05-minis-and-slots.md
      - ASUS NUC 13 Pro: inventory/2026-11-11-asus-nuc13.md
      - Manage hosts with Ansible: domains/hosts/physical-hosts-ansible.md
      - Bare-metal Talos workers: domains/hosts/bare-metal-talos.md
