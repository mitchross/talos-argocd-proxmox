# Pinned to nodes labeled coroot.vanillax.dev/enabled (hp-sff via the omni template) — its own
# box absorbs any IO surprise. Profiler/tracer/log collection stay OFF (~1 GB/s read storm).
apiVersion: coroot.com/v1
kind: Coroot
metadata:
  name: coroot
  namespace: coroot
spec:
  communityEdition: {}
  nodeSelector:
    coroot.vanillax.dev/enabled: "true"
  metricsRefreshInterval: 30s
  storage:
    size: 10Gi
    className: longhorn
    reclaimPolicy: Delete
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  prometheus:
    retention: 2d
    nodeSelector:
      coroot.vanillax.dev/enabled: "true"
    storage:
      size: 10Gi
      className: longhorn
      reclaimPolicy: Delete
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
  clickhouse:
    nodeSelector:
      coroot.vanillax.dev/enabled: "true"
    storage:
      size: 10Gi
      className: longhorn
      reclaimPolicy: Delete
    resources:
      requests:
        cpu: 200m
        memory: 768Mi
      limits:
        memory: 2Gi
    keeper:
      nodeSelector:
        coroot.vanillax.dev/enabled: "true"
      storage:
        size: 2Gi
        className: longhorn
        reclaimPolicy: Delete
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
  nodeAgent:
    # The read storm. eBPF profiling re-reads container binaries to symbolize
    # stacks; the tracer and log collector are off for the same reason.
    nodeSelector:
      coroot.vanillax.dev/enabled: "true"
    ebpfProfiler:
      enabled: false
    ebpfTracer:
      enabled: false
    logCollector:
      collectLogEntries: false
      collectLogBasedMetrics: false
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        memory: 1Gi
    tolerations:
      - operator: Exists
  clusterAgent:
    nodeSelector:
      coroot.vanillax.dev/enabled: "true"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
  logsTTL: 3d
  tracesTTL: 3d
  profilesTTL: 3d
  service:
    type: ClusterIP
    port: 8080
