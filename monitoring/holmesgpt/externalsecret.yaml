apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: holmes-litellm
  namespace: holmesgpt
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: holmes-litellm
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm
        property: master_key
