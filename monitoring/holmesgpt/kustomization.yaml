apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: holmesgpt

resources:
  - namespace.yaml
  - httproute.yaml
  - egress-policy.yaml
  - vpa.yaml

helmCharts:
  - name: holmes
    repo: https://robusta-charts.storage.googleapis.com
    version: 0.37.0
    releaseName: holmes
    valuesFile: values.yaml
    includeCRDs: true
