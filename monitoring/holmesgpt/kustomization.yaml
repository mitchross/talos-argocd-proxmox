apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: holmesgpt

resources:
  - namespace.yaml
  - httproute.yaml
  - egress-policy.yaml
  - vpa.yaml

helmCharts:
  - name: holmes
    repo: https://robusta-charts.storage.googleapis.com
    version: 0.40.0
    releaseName: holmes
    valuesFile: values.yaml
    includeCRDs: true

# Parked at 0 — saturated vLLM and nothing consumes its output (no sink, no
# inbound callers). Wire it to a sink before scaling up.
patches:
  - target:
      kind: Deployment
      name: holmes-holmes
    patch: |
      - op: replace
        path: /spec/replicas
        value: 0
