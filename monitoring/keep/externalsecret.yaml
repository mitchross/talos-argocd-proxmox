apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keep-db-secret
  namespace: keep
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: keep-db-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password: "{{ .password }}"
        connection-string: "postgresql+psycopg2://keep:{{ .password }}@keep-postgres:5432/keep"
  data:
    - secretKey: password
      remoteRef:
        key: keep
        property: password
