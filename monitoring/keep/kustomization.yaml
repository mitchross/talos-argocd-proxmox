apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keep

resources:
  - namespace.yaml
  - externalsecret.yaml
  - postgres/deployment.yaml
  - postgres/service.yaml
  - postgres/pvc.yaml
  - httproute.yaml
  - vpa.yaml

helmCharts:
  - name: keep
    repo: https://keephq.github.io/helm-charts
    version: 0.1.96
    releaseName: keep
    valuesFile: values.yaml
    includeCRDs: true

# Chart's pre-delete hook Job deletes every keep-* secret; ArgoCD would run it on every sync and nuke keep-db-secret.
patches:
  - target:
      kind: Job
      name: delete-keep-secrets
    patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: delete-keep-secrets
