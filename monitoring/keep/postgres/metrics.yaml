apiVersion: v1
kind: Service
metadata:
  name: keep-postgres-metrics
  namespace: keep
  labels:
    app.kubernetes.io/name: keep-postgres
    app.kubernetes.io/component: postgres-metrics
spec:
  selector:
    app: keep-postgres
  ports:
  - name: metrics
    port: 9187
    targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: keep-postgres
  namespace: keep
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: keep-postgres
      app.kubernetes.io/component: postgres-metrics
  endpoints:
  - port: metrics
    interval: 30s
    scrapeTimeout: 10s
