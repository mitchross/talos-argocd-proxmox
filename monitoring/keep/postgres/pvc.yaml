apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keep-postgres-data
  namespace: keep
  labels:
    app: keep-postgres
    backup-exempt: "true"
  annotations:
    storage.vanillax.dev/backup-exempt-reason: "Alert history is monitoring data; providers/workflows re-provision from git"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
