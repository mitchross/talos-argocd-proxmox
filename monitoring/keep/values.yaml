# Alertmanager webhooks land here; AI investigations are explicitly requested.
global:
  # Chart only ships nginx/haproxy/traefik Ingress; this cluster is Gateway
  # API. httproute.yaml replicates the prefix-strip the nginx template does.
  ingress:
    enabled: false

# Chart DB floats mysql:latest with an empty password — replaced by the
# pinned plain-Postgres in postgres/ (gitea pattern).
database:
  enabled: false

backend:
  enabled: true
  waitForDatabase:
    enabled: true
    # init container resolves the DB host from the DATABASE_NAME env var
    port: 5432
  databaseConnectionStringFromSecret:
    enabled: true
    secretName: keep-db-secret
    secretKey: connection-string
  # backend.env drops valueFrom; import credentials through the supported secret list.
  envFromSecrets:
    - name: keep-litellm
  # REPLACES the chart default wholesale — DATABASE_CONNECTION_STRING must stay absent
  # (injected from the secret above; a duplicate env wins unpredictably).
  env:
    - name: DATABASE_NAME
      value: keep-postgres
    - name: SECRET_MANAGER_TYPE
      value: k8s
    # Revalidate idle connections after Postgres restarts; stale auth queries otherwise become HTTP 401.
    - name: KEEP_DB_PRE_PING_ENABLED
      value: "true"
    - name: PORT
      value: "8080"
    - name: AUTH_TYPE
      value: NOAUTH
    - name: KEEP_API_URL
      value: https://keep.vanillax.me/v2
    - name: PUSHER_APP_ID
      value: "1"
    - name: PUSHER_APP_KEY
      value: keepappkey
    - name: PUSHER_APP_SECRET
      value: keepappsecret
    - name: PUSHER_HOST
      value: keep-websocket
    - name: PUSHER_PORT
      value: "6001"
    - name: PROMETHEUS_MULTIPROC_DIR
      value: /tmp/prometheus
    - name: POSTHOG_DISABLED
      value: "true"
    - name: SENTRY_DISABLED
      value: "true"
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  extraVolumes:
    - name: backend-health
      configMap:
        name: keep-backend-health
  extraVolumeMounts:
    - name: backend-health
      mountPath: /opt/keep-health
      readOnly: true
  healthCheck:
    enabled: true
    probes:
      readinessProbe:
        httpGet: null
        exec:
          command: [python, /opt/keep-health/readiness.py]
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 5
        failureThreshold: 1
        successThreshold: 1
  provision:
    providers:
      llama-cpp-local:
        type: vllm
        authentication:
          # Keep 0.52.1's provider appends /v1/completions itself.
          api_url: http://litellm-service.litellm.svc.cluster.local:4000
          api_key: $(LITELLM_API_KEY)
    workflows: []

frontend:
  enabled: true
  env:
    - name: NEXTAUTH_SECRET
      value: secret
    - name: NEXTAUTH_URL
      value: https://keep.vanillax.me
    - name: AUTH_TYPE
      value: NOAUTH
    - name: API_URL_CLIENT
      value: /v2
    - name: VERCEL
      value: "1"
    - name: ENV
      value: development
    - name: NODE_ENV
      value: development
    - name: HOSTNAME
      value: 0.0.0.0
    - name: PUSHER_APP_KEY
      value: keepappkey
    - name: FRIGADE_DISABLED
      value: "true"
    - name: POSTHOG_DISABLED
      value: "true"
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

websocket:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi
