loki:
  commonConfig:
    path_prefix: /var/loki
    # Single-node/single-write Loki: replication must not exceed live write
    # replicas, or ingestion fails with "at least 2 live replicas required".
    replication_factor: 1
  storage:
    type: "s3"
    bucketNames:
      chunks: loki
      ruler: loki
      admin: loki
    s3:
      endpoint: http://192.168.10.133:30292
      region: us-east-1
      s3ForcePathStyle: true
      insecure: true
  schemaConfig:
    configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: loki_index_
        period: 24h
  ingester:
    chunk_encoding: snappy
  querier:
    max_concurrent: 4
  query_scheduler:
    use_scheduler_ring: true
  frontend_worker:
    scheduler_address: loki-backend.loki-stack.svc.cluster.local:9095
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    # Chart default 4 MiB/s 429s OTel catch-up bursts after an outage; keep headroom for recovery.
    ingestion_rate_mb: 32
    ingestion_burst_size_mb: 64
    # 24h + compactor retention below: longer retention buried RustFS in S3 objects.
    retention_period: 24h
  # Without retention_enabled + delete_request_store, retention_period is a soft mark — chunks are never deleted.
  compactor:
    retention_enabled: true
    retention_delete_delay: 2h
    compaction_interval: 10m
    delete_request_store: s3
deploymentMode: SimpleScalable
backend:
  replicas: 1
  # Write-path WAL/cache only; log data lives on S3. Backup-exempt, rebuilds from S3.
  persistence:
    storageClass: longhorn-flash
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  extraEnvFrom:
  - secretRef:
      name: loki-s3-credentials
read:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  extraEnvFrom:
  - secretRef:
      name: loki-s3-credentials
write:
  replicas: 1
  # Local write-path state on the flash isolation tier (log data is on S3/RustFS).
  persistence:
    storageClass: longhorn-flash
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  extraEnvFrom:
  - secretRef:
      name: loki-s3-credentials
# DISABLED - Using external S3 (TrueNAS RustFS) instead
# This saves ~200Gi of Longhorn storage
minio:
  enabled: false
# Chart defaults request ~11Gi of memcached for a trickle of logs; pod request = round(allocatedMemory * 1.2).
chunksCache:
  allocatedMemory: 512
resultsCache:
  allocatedMemory: 256
gateway:
  # Single node: the RollingUpdate surge pod can't co-schedule under the gateway's required podAntiAffinity — rollout wedges Pending.
  deploymentStrategy:
    type: Recreate
  service:
    type: LoadBalancer
    # Pin the LB IP: unpinned services race pinned ones for specific IPs on
    # rebuild (this one squatted wyze-bridge's .46 after the 06-28 rebuild).
    annotations:
      lbipam.cilium.io/ips: "192.168.10.48"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
