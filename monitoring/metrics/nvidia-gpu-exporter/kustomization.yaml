apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nvidia-gpu-exporter
resources:
  - namespace.yaml
  - vpa.yaml
helmCharts:
  - name: nvidia-gpu-exporter
    repo: https://utkuozdemir.github.io/nvidia_gpu_exporter
    version: 3.0.0
    releaseName: nvidia-gpu-exporter
    namespace: nvidia-gpu-exporter
    valuesFile: values.yaml
    skipTests: true
