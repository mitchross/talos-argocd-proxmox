apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: nvidia-gpu-exporter
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: nvidia-gpu-exporter
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: nvidia-gpu-exporter
        controlledResources: ["cpu", "memory"]
        controlledValues: RequestsOnly
        maxAllowed:
          cpu: 200m
          memory: 256Mi
