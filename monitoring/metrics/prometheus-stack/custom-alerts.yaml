apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: custom-cluster-alerts
  namespace: prometheus-stack
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/managed-by: Helm
    prometheus: kube-prometheus-stack-prometheus
    role: alert-rules
spec:
  groups:
    # Kubernetes Cluster Health
    - name: kubernetes.cluster.health
      interval: 30s
      rules:
        - alert: KubernetesNodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Kubernetes node {{ $labels.node }} is not ready"
            description: "Node {{ $labels.node }} has been not ready for more than 5 minutes."
        # A healthy drain finishes well inside an hour; a longer cordon is usually a Longhorn last-replica PDB.
        - alert: KubernetesNodeCordonedTooLong
          expr: kube_node_spec_unschedulable == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Kubernetes node {{ $labels.node }} has been cordoned for over 1 hour"
            description: "Node {{ $labels.node }} is still cordoned. If a Talos upgrade drain is stuck, check `omnictl get clustermachinestatus` lastconfigerror and follow omni/docs/OPERATIONS.md § A drain is stuck on a Longhorn volume."
        - alert: KubernetesPodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is restarting {{ printf \"%.2f\" $value }} times every 15 minutes."
        - alert: KubernetesPodNotReady
          expr: kube_pod_status_phase{phase=~"Pending|Unknown"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-ready state for more than 10 minutes."
        # Replaces the stock KubeJobFailed for CronJobs: alert on the latest run only, so a later
        # success clears it while failed Jobs stay around for investigation.
        - alert: CronJobLastRunFailed
          expr: |
            (
              (kube_cronjob_status_last_schedule_time > kube_cronjob_status_last_successful_time)
              or
              (kube_cronjob_status_last_schedule_time unless on (namespace, cronjob) kube_cronjob_status_last_successful_time)
            )
            unless on (namespace, cronjob) (kube_cronjob_status_active > 0)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} last run failed"
            description: "The most recent run of {{ $labels.namespace }}/{{ $labels.cronjob }} did not succeed. Check `kubectl -n {{ $labels.namespace }} get jobs` and the failed Job's pod logs (Loki keeps them after the pod is deleted)."
        - alert: StandaloneJobFailed
          expr: kube_job_failed{job="kube-state-metrics"} > 0 unless on (namespace, job_name) kube_job_owner{owner_kind="CronJob"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed"
            description: "Job {{ $labels.namespace }}/{{ $labels.job_name }} (not owned by a CronJob) failed. Delete it after investigation to clear this alert."
    # Resource Usage Alerts
    - name: kubernetes.resources
      interval: 30s
      rules:
        - alert: NodeMemoryHighUsage
          expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} has high memory usage"
            description: "Node {{ $labels.instance }} memory usage is above 85% (current value: {{ printf \"%.2f\" $value }}%)"
        - alert: NodeDiskSpaceUsage
          expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} disk usage is high"
            description: "Node {{ $labels.instance }} disk usage on {{ $labels.mountpoint }} is above 85% (current value: {{ printf \"%.2f\" $value }}%)"
        - alert: NodeCPUHighUsage
          expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} has high CPU usage"
            description: "Node {{ $labels.instance }} CPU usage is above 90% (current value: {{ printf \"%.2f\" $value }}%)"
    # ArgoCD alerts live only in argocd-sync-alerts.yaml, Longhorn alerts only in longhorn-alerts.yaml — duplicating them here double-pages.
    - name: monitoring.stack.health
      interval: 30s
      rules:
        - alert: PrometheusTargetDown
          expr: up == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus target {{ $labels.instance }} is down"
            description: "Prometheus target {{ $labels.instance }} for job {{ $labels.job }} has been down for more than 10 minutes."
        - alert: PrometheusConfigurationReloadFailure
          expr: prometheus_config_last_reload_successful != 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Prometheus configuration reload failure"
            description: "Prometheus {{ $labels.instance }} configuration reload has failed."
        - alert: AlertmanagerConfigurationReloadFailure
          expr: alertmanager_config_last_reload_successful != 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Alertmanager configuration reload failure"
            description: "Alertmanager {{ $labels.instance }} configuration reload has failed."
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: custom-application-alerts
  namespace: prometheus-stack
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/managed-by: Helm
    prometheus: kube-prometheus-stack-prometheus
    role: alert-rules
spec:
  groups:
    # Application-specific alerts for your workloads
    - name: applications.health
      interval: 60s
      rules:
        - alert: ApplicationHighMemoryUsage
          expr: max by (namespace,pod,container)(container_memory_working_set_bytes{container!="",container!="POD"}) / on (namespace,pod,container) max by (namespace,pod,container)(kube_pod_container_resource_limits{resource="memory",unit="byte"}) * 100 > 90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} has high memory usage"
            description: "Container {{ $labels.container }} memory usage is above 90% of its limit (current value: {{ printf \"%.2f\" $value }}%)"
    # Network and connectivity alerts
    - name: network.connectivity
      interval: 30s
      rules:
        # kube-state-metrics emits `condition` in LOWERCASE ("true"); condition="True" matches nothing and this fires for every Running pod.
        # phase series are 0/1 per phase — filter == 1 or non-Running pods match via their value-0 row.
        - alert: PodNetworkUnavailable
          expr: |
            (kube_pod_status_phase{phase="Running"} == 1)
            unless on (namespace, pod)
            (kube_pod_status_ready{condition="true"} == 1)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} network may be unavailable"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is running but not ready, which may indicate network issues."
