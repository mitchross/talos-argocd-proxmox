apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: grafana-dashboards
  annotations:
    grafana_folder: "AI"
configMapGenerator:
  - name: ai-gateway-analytics-dashboard
    files:
      - ai-gateway-analytics.json
  - name: gpu-overview-dashboard
    files:
      - gpu-overview.json
  - name: hermes-ai-split-dashboard
    files:
      - hermes-ai-split.json
  - name: llm-engines-dashboard
    files:
      - llm-engines.json
  - name: pi-routing-dashboard
    files:
      - pi-routing.json
  - name: strata-inference-dashboard
    files:
      - strata-inference.json
  - name: vllm-inference-dashboard
    files:
      - vllm-inference.json
