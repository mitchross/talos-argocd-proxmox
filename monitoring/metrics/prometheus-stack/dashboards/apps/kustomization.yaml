apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: grafana-dashboards
  annotations:
    grafana_folder: "Apps"
configMapGenerator:
  - name: frigate-monitoring-dashboard
    files:
      - frigate-monitoring.json
  - name: posthog-performance-dashboard
    files:
      - posthog-performance.json
  - name: radar-ng-mobile-dashboard
    files:
      - radar-ng-mobile.json
  - name: radar-ng-dashboard
    files:
      - radar-ng.json
