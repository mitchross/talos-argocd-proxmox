# kube-prometheus-stack values, rendered through helmCharts in kustomization.yaml.
global:
  imageRegistry: ""
  imagePullSecrets: []
crds:
  enabled: true
defaultRules:
  disabled:
    # Single-worker cluster: these demand N-1 failover headroom that cannot exist here.
    KubeCPUOvercommit: true
    KubeMemoryOvercommit: true
    # Fires for every kept failed Job, even after the CronJob's next run succeeds.
    # Replaced by CronJobLastRunFailed + StandaloneJobFailed in custom-alerts.yaml.
    KubeJobFailed: true
# Prometheus Configuration
prometheus:
  enabled: true
  prometheusSpec:
    retention: 15d
    # PVC below is 50Gi; retentionSize leaves headroom for WAL/compaction.
    retentionSize: 40GB
    walCompression: true
    storageSpec:
      volumeClaimTemplate:
        metadata:
          # Intentionally backup-exempt: metrics are re-scrapeable within retention.
          labels:
            backup-exempt: "true"
          annotations:
            storage.vanillax.dev/backup-exempt-reason: "Prometheus metrics are re-scrapeable; monitoring data not worth backup pipeline overhead"
        spec:
          # Two wired copies keep metrics up when the GPU node is down (~6 GB/day written).
          # The operator never moves the bound PVC: delete it to change class.
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
    resources:
      requests:
        cpu: 500m
        memory: 3Gi
      # Head series fill ~5 GiB; the cap must also leave page cache or queries thrash TSDB reads.
      limits:
        memory: 14Gi
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534
    scrapeInterval: 30s
    evaluationInterval: 30s
    scrapeTimeout: 10s
    # false = select every ServiceMonitor/PodMonitor/rule in any namespace, not just this release's.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # Control-plane jobs discover CP nodes via kubernetes_sd role:node, never static IPs (cluster is destroyed/recreated via Omni).
    # Needs the control-plane-performance machineconfig patch (etcd 2381, controller-manager 10257, scheduler 10259 on 0.0.0.0); job names must match the chart's default rules/dashboards.
    additionalScrapeConfigs:
      # Physical hosts use standard exporters declared in host-monitoring/.
      - job_name: physical-node
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
          - targets: ["192.168.10.14:9100"]
            labels:
              physical_host: threadripper
              host_type: proxmox
          - targets: ["192.168.10.21:9100"]
            labels:
              physical_host: hp-sff
              host_type: proxmox
          - targets: ["192.168.10.20:9100"]
            labels:
              physical_host: hp-shed
              host_type: proxmox
          - targets: ["192.168.10.133:9100"]
            labels:
              physical_host: truenas
              host_type: nas
          - targets: ["192.168.10.15:9100"]
            labels:
              physical_host: pi
              host_type: management
        metric_relabel_configs:
          - source_labels: [device]
            regex: "(?:/dev/)?(.+)"
            target_label: disk
            replacement: "${1}"
          # SMART identifies NVMe controllers; diskstats identifies their namespaces.
          - source_labels: [disk]
            regex: "(nvme[0-9]+)n[0-9]+"
            target_label: disk
            replacement: "${1}"
          - action: labeldrop
            regex: "serial|serial_number|wwn"
      - job_name: physical-logs
        scrape_interval: 30s
        static_configs:
          - targets: ["192.168.10.14:8889"]
            labels:
              physical_host: threadripper
          - targets: ["192.168.10.21:8889"]
            labels:
              physical_host: hp-sff
          - targets: ["192.168.10.20:8889"]
            labels:
              physical_host: hp-shed
          - targets: ["192.168.10.15:8889"]
            labels:
              physical_host: pi
      - job_name: physical-smartctl
        scrape_interval: 60s
        scrape_timeout: 45s
        static_configs:
          - targets: ["192.168.10.14:9633"]
            labels:
              physical_host: threadripper
              host_type: proxmox
          - targets: ["192.168.10.21:9633"]
            labels:
              physical_host: hp-sff
              host_type: proxmox
          - targets: ["192.168.10.20:9633"]
            labels:
              physical_host: hp-shed
              host_type: proxmox
          - targets: ["192.168.10.133:9633"]
            labels:
              physical_host: truenas
              host_type: nas
          - targets: ["192.168.10.15:9633"]
            labels:
              physical_host: pi
              host_type: management
        metric_relabel_configs:
          - source_labels: [device]
            regex: "(?:/dev/)?(.+)"
            target_label: disk
            replacement: "${1}"
          # SMART identifies NVMe controllers; diskstats identifies their namespaces.
          - source_labels: [disk]
            regex: "(nvme[0-9]+)n[0-9]+"
            target_label: disk
            replacement: "${1}"
          - action: labeldrop
            regex: "serial|serial_number|wwn"
      # rpi4 in the shed: the epsolar service (github.com/mitchross/epsolar) serves both the
      # legacy epever_* and the epsolar_*/solar_buffer_* metrics on 8080.
      - job_name: 'epever-solar'
        metrics_path: /metrics
        scheme: http
        scrape_interval: 15s
        static_configs:
          - targets: ['192.168.10.174:8080']
            labels:
              instance: 'rpi4-solar'
              location: 'home'
      - job_name: 'kube-etcd'
        scheme: http
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          # labelpresent is more robust than matching the empty-string value of node-role.kubernetes.io/control-plane.
          - source_labels: [__meta_kubernetes_node_labelpresent_node_role_kubernetes_io_control_plane]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            target_label: __address__
            replacement: ${1}:2381
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
      - job_name: 'kube-controller-manager'
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_labelpresent_node_role_kubernetes_io_control_plane]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            target_label: __address__
            replacement: ${1}:10257
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
      - job_name: 'kube-scheduler'
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_labelpresent_node_role_kubernetes_io_control_plane]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            target_label: __address__
            replacement: ${1}:10259
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
    remoteWrite: []
    alerting:
      alertmanagers:
        - namespace: prometheus-stack
          name: kube-prometheus-stack-alertmanager
          port: 9093
# Alertmanager Configuration
alertmanager:
  enabled: true
  alertmanagerSpec:
    strategy:
      type: Recreate
    storage:
      volumeClaimTemplate:
        metadata:
          # Intentionally backup-exempt: Alertmanager silences are operator-set and trivially recreated.
          labels:
            backup-exempt: "true"
          annotations:
            storage.vanillax.dev/backup-exempt-reason: "Alertmanager silences are operator-set; trivially recreated"
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534
    retention: 72h
    configSecret: ""
  # No push receiver yet: alerts are viewed in Alertmanager/Grafana. Watchdog and InfoInhibitor route to null.
  config:
    route:
      receiver: "null"
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      # This list REPLACES the chart's default child routes — Watchdog->null must be restated; never deliver InfoInhibitor.
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: "null"
          matchers:
            - alertname = "InfoInhibitor"
    receivers:
      # This receivers list REPLACES the chart's — omitting "null" fails operator validation and the old config silently stays live.
      - name: "null"
# Grafana Configuration
grafana:
  enabled: true
  deploymentStrategy:
    type: Recreate
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 10Gi
    accessModes:
      - ReadWriteOnce
    # Intentionally backup-exempt: dashboards/datasources are GitOps-managed.
    # The grafana chart ignores persistence.labels — PVC labels must go under extraPvcLabels.
    extraPvcLabels:
      backup-exempt: "true"
    annotations:
      storage.vanillax.dev/backup-exempt-reason: "Dashboards/datasources are GitOps-managed; only user prefs in PVC"
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 2Gi
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    fsGroup: 472
  plugins: []
  # Sidecar discovers every grafana_dashboard=1 ConfigMap cluster-wide; the grafana_folder annotation picks its folder.
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      labelValue: "1"
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  # Stock dashboard bundle disabled: two dozen overlapping boards made triage a search problem.
  defaultDashboardsEnabled: false
  defaultDashboardsTimezone: UTC
  additionalDataSources:
    # Pinned UIDs: dashboards, derived fields and trace links reference these.
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki-gateway.loki-stack.svc.cluster.local
      jsonData:
        httpHeaderName1: X-Scope-OrgID
        timeout: 60
        maxLines: 1000
        derivedFields:
          - datasourceUid: tempo
            matcherType: label
            matcherRegex: trace_id
            name: TraceID
            url: "$${__value.raw}"
      secureJsonData:
        httpHeaderValue1: "1"
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.monitoring.svc:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
          spanStartTimeShift: -5m
          spanEndTimeShift: 5m
        lokiSearch:
          datasourceUid: loki
        nodeGraph:
          enabled: true
  grafana.ini:
    server:
      root_url: https://grafana.vanillax.me
    dashboards:
      # Sidecar path = /tmp/dashboards/<grafana_folder>/<file>; renaming the folder breaks the home page.
      default_home_dashboard_path: /tmp/dashboards/Start Here/performance-cockpit.json
    security:
      allow_embedding: true
      cookie_secure: true
      strict_transport_security: true
    analytics:
      reporting_enabled: false
      check_for_updates: false
    snapshots:
      external_enabled: false
    explore:
      enabled: true
# Node Exporter Configuration
nodeExporter:
  enabled: true
prometheus-node-exporter:
  hostRootFsMount:
    enabled: true
    mountPropagation: HostToContainer
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
kubeStateMetrics:
  enabled: true
# Expose PVC backup labels so alerts/dashboards can distinguish backup-exempt PVCs.
kube-state-metrics:
  prometheus:
    monitor:
      metricRelabelings:
        # unreferenced pod/replicaset/configmap/secret/service/endpointslice state (~17k series); owner metrics stay
        - sourceLabels: [__name__]
          action: drop
          regex: (kube_configmap_created|kube_configmap_info|kube_configmap_metadata_resource_version|kube_endpointslice_created|kube_endpointslice_endpoints|kube_endpointslice_info|kube_endpointslice_ports|kube_persistentvolumeclaim_status_condition|kube_pod_container_info|kube_pod_container_state_started|kube_pod_container_status_last_terminated_exitcode|kube_pod_container_status_last_terminated_timestamp|kube_pod_container_status_ready|kube_pod_container_status_running|kube_pod_container_status_terminated|kube_pod_container_status_waiting|kube_pod_created|kube_pod_ips|kube_pod_restart_policy|kube_pod_scheduler|kube_pod_service_account|kube_pod_start_time|kube_pod_status_container_ready_time|kube_pod_status_initialized_time|kube_pod_status_qos_class|kube_pod_status_ready_time|kube_pod_status_scheduled|kube_pod_status_scheduled_time|kube_pod_tolerations|kube_replicaset_created|kube_replicaset_metadata_generation|kube_replicaset_spec_replicas|kube_replicaset_status_fully_labeled_replicas|kube_replicaset_status_observed_generation|kube_replicaset_status_ready_replicas|kube_replicaset_status_replicas|kube_replicaset_status_terminating_replicas|kube_secret_created|kube_secret_info|kube_secret_metadata_resource_version|kube_secret_type|kube_service_created|kube_service_info|kube_service_spec_type)
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  metricLabelsAllowlist:
    - persistentvolumeclaims=[backup-exempt]
  rbac:
    extraRules:
      - apiGroups: ["apiextensions.k8s.io"]
        resources: ["customresourcedefinitions"]
        verbs: ["list", "watch"]
      - apiGroups: ["autoscaling.k8s.io"]
        resources: ["verticalpodautoscalers"]
        verbs: ["list", "watch"]
      - apiGroups: ["longhorn.io"]
        resources: ["volumes"]
        verbs: ["list", "watch"]
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: autoscaling.k8s.io
              kind: "VerticalPodAutoscaler"
              version: "v1"
            labelsFromPath:
              namespace: [metadata, namespace]
              target_api_version: [spec, targetRef, apiVersion]
              target_kind: [spec, targetRef, kind]
              target_name: [spec, targetRef, name]
              verticalpodautoscaler: [metadata, name]
            metricNamePrefix: "kube"
            errorLogV: 10
            metrics:
              - name: "verticalpodautoscaler_spec_updatepolicy_updatemode"
                help: "Update mode of the VerticalPodAutoscaler."
                each:
                  type: StateSet
                  stateSet:
                    labelName: "update_mode"
                    path: [spec, updatePolicy, updateMode]
                    # VPA 1.7 uses InPlaceOrRecreate for active policies. Keep
                    # the legacy states too so a rollback remains observable.
                    list: ["Auto", "Initial", "Off", "Recreate", "InPlaceOrRecreate"]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_lowerbound_memory"
                help: "Minimum memory resources the container can use before the VerticalPodAutoscaler updater evicts it."
                commonLabels:
                  unit: "byte"
                  resource: "memory"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [lowerBound, memory]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_lowerbound_cpu"
                help: "Minimum cpu resources the container can use before the VerticalPodAutoscaler updater evicts it."
                commonLabels:
                  unit: "core"
                  resource: "cpu"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [lowerBound, cpu]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_upperbound_memory"
                help: "Maximum memory resources the container can use before the VerticalPodAutoscaler updater evicts it."
                commonLabels:
                  unit: "byte"
                  resource: "memory"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [upperBound, memory]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_upperbound_cpu"
                help: "Maximum cpu resources the container can use before the VerticalPodAutoscaler updater evicts it."
                commonLabels:
                  unit: "core"
                  resource: "cpu"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [upperBound, cpu]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_target_memory"
                help: "Target memory resources the VerticalPodAutoscaler recommends for the container."
                commonLabels:
                  unit: "byte"
                  resource: "memory"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [target, memory]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_target_cpu"
                help: "Target cpu resources the VerticalPodAutoscaler recommends for the container."
                commonLabels:
                  unit: "core"
                  resource: "cpu"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [target, cpu]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_uncappedtarget_memory"
                help: "Target memory resources the VerticalPodAutoscaler recommends for the container ignoring bounds."
                commonLabels:
                  unit: "byte"
                  resource: "memory"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [uncappedTarget, memory]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_uncappedtarget_cpu"
                help: "Target cpu resources the VerticalPodAutoscaler recommends for the container ignoring bounds."
                commonLabels:
                  unit: "core"
                  resource: "cpu"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [uncappedTarget, cpu]
          - groupVersionKind:
              group: longhorn.io
              version: v1beta2
              kind: Volume
            metricNamePrefix: kube_customresource
            labelsFromPath:
              namespace: [metadata, namespace]
              volume: [metadata, name]
            metrics:
              - name: longhorn_volume_desired_replicas
                help: Configured replica target for each Longhorn volume.
                each:
                  type: Gauge
                  gauge:
                    path: [spec, numberOfReplicas]
# Prometheus Operator Configuration
prometheusOperator:
  enabled: true
  # cert-manager for webhook certs: the chart's Helm hook Jobs lose their SA under ArgoCD and wedge the sync permanently.
  admissionWebhooks:
    certManager:
      enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
# Additional monitoring components
# Series trimming (#3104): drops only series no dashboard or rule reads. Histogram _sum/_count stay, so
# averages still work; only quantile buckets go. Setting metricRelabelings replaces the chart defaults,
# so those are repeated first. Measured 2026-10-26 on the live head block (series per scrape).
kubelet:
  enabled: true
  serviceMonitor:
    interval: 30s
    metricRelabelings:
      # chart default
      - sourceLabels: [__name__, le]
        action: drop
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
      # unreferenced quantile buckets (~12k series)
      - sourceLabels: [__name__]
        action: drop
        regex: (apiserver_storage_data_key_generation_duration_seconds_bucket|csi_operations_seconds_bucket|dra_operations_duration_seconds_bucket|kubelet_cgroup_manager_duration_seconds_bucket|kubelet_http_requests_duration_seconds_bucket|kubelet_image_pull_duration_seconds_bucket|kubelet_pod_start_duration_seconds_bucket|kubelet_pod_start_sli_duration_seconds_bucket|kubelet_pod_start_total_duration_seconds_bucket|kubelet_runtime_operations_duration_seconds_bucket|kubelet_topology_manager_admission_duration_ms_bucket|kubelet_volume_metric_collection_duration_seconds_bucket|prober_probe_duration_seconds_bucket|rest_client_rate_limiter_duration_seconds_bucket|rest_client_request_duration_seconds_bucket|rest_client_request_size_bytes_bucket|rest_client_response_size_bytes_bucket|storage_operation_duration_seconds_bucket|volume_operation_total_seconds_bucket|workqueue_queue_duration_seconds_bucket|workqueue_work_duration_seconds_bucket|kubernetes_feature_enabled)
    cAdvisorMetricRelabelings:
      # chart defaults
      - sourceLabels: [__name__]
        action: drop
        regex: container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)
      - sourceLabels: [__name__]
        action: drop
        regex: container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)
      - sourceLabels: [__name__]
        action: drop
        regex: container_memory_mapped_file
      - sourceLabels: [__name__]
        action: drop
        regex: container_(file_descriptors|tasks_state|threads_max)
      - sourceLabels: [__name__, scope]
        action: drop
        regex: container_memory_failures_total;hierarchy
      - sourceLabels: [__name__, interface]
        action: drop
        regex: container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*
      - sourceLabels: [__name__]
        action: drop
        regex: container_spec.*
      - sourceLabels: [id, pod]
        action: drop
        regex: .+;
      # unreferenced per-container cgroup counters (~25k series)
      - sourceLabels: [__name__]
        action: drop
        regex: (container_blkio_device_usage_total|container_creation_time_seconds|container_health_state|container_last_seen|container_memory_events_high_total|container_memory_events_max_total|container_memory_failcnt|container_memory_failures_total|container_memory_file_dirty_bytes|container_memory_file_writeback_bytes|container_memory_kernel_usage|container_memory_max_usage_bytes|container_memory_pgscan_total|container_memory_pgsteal_total|container_memory_total_active_file_bytes|container_memory_total_inactive_file_bytes|container_memory_workingset_refault_anon_total|container_processes|container_sockets|container_start_time_seconds|container_threads|container_ulimits_soft|container_memory_failures_total)
kubeApiServer:
  enabled: true
  serviceMonitor:
    interval: 30s
    metricRelabelings:
      # chart default
      - sourceLabels: [__name__, le]
        action: drop
        regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
      # unreferenced quantile buckets (~55k series)
      - sourceLabels: [__name__]
        action: drop
        regex: (apiserver_admission_controller_admission_duration_seconds_bucket|apiserver_admission_webhook_admission_duration_seconds_bucket|apiserver_flowcontrol_demand_seats_bucket|apiserver_flowcontrol_priority_level_request_utilization_bucket|apiserver_flowcontrol_priority_level_seat_utilization_bucket|apiserver_flowcontrol_request_execution_seconds_bucket|apiserver_flowcontrol_request_wait_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_request_duration_seconds_bucket|apiserver_response_sizes_bucket|apiserver_storage_list_duration_seconds_bucket|apiserver_storage_transformation_duration_seconds_bucket|apiserver_watch_cache_initialization_duration_seconds_bucket|apiserver_watch_cache_read_wait_seconds_bucket|apiserver_watch_events_dispatch_duration_seconds_bucket|apiserver_watch_events_sizes_bucket|apiserver_watch_list_duration_seconds_bucket|informer_processing_latency_seconds_bucket|rest_client_request_duration_seconds_bucket|rest_client_request_size_bytes_bucket|rest_client_response_size_bytes_bucket|workqueue_queue_duration_seconds_bucket|workqueue_work_duration_seconds_bucket|kubernetes_feature_enabled)
# Off here: Talos hides the etcd/controller-manager/scheduler bind addresses from the chart's selectors, so the
# additionalScrapeConfigs jobs above scrape them; kube-proxy doesn't exist (Cilium replaces it).
