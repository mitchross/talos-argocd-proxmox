apiVersion: batch/v1
kind: CronJob
metadata:
  name: pod-cleanup
  namespace: pod-cleanup
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: pod-cleanup
          restartPolicy: Never
          containers:
          - name: cleanup
            image: bitnami/kubectl:latest@sha256:e0fcb25c485a8ad0665d0dd4b4a67cefb6baee32b0e3b19f54f1b468c49c1ed5
            command:
            - /bin/sh
            - -c
            - /opt/repo-scripts/cleanup-completed-pods.sh
            volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
          volumes:
          - name: repo-scripts
            configMap:
              name: pod-cleanup-scripts
              defaultMode: 0555
