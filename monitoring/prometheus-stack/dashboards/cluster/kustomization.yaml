apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: grafana-dashboards
  annotations:
    grafana_folder: "Cluster"
configMapGenerator:
  - name: argocd-dashboard
    files:
      - argocd.json
  - name: etcd-dashboard
    files:
      - etcd.json
  - name: hardware-diagnostics-dashboard
    files:
      - hardware-diagnostics.json
  - name: longhorn-dashboard
    files:
      - longhorn.json
  - name: trivy-operator-dashboard
    files:
      - trivy-operator.json
  - name: vpa-recommendations-dashboard
    files:
      - vpa-recommendations.json
