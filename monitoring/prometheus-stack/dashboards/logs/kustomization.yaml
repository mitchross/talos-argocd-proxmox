apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: grafana-dashboards
  annotations:
    grafana_folder: "Logs"
configMapGenerator:
  - name: loki-logs-app-dashboard
    files:
      - loki-logs-app.json
  - name: node-crash-logs-dashboard
    files:
      - node-crash-logs.json
