apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: grafana-dashboards
  annotations:
    grafana_folder: "Start Here"
configMapGenerator:
  - name: app-performance-investigator-dashboard
    files:
      - app-performance-investigator.json
  - name: performance-cockpit-dashboard
    files:
      - performance-cockpit.json
  - name: capacity-dashboard
    files:
      - capacity.json
