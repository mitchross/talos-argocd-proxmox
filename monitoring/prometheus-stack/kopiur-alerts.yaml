# Backup health from kopiur-controller-metrics:8081 (ServiceMonitor in custom-servicemonitors.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kopiur-alerts
  namespace: prometheus-stack
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/managed-by: Helm
    prometheus: kube-prometheus-stack-prometheus
    role: alert-rules
spec:
  groups:
    - name: kopiur.backup
      rules:
        - alert: KopiurSnapshotsFailing
          # Scraping renames the policy namespace to exported_namespace; this metric calls the policy name.
          expr: >-
            max by (namespace, policy) (
              label_replace(
                label_replace(kopiur_snapshot_consecutive_failures,
                  "namespace", "$1", "exported_namespace", "(.+)"),
                "policy", "$1", "name", "(.+)"
              )
            ) >= 3
          for: 10m
          labels:
            severity: warning
            component: kopiur
            category: backup
          annotations:
            summary: "kopiur backups failing repeatedly: {{ $labels.namespace }}/{{ $labels.policy }}"
            description: |
              {{ $value }} consecutive snapshot failures.
              Inspect policy {{ $labels.policy }} and its failed Snapshots:
              kubectl -n {{ $labels.namespace }} get snapshotpolicy,snapshot
              Check source volume health, repository access, and mover permissions.
        - alert: KopiurBackupStale
          # The 26h threshold covers daily schedules; it is not an hourly recovery-point guarantee.
          expr: >-
            time() - max by (namespace, policy) (
              label_replace(kopiur_policy_last_backup_success_timestamp_seconds,
                "namespace", "$1", "exported_namespace", "(.+)")
            ) > 26 * 3600
          for: 15m
          labels:
            severity: critical
            component: kopiur
            category: backup
          annotations:
            summary: "kopiur backup stale (>26h): {{ $labels.namespace }}/{{ $labels.policy }}"
            description: |
              No successful kopiur snapshot for policy {{ $labels.policy }} in over 26 hours.
              Inspect its schedule and failed Snapshots:
              kubectl -n {{ $labels.namespace }} get snapshotpolicy,snapshotschedule,snapshot
              Preserve the source volume before recovery; the latest backup may omit recent writes.
        - alert: KopiurCascadeDeletedSnapshots
          # onPolicyDelete: Retain is pinned in the kopiur-backup component — a mode="delete" cascade means the pin was bypassed and history is being destroyed.
          expr: increase(kopiur_policy_cascade_children_deleted_total{mode="delete"}[15m]) > 0
          for: 0m
          labels:
            severity: critical
            component: kopiur
            category: backup
          annotations:
            summary: "kopiur cascade-DELETED backup snapshots: {{ $labels.namespace }}"
            description: |
              A SnapshotPolicy deletion cascade removed {{ $value }} snapshot(s)
              from the repository in {{ $labels.namespace }}. With
              onPolicyDelete pinned to Retain (my-apps/common/kopiur-backup),
              this should be impossible — backup history is being destroyed.

              Actions:
              1. kubectl -n {{ $labels.namespace }} get snapshotpolicy -o yaml | grep -A2 deletion
                 (should show onPolicyDelete: Retain — if Delete, a stub overrode the component)
              2. Confirm the kopiur-backup component still pins Retain and the
                 rendered SnapshotPolicy carries it (kubectl kustomize <app>)
              3. Check kopiur-system controller logs for the cascade finalizer
        - alert: KopiurControllerDown
          expr: up{job="kopiur-controller-metrics"} == 0 or absent(up{job="kopiur-controller-metrics"})
          for: 15m
          labels:
            severity: critical
            component: kopiur
            category: backup
          annotations:
            summary: "kopiur controller metrics endpoint is down"
            description: |
              Prometheus cannot scrape kopiur-controller-metrics. Either the
              controller is down (no backups are running at all) or the
              ServiceMonitor/Service changed. Backup staleness alerts are
              blind while this fires.
