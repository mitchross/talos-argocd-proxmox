apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prometheus-stack
resources:
  - vpa.yaml
  - ns.yaml
  - grafana-externalsecret.yaml
  - alertmanager-http-route.yaml
  - grafana-http-route.yaml
  - prometheus-http-route.yaml
  - custom-alerts.yaml
  - custom-servicemonitors.yaml
  - longhorn-alerts.yaml # volume/node health (was longhorn-backup-alerts.yaml; dead backup-target alerts dropped 2026-07-06)
  - kopiur-alerts.yaml # kopiur backup staleness/failure alerts (the follow-up promised when volsync-alerts were retired 2026-06-27)
  - argocd-sync-alerts.yaml # ArgoCD control-plane + app-state alerts (stale-sync incident 2026-05-29)
  - admission-webhook-alerts.yaml # API-server-side webhook reachability; pod health cannot prove it
  - dcgm-exporter.yaml # DCGM GPU monitoring
  - gpu-alerts.yaml # GPU alerting rules
  - performance-cockpit-dashboard.yaml # Default Grafana home: plain-English cluster performance triage
  - app-performance-dashboard.yaml # Two-selector workload investigation with correlated Loki errors
  - posthog-performance-dashboard.yaml # PostHog web/Postgres/Kafka/ClickHouse root-cause decoder
  - gpu-dashboard.yaml # Grafana dashboard
  - vllm-dashboard.yaml # vLLM tokens/s + latency + KV cache + MTP acceptance
  - vpa-recommendations-dashboard.yaml # Active VPA policy and recommendation dashboard
  - trivy-dashboard.yaml # Trivy Operator vulnerability dashboard (Grafana 17813; pairs with monitoring/trivy-operator)
  - trivy-alerts.yaml # Trivy critical-vuln alerting (high per-image critical count)
  - etcd-dashboard.yaml # etcd cluster dashboard (Grafana 3070; pairs with kube-etcd scrape job)
  - network-policy.yaml # Allow Grafana to access Prometheus
  - frigate-dashboard.yaml # Frigate Grafana dashboard
  - loki-logs-dashboard.yaml # Custom Loki logs dashboard (uses OTEL labels)
  - solar-dashboard.yaml # Epever Solar MPPT dashboard
  - aircube-dashboard.yaml # StuckAtPrototype AirCube Zigbee air-quality (eCO2/tVOC/temp/humidity)
  - radar-ng-dashboard.yaml # radar-ng backend dashboard (logs + tile-server metrics)
  - radar-ng-mobile-dashboard.yaml # radar-ng mobile app dashboard (Tempo spans + Loki errors)

configMapGenerator:
  - name: prometheus-stack-scripts
    files:
      - scripts/prune-retired-dashboards.sh
  # Dashboard JSON lives in dashboards/ as real .json, not embedded in YAML, so diffs stay
  # readable and the files can be linted. The sidecar discovers them by the label below.
  - name: homelab-power-dashboard
    files:
      - dashboards/homelab-power.json
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/name: grafana-dashboards
  - name: tapo-power-dashboard
    files:
      - dashboards/tapo-power-monitoring.json
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/name: grafana-dashboards
  - name: shed-solar-dashboard
    files:
      - dashboards/shed-solar.json
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/name: grafana-dashboards
  # Copied from github.com/mitchross/epsolar grafana/; re-copy on upstream changes.
  - name: solar-buffer-control-dashboard
    files:
      - dashboards/solar-buffer-control.json
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/name: grafana-dashboards
# These CRD schemas push client-side apply's last-applied annotation past the 256KB cap — keep per-CRD ServerSideApply+Replace.
patches:
  - target:
      kind: CustomResourceDefinition
      name: scrapeconfigs.monitoring.coreos.com
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: ServerSideApply=true,Replace=true
  - target:
      kind: CustomResourceDefinition
      name: thanosrulers.monitoring.coreos.com
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: ServerSideApply=true,Replace=true
  - target:
      kind: CustomResourceDefinition
      name: alertmanagerconfigs.monitoring.coreos.com
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: ServerSideApply=true,Replace=true
  - target:
      kind: CustomResourceDefinition
      name: alertmanagers.monitoring.coreos.com
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: ServerSideApply=true,Replace=true
  - target:
      kind: CustomResourceDefinition
      name: prometheusagents.monitoring.coreos.com
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: ServerSideApply=true,Replace=true
  - target:
      kind: CustomResourceDefinition
      name: prometheuses.monitoring.coreos.com
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: ServerSideApply=true,Replace=true
helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 88.6.3
    releaseName: kube-prometheus-stack
    namespace: prometheus-stack
    valuesFile: values.yaml
    includeCRDs: true # This is the key setting!
