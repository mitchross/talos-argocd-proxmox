rule_files:
- inspection.rules.yaml
evaluation_interval: 1m
tests:
- name: parent pressure survives quiet child restarts
  interval: 1m
  input_series:
  - &id001
    series: container_memory_workingset_refault_file_total{namespace="prometheus-stack",pod="dcgm-test",node="gpu"}
    values: 0+120000x15
  - series: container_pressure_memory_waiting_seconds_total{namespace="prometheus-stack",pod="dcgm-test",node="gpu"}
    values: 0+30x15
  - series: container_memory_workingset_refault_file_total{namespace="prometheus-stack",pod="dcgm-test",node="gpu",container="dcgm-exporter"}
    values: 0+0x15
  alert_rule_test:
  - eval_time: 10m
    alertname: PodMemoryReclaimThrashing
    exp_alerts:
    - exp_labels:
        namespace: prometheus-stack
        pod: dcgm-test
        node: gpu
        severity: critical
      exp_annotations:
        summary: Memory reclaim is thrashing prometheus-stack/dcgm-test
        description: Over 1000 file-page refaults/sec and 10% memory pressure for five minutes. Inspect
          the pod and container memory budgets, memory.stat and disk reads; zero OOM kills does not rule
          out this fault.
- name: file reads without memory pressure do not imply thrashing
  interval: 1m
  input_series:
  - *id001
  - series: container_pressure_memory_waiting_seconds_total{namespace="prometheus-stack",pod="dcgm-test",node="gpu"}
    values: 0+0x15
  alert_rule_test:
  - eval_time: 10m
    alertname: PodMemoryReclaimThrashing
    exp_alerts: []
- name: stalled recovery job alerts after its runtime deadline
  interval: 1m
  input_series:
  - &id002
    series: kube_job_status_start_time{namespace="temporal-worker-controller",job_name="temporal-worker-controller-identity-recovery-123"}
    values: 0+0x20
  - series: kube_job_status_active{namespace="temporal-worker-controller",job_name="temporal-worker-controller-identity-recovery-123"}
    values: 1+0x20
  alert_rule_test:
  - eval_time: 4m
    alertname: TemporalRecoveryJobStalled
    exp_alerts: []
  - eval_time: 8m
    alertname: TemporalRecoveryJobStalled
    exp_alerts:
    - exp_labels:
        namespace: temporal-worker-controller
        job_name: temporal-worker-controller-identity-recovery-123
        severity: critical
      exp_annotations:
        summary: Temporal recovery Job temporal-worker-controller-identity-recovery-123 exceeded five
          minutes
        description: The four-minute active deadline should stop this Job. Check its live template and
          resource budget; an older active Job is not changed when the CronJob template syncs.
- name: completed recovery job does not alert
  interval: 1m
  input_series:
  - *id002
  - series: kube_job_status_active{namespace="temporal-worker-controller",job_name="temporal-worker-controller-identity-recovery-123"}
    values: 1+0x3 0+0x16
  alert_rule_test:
  - eval_time: 8m
    alertname: TemporalRecoveryJobStalled
    exp_alerts: []
- name: single failed webhook delivery is visible immediately
  interval: 1m
  input_series:
  - series: alertmanager_notifications_failed_total{namespace="prometheus-stack",integration="webhook"}
    values: 0+0x2 1+0x8
  alert_rule_test:
  - eval_time: 4m
    alertname: AlertmanagerWebhookDeliveryFailed
    exp_alerts:
    - exp_labels:
        namespace: prometheus-stack
        integration: webhook
        severity: critical
      exp_annotations:
        summary: Alertmanager webhook delivery failed
        description: A webhook notification failed. Inspect Alertmanager and Keep logs, including database
          connectivity; Keep 0.52.1 can misreport database failures as HTTP 401. This alert uses the same
          receiver and is also visible directly in Prometheus/Grafana.
