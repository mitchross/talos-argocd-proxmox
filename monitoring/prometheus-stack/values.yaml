# Enhanced kube-prometheus-stack configuration
# Optimized for production workloads with security and performance considerations

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
# CRD Configuration - Essential for proper functioning
crds:
  enabled: true
defaultRules:
  disabled:
    # Single-worker cluster: these demand N-1 failover headroom that cannot exist here.
    KubeCPUOvercommit: true
    KubeMemoryOvercommit: true
# Prometheus Configuration
prometheus:
  enabled: true
  prometheusSpec:
    # Data retention and storage
    retention: 15d
    # PVC below is 50Gi; leave headroom for WAL/compaction but don't strand
    # ~35Gi (was 15GB).
    retentionSize: 40GB
    walCompression: true
    # Storage configuration with Longhorn
    storageSpec:
      volumeClaimTemplate:
        metadata:
          # Intentionally backup-exempt: metrics are re-scrapeable within retention.
          labels:
            backup-exempt: "true"
          annotations:
            storage.vanillax.dev/backup-exempt-reason: "Prometheus metrics are re-scrapeable; monitoring data not worth backup pipeline overhead"
        spec:
          storageClassName: longhorn-flash
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
    resources:
      requests:
        cpu: 500m
        memory: 3Gi
      limits:
        memory: 6Gi
    # Security context
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534
    # Scrape configuration
    scrapeInterval: 30s
    evaluationInterval: 30s
    scrapeTimeout: 10s
    # Enable service discovery for dynamic targets
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # Control-plane jobs discover CP nodes via kubernetes_sd role:node, never static IPs (cluster is destroyed/recreated via Omni).
    # Needs the control-plane-performance machineconfig patch (etcd 2381, controller-manager 10257, scheduler 10259 on 0.0.0.0); job names must match the chart's default rules/dashboards.
    additionalScrapeConfigs:
      # Physical hosts use standard exporters declared in host-monitoring/.
      - job_name: physical-node
        scrape_interval: 30s
        scrape_timeout: 10s
        static_configs:
          - targets: ["192.168.10.14:9100"]
            labels:
              physical_host: threadripper
              host_type: proxmox
          - targets: ["192.168.10.16:9100"]
            labels:
              physical_host: dell
              host_type: proxmox
          - targets: ["192.168.10.21:9100"]
            labels:
              physical_host: hp-sff
              host_type: proxmox
          - targets: ["192.168.10.22:9100"]
            labels:
              physical_host: hp-elite
              host_type: proxmox
          - targets: ["192.168.10.20:9100"]
            labels:
              physical_host: hp-shed
              host_type: proxmox
          - targets: ["192.168.10.133:9100"]
            labels:
              physical_host: truenas
              host_type: nas
          - targets: ["192.168.10.15:9100"]
            labels:
              physical_host: pi
              host_type: management
        metric_relabel_configs:
          - source_labels: [device]
            regex: "(?:/dev/)?(.+)"
            target_label: disk
            replacement: "${1}"
          # SMART identifies NVMe controllers; diskstats identifies their namespaces.
          - source_labels: [disk]
            regex: "(nvme[0-9]+)n[0-9]+"
            target_label: disk
            replacement: "${1}"
          - action: labeldrop
            regex: "serial|serial_number|wwn"
      - job_name: physical-logs
        scrape_interval: 30s
        static_configs:
          - targets: ["192.168.10.14:8889"]
            labels:
              physical_host: threadripper
          - targets: ["192.168.10.16:8889"]
            labels:
              physical_host: dell
          - targets: ["192.168.10.21:8889"]
            labels:
              physical_host: hp-sff
          - targets: ["192.168.10.22:8889"]
            labels:
              physical_host: hp-elite
          - targets: ["192.168.10.20:8889"]
            labels:
              physical_host: hp-shed
          - targets: ["192.168.10.15:8889"]
            labels:
              physical_host: pi
      - job_name: physical-smartctl
        scrape_interval: 60s
        scrape_timeout: 45s
        static_configs:
          - targets: ["192.168.10.14:9633"]
            labels:
              physical_host: threadripper
              host_type: proxmox
          - targets: ["192.168.10.16:9633"]
            labels:
              physical_host: dell
              host_type: proxmox
          - targets: ["192.168.10.21:9633"]
            labels:
              physical_host: hp-sff
              host_type: proxmox
          - targets: ["192.168.10.22:9633"]
            labels:
              physical_host: hp-elite
              host_type: proxmox
          - targets: ["192.168.10.20:9633"]
            labels:
              physical_host: hp-shed
              host_type: proxmox
          - targets: ["192.168.10.133:9633"]
            labels:
              physical_host: truenas
              host_type: nas
          - targets: ["192.168.10.15:9633"]
            labels:
              physical_host: pi
              host_type: management
        metric_relabel_configs:
          - source_labels: [device]
            regex: "(?:/dev/)?(.+)"
            target_label: disk
            replacement: "${1}"
          # SMART identifies NVMe controllers; diskstats identifies their namespaces.
          - source_labels: [disk]
            regex: "(nvme[0-9]+)n[0-9]+"
            target_label: disk
            replacement: "${1}"
          - action: labeldrop
            regex: "serial|serial_number|wwn"
      # rpi4 in the shed: the epsolar service (github.com/mitchross/epsolar) serves both the
      # legacy epever_* and the epsolar_*/solar_buffer_* metrics on 8080. 9812 is retired.
      - job_name: 'epever-solar'
        metrics_path: /metrics
        scheme: http
        scrape_interval: 15s
        static_configs:
          - targets: ['192.168.10.174:8080']
            labels:
              instance: 'rpi4-solar'
              location: 'home'
      - job_name: 'kube-etcd'
        scheme: http
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          # labelpresent is more robust than matching the empty-string value of node-role.kubernetes.io/control-plane.
          - source_labels: [__meta_kubernetes_node_labelpresent_node_role_kubernetes_io_control_plane]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            target_label: __address__
            replacement: ${1}:2381
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
      - job_name: 'kube-controller-manager'
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_labelpresent_node_role_kubernetes_io_control_plane]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            target_label: __address__
            replacement: ${1}:10257
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
      - job_name: 'kube-scheduler'
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_labelpresent_node_role_kubernetes_io_control_plane]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            target_label: __address__
            replacement: ${1}:10259
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
    # Remote write configuration (for external storage if needed)
    remoteWrite: []
    # Alerting configuration
    alerting:
      alertmanagers:
        - namespace: prometheus-stack
          name: kube-prometheus-stack-alertmanager
          port: 9093
# Alertmanager Configuration
alertmanager:
  enabled: true
  alertmanagerSpec:
    strategy:
      type: Recreate
    # Storage for alertmanager
    storage:
      volumeClaimTemplate:
        metadata:
          # Intentionally backup-exempt: Alertmanager silences are operator-set and trivially recreated.
          labels:
            backup-exempt: "true"
          annotations:
            storage.vanillax.dev/backup-exempt-reason: "Alertmanager silences are operator-set; trivially recreated"
        spec:
          storageClassName: longhorn-flash
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
    # Resource allocation
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    # Security context
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534
    # Retention
    retention: 72h
    configSecret: ""
  # Keep console (keep.vanillax.me) is the delivery destination; Watchdog and InfoInhibitor route to null.
  config:
    route:
      receiver: "keep"
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      # This list REPLACES the chart's default child routes — Watchdog->null must be restated; never deliver InfoInhibitor.
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: "null"
          matchers:
            - alertname = "InfoInhibitor"
    receivers:
      # This receivers list REPLACES the chart's — omitting "null" fails operator validation and the old config silently stays live.
      - name: "null"
      - name: "keep"
        webhook_configs:
          - url: "http://keep-backend.keep.svc.cluster.local:8080/alerts/event/prometheus"
            send_resolved: true
            # Keep's NOAUTH verifier accepts any credential but rejects NONE —
            # this placeholder is not a secret, it just has to exist.
            http_config:
              basic_auth:
                username: api_key
                password: noauth
# Grafana Configuration
grafana:
  enabled: true
  deploymentStrategy:
    type: Recreate
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  # Persistence
  persistence:
    enabled: true
    storageClassName: longhorn-flash
    size: 10Gi
    accessModes:
      - ReadWriteOnce
    # Intentionally backup-exempt: dashboards/datasources are GitOps-managed.
    # The grafana chart ignores persistence.labels — PVC labels must go under extraPvcLabels.
    extraPvcLabels:
      backup-exempt: "true"
    annotations:
      storage.vanillax.dev/backup-exempt-reason: "Dashboards/datasources are GitOps-managed; only user prefs in PVC"
  # Resource allocation
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 2Gi
  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    fsGroup: 472
  # Enable plugins
  plugins: []
  # Sidecar discovers every grafana_dashboard=1 ConfigMap cluster-wide; the grafana_folder annotation picks its folder.
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      labelValue: "1"
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  # Stock dashboard bundle disabled: two dozen overlapping boards made triage a search problem.
  defaultDashboardsEnabled: false
  defaultDashboardsTimezone: UTC
  # Additional data sources configuration
  additionalDataSources:
    # Pinned UIDs: dashboards, derived fields and trace links reference these.
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki-gateway.loki-stack.svc.cluster.local
      jsonData:
        httpHeaderName1: X-Scope-OrgID
        timeout: 60
        maxLines: 1000
        derivedFields:
          - datasourceUid: tempo
            matcherType: label
            matcherRegex: trace_id
            name: TraceID
            url: "$${__value.raw}"
      secureJsonData:
        httpHeaderValue1: "1"
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.monitoring.svc:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
          spanStartTimeShift: -5m
          spanEndTimeShift: 5m
        lokiSearch:
          datasourceUid: loki
        nodeGraph:
          enabled: true
  # Grafana configuration
  grafana.ini:
    server:
      root_url: https://grafana.vanillax.me
    dashboards:
      # Sidecar path = /tmp/dashboards/<grafana_folder>/<file>; renaming the folder breaks the home page.
      default_home_dashboard_path: /tmp/dashboards/Start Here/performance-cockpit.json
    security:
      allow_embedding: true
      cookie_secure: true
      strict_transport_security: true
    analytics:
      reporting_enabled: false
      check_for_updates: false
    snapshots:
      external_enabled: false
    explore:
      enabled: true
# Node Exporter Configuration
# Enable for comprehensive node-level metrics (VPA-optimized 2026-02-28)
nodeExporter:
  enabled: true
prometheus-node-exporter:
  hostRootFsMount:
    enabled: true
    mountPropagation: HostToContainer
  # Resource allocation
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
kubeStateMetrics:
  enabled: true
# Expose PVC backup labels so alerts/dashboards can distinguish backup-exempt PVCs.
kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  metricLabelsAllowlist:
    # kube-state-metrics sanitizes cnpg.io/cluster to label_cnpg_io_cluster.
    - persistentvolumeclaims=[backup-exempt,cnpg.io/cluster]
  rbac:
    extraRules:
      - apiGroups: ["apiextensions.k8s.io"]
        resources: ["customresourcedefinitions"]
        verbs: ["list", "watch"]
      - apiGroups: ["autoscaling.k8s.io"]
        resources: ["verticalpodautoscalers"]
        verbs: ["list", "watch"]
      - apiGroups: ["longhorn.io"]
        resources: ["volumes"]
        verbs: ["list", "watch"]
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: autoscaling.k8s.io
              kind: "VerticalPodAutoscaler"
              version: "v1"
            labelsFromPath:
              namespace: [metadata, namespace]
              target_api_version: [spec, targetRef, apiVersion]
              target_kind: [spec, targetRef, kind]
              target_name: [spec, targetRef, name]
              verticalpodautoscaler: [metadata, name]
            metricNamePrefix: "kube"
            errorLogV: 10
            metrics:
              - name: "verticalpodautoscaler_spec_updatepolicy_updatemode"
                help: "Update mode of the VerticalPodAutoscaler."
                each:
                  type: StateSet
                  stateSet:
                    labelName: "update_mode"
                    path: [spec, updatePolicy, updateMode]
                    # VPA 1.7 uses InPlaceOrRecreate for active policies. Keep
                    # the legacy states too so a rollback remains observable.
                    list: ["Auto", "Initial", "Off", "Recreate", "InPlaceOrRecreate"]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_lowerbound_memory"
                help: "Minimum memory resources the container can use before the VerticalPodAutoscaler updater evicts it."
                commonLabels:
                  unit: "byte"
                  resource: "memory"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [lowerBound, memory]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_lowerbound_cpu"
                help: "Minimum cpu resources the container can use before the VerticalPodAutoscaler updater evicts it."
                commonLabels:
                  unit: "core"
                  resource: "cpu"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [lowerBound, cpu]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_upperbound_memory"
                help: "Maximum memory resources the container can use before the VerticalPodAutoscaler updater evicts it."
                commonLabels:
                  unit: "byte"
                  resource: "memory"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [upperBound, memory]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_upperbound_cpu"
                help: "Maximum cpu resources the container can use before the VerticalPodAutoscaler updater evicts it."
                commonLabels:
                  unit: "core"
                  resource: "cpu"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [upperBound, cpu]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_target_memory"
                help: "Target memory resources the VerticalPodAutoscaler recommends for the container."
                commonLabels:
                  unit: "byte"
                  resource: "memory"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [target, memory]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_target_cpu"
                help: "Target cpu resources the VerticalPodAutoscaler recommends for the container."
                commonLabels:
                  unit: "core"
                  resource: "cpu"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [target, cpu]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_uncappedtarget_memory"
                help: "Target memory resources the VerticalPodAutoscaler recommends for the container ignoring bounds."
                commonLabels:
                  unit: "byte"
                  resource: "memory"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [uncappedTarget, memory]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_uncappedtarget_cpu"
                help: "Target cpu resources the VerticalPodAutoscaler recommends for the container ignoring bounds."
                commonLabels:
                  unit: "core"
                  resource: "cpu"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [uncappedTarget, cpu]
          - groupVersionKind:
              group: longhorn.io
              version: v1beta2
              kind: Volume
            metricNamePrefix: kube_customresource
            labelsFromPath:
              namespace: [metadata, namespace]
              volume: [metadata, name]
            metrics:
              - name: longhorn_volume_desired_replicas
                help: Configured replica target for each Longhorn volume.
                each:
                  type: Gauge
                  gauge:
                    path: [spec, numberOfReplicas]
# Prometheus Operator Configuration
prometheusOperator:
  enabled: true
  # cert-manager for webhook certs: the chart's Helm hook Jobs lose their SA under ArgoCD and wedge the sync permanently.
  admissionWebhooks:
    certManager:
      enabled: true
  # Resource allocation
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
# Additional monitoring components
kubelet:
  enabled: true
  serviceMonitor:
    interval: 30s
# Talos hides these bind addresses, so we disable scraping to avoid target down alerts
kubeApiServer:
  enabled: true
  serviceMonitor:
    interval: 30s
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: true
  serviceMonitor:
    interval: 30s
kubeDns:
  enabled: false
