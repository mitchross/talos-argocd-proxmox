# Enhanced kube-prometheus-stack configuration
# Optimized for production workloads with security and performance considerations

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
# CRD Configuration - Essential for proper functioning
crds:
  enabled: true
defaultRules:
  disabled:
    # Effectively a single-worker cluster: these fire when requests exceed
    # N-1 nodes' capacity, i.e. they demand failover headroom that cannot
    # exist here. Actual utilization alerts (NodeMemoryRequestsHigh) remain.
    KubeCPUOvercommit: true
    KubeMemoryOvercommit: true
# Prometheus Configuration
prometheus:
  enabled: true
  prometheusSpec:
    # Data retention and storage
    retention: 15d
    # PVC below is 50Gi; leave headroom for WAL/compaction but don't strand
    # ~35Gi (was 15GB).
    retentionSize: 40GB
    walCompression: true
    # Storage configuration with Longhorn
    storageSpec:
      volumeClaimTemplate:
        metadata:
          # Intentionally backup-exempt. Prometheus metrics are re-scrapeable
          # within retention; restoring 15d of historical metrics from a backup
          # snapshot is not worth the I/O. The 2026-05-03 backup-label
          # migration was reverted same-day after explicit decision that
          # monitoring data does not warrant the backup pipeline overhead.
          labels:
            backup-exempt: "true"
          annotations:
            storage.vanillax.dev/backup-exempt-reason: "Prometheus metrics are re-scrapeable; monitoring data not worth backup pipeline overhead"
        spec:
          storageClassName: longhorn-flash
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
    # Resource allocation (memory bumped 2026-05-04)
    # Capacity baseline 2026-05-04 showed Prometheus pod at 2.0 GiB observed
    # against the 4 GiB limit ceiling (request=2 Gi was at limit-of-use).
    # Retention 15d + WAL + chunk caches will keep growing; raising headroom
    # to avoid OOM as series count grows.
    resources:
      requests:
        cpu: 500m
        memory: 3Gi
      limits:
        memory: 6Gi
    # Security context
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534
    # Scrape configuration
    scrapeInterval: 30s
    evaluationInterval: 30s
    scrapeTimeout: 10s
    # Enable service discovery for dynamic targets
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # Additional scrape configs for custom monitoring
    #
    # Control plane scraping (etcd / kube-controller-manager / kube-scheduler)
    # uses kubernetes_sd_configs role:node + relabeling to discover CP nodes
    # by label rather than hardcoding IPs. This is intentional: the cluster
    # is regularly destroyed/recreated via Omni machine classes, so any
    # static IP list (chart's `kubeEtcd.endpoints:` field, DHCP reservations,
    # static machineconfig IPs) would break on every rebuild.
    #
    # Requires the matching Talos machineconfig patch in
    # omni/cluster-template/cluster-template.yaml control-plane-performance:
    #   etcd.listen-metrics-urls: http://0.0.0.0:2381
    #   controllerManager.bind-address: 0.0.0.0   (port 10257)
    #   scheduler.bind-address: 0.0.0.0           (port 10259)
    #
    # Job names match what the chart's default PrometheusRules and Grafana
    # dashboards expect, so KubeControllerManagerDown / KubeSchedulerDown /
    # etcd* alerts and the standard etcd dashboard "just work".
    additionalScrapeConfigs:
      - job_name: 'epever-solar'
        metrics_path: /metrics
        scheme: http
        scrape_interval: 15s
        static_configs:
          - targets: ['192.168.10.174:9812']
            labels:
              instance: 'rpi4-solar'
              location: 'home'
      - job_name: 'kube-etcd'
        scheme: http
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          # Keep only control-plane nodes. Talos applies the standard
          # node-role.kubernetes.io/control-plane label automatically; using
          # `labelpresent` is more robust than matching the (empty-string) value.
          - source_labels: [__meta_kubernetes_node_labelpresent_node_role_kubernetes_io_control_plane]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            target_label: __address__
            replacement: ${1}:2381
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
      - job_name: 'kube-controller-manager'
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_labelpresent_node_role_kubernetes_io_control_plane]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            target_label: __address__
            replacement: ${1}:10257
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
      - job_name: 'kube-scheduler'
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_labelpresent_node_role_kubernetes_io_control_plane]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            target_label: __address__
            replacement: ${1}:10259
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
    # Remote write configuration (for external storage if needed)
    remoteWrite: []
    # Alerting configuration
    alerting:
      alertmanagers:
        - namespace: prometheus-stack
          name: kube-prometheus-stack-alertmanager
          port: 9093
    # Accept OTLP metrics on /api/v1/otlp — the OTEL gateway collector exports
    # its metrics pipeline (k8s_cluster, kubeletstats, app OTLP) here and was
    # getting 404s while this was off (chart default is false).
    enableOTLPReceiver: true
# Alertmanager Configuration
alertmanager:
  enabled: true
  alertmanagerSpec:
    strategy:
      type: Recreate
    # Storage for alertmanager
    storage:
      volumeClaimTemplate:
        metadata:
          # Intentionally backup-exempt. Alertmanager state (silences,
          # inhibitions, notification log) is operator-set and trivially
          # recreated; not worth backup pipeline overhead.
          labels:
            backup-exempt: "true"
          annotations:
            storage.vanillax.dev/backup-exempt-reason: "Alertmanager silences are operator-set; trivially recreated"
        spec:
          storageClassName: longhorn-flash
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
    # Resource allocation
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    # Security context
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534
    # Retention
    retention: 72h
    configSecret: ""
  # Delivery destination is the Keep console (keep.vanillax.me) — web UI, not
  # chat/email. Watchdog and InfoInhibitor are Alertmanager-internal plumbing
  # and route to null; everything else lands in the Keep feed.
  config:
    route:
      receiver: "keep"
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      # This list REPLACES the chart's default child routes, so Watchdog->null
      # must be restated here. InfoInhibitor is a routing artifact (it exists
      # only to inhibit info-severity alerts) — never deliver it.
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: "null"
          matchers:
            - alertname = "InfoInhibitor"
    receivers:
      # The chart merges its default Watchdog->null child route into this
      # config, but this receivers list REPLACES the chart's — omitting
      # "null" fails operator validation ("undefined receiver") and the old
      # config silently stays live.
      - name: "null"
      - name: "keep"
        webhook_configs:
          - url: "http://keep-backend.keep.svc.cluster.local:8080/alerts/event/prometheus"
            send_resolved: true
            # Keep's NOAUTH verifier accepts any credential but rejects NONE —
            # this placeholder is not a secret, it just has to exist.
            http_config:
              basic_auth:
                username: api_key
                password: noauth
# Grafana Configuration
grafana:
  enabled: true
  deploymentStrategy:
    type: Recreate
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  # Persistence
  persistence:
    enabled: true
    storageClassName: longhorn-flash
    size: 10Gi
    accessModes:
      - ReadWriteOnce
    # Intentionally backup-exempt. Grafana dashboards and datasource
    # configs are GitOps-managed; only user prefs / unsaved drafts live
    # in the PVC. Not worth backup pipeline overhead.
    # NOTE: the grafana chart ignores `persistence.labels`; PVC labels
    # must go under `extraPvcLabels` (verified against grafana-12.4.2).
    extraPvcLabels:
      backup-exempt: "true"
    annotations:
      storage.vanillax.dev/backup-exempt-reason: "Dashboards/datasources are GitOps-managed; only user prefs in PVC"
  # Resource allocation
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    fsGroup: 472
  # Enable plugins
  plugins: []
  # Sidecar configuration - discover dashboards from all namespaces
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      labelValue: "1"
  # Community dashboards are downloaded onto Grafana's persistent data volume.
  # Removing a gnetId from values does not remove the old JSON file, so prune
  # only the retired dashboard files before Grafana's downloader runs.
  extraInitContainers:
    - name: prune-retired-dashboards
      image: docker.io/library/busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-ec"]
      args:
        - |
          find /var/lib/grafana/dashboards/kubernetes \
            -maxdepth 1 -type f -name '*.json' -delete 2>/dev/null || true
          find /var/lib/grafana/dashboards/infrastructure \
            -maxdepth 1 -type f -name 'vpa-autoscaling.json' -delete 2>/dev/null || true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 472
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: storage
          mountPath: /var/lib/grafana
  # The chart's stock dashboard bundle is intentionally disabled. It added
  # two dozen overlapping Kubernetes boards and made incident triage a search
  # problem. The GitOps-managed performance cockpit is the starting point;
  # specialist boards stay available when the cockpit links to them.
  defaultDashboardsEnabled: false
  defaultDashboardsTimezone: UTC
  # Community dashboards - auto-provisioned from grafana.com
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'grafana-dashboards-kubernetes'
        orgId: 1
        folder: 'Kubernetes'
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards/kubernetes
      - name: 'grafana-dashboards-infrastructure'
        orgId: 1
        folder: 'Infrastructure'
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards/infrastructure
      - name: 'grafana-dashboards-logging'
        orgId: 1
        folder: 'Logging'
        type: file
        disableDeletion: false
        editable: false
        options:
          path: /var/lib/grafana/dashboards/logging
  dashboards:
    # The broad community Kubernetes boards duplicated the same signals across
    # global/namespace/node/pod screens. The performance cockpit plus its
    # workload investigator replace that maze.
    kubernetes: {}
    # Loki dashboards moved to custom ConfigMaps (loki-logs-dashboard.yaml)
    # because community dashboards use Promtail's 'job' label but we use OTEL
    # which sends logs with 'service_name' label instead
    logging: {}
    infrastructure:
      argocd:
        gnetId: 14584
        revision: 1
        datasource: Prometheus
      longhorn:
        gnetId: 13032
        revision: 6
        datasource: Prometheus
      cloudnative-pg:
        gnetId: 20417
        revision: 3
        datasource: Prometheus
  # Additional data sources configuration
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.loki-stack.svc.cluster.local
      jsonData:
        httpHeaderName1: X-Scope-OrgID
        timeout: 60
        maxLines: 1000
        derivedFields:
          - datasourceUid: prometheus-uid
            matcherRegex: "(?:logger=rpc\\.server|report).*?(?:traceID|trace_id)=([a-f\\d]+)"
            name: TraceID
            url: "$${__value.raw}"
      secureJsonData:
        httpHeaderValue1: "1"
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc:3200
  # Grafana configuration
  grafana.ini:
    server:
      root_url: https://grafana.vanillax.me
    dashboards:
      # The dashboard sidecar writes this GitOps-managed file into the shared
      # /tmp/dashboards volume. Opening Grafana now lands on the cockpit.
      default_home_dashboard_path: /tmp/dashboards/performance-cockpit.json
    security:
      allow_embedding: true
      cookie_secure: true
      strict_transport_security: true
    analytics:
      reporting_enabled: false
      check_for_updates: false
    snapshots:
      external_enabled: false
    explore:
      enabled: true
    feature_toggles:
      enable: correlations
# Node Exporter Configuration
# Enable for comprehensive node-level metrics (VPA-optimized 2026-02-28)
nodeExporter:
  enabled: true
  hostRootFsMount:
    enabled: true
    mountPropagation: HostToContainer
  # Resource allocation
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
kubeStateMetrics:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
# kube-state-metrics sub-chart values. Expose PVC backup labels so alerts
# and dashboards can distinguish backup-exempt and CNPG-managed PVCs.
# (The ProtectedPVCSkipRestoreStale alert this originally served was retired
# with pvc-plumber 2026-06-27; kopiur backup health is alerted via
# kopiur-alerts.yaml instead.)
kube-state-metrics:
  metricLabelsAllowlist:
    # backup-exempt surfaces explicitly-exempt PVCs; cnpg.io/cluster distinguishes
    # CNPG-managed PVCs (Barman to S3, not kopiur). kube-state-metrics sanitizes
    # the label name to label_cnpg_io_cluster.
    - persistentvolumeclaims=[backup-exempt,cnpg.io/cluster]
  rbac:
    extraRules:
      - apiGroups: ["apiextensions.k8s.io"]
        resources: ["customresourcedefinitions"]
        verbs: ["list", "watch"]
      - apiGroups: ["autoscaling.k8s.io"]
        resources: ["verticalpodautoscalers"]
        verbs: ["list", "watch"]
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: autoscaling.k8s.io
              kind: "VerticalPodAutoscaler"
              version: "v1"
            labelsFromPath:
              namespace: [metadata, namespace]
              target_api_version: [spec, targetRef, apiVersion]
              target_kind: [spec, targetRef, kind]
              target_name: [spec, targetRef, name]
              verticalpodautoscaler: [metadata, name]
            metricNamePrefix: "kube"
            errorLogV: 10
            metrics:
              - name: "verticalpodautoscaler_spec_updatepolicy_updatemode"
                help: "Update mode of the VerticalPodAutoscaler."
                each:
                  type: StateSet
                  stateSet:
                    labelName: "update_mode"
                    path: [spec, updatePolicy, updateMode]
                    # VPA 1.7 uses InPlaceOrRecreate for active policies. Keep
                    # the legacy states too so a rollback remains observable.
                    list: ["Auto", "Initial", "Off", "Recreate", "InPlaceOrRecreate"]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_lowerbound_memory"
                help: "Minimum memory resources the container can use before the VerticalPodAutoscaler updater evicts it."
                commonLabels:
                  unit: "byte"
                  resource: "memory"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [lowerBound, memory]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_lowerbound_cpu"
                help: "Minimum cpu resources the container can use before the VerticalPodAutoscaler updater evicts it."
                commonLabels:
                  unit: "core"
                  resource: "cpu"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [lowerBound, cpu]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_upperbound_memory"
                help: "Maximum memory resources the container can use before the VerticalPodAutoscaler updater evicts it."
                commonLabels:
                  unit: "byte"
                  resource: "memory"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [upperBound, memory]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_upperbound_cpu"
                help: "Maximum cpu resources the container can use before the VerticalPodAutoscaler updater evicts it."
                commonLabels:
                  unit: "core"
                  resource: "cpu"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [upperBound, cpu]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_target_memory"
                help: "Target memory resources the VerticalPodAutoscaler recommends for the container."
                commonLabels:
                  unit: "byte"
                  resource: "memory"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [target, memory]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_target_cpu"
                help: "Target cpu resources the VerticalPodAutoscaler recommends for the container."
                commonLabels:
                  unit: "core"
                  resource: "cpu"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [target, cpu]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_uncappedtarget_memory"
                help: "Target memory resources the VerticalPodAutoscaler recommends for the container ignoring bounds."
                commonLabels:
                  unit: "byte"
                  resource: "memory"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [uncappedTarget, memory]
              - name: "verticalpodautoscaler_status_recommendation_containerrecommendations_uncappedtarget_cpu"
                help: "Target cpu resources the VerticalPodAutoscaler recommends for the container ignoring bounds."
                commonLabels:
                  unit: "core"
                  resource: "cpu"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [uncappedTarget, cpu]
# Prometheus Operator Configuration
prometheusOperator:
  enabled: true
  # Use cert-manager for webhook certs instead of Helm hook Jobs.
  # The default hook Jobs (admission-create/admission-patch) create a
  # ServiceAccount as a hook resource, then Jobs that depend on it.
  # ArgoCD can delete the SA before the patch Job runs, causing a
  # permanent stuck sync that cascades into API server overload.
  admissionWebhooks:
    certManager:
      enabled: true
  # Resource allocation
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
# Additional monitoring components
kubelet:
  enabled: true
  serviceMonitor:
    interval: 30s
# Talos hides these bind addresses, so we disable scraping to avoid target down alerts
kubeApiServer:
  enabled: true
  serviceMonitor:
    interval: 30s
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: true
  serviceMonitor:
    interval: 30s
kubeDns:
  enabled: false
