apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# INTENTIONAL OUTLIER: tempo lives in the shared monitoring namespace — moving it means PVC churn + Grafana datasource URL changes.
namespace: monitoring
resources:
- vpa.yaml
- ns.yaml
- externalsecret.yaml
helmCharts:
- name: tempo
  repo: https://grafana.github.io/helm-charts
  version: 1.24.4 # Latest
  releaseName: tempo
  valuesFile: values.yaml
