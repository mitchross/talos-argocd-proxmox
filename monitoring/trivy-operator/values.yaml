# Conservative rollout: vuln + exposed-secret scanning only; keep concurrency and metric cardinality low.

# All namespaces with a denylist; dvwa is intentionally vulnerable and would drown the dashboard.
targetNamespaces: ""
excludeNamespaces: "dvwa"

# Redpanda images rate-limit unauthenticated pulls — every scan fails; excluded to stop the retry loop.
trivyOperator:
  excludeImages: "docker.redpanda.com/*/*"

operator:
  # Low concurrency: at most 2 scan jobs at once. Homelab nodes, not a fleet.
  scanJobsConcurrentLimit: 2
  scanJobTimeout: 10m
  # Default 30s retry creates a tight loop of OOMKilled/error scans. Back off
  # to 15m so failed jobs don't hammer the node on every reconcile.
  scanJobsRetryDelay: 15m
  # Standalone mode: multi-container workloads share /tmp/trivy/.cache and hit BoltDB flock timeouts; server mode centralizes the cache.
  builtInTrivyServer: true
  # Registries are public; don't grant cluster-wide Secret/SA reads just for pull creds.
  accessGlobalSecretsAndServiceAccount: false

  # --- Phase 1 scanners: ON ---
  vulnerabilityScannerEnabled: true
  exposedSecretScannerEnabled: true
  sbomGenerationEnabled: false

  # --- Deferred scanners: OFF until vuln scanning proves its worth ---
  configAuditScannerEnabled: false
  rbacAssessmentScannerEnabled: false
  infraAssessmentScannerEnabled: false
  clusterComplianceEnabled: false

  # Only scan the current revision of a workload, not every historical ReplicaSet.
  vulnerabilityScannerScanOnlyCurrentRevisions: true
  configAuditScannerScanOnlyCurrentRevisions: true

  # Per-CVE-id metrics (metricsVulnIdEnabled) are a cardinality bomb — keep OFF.
  metricsFindingsEnabled: true
  metricsVulnIdEnabled: false

# Any ServiceMonitor is selected (nil selectors); label matches the custom-servicemonitors.yaml convention.
serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack

# Operator pod hardening. The chart defaults already drop capabilities and make
# the root filesystem read-only, but do not set runAsNonRoot/seccomp.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

# Operator deployment resources. Scan jobs have their own resources below.
resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 500m
    # 512Mi OOM-killed the operator ~2.5min after every start (exit 137)
    # once the report count grew; it never stayed up long enough to reconcile.
    memory: 1Gi

trivy:
  image:
    # A newer tag alone does not fix the Standalone cache-lock bug; builtInTrivyServer above is still required.
    tag: 0.72.0
  # Cache is disposable; emptyDir avoids a Longhorn PVC that would need a backup exemption.
  storageClassEnabled: false
  # Hide vulnerabilities with no available fix — pure noise you can't action.
  ignoreUnfixed: true
  timeout: "10m0s"
  server:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1
        memory: 1Gi
    podSecurityContext:
      runAsUser: 65534
      runAsNonRoot: true
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsNonRoot: true
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      # Posthog images (worker, migrate, presenton) exceed 512Mi during analysis.
      # Bump to 1Gi to avoid OOMKilled retry loops.
      memory: 1Gi

# Chart renders default ClusterComplianceReports unless this list is empty — keep off while the scanner is disabled above.
compliance:
  specs: []
