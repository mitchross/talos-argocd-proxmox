# VPA policy is owned with this application so Argo prunes it with the target.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: ninfer-server
  namespace: ninfer
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ninfer-server
  updatePolicy:
    # Whole-card GPU workload under active benchmarking: learn recommendations
    # without mutating the pod mid-measurement.
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledResources: ["cpu", "memory"]
        controlledValues: RequestsOnly
