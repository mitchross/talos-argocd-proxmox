apiVersion: batch/v1
kind: Job
metadata:
  name: comfyui-download-models
  namespace: comfyui
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 86400  # Auto-cleanup after 24h
  activeDeadlineSeconds: 3600     # 1 hour timeout for auxiliary files (~15GB)
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: comfyui-model-downloader
    spec:
      restartPolicy: OnFailure
      containers:
      - name: downloader
        image: python:3.14-slim
        command:
        - bash
        - -c
        - /opt/repo-scripts/download-models.sh

        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: comfyui-secrets
              key: HF_TOKEN
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            memory: "4Gi"
        volumeMounts:
        - name: repo-scripts
          mountPath: /opt/repo-scripts
          readOnly: true
        - name: comfyui-storage
          mountPath: /models
          subPath: models
      volumes:
      - name: repo-scripts
        configMap:
          name: comfyui-download-scripts
          defaultMode: 0555
      - name: comfyui-storage
        persistentVolumeClaim:
          claimName: comfyui-storage-smb
