apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: comfyui

resources:
- namespace.yaml
- pvc.yaml
- deployment.yaml
- service.yaml
- httproute.yaml
- externalsecret.yaml
- download-models-job.yaml

configMapGenerator:
  - name: comfyui-manager-config
    files:
      - config.ini
  - name: comfyui-pre-start
    files:
      - pre-start.sh
  - name: comfyui-custom-nodes
    files:
      - image_to_llamacpp_base64.py
  - name: comfyui-download-scripts
    files:
      - scripts/download-models.sh

labels:
  # Keep true: selectors are immutable on live Deployments; flipping to false forces delete/recreate.
  - includeSelectors: true
    pairs:
      app: comfyui
