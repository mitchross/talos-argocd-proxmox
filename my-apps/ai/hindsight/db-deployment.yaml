apiVersion: apps/v1
kind: Deployment
metadata:
  name: hindsight-db
  namespace: hindsight
  labels:
    app: hindsight-db
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate # RWO PVC — old pod must release the volume first
  selector:
    matchLabels:
      app: hindsight-db
  template:
    metadata:
      labels:
        app: hindsight-db
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: hindsight
            - name: POSTGRES_USER
              value: hindsight
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hindsight-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "hindsight", "-d", "hindsight"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "hindsight"]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "hindsight"]
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
          env:
          - name: DATA_SOURCE_URI
            value: 127.0.0.1:5432/hindsight?sslmode=disable
          - name: DATA_SOURCE_USER
            value: hindsight
          - name: DATA_SOURCE_PASS
            valueFrom:
              secretKeyRef:
                name: hindsight-secrets
                key: POSTGRES_PASSWORD
          ports:
          - name: metrics
            containerPort: 9187
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hindsight-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: hindsight-db
  namespace: hindsight
  labels:
    app: hindsight-db
spec:
  selector:
    app: hindsight-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
