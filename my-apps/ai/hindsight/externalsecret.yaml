apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-secrets
  namespace: hindsight
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: hindsight-secrets
    creationPolicy: Owner
  data:
    # 1Password item "hindsight" (tenant_api_key, db_password).
    # tenant_api_key MUST match HINDSIGHT_API_KEY in ~/.hermes/.env on the desktop.
    - secretKey: HINDSIGHT_API_TENANT_API_KEY
      remoteRef:
        key: hindsight
        property: tenant_api_key
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: hindsight
        property: db_password
