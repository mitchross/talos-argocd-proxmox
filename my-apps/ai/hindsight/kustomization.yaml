apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hindsight

resources:
  - namespace.yaml
  - externalsecret.yaml
  - pvc.yaml
  - db-deployment.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - vpa.yaml
  - kopiur/hindsight-db.yaml

# Uniform kopiur backup fields (repository, copyMethod, populator) for the per-PVC stub(s) in kopiur/.
components:
  - ../../common/kopiur-backup
