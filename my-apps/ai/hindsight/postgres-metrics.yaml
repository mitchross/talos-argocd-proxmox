apiVersion: v1
kind: Service
metadata:
  name: hindsight-db-metrics
  namespace: hindsight
  labels:
    app.kubernetes.io/name: hindsight-db
    app.kubernetes.io/component: postgres-metrics
spec:
  selector:
    app: hindsight-db
  ports:
  - name: metrics
    port: 9187
    targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hindsight-db
  namespace: hindsight
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hindsight-db
      app.kubernetes.io/component: postgres-metrics
  endpoints:
  - port: metrics
    interval: 30s
    scrapeTimeout: 10s
