apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hindsight-db-pvc
  namespace: hindsight
  annotations:
    # Immutable dataSourceRef on a Bound PVC — mask the SSA dry-run diff
    # (the AppSet ignoreDifferences handles the live compare).
    argocd.argoproj.io/compare-options: ServerSideDiff=false
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
  # kopiur restore-before-bind: Pending until the Restore populator hydrates it; CRs in kopiur/hindsight-db.yaml.
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: hindsight-db-pvc-restore
