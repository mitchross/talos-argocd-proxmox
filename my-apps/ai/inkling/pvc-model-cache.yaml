# Same node-local NVMe as vLLM's cache (/var/mnt/ai-model-cache); Inkling writes only its inkling/ subPath.
# A local PV binds one claim, so each namespace gets its own PV for the same path.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ai-model-cache-inkling-local
spec:
  # Informational only for a local PV; the real ceiling is the shared 450G volume (~23 GB used here).
  capacity:
    storage: 40Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ai-model-cache-local
  volumeMode: Filesystem
  local:
    path: /var/mnt/ai-model-cache
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: gpu-worker
              operator: In
              values:
                - "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-model-cache-inkling
  namespace: inkling
  labels:
    backup-exempt: "true"
  annotations:
    storage.vanillax.dev/backup-exempt-reason: "Node-local GGUF; re-downloaded from the revision pinned in model-manifest.json"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 40Gi
  storageClassName: ai-model-cache-local
  volumeName: ai-model-cache-inkling-local
