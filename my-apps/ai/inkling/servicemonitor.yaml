# llama-server serves Prometheus text at /metrics only with --metrics (llamacpp:* names, not vLLM's).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: inkling
  namespace: inkling
  labels:
    app: inkling-server
spec:
  selector:
    matchLabels:
      app: inkling-server
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
