apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-clickhouse
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: langfuse-clickhouse
  template:
    metadata:
      labels:
        app: langfuse-clickhouse
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: clickhouse
        image: clickhouse/clickhouse-server:26.8.2.7@sha256:fa394da808cc53f76d0344429421d6c422a6ee85fe7450135c0e3cff4df9bcbb
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 101
          runAsGroup: 101
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8123
        - name: native
          containerPort: 9000
        - name: metrics
          containerPort: 9363
        env:
        - name: CLICKHOUSE_DB
          value: langfuse
        - name: CLICKHOUSE_USER
          value: langfuse
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: clickhouse-password
        - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
          value: '1'
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 8Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/clickhouse
        # subPath, not a directory mount: the image's entrypoint writes default-user.xml into this dir at start.
        - name: settings
          mountPath: /etc/clickhouse-server/users.d/langfuse-settings.xml
          subPath: clickhouse-settings.xml
          readOnly: true
        - name: settings
          mountPath: /etc/clickhouse-server/config.d/langfuse-prometheus.xml
          subPath: clickhouse-prometheus.xml
          readOnly: true
        startupProbe:
          httpGet:
            path: /ping
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /ping
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /ping
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: langfuse-clickhouse-data
      - name: settings
        configMap:
          name: langfuse-clickhouse-settings
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langfuse-clickhouse-data
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: '0'
    argocd.argoproj.io/compare-options: ServerSideDiff=false
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: langfuse-clickhouse-data-restore
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-clickhouse
  namespace: langfuse
  labels:
    app: langfuse-clickhouse
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  selector:
    app: langfuse-clickhouse
  ports:
  - name: http
    port: 8123
    targetPort: http
  - name: native
    port: 9000
    targetPort: native
  - name: metrics
    port: 9363
    targetPort: metrics
