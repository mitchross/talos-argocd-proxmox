apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: langfuse-route
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  parentRefs:
  - kind: Gateway
    name: gateway-internal-technitium
    namespace: gateway
  hostnames:
  - langfuse.vanillax.me
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    timeouts:
      request: 5m
      backendRequest: 5m
    backendRefs:
    - name: langfuse-web
      port: 3000
