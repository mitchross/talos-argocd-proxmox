apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-redis
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: langfuse-redis
  template:
    metadata:
      labels:
        app: langfuse-redis
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: redis
        image: valkey/valkey:9.1-alpine@sha256:a0dbf4c1d5708782907c10e2c72deff317518518b5288a58416981d9db95d30b
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 999
          runAsGroup: 999
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - name: redis
          containerPort: 6379
        env:
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              name: langfuse-secrets
              key: redis-password
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /data
        args:
        - --requirepass
        - $(REDISCLI_AUTH)
        - --appendonly
        - 'yes'
        - --appendfsync
        - everysec
        - --maxmemory
        - 512mb
        - --maxmemory-policy
        - noeviction
        startupProbe:
          exec:
            command:
            - valkey-cli
            - ping
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - valkey-cli
            - ping
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - valkey-cli
            - ping
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: langfuse-redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langfuse-redis-data
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: '0'
    storage.vanillax.dev/backup-exempt-reason: Disposable Langfuse cache/job queue;
      AOF survives restarts, but queued jobs can be lost on total volume loss.
  labels:
    backup-exempt: 'true'
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-redis
  namespace: langfuse
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  selector:
    app: langfuse-redis
  ports:
  - name: redis
    port: 6379
    targetPort: redis
