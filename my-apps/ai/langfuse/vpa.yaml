---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: langfuse-redis
  namespace: langfuse
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: langfuse-redis
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
    - containerName: redis
      # Single-threaded; starving its CPU share delays replies past the clients' socket timeout.
      minAllowed:
        cpu: '200m'
      controlledResources:
      - cpu
      - memory
      controlledValues: RequestsOnly
      maxAllowed:
        cpu: '1'
        memory: 1Gi
