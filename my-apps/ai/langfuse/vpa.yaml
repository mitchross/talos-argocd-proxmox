apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: langfuse-web
  namespace: langfuse
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: langfuse-web
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
    - containerName: langfuse-web
      # Node event loop stalls at VPA's idle-usage CPU (23m) and trips Langfuse's 30s Redis watchdog into a reconnect spiral.
      minAllowed:
        cpu: '1'
      controlledResources:
      - cpu
      - memory
      controlledValues: RequestsOnly
      maxAllowed:
        cpu: '2'
        memory: 4Gi
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: langfuse-worker
  namespace: langfuse
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: langfuse-worker
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
    - containerName: langfuse-worker
      # Same Redis-watchdog stall as langfuse-web; idle usage is not a safe CPU floor here.
      minAllowed:
        cpu: '1'
      controlledResources:
      - cpu
      - memory
      controlledValues: RequestsOnly
      maxAllowed:
        cpu: '2'
        memory: 4Gi
---
apiVersion: autoscaling.k8s.io/v1
