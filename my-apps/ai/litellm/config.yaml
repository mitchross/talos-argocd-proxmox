model_list:
  # The default local model name every app uses. Served by Strata (Qwen3.8-Flash-Next IQ3_S, both 3090s);
  # vLLM is parked. max_parallel_requests = Strata's batch slots (PARALLEL in my-apps/ai/strata/kustomization.yaml):
  # one request more gets LiteLLM's own 429 instead of a place in Strata's queue, is retried twice (~2-3 s, it takes
  # a slot that frees meanwhile), then router_settings.fallbacks sends it to deepseek-flash (paid, leaves home).
  # The limit is per deployment and per LiteLLM pod (1 replica); the other Strata routes below have their own.
  - model_name: qwen3.8-27b
    litellm_params:
      model: openai/qwen3.8-flash-next-iq3_s
      api_base: http://strata-service.strata.svc.cluster.local:8080/v1
      api_key: "strata-no-key-required"
      timeout: 1800
      max_parallel_requests: 2
    model_info:
      # Self-hosted — pin explicitly rather than rely on LiteLLM's cost map.
      input_cost_per_token: 0
      output_cost_per_token: 0
      # Strata's context (vLLM had 262K). A longer prompt gets Strata's 400; LiteLLM's regular fallbacks
      # don't exclude 400s, so it should reach deepseek-flash too (read from the v1.106.6 router, not tested).
      max_input_tokens: 131072
  # Strata only, never the cloud: no limit and no fallback, so a busy Strata queues these (one per free slot).
  - model_name: qwen3.8-flash-next
    litellm_params:
      model: openai/qwen3.8-flash-next-iq3_s
      api_base: http://strata-service.strata.svc.cluster.local:8080/v1
      api_key: "strata-no-key-required"
      timeout: 1800
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0
      max_input_tokens: 131072
  # Same backend as qwen3.8-27b under Pi's own names. One slot each: Pi's traffic overflows to DeepSeek
  # (the -auto fallback, or the classifier's default_model) rather than taking Strata's slots from the apps.
  - model_name: qwen3.8-27b-auto
    litellm_params:
      model: openai/qwen3.8-flash-next-iq3_s
      api_base: http://strata-service.strata.svc.cluster.local:8080/v1
      api_key: "strata-no-key-required"
      timeout: 1800
      max_parallel_requests: 1
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0
      # pi-auto's context-window escalation reads the tier model's window.
      max_input_tokens: 131072
  - model_name: pi-classifier
    litellm_params:
      model: openai/qwen3.8-flash-next-iq3_s
      api_base: http://strata-service.strata.svc.cluster.local:8080/v1
      api_key: "strata-no-key-required"
      max_parallel_requests: 1
      max_tokens: 64
      # Qwen's chat sampling made the same ask classify SIMPLE/MEDIUM/COMPLEX
      # across repeat runs. A one-label verdict must be greedy, not sampled.
      temperature: 0
      top_p: 1
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
          preserve_thinking: false
    model_info:
      input_cost_per_token: 0
      output_cost_per_token: 0
  - model_name: deepseek-flash
    litellm_params:
      model: openrouter/~deepseek/deepseek-flash-latest
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 1800
    model_info:
      # Planning estimate only: alias targets and provider/time-window rates vary.
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000012
      cache_read_input_token_cost: 0.00000003
      max_input_tokens: 1048576
      max_output_tokens: 943718
  - model_name: pi-auto
    litellm_params:
      model: auto_router/complexity_router
      drop_params: true
      complexity_router_config:
        # Short incident reports scored SIMPLE with the keyword-only classifier.
        classifier_type: llm
        classifier_llm_config:
          model: pi-classifier
          classification_rubric: agentic
          timeout_ms: 30000
        classifier_fallback: default_model
        classifier_context_window_size: 4
        classifier_context_budget_chars: 8000
        classifier_context_include_assistant_turns: true
        # Qwen owns the local half of the workload: tests, refactors, code
        # explanation, cluster inspection. Escalation is what covers its misses.
        tiers:
          SIMPLE: qwen3.8-27b-auto
          MEDIUM: qwen3.8-27b-auto
          COMPLEX: deepseek-flash
          REASONING: deepseek-flash
        # OpenRouter's exposed Flash levels are low/high/max; xhigh is not one,
        # and drop_params would discard it silently.
        tier_model_configs:
          COMPLEX:
            - model_name: deepseek-flash
              litellm_params:
                reasoning_effort: high
          REASONING:
            - model_name: deepseek-flash
              litellm_params:
                reasoning_effort: max
        # every_request is required by stall_escalation: holding one decision
        # through the tool loop hides the very tool calls it watches.
        classification_mode: every_request
        # Rescue a task Qwen is stuck on: same tool call repeating or erroring.
        stall_escalation_enabled: true
        stall_escalation_window: 6
        stall_escalation_repeat_threshold: 3
        session_affinity: false
        # Defaults true since v1.102.0: without this the tier model's cap
        # replaces Pi's 32K, which is 943K on Flash.
        max_tokens_from_tier_model: false
        # A prompt truncated to fit Qwen's window is the hallucination we care
        # about most, so let an oversized request move up instead.
        enable_context_window_escalation: true
        context_window_escalation_buffer: 0.95
        return_raw_model_name: false
      # Classification failures resolve upward: guessing cheap is the expensive
      # mistake here.
      complexity_router_default_model: deepseek-flash
    model_info:
      # Reserve the 32K output allowance inside Qwen's 262K total window.
      max_input_tokens: 229376
      max_output_tokens: 32768

  # Speech-to-text on the gen12 iGPU (my-apps/ai/whisper, OpenVINO Model Server). OVMS accepts mp3/wav only.
  - model_name: whisper
    litellm_params:
      model: openai/whisper-large-v3-turbo
      api_base: http://whisper.whisper.svc.cluster.local:8000/v3
      api_key: "ovms-no-key-required"
      timeout: 1800
    model_info:
      mode: audio_transcription
      input_cost_per_second: 0
      output_cost_per_second: 0

litellm_settings:
  callbacks: ["prometheus", "langfuse_otel"]
  # Cover long-context requests beyond the built-in 600-second histogram ceiling.
  prometheus_latency_buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2, 5, 10, 30, 60, 120, 300, 420, 600, 900, 1200, 1800]
  require_auth_for_metrics_endpoint: true
  # Routes have different parameter sets; drop unsupported optional fields
  # rather than fail an otherwise valid request.
  drop_params: true

router_settings:
  # qwen3.8-27b: Strata busy (max_parallel_requests full), down, or the prompt too long -> deepseek-flash,
  # so a burst from many apps never queues behind Strata's slots. qwen3.8-flash-next has no fallback on purpose.
  fallbacks:
    - qwen3.8-27b-auto: ["deepseek-flash"]
    - qwen3.8-27b: ["deepseek-flash"]
  context_window_fallbacks:
    - qwen3.8-27b-auto: ["deepseek-flash"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
