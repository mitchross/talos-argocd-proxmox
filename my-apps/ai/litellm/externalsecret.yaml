apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  namespace: litellm
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: litellm-secrets
    creationPolicy: Owner
  data:
    # posthog_api_key must be the existing PostHog project token, not a random key.
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: litellm
        property: master_key
    - secretKey: MOONSHOT_API_KEY
      remoteRef:
        key: litellm
        property: moonshot_api_key
    - secretKey: POSTHOG_API_KEY
      remoteRef:
        key: litellm
        property: posthog_api_key
