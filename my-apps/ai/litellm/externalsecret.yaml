apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  namespace: litellm
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: litellm-secrets
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: litellm
        property: master_key
    - secretKey: MOONSHOT_API_KEY
      remoteRef:
        key: litellm
        property: moonshot_api_key
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef:
        key: langfuse
        property: public-key
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef:
        key: langfuse
        property: secret-key
