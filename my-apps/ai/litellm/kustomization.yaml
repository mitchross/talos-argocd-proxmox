apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: litellm

# List EVERY file here — unlisted YAML is never deployed (Kustomize only renders what's listed).
resources:
  - vpa.yaml
  - namespace.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  - httproute.yaml

configMapGenerator:
  - name: litellm-config
    files:
      - config.yaml
