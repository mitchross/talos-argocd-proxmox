# Hydrates the node-local NVMe cache from the verified NFS source PVC.
# Name+size only here: the wave -1 downloader already pins SHA-256, while a
# second hash pass would stream both retained model families through page cache.
apiVersion: batch/v1
kind: Job
metadata:
  name: llama-cpp-cache-sync
  namespace: llama-cpp
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 4
  activeDeadlineSeconds: 21600
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        gpu-worker: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: sync
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command:
            - /bin/sh
            - -ec
            - |
              SRC=/src/qwen3.8-flash-next-gguf
              DST=/dst/qwen3.8-flash-next-gguf
              mkdir -p \
                "$DST/unsloth-ud-q4-k-xl" \
                "$DST/atomic-ad-4.27-q4-k-m-m64"

              sync_one() {
                rel="$1"; s="$SRC/$rel"; d="$DST/$rel"
                want=$(stat -c %s "$s")
                if [ -f "$d" ] && [ "$(stat -c %s "$d")" = "$want" ]; then
                  echo "present: $rel ($want bytes)"; return
                fi
                echo "copying: $rel ($want bytes)"
                cp "$s" "$d.part" || { rm -f "$d.part"; exit 1; }
                got=$(stat -c %s "$d.part")
                [ "$got" = "$want" ] || { echo "SIZE MISMATCH $rel: $got != $want"; rm -f "$d.part"; exit 1; }
                mv "$d.part" "$d"
              }

              for i in 1 2 3 4; do
                sync_one "unsloth-ud-q4-k-xl/Qwen3.8-Flash-Next-UD-Q4_K_XL-0000$i-of-00004.gguf"
              done
              sync_one "mmproj-BF16.gguf"

              i=1
              while [ "$i" -le 33 ]; do
                shard=$(printf '%05d' "$i")
                sync_one "atomic-ad-4.27-q4-k-m-m64/Qwen3.8-Flash-Next-AD-4.27bpw-Q4_K_M-M64-${shard}-of-00033.gguf"
                i=$((i + 1))
              done
              sync_one "mmproj-F16.gguf"

              echo "=== RESULT ==="
              du -sb "$DST" | awk '{printf "cache: %s bytes (%.2f GiB)\n", $1, $1/1073741824}'
              df -h /dst
          resources:
            requests:
              cpu: 500m
              # The serving pod reserves 80 GiB on this node. The copy process
              # needs little anonymous memory; its file cache is reclaimable
              # and bounded by the 2 GiB limit below.
              memory: 64Mi
            limits:
              cpu: "4"
              memory: 2Gi
          volumeMounts:
            - name: src
              mountPath: /src
              readOnly: true
            - name: dst
              mountPath: /dst
      volumes:
        - name: src
          persistentVolumeClaim:
            claimName: llama-cpp-models-pvc
            readOnly: true
        - name: dst
          persistentVolumeClaim:
            claimName: ai-model-cache
