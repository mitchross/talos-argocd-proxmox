# Hydrates the node-local NVMe cache from the verified NFS source PVC.
# Name+size only here: the wave -1 downloader already pins SHA-256, while a
# second hash pass would stream both retained model families through page cache.
apiVersion: batch/v1
kind: Job
metadata:
  name: llama-cpp-cache-sync
  namespace: llama-cpp
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 4
  activeDeadlineSeconds: 21600
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        gpu-worker: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: sync
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command:
            - /bin/sh
            - -ec
            - /opt/repo-scripts/sync-model-cache.sh
          resources:
            requests:
              cpu: 500m
              # The serving pod reserves 80 GiB on this node. The copy process
              # needs little anonymous memory; its file cache is reclaimable
              # and bounded by the 2 GiB limit below.
              memory: 64Mi
            limits:
              cpu: "4"
              memory: 2Gi
          volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: src
              mountPath: /src
              readOnly: true
            - name: dst
              mountPath: /dst
      volumes:
        - name: repo-scripts
          configMap:
            name: llama-cpp-scripts
            defaultMode: 0555
        - name: src
          persistentVolumeClaim:
            claimName: llama-cpp-models-pvc
            readOnly: true
        - name: dst
          persistentVolumeClaim:
            claimName: ai-model-cache
