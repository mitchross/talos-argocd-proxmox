apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp-server
  namespace: llama-cpp
  labels:
    app: llama-cpp-server
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: llama-cpp-server
  template:
    metadata:
      labels:
        app: llama-cpp-server
    spec:
      enableServiceLinks: false
      restartPolicy: Always
      runtimeClassName: nvidia
      priorityClassName: gpu-workload-high
      terminationGracePeriodSeconds: 300
      nodeSelector:
        feature.node.kubernetes.io/pci-0300_10de.present: "true"
        gpu-worker: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: llama-cpp-server
          image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10236@sha256:fd68d13013141833e8214ecad6e1fbefb532db6a00b980cdecfe33603dbf2675
          imagePullPolicy: IfNotPresent
          command: ["/app/llama-server"]
          args:
            - --model
            - /models/qwen3.8-27b-gguf/unsloth-iq4xs/Qwen3.8-27B-UD-IQ4_XS.gguf
            - --mmproj
            - /models/qwen3.8-27b-gguf/mmproj-F16.gguf
            - --alias
            - qwen3.8-27b
            - --ctx-size
            - "131072"
            - --batch-size
            - "4096"
            - --ubatch-size
            - "512"
            - --n-gpu-layers
            - "99"
            - --flash-attn
            - on
            - --cache-type-k
            - q8_0
            - --cache-type-v
            - q8_0
            - --parallel
            - "1"
            - --spec-type
            - draft-mtp
            - --spec-draft-n-max
            - "2"
            - --jinja
            - --reasoning
            - off
            - --reasoning-format
            - deepseek
            - --temp
            - "0.7"
            - --top-p
            - "0.8"
            - --top-k
            - "20"
            - --min-p
            - "0.0"
            - --presence-penalty
            - "1.5"
            - --repeat-penalty
            - "1.0"
            - --metrics
            - --host
            - 0.0.0.0
            - --port
            - "8080"
          env:
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: LLAMA_ARG_CHAT_TEMPLATE_KWARGS
              value: '{"reasoning_effort":"low"}'
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 300
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              nvidia.com/gpu: "1"
              cpu: "6"
              memory: 32Gi
            limits:
              nvidia.com/gpu: "1"
              memory: 64Gi
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-models-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
