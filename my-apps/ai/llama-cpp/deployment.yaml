apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp-server
  namespace: llama-cpp
  labels:
    app: llama-cpp-server
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Active single-RTX-3090 backend. vLLM is parked at 0 by its Kustomization.
  replicas: 0
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: llama-cpp-server
  template:
    metadata:
      labels:
        app: llama-cpp-server
    spec:
      enableServiceLinks: false
      restartPolicy: Always
      runtimeClassName: nvidia
      priorityClassName: gpu-workload-high
      terminationGracePeriodSeconds: 300
      nodeSelector:
        feature.node.kubernetes.io/pci-0300_10de.present: "true"
        gpu-worker: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: llama-cpp-server
          # b10751 fixed the Qwen3.8-27B MTP KV-init regression seen in b10745;
          # b10752 is the next official CUDA12 image and is pinned to linux/amd64.
          image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10752@sha256:dde47811ea25c3a30233edba1bb898e7e7246ab653f94a3972b8497c4a349b4b
          imagePullPolicy: IfNotPresent
          command: ["/app/llama-server"]
          args:
            - --model
            - /models/qwen3.8-27b-gguf/Qwen3.8-27B-UD-Q4_K_XL.gguf
            - --mmproj
            - /models/qwen3.8-27b-gguf/mmproj-BF16.gguf
            - -md
            - /models/qwen3.8-27b-gguf/mtp/mtp-Qwen3.8-27B-Q4_0.gguf
            - --spec-type
            - draft-mtp
            - --spec-draft-n-max
            - "2"
            - --spec-draft-ngl
            - "99"
            - --alias
            - qwen3.8-27b
            - --ctx-size
            - "65536"
            - --batch-size
            - "2048"
            - --ubatch-size
            - "2048"
            - --n-gpu-layers
            - "99"
            - --fit
            - "off"
            - --load-mode
            - mmap
            - --flash-attn
            - on
            - --cache-type-k
            - q8_0
            - --cache-type-v
            - q8_0
            - --cache-type-k-draft
            - q8_0
            - --cache-type-v-draft
            - q8_0
            - --cache-reuse
            - "256"
            - --parallel
            - "1"
            - --jinja
            - --reasoning
            - on
            - --reasoning-effort
            - low
            - --reasoning-format
            - deepseek
            - --reasoning-preserve
            - --image-min-tokens
            - "1024"
            - --temp
            - "0.7"
            - --top-p
            - "0.8"
            - --top-k
            - "20"
            - --min-p
            - "0.0"
            - --presence-penalty
            - "1.5"
            - --repeat-penalty
            - "1.0"
            - --metrics
            - --host
            - 0.0.0.0
            - --port
            - "8080"
          env:
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            # Community RTX 3090 Qwen3.8-27B results use CUDA graph optimization
            # for the dense decode path.
            - name: GGML_CUDA_GRAPH_OPT
              value: "1"
            # Ampere multimodal runs have hit a cuBLAS compute-type fault during
            # vision prefill; fp32 compute fixes it with negligible measured cost.
            - name: GGML_CUDA_CUBLAS_COMPUTE_TYPE
              value: fp32
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              nvidia.com/gpu: "1"
              cpu: "4"
              memory: 16Gi
            limits:
              memory: 48Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        # Node-local NVMe cache, not NFS: the download hook persists the verified
        # artifacts on NFS and cache-sync hydrates this PVC before the server.
        - name: models
          persistentVolumeClaim:
            claimName: ai-model-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
