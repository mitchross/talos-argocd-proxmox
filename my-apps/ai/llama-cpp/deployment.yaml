apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp-server
  namespace: llama-cpp
  labels:
    app: llama-cpp-server
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: llama-cpp-server
  template:
    metadata:
      labels:
        app: llama-cpp-server
    spec:
      enableServiceLinks: false
      restartPolicy: Always
      runtimeClassName: nvidia
      priorityClassName: gpu-workload-high
      terminationGracePeriodSeconds: 300
      nodeSelector:
        feature.node.kubernetes.io/pci-0300_10de.present: "true"
        gpu-worker: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: llama-cpp-server
          image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10666@sha256:a2d04d1d1c2b2abe287fef9a22a3700a7fa20aec4c4ab56135e0099f38119848
          imagePullPolicy: IfNotPresent
          command: ["/app/llama-server"]
          args:
            - --model
            - /models/qwen3.8-flash-next-gguf/atomic-ad-4.27-q4-k-m-m64/Qwen3.8-Flash-Next-AD-4.27bpw-Q4_K_M-M64-00001-of-00033.gguf
            - --mmproj
            - /models/qwen3.8-flash-next-gguf/mmproj-F16.gguf
            - --no-mmproj-offload
            - --alias
            - Qwen3.8-Flash-Next Q4
            - --ctx-size
            - "131072"
            - --batch-size
            - "4096"
            - --ubatch-size
            - "512"
            - --fit
            - "on"
            - --fit-ctx
            - "131072"
            - --fit-target
            - "512"
            - --load-mode
            - mmap
            - --tensor-read-lazy
            - "auto"
            - --flash-attn
            - on
            - --cache-type-k
            - q8_0
            - --cache-type-v
            - q8_0
            - --parallel
            - "1"
            - --jinja
            - --reasoning
            - on
            - --reasoning-effort
            - low
            - --reasoning-format
            - deepseek
            - --temp
            - "0.7"
            - --top-p
            - "0.8"
            - --top-k
            - "20"
            - --min-p
            - "0.0"
            - --presence-penalty
            - "1.5"
            - --repeat-penalty
            - "1.0"
            - --metrics
            - --host
            - 0.0.0.0
            - --port
            - "8080"
          env:
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 300
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              nvidia.com/gpu: "1"
              cpu: "20"
              memory: 80Gi
            limits:
              memory: 94Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        # Node-local NVMe cache, not the NFS PVC: mmap page-cache misses during
        # inference must not become NFS round trips. See cache-sync-job.yaml.
        - name: models
          persistentVolumeClaim:
            claimName: ai-model-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
