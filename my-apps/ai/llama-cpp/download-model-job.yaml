apiVersion: batch/v1
kind: Job
metadata:
  name: llama-cpp-download-qwen38-27b
  namespace: llama-cpp
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Finish the durable NFS download before the wave-0 NVMe hydration hook.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 4
  activeDeadlineSeconds: 21600
  template:
    spec:
      restartPolicy: OnFailure
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.vanillax.dev/class
                    operator: In
                    values:
                      - dell-worker
      containers:
        - name: download
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command:
            - /bin/sh
            - -ec
            - /opt/repo-scripts/download-models.sh
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: models
              mountPath: /models
      volumes:
        - name: repo-scripts
          configMap:
            name: llama-cpp-scripts
            defaultMode: 0555
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-models-pvc
