apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llama-cpp

resources:
  - namespace.yaml
  - pvc.yaml
  - pvc-model-cache.yaml
  - download-model-job.yaml
  - mtp-download-job.yaml
  - cache-sync-job.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - servicemonitor.yaml

# Flash-Next test cutover: claim the sole RTX 3090 after vLLM is parked.
replicas:
  - name: llama-cpp-server
    count: 1

configMapGenerator:
  - name: llama-cpp-scripts
    files:
      - scripts/download-models.sh
      - scripts/sync-model-cache.sh
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
