apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llama-cpp

resources:
  - namespace.yaml
  - pvc.yaml
  - pvc-model-cache.yaml
  - download-model-job.yaml
  - cache-sync-job.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - servicemonitor.yaml

configMapGenerator:
  - name: llama-cpp-scripts
    files:
      - scripts/download-models.sh
      - scripts/sync-model-cache.sh
