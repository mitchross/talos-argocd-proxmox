apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llama-cpp

resources:
  - namespace.yaml
  - pvc.yaml
  - pvc-model-cache.yaml
  - download-model-job.yaml
  - cache-sync-job.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml

# Retain local GGUF artifacts for rollback while vLLM owns both cards.
replicas:
  - name: llama-cpp-server
    count: 0

configMapGenerator:
  - name: llama-cpp-scripts
    files:
      - scripts/download-models.sh
      - scripts/sync-model-cache.sh
      - scripts/wait-for-model-cache.sh
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
