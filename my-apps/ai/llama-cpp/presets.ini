# Qwen 3.8-27B evaluation bank.
#
# vLLM remains parked at replicas: 0 with Qwen 3.6-27B AWQ on its separate
# read-only NFS share. Until a Qwen 3.8-27B AWQ quant is available for the
# Ampere vLLM path, llama.cpp serves the existing GGUF from
# /mnt/ai-pool/llama-cpp. Open WebUI uses qwen3.8 for chat/vision and the
# non-thinking preset for strict background-task output.
#
# These are two API presets over ONE GGUF + vision projector, not two stored
# models. --models-max 1 keeps only one preset process resident at a time.

# Qwen's hybrid-thinking sampling profile.
[qwen3.8 - qwen3.8-27b]
model = /models/Qwen3.8-27B-UD-Q4_K_XL.gguf
mmproj = /models/mmproj-qwen3.8-BF16.gguf
alias = qwen3.8, qwen3.8-27b
ctx-size = 65536
n-gpu-layers = 99
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
jinja = 1

# Same weights with thinking disabled for Open WebUI title/tag generation and
# other JSON-shaped background tasks.
[qwen3.8-nothink - qwen3.8-27b-nothink]
model = /models/Qwen3.8-27B-UD-Q4_K_XL.gguf
mmproj = /models/mmproj-qwen3.8-BF16.gguf
alias = qwen3.8-nothink, qwen3.8-27b-nothink
ctx-size = 65536
n-gpu-layers = 99
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0.0
presence-penalty = 1.5
chat-template-kwargs = {"enable_thinking": false}
jinja = 1
