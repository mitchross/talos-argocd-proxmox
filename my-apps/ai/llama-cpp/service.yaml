apiVersion: v1
kind: Service
metadata:
  name: llama-cpp-service
  namespace: llama-cpp
  labels:
    app: llama-cpp-server
spec:
  # Preserve existing app URLs; LAN HTTPRoutes target vLLM's selector Service.
  type: ExternalName
  externalName: vllm-service.vllm.svc.cluster.local
  ports:
    - name: http
      protocol: TCP
      port: 8080
