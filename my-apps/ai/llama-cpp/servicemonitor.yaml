apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llama-cpp
  namespace: llama-cpp
  labels:
    app: llama-cpp-server
spec:
  selector:
    matchLabels:
      app: llama-cpp-server
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
