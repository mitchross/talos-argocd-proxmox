apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: llama-cpp-server
  namespace: llama-cpp
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llama-cpp-server
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: llama-cpp-server
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
        # Without maxAllowed the recommendation only ever climbs: it reached
        # 95 GiB against a 58 GiB working set, drove node requests to 99%, and
        # the host was resized past what VFIO can pin -- which crashed it.
        minAllowed:
          cpu: "20"
          memory: 56Gi
        maxAllowed:
          cpu: "28"
          memory: 72Gi
