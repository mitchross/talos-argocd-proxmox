apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: llama-cpp-server
  namespace: llama-cpp
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llama-cpp-server
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: llama-cpp-server
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
        minAllowed:
          cpu: "24"
          memory: 76Gi
