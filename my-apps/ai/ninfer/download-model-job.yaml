apiVersion: batch/v1
kind: Job
metadata:
  name: ninfer-download-qwen38
  namespace: ninfer
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Wave 0 WITH the PV/PVC (a -1 hook deadlocks: it runs before the PVC exists).
    # The server Deployment sits at wave 1, so the artifact still lands first.
    argocd.argoproj.io/sync-wave: "0"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 4
  activeDeadlineSeconds: 10800
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: download
        image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
        command:
        - /bin/sh
        - -ec
        - /opt/repo-scripts/download-model.sh
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            # NFS page cache counts against the cgroup: at 512Mi the container was
            # repeatedly killed mid-download (~2-3 GiB per attempt, resume proved it).
            memory: 4Gi
        volumeMounts:
        - name: repo-scripts
          mountPath: /opt/repo-scripts
          readOnly: true
        - name: models
          mountPath: /models
      volumes:
      - name: repo-scripts
        configMap:
          name: ninfer-scripts
          defaultMode: 0555
      - name: models
        persistentVolumeClaim:
          claimName: ninfer-models-pvc
