# INTERNAL route (local network only, via gateway-internal-technitium) — mirrors vllm.
# The technitium external-dns instance creates the LAN record automatically.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ninfer-route
  namespace: ninfer
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gateway-internal-technitium
    namespace: gateway
  hostnames:
  - "ninfer.vanillax.me"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    timeouts:
      request: 30m            # long generations
      backendRequest: 30m
    backendRefs:
    - group: ""
      kind: Service
      name: ninfer-service
      port: 8080
      weight: 1
