apiVersion: v1
kind: Service
metadata:
  name: ninfer-service
  namespace: ninfer
  labels:
    app: ninfer-server
spec:
  selector:
    app: ninfer-server
  ports:
    - name: http              # CRITICAL — HTTPRoute matches by port name; fails silently without it
      protocol: TCP
      port: 8080
      targetPort: http
  type: ClusterIP
