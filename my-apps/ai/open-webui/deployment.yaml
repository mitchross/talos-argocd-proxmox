apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      # Keep CPU embeddings off the inference GPUs when possible.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: feature.node.kubernetes.io/pci-0300_10de.present
                    operator: DoesNotExist
      containers:
      - name: open-webui
        # renovate: datasource=docker depName=ghcr.io/open-webui/open-webui
        # `main` and `cuda` share a commit; `main` keeps local Whisper on CPU without shipping CUDA.
        image: ghcr.io/open-webui/open-webui:main@sha256:8b432fe0a65b91116afc7961365c6cca5379cc923171386a96691f3471f3cae9
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 500m
            memory: 1000Mi
            ephemeral-storage: "30Gi"
          limits:
            memory: 8000Mi
            ephemeral-storage: "40Gi"
        envFrom:
        - configMapRef:
            name: open-webui-configmap
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: open-webui-litellm
              key: api-key
        - name: OPENAI_API_KEYS
          valueFrom:
            secretKeyRef:
              name: open-webui-litellm
              key: api-key
        volumeMounts:
        - name: data
          mountPath: /app/backend/data
        - name: frontend-loader
          mountPath: /app/build/static/loader.js
          subPath: loader.js
          readOnly: true
        # Health probes disabled - backend model loading can take several minutes
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: storage-recovered
      - name: frontend-loader
        configMap:
          name: open-webui-loader
