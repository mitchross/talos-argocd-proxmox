apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      # RAG embeddings run in-pod on CPU; inference stays in llama.cpp.
      # Prefer non-GPU nodes to reserve the sole 3090, but allow fallback.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: feature.node.kubernetes.io/pci-0300_10de.present
                    operator: DoesNotExist
      containers:
      - name: open-webui
        # renovate: datasource=docker depName=ghcr.io/open-webui/open-webui
        # `main` and `cuda` are built from the same Open WebUI commit. This
        # standard image keeps local Whisper on CPU without shipping CUDA.
        image: ghcr.io/open-webui/open-webui:main@sha256:6a773e5c3a246b65cbe74ce942b294292c0e5f81c138f703d111bc162f7d7c3d
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 500m
            memory: 1000Mi
            ephemeral-storage: "30Gi"
          limits:
            memory: 8000Mi
            ephemeral-storage: "40Gi"
        envFrom:
        - configMapRef:
            name: open-webui-configmap
        volumeMounts:
        - name: data
          mountPath: /app/backend/data
        - name: frontend-loader
          mountPath: /app/build/static/loader.js
          subPath: loader.js
          readOnly: true
        # Health probes disabled - backend model loading can take several minutes
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: storage
      - name: frontend-loader
        configMap:
          name: open-webui-loader
