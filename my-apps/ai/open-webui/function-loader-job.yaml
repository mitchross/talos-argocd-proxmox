apiVersion: batch/v1
kind: Job
metadata:
  name: load-functions-v8
  namespace: open-webui
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      # Shares the RWO storage PVC with Open WebUI — MUST co-locate on the same node or the volume can't attach.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: open-webui
              topologyKey: kubernetes.io/hostname
      containers:
      - name: loader
        # renovate: datasource=docker depName=ghcr.io/open-webui/open-webui
        image: ghcr.io/open-webui/open-webui:main@sha256:c792953395b43d4f49085fa4026850c5e923578345ebeaf56eabd980bcfc273a
        command:
        - python3
        - /opt/repo-scripts/load-functions.py
        envFrom:
        - configMapRef:
            name: open-webui-configmap
        volumeMounts:
        - name: repo-scripts
          mountPath: /opt/repo-scripts
          readOnly: true
        - name: har-function
          mountPath: /functions/har-analyzer-function.py
          subPath: har-analyzer-function.py
        - name: tps-function
          mountPath: /functions/tokens-per-second-function.py
          subPath: tokens-per-second-function.py
        - name: qwen-no-think-filter
          mountPath: /functions/qwen-no-think-filter.py
          subPath: qwen-no-think-filter.py
        - name: data
          mountPath: /app/backend/data
      volumes:
      - name: repo-scripts
        configMap:
          name: open-webui-scripts
          defaultMode: 0555
      - name: har-function
        configMap:
          name: har-analyzer-function
      - name: tps-function
        configMap:
          name: tokens-per-second-function
      - name: qwen-no-think-filter
        configMap:
          name: qwen-no-think-filter
      - name: data
        persistentVolumeClaim:
          claimName: storage
