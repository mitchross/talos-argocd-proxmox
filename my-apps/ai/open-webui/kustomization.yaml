apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- deployment.yaml
# - mcpo-deployment.yaml
- mcp-config.yaml
- mcp-kiwix.yaml
- service.yaml
- pvc.yaml
- httproute.yaml
- function-loader-job.yaml
- kopiur/storage.yaml
namespace: open-webui

# Uniform kopiur backup fields (repository, copyMethod, populator) for the per-PVC stub(s) in kopiur/.
components:
  - ../../common/kopiur-backup

configMapGenerator:
- name: open-webui-loader
  files:
  - loader.js
- name: har-analyzer-function
  files:
  - har-analyzer-function.py
  options:
    disableNameSuffixHash: true
- name: tokens-per-second-function
  files:
  - tokens-per-second-function.py
  options:
    disableNameSuffixHash: true
- name: open-webui-configmap
  envs:
  - open-webui-configmap.env
# Key renamed to config.json so the mcpo-multi Deployment's volume mount + args stay unchanged.
- name: mcp-config
  files:
  - config.json=mcp-config.json
- name: mcp-kiwix-config
  files:
  - config.json=mcp-kiwix-config.json
