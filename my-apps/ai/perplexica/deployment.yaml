apiVersion: apps/v1
kind: Deployment
metadata:
  name: perplexica
  namespace: perplexica
  labels:
    app: perplexica
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: perplexica
  template:
    metadata:
      labels:
        app: perplexica
      annotations:
        instrumentation.opentelemetry.io/inject-nodejs: "opentelemetry/default"
    spec:
      # Seeds /data/config.json from the ConfigMap; on an existing file only modelProviders +
      # search are overwritten so user UI preferences survive each deploy.
      initContainers:
        - name: seed-config
          # ghcr.io/jqlang/jq is distroless (no shell); alpine + apk jq gives us /bin/sh for the merge.
          image: alpine:3.24
          command:
            - /bin/sh
            - -c
            - /opt/repo-scripts/seed-config.sh
          volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: seed
              mountPath: /seed
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { memory: 128Mi }
          securityContext:
            # apk needs a writable root FS to unpack jq into /usr/bin.
            # Still no privilege escalation, all caps dropped.
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
      containers:
        - name: perplexica
          # Upstream renamed Perplexica -> Vane; the old perplexica repo is frozen at v1.12.0.
          # WORKDIR moved to /home/vane, so the PVC mountPath below follows it.
          image: itzcrazykns1337/vane:slim-v1.12.2@sha256:d2878cf9c91962aa3fc053b59bc9b89adcbdcaeb7ee36b54906e853464b2c190
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: SEARXNG_API_URL
              value: "http://searxng.searxng.svc.cluster.local:8080"
            - name: OPENAI_BASE_URL
              value: "http://vllm-service.vllm.svc.cluster.local:8080/v1"
            - name: OPENAI_API_KEY
              value: "sk-no-key-required"
          volumeMounts:
            - name: data
              mountPath: /home/vane/data
          # `/` is Next.js SSR and blocks well past 1s during a heavy search; 10s timeout x 6 failures
          # so a long-running search isn't killed mid-research.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          # Bundles Chromium (Playwright) + an in-process xenova embedding rerank: starving CPU
          # stalls the event loop and trips the liveness probe mid-search.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
      volumes:
        - name: repo-scripts
          configMap:
            name: perplexica-scripts
            defaultMode: 0555
        - name: data
          persistentVolumeClaim:
            claimName: perplexica-data
        - name: seed
          configMap:
            name: perplexica-config-seed
            items:
              - key: config.json
                path: config.json
