apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: presenton-litellm
  namespace: presenton
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: presenton-litellm
    creationPolicy: Owner
  data:
  - secretKey: LITELLM_API_KEY
    remoteRef:
      key: litellm
      property: master_key
