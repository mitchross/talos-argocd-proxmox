apiVersion: v1
kind: Namespace
metadata:
  name: presenton
  labels:
    # Drives the ClusterExternalSecret cred fanout and ClusterRepository tenancy (allowedNamespaces selector).
    kopiur.home-operations.com/repo: cluster-kopia
  annotations:
    # Presenton runs as root and app_data is root-owned, so the mover needs privilegedMode.
    kopiur.home-operations.com/privileged-movers: "true"