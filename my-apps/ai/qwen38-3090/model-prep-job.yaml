apiVersion: batch/v1
kind: Job
metadata:
  name: qwen38-3090-model-prep
  namespace: qwen38-3090
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  activeDeadlineSeconds: 21600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: prepare
          image: ghcr.io/mitchross/qwen38-27b-3090:e00bc1b7@sha256:b27437a66e1870a8b9caec7cc148eaad52a127f815a6222d3d032e0c71da35a8
          imagePullPolicy: IfNotPresent
          args: ["prepare"]
          env:
            - name: HOME
              value: /cache
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 4Gi
            limits:
              cpu: "8"
              memory: 32Gi
              ephemeral-storage: 12Gi
          volumeMounts:
            - name: models
              mountPath: /app/models
            - name: cache
              mountPath: /cache
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: qwen38-3090-models-pvc
        - name: cache
          emptyDir:
            sizeLimit: 12Gi
