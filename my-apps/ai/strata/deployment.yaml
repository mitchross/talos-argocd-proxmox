apiVersion: apps/v1
kind: Deployment
metadata:
  name: strata-server
  namespace: strata
  labels:
    app: strata-server
spec:
  # Both RTX 3090s (layer split, vLLM parked). Strata serves one request at a time (FIFO).
  replicas: 1
  strategy:
    type: Recreate            # whole-card GPU workload on an RWO local volume
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: strata-server
  template:
    metadata:
      labels:
        app: strata-server
    spec:
      enableServiceLinks: false
      runtimeClassName: nvidia
      # Never evicts other pods to find its ~54 GiB; it stays Pending until the node has room.
      priorityClassName: gpu-workload-no-preempt
      # Upstream gives the model two minutes to unload (docs/DOCKER.md, --stop-timeout 120).
      terminationGracePeriodSeconds: 120
      nodeSelector:
        feature.node.kubernetes.io/pci-0300_10de.present: "true"
        gpu-worker: "true"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      # No fsGroup: the local volume also holds vLLM's files, and fsGroup would chown all of it.
      initContainers:
        # 0.2.x keeps models, packs and the MTP layer in /data/Strata-data, and its entrypoint renames the 0.1.x
        # folders there. Do the same rename here and leave links at the old places, so a revert to 0.1.x still
        # finds its files (no ~92 GB download). The 0.2.x entrypoint skips names that already exist and its
        # old-files check does not follow the links.
        - name: keep-old-paths
          image: ghcr.io/mitchross/strata:0.1.57.0-c3b3f50-sm86@sha256:254cff36099a22d0736ac8a457a644a3a7c1cb52407abf9e1f0e49b4cfc9c8b9
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /opt/repo-scripts/keep-old-paths.sh
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: data
              mountPath: /data
              subPath: strata
      containers:
        - name: strata
          # Built from Niko1221/Strata's own Dockerfile at a pinned commit by mitchross/homelab-images (images/strata).
          # The entrypoint runs `strata launch --no-tui` with the strata-settings variables: a first start or changed
          # settings run setup (download, pack, run settings), then it serves. Finished steps are not repeated.
          image: ghcr.io/mitchross/strata:0.1.57.0-c3b3f50-sm86@sha256:254cff36099a22d0736ac8a457a644a3a7c1cb52407abf9e1f0e49b4cfc9c8b9
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: strata-settings
          env:
            # Strata rejects unknown Host headers (DNS-rebinding guard). Allow the in-cluster Service names LiteLLM uses.
            - name: STRATA_ALLOWED_HOSTS
              value: strata-service,strata-service.strata,strata-service.strata.svc,strata-service.strata.svc.cluster.local
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # The port opens only after setup and the expert load. Setup now runs in this container, and the first
          # 0.2.x start checks the files and writes new run settings, so allow 60 minutes.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            # TEMPORARY A/B: 2 hours, room for the ~94 GB Unsloth download and its SHA-256 check.
            failureThreshold: 720
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Low-RAM off: ~47 GiB expert arena + streamed KV + server; the GGUF page cache is reclaimable.
            # ~15 cores busy during decode (CPU-side experts).
            requests:
              nvidia.com/gpu: "2"
              cpu: "12"
              memory: 54Gi
            limits:
              nvidia.com/gpu: "2"
              # TEMPORARY A/B: UD-IQ4_XS-v31 keeps ~56 GiB of experts in RAM (IQ3_S: ~47), ~60 GiB in all.
              # The request stays 54Gi so the pod still schedules on the GPU node.
              memory: 72Gi
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: strata
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: repo-scripts
          configMap:
            name: strata-scripts
            defaultMode: 0555
        - name: data
          persistentVolumeClaim:
            claimName: ai-model-cache-strata
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
