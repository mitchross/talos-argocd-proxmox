apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: strata

# List EVERY file here: unlisted YAML is never deployed.
resources:
  - namespace.yaml
  - pvc-model-cache.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  - vpa.yaml

configMapGenerator:
  # docker-entrypoint.sh and scripts/prepare.sh read the same settings (Strata's setup flags as env vars).
  - name: strata-settings
    literals:
      - STRATA_DATA=/data
      - FAMILY=qwen
      - MODEL=IQ3_S
      - CONTEXT=131072
      # Images: yes = the CUDA image encoder (needs an image built with BUILD_VISION=1). It is in the settings
      # stamp, so a change reruns setup: the GGUFs and pack are reused, only the ~0.9 GB mmproj is downloaded.
      # The engine keeps ~700 MiB free for it (setup.py VISION reserve_mib), taken from the expert cache.
      - VISION=yes
      - KV=int8
      - LOW_RAM=off
      - KV_STREAMING=on
      # Layer split over the two cards the device plugin hands this pod (indices 0,1 inside it).
      - GPUS=0,1
      - HOST=0.0.0.0
      - PORT=8080
      # Batch slots (upstream docs/BATCHING.md). 1 slot: a 2nd slot measured no extra total speed
      # (51 vs 50 tok/s) and halved per-request decode, so overflow goes to deepseek-flash instead.
      # prepare.sh writes it into the config as "parallel"; it is not in the settings stamp, so a change
      # restarts the pod but never reruns setup. 1 = one request at a time. LiteLLM's max_parallel_requests
      # on the qwen3.8-27b route must match it.
      - PARALLEL=1
  - name: strata-scripts
    files:
      - scripts/prepare.sh
