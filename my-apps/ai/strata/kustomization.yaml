apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: strata

# List EVERY file here: unlisted YAML is never deployed.
resources:
  - namespace.yaml
  - pvc-model-cache.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  - vpa.yaml

configMapGenerator:
  # The image entrypoint (upstream docker/entrypoint.sh) turns these into `strata launch --no-tui` flags and saves
  # them as the "docker" preset in /data/state. A change restarts the pod; setup reruns only for what it changes.
  # 0.1.x's LOW_RAM, KV_STREAMING, HOST and STRATA_DATA are gone (ignored with a warning); setup's defaults (auto)
  # choose from the node's RAM. Check the run settings in /data/install after a start for what it picked.
  - name: strata-settings
    literals:
      - FAMILY=qwen
      - MODEL=IQ3_S
      - CONTEXT=131072
      # Images: yes = the CUDA image encoder (needs an image built with BUILD_VISION=1). A change reruns setup:
      # the GGUFs and pack are reused, only the ~0.9 GB mmproj is downloaded.
      - VISION=yes
      - KV=int8
      # Layer split over the two cards the device plugin hands this pod (indices 0,1 inside it).
      - GPUS=0,1
      - PORT=8080
      # 0.2.x serves beyond loopback only with a key, and makes one when none is set. "none" serves without a key
      # on purpose, as 0.1.x did: only cluster pods reach the Service, and LiteLLM sends a dummy key.
      - API_KEY=none
      # Batch slots (upstream docs/BATCHING.md), `launch --parallel`; 0.2.x's default is 8 fitted to the card.
      # 1 slot: a 2nd slot measured no extra total speed (51 vs 50 tok/s) and halved per-request decode, so
      # overflow goes to deepseek-flash instead. LiteLLM's max_parallel_requests on the qwen3.8-27b route must match.
      - PARALLEL=1
