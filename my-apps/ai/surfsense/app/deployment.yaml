apiVersion: apps/v1
kind: Deployment
metadata:
  name: surfsense
  namespace: surfsense
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: surfsense
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: surfsense
        app.kubernetes.io/component: backend
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: feature.node.kubernetes.io/pci-0300_10de.present
                    operator: DoesNotExist
      containers:
        - name: api
          image: ghcr.io/modsetter/surfsense-backend:0.0.39
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SERVICE_ROLE
              value: api
            - name: SECRET_KEY
              valueFrom: {secretKeyRef: {name: surfsense-secrets, key: SECRET_KEY}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: surfsense-secrets, key: DB_PASSWORD}}
            - {name: DATABASE_URL, value: 'postgresql+asyncpg://surfsense:$(DB_PASSWORD)@db:5432/surfsense'}
            - {name: CELERY_BROKER_URL, value: redis://redis:6379/0}
            - {name: CELERY_RESULT_BACKEND, value: redis://redis:6379/0}
            - {name: REDIS_APP_URL, value: redis://redis:6379/0}
            - {name: CELERY_TASK_DEFAULT_QUEUE, value: surfsense}
            - {name: FILE_STORAGE_LOCAL_PATH, value: /app/.local_object_store}
            - {name: NEXT_FRONTEND_URL, value: https://surfsense.vanillax.me}
            - {name: BACKEND_URL, value: https://surfsense.vanillax.me}
            - {name: SURFSENSE_PUBLIC_URL, value: https://surfsense.vanillax.me}
            - {name: AUTH_TYPE, value: LOCAL}
            - {name: DEPLOYMENT_MODE, value: self-hosted}
            - {name: ETL_SERVICE, value: DOCLING}
            - {name: EMBEDDING_MODEL, value: sentence-transformers/all-MiniLM-L6-v2}
            - {name: SEARXNG_URL, value: http://searxng.searxng.svc.cluster.local:8080}
            - {name: SANDBOX_ENABLED, value: "FALSE"}
            - {name: MAX_FILE_SIZE_MB, value: "500"}
            - {name: TMPDIR, value: /shared_tmp}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 120
            periodSeconds: 30
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 6Gi}
          volumeMounts:
            - {name: object-store, mountPath: /app/.local_object_store}
            - {name: shared-temp, mountPath: /shared_tmp}
            - {name: global-llm-config, mountPath: /app/app/config/global_llm_config.yaml, subPath: global_llm_config.yaml, readOnly: true}
        - name: worker
          image: ghcr.io/modsetter/surfsense-backend:0.0.39
          env:
            - name: SERVICE_ROLE
              value: worker
            - name: SECRET_KEY
              valueFrom: {secretKeyRef: {name: surfsense-secrets, key: SECRET_KEY}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: surfsense-secrets, key: DB_PASSWORD}}
            - {name: DATABASE_URL, value: 'postgresql+asyncpg://surfsense:$(DB_PASSWORD)@db:5432/surfsense'}
            - {name: CELERY_BROKER_URL, value: redis://redis:6379/0}
            - {name: CELERY_RESULT_BACKEND, value: redis://redis:6379/0}
            - {name: REDIS_APP_URL, value: redis://redis:6379/0}
            - {name: CELERY_TASK_DEFAULT_QUEUE, value: surfsense}
            - {name: FILE_STORAGE_LOCAL_PATH, value: /app/.local_object_store}
            - {name: EMBEDDING_MODEL, value: sentence-transformers/all-MiniLM-L6-v2}
            - {name: SEARXNG_URL, value: http://searxng.searxng.svc.cluster.local:8080}
            - {name: SANDBOX_ENABLED, value: "FALSE"}
            - {name: TMPDIR, value: /shared_tmp}
            - {name: CELERY_MAX_WORKERS, value: "4"}
            - {name: CELERY_MIN_WORKERS, value: "1"}
            - {name: CELERY_MAX_TASKS_PER_CHILD, value: "50"}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 8Gi}
          volumeMounts:
            - {name: object-store, mountPath: /app/.local_object_store}
            - {name: shared-temp, mountPath: /shared_tmp}
            - {name: global-llm-config, mountPath: /app/app/config/global_llm_config.yaml, subPath: global_llm_config.yaml, readOnly: true}
      volumes:
        - name: object-store
          persistentVolumeClaim:
            claimName: surfsense-object-store
        - name: shared-temp
          emptyDir: {}
        - name: global-llm-config
          configMap:
            name: surfsense-global-llm-config
