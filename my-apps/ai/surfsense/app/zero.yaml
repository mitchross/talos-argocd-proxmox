apiVersion: apps/v1
kind: Deployment
metadata:
  name: surfsense-zero
  namespace: surfsense
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: surfsense-zero
  template:
    metadata:
      labels:
        app.kubernetes.io/name: surfsense-zero
    spec:
      terminationGracePeriodSeconds: 300
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: feature.node.kubernetes.io/pci-0300_10de.present
                    operator: DoesNotExist
      containers:
        - name: zero
          image: rocicorp/zero:1.9.0
          ports:
            - name: http
              containerPort: 4848
          env:
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: surfsense-secrets, key: DB_PASSWORD}}
            - name: ZERO_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: surfsense-secrets, key: ZERO_ADMIN_PASSWORD}}
            - name: ZERO_QUERY_API_KEY
              valueFrom: {secretKeyRef: {name: surfsense-secrets, key: ZERO_QUERY_API_KEY}}
            - {name: ZERO_UPSTREAM_DB, value: 'postgresql://surfsense:$(DB_PASSWORD)@db:5432/surfsense?sslmode=disable'}
            - {name: ZERO_CVR_DB, value: 'postgresql://surfsense:$(DB_PASSWORD)@db:5432/surfsense?sslmode=disable'}
            - {name: ZERO_CHANGE_DB, value: 'postgresql://surfsense:$(DB_PASSWORD)@db:5432/surfsense?sslmode=disable'}
            - {name: ZERO_REPLICA_FILE, value: /data/zero.db}
            - {name: ZERO_APP_PUBLICATIONS, value: zero_publication}
            - {name: ZERO_AUTO_RESET, value: "true"}
            - {name: ZERO_NUM_SYNC_WORKERS, value: "4"}
            - {name: ZERO_UPSTREAM_MAX_CONNS, value: "20"}
            - {name: ZERO_CVR_MAX_CONNS, value: "30"}
            - {name: ZERO_QUERY_URL, value: http://frontend:3000/api/zero/query}
            - {name: ZERO_MUTATE_URL, value: http://frontend:3000/api/zero/mutate}
            - {name: ZERO_QUERY_FORWARD_COOKIES, value: "true"}
          readinessProbe:
            httpGet: {path: /keepalive, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 2Gi}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
