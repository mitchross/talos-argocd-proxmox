apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: surfsense
spec:
  selector:
    app.kubernetes.io/name: surfsense-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: surfsense-db
  namespace: surfsense
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: surfsense-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: surfsense-db
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17
          args:
            - -c
            - wal_level=logical
            - -c
            - max_replication_slots=10
            - -c
            - max_wal_senders=10
            - -c
            - max_connections=200
          env:
            - name: POSTGRES_USER
              value: surfsense
            - name: POSTGRES_DB
              value: surfsense
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: surfsense-secrets
                  key: DB_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, surfsense, -d, surfsense]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, surfsense, -d, surfsense]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: surfsense-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: surfsense
spec:
  selector:
    app.kubernetes.io/name: surfsense-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: surfsense-redis
  namespace: surfsense
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: surfsense-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: surfsense-redis
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          args: [redis-server, --appendonly, "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: surfsense-redis
