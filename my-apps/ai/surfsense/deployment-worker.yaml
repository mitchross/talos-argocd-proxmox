apiVersion: apps/v1
kind: Deployment
metadata:
  name: surfsense-worker
  namespace: surfsense
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: surfsense-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: surfsense-worker
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: feature.node.kubernetes.io/pci-0300_10de.present
                    operator: DoesNotExist
      containers:
        - name: worker
          image: ghcr.io/modsetter/surfsense-backend:0.0.39
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: surfsense-secrets
                  key: SECRET_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: surfsense-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: postgresql+asyncpg://surfsense:$(DB_PASSWORD)@db:5432/surfsense
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/0
            - name: REDIS_APP_URL
              value: redis://redis:6379/0
            - name: CELERY_TASK_DEFAULT_QUEUE
              value: surfsense
            - name: PYTHONPATH
              value: /app
            - name: FILE_STORAGE_LOCAL_PATH
              value: /app/.local_object_store
            - name: SEARXNG_URL
              value: http://searxng.searxng.svc.cluster.local:8080
            - name: SANDBOX_ENABLED
              value: "FALSE"
            - name: SERVICE_ROLE
              value: worker
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 8Gi
          volumeMounts:
            - name: shared-temp
              mountPath: /shared_tmp
            - name: object-store
              mountPath: /app/.local_object_store
      volumes:
        - name: shared-temp
          persistentVolumeClaim:
            claimName: surfsense-shared-temp
        - name: object-store
          persistentVolumeClaim:
            claimName: surfsense-object-store
