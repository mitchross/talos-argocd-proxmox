apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: surfsense-secrets
  namespace: surfsense
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: surfsense-secrets
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: surfsense
        property: secret_key
    - secretKey: DB_PASSWORD
      remoteRef:
        key: surfsense
        property: db_password
    - secretKey: ZERO_ADMIN_PASSWORD
      remoteRef:
        key: surfsense
        property: zero_admin_password
    - secretKey: ZERO_QUERY_API_KEY
      remoteRef:
        key: surfsense
        property: zero_query_api_key
