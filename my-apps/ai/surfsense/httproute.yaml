apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: surfsense-route
  namespace: surfsense
  labels:
    external-dns: "true"
  annotations:
    external-dns.alpha.kubernetes.io/target: vanillax.me
spec:
  parentRefs:
    - kind: Gateway
      name: gateway-external
      namespace: gateway
      sectionName: https
  hostnames:
    - surfsense.vanillax.me
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api/v1}
        - path: {type: PathPrefix, value: /auth}
      backendRefs:
        - name: backend
          port: 8000
    - matches:
        - path: {type: PathPrefix, value: /zero}
      backendRefs:
        - name: zero-cache
          port: 4848
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: frontend
          port: 3000
