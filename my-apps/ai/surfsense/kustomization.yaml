apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: surfsense

resources:
  - postgres/metrics.yaml
  - llm-externalsecret.yaml
  - namespace.yaml
  - externalsecret.yaml
  - mink-sync-externalsecret.yaml
  - mink-sync-cronjob.yaml
  - app/pvc.yaml
  - postgres/deployment.yaml
  - postgres/service.yaml
  - postgres/pvc.yaml
  - redis/deployment.yaml
  - redis/service.yaml
  - redis/pvc.yaml
  - app/migrations-job.yaml
  - app/credit-policy-job.yaml
  - app/deployment.yaml
  - app/beat.yaml
  - app/zero.yaml
  - app/frontend.yaml
  - app/service.yaml
  - httproute.yaml
  - vpa.yaml
  - kopiur/postgres-data.yaml
  - kopiur/object-store.yaml

components:
  - ../../common/kopiur-backup

configMapGenerator:
  - name: surfsense-recovery-scripts
    files:
      - scripts/recover-redis-aof.sh
      - scripts/worker-ready.py
  - name: surfsense-mink-sync-script
    files:
      - scripts/sync-mink.py
  - name: surfsense-global-llm-config
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    files:
      - global_llm_config.yaml
  - name: surfsense-selfhost-policy
    envs:
      - selfhost.env
  - name: surfsense-credit-policy-scripts
    files:
      - scripts/reconcile-credit-policy.sh

configurations:
  - kustomizeconfig.yaml
replacements:
  - source:
      kind: ConfigMap
      name: surfsense-global-llm-config
      fieldPath: metadata.name
    targets:
      - select:
          kind: Deployment
          name: surfsense|surfsense-beat
        fieldPaths:
          - spec.template.metadata.annotations.llm-config-revision
        options:
          create: true
