apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: surfsense-llm-config
  namespace: surfsense
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: surfsense-llm-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      templateFrom:
      - target: Data
        configMap:
          name: surfsense-global-llm-config
          items:
          - key: global_llm_config.yaml
            templateAs: Values
  data:
  - secretKey: LITELLM_API_KEY
    remoteRef:
      key: litellm
      property: master_key
