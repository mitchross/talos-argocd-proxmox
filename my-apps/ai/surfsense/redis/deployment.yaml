apiVersion: apps/v1
kind: Deployment
metadata:
  name: surfsense-redis
  namespace: surfsense
  labels:
    app: surfsense-redis
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: surfsense-redis
  template:
    metadata:
      labels:
        app: surfsense-redis
    spec:
      securityContext:
        # redis:8-alpine runs redis as uid 999 / gid 1000. Fresh Longhorn
        # volumes mount root-owned, so give the pod the Redis group on /data.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: preserve-and-repair-aof
          image: redis:8-alpine
          command: [timeout, "180", /bin/sh, /opt/recovery/recover-redis-aof.sh]
          securityContext:
            runAsUser: 999
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: recovery, mountPath: /opt/recovery, readOnly: true}
      containers:
        - name: redis
          image: redis:8-alpine
          args: [redis-server, --appendonly, "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: recovery
          configMap:
            name: surfsense-recovery-scripts
            defaultMode: 0444
        - name: data
          persistentVolumeClaim:
            claimName: surfsense-redis-data
