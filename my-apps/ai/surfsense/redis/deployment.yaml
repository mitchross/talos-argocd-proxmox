apiVersion: apps/v1
kind: Deployment
metadata:
  name: surfsense-redis
  namespace: surfsense
  labels:
    app: surfsense-redis
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: surfsense-redis
  template:
    metadata:
      labels:
        app: surfsense-redis
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          args: [redis-server, --appendonly, "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: surfsense-redis-data
