apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: surfsense-redis-data
  namespace: surfsense
  labels:
    app: surfsense-redis
    backup-exempt: "true"
  annotations:
    storage.vanillax.dev/backup-exempt-reason: "Redis is Celery broker/cache state and is disposable"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
