apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: surfsense
spec:
  selector:
    app.kubernetes.io/name: surfsense
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: zero-cache
  namespace: surfsense
spec:
  selector:
    app.kubernetes.io/name: surfsense-zero
  ports:
    - name: http
      port: 4848
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: surfsense
spec:
  selector:
    app.kubernetes.io/name: surfsense-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
