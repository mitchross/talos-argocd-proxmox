---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: surfsense
  namespace: surfsense
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: surfsense}
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - {containerName: api, controlledValues: RequestsOnly}
      - {containerName: worker, controlledValues: RequestsOnly}
---
