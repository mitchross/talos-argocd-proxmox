apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: surfsense-db
  namespace: surfsense
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: surfsense-db}
  updatePolicy: {updateMode: InPlaceOrRecreate}
  resourcePolicy:
    containerPolicies:
      - {containerName: '*', controlledValues: RequestsOnly}
---
