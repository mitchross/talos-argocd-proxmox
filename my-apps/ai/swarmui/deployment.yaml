apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarmui
  namespace: swarmui
spec:
  # RWO Longhorn PVCs -> Recreate (RollingUpdate causes Multi-Attach deadlock).
  strategy:
    type: Recreate
  replicas: 0
  selector:
    matchLabels:
      app: swarmui
  template:
    metadata:
      labels:
        app: swarmui
    spec:
      # Whole-card GPU pattern; SwarmUI's embedded ComfyUI needs comfyui scaled to replicas:0 to free the card.
      nodeSelector:
        feature.node.kubernetes.io/pci-0300_10de.present: "true"
        gpu-worker: "true"
      runtimeClassName: nvidia
      priorityClassName: gpu-workload-preemptible
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      - key: "gpu"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      # Run as root to match the file ownership ComfyUI wrote on the shared NFS
      # models share (comfyui ran as root) and avoid Longhorn fsGroup friction.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        # Without this, kubelet chowns the whole 60k-file NFS models volume on EVERY start (6+ min ContainerCreating).
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: swarmui
        # No official image; jasonacox/swarmui is an unmodified build of upstream's StandardDockerfile.
        # renovate: datasource=docker depName=jasonacox/swarmui
        image: jasonacox/swarmui:0.9.7@sha256:4ca43a2c9c98217e699577c92019bae7aa48ae9049f5e84b6c182c13abae2530
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7801
        env:
        # RTX 3090 = Ampere = compute capability 8.6 (consistent with comfyui;
        # harmless for the prebuilt cu129 torch wheels SwarmUI's ComfyUI pulls).
        - name: TORCH_CUDA_ARCH_LIST
          value: "8.6"
        # NOTE: do NOT set NVIDIA_VISIBLE_DEVICES / CUDA_VISIBLE_DEVICES — they
        # override the device-plugin CDI injection (see my-apps/ai/CLAUDE.md).
        resources:
          requests:
            memory: "8Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
          limits:
            memory: "80Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: data
          mountPath: /SwarmUI/Data
        - name: dlbackend
          mountPath: /SwarmUI/dlbackend
        - name: output
          mountPath: /SwarmUI/Output
        - name: comfyui-models
          mountPath: /comfyui-models
        # Window covers image pull + .NET cold start; the multi-GB ComfyUI install runs after the wizard, app still serving.
        startupProbe:
          tcpSocket:
            port: 7801
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /
            port: 7801
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /
            port: 7801
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: swarmui-data
      - name: dlbackend
        persistentVolumeClaim:
          claimName: swarmui-dlbackend
      - name: output
        persistentVolumeClaim:
          claimName: swarmui-output
      - name: comfyui-models
        persistentVolumeClaim:
          claimName: swarmui-comfyui-models
