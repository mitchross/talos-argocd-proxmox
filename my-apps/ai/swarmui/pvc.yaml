# All Longhorn PVCs are RWO -> the Deployment MUST use strategy.type: Recreate.
# swarmui-comfyui-models reuses the ComfyUI NFS share: RWX write is only safe while comfyui stays at replicas:0.
---
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: swarmui-data
  namespace: swarmui
  labels:
    backup-exempt: "true"
  annotations:
    storage.vanillax.dev/backup-exempt-reason: "SwarmUI unused (never put into service); not worth backing up. Re-add a kopiur stub + dataSourceRef if it's ever adopted."
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: swarmui-dlbackend
  namespace: swarmui
  labels:
    backup-exempt: "true"
  annotations:
    storage.vanillax.dev/backup-exempt-reason: "SwarmUI auto-installs ComfyUI + Python/torch venv here on first run; fully rebuildable from upstream, intentionally not backed up"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 40Gi
  storageClassName: longhorn
---
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: swarmui-output
  namespace: swarmui
  labels:
    backup-exempt: "true"
  annotations:
    storage.vanillax.dev/backup-exempt-reason: "SwarmUI generated-image output dir; regenerable. Longhorn volume faulted 2026-06-27, salvage + re-enable backup if desired."
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: longhorn
---
---
# Same TrueNAS share ComfyUI used; set ModelRoot to /comfyui-models/ComfyUI/models in the install wizard.
# CSI driver (not legacy nfs:) — mountOptions like nconnect are silently ignored otherwise.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: swarmui-comfyui-models-nfs-pv
spec:
  capacity:
    storage: 250Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-comfyui-10g
  mountOptions:
    - nfsvers=4.1
    - nolock
    - tcp
    - noatime
    - rsize=1048576
    - wsize=1048576
    - nconnect=16
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: swarmui-comfyui-models-nfs-pv
    volumeAttributes:
      server: "192.168.10.133"
      share: "/mnt/ai-pool/comfyui"
---
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: swarmui-comfyui-models
  namespace: swarmui
  labels:
    backup-exempt: "true"
  annotations:
    storage.vanillax.dev/backup-exempt-reason: "Shared NFS-backed ComfyUI model cache (same NAS share as comfyui app); non-snapshottable, rebuildable"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 250Gi
  storageClassName: nfs-comfyui-10g
  volumeName: swarmui-comfyui-models-nfs-pv

# swarmui is unused: every PVC is backup-exempt and the kopiur-backup component is not wired in.
# To back up data/output: add kopiur/ stubs, the ../../common/kopiur-backup component, and PVC dataSourceRefs.
