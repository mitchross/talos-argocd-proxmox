# PostSync so a failed parked checkpoint never blocks vllm-server; it runs only after the app is
# healthy, so swap in vllm-server-abliterated only after both Jobs have succeeded once.
apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-download-abliterated-fp8
  namespace: vllm
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 4
  activeDeadlineSeconds: 21600
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        node.vanillax.dev/link: wired
      containers:
        - name: download
          image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
          command:
            - python3
            - /opt/repo-scripts/model_cache.py
            - download
            - --manifest
            - /opt/repo-scripts/model-manifest-abliterated-fp8.json
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: models
              mountPath: /models
      volumes:
        - name: repo-scripts
          configMap:
            name: vllm-abliterated-scripts
            defaultMode: 0555
        - name: models
          persistentVolumeClaim:
            claimName: vllm-download-models
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-cache-sync-abliterated-fp8
  namespace: vllm
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 4
  activeDeadlineSeconds: 21600
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        gpu-worker: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: sync
          image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
          command:
            - python3
            - /opt/repo-scripts/model_cache.py
            - sync
            - --manifest
            - /opt/repo-scripts/model-manifest-abliterated-fp8.json
            - --target
            - /dst
          resources:
            requests:
              cpu: 500m
              memory: 64Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: src
              mountPath: /src
              readOnly: true
            - name: dst
              mountPath: /dst
              subPath: vllm
      volumes:
        - name: repo-scripts
          configMap:
            name: vllm-abliterated-scripts
            defaultMode: 0555
        - name: src
          persistentVolumeClaim:
            claimName: vllm-models-pvc
        - name: dst
          persistentVolumeClaim:
            claimName: ai-model-cache-vllm
