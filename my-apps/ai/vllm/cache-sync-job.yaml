# Hydrates node-local NVMe from NFS; name+size avoids rereading the whole
# checkpoint on warm syncs.
apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-cache-sync
  namespace: vllm
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 4
  activeDeadlineSeconds: 21600
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        gpu-worker: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: sync
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command:
            - /bin/sh
            - -ec
            - /opt/repo-scripts/sync-model-cache.sh
          resources:
            requests:
              cpu: 500m
              # The serving pod reserves 8 GiB on this node. The copy needs little
              # anonymous memory; its file cache is reclaimable and capped below.
              memory: 64Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: src
              mountPath: /src
              readOnly: true
            - name: dst
              mountPath: /dst
              subPath: vllm
      volumes:
        - name: repo-scripts
          configMap:
            name: vllm-scripts
            defaultMode: 0555
        - name: src
          persistentVolumeClaim:
            claimName: vllm-models-pvc
        - name: dst
          persistentVolumeClaim:
            claimName: ai-model-cache-vllm
