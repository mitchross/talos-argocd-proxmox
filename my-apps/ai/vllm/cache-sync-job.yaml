# Verify the pinned archive and local copy before publishing cache readiness.
apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-cache-sync
  namespace: vllm
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 4
  activeDeadlineSeconds: 21600
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        gpu-worker: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: sync
          image: python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
          command:
            - python3
            - /opt/repo-scripts/model_cache.py
            - sync
            - --target
            - /dst
          resources:
            requests:
              cpu: 500m
              # The serving pod reserves 8 GiB on this node. The copy needs little
              # anonymous memory; its file cache is reclaimable and capped below.
              memory: 64Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: src
              mountPath: /src
              readOnly: true
            - name: dst
              mountPath: /dst
              subPath: vllm
      volumes:
        - name: repo-scripts
          configMap:
            name: vllm-scripts
            defaultMode: 0555
        - name: src
          persistentVolumeClaim:
            claimName: vllm-models-pvc
        - name: dst
          persistentVolumeClaim:
            claimName: ai-model-cache-vllm
