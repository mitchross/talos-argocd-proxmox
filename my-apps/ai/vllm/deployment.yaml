apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
  namespace: vllm
  labels:
    app: vllm-server
spec:
  # BASELINE B: ONE 3090, TP=1. The second card is free; llama-cpp-server stays 0.
  # Revert this commit to restore Baseline A (2x3090, TP=2, FP8, 262144, 313,367-token pool).
  replicas: 1
  strategy:
    type: Recreate            # whole-card GPU workload; never two pods on the cards at once
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: vllm-server
  template:
    metadata:
      labels:
        app: vllm-server
    spec:
      # Don't inject legacy Docker-link service env vars (VLLM_SERVICE_*, etc.).
      # The Service is named `vllm-service`, so those collide with vLLM's own
      # VLLM_* env scan and spam "Unknown vLLM environment variable" warnings.
      enableServiceLinks: false
      restartPolicy: Always
      runtimeClassName: nvidia
      priorityClassName: gpu-workload-high
      terminationGracePeriodSeconds: 120
      nodeSelector:
        feature.node.kubernetes.io/pci-0300_10de.present: "true"
        gpu-worker: "true"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: vllm-server
          # Digest-pinned (== `latest` at pin time, 2026-06). Renovate-trackable + immutable.
          image: vllm/vllm-openai:v0.27.1@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967
          imagePullPolicy: IfNotPresent
          # The image entrypoint runs `vllm serve`; the first arg is the positional model_tag.
          args:
            # Baseline B (Path B): W4A16 body + INT8 g128 lm_head + BF16 embed_tokens.
            # Stock vLLM serves this unpatched — qwen3_5.py already passes quant_config to ParallelLMHead.
            - "/models/Qwen3.8-27B-W4A16-AutoRound-3090-int8lmhead"
            # served-model-name is a LIST (nargs+): the next token MUST be a flag to end it.
            - "--served-model-name"
            - "qwen3.8-27b"
            - "--gpu-memory-utilization"
            - "0.90"                                   # MTP needs headroom for DeltaNet decode workspace
            - "--max-model-len"
            - "65536"                                  # vision tower trades context for image understanding on 24 GiB
            - "--max-num-seqs"
            # MTP reserves recurrent state for target and draft positions; three
            # slots keeps one full-length request affordable on a 24 GiB card.
            - "3"
            - "--limit-mm-per-prompt"
            - '{"image":1,"video":0}'                   # bound multimodal profiling and VRAM to one image per request
            - "--async-scheduling"
            - "--compilation-config"
            # capture_size 4 covers max-num-seqs=3; upstream's 64 is dead VRAM at this concurrency.
            - '{"max_cudagraph_capture_size":4,"custom_ops":["+rms_norm","+silu_and_mul"]}'
            - "--enable-auto-tool-choice"              # Perplexica sends tool_choice=auto — never drop this
            - "--tool-call-parser"
            - "qwen3_coder"
            - "--reasoning-parser"
            - "qwen3"                                  # splits <think> out of content into reasoning_content
            - "--default-chat-template-kwargs"
            - '{"enable_thinking": false}'             # thinking OFF by default; UIs re-enable per-request
            - "--kv-cache-dtype"
            - "fp8_e4m3"                               # halves KV bytes/token; scales uncalibrated (1.0)
            - "--mamba-ssm-cache-dtype"
            - "float16"                                # halves per-sequence DeltaNet recurrent state
            - "--enable-prefix-caching"                # the metric the single-vs-dual comparison turns on
            - "--enable-chunked-prefill"
            - "--max-num-batched-tokens"
            - "2048"                                   # 8192 inflates the profiled activation peak and shrinks the pool
            - "--speculative-config"
            - '{"method":"mtp","num_speculative_tokens":2}'
            - "--override-generation-config"
            - '{"temperature":0.7,"top_p":0.8,"top_k":20,"presence_penalty":1.5}'
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
          env:
            # GPU selection is handled by the device plugin + CDI (whole-card, time-slicing OFF).
            # Do NOT set NVIDIA_VISIBLE_DEVICES / CUDA_VISIBLE_DEVICES — they override CDI injection.
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
            - name: HF_HUB_OFFLINE          # models are local on NFS; never call the Hub at runtime
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: VLLM_NO_USAGE_STATS     # no phone-home
              value: "1"
            - name: OMP_NUM_THREADS         # silences the 16->1 thread warning; matches club-3090 recipe
              value: "1"
            # Non-optional at high util: the DeltaNet prefill kernels allocate transient
            # workspace and fragment the allocator without expandable segments.
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 360        # TP load of a 27B can take minutes
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Inference runs on the GPU; CPU request is just a scheduling
            # reservation. Keep it low (bursts to the 14-core limit) so the
            # single 32-vCPU worker has headroom for the rest of the fleet.
            requests:
              nvidia.com/gpu: "1"
              cpu: "1"
              # Weights live in GPU VRAM; host RAM steady-state is ~1.2Gi.
              # Request 8Gi (headroom for load spikes); 64Gi limit allows burst.
              memory: 8Gi
            limits:
              nvidia.com/gpu: "1"
              memory: 64Gi
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: dshm
              mountPath: /dev/shm        # kept: torch still uses it; default 64Mi is too small
            # Both paths must persist or the engine recompiles every boot.
            - name: compile-cache
              mountPath: /root/.cache/vllm/torch_compile_cache
              subPath: torch_compile
            - name: compile-cache
              mountPath: /root/.triton/cache
              subPath: triton
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: compile-cache
          persistentVolumeClaim:
            claimName: vllm-compile-cache
