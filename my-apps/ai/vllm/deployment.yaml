apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
  namespace: vllm
  labels:
    app: vllm-server
  annotations:
    argocd.argoproj.io/sync-wave: "1"    # after the wave-0 cache-sync hook
spec:
  # Both cards belong to this server; llama.cpp is the parked rollback.
  replicas: 1
  strategy:
    type: Recreate            # whole-card GPU workload; never two pods on the cards at once
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: vllm-server
  template:
    metadata:
      labels:
        app: vllm-server
    spec:
      # Service name vllm-service makes Docker-link env vars collide with vLLM's VLLM_* env scan (spams warnings).
      enableServiceLinks: false
      restartPolicy: Always
      runtimeClassName: nvidia
      priorityClassName: gpu-workload-high
      terminationGracePeriodSeconds: 120
      nodeSelector:
        feature.node.kubernetes.io/pci-0300_10de.present: "true"
        gpu-worker: "true"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        # Argo self-heal can apply the Deployment before its Sync hook.
        - name: wait-for-model-cache
          image: python:3.13-alpine@sha256:7415fbc3c9e4979cc717d92377ab2bc7b2b4a2af1ac03cc52b5f3f88efedaf3a
          command:
            - python3
            - /opt/repo-scripts/model_cache.py
            - wait
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: models
              mountPath: /models
              subPath: vllm
              readOnly: true
      containers:
        - name: vllm-server
          # Keep the stock runtime pinned; no community kernel overlays.
          image: vllm/vllm-openai:v0.28.0@sha256:61fc8a896b0a4fbbbdc063bc4b0dbc25ce98e02b5050c24aeb7830ac02039b14
          imagePullPolicy: IfNotPresent
          # The image entrypoint runs `vllm serve`; the first arg is the positional model_tag.
          args:
            - /models/Qwen3.8-27B-FP8-017b9c7af6b5
            - --served-model-name
            - qwen3.8-27b
            - --quantization
            - fp8
            - --dtype
            - bfloat16
            - --tensor-parallel-size
            - "2"
            - --distributed-executor-backend
            - mp
            # Guest topology reports no peer access; use NCCL host transport.
            - --disable-custom-all-reduce
            - --gpu-memory-utilization
            - "0.92"
            - --max-model-len
            - "262144"
            - --max-num-seqs
            - "2"
            - --limit-mm-per-prompt
            - '{"image":1,"video":0}'
            - --async-scheduling
            - --compilation-config
            - '{"max_cudagraph_capture_size":4,"custom_ops":["+rms_norm","+silu_and_mul"]}'
            - --enable-auto-tool-choice
            - --tool-call-parser
            - qwen3_coder
            - --reasoning-parser
            - qwen3
            - --default-chat-template-kwargs
            - '{"enable_thinking":true,"reasoning_effort":"low","preserve_thinking":true}'
            # Triton rejects FP8 KV on SM86; FlashInfer supports this path.
            - --attention-config
            - '{"backend":"FLASHINFER"}'
            - --kv-cache-dtype
            - fp8_e4m3
            - --mamba-ssm-cache-dtype
            - float16
            - --enable-prefix-caching
            - --enable-chunked-prefill
            - --max-num-batched-tokens
            - "2048"
            # Speculation stays off until the GDN long-session faults are fixed.
            - --override-generation-config
            - '{"temperature":1.0,"top_p":0.95,"top_k":20,"min_p":0.0,"presence_penalty":0.0,"repetition_penalty":1.0}'
            - --enable-force-include-usage
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          env:
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: spawn
            - name: NCCL_P2P_DISABLE
              value: "1"
            - name: NCCL_CUMEM_ENABLE
              value: "0"
            - name: OMP_NUM_THREADS
              value: "1"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 360        # TP load of a 27B can take minutes
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Host RAM includes loading and shared-memory transport between GPUs.
            requests:
              nvidia.com/gpu: "2"
              cpu: "1"
              # Keep loading headroom without reserving another full model in RAM.
              memory: 8Gi
            limits:
              nvidia.com/gpu: "2"
              memory: 64Gi
          volumeMounts:
            - name: models
              mountPath: /models
              subPath: vllm          # shares the NVMe volume with llama-cpp's GGUF tree
              readOnly: true
            - name: dshm
              mountPath: /dev/shm        # kept: torch still uses it; default 64Mi is too small
            # Both paths must persist or the engine recompiles every boot.
            - name: compile-cache
              mountPath: /root/.cache/vllm/torch_compile_cache
              subPath: torch_compile
            - name: compile-cache
              mountPath: /root/.triton/cache
              subPath: triton
      volumes:
        - name: repo-scripts
          configMap:
            name: vllm-scripts
            defaultMode: 0555
        # Node-local NVMe, NOT the NFS PVC. cache-sync-job.yaml hydrates it from
        # NFS at wave 0; NFS stays the canonical archive and out of the serve path.
        - name: models
          persistentVolumeClaim:
            claimName: ai-model-cache-vllm
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: compile-cache
          persistentVolumeClaim:
            claimName: vllm-compile-cache
