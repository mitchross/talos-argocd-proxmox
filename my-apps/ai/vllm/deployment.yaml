apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
  namespace: vllm
  labels:
    app: vllm-server
  annotations:
    argocd.argoproj.io/sync-wave: "1"    # after the wave-0 cache-sync hook
spec:
  # Active backend; owns the sole RTX 3090 (llama-cpp is parked at 0).
  replicas: 1
  strategy:
    type: Recreate            # whole-card GPU workload; never two pods on the cards at once
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: vllm-server
  template:
    metadata:
      labels:
        app: vllm-server
    spec:
      # Service name vllm-service makes Docker-link env vars collide with vLLM's VLLM_* env scan (spams warnings).
      enableServiceLinks: false
      restartPolicy: Always
      runtimeClassName: nvidia
      priorityClassName: gpu-workload-high
      terminationGracePeriodSeconds: 120
      nodeSelector:
        feature.node.kubernetes.io/pci-0300_10de.present: "true"
        gpu-worker: "true"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        # Argo self-heal can apply the Deployment before its Sync hook.
        - name: wait-for-model-cache
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command:
            - /bin/sh
            - -ec
            - /opt/repo-scripts/wait-for-model-cache.sh
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: models
              mountPath: /models
              subPath: vllm
              readOnly: true
      containers:
        - name: vllm-server
          # Digest-pinned (== `latest` at pin time, 2026-06). Renovate-trackable + immutable.
          image: vllm/vllm-openai:v0.28.0@sha256:61fc8a896b0a4fbbbdc063bc4b0dbc25ce98e02b5050c24aeb7830ac02039b14
          imagePullPolicy: IfNotPresent
          # The image entrypoint runs `vllm serve`; the first arg is the positional model_tag.
          args:
            # Baseline B (Path B): W4A16 body + INT8 g128 lm_head + BF16 embed_tokens.
            # Stock vLLM serves this unpatched — qwen3_5.py already passes quant_config to ParallelLMHead.
            - "/models/Qwen3.8-27B-W4A16-AutoRound-3090-int8lmhead"
            # served-model-name is a LIST (nargs+): the next token MUST be a flag to end it.
            - "--served-model-name"
            - "qwen3.8-27b"
            - "--gpu-memory-utilization"
            - "0.93"                                   # 0.90 left only 1.9 GiB KV (2.45 needed for 65536) — boot-verified floor; keep ≥1 GiB free for DeltaNet workspace
            - "--max-model-len"
            - "65536"                                  # vision tower trades context for image understanding on 24 GiB
            - "--max-num-seqs"
            # MTP reserves recurrent state for target and draft positions; three
            # slots keeps one full-length request affordable on a 24 GiB card.
            - "3"
            - "--limit-mm-per-prompt"
            - '{"image":1,"video":0}'                   # bound multimodal profiling and VRAM to one image per request
            - "--async-scheduling"
            - "--compilation-config"
            # capture_size 4 covers max-num-seqs=3; upstream's 64 is dead VRAM at this concurrency.
            - '{"max_cudagraph_capture_size":4,"custom_ops":["+rms_norm","+silu_and_mul"]}'
            - "--enable-auto-tool-choice"              # Perplexica sends tool_choice=auto — never drop this
            - "--tool-call-parser"
            - "qwen3_coder"
            - "--reasoning-parser"
            - "qwen3"                                  # splits <think> out of content into reasoning_content
            - "--default-chat-template-kwargs"
            - '{"enable_thinking": false}'             # thinking OFF by default; UIs re-enable per-request
            - "--kv-cache-dtype"
            - "fp8_e4m3"                               # halves KV bytes/token; scales uncalibrated (1.0)
            - "--mamba-ssm-cache-dtype"
            - "float16"                                # halves per-sequence DeltaNet recurrent state
            - "--enable-prefix-caching"                # the metric the single-vs-dual comparison turns on
            - "--enable-chunked-prefill"
            - "--max-num-batched-tokens"
            - "2048"                                   # 8192 inflates the profiled activation peak and shrinks the pool
            - "--speculative-config"
            - '{"method":"mtp","num_speculative_tokens":2}'
            - "--override-generation-config"
            - '{"temperature":0.7,"top_p":0.8,"top_k":20,"presence_penalty":1.5}'
            - "--enable-force-include-usage"             # usage on every stream chunk final — Open WebUI shows token stats without per-model DB config
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
          env:
            # GPU selection is handled by the device plugin + CDI (whole-card, time-slicing OFF).
            # Do NOT set NVIDIA_VISIBLE_DEVICES / CUDA_VISIBLE_DEVICES — they override CDI injection.
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
            - name: HF_HUB_OFFLINE          # models are local on NFS; never call the Hub at runtime
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: VLLM_NO_USAGE_STATS     # no phone-home
              value: "1"
            - name: OMP_NUM_THREADS         # silences the 16->1 thread warning; matches club-3090 recipe
              value: "1"
            # Non-optional at high util: the DeltaNet prefill kernels allocate transient
            # workspace and fragment the allocator without expandable segments.
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 360        # TP load of a 27B can take minutes
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # GPU does the work; keep the CPU request low so the single 32-vCPU worker has headroom.
            requests:
              nvidia.com/gpu: "1"
              cpu: "1"
              # Weights live in GPU VRAM; host RAM steady-state is ~1.2Gi.
              # Request 8Gi (headroom for load spikes); 64Gi limit allows burst.
              memory: 8Gi
            limits:
              nvidia.com/gpu: "1"
              memory: 64Gi
          volumeMounts:
            - name: models
              mountPath: /models
              subPath: vllm          # shares the NVMe volume with llama-cpp's GGUF tree
              readOnly: true
            - name: dshm
              mountPath: /dev/shm        # kept: torch still uses it; default 64Mi is too small
            # Both paths must persist or the engine recompiles every boot.
            - name: compile-cache
              mountPath: /root/.cache/vllm/torch_compile_cache
              subPath: torch_compile
            - name: compile-cache
              mountPath: /root/.triton/cache
              subPath: triton
      volumes:
        - name: repo-scripts
          configMap:
            name: vllm-scripts
            defaultMode: 0555
        # Node-local NVMe, NOT the NFS PVC. cache-sync-job.yaml hydrates it from
        # NFS at wave 0; NFS stays the canonical archive and out of the serve path.
        - name: models
          persistentVolumeClaim:
            claimName: ai-model-cache-vllm
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: compile-cache
          persistentVolumeClaim:
            claimName: vllm-compile-cache
