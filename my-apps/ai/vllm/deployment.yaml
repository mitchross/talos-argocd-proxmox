apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
  namespace: vllm
  labels:
    app: vllm-server
  annotations:
    argocd.argoproj.io/sync-wave: "1"    # after the wave-0 cache-sync hook
spec:
  replicas: 1
  strategy:
    type: Recreate            # whole-card GPU workload; never two pods on the cards at once
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: vllm-server
  template:
    metadata:
      labels:
        app: vllm-server
    spec:
      # Service name vllm-service makes Docker-link env vars collide with vLLM's VLLM_* env scan (spams warnings).
      enableServiceLinks: false
      restartPolicy: Always
      runtimeClassName: nvidia
      priorityClassName: gpu-workload-high
      terminationGracePeriodSeconds: 120
      nodeSelector:
        feature.node.kubernetes.io/pci-0300_10de.present: "true"
        gpu-worker: "true"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        # Argo self-heal can apply the Deployment before its Sync hook.
        - name: wait-for-model-cache
          image: python:3.15-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
          command:
            - python3
            - /opt/repo-scripts/model_cache.py
            - wait
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: models
              mountPath: /models
              subPath: vllm
              readOnly: true
      containers:
        - name: vllm-server
          # Built and smoke-tested in homelab-images.
          image: ghcr.io/mitchross/vllm-qwen38-dualfast:0.32.0-dualfast.2@sha256:fba9042e57effa23fd3c47aafe3c91081fa2f81c4cce244d4fed49299bf5808c
          imagePullPolicy: IfNotPresent
          # The image entrypoint runs `vllm serve`; the first arg is the positional model_tag.
          args:
            - /models/Qwen3.8-27B-int4-AutoRound-b4c61732c4f2
            - --served-model-name
            - qwen3.8-27b
            - --quantization
            - auto_round
            - --dtype
            - bfloat16
            - --tensor-parallel-size
            - "2"
            - --distributed-executor-backend
            - mp
            # Guest topology reports no peer access; use NCCL host transport.
            - --disable-custom-all-reduce
            - --gpu-memory-utilization
            - "0.90"
            # Beyond native 262K needs YaRN; planned A/B only, never enabled here.
            - --max-model-len
            - "262144"
            # Slot count only; the KV pool (boot log "GPU KV cache size") bounds what runs. Two slots queued Hindsight retries 50 deep.
            - --max-num-seqs
            - "16"
            - --limit-mm-per-prompt
            - '{"image":1,"video":0}'
            - --async-scheduling
            # CUDA graphs must cover all 16 slots; at 4, batches over 4 ran without graphs (8 users: 65 tok/s total).
            - --compilation-config
            - '{"max_cudagraph_capture_size":16,"custom_ops":["+rms_norm","+silu_and_mul"]}'
            - --enable-auto-tool-choice
            - --tool-call-parser
            - qwen3_coder
            - --reasoning-parser
            - qwen3
            # When the thinking cap hits, push the model to answer; a bare </think> let xhigh keep reasoning in the reply.
            - --reasoning-config
            - '{"reasoning_start_str":"<think>","reasoning_end_str":"\n\nI have to give the solution based on the reasoning directly now.\n</think>\n\n"}'
            - --chat-template
            - /etc/club3090/qwen38-reasoning-effort-template/chat_template.jinja
            - --default-chat-template-kwargs
            - '{"enable_thinking":true,"reasoning_effort":"xhigh","preserve_thinking":true}'
            # Triton rejects FP8 KV on SM86; FlashInfer supports this path.
            - --attention-config
            - '{"backend":"FLASHINFER"}'
            - --kv-cache-dtype
            - fp8_e4m3
            - --mamba-ssm-cache-dtype
            - bfloat16
            - --enable-prefix-caching
            # Already the default with prefix caching on; explicit so a vLLM upgrade can't shift it.
            - --mamba-cache-mode
            - align
            - --prefix-match-unit
            - "16"
            - --enable-chunked-prefill
            # Shared 8192-token prefill budget; each long request gets at most 4096 per step.
            - --max-num-batched-tokens
            - "8192"
            - --long-prefill-token-threshold
            - "4096"
            # Speculation stays off for GDN long-session faults; MTP n=4 is the planned A/B.
            # Sampler is a community-reported mitigation (QwenLM/Qwen3.8#216), not an upstream default; keep WebUI/Pi thinking=1.05, off=1.0 in sync.
            - --override-generation-config
            - '{"temperature":1.0,"top_p":0.95,"top_k":20,"min_p":0.0,"presence_penalty":0.0,"repetition_penalty":1.05}'
            - --trust-remote-code
            - --enable-prompt-tokens-details
            - --enable-force-include-usage
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          env:
            # Static output of effort_budget.py shell-env; requests that send no effort get xhigh's 16K cap.
            - name: CLUB3090_REASONING_EFFORT_BUDGETS
              value: '{"high":16384,"low":4096,"max":16384,"medium":16384,"minimal":4096,"xhigh":16384}'
            - name: CLUB3090_DEFAULT_THINKING_TOKEN_BUDGET
              value: "16384"
            - name: VLLM_MARLIN_INPUT_DTYPE
              value: int8
            - name: VLLM_USE_FLASHINFER_SAMPLER
              value: "0"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: spawn
            - name: NCCL_P2P_DISABLE
              value: "1"
            - name: NCCL_CUMEM_ENABLE
              value: "0"
            - name: OMP_NUM_THREADS
              value: "1"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 360        # TP load of a 27B can take minutes
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Host RAM includes loading and shared-memory transport between GPUs.
            requests:
              nvidia.com/gpu: "2"
              cpu: "1"
              # Keep loading headroom without reserving another full model in RAM.
              memory: 8Gi
            limits:
              nvidia.com/gpu: "2"
              memory: 64Gi
          volumeMounts:
            - name: models
              mountPath: /models
              subPath: vllm          # weights live under /vllm on the shared NVMe volume
              readOnly: true
            - name: dshm
              mountPath: /dev/shm        # kept: torch still uses it; default 64Mi is too small
            # Both paths must persist or the engine recompiles every boot.
            - name: compile-cache
              mountPath: /root/.cache/vllm/torch_compile_cache
              subPath: torch_compile
            - name: compile-cache
              mountPath: /root/.triton/cache
              subPath: triton
      volumes:
        - name: repo-scripts
          configMap:
            name: vllm-scripts
            defaultMode: 0555
        # Node-local NVMe, NOT the NFS PVC. cache-sync-job.yaml hydrates it from
        # NFS at wave 0; NFS stays the canonical archive and out of the serve path.
        - name: models
          persistentVolumeClaim:
            claimName: ai-model-cache-vllm
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: compile-cache
          persistentVolumeClaim:
            claimName: vllm-compile-cache
