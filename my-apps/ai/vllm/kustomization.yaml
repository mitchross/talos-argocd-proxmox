apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vllm

# List EVERY file here — unlisted YAML is never deployed (Kustomize only renders what's listed).
resources:
  - vpa.yaml
  - namespace.yaml
  - pvc.yaml
  - pvc-model-cache.yaml
  - download-pvc.yaml
  - download-model-job.yaml
  - cache-sync-job.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - servicemonitor.yaml

# vLLM owns one RTX 3090; Strata (my-apps/ai/strata) owns the other.
replicas:
  - name: vllm-server
    count: 1

configMapGenerator:
  - name: vllm-scripts
    files:
      - scripts/model_cache.py
      - model-manifest.json
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
