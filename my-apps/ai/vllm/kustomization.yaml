apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vllm

# List EVERY file here — unlisted YAML is never deployed (Kustomize only renders what's listed).
resources:
  - vpa.yaml
  - namespace.yaml
  - pvc.yaml
  - pvc-model-cache.yaml
  - download-pvc.yaml
  - download-model-job.yaml
  - cache-sync-job.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - servicemonitor.yaml

replicas:
  - name: vllm-server
    count: 1

# Model picker: no component = INT4 AutoRound (default). Uncomment one line to switch; same served name.
components:
  # - models/abliterated-fp8   # Huihui Qwen3.8-27B abliterated, FP8

configMapGenerator:
  - name: vllm-scripts
    files:
      - scripts/model_cache.py
      - model-manifest.json=model-manifest-int4.json
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
