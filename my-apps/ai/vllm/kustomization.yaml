apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vllm

# List EVERY file here — unlisted YAML is never deployed (Kustomize only renders what's listed).
resources:
  - vpa.yaml
  - namespace.yaml
  - pvc.yaml
  - pvc-model-cache.yaml
  - cache-sync-job.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml

# Production cutover: llama.cpp owns the sole RTX 3090. Keep vLLM artifacts
# intact at zero replicas for a one-PR rollback if needed.
replicas:
  - name: vllm-server
    count: 0

configMapGenerator:
  - name: vllm-scripts
    files:
      - scripts/sync-model-cache.sh
      - scripts/wait-for-model-cache.sh
