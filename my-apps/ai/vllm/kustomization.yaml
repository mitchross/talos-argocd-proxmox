apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vllm

# List EVERY file here — unlisted YAML is never deployed (Kustomize only renders what's listed).
resources:
  - vpa.yaml
  - namespace.yaml
  - pvc.yaml
  - pvc-model-cache.yaml
  - download-pvc.yaml
  - download-model-job.yaml
  - cache-sync-job.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - servicemonitor.yaml

replicas:
  - name: vllm-server
    count: 1

# Model picker: exactly ONE line active. Clients always see the served name qwen3.8-27b.
components:
  - models/frozenlock-qwen3.8-27b-int4-autoround      # ON  — INT4 W4A8 (default)
  # - models/qwen-qwen3.8-27b-fp8                    # OFF — official FP8
  # - models/huihui-qwen3.8-27b-abliterated-fp8      # OFF — abliterated FP8

configMapGenerator:
  - name: vllm-scripts
    files:
      - scripts/model_cache.py
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
