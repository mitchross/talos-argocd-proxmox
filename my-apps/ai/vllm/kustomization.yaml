apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vllm

# List EVERY file here — unlisted YAML is never deployed (Kustomize only renders what's listed).
resources:
  - vpa.yaml
  - namespace.yaml
  - pvc.yaml
  - pvc-model-cache.yaml
  - download-pvc.yaml
  - download-model-job.yaml
  - cache-sync-job.yaml
  - deployment.yaml
  - abliterated-jobs.yaml
  - deployment-abliterated.yaml
  - service.yaml
  - httproute.yaml
  - servicemonitor.yaml

# Scale-swap: exactly one of these holds both GPUs at a time.
replicas:
  - name: vllm-server
    count: 1
  - name: vllm-server-abliterated
    count: 0

configMapGenerator:
  - name: vllm-scripts
    files:
      - scripts/model_cache.py
      - model-manifest.json=model-manifest-int4.json
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
  # Separate ConfigMap so abliterated changes never roll the main vllm-server pod.
  - name: vllm-abliterated-scripts
    files:
      - scripts/model_cache.py
      - model-manifest-abliterated-fp8.json
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
