apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vllm

# List EVERY file here — unlisted YAML is never deployed (Kustomize only renders what's listed).
resources:
  - vpa.yaml
  - namespace.yaml
  - pvc.yaml
  - pvc-model-cache.yaml
  - download-pvc.yaml
  - download-model-job.yaml
  - cache-sync-job.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - servicemonitor.yaml

# Parked for the Strata two-card test; qwen3.8-27b falls back to deepseek-flash in LiteLLM.
# Back to 1 (or revert the test PR) to give vLLM both RTX 3090s again.
replicas:
  - name: vllm-server
    count: 0

configMapGenerator:
  - name: vllm-scripts
    files:
      - scripts/model_cache.py
      - model-manifest.json
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
