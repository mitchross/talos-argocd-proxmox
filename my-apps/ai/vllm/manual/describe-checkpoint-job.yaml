# Manual, one-off: not listed in ../kustomization.yaml, so Argo never applies it.
# Hashes a checkpoint on the NFS archive and prints a model-manifest.json for it.
# Steps: my-apps/ai/vllm/README.md, "Single-card checkpoint".
apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-describe-checkpoint
  namespace: vllm
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        node.vanillax.dev/link: wired
      containers:
        - name: describe
          image: python:3.15-alpine@sha256:20a82dbc2783112ddb91d1534603f802d222a3e63e593cd002eb2ac534e70211
          command:
            - python3
            - /opt/repo-scripts/model_cache.py
            - describe
            - --source
            - /src
            - --directory
            - Qwen3.8-27B-W4A16-AutoRound-3090-int8lmhead
          resources:
            requests:
              cpu: 250m
              memory: 64Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: src
              mountPath: /src
              readOnly: true
      volumes:
        - name: repo-scripts
          configMap:
            name: vllm-describe-checkpoint
        - name: src
          persistentVolumeClaim:
            claimName: vllm-models-pvc
            readOnly: true
