# Swaps vllm-server to the abliterated Qwen3.8-27B FP8 checkpoint; enable it under `components:` in ../../kustomization.yaml.
# The `test` ops fail the build if the base args or env move, instead of patching the wrong entry.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Target selectors keep the standalone CI render a no-op instead of a missing-base error.
patches:
  - path: manifest-patch.yaml
    target:
      kind: ConfigMap
      name: vllm-scripts
  - target:
      kind: Deployment
      name: vllm-server
    patch: |
      - op: test
        path: /spec/template/spec/containers/0/args/0
        value: /models/Qwen3.8-27B-int4-AutoRound-b4c61732c4f2
      - op: replace
        path: /spec/template/spec/containers/0/args/0
        value: /models/Huihui-Qwen3.8-27B-abliterated-FP8-badcb1961b64
      - op: test
        path: /spec/template/spec/containers/0/args/4
        value: humming
      - op: replace
        path: /spec/template/spec/containers/0/args/4
        value: fp8
      - op: test
        path: /spec/template/spec/containers/0/env/2/name
        value: VLLM_HUMMING_INPUT_QUANT_CONFIG
      - op: remove
        path: /spec/template/spec/containers/0/env/2
