# Qwen/Qwen3.8-27B-FP8: the official block-FP8 checkpoint.
# `test` ops require the base placeholders, so a second enabled model fails the build.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - path: manifest-patch.yaml
    target:
      kind: ConfigMap
      name: vllm-scripts
  - target:
      kind: Deployment
      name: vllm-server
    patch: |
      - op: test
        path: /spec/template/spec/containers/0/args/0
        value: /models/SET-BY-MODEL-COMPONENT
      - op: replace
        path: /spec/template/spec/containers/0/args/0
        value: /models/Qwen3.8-27B-FP8-017b9c7af6b5
      - op: test
        path: /spec/template/spec/containers/0/args/4
        value: SET-BY-MODEL-COMPONENT
      - op: replace
        path: /spec/template/spec/containers/0/args/4
        value: fp8
