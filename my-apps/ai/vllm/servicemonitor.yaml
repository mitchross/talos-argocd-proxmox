# Prometheus here uses empty serviceMonitor*Selectors — discovered automatically, no release label needed.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm
  namespace: vllm
  labels:
    app: vllm-server
spec:
  selector:
    matchLabels:
      app: vllm-server        # matches Service metadata.labels (service.yaml)
  endpoints:
    - port: http              # named Service port 8080 → container 8000; /metrics is served here
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
