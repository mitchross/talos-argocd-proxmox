# Temporary: one-3090 prefill test (TP=1, same flags). Revert after the run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-single-test
  namespace: vllm
  labels:
    app: vllm-single-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: vllm-single-test
  template:
    metadata:
      labels:
        app: vllm-single-test
    spec:
      enableServiceLinks: false
      restartPolicy: Always
      runtimeClassName: nvidia
      priorityClassName: gpu-workload-high
      terminationGracePeriodSeconds: 120
      nodeSelector:
        feature.node.kubernetes.io/pci-0300_10de.present: 'true'
        gpu-worker: 'true'
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
      - name: wait-for-model-cache
        image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
        command:
        - python3
        - /opt/repo-scripts/model_cache.py
        - wait
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: repo-scripts
          mountPath: /opt/repo-scripts
          readOnly: true
        - name: models
          mountPath: /models
          subPath: vllm
          readOnly: true
      containers:
      - name: vllm-server
        image: ghcr.io/mitchross/vllm-qwen38-dualfast:0.34.0-dualfast.1@sha256:8e97a6174807bf5fd550a3af650dc816d54fc4368751a71c1b94055ed58aba9d
        imagePullPolicy: IfNotPresent
        args:
        - /models/Qwen3.8-27B-int4-AutoRound-b4c61732c4f2
        - --served-model-name
        - qwen3.8-27b
        - --quantization
        - humming
        - --dtype
        - bfloat16
        - --tensor-parallel-size
        - '1'
        - --distributed-executor-backend
        - mp
        - --gpu-memory-utilization
        - '0.94'
        - --no-enable-extensible-kv-cache
        - --max-model-len
        - '16384'
        - --max-num-seqs
        - '4'
        - --limit-mm-per-prompt
        - '{"image":1,"video":0}'
        - --async-scheduling
        - --compilation-config
        - '{"max_cudagraph_capture_size":4,"custom_ops":["+rms_norm","+silu_and_mul"]}'
        - --enable-auto-tool-choice
        - --tool-call-parser
        - qwen3_coder
        - --reasoning-parser
        - qwen3
        - --reasoning-config
        - '{"reasoning_start_str":"<think>","reasoning_end_str":"\n\nI have to give the solution based on the reasoning directly now.\n</think>\n\n"}'
        - --chat-template
        - /etc/club3090/qwen38-reasoning-effort-template/chat_template.jinja
        - --default-chat-template-kwargs
        - '{"enable_thinking":true,"reasoning_effort":"xhigh","preserve_thinking":true}'
        - --attention-config
        - '{"backend":"FLASHINFER"}'
        - --kv-cache-dtype
        - fp8_e4m3
        - --mamba-ssm-cache-dtype
        - bfloat16
        - --enable-prefix-caching
        - --prefix-match-unit
        - '16'
        - --enable-chunked-prefill
        - --max-num-batched-tokens
        - '8192'
        - --long-prefill-token-threshold
        - '4096'
        - --override-generation-config
        - '{"temperature":1.0,"top_p":0.95,"top_k":20,"min_p":0.0,"presence_penalty":0.0,"repetition_penalty":1.05}'
        - --trust-remote-code
        - --enable-prompt-tokens-details
        - --enable-force-include-usage
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        env:
        - name: CLUB3090_REASONING_EFFORT_BUDGETS
          value: '{"high":16384,"low":4096,"max":16384,"medium":16384,"minimal":4096,"xhigh":16384}'
        - name: CLUB3090_DEFAULT_THINKING_TOKEN_BUDGET
          value: '16384'
        - name: VLLM_HUMMING_INPUT_QUANT_CONFIG
          value: '{"dtype":"int8"}'
        - name: VLLM_USE_FLASHINFER_SAMPLER
          value: '0'
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
        - name: HF_HUB_OFFLINE
          value: '1'
        - name: TRANSFORMERS_OFFLINE
          value: '1'
        - name: VLLM_NO_USAGE_STATS
          value: '1'
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: spawn
        - name: NCCL_P2P_DISABLE
          value: '1'
        - name: NCCL_CUMEM_ENABLE
          value: '0'
        - name: OMP_NUM_THREADS
          value: '1'
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: expandable_segments:True
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 360
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            nvidia.com/gpu: '1'
            cpu: '1'
            memory: 8Gi
          limits:
            nvidia.com/gpu: '1'
            memory: 64Gi
        volumeMounts:
        - name: models
          mountPath: /models
          subPath: vllm
          readOnly: true
        - name: dshm
          mountPath: /dev/shm
        - name: compile-cache
          mountPath: /root/.cache/vllm/torch_compile_cache
          subPath: torch_compile
        - name: compile-cache
          mountPath: /root/.triton/cache
          subPath: triton
      volumes:
      - name: repo-scripts
        configMap:
          name: vllm-scripts
          defaultMode: 365
      - name: models
        persistentVolumeClaim:
          claimName: ai-model-cache-vllm
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
      - name: compile-cache
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-single-test
  namespace: vllm
  labels:
    app: vllm-single-test
spec:
  type: ClusterIP
  selector:
    app: vllm-single-test
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: http
