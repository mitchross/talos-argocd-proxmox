apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Injects only the uniform non-mover fields into each per-PVC stub (SnapshotPolicy + SnapshotSchedule + Restore).
# Mover securityContext is NOT injected: it must be the data owner uid:gid per PVC (docs/domains/storage/kopiur-mover-permissions.md).
patches:
  # copyMethod is upstream's default but KEEP it explicit: a server-defaulted field has no SSA owner and can silently flip on CRD upgrades.
  - target:
      kind: SnapshotPolicy
      group: kopiur.home-operations.com
    patch: |
      - op: add
        path: /spec/copyMethod
        value: Snapshot
      - op: add
        path: /spec/volumeSnapshotClassName
        value: longhorn-snapclass
      # WFFC staging: mover is scheduled before Longhorn picks the clone's node (longhorn/longhorn #13335 handoff race).
      - op: add
        path: /spec/staging
        value:
          storageClassName: longhorn-kopiur-staging-local
      - op: add
        path: /spec/repository
        value:
          kind: ClusterRepository
          name: cluster-kopia
      # Retain is upstream's default but pin it: an unowned default flipping to Delete would let an ArgoCD prune cascade-delete backup history.
      - op: add
        path: /spec/deletion
        value:
          onPolicyDelete: Retain
  - target:
      kind: SnapshotSchedule
      group: kopiur.home-operations.com
    patch: |
      - op: add
        path: /spec/schedule/concurrencyPolicy
        value: Forbid
      - op: add
        path: /spec/schedule/runOnCreate
        value: false
  - target:
      kind: Restore
      group: kopiur.home-operations.com
    patch: |
      - op: add
        path: /spec/repository
        value:
          kind: ClusterRepository
          name: cluster-kopia
      - op: add
        path: /spec/target
        value:
          populator: {}
      - op: add
        path: /spec/policy
        value:
          onMissingSnapshot: Continue
