# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
# Broker logs and KRaft metadata share this volume, so the snapshot is only crash-consistent (power-loss equivalent).
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: kafka-data
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    # Strimzi renders this PVC from the Kafka CR, so it can't carry a dataSourceRef; declared so the [dsr] CI check passes.
    storage.vanillax.dev/operator-owned-pvc: "true"
    storage.vanillax.dev/no-restore-before-bind-reason: >-
      Strimzi owns the claim; this dev log is disposable, so a rebuild starts on
      an empty volume rather than gating wave 0 on a restore. Backups still run
      and DR is a manual restore. Re-adding restore-before-bind needs a mover
      that can WRITE the archived tree - the 1001:0 mover could read it for
      backup but not recreate it, which wedged the old restore gate.
spec:
  sources:
    - pvc:
        name: data-0-dev-kafka-dual-role-0
  identity:
    username: kafka-data
    hostname: kafka
  retention:
    keepDaily: 14
    keepWeekly: 6
    keepMonthly: 3
  mover:
    securityContext:
      # Verified from quay.io/strimzi/kafka:1.1.0-kafka-4.3.0 (/etc/passwd).
      runAsUser: 1001
      runAsGroup: 0
      runAsNonRoot: true
    podSecurityContext:
      fsGroup: 0
      supplementalGroups:
        - 0
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: kafka-data-daily
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  policyRef:
    name: kafka-data
  schedule:
    # Daily is intentional: this high-churn learning log needs nuke recovery,
    # not a one-hour RPO or 24 snapshots of constantly rolling segments.
    cron: "11 3 * * *"
# No Restore CR on purpose: the dev log is disposable, a rebuild starts empty.
# Re-adding one needs a mover that can WRITE the archived tree (the 1001:0 mover could only read it).
