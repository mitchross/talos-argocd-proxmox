apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - pdb.yaml
  - service.yaml
  - pvc.yaml
  - httproute.yaml
  - kopiur/storage.yaml

namespace: nginx-example

# Hash suffix rolls the Deployment when sws.toml changes.
configMapGenerator:
  - name: sws-config
    files:
      - sws.toml

# Uniform kopiur backup fields (repository, copyMethod, populator) for the per-PVC stub(s) in kopiur/.
components:
  - ../../common/kopiur-backup
