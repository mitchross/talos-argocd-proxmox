apiVersion: v1
kind: Namespace
metadata:
  name: nginx-example
  labels:
    # The namespace label enables kopiur repository access and ExternalSecret credential fanout.
    kopiur.home-operations.com/repo: cluster-kopia
  annotations:
    # root-uid mover gate — required because this app's kopiur stub runs the
    # mover as uid 0 (data is root-owned); NOT a component default.
    kopiur.home-operations.com/privileged-movers: "true"
