# nginx-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: nginx
  annotations:
    # Optional: pin a static IP from the Cilium IPAM pool.
    lbipam.cilium.io/ips: "192.168.10.43"
spec:
  type: LoadBalancer
  # Optional: L2 announcements for the LoadBalancer.
  loadBalancerClass: io.cilium/l2-announcer
  selector:
    app: nginx
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
