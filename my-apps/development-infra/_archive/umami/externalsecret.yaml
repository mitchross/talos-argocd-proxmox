# Umami needs a stable APP_SECRET (auth tokens) and a 2FA encryption key; both are
# generated once in 1Password. The database password follows the shared
# `postgres-secrets` item convention used by every other plain Postgres app.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: umami-secrets
  namespace: umami
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: umami-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: postgres-secrets
        property: umami_db_password
    - secretKey: APP_SECRET
      remoteRef:
        key: umami
        property: app_secret
    - secretKey: TWO_FACTOR_ENCRYPTION_KEY
      remoteRef:
        key: umami
        property: two_factor_encryption_key
