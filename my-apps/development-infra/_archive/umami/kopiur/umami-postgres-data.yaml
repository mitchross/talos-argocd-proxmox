---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
# Per-PVC stub (uniform fields come from ../../common/kopiur-backup); the
# before-hook CHECKPOINTs Postgres so the capture is flushed to the volume.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: umami-postgres-data
  namespace: umami
spec:
  sources:
    - pvc:
        name: umami-postgres-data
  identity:
    username: umami-postgres-data
    hostname: umami
  hooks:
    beforeSnapshot:
      - workloadExec:
          podSelector:
            matchLabels:
              app: umami-postgres
          container: postgres
          command: ["/bin/sh", "-c", "exec psql -v ON_ERROR_STOP=1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -c \"CHECKPOINT\""]
          timeout: 2m
  retention:
    keepDaily: 14
    keepWeekly: 8
  mover:
    securityContext:
      runAsUser: 999 # postgres uid:gid in the official image
      runAsGroup: 999
      runAsNonRoot: true
    podSecurityContext:
      fsGroup: 999
      supplementalGroups:
        - 999
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: umami-postgres-data-daily
  namespace: umami
spec:
  policyRef:
    name: umami-postgres-data
  schedule:
    cron: "11 3 * * *"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: umami-postgres-data-restore
  namespace: umami
spec:
  source:
    fromPolicy:
      name: umami-postgres-data
      offset: 0
  mover:
    securityContext:
      runAsUser: 999
      runAsGroup: 999
      runAsNonRoot: true
    podSecurityContext:
      fsGroup: 999
      supplementalGroups:
        - 999
