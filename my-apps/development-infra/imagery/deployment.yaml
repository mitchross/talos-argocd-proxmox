apiVersion: apps/v1
kind: Deployment
metadata:
  name: imagery
  namespace: imagery
  labels:
    app.kubernetes.io/name: imagery
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO PVC — RollingUpdate deadlocks on Multi-Attach
  selector:
    matchLabels:
      app.kubernetes.io/name: imagery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: imagery
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101   # nginx-unprivileged's built-in non-root nginx user
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:378d0c32f6562f7fd9629170797f57d2b953aa09be983b3daaf4809bb039ca00
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/imagery
      volumes:
        - name: conf
          configMap:
            name: imagery-nginx
        - name: cache
          persistentVolumeClaim:
            claimName: imagery-tiles
