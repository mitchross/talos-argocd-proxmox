# /imagery/* on the shared map host; DNS is owned by versatiles-route, so no external-dns label here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: imagery-route
  namespace: imagery
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-external
      namespace: gateway
      sectionName: https
  hostnames:
    - "maps.vanillax.me"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /imagery
      backendRefs:
        - group: ""
          kind: Service
          name: imagery
          port: 8080
          weight: 1
