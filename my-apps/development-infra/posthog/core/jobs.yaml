apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  namespace: posthog
  labels:
    app.kubernetes.io/name: posthog
    app.kubernetes.io/component: kafka-init
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posthog
        app.kubernetes.io/component: kafka-init
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: configure-segment-size
        image: docker.redpanda.com/redpandadata/redpanda:v25.1.9@sha256:8f7e9e4c1422baaa1a5e2a6c6c668cfe05442cb3cb476542c7dff61725e6fe31
        command: ["rpk", "cluster", "config", "set", "log_segment_size=67108864", "--no-confirm", "-X", "admin.hosts=kafka:9644"]
      - name: configure-segment-roll
        image: docker.redpanda.com/redpandadata/redpanda:v25.1.9@sha256:8f7e9e4c1422baaa1a5e2a6c6c668cfe05442cb3cb476542c7dff61725e6fe31
        command: ["rpk", "cluster", "config", "set", "log_segment_ms=3600000", "--no-confirm", "-X", "admin.hosts=kafka:9644"]
      - name: configure-disk-headroom
        image: docker.redpanda.com/redpandadata/redpanda:v25.1.9@sha256:8f7e9e4c1422baaa1a5e2a6c6c668cfe05442cb3cb476542c7dff61725e6fe31
        command: ["rpk", "cluster", "config", "set", "storage_min_free_bytes=1073741824", "--no-confirm", "-X", "admin.hosts=kafka:9644"]
      # Session replay: a full snapshot of a big page (long redlib threads, a feed with
      # hundreds of subscriptions) is one message and is often over the 1 MiB default.
      # replay-capture answered those with 413 and the whole recording was lost.
      - name: configure-batch-max
        image: docker.redpanda.com/redpandadata/redpanda:v25.1.9@sha256:8f7e9e4c1422baaa1a5e2a6c6c668cfe05442cb3cb476542c7dff61725e6fe31
        command: ["rpk", "cluster", "config", "set", "kafka_batch_max_bytes=20971520", "--no-confirm", "-X", "admin.hosts=kafka:9644"]
      containers:
      - name: kafka-init
        image: docker.redpanda.com/redpandadata/redpanda:v25.1.9@sha256:8f7e9e4c1422baaa1a5e2a6c6c668cfe05442cb3cb476542c7dff61725e6fe31
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - /opt/repo-scripts/init-kafka.sh
        volumeMounts:
        - name: repo-scripts
          mountPath: /opt/repo-scripts
          readOnly: true
      volumes:
      - name: repo-scripts
        configMap:
          name: posthog-scripts
          defaultMode: 0555
---
apiVersion: batch/v1
kind: Job
metadata:
  name: posthog-migrate
  namespace: posthog
  labels:
    app.kubernetes.io/name: posthog
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posthog
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        feature.node.kubernetes.io/cpu-cpuid.AVX2: "true"
      containers:
      - name: migrate
        # Keep the migration hook on the same monolith digest as web/workers.
        # Mixed monolith/node digests caused schema drift during pod restarts.
        image: posthog/posthog:latest@sha256:9aa2dbab90ee2e015dbc85938781217f2c0fa2fa2863985d8a684d5ea4d1186a
        command:
        - /bin/sh
        - -c
        - /opt/repo-scripts/migrate.sh
        envFrom:
        - configMapRef:
            name: posthog-env
        env:
        # Here, not posthog-env.env: only this Job reads it, and that ConfigMap rolls every pod.
        # No minimum: recorder timestamps can remain near page load during passive visits.
        - name: SELF_HOSTED_REPLAY_MIN_DURATION_MS
          value: "0"
        # Added to project 1's authorized URLs, never removed; the injector puts the snippet on these hosts.
        - name: SELF_HOSTED_APP_URLS
          value: "https://vanillax.me,https://*.vanillax.me"
        - name: INTERNAL_API_SECRET
          valueFrom:
            secretKeyRef:
              name: posthog-secrets
              key: posthog-internal-api-secret
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: posthog-secrets
              key: posthog-secret
        - name: ENCRYPTION_SALT_KEYS
          valueFrom:
            secretKeyRef:
              name: posthog-secrets
              key: encryption-salt-keys
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: posthog-secrets
              key: posthog-db-password
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: posthog-secrets
              key: posthog-db-url
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 4Gi
        volumeMounts:
        - name: repo-scripts
          mountPath: /opt/repo-scripts
          readOnly: true
      volumes:
      - name: repo-scripts
        configMap:
          name: posthog-scripts
          defaultMode: 0555
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cyclotron-node-migrate
  namespace: posthog
  labels:
    app.kubernetes.io/name: posthog
    app.kubernetes.io/component: cyclotron-node-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posthog
        app.kubernetes.io/component: cyclotron-node-migrate
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        # Creates the cyclotron_node database if missing, then applies its migrations.
        image: ghcr.io/posthog/posthog/sqlx-migrate:master@sha256:e15303000feae8b38f370d92d2f3c52fb5a965f0c445db5382300008d8af27a7
        args: ["cyclotron-node"]
        env:
        - name: CYCLOTRON_NODE_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: posthog-secrets
              key: cyclotron-node-db-url
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: posthog-remote-config-sync
  namespace: posthog
  labels:
    app.kubernetes.io/name: posthog
    app.kubernetes.io/component: remote-config-sync
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "4"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posthog
        app.kubernetes.io/component: remote-config-sync
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        feature.node.kubernetes.io/cpu-cpuid.AVX2: "true"
      containers:
      - name: remote-config-sync
        # Keep on the same monolith digest as web/workers.
        image: posthog/posthog:latest@sha256:9aa2dbab90ee2e015dbc85938781217f2c0fa2fa2863985d8a684d5ea4d1186a
        command:
        - /bin/sh
        - -c
        - /opt/repo-scripts/sync-remote-config.sh
        envFrom:
        - configMapRef:
            name: posthog-env
        env:
        - name: INTERNAL_API_SECRET
          valueFrom:
            secretKeyRef:
              name: posthog-secrets
              key: posthog-internal-api-secret
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: posthog-secrets
              key: posthog-secret
        - name: ENCRYPTION_SALT_KEYS
          valueFrom:
            secretKeyRef:
              name: posthog-secrets
              key: encryption-salt-keys
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: posthog-secrets
              key: posthog-db-password
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: posthog-secrets
              key: posthog-db-url
        - name: OBJECT_STORAGE_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: posthog-secrets
              key: rustfs-access-key
        - name: OBJECT_STORAGE_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: posthog-secrets
              key: rustfs-secret-key
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            memory: 2Gi
        volumeMounts:
        - name: repo-scripts
          mountPath: /opt/repo-scripts
          readOnly: true
      volumes:
      - name: repo-scripts
        configMap:
          name: posthog-scripts
          defaultMode: 0555
