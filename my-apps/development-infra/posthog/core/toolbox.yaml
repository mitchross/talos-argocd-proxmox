# Debug pod for manage.py: kubectl scale deploy toolbox -n posthog --replicas=1, then exec in.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toolbox
  namespace: posthog
  labels:
    app.kubernetes.io/name: posthog
    app.kubernetes.io/component: toolbox
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: posthog
      app.kubernetes.io/component: toolbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posthog
        app.kubernetes.io/component: toolbox
    spec:
      nodeSelector:
        feature.node.kubernetes.io/cpu-cpuid.AVX2: "true"
      containers:
        - name: toolbox
          # Keep this aligned with the posthog-migrate hook in jobs.yaml.
          image: posthog/posthog:latest@sha256:193e6da15abf83e639c13796e70ad8d955e63d24d74f458934eec73096bb3687
          command:
            - /bin/sh
            - -c
            - "sleep infinity"
          envFrom:
            - configMapRef:
                name: posthog-env
          env:
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: posthog-secrets
                  key: posthog-internal-api-secret
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: posthog-secrets
                  key: posthog-secret
            - name: ENCRYPTION_SALT_KEYS
              valueFrom:
                secretKeyRef:
                  name: posthog-secrets
                  key: encryption-salt-keys
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: posthog-secrets
                  key: posthog-db-password
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: posthog-secrets
                  key: posthog-db-url
            - name: OBJECT_STORAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: posthog-secrets
                  key: rustfs-access-key
            - name: OBJECT_STORAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: posthog-secrets
                  key: rustfs-secret-key
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 2Gi
