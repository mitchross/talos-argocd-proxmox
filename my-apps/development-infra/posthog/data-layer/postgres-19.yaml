# Postgres 19 migration target; PostHog still uses the db Service until the cutover.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-19
  namespace: posthog
  labels:
    app.kubernetes.io/name: posthog
    app.kubernetes.io/component: db-19
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: posthog
      app.kubernetes.io/component: db-19
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posthog
        app.kubernetes.io/component: db-19
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999 # postgres uid:gid in the Debian image
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: db
        image: postgres:19.0@sha256:bb6e70add742cd868fb62cb3b2f67d1dd2bdd2b65a521e778420748753687c60
        # PostHog's hourly monitoring task queries pg_stat_statements; preload the
        # library so the migrate job's CREATE EXTENSION works (stops hourly log errors).
        args:
        - -c
        - shared_preload_libraries=pg_stat_statements
        env:
        - name: POSTGRES_USER
          value: posthog
        - name: POSTGRES_DB
          value: posthog
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: posthog-secrets
              key: posthog-db-password
        - name: POSTGRES_INITDB_ARGS
          value: --data-checksums
        ports:
        - containerPort: 5432
          name: postgres
        # Covers WAL replay after a restore so liveness can't restart Postgres mid-recovery.
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U posthog
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U posthog
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U posthog
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
        volumeMounts:
        - name: postgres-19-data
          mountPath: /var/lib/postgresql
      # Keep query text disabled: queryid suffices and SQL/values would become high-cardinality labels.
      - name: postgres-exporter
        image: quay.io/prometheuscommunity/postgres-exporter:v0.21.1@sha256:a88794758ad461c75f3825b51cde4bde730bdff04b3b24d00efe14217e41f615
        imagePullPolicy: IfNotPresent
        # Non-default collectors (long_running_transactions, stat_statements) crashloop the exporter (exit 2, silent) — re-add one at a time.
        env:
        - name: DATA_SOURCE_NAME
          valueFrom:
            secretKeyRef:
              name: posthog-secrets
              # Must not use the db Service: the sidecar isn't an endpoint until every container is ready (deadlock).
              key: posthog-exporter-db-url
        ports:
        - containerPort: 9187
          name: metrics
        # NEVER add a readinessProbe: a not-ready sidecar drops the pod from the `db` Service and black-holes Postgres.
        # timeoutSeconds must exceed a real scrape (~1.65s measured vs the 1s default).
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      volumes:
      - name: postgres-19-data
        persistentVolumeClaim:
          claimName: postgres-19-data
---
---
apiVersion: v1
kind: Service
metadata:
  name: db-19
  namespace: posthog
  labels:
    app.kubernetes.io/name: posthog
    app.kubernetes.io/component: db-19
spec:
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
  - name: metrics
    port: 9187
    targetPort: metrics
  selector:
    app.kubernetes.io/name: posthog
    app.kubernetes.io/component: db-19
---
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-19-data
  namespace: posthog
  labels:
    app: posthog-db-19
  annotations:
    # immutable dataSourceRef on a Bound PVC — mask the SSA dry-run diff;
    # the AppSet ignoreDifferences handles the live compare.
    argocd.argoproj.io/compare-options: ServerSideDiff=false
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn-flash
  resources:
    requests:
      # 8Gi ran out and Postgres PANICs on ENOSPC; grow in place (PVCs cannot shrink).
      storage: 16Gi
  # Restore-before-bind from the latest kopiur snapshot — the identity layer (API keys, users, dashboards) survives rebuild.
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: postgres-19-data-restore
