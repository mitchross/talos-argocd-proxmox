# Stable host name `db` for every PostHog client; the pod is in postgres-19.yaml.
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: posthog
  labels: # ServiceMonitor selector (core/servicemonitor.yaml)
    app.kubernetes.io/name: posthog
    app.kubernetes.io/component: db
spec:
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
  - name: metrics
    port: 9187
    targetPort: metrics
  selector:
    app.kubernetes.io/name: posthog
    app.kubernetes.io/component: db-19
