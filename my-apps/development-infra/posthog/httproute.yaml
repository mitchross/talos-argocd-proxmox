apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: posthog-ui-internal
  namespace: posthog
spec:
  parentRefs:
    - name: gateway-internal-technitium
      namespace: gateway
      sectionName: https
  hostnames:
    - "posthog.vanillax.me"
  rules:
    # Event capture (Rust) - high throughput, must hit dedicated service
    - matches:
        - path:
            type: PathPrefix
            value: /e
        - path:
            type: PathPrefix
            value: /i/v0
        - path:
            type: PathPrefix
            value: /capture
        - path:
            type: PathPrefix
            value: /batch
      backendRefs:
        - name: ingest-sanitizer
          port: 8001
    # LLM analytics capture (Rust) — longest-prefix-match beats /i/v0 above
    - matches:
        - path:
            type: PathPrefix
            value: /i/v0/ai
      backendRefs:
        - name: ingest-sanitizer
          port: 8002
    # Session replay capture (Rust)
    - matches:
        - path:
            type: PathPrefix
            value: /s
      backendRefs:
        - name: ingest-sanitizer
          port: 8003
    # Feature flags + /decide (Rust) — required for session replay config
    - matches:
        - path:
            type: PathPrefix
            value: /decide
        - path:
            type: PathPrefix
            value: /flags
      backendRefs:
        - name: ingest-sanitizer
          port: 8004
    # SDK remote config — session replay never starts when /array falls through to Django.
    - matches:
        - path:
            type: PathPrefix
            value: /array
      backendRefs:
        - name: hypercache-server
          port: 3002
    # CDP webhooks
    - matches:
        - path:
            type: PathPrefix
            value: /public/webhooks
        - path:
            type: PathPrefix
            value: /public/m
      backendRefs:
        - name: plugins
          port: 6738
    # Default - Django web UI/API
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: posthog-ingest-external
  namespace: posthog
  labels:
    external-dns: "true"
  annotations:
    external-dns.alpha.kubernetes.io/target: "vanillax.me"
spec:
  parentRefs:
    - name: gateway-external
      namespace: gateway
      sectionName: https
  hostnames:
    - "ingest-posthog.vanillax.me"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /e
        - path:
            type: PathPrefix
            value: /i/v0
        - path:
            type: PathPrefix
            value: /capture
        - path:
            type: PathPrefix
            value: /batch
      backendRefs:
        - name: ingest-sanitizer
          port: 8001
    # LLM analytics capture (Rust) — longest-prefix-match beats /i/v0 above
    - matches:
        - path:
            type: PathPrefix
            value: /i/v0/ai
      backendRefs:
        - name: ingest-sanitizer
          port: 8002
    - matches:
        - path:
            type: PathPrefix
            value: /s
      backendRefs:
        - name: ingest-sanitizer
          port: 8003
    # Feature flags + /decide (Rust) — required for session replay config
    - matches:
        - path:
            type: PathPrefix
            value: /decide
        - path:
            type: PathPrefix
            value: /flags
      backendRefs:
        - name: ingest-sanitizer
          port: 8004
    # SDK remote config — session replay never starts when /array falls through to Django.
    - matches:
        - path:
            type: PathPrefix
            value: /array
      backendRefs:
        - name: hypercache-server
          port: 3002
    # SDK and recorder assets only; unmatched paths must not expose the Django UI/API.
    - matches:
        - path:
            type: PathPrefix
            value: /static
      backendRefs:
        - name: web
          port: 8000
