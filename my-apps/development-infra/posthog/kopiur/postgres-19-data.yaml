# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
# Per-PVC stub (uniform fields from ../../common/kopiur-backup); identity layer — never exempt. Before-hook CHECKPOINTs Postgres.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: postgres-19-data
  namespace: posthog
spec:
  sources:
    - pvc:
        name: postgres-19-data
  identity:
    username: postgres-19-data
    hostname: posthog
  hooks:
    beforeSnapshot:
      - workloadExec:
          podSelector:
            matchLabels:
              app.kubernetes.io/name: posthog
              app.kubernetes.io/component: db-19
          container: db
          command: ["/bin/sh", "-c", "exec psql -v ON_ERROR_STOP=1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -c \"CHECKPOINT\""]
          timeout: 2m
  retention:
    keepDaily: 14
    keepWeekly: 8
  mover:
    securityContext:
      runAsUser: 999 # postgres uid:gid in the Debian image
      runAsGroup: 999
      runAsNonRoot: true
    podSecurityContext:
      fsGroup: 999
      supplementalGroups:
        - 999
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: postgres-19-data-daily
  namespace: posthog
spec:
  policyRef:
    name: postgres-19-data
  schedule:
    cron: "18 3 * * *"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: postgres-19-data-restore
  namespace: posthog
spec:
  source:
    fromPolicy:
      name: postgres-19-data
      offset: 0
  mover:
    securityContext:
      runAsUser: 999
      runAsGroup: 999
      runAsNonRoot: true
    podSecurityContext:
      fsGroup: 999
      supplementalGroups:
        - 999
