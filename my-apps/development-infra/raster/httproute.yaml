# /raster/* on the shared map host, prefix stripped for tileserver-gl; DNS is owned by versatiles-route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: map-raster-route
  namespace: map-raster
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-external
      namespace: gateway
      sectionName: https
  hostnames:
    - "maps.vanillax.me"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /raster
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          kind: Service
          name: map-raster
          port: 8080
          weight: 1
