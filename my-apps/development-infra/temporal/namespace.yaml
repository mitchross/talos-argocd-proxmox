apiVersion: v1
kind: Namespace
metadata:
  name: temporal
  annotations:
    # Before the wave -2 postgres stack: the kopiur label below drives the
    # cred fanout + repo tenancy the PVC populator needs to bind.
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    # kopiur-managed: ClusterExternalSecret cred fanout + ClusterRepository
    # tenancy (allowedNamespaces selector) for temporal-postgres-data.
    kopiur.home-operations.com/repo: cluster-kopia
