apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: temporal-postgres-data
  namespace: temporal
  annotations:
    # immutable dataSourceRef on a Bound PVC — mask the SSA dry-run diff;
    # the AppSet ignoreDifferences handles the live compare.
    argocd.argoproj.io/compare-options: ServerSideDiff=false
    argocd.argoproj.io/sync-options: ServerSideApply=false
    argocd.argoproj.io/sync-wave: "-2" # before the wave -1 schema hook
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # Immutable: changing the class means restore-before-bind recreation (docs/domains/storage/pvc-storageclass-migration.md).
  storageClassName: longhorn-wired-ha # two replicas on distinct wired nodes; Longhorn CSI snapshots for kopiur
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: temporal-postgres-data-restore
