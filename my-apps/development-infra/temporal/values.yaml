server:
  enabled: true
  # Chart default tag lags Temporal server patches by weeks; bump here. A chart bump only wins if its default exceeds this.
  image:
    repository: temporalio/server
    tag: 1.32.1
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 2Gi
  metrics:
    serviceMonitor:
      enabled: true
      interval: 30s
      # Quantile buckets nothing reads (~60k series, #3104). _sum/_count stay; temporal alerts use dlq_message_count.
      metricRelabelings:
        - sourceLabels: [__name__]
          action: drop
          regex: (activity_end_to_end_latency_bucket|activity_info_count_bucket|activity_info_size_bucket|activity_schedule_to_close_latency_bucket|activity_start_to_close_latency_bucket|asyncmatch_latency_bucket|buffered_events_count_bucket|buffered_events_size_bucket|cache_latency_bucket|cache_ttl_bucket|chasm_total_size_bucket|child_info_count_bucket|child_info_size_bucket|client_latency_bucket|event_blob_size_bucket|execution_info_size_bucket|execution_state_size_bucket|header_size_bucket|history_count_bucket|history_size_bucket|history_workflow_execution_cache_lock_hold_duration_bucket|memo_size_bucket|mutable_state_size_bucket|persistence_latency_bucket|poll_latency_bucket|pri_poll_latency_bucket|pri_task_write_latency_bucket|request_cancel_info_count_bucket|request_cancel_info_size_bucket|service_authorization_latency_bucket|service_latency_bucket|service_latency_nouserlatency_bucket|service_latency_userlatency_bucket|signal_info_count_bucket|signal_info_size_bucket|signal_request_id_count_bucket|signal_request_id_size_bucket|syncmatch_latency_bucket|task_attempt_bucket|task_count_bucket|task_dispatch_latency_bucket|task_latency_bucket|task_latency_load_bucket|task_latency_processing_bucket|task_latency_queue_bucket|task_latency_schedule_bucket|task_processing_no_persistence_latency_bucket|task_schedule_to_start_latency_bucket|task_write_latency_bucket|temporal_local_activity_execution_latency_bucket|temporal_local_activity_succeed_endtoend_latency_bucket|temporal_long_request_latency_attempt_bucket|temporal_long_request_latency_bucket|temporal_request_latency_attempt_bucket|temporal_request_latency_bucket|temporal_workflow_task_execution_latency_bucket|temporal_workflow_task_replay_latency_bucket|temporal_workflow_task_schedule_to_start_latency_bucket|timer_info_count_bucket|timer_info_size_bucket|total_activity_count_bucket|total_child_execution_count_bucket|total_request_cancel_external_count_bucket|total_signal_count_bucket|total_signal_external_count_bucket|total_user_timer_count_bucket|visibility_persistence_latency_bucket|workflow_schedule_to_close_latency_bucket)
  config:
    logLevel: "info"
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 1
      datastores:
        default:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: "temporal-postgres.temporal.svc.cluster.local:5432"
            # Temporal 1.28+ refuses to boot without this and the chart doesn't set it (ConnectProtocol: zero value crashloop).
            connectProtocol: "tcp"
            user: temporal
            existingSecret: temporal-db-secret
            secretKey: password
        visibility:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: "temporal-postgres.temporal.svc.cluster.local:5432"
            connectProtocol: "tcp"
            user: temporal
            existingSecret: temporal-db-secret
            secretKey: password
  frontend:
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        memory: 2Gi
  history:
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        memory: 2Gi
  matching:
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        memory: 2Gi
  worker:
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        memory: 2Gi

# Keep OFF on 1.30+ images: shims render a wave-0 ConfigMap the wave -1 schema hook can never mount → sync deadlock.
shims:
  dockerize: false
  elasticsearchTool: false

schema:
  useHelmHooks: false
  backoffLimit: 20
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi

admintools:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

web:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
