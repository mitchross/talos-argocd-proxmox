# Umami 3.5.0, PostgreSQL only (no Redis/ClickHouse/Kafka). Replays, heatmaps,
# error tracking and MCP all work on the Postgres path; none are enabled here yet.
# Dashboard is private (internal gateway only); httproute-ingest.yaml publishes collection only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umami
  namespace: umami
  labels:
    app: umami
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # Old pod stops before the new one starts: startup runs `prisma migrate deploy`,
  # and two overlapping migrations on one database is how these rollouts break.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: umami
  template:
    metadata:
      labels:
        app: umami
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: umami
          # Our fork (github.com/mitchross/umami, branch homelab): replay previews, page URLs, bulk replay delete, human-only replays, faster replay player, websites by hostname.
          image: ghcr.io/mitchross/umami:3.5.0-homelab.4@sha256:a0d5476b812ee4da922c00e0847bad1c30a111f3e9abf0c0437c1e376e4e4f52
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1001 # `nextjs` in the official image
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: umami-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://umami:$(POSTGRES_PASSWORD)@umami-postgres-19:5432/umami"
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: umami-secrets
                  key: APP_SECRET
            - name: TWO_FACTOR_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: umami-secrets
                  key: TWO_FACTOR_ENCRYPTION_KEY
            - name: TZ
              value: UTC
            - name: DISABLE_TELEMETRY
              value: "1"
            - name: DISABLE_UPDATES
              value: "1"
            # No CLIENT_IP_HEADER: Umami reads cf-connecting-ip before x-real-ip/x-forwarded-for by default.
            # Fork feature: create the websites in this file at startup (scripts/provision-websites.js).
            - name: WEBSITES_CONFIG
              value: /config/websites.yaml
          # Migrations run before the server starts, so start slow.
          startupProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/heartbeat
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: websites
              mountPath: /config
              readOnly: true
      volumes:
        - name: websites
          configMap:
            name: umami-websites
