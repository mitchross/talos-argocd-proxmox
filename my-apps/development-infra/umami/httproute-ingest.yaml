# PUBLIC ingest only: the tracker script and the event endpoint, nothing else.
# No admin, no API, no recorder paths — those stay on the internal route, and the
# Gateway answers everything not listed here with 404 before it reaches Umami.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: umami-ingest-external
  namespace: umami
  labels:
    external-dns: "true"
  annotations:
    external-dns.alpha.kubernetes.io/target: "vanillax.me"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-external
      namespace: gateway
      sectionName: https
  hostnames:
    - "ingest-umami.vanillax.me"
  rules:
    # The tracker itself. Browsers GET it from the page's own origin allowlist.
    - matches:
        - path:
            type: Exact
            value: /script.js
          method: GET
        - path:
            type: Exact
            value: /script.js
          method: HEAD
      backendRefs:
        - group: ""
          kind: Service
          name: umami
          port: 3000
          weight: 1
    # Event collection, cross-origin from every instrumented site. OPTIONS is the CORS preflight.
    - matches:
        - path:
            type: Exact
            value: /api/send
          method: POST
        - path:
            type: Exact
            value: /api/send
          method: OPTIONS
      backendRefs:
        - group: ""
          kind: Service
          name: umami
          port: 3000
          weight: 1
