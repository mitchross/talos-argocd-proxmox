# INTERNAL route (LAN only, via gateway-internal-technitium): dashboard, login,
# settings and the API. Nothing here is reachable from the internet, and the
# public ingest hostname is a separate route added only after setup.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: umami-route
  namespace: umami
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal-technitium
      namespace: gateway
  hostnames:
    - "umami.vanillax.me"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: umami
          port: 3000
          weight: 1
