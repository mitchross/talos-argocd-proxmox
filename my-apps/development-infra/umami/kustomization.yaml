# Umami analytics (PostHog replacement, phase 1: private instance only).
# No public collection route yet: website UUIDs are created through the private
# UI first, then a public ingest-only route is added in a follow-up PR.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: umami

resources:
- namespace.yaml
- externalsecret.yaml
- deployment.yaml
- service.yaml
- httproute.yaml
- vpa.yaml
- postgres/deployment.yaml
- postgres/service.yaml
- postgres/pvc.yaml
- vpa-postgres.yaml
- kopiur/umami-postgres-data.yaml

# Uniform kopiur backup fields (repository, copyMethod, populator) for the per-PVC stub in kopiur/.
components:
- ../../common/kopiur-backup
