# Umami analytics: private dashboard, public ingest-only route, websites created from websites.yaml at startup.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: umami

resources:
- namespace.yaml
- externalsecret.yaml
- deployment.yaml
- service.yaml
- httproute.yaml
- httproute-ingest.yaml
- replay-retention-cronjob.yaml
- vpa.yaml
- postgres/deployment.yaml
- postgres/service.yaml
- postgres/pvc.yaml
- postgres-19/deployment.yaml
- postgres-19/service.yaml
- postgres-19/pvc.yaml
- vpa-postgres.yaml
- kopiur/umami-postgres-data.yaml
- kopiur/umami-postgres-19-data.yaml

# Uniform kopiur backup fields (repository, copyMethod, populator) for the per-PVC stub in kopiur/.
components:
- ../../common/kopiur-backup

configMapGenerator:
- name: umami-websites
  files:
  - websites.yaml
- name: umami-replay-retention-sql
  files:
  - scripts/replay-retention.sql
