# Umami analytics: private dashboard, public ingest-only route, sites registered by a PostSync Job.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: umami

resources:
- namespace.yaml
- externalsecret.yaml
- deployment.yaml
- service.yaml
- httproute.yaml
- httproute-ingest.yaml
- websites-job.yaml
- vpa.yaml
- postgres/deployment.yaml
- postgres/service.yaml
- postgres/pvc.yaml
- vpa-postgres.yaml
- kopiur/umami-postgres-data.yaml

# Uniform kopiur backup fields (repository, copyMethod, populator) for the per-PVC stub in kopiur/.
components:
- ../../common/kopiur-backup

configMapGenerator:
- name: umami-websites-sql
  files:
  - scripts/websites.sql
