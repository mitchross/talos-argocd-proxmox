apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: umami-postgres-19-data
  namespace: umami
  annotations:
    # immutable dataSourceRef on a Bound PVC — mask the SSA dry-run diff.
    argocd.argoproj.io/compare-options: ServerSideDiff=false
    argocd.argoproj.io/sync-options: ServerSideApply=false
  labels:
    app: umami-postgres-19
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Analytics rows are small; replays stay off until they are measured.
      storage: 4Gi
  storageClassName: longhorn
  # kopiur restore-before-bind: binds Pending until the Restore populator hydrates it; no-op while Bound.
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: umami-postgres-19-data-restore
