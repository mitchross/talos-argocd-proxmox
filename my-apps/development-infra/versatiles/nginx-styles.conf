# Mounted as /etc/nginx/conf.d/default.conf; serves generated MapLibre styles from /styles.
# Wildcard CORS is for public, non-credentialed style requests.
server {
    listen       8080;
    server_name  _;

    # Cheap dedicated probe target so k8s health checks don't spam the log
    # (the style files themselves are the real readiness signal).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Bare root -> fullscreen MapLibre viewer (index.html). Exact match so it
    # doesn't shadow /styles/ or /healthz.
    location = / {
        root         /usr/share/nginx/html;
        try_files    /index.html =404;
        add_header   Cache-Control "public, max-age=60" always;
    }

    location /styles/ {
        root         /usr/share/nginx/html;
        default_type application/json;
        add_header   Access-Control-Allow-Origin "*" always;
        add_header   Cache-Control "public, max-age=300" always;
    }
}
