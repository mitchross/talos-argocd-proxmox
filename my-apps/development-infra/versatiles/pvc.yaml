# Static PV on a FIXED TrueNAS SMB path (comfyui pattern): the NAS copy is the durable copy that survives cluster rebuilds.
# NOT a dynamic *-smb class — that gives a rebuilt cluster an empty pvc-<uuid> subdir and a silent 62GB re-download. Folder must pre-exist on the NAS (README.md).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: versatiles-smb-pv
spec:
  capacity:
    storage: 150Gi  # nominal; SMB doesn't enforce quota here
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - dir_mode=0775
    - file_mode=0664
    - uid=1000
    - gid=1000
    - vers=3.1.1
    # SMB multichannel (enabled server-side on TrueNAS): 4 channels over 10G.
    - max_channels=4
    - noserverino
    - cache=loose
    - rsize=4194304
    - wsize=4194304
    - actimeo=60
    - echo_interval=60
    - max_credits=64
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: versatiles-smb-pv
    volumeAttributes:
      source: "//192.168.10.133/k8s/versatiles"
    nodeStageSecretRef:
      name: smbcreds
      namespace: csi-driver-smb
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # -smb suffix: PVC volumeName/storageClass are immutable, so a storage move is a rename (create/prune), not an in-place patch.
  name: map-data-smb
  namespace: versatiles
  labels:
    backup-exempt: "true"
  annotations:
    storage.vanillax.dev/backup-exempt-reason: >-
      lives on the TrueNAS k8s/versatiles SMB share, which is itself the
      durable cross-rebuild copy; also re-downloadable from
      download.versatiles.org (sha256-verified) if the NAS copy is lost
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: versatiles-smb-pv
  resources:
    requests:
      storage: 150Gi
