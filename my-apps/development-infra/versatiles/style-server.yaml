# static-web-server for the pre-generated MapLibre style JSONs — the versatiles pod is readOnlyRootFilesystem off a read-only PVC.
# Styles, index.html and sws.toml come from configMapGenerators in kustomization.yaml (hash suffix = rollout trigger).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: map-styles
  namespace: versatiles
  labels:
    app.kubernetes.io/name: map-styles
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: map-styles
  template:
    metadata:
      labels:
        app.kubernetes.io/name: map-styles
    spec:
      tolerations:
        - key: node.vanillax.dev/link
          operator: Equal
          value: wifi
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532   # the scratch image sets no USER, so it would run as root
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sws
          image: joseluisq/static-web-server:2.44.3@sha256:ccf2d666ffe5f8ef2ec96bc40f07757605998c04b78f7d8fdb98a584dd4f5717
          imagePullPolicy: IfNotPresent
          args: ["--config-file", "/etc/sws/sws.toml"]
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: conf
              mountPath: /etc/sws
              readOnly: true
            - name: site
              mountPath: /srv/site
              readOnly: true
      volumes:
        - name: conf
          configMap:
            name: map-styles-sws
        # index.html at /, style JSONs under /styles/; a new style needs an item here too.
        - name: site
          projected:
            sources:
              - configMap:
                  name: map-styles-index
              - configMap:
                  name: map-styles-files
                  items:
                    - key: light.json
                      path: styles/light.json
                    - key: dark.json
                      path: styles/dark.json
                    - key: satellite.json
                      path: styles/satellite.json
