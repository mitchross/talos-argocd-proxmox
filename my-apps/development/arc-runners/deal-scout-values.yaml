githubConfigUrl: https://github.com/mitchross/deal-scout
githubConfigSecret: arc-github-token
runnerScaleSetName: arc-deal-scout
minRunners: 0
maxRunners: 2
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller

# Runner + dind sidecar, written out (containerMode: dind would leave dind unpinned and without resources).
# The runner image (mitchross/homelab-images images/arc-runner-rust) carries Rust, protoc, cmake and sccache.
template:
  spec:
    # Off the control plane, and off truenas-worker-01 so builds do not compete with the NAS on that box.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - { key: kubernetes.io/hostname, operator: NotIn, values: [truenas-worker-01] }
                - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
    initContainers:
      - name: init-dind-externals
        image: ghcr.io/mitchross/arc-runner-rust:main@sha256:7d67fa4ecf165e3bddcad71b3c64ac4f610993fe97dc535909886870edaeb0da
        command: [cp, -r, /home/runner/externals/., /home/runner/tmpDir/]
        volumeMounts:
          - { name: dind-externals, mountPath: /home/runner/tmpDir }
      - name: dind
        image: docker:29-dind
        args: [dockerd, --host=unix:///var/run/docker.sock, --group=$(DOCKER_GROUP_GID)]
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        restartPolicy: Always
        startupProbe:
          exec:
            command: [docker, info]
          periodSeconds: 5
          failureThreshold: 24
        # ephemeral-storage requests tell the scheduler about the emptyDirs; their sizeLimits stay the hard caps.
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
            ephemeral-storage: 15Gi
          limits:
            cpu: "4"
            memory: 8Gi
        volumeMounts:
          - { name: work, mountPath: /home/runner/_work }
          - { name: dind-sock, mountPath: /var/run }
          - { name: dind-externals, mountPath: /home/runner/externals }
          - { name: docker-data, mountPath: /var/lib/docker }
    containers:
      - name: runner
        image: ghcr.io/mitchross/arc-runner-rust:main@sha256:7d67fa4ecf165e3bddcad71b3c64ac4f610993fe97dc535909886870edaeb0da
        command: [/home/runner/run.sh]
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
            ephemeral-storage: 10Gi
          limits:
            cpu: "4"
            memory: 8Gi
        volumeMounts:
          - { name: work, mountPath: /home/runner/_work }
          - { name: dind-sock, mountPath: /var/run }
    volumes:
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
      - name: work
        emptyDir:
          sizeLimit: 20Gi
      - name: docker-data
        emptyDir:
          sizeLimit: 40Gi
