apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-token
  namespace: arc-runners
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: arc-github-token
    creationPolicy: Owner
  data:
    - secretKey: github_token
      remoteRef:
        # Reuses the Renovate PAT; if it lacks repo admin, create 1Password item `github-arc` and change only this key.
        key: renovate
        property: github_token
        # Webhook injects this default; the my-apps AppSet ignoreDifferences omits nullBytePolicy, so leaving it out = OutOfSync.
        nullBytePolicy: Ignore
