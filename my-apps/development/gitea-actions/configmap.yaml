# Mounted at /etc/act_runner/config.yaml (CONFIG_FILE env in deployment.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: act-runner-config
  namespace: gitea-actions
data:
  config.yaml: |
    log:
      level: info

    runner:
      file: /data/.runner
      # Keep at 1: parallel jobs serialize on containerd's content-store lock anyway and quadruple peak RAM.
      capacity: 1
      timeout: 1h
      shutdown_timeout: 5m
      insecure: false
      fetch_interval: 2s

    cache:
      enabled: true

    container:
      # Must stay empty: any --gpus value (even `--gpus=`) leaves a gpu DeviceRequest and
      # dockerd without an nvidia runtime refuses the container ("could not select device driver").
      options: ""
      # buildx + DinD need privileged step containers.
      privileged: true
      valid_volumes:
        - "**"
      force_pull: false

    host:
      workdir_parent: /data/cache
