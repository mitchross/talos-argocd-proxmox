# Runner + separate dind sidecar over a shared /var/run socket. Do not switch to the
# gitea/act_runner:*-dind image: s6 readiness race, forced --gpus=all, broken TLS key usage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: act-runner
  namespace: gitea-actions
  labels:
    app: act-runner
spec:
  replicas: 1
  strategy:
    type: Recreate          # only one runner identity, never two at once
  selector:
    matchLabels:
      app: act-runner
  template:
    metadata:
      labels:
        app: act-runner
    spec:
      containers:
        - name: runner
          # Keep off Gitea's own registry: a fresh Gitea rebuild must still be able to start CI.
          image: docker.io/gitea/act_runner:0.6.1
          env:
            # Talk to the dind sidecar via the shared /var/run socket.
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: GITEA_INSTANCE_URL
              value: https://gitea.vanillax.me
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: act-runner-token
                  key: token
            - name: GITEA_RUNNER_NAME
              value: cluster-runner-1
            - name: GITEA_RUNNER_LABELS
              value: ubuntu-latest:docker://catthehacker/ubuntu:act-latest
            - name: CONFIG_FILE
              value: /etc/act_runner/config.yaml
          volumeMounts:
            - { name: var-run, mountPath: /var/run }
            - { name: data,    mountPath: /data }
            - { name: config,  mountPath: /etc/act_runner }
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi

        # Privileged is required for DinD (namespace is PSA-exempt); TLS off is safe, the socket is pod-local.
        - name: dind
          image: docker:29-dind
          args:
            - --host=unix:///var/run/docker.sock
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            privileged: true
          volumeMounts:
            - { name: var-run,        mountPath: /var/run }
            - { name: docker-storage, mountPath: /var/lib/docker }
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              memory: 6Gi
          # Dockerd ready when `docker info` over the shared socket succeeds.
          startupProbe:
            exec:
              command: [docker, info]
            periodSeconds: 2
            failureThreshold: 30
          # `docker info` runs well past the 1s probe default on a dind busy
          # with a build, and a liveness timeout kills the daemon mid-job.
          livenessProbe:
            exec:
              command: [docker, info]
            periodSeconds: 30
            timeoutSeconds: 10

        # Without periodic pruning the /var/lib/docker PVC fills as new image versions land.
        - name: prune
          image: docker:29-cli
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
          command:
            - sh
            - -c
            - |
              while true; do
                # Wait for dockerd before first prune (pod fresh-start case)
                for i in $(seq 1 30); do
                  docker info >/dev/null 2>&1 && break
                  sleep 2
                done
                echo "[prune] starting cycle at $(date -u)"
                docker buildx prune -af --keep-storage 20GB --filter until=24h 2>&1 || true
                docker system prune -af --filter "until=72h" 2>&1 || true
                df -h /var/lib/docker 2>/dev/null || true
                sleep 21600
              done
          volumeMounts:
            - { name: var-run, mountPath: /var/run }
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi

      volumes:
        - { name: var-run, emptyDir: {} }
        - { name: data,    emptyDir: {} }
        # PVC, not emptyDir: keeps the 3 GB catthehacker image + base layers warm across restarts (pvc.yaml).
        - name: docker-storage
          persistentVolumeClaim:
            claimName: act-runner-docker-cache
        - name: config
          configMap:
            name: act-runner-config
