# Docker layer cache for the act-runner dind sidecar; without it every restart re-pulls 3 GB+ of images.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: act-runner-docker-cache
  namespace: gitea-actions
  labels:
    backup-exempt: "true"
  annotations:
    storage.vanillax.dev/backup-exempt-reason: "Docker layer cache for the act-runner DinD sidecar; rebuilds from registries on next CI run"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
