# Runner + separate dind sidecar over a shared /var/run socket. Do not switch to the
# gitea/act_runner:*-dind image: s6 readiness race, forced --gpus=all, broken TLS key usage.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: act-runner
  namespace: gitea-actions
  labels:
    app: act-runner
spec:
  # Two runners, each with its own dind + layer cache: capacity>1 on one dind serializes on its lock.
  replicas: 2
  serviceName: act-runner
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: act-runner
  template:
    metadata:
      labels:
        app: act-runner
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: act-runner
      containers:
        - name: runner
          # Keep off Gitea's own registry: a fresh Gitea rebuild must still be able to start CI.
          image: docker.io/gitea/act_runner:0.6.1
          env:
            # Talk to the dind sidecar via the shared /var/run socket.
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: GITEA_INSTANCE_URL
              value: https://gitea.vanillax.me
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: act-runner-token
                  key: token
            # act-runner-0 / act-runner-1: one Gitea runner identity per pod.
            - name: GITEA_RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GITEA_RUNNER_LABELS
              value: ubuntu-latest:docker://catthehacker/ubuntu:act-latest
            - name: CONFIG_FILE
              value: /etc/act_runner/config.yaml
          volumeMounts:
            - { name: var-run, mountPath: /var/run }
            - { name: data,    mountPath: /data }
            - { name: config,  mountPath: /etc/act_runner }
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi

        # Privileged is required for DinD (namespace is PSA-exempt); TLS off is safe, the socket is pod-local.
        - name: dind
          image: docker:29-dind
          args:
            - --host=unix:///var/run/docker.sock
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            privileged: true
          volumeMounts:
            - { name: var-run,        mountPath: /var/run }
            - { name: docker-storage, mountPath: /var/lib/docker }
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              memory: 6Gi
          # Dockerd ready when `docker info` over the shared socket succeeds.
          startupProbe:
            exec:
              command: [docker, info]
            periodSeconds: 2
            failureThreshold: 30
          # `docker info` runs well past the 1s probe default on a dind busy
          # with a build, and a liveness timeout kills the daemon mid-job.
          livenessProbe:
            exec:
              command: [docker, info]
            periodSeconds: 30
            timeoutSeconds: 10

        # Without periodic pruning the /var/lib/docker PVC fills as new image versions land.
        - name: prune
          image: docker:29-cli
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
          command:
            - sh
            - -c
            - /opt/repo-scripts/prune-docker-cache.sh
          volumeMounts:
            - { name: repo-scripts, mountPath: /opt/repo-scripts, readOnly: true }
            - { name: var-run, mountPath: /var/run }
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi

      volumes:
        - name: repo-scripts
          configMap:
            name: gitea-actions-scripts
            defaultMode: 0555
        - { name: var-run, emptyDir: {} }
        - { name: data,    emptyDir: {} }
        - name: config
          configMap:
            name: act-runner-config
  # Per-runner layer cache, not emptyDir: keeps the 3 GB catthehacker image + base layers warm across restarts.
  volumeClaimTemplates:
    - metadata:
        name: docker-storage
        labels:
          backup-exempt: "true"
        annotations:
          storage.vanillax.dev/backup-exempt-reason: "Docker layer cache for the act-runner DinD sidecar; rebuilds from registries on next CI run"
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi
