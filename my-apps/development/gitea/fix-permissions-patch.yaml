apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
spec:
  template:
    spec:
      initContainers:
      - name: fix-permissions
        image: alpine:3.24
        command:
        - sh
        - -c
        - /opt/repo-scripts/fix-permissions.sh
        volumeMounts:
        - name: repo-scripts
          mountPath: /opt/repo-scripts
          readOnly: true
        - name: data
          mountPath: /data
        securityContext:
          runAsUser: 0
          capabilities:
            add:
            - CHOWN
            - FOWNER
            - DAC_OVERRIDE
            drop:
            - NET_RAW
      volumes:
      - name: repo-scripts
        configMap:
          name: gitea-scripts
          defaultMode: 0555
