# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
# Uniform fields come from ../../common/kopiur-backup; the mover securityContext is per-PVC and stays here.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: gitea-postgres-data
  namespace: gitea
spec:
  sources:
    - pvc:
        name: gitea-postgres-data
  identity:
    username: gitea-postgres-data
    hostname: gitea
  hooks:
    beforeSnapshot:
      - workloadExec:
          podSelector:
            matchLabels:
              app: gitea-postgres
          container: postgres
          command: ["/bin/sh", "-c", "exec psql -v ON_ERROR_STOP=1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -c \"CHECKPOINT\""]
          timeout: 2m
  retention:
    keepDaily: 7
    keepWeekly: 4
  mover:
    securityContext:
      runAsUser: 999 # postgres uid:gid in the official image
      runAsGroup: 999
      runAsNonRoot: true
    podSecurityContext:
      fsGroup: 999
      supplementalGroups:
        - 999
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: gitea-postgres-data-daily
  namespace: gitea
spec:
  policyRef:
    name: gitea-postgres-data
  schedule:
    cron: "13 4 * * *"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: gitea-postgres-data-restore
  namespace: gitea
spec:
  source:
    fromPolicy:
      name: gitea-postgres-data
      offset: 0
  mover:
    securityContext:
      runAsUser: 999
      runAsGroup: 999
      runAsNonRoot: true
    podSecurityContext:
      fsGroup: 999
      supplementalGroups:
        - 999
