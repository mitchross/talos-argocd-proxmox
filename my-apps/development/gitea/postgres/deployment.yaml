# Plain Postgres, no operator: kopiur hourly snapshots + restore-before-bind; a restored crash-consistent
# snapshot WAL-recovers on boot. Runbook: docs/domains/cnpg/plain-postgres-migration.md
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-postgres
  namespace: gitea
  labels:
    app: gitea-postgres
spec:
  strategy:
    type: Recreate # RWO PVC — RollingUpdate deadlocks on Multi-Attach
  replicas: 1
  selector:
    matchLabels:
      app: gitea-postgres
  template:
    metadata:
      labels:
        app: gitea-postgres
    spec:
      # SIGINT = Postgres fast shutdown; 60s covers a busy checkpoint before the kubelet SIGKILLs.
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999 # postgres uid:gid in the official image
      containers:
        - name: postgres
          # Majors are dashboard-gated in .github/renovate.json5: a major bump on an old PGDATA crashloops.
          # To go up a major: dump with the OLD major's image, wipe/reinit PGDATA, then restore.
          image: postgres:18.6
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5432
              name: postgres
          env:
            # Only honoured on first boot of an EMPTY volume; on a restored volume the restored data wins.
            - name: POSTGRES_DB
              value: "gitea"
            - name: POSTGRES_USER
              value: "gitea"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-db-secret # same 1Password item CNPG used
                  key: password
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            # Subdirectory keeps initdb happy on a fresh PVC (top-level
            # mount contains lost+found).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Covers WAL replay after a restore so liveness can't restart Postgres mid-recovery.
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "gitea", "-d", "gitea"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "gitea", "-d", "gitea"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "gitea", "-d", "gitea"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
        # Scraped via the Service's `metrics` port + servicemonitor.yaml.
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          securityContext:
            # Image default uid (nobody); shares the pod, connects over
            # localhost so no pg_hba/network exposure changes.
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: DATA_SOURCE_URI
              value: "localhost:5432/gitea?sslmode=disable"
            - name: DATA_SOURCE_USER
              value: "gitea"
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: gitea-db-secret
                  key: password
          ports:
            - containerPort: 9187
              name: metrics
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: gitea-postgres-data
