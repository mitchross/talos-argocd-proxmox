# Scrapes the postgres-exporter sidecar (pg_stat_activity_count,
# pg_database_size_bytes, pg_up, ...). Prometheus uses empty
# serviceMonitor*Selectors, so no release label is needed — same as
# my-apps/ai/vllm/servicemonitor.yaml.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gitea-postgres
  namespace: gitea
  labels:
    app: gitea-postgres
spec:
  selector:
    matchLabels:
      app: gitea-postgres
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
