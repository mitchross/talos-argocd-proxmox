# Scrapes the postgres-exporter sidecar; Prometheus uses empty serviceMonitor*Selectors, so no release label needed.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gitea-postgres
  namespace: gitea
  labels:
    app: gitea-postgres
spec:
  selector:
    matchLabels:
      app: gitea-postgres
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
