replicaCount: 1

persistence:
  enabled: true
  size: 10Gi
  storageClass: longhorn
  # Do not remove: kustomization.yaml's JSONPatch adds under /metadata/labels, and an empty
  # labels map collapses to null so the add-op fails ("doc is missing path").
  labels:
    app.kubernetes.io/managed-by: argocd

service:
  http:
    type: ClusterIP
  ssh:
    type: ClusterIP

strategy:
  type: Recreate

image:
  rootless: true

podSecurityContext:
  fsGroup: 1000

# Permissions fixed by Kustomize init container patch (fix-permissions-patch.yaml)
# running as root. The chart's own init container runs as the default user.

gitea:
  config:
    server:
      ROOT_URL: https://gitea.vanillax.me/
      DOMAIN: gitea.vanillax.me
      SSH_DOMAIN: gitea.vanillax.me
    database:
      DB_TYPE: postgres
      HOST: gitea-postgres.gitea.svc.cluster.local:5432
      NAME: gitea
      USER: gitea
      SCHEMA: public
  additionalConfigFromEnvs:
    - name: GITEA__database__PASSWD
      valueFrom:
        secretKeyRef:
          name: gitea-db-secret
          key: password

# Bundled DBs off — uses the plain Postgres in ./postgres/
postgresql-ha:
  enabled: false

postgresql:
  enabled: false

# Use single valkey instead of cluster
valkey-cluster:
  enabled: false

valkey:
  enabled: true
  architecture: standalone
  primary:
    # Cache-only data, emptyDir on purpose: a restart costs a re-login and in-flight queue jobs replay.
    persistence:
      enabled: false

# Backup CRs live in the kustomization PVC patch + kopiur/gitea-shared-storage.yaml; add none here.
