# Git owns this file: scripts/seed.sh copies it over /opt/data/config.yaml on every start.
# Runtime state (sessions, memories, logins, cron jobs) stays on the hermes-data volume.
# Brain: Opus at medium effort (agent.reasoning_effort) through the Claude Code token (CLAUDE_CODE_OAUTH_TOKEN). Coding runs use Opus / GPT-6.1-sol, see the skill.
model:
  provider: anthropic
  default: claude-opus-5-5

# vLLM picker: -local never falls back to cloud; the default route may use DeepSeek overflow.
# supports_vision: Hermes reads it here (agent/image_routing.py, providers.<p>.models.<model>) to send
# images natively; without it a litellm model counts as text-only. vLLM keeps the vision tower.
providers:
  litellm:
    name: litellm
    base_url: http://litellm-service.litellm.svc.cluster.local:4000/v1
    api_key: ${LITELLM_API_KEY}
    models:
      qwen3.8-27b-local:
        supports_vision: true
      qwen3.8-27b:
        supports_vision: true

terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180

web:
  search_backend: searxng
  extract_backend: parallel

browser:
  # The pod blocks user namespaces, and Hermes adds --no-sandbox only under Docker or root.
  chromium_args: ["--no-sandbox", "--disable-dev-shm-usage"]

memory:
  provider: hindsight
  hindsight:
    mode: local_external
    api_url: http://hindsight-service.hindsight.svc.cluster.local:8888
    bank_id: hermes
    recall_budget: mid
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 3300
  user_char_limit: 2200

dashboard:
  public_url: https://hermes.vanillax.me

# Pod secrets and service URLs, mounted as files, for the default profile only. With a second
# profile the gateway multiplexes, and then only this source and .env reach default turns.
secrets:
  command:
    enabled: true
    command: 'for d in /etc/hermes-secrets /etc/hermes-env; do (cd "$d" && for k in [A-Z]*; do printf "%s=%s\n" "$k" "$(cat "$k")"; done); done'

# Cron schedules and the agent clock follow this zone; the pod itself runs UTC.
timezone: "America/Detroit"

agent:
  max_turns: 500
  reasoning_effort: medium

# Bound background writers independently of the node's RAM-derived worker count.
kanban:
  max_in_progress: 4
  max_in_progress_per_profile: 4

# Opus has a 1M window and the default ratio (0.50) only compacts at ~500k, so long chats replayed
# ~250k tokens on every call. Compact at 200k instead (the lower of ratio and this cap wins).
compression:
  threshold_tokens: 200000

# On a rate limit or error, move to the next entry not on the failing backend (Codex workers reach Claude).
# A limit that resets within 2 minutes is waited out instead of switching.
fallback_providers:
  - provider: openai-codex
    model: gpt-6.1-sol
  - provider: anthropic
    model: claude-sonnet-5-5
  - provider: litellm
    model: deepseek-flash
fallback:
  min_switch_reset_seconds: 120

# delegate_task uses the advanced-delegation plugin: the agent picks a route per subagent.
# Untagged tasks use `codex` (ChatGPT plan) so routine subagent work stays off Claude quota.
# provider/model above are kept for when backend goes back to default.
delegation:
  provider: anthropic
  model: claude-sonnet-5-5
  backend: model_map
  backends:
    model_map:
      default: codex
      options:
        - name: local
          description: "Free and private Qwen3.8-27B on vLLM across both 3090s; never leaves the house. Bulk reading, summaries, private data."
          provider: litellm
          model: qwen3.8-27b-local
        - name: fast
          description: "Cheap, quick cloud model (DeepSeek Flash). Lookups, simple summaries, first-pass triage."
          provider: litellm
          model: deepseek-flash
        - name: balanced
          description: "Claude Sonnet. Writing and judgment calls where Claude's style matters, or when Codex is rate-limited."
          provider: anthropic
          model: claude-sonnet-5-5
          fallback_providers:
            - provider: openai-codex
              model: gpt-6.1-sol
        - name: codex
          description: "Default workhorse: GPT-6.1 Sol on the ChatGPT plan. Coding, research, repo reading, normal edits. Use when unsure."
          provider: openai-codex
          model: gpt-6.1-sol
          fallback_providers:
            - provider: anthropic
              model: claude-sonnet-5-5
        - name: deep
          description: "Slow and careful (Claude Opus, high reasoning). Hard debugging, design, root causes."
          provider: anthropic
          model: claude-opus-5-5
          reasoning_effort: high
          fallback_providers:
            - provider: openai-codex
              model: gpt-6.1-sol

# Small internal helper calls run on DeepSeek Flash (via LiteLLM) instead of Opus.
# Compression and the approval classifier stay on the main model on purpose.
# background_review (the post-turn memory/skill review fork) runs on Codex: it was ~$75/week of Opus.
auxiliary:
  background_review:
    provider: openai-codex
    model: gpt-6.1-sol
  title_generation:
    provider: litellm
    model: deepseek-flash
  skills_hub:
    provider: litellm
    model: deepseek-flash
  mcp:
    provider: litellm
    model: deepseek-flash
  triage_specifier:
    provider: litellm
    model: deepseek-flash
  kanban_decomposer:
    provider: litellm
    model: deepseek-flash

# Weekly skill review may also merge overlapping agent-made skills (archived, never deleted).
curator:
  consolidate: true

# Archive hides idle sessions (reversible); prune deletes ended ones. Pinned and open sessions are never touched.
sessions:
  auto_archive: true
  auto_archive_days: 7
  auto_prune: true
  retention_days: 90

# Branches and PRs need no prompt; the default branch is off-limits. deny globs match the whole command
# and block even in yolo mode, so the guardian policy also covers compound commands.
approvals:
  mode: smart
  smart_policy: >-
    APPROVE without asking: git add, commit and push to a feature branch; gh pr create, view and comment;
    gh issue create, view and comment; launching claude -p or codex exec coding hand-offs that disallow
    gh pr merge and pushes to main or master.
    Always ESCALATE: any push to main or master (including git push while the current branch is main or
    master), force pushes, gh pr merge, and deleting remote branches.
  deny:
    - "git push origin main*"
    - "git push origin master*"
    - "git push origin HEAD:main*"
    - "git push origin HEAD:master*"
    - "git push --force*"
    - "git push -f *"
    - "gh pr merge*"

plugins:
  enabled:
    - hindsight
    # Enabled but inert on purpose: the adapter drops every state_changed event until
    # platforms.homeassistant.extra.watch_domains (or watch_entities/watch_all) is set.
    - homeassistant
    - advanced-delegation
  disabled: []

# Match the image's config schema so each start does not repeat migration.
_config_version: 52

_left_core_installed:
  - homeassistant
known_plugin_toolsets:
  acp:
    - homeassistant
  webhook:
    - homeassistant
_left_core_scoped:
  - homeassistant

# Remote MCP servers. Cloudflare's OAuth login needs a browser on this pod, so it uses an API token
# from 1Password (cloudflared-proxmox/api-token) as a bearer header instead.
mcp_servers:
  cloudflare:
    url: "https://mcp.cloudflare.com/mcp"
    headers:
      Authorization: "Bearer ${env:CLOUDFLARE_API_TOKEN}"
    timeout: 180

  # Deal Scout read-only MCP (mitchross/deal-scout docs/mcp.md). In-cluster URL with the operator header
  # unlocks fleet tools; the public Gateway route forces public mode.
  deal-scout:
    url: "http://deal-scout.deal-scout.svc:8000/mcp"
    headers:
      X-Deal-Scout-Mode: "operator"
    timeout: 60

  # REA (Reverse Engineer Anything, morluto/rea, MIT): static analysis of shipped binaries, Electron/JS, APKs.
  # Pinned to an exact npm version; bump it together with the library skill software-development/reverse-engineer-anything
  # (copied from morluto/rea tag rea-agents-6.8.0). npx fetches the package on first start, so allow a long connect.
  # JS/Electron needs no native engine; Ghidra/IDA/Hopper are not in the image, so native analysis reports provider_unavailable.
  rea:
    command: "npx"
    args: ["-y", "rea-agents@6.8.0", "mcp"]
    enabled: true
    timeout: 300
    connect_timeout: 300

  # Craft Anything (storytold/craft-anything, Apache-2.0): Rust reverse-engineering engine, Clean room by default.
  # The seed installs the pinned release binary; plain `mcp` lists the core toolset, enable_toolset adds the rest.
  craft-anything:
    command: "/opt/data/tools/craft-anything-0.5.0/bin/craft-anything-cli"
    args: ["mcp"]
    enabled: true
    timeout: 300

# Repo-local skills (.agents/skills, .hermes/skills) load in sessions started inside these checkouts.
skills:
  trusted_project_dirs:
    - /opt/data/workspace/talos-argocd-proxmox
    - /opt/data/workspace/radar-ng
    - /opt/data/workspace/deal-scout
    - /opt/data/workspace/news-reader
    - /opt/data/workspace/mobichan-ng
