apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      serviceAccountName: hermes
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Image from homelab-images/images/hermes-dev: official Hermes plus claude, codex, kubectl, gh, tmux.
        - name: seed
          image: ghcr.io/mitchross/hermes-dev:main@sha256:a5bea93ce24f4f97616a85ecd10b9d1ba712ac5afa5724d2ddf2a27eae7b6f2c
          command: ["/bin/sh", "/etc/hermes-scripts/seed.sh"]
          envFrom:
            - secretRef:
                name: hermes-secrets
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: hermes-config
              mountPath: /etc/hermes-config
              readOnly: true
            - name: hermes-scripts
              mountPath: /etc/hermes-scripts
              readOnly: true
            - name: hermes-skills
              mountPath: /etc/hermes-skills
              readOnly: true
      containers:
        - name: hermes
          image: ghcr.io/mitchross/hermes-dev:main@sha256:a5bea93ce24f4f97616a85ecd10b9d1ba712ac5afa5724d2ddf2a27eae7b6f2c
          args: ["gateway", "run"]
          # s6-overlay must start as root; it drops the gateway and dashboard to uid 10000 itself.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          ports:
            - name: http
              containerPort: 9119
            - name: api
              containerPort: 8642
          envFrom:
            - secretRef:
                name: hermes-secrets
          env:
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: 0.0.0.0
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: https://hermes.vanillax.me
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              value: vanillax
            # A blank volume otherwise leaves the gateway registered but down.
            - name: HERMES_GATEWAY_BOOTSTRAP_STATE
              value: running
            - name: HINDSIGHT_API_URL
              value: http://hindsight-service.hindsight.svc.cluster.local:8888
            - name: HASS_URL
              value: http://home-assistant.home-assistant.svc.cluster.local:8123
            # Explicit kubeconfig: any kubectl flag (e.g. --request-timeout) disables the in-cluster fallback.
            - name: KUBECONFIG
              value: /etc/hermes/cluster/kubeconfig
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 6Gi
          startupProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: shm
              mountPath: /dev/shm
            - name: cluster-config
              mountPath: /etc/hermes/cluster
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: hermes-config
          configMap:
            name: hermes-config
        - name: hermes-scripts
          configMap:
            name: hermes-scripts
            defaultMode: 0555
        - name: hermes-skills
          configMap:
            name: hermes-skills
        - name: cluster-config
          configMap:
            name: cluster-config
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
