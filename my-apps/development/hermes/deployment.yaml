apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      serviceAccountName: hermes
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/arch: amd64
      # Fast failover: the default 300 s wait before evicting from a dead node delays Hermes by 5 minutes.
      # Longhorn already force-deletes the pod and detaches the volume once the node is down.
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Image from homelab-images/images/hermes-dev: official Hermes plus claude, codex, kubectl, gh, tmux.
        - name: seed
          image: ghcr.io/mitchross/hermes-dev:main@sha256:40159c8b0ad99666f3fedab15826173e0d06bee2661f6392f9cb2430caf9cfe5
          command: ["/bin/sh", "/etc/hermes-scripts/seed.sh"]
          envFrom:
            - secretRef:
                name: hermes-secrets
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: hermes-config
              mountPath: /etc/hermes-config
              readOnly: true
            - name: hermes-scripts
              mountPath: /etc/hermes-scripts
              readOnly: true
            - name: hermes-skills
              mountPath: /etc/hermes-skills
              readOnly: true
      containers:
        - name: hermes
          image: ghcr.io/mitchross/hermes-dev:main@sha256:40159c8b0ad99666f3fedab15826173e0d06bee2661f6392f9cb2430caf9cfe5
          args: ["gateway", "run"]
          # s6-overlay must start as root; it drops the gateway and dashboard to uid 10000 itself.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          ports:
            - name: http
              containerPort: 9119
            - name: api
              containerPort: 8642
          envFrom:
            - secretRef:
                name: hermes-secrets
          env:
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: 0.0.0.0
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: https://hermes.vanillax.me
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              value: vanillax
            # A blank volume otherwise leaves the gateway registered but down.
            - name: HERMES_GATEWAY_BOOTSTRAP_STATE
              value: running
            - name: HINDSIGHT_API_URL
              value: http://hindsight-service.hindsight.svc.cluster.local:8888
            - name: HASS_URL
              value: http://home-assistant.home-assistant.svc.cluster.local:8123
            # claude -p defaults to Sonnet on this plan; every run must report this model in its JSON modelUsage.
            - name: ANTHROPIC_MODEL
              value: claude-opus-5-5
            # Explicit kubeconfig: any kubectl flag (e.g. --request-timeout) disables the in-cluster fallback.
            - name: KUBECONFIG
              value: /etc/hermes/cluster/kubeconfig
            # Git reads these as config; no tea CLI in the image, so a shell helper serves the Gitea token.
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: credential.https://gitea.vanillax.me.helper
            - name: GIT_CONFIG_VALUE_0
              value: '!f() { echo username=vanillax; echo "password=$GITEA_TOKEN"; }; f'
          # The CPU limit sets the worker count Jest, cargo and Node pick, keeping test and build runs inside the memory limit.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "8"
              memory: 12Gi
          startupProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 15
          # Restarts the pod only after 5 min without an answer, so a slow tool run doesn't trigger it.
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: shm
              mountPath: /dev/shm
            - name: cluster-config
              mountPath: /etc/hermes/cluster
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: hermes-config
          configMap:
            name: hermes-config
        - name: hermes-scripts
          configMap:
            name: hermes-scripts
            defaultMode: 0555
        - name: hermes-skills
          configMap:
            name: hermes-skills
        - name: cluster-config
          configMap:
            name: cluster-config
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
