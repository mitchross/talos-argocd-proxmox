apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed
          image: docker.io/nousresearch/hermes-agent:v0.22.2@sha256:36099926da316742423544e055d4734777105ffe6341873af5459b957d0c2919
          command: ["/bin/sh", "/etc/hermes-scripts/seed.sh"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: hermes-config
              mountPath: /etc/hermes-config
              readOnly: true
            - name: hermes-scripts
              mountPath: /etc/hermes-scripts
              readOnly: true
      containers:
        - name: hermes
          image: docker.io/nousresearch/hermes-agent:v0.22.2@sha256:36099926da316742423544e055d4734777105ffe6341873af5459b957d0c2919
          args: ["gateway", "run"]
          # s6-overlay must start as root; it drops the gateway and dashboard to uid 10000 itself.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          ports:
            - name: http
              containerPort: 9119
            - name: api
              containerPort: 8642
          envFrom:
            - secretRef:
                name: hermes-secrets
          env:
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: 0.0.0.0
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: https://hermes.vanillax.me
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              value: vanillax
            # A blank volume otherwise leaves the gateway registered but down.
            - name: HERMES_GATEWAY_BOOTSTRAP_STATE
              value: running
            - name: HINDSIGHT_API_URL
              value: http://hindsight-service.hindsight.svc.cluster.local:8888
            - name: HERMES_LANGFUSE_BASE_URL
              value: http://langfuse-web.langfuse.svc.cluster.local:3000
            - name: HASS_URL
              value: http://home-assistant.home-assistant.svc.cluster.local:8123
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 6Gi
          startupProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: hermes-config
          configMap:
            name: hermes-config
        - name: hermes-scripts
          configMap:
            name: hermes-scripts
            defaultMode: 0555
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
