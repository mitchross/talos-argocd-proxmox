apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      serviceAccountName: hermes
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/arch: amd64
      # Fast failover: the default 300 s wait before evicting from a dead node delays Hermes by 5 minutes.
      # Longhorn already force-deletes the pod and detaches the volume once the node is down.
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      # No fsGroup: Hermes resets /opt/data to 0700 on login saves, so kubelet re-owned ~1.4M files each start. seed.sh chowns what Hermes needs.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Image from homelab-images/images/hermes-dev: official Hermes plus claude, codex, kubectl, gh, tmux.
        - name: seed
          image: ghcr.io/mitchross/hermes-dev:main@sha256:aca87748285ca5480f1999d9655df6f9b08613ad8dd859f19ca34436e456a99a
          command: ["/bin/sh", "/etc/hermes-scripts/seed.sh"]
          envFrom:
            - secretRef:
                name: hermes-secrets
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: hermes-config
              mountPath: /etc/hermes-config
              readOnly: true
            - name: hermes-scripts
              mountPath: /etc/hermes-scripts
              readOnly: true
            - name: hermes-skills
              mountPath: /etc/hermes-skills
              readOnly: true
            - name: scratch
              mountPath: /opt/scratch
      containers:
        - name: hermes
          image: ghcr.io/mitchross/hermes-dev:main@sha256:aca87748285ca5480f1999d9655df6f9b08613ad8dd859f19ca34436e456a99a
          args: ["gateway", "run"]
          # s6-overlay must start as root; it drops the gateway and dashboard to uid 10000 itself.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          ports:
            - name: http
              containerPort: 9119
            - name: api
              containerPort: 8642
          envFrom:
            - secretRef:
                name: hermes-secrets
          env:
            # The browser tool's Chromium can't build its sandbox in this pod (non-root, no user
            # namespaces), and Hermes only injects --no-sandbox under Docker or root. The pod is the
            # isolation boundary, so pass the flags explicitly.
            - name: AGENT_BROWSER_ARGS
              value: "--no-sandbox,--disable-dev-shm-usage"
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: 0.0.0.0
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: https://hermes.vanillax.me
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              value: vanillax
            # A blank volume otherwise leaves the gateway registered but down.
            - name: HERMES_GATEWAY_BOOTSTRAP_STATE
              value: running
            - name: HINDSIGHT_API_URL
              value: http://hindsight-service.hindsight.svc.cluster.local:8888
            - name: HASS_URL
              value: http://home-assistant.home-assistant.svc.cluster.local:8123
            - name: SEARXNG_URL
              value: http://searxng.searxng.svc.cluster.local:8080
            # claude -p defaults to Sonnet on this plan; every run must report this model in its JSON modelUsage.
            - name: ANTHROPIC_MODEL
              value: claude-opus-5-5
            # Explicit kubeconfig: any kubectl flag (e.g. --request-timeout) disables the in-cluster fallback.
            - name: KUBECONFIG
              value: /etc/hermes/cluster/kubeconfig
            # Git reads these as config; no tea CLI in the image, so a shell helper serves the Gitea token.
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: credential.https://gitea.vanillax.me.helper
            - name: GIT_CONFIG_VALUE_0
              value: '!f() { echo username=vanillax; echo "password=$GITEA_TOKEN"; }; f'
          # The CPU limit sets the worker count Jest, cargo and Node pick, keeping test and build runs inside the memory limit.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "8"
              # The VPA target saturated the old 12Gi cap (uncapped target 13.6Gi), so it could no longer
              # track real usage. Headroom here keeps the OOM margin as the limit, not as a fixed ceiling.
              memory: 16Gi
          startupProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 15
            # Cargo and Jest runs saturate the CPU limit, and /api/status then misses the 1 s default.
            timeoutSeconds: 5
          # Restarts the pod only after 5 min without an answer, so a slow tool run doesn't trigger it.
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: scratch
              mountPath: /opt/scratch
            - name: shm
              mountPath: /dev/shm
            - name: cluster-config
              mountPath: /etc/hermes/cluster
              readOnly: true
        # Agent worktrees keep full build trees on the volume; 79Gi of `target/` filled it on 2026-10-31.
        # Shares the pod because the claim is ReadWriteOnce. Prunes build output only, never a worktree.
        - name: worktree-gc
          image: ghcr.io/mitchross/hermes-dev:main@sha256:aca87748285ca5480f1999d9655df6f9b08613ad8dd859f19ca34436e456a99a
          command: ["/bin/sh", "/etc/hermes-scripts/gc-worktrees.sh"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            # A build that touched the tree inside this window is left alone.
            - name: IDLE_HOURS
              value: "6"
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: scratch
              mountPath: /opt/scratch
            - name: hermes-scripts
              mountPath: /etc/hermes-scripts
              readOnly: true
        # Reads state.db (read-only) and serves model usage for Prometheus; see scripts/usage-exporter.py.
        - name: usage-exporter
          image: ghcr.io/mitchross/hermes-dev:main@sha256:aca87748285ca5480f1999d9655df6f9b08613ad8dd859f19ca34436e456a99a
          command: ["python3", "/etc/hermes-scripts/usage-exporter.py"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
          ports:
            - name: metrics
              containerPort: 9464
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: hermes-scripts
              mountPath: /etc/hermes-scripts
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: scratch
          persistentVolumeClaim:
            claimName: hermes-scratch
        - name: hermes-config
          configMap:
            name: hermes-config
        - name: hermes-scripts
          configMap:
            name: hermes-scripts
            defaultMode: 0555
        - name: hermes-skills
          configMap:
            name: hermes-skills
        - name: cluster-config
          configMap:
            name: cluster-config
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
