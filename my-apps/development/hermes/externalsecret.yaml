apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: hermes-secrets
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm
        property: master_key
    - secretKey: HINDSIGHT_API_KEY
      remoteRef:
        key: hindsight
        property: tenant_api_key
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
      remoteRef:
        key: hermes
        property: dashboard_password
    # 32+ random bytes; signs dashboard session tokens so logins survive restarts.
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_SECRET
      remoteRef:
        key: hermes
        property: dashboard_secret
    # Also turns on the Home Assistant gateway platform and entity tools.
    - secretKey: HASS_TOKEN
      remoteRef:
        key: home-assistant
        property: ha-longlived-token
