apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: hermes-secrets
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm
        property: master_key
    - secretKey: HINDSIGHT_API_KEY
      remoteRef:
        key: hindsight
        property: tenant_api_key
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
      remoteRef:
        key: hermes
        property: dashboard_password
    # 32+ random bytes; signs dashboard session tokens so logins survive restarts.
    - secretKey: HERMES_DASHBOARD_BASIC_AUTH_SECRET
      remoteRef:
        key: hermes
        property: dashboard_secret
    # Also turns on the Home Assistant gateway platform and entity tools.
    - secretKey: HASS_TOKEN
      remoteRef:
        key: home-assistant
        property: ha-longlived-token
    # From `claude setup-token` on a Max plan; `claude -p` in the pod reads it, no browser login needed.
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: claude-code
        property: oauth_token
    # Git credential helper in deployment.yaml answers for gitea.vanillax.me with this token.
    - secretKey: GITEA_TOKEN
      remoteRef:
        key: gitea
        property: git_token
    # Omni Operator role: manages clusters and machines, not users or service accounts.
    - secretKey: OMNI_ENDPOINT
      remoteRef:
        key: hermes-omni-sa
        property: OMNI_ENDPOINT
    - secretKey: OMNI_SERVICE_ACCOUNT_KEY
      remoteRef:
        key: hermes-omni-sa
        property: OMNI_SERVICE_ACCOUNT_KEY
    # Cloudflare API MCP server (config.yaml mcp_servers.cloudflare). Reuses the API token stored with
    # the tunnel credentials; Hermes can do whatever that token allows, nothing more.
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: cloudflared-proxmox
        property: api-token
