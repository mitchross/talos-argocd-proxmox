apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: hermes-data
spec:
  sources:
    - pvc:
        name: hermes-data
  identity:
    username: hermes-data
    hostname: hermes
  retention:
    keepHourly: 24
    keepDaily: 14
    keepWeekly: 6
  # The image's hermes user is uid 10000; the mover must match the data owner.
  mover:
    securityContext:
      runAsUser: 10000
      runAsGroup: 10000
      runAsNonRoot: true
    podSecurityContext:
      fsGroup: 10000
      supplementalGroups: [10000]
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: hermes-data-hourly
spec:
  policyRef:
    name: hermes-data
  schedule:
    # Hourly: Hermes state (sessions, memory, skills) changes all day.
    # :28 is unused by every other schedule, so it never collides with the 03/04 daily or */6 tiers.
    cron: "28 * * * *"
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: hermes-data-restore
spec:
  source:
    fromPolicy:
      name: hermes-data
      offset: 0
  mover:
    securityContext:
      runAsUser: 10000
      runAsGroup: 10000
      runAsNonRoot: true
    podSecurityContext:
      fsGroup: 10000
      supplementalGroups: [10000]
