apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - namespace.yaml
  - externalsecret.yaml
  - rbac.yaml
  - pvc.yaml
  - deployment.yaml
  - image-prepull.yaml
  - service.yaml
  - httproute.yaml
  - vpa.yaml
  - servicemonitor.yaml
  - kopiur/hermes-data.yaml
  - pi-egress.yaml
configMapGenerator:
  - name: hermes-config
    files:
      - config.yaml=config/config.yaml
      - SOUL.md=config/SOUL.md
      - agent-rules.md=config/agent-rules.md
      - ssh_config=config/ssh_config
      - known_hosts=config/known_hosts
      - hindsight-claude-code.json=config/hindsight-claude-code.json
      - hindsight-codex.json=config/hindsight-codex.json
      - hindsight-hermes.json=config/hindsight-hermes.json
  - name: hermes-scripts
    files:
      - seed.sh=scripts/seed.sh
      - gc-worktrees.sh=scripts/gc-worktrees.sh
      - usage-exporter.py=scripts/usage-exporter.py
      - reconcile-kanban.py=scripts/reconcile-kanban.py
      - external-skills.txt=scripts/external-skills.txt
  - name: hermes-skills
    files:
      - SKILL.md=skills/homelab-ops/SKILL.md
  - name: cluster-config
    files:
      - kubeconfig=config/kube-in-cluster.yaml
components:
  - ../../common/kopiur-backup
patches:
  - target:
      group: kopiur.home-operations.com
      kind: SnapshotPolicy
      name: hermes-data
    patch: |-
      - op: add
        path: /spec/staging/timeout
        value: 1h
