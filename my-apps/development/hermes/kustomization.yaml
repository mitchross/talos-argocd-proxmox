apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - namespace.yaml
  - externalsecret.yaml
  - rbac.yaml
  - pvc.yaml
  - pvc-scratch.yaml
  - deployment.yaml
  - image-prepull.yaml
  - service.yaml
  - httproute.yaml
  - vpa.yaml
  - servicemonitor.yaml
  - kopiur/hermes-data.yaml
  - pi-egress.yaml
  - ingress-policy.yaml
configMapGenerator:
  # Non-secret service URLs for the default profile; env vars plus files read by secrets.command.
  - name: hermes-profile-env
    literals:
      - HINDSIGHT_API_URL=http://hindsight-service.hindsight.svc.cluster.local:8888
      - HASS_URL=http://home-assistant.home-assistant.svc.cluster.local:8123
      - SEARXNG_URL=http://searxng.searxng.svc.cluster.local:8080
  - name: hermes-config
    files:
      - config.yaml=config/config.yaml
      - SOUL.md=config/SOUL.md
      - agent-rules.md=config/agent-rules.md
      - ssh_config=config/ssh_config
      - known_hosts=config/known_hosts
      - hindsight-claude-code.json=config/hindsight-claude-code.json
      - hindsight-codex.json=config/hindsight-codex.json
      - hindsight-hermes.json=config/hindsight-hermes.json
  - name: hermes-scripts
    files:
      - seed.sh=scripts/seed.sh
      - seed-skills.py=scripts/seed-skills.py
      - gc-worktrees.sh=scripts/gc-worktrees.sh
      - usage-exporter.py=scripts/usage-exporter.py
      - reconcile-kanban.py=scripts/reconcile-kanban.py
      - external-skills.txt=scripts/external-skills.txt
      - seed-qwen-lab.py=scripts/seed-qwen-lab.py
      - report-drift.sh=scripts/report-drift.sh
      - cron-jobs.txt=cron/jobs.txt
      - cron-upstream-watch.py=cron/upstream-watch.py
      - cron-strata-v31-watch.py=cron/strata-v31-watch.py
      - cron-argo-rid-watch.py=cron/argo-rid-watch.py
      - cron-radar-kanban-unlock.py=cron/radar-kanban-unlock.py
      - cron-qwen-lab-doctor.py=cron/qwen-lab-doctor.py
  - name: hermes-skills
    files:
      - SKILL.md=skills/homelab-ops/SKILL.md
      - hermes-change-placement.md=skills/hermes-change-placement/SKILL.md
  # Qwen Lab: local-only profiles seeded by scripts/seed-qwen-lab.py; the default profile never reads these.
  - name: hermes-qwen-lab
    files:
      - base.yaml=qwen-lab/base.yaml
      - profiles.yaml=qwen-lab/profiles.yaml
      - SOUL.md=qwen-lab/SOUL.md
      - skill-qwen-ticket-template.md=qwen-lab/skills/qwen-ticket-template.md
      - skill-qwen-reviewer-checklist.md=qwen-lab/skills/qwen-reviewer-checklist.md
      - skill-qwen-best-of-n.md=qwen-lab/skills/qwen-best-of-n.md
  - name: cluster-config
    files:
      - kubeconfig=config/kube-in-cluster.yaml
components:
  - ../../common/kopiur-backup
patches:
  - target:
      group: kopiur.home-operations.com
      kind: SnapshotPolicy
      name: hermes-data
    patch: |-
      - op: add
        path: /spec/staging/timeout
        value: 1h
