apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - namespace.yaml
  - externalsecret.yaml
  - rbac.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - vpa.yaml
  - kopiur/hermes-data.yaml
configMapGenerator:
  - name: hermes-config
    files:
      - config.yaml=config/config.yaml
  - name: hermes-scripts
    files:
      - seed.sh=scripts/seed.sh
  - name: hermes-skills
    files:
      - SKILL.md=skills/homelab-ops/SKILL.md
  - name: cluster-config
    files:
      - kubeconfig=config/kube-in-cluster.yaml
components:
  - ../../common/kopiur-backup
