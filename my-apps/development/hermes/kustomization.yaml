apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - namespace.yaml
  - externalsecret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - vpa.yaml
  - kopiur/hermes-data.yaml
configMapGenerator:
  - name: hermes-config
    files:
      - config.yaml=config/config.yaml
  - name: hermes-scripts
    files:
      - seed.sh=scripts/seed.sh
components:
  - ../../common/kopiur-backup
