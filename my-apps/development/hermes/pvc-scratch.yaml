apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-scratch
  labels:
    backup-exempt: "true"
  annotations:
    storage.vanillax.dev/backup-exempt-reason: "Rebuildable package caches and Cargo build dirs for Hermes's coding agents; kept off hermes-data so its snapshots and backups stay small"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 150Gi
