apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes
---
# Read-only. The agent's terminal inherits this token; no secrets, no writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-viewer
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, pods/status, services, endpoints, events, nodes, namespaces, persistentvolumeclaims, persistentvolumes, resourcequotas]
    verbs: [get, list, watch]
  - apiGroups: [apps, batch, autoscaling, networking.k8s.io, storage.k8s.io, gateway.networking.k8s.io, argoproj.io, longhorn.io, kopiur.home-operations.com, external-secrets.io, snapshot.storage.k8s.io, metrics.k8s.io, autoscaling.k8s.io, cilium.io, monitoring.coreos.com]
    resources: ["*"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-viewer
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: hermes
roleRef:
  kind: ClusterRole
  name: hermes-viewer
  apiGroup: rbac.authorization.k8s.io
---
# Day-to-day fixes: restart or delete pods, roll out, cordon a node, delete a PVC, Longhorn replicas, Argo sync.
# Cluster-wide pods/exec, pods/attach, pods/portforward and batch/jobs are intentionally excluded so
# Hermes (and its MCP servers/skills) cannot exec into or spawn Jobs in secret-bearing system
# namespaces such as external-secrets, kube-system, or argocd.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-operator
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [patch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [patch]
  - apiGroups: [apps]
    resources: [deployments/scale, statefulsets/scale]
    verbs: [patch, update]
  # Delete PVCs that Git no longer holds (retired or scratch). Argo recreates an empty one if Git still has it.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [delete]
  # Raise or lower a Longhorn volume's copy count. Existing volumes keep the
  # count they were made with, so a storage-class change never reaches them.
  - apiGroups: [longhorn.io]
    resources: [volumes]
    verbs: [patch]
  # Start an Argo CD sync of Git (`.operation`) or a hard refresh (annotation).
  # Patch could also edit an app's spec, but the AppSets and root self-heal it back.
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-operator
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: hermes
roleRef:
  kind: ClusterRole
  name: hermes-operator
  apiGroup: rbac.authorization.k8s.io
---
# Opt-in debug role for exec/port-forward/Jobs. Never bind cluster-wide; add a RoleBinding only in
# specific non-privileged app namespaces where interactive debugging or one-off Jobs are needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-debug
rules:
  - apiGroups: [""]
    resources: [pods/exec, pods/portforward, pods/attach]
    verbs: [create, get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-debug
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: hermes
roleRef:
  kind: ClusterRole
  name: hermes-debug
  apiGroup: rbac.authorization.k8s.io
