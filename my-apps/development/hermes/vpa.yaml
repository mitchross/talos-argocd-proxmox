apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: hermes
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hermes
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: hermes
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
        minAllowed:
          cpu: 250m
          memory: 1Gi
        maxAllowed:
          cpu: "8"
          # Above the container limit the VPA just pins the request to the cap; keep it under the limit.
          memory: 14Gi
      - containerName: seed
        mode: "Off"
