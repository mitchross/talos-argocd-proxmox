apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: hermes
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hermes
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: hermes
        controlledResources: [cpu, memory]
        controlledValues: RequestsOnly
        minAllowed:
          cpu: 250m
          memory: 1Gi
        maxAllowed:
          cpu: "8"
          # Request cap, not a limit: 7d peak 13.8Gi, p99 5.6Gi. The 16Gi limit still covers bursts.
          memory: 8Gi
      - containerName: seed
        mode: "Off"
      - containerName: worktree-gc
        mode: "Off"
      - containerName: usage-exporter
        mode: "Off"
