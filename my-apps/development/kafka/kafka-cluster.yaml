apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    strimzi.io/cluster: dev-kafka
spec:
  # Single broker fits the one schedulable worker; scaling to 3 also needs the replication settings below raised.
  replicas: 1
  roles:
    - broker
    - controller
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
  # JBOD from day one avoids an immutable storage-type migration when the
  # learning cluster grows. Additional volume IDs can be added later.
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        class: longhorn
        size: 20Gi
        deleteClaim: false
        kraftMetadata: shared
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: dev-kafka
  namespace: kafka
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  kafka:
    version: 4.3.0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      # Internal offsets/transaction topics default to 3/3/2; these overrides are load-bearing on a single broker.
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      auto.create.topics.enable: false
  entityOperator:
    topicOperator: {}
    userOperator: {}
