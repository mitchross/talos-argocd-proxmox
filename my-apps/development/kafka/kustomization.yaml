apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kafka
labels:
  # includeSelectors: true == the old commonLabels behavior (labels stamped on
  # metadata, selectors, AND pod templates). Keep true: selectors are immutable
  # on live Deployments/StatefulSets; flipping to false forces delete/recreate.
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/managed-by: argocd
resources:
  - vpa.yaml
  - namespace.yaml
  - kafka-cluster.yaml
  - topics.yaml
  - demo-seed-job.yaml
  - kafka-ui.yaml
  - kopiur/kafka-data.yaml
configMapGenerator:
  # Keep executable logic and sample payloads out of Kubernetes YAML. The
  # generated name hash automatically gives each Job revision its exact files.
  - name: kafka-demo
    files:
      - seed-and-verify.sh=demo/seed-and-verify.sh
      - events.jsonl=demo/events.jsonl
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "1"
components:
  - ../../common/kopiur-backup
