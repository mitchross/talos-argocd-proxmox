apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: news-reader-secrets
  namespace: news-reader
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: news-reader-secrets
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm
        property: master_key
