# Must be `kind: Connection` — the controller's deprecated `TemporalConnection` handler only logs, never reconciles.
apiVersion: temporal.io/v1alpha1
kind: Connection
metadata:
  name: cluster-temporal
  namespace: news-reader
spec:
  hostPort: "temporal-frontend.temporal.svc.cluster.local:7233"
  # No mTLS on the self-hosted frontend. To add it, create a Secret with tls.crt/tls.key/ca.crt and set mutualTLSSecretRef.
