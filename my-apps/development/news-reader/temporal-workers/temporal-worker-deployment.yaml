# Must be `kind: WorkerDeployment`: the controller's deprecated `Temporal*` handlers no-op, so image bumps never roll.
# Each image-tag bump = a new Temporal build_id + progressive rollout (Worker Versioning).
apiVersion: temporal.io/v1alpha1
kind: WorkerDeployment
metadata:
  name: news-digest                           # → also the Temporal "deployment name"
  namespace: news-reader
spec:
  replicas: 1                                 # per versioned Deployment; bump for HPA-less scale-out
  workerOptions:
    connectionRef:
      name: cluster-temporal                  # → temporal-connection.yaml
    temporalNamespace: default                # Temporal-server namespace (not k8s ns)
  rollout:
    # Ramp only controls where NEW workflows start; AUTO_UPGRADE in-flight workflows migrate on their own.
    strategy: Progressive
    steps:
      - rampPercentage: 10                    # 10% of new workflows → new version
        pauseDuration: 2m                     # then hold for 2 minutes
      - rampPercentage: 50                    # then 50%
        pauseDuration: 5m                     # hold 5 minutes
      # the final 100% is implicit after the last step's pause
  sunset:
    # Delays start only after Temporal reports the old version Drained (no PINNED workflows left).
    scaledownDelay: 10m
    deleteDelay: 1h
  template:
    metadata:
      labels:
        app: news-reader-temporal-worker
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          # Do NOT pin :latest — the controller keys build_id off the tag and cannot tell two pushes apart.
          image: registry.vanillax.me/news-reader-temporal-worker:v1.0.12
          imagePullPolicy: IfNotPresent
          # Controller injects TEMPORAL_ADDRESS/NAMESPACE/DEPLOYMENT_NAME/WORKER_BUILD_ID — do not set them here.
          env:
            - name: LLM_URL
              value: "http://llama-cpp-service.llama-cpp.svc.cluster.local:8080/v1/chat/completions"
            - name: LLM_MODEL
              value: "qwen3.8-27b"
            - name: REDDIT_FRONTEND
              value: "https://redlib.vanillax.me"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
