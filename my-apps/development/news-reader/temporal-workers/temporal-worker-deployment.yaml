# Must be `kind: WorkerDeployment`: the controller's deprecated `Temporal*` handlers no-op, so image bumps never roll.
# Each image-tag bump = a new Temporal build_id + progressive rollout (Worker Versioning).
apiVersion: temporal.io/v1alpha1
kind: WorkerDeployment
metadata:
  name: news-digest                           # → also the Temporal "deployment name"
  namespace: news-reader
spec:
  replicas: 1                                 # per versioned Deployment; bump for HPA-less scale-out
  workerOptions:
    connectionRef:
      name: cluster-temporal                  # → temporal-connection.yaml
    temporalNamespace: default                # Temporal-server namespace (not k8s ns)
  rollout:
    # Ramp only controls where NEW workflows start; AUTO_UPGRADE in-flight workflows migrate on their own.
    strategy: Progressive
    steps:
      - rampPercentage: 10                    # 10% of new workflows → new version
        pauseDuration: 2m                     # then hold for 2 minutes
      - rampPercentage: 50                    # then 50%
        pauseDuration: 5m                     # hold 5 minutes
      # the final 100% is implicit after the last step's pause
  sunset:
    # Delays start only after Temporal reports the old version Drained (no PINNED workflows left).
    scaledownDelay: 10m
    deleteDelay: 1h
  template:
    metadata:
      labels:
        app: news-reader-temporal-worker
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-llm-auth
          image: registry.vanillax.me/news-reader-temporal-worker:v1.0.14
          command: ["python", "/opt/repo-scripts/prepare-litellm-auth.py"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: llm-auth-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: llm-auth-source
              mountPath: /patched
      containers:
        - name: worker
          # Keep immutable release tags; the controller appends a hash of the full pod template.
          image: registry.vanillax.me/news-reader-temporal-worker:v1.0.14
          imagePullPolicy: IfNotPresent
          # Controller injects TEMPORAL_ADDRESS/NAMESPACE/DEPLOYMENT_NAME/WORKER_BUILD_ID — do not set them here.
          env:
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: news-reader-secrets
                  key: LITELLM_API_KEY
            - name: LLM_URL
              value: "http://litellm-service.litellm.svc.cluster.local:4000/v1/chat/completions"
            - name: LLM_MODEL
              value: "qwen3.8-27b"
            - name: REDDIT_FRONTEND
              value: "https://redlib.vanillax.me"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi

          volumeMounts:
            - name: llm-auth-source
              mountPath: /app/worker.py
              subPath: worker.py
              readOnly: true
      volumes:
        - name: llm-auth-scripts
          configMap:
            name: news-reader-llm-auth-scripts
            defaultMode: 0444
        - name: llm-auth-source
          emptyDir:
            sizeLimit: 2Mi
