apiVersion: apps/v1
kind: Deployment
metadata:
  name: paseo
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paseo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paseo
    spec:
      serviceAccountName: paseo
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: paseo
          image: ghcr.io/mitchross/paseo-dev:main@sha256:961fc52fd9e0c138591739e8fa9336d915529c90e10b1c16744732e7d913fdc0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 6767
          env:
            - name: PASEO_HOSTNAMES
              value: paseo.vanillax.me
            - name: PASEO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paseo-secrets
                  key: PASEO_PASSWORD
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: paseo-secrets
                  key: LITELLM_API_KEY
            # Paseo terminals use $SHELL or fall back to /bin/sh, which skips the bash Pi aliases.
            - name: SHELL
              value: /bin/bash
            - name: PASEO_RELAY_ENABLED
              value: "false"
            - name: PASEO_SERVICE_PROXY_ENABLED
              value: "false"
            # TLS ends at the gateway; trust its X-Forwarded-Proto so the web UI auto-connects over wss.
            - name: PASEO_TRUSTED_PROXIES
              value: loopback,uniquelocal
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 12Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: paseo.vanillax.me
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: paseo.vanillax.me
            periodSeconds: 10
          volumeMounts:
            - name: home
              mountPath: /home/paseo
            - name: workspace
              mountPath: /workspace
            - name: shm
              mountPath: /dev/shm
            # Git owns Pi's model list; a file on the home volume would drift.
            - name: pi-config
              mountPath: /home/paseo/.pi/agent/models.json
              subPath: models.json
              readOnly: true
            - name: pi-config
              mountPath: /home/paseo/.pi/agent/extensions/qwen-sampling.ts
              subPath: qwen-sampling.ts
              readOnly: true
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: paseo-home
        - name: workspace
          persistentVolumeClaim:
            claimName: paseo-workspace
        - name: pi-config
          configMap:
            name: pi-config
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
