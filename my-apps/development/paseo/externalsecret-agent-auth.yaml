# Separate from paseo-secrets so a missing login token never blocks the Paseo password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-agent-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: paseo-agent-auth
    creationPolicy: Owner
  data:
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: paseo
        property: claude_oauth_token
