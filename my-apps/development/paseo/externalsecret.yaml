apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: paseo-secrets
    creationPolicy: Owner
  data:
    - secretKey: PASEO_PASSWORD
      remoteRef:
        key: paseo
        property: password
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm
        property: master_key
    - secretKey: OMNI_SERVICE_ACCOUNT_KEY
      remoteRef:
        key: paseo-omni-sa
        property: OMNI_SERVICE_ACCOUNT_KEY
---
# tea's whole config, mounted as a folder so a rotated token reaches the pod without a restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-tea
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: paseo-tea
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yml: |
          logins:
            - name: vanillax
              url: https://gitea.vanillax.me
              token: "{{ .token }}"
              default: true
              ssh_host: gitea.vanillax.me
              user: vanillax
  data:
    - secretKey: token
      remoteRef:
        key: gitea
        property: git_token
