apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paseo-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: paseo-secrets
    creationPolicy: Owner
  data:
    - secretKey: PASEO_PASSWORD
      remoteRef:
        key: paseo
        property: password
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: litellm
        property: paseo_key
