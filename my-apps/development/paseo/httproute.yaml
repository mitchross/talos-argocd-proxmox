apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paseo-internal
spec:
  parentRefs:
    # Internal only (Tailscale via TrueNAS). Re-parent by renaming: Argo drops in-place parentRefs edits.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal-technitium
      namespace: gateway
      sectionName: https
  hostnames:
    - paseo.vanillax.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: paseo
          port: 6767
          weight: 1
