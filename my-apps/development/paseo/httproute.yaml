apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paseo
  labels:
    external-dns: "true"
  annotations:
    external-dns.alpha.kubernetes.io/target: vanillax.me
spec:
  parentRefs:
    - kind: Gateway
      name: gateway-external
      namespace: gateway
      sectionName: https
  hostnames:
    - paseo.vanillax.me
  rules:
    - backendRefs:
        - name: paseo
          port: 6767
