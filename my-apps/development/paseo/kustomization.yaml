apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: paseo
resources:
  - namespace.yaml
  - externalsecret.yaml
  - rbac.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - omni-egress.yaml
  - vpa.yaml
  - kopiur/paseo-home.yaml
  - kopiur/paseo-workspace.yaml
configMapGenerator:
  - name: pi-config
    files:
      - models.json=config/pi-models.json
      - qwen-sampling.ts=config/qwen-sampling.ts
  - name: cluster-config
    files:
      - kubeconfig=config/kube-in-cluster.yaml
      - talosconfig=config/talos-omni.yaml
  - name: paseo-settings
    files:
      - config.json=config/paseo-settings.json
components:
  - ../../common/kopiur-backup
