apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paseo-home
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=false
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: paseo-home-restore
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paseo-workspace
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=false
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 50Gi
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: paseo-workspace-restore
