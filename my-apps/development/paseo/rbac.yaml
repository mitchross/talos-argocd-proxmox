apiVersion: v1
kind: ServiceAccount
metadata:
  name: paseo
---
# Operator access for agents in Paseo. Read-everything includes Secrets, and exec reaches every pod's env.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: paseo-operator
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Kubernetes 1.35+ checks `create` on WebSocket exec, attach, and port-forward upgrades.
  - apiGroups: [""]
    resources: ["pods/exec", "pods/attach", "pods/portforward"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applicationsets"]
    verbs: ["patch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: paseo-operator
subjects:
  - kind: ServiceAccount
    name: paseo
    namespace: paseo
roleRef:
  kind: ClusterRole
  name: paseo-operator
  apiGroup: rbac.authorization.k8s.io
---
# Throwaway debug pods (kubectl run) stay in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paseo-debug
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paseo-debug
subjects:
  - kind: ServiceAccount
    name: paseo
    namespace: paseo
roleRef:
  kind: Role
  name: paseo-debug
  apiGroup: rbac.authorization.k8s.io
