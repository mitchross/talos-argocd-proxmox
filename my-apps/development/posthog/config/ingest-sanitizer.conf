# Rewrites X-Forwarded-For to a client IP the caller cannot choose, for the PostHog
# ingest services that read it (capture, capture-ai, replay-capture, feature-flags).
# Those read the LEFTMOST X-Forwarded-For value, and Cilium's Envoy APPENDS to that
# header rather than replacing it, so without this hop any caller can prepend an IP.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Only the rightmost X-Forwarded-For entry is the peer Envoy actually observed.
  map $http_x_forwarded_for $xff_rightmost {
    ""                             "";
    "~,[ ]*(?<rightmost>[^,\s]+)$"  $rightmost;
    default                        $http_x_forwarded_for;
  }

  # Tunnel traffic reaches Envoy from a cloudflared pod, so its cf-connecting-ip
  # came from Cloudflare. A caller hitting the gateway directly has a LAN rightmost
  # hop, and its cf-connecting-ip is self-asserted and must be discarded.
  geo $xff_rightmost $via_cluster_proxy {
    default       0;
    10.244.0.0/16 1;
  }

  map "$via_cluster_proxy:$http_cf_connecting_ip" $cf_trusted {
    "~^1:(?<cfip>.+)$" $cfip;
    default            "";
  }
  map $cf_trusted $client_ip {
    ""      $xff_rightmost;
    default $cf_trusted;
  }
  map $client_ip $client_ip_final {
    ""      $remote_addr;
    default $client_ip;
  }

  # Both gateways terminate TLS, so a missing x-forwarded-proto still means https.
  map $http_x_forwarded_proto $forwarded_proto {
    ""      https;
    default $http_x_forwarded_proto;
  }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection "";
  # Single value, not an append: downstream reads the leftmost entry.
  proxy_set_header X-Forwarded-For $client_ip_final;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  # Strip the inputs so nothing downstream can consult the unsanitized values.
  proxy_set_header CF-Connecting-IP "";
  proxy_set_header True-Client-IP "";
  proxy_set_header X-Real-IP $client_ip_final;

  # Session replay payloads are large; keep the hop from buffering them to disk.
  client_max_body_size 64m;
  proxy_request_buffering off;

  # A literal proxy_pass host is resolved once at startup, so nginx refuses to boot
  # while any backend Service is missing. A variable defers it to request time.
  resolver 10.96.0.10 valid=30s ipv6=off;

  server {
    listen 8001;
    location / {
      set $up capture.posthog.svc.cluster.local:3000;
      proxy_pass http://$up;
    }
  }
  server {
    listen 8002;
    location / {
      set $up capture-ai.posthog.svc.cluster.local:3000;
      proxy_pass http://$up;
    }
  }
  server {
    listen 8003;
    location / {
      set $up replay-capture.posthog.svc.cluster.local:3000;
      proxy_pass http://$up;
    }
  }
  server {
    listen 8004;
    location / {
      set $up feature-flags.posthog.svc.cluster.local:3001;
      proxy_pass http://$up;
    }
  }
  server {
    listen 8080;
    location /healthz {
      return 200 "ok\n";
    }
  }
}
