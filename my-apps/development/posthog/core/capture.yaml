apiVersion: apps/v1
kind: Deployment
metadata:
  name: capture
  namespace: posthog
  labels:
    app.kubernetes.io/name: posthog
    app.kubernetes.io/component: capture
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: posthog
      app.kubernetes.io/component: capture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posthog
        app.kubernetes.io/component: capture
    spec:
      containers:
        - name: capture
          image: ghcr.io/posthog/posthog/capture:master@sha256:0c5db5e41ab1afae9d85047532369c7b04c6bbcddd7542d8d4eff25ae3167695
          # No envFrom on purpose: events mode needs no S3/shared config, and skipping
          # the ConfigMap keeps env edits from rolling the hot ingest path.
          env:
            - name: ADDRESS
              value: "0.0.0.0:3000"
            - name: KAFKA_TOPIC
              value: "events_plugin_ingestion"
            - name: KAFKA_HOSTS
              value: "kafka:9092"
            - name: REDIS_URL
              value: "redis://redis7:6379/"
            - name: CAPTURE_MODE
              value: "events"
            - name: RUST_LOG
              value: "info,rdkafka=warn"
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: capture
  namespace: posthog
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app.kubernetes.io/name: posthog
    app.kubernetes.io/component: capture
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: replay-capture
  namespace: posthog
  labels:
    app.kubernetes.io/name: posthog
    app.kubernetes.io/component: replay-capture
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: posthog
      app.kubernetes.io/component: replay-capture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posthog
        app.kubernetes.io/component: replay-capture
    spec:
      containers:
        - name: replay-capture
          image: ghcr.io/posthog/posthog/capture:master@sha256:0c5db5e41ab1afae9d85047532369c7b04c6bbcddd7542d8d4eff25ae3167695
          envFrom:
            - configMapRef:
                name: posthog-env
          env:
            - name: ADDRESS
              value: "0.0.0.0:3000"
            - name: KAFKA_TOPIC
              value: "session_recording_snapshot_item_events"
            - name: KAFKA_HOSTS
              value: "kafka:9092"
            - name: REDIS_URL
              value: "redis://redis7:6379/"
            - name: CAPTURE_MODE
              value: "recordings"
            - name: RUST_LOG
              value: "info,rdkafka=warn"
            - name: OBJECT_STORAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: posthog-secrets
                  key: rustfs-access-key
            - name: OBJECT_STORAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: posthog-secrets
                  key: rustfs-secret-key
            - name: SESSION_RECORDING_V2_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: posthog-secrets
                  key: rustfs-access-key
            - name: SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: posthog-secrets
                  key: rustfs-secret-key
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: replay-capture
  namespace: posthog
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app.kubernetes.io/name: posthog
    app.kubernetes.io/component: replay-capture
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-flags
  namespace: posthog
  labels:
    app.kubernetes.io/name: posthog
    app.kubernetes.io/component: feature-flags
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1  # Required for /decide endpoint (session replay, feature flags)
  selector:
    matchLabels:
      app.kubernetes.io/name: posthog
      app.kubernetes.io/component: feature-flags
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posthog
        app.kubernetes.io/component: feature-flags
    spec:
      initContainers:
        - name: copy-geoip
          # Keep this aligned with the posthog-migrate hook in jobs.yaml.
          image: posthog/posthog:latest@sha256:42176067c09c1351116aacd28c53cf45ff93e5454a73936ea55f38583395303e
          command:
            - /bin/sh
            - -c
            - /opt/repo-scripts/copy-geoip.sh
          volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: geoip-data
              mountPath: /share
      containers:
        - name: feature-flags
          image: ghcr.io/posthog/posthog/feature-flags:master@sha256:4429fab865c8b21f48fbe73af67a46ff6fba17e73580ebe4d85f0aa06af248fc
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: posthog-secrets
                  key: posthog-db-password
            - name: WRITE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: posthog-secrets
                  key: posthog-db-url
            - name: READ_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: posthog-secrets
                  key: posthog-db-url
            - name: PERSONS_WRITE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: posthog-secrets
                  key: posthog-db-url
            - name: PERSONS_READ_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: posthog-secrets
                  key: posthog-db-url
            - name: MAXMIND_DB_PATH
              value: "/share/GeoLite2-City.mmdb"
            - name: REDIS_URL
              value: "redis://redis7:6379/"
            - name: ADDRESS
              value: "0.0.0.0:3001"
            - name: RUST_LOG
              value: "info"
            - name: COOKIELESS_REDIS_HOST
              value: "redis7"
            - name: COOKIELESS_REDIS_PORT
              value: "6379"
            # Without this the service cannot decrypt the remote config payload and
            # serves an all-false fallback — session replay never starts in the SDK.
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: posthog-secrets
                  key: posthog-secret
          ports:
            - containerPort: 3001
              name: http
          volumeMounts:
            - name: geoip-data
              mountPath: /share
          livenessProbe:
            httpGet:
              path: /_readiness
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: repo-scripts
          configMap:
            name: posthog-scripts
            defaultMode: 0555
        - name: geoip-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: feature-flags
  namespace: posthog
spec:
  ports:
    - name: http
      port: 3001
      targetPort: 3001
  selector:
    app.kubernetes.io/name: posthog
    app.kubernetes.io/component: feature-flags
