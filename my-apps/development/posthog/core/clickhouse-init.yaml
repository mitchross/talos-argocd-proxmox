apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-migrations-init
  namespace: posthog
  labels:
    app.kubernetes.io/name: posthog
    app.kubernetes.io/component: clickhouse-init
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posthog
        app.kubernetes.io/component: clickhouse-init
    spec:
      restartPolicy: OnFailure
      containers:
      - name: clickhouse-init
        image: clickhouse/clickhouse-server:26.6.1.1193@sha256:1d1f6508eba2dccce2cee9913907c5f7766327debc57a6b1991f2c9e3176c163
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - /opt/repo-scripts/init-clickhouse.sh
        volumeMounts:
        - name: repo-scripts
          mountPath: /opt/repo-scripts
          readOnly: true
      volumes:
      - name: repo-scripts
        configMap:
          name: posthog-scripts
          defaultMode: 0555
