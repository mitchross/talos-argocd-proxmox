apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-sanitizer
  namespace: posthog
  labels:
    app.kubernetes.io/name: posthog
    app.kubernetes.io/component: ingest-sanitizer
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: posthog
      app.kubernetes.io/component: ingest-sanitizer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posthog
        app.kubernetes.io/component: ingest-sanitizer
    spec:
      containers:
        - name: nginx
          image: nginx:1.31-alpine@sha256:62ff2089abf5a9ed33bd232895bef5e22f7bb4b200675cec49a5ebc48e3d4ac8
          # Bypasses docker-entrypoint.d, which rewrites /etc/nginx on a read-only rootfs.
          command: ["nginx", "-g", "daemon off;"]
          ports:
            - containerPort: 8001
              name: capture
            - containerPort: 8002
              name: capture-ai
            - containerPort: 8003
              name: replay
            - containerPort: 8004
              name: flags
            - containerPort: 8080
              name: health
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: ingest-sanitizer.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: posthog-ingest-sanitizer
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ingest-sanitizer
  namespace: posthog
spec:
  ports:
    - name: capture
      port: 8001
      targetPort: capture
    - name: capture-ai
      port: 8002
      targetPort: capture-ai
    - name: replay
      port: 8003
      targetPort: replay
    - name: flags
      port: 8004
      targetPort: flags
  selector:
    app.kubernetes.io/name: posthog
    app.kubernetes.io/component: ingest-sanitizer
