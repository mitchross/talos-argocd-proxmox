apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redpanda-data-kafka-0
  namespace: posthog
  labels:
    app: posthog-kafka
    app.kubernetes.io/name: posthog
    app.kubernetes.io/component: kafka
    # PostHog data is disposable/rebuildable in this homelab — backup-exempt (no kopiur).
    backup-exempt: "true"
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=false
    storage.vanillax.dev/backup-exempt-reason: "PostHog data is disposable/rebuildable in this homelab; do not back up. Redpanda runs --unsafe-bypass-fsync with ~1h retention + auto_create_topics — log is ephemeral/rebuildable."
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn-flash
  resources:
    requests:
      # Redpanda runs --unsafe-bypass-fsync with ~1h retention; the log is ephemeral, 8Gi is plenty.
      storage: 8Gi
  # Backup-exempt by design: no dataSourceRef and no backup CRs. Do not re-add.
---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: posthog
  labels:
    app.kubernetes.io/name: posthog
    app.kubernetes.io/component: kafka
  annotations:
    # Consumer fetch long-polls read as slow requests to Coroot's L7 eBPF
    # latency SLI at the 500ms default; 10s keeps a real stall visible.
    coroot.com/slo-latency-threshold: "10s"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: posthog
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posthog
        app.kubernetes.io/component: kafka
    spec:
      securityContext:
        fsGroup: 101
        runAsUser: 101
        runAsGroup: 101
      containers:
      - name: redpanda
        image: docker.redpanda.com/redpandadata/redpanda:v25.1.9@sha256:8f7e9e4c1422baaa1a5e2a6c6c668cfe05442cb3cb476542c7dff61725e6fe31
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - /opt/repo-scripts/start-kafka.sh
        env:
        - name: ALLOW_PLAINTEXT_LISTENER
          value: "true"
        ports:
        - containerPort: 9092
          name: kafka
        - containerPort: 8081
          name: schema
        - containerPort: 8082
          name: proxy
        - containerPort: 9644
          name: admin
        livenessProbe:
          httpGet:
            path: /v1/status/ready
            port: admin
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 4Gi
        volumeMounts:
        - name: repo-scripts
          mountPath: /opt/repo-scripts
          readOnly: true
        - name: redpanda-data
          mountPath: /var/lib/redpanda/data
      volumes:
      - name: repo-scripts
        configMap:
          name: posthog-scripts
          defaultMode: 0555
      - name: redpanda-data
        persistentVolumeClaim:
          claimName: redpanda-data-kafka-0
---
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: posthog
spec:
  clusterIP: None
  ports:
  - port: 9092
    name: kafka
  - port: 8081
    name: schema
  - port: 8082
    name: proxy
  - port: 33145
    name: rpc
  # Public metrics endpoint: includes consumer offsets + high-water marks so Grafana can compute lag without an exporter.
  - port: 9644
    targetPort: admin
    name: metrics
  selector:
    app.kubernetes.io/name: posthog
    app.kubernetes.io/component: kafka
