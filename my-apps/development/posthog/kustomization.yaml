apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: posthog

resources:
  - namespace.yaml
  - externalsecret.yaml
  - httproute.yaml
  - vpa.yaml
  - kopiur/postgres-data.yaml
  # Data layer (all in posthog namespace)
  - data-layer/postgres.yaml
  - data-layer/redis.yaml
  - data-layer/kafka.yaml
  - config
  - data-layer/clickhouse.yaml
  # Core application
  - core/clickhouse-init.yaml
  - core/jobs.yaml
  - core/web.yaml
  - core/workers.yaml
  - core/plugins.yaml
  - core/capture.yaml
  - core/capture-ai.yaml
  - core/hypercache-server.yaml
  - core/ingestion.yaml
  - core/ingestion-sessionreplay.yaml
  - core/recording-api.yaml
  - core/temporal-worker.yaml
  - core/microservices.yaml
  - core/toolbox.yaml
  - core/servicemonitor.yaml

# Hash-suffixed: Kustomize rewrites every configMapRef.name, so any env edit rolls all consumers.
configMapGenerator:
  - name: posthog-env
    envs:
      - posthog-env.env

components:
  - ../../common/kopiur-backup

# Zone `house` IS the Threadripper box, so this pins every workload to its two
# workers — the AVX2 selector alone also matches the smaller Dell and HP nodes.
patches:
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: not-used
      spec:
        template:
          spec:
            nodeSelector:
              topology.kubernetes.io/zone: house
  - target:
      kind: Job
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: not-used
      spec:
        template:
          spec:
            nodeSelector:
              topology.kubernetes.io/zone: house
