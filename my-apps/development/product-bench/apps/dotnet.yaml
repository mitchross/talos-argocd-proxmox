# C# / .NET: the bake-off storefront API on Postgres, embedding typed searches live.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-dotnet
  labels:
    app: api-dotnet
spec:
  replicas: 1 # always on (sleep/scaledobjects.yaml)
  selector:
    matchLabels:
      app: api-dotnet
  template:
    metadata:
      labels:
        app: api-dotnet
    spec:
      enableServiceLinks: false # Services here would inject *_PORT/POSTGRES_* env over the app's own
      containers:
        - name: api
          image: registry.vanillax.me/product-api/dotnet:14cc92a@sha256:92b969142688c3abdfed7d658c87dab64f851f9428633538300ee018dfb25297
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-bench-db
                  key: password
            - name: DATABASE_URL
              value: postgres://catalog:$(DB_PASSWORD)@postgres:5432/catalog
            - name: DB_POOL_SIZE
              value: "16"
            - name: EMBEDDINGS
              value: live
            - name: TEI_URL
              value: http://tei
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 90
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api-dotnet
  labels:
    app: api-dotnet
spec:
  selector:
    app: api-dotnet
  ports:
    - name: http
      port: 8080
      targetPort: http
