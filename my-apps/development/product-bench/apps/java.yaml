# Java: the bake-off storefront API on Postgres, embedding typed searches live.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-java
  labels:
    app: api-java
spec:
  selector:
    matchLabels:
      app: api-java
  template:
    metadata:
      labels:
        app: api-java
    spec:
      enableServiceLinks: false # Services here would inject *_PORT/POSTGRES_* env over the app's own
      containers:
        - name: api
          image: registry.vanillax.me/product-api/java:14cc92a@sha256:7e66acd351d5c1d702954c45eb72663ce06e5a651b89558db3c0a4a7631510d5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-bench-db
                  key: password
            - name: DATABASE_URL
              value: postgres://catalog:$(DB_PASSWORD)@postgres:5432/catalog
            - name: DB_POOL_SIZE
              value: "16"
            - name: EMBEDDINGS
              value: live
            - name: TEI_URL
              value: http://tei
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 90
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api-java
  labels:
    app: api-java
spec:
  selector:
    app: api-java
  ports:
    - name: http
      port: 8080
      targetPort: http
