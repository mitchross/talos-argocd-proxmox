# Rust: the bake-off storefront API on Postgres, embedding typed searches live.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-rust
  labels:
    app: api-rust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-rust
  template:
    metadata:
      labels:
        app: api-rust
    spec:
      enableServiceLinks: false # Services here would inject *_PORT/POSTGRES_* env over the app's own
      containers:
        - name: api
          image: registry.vanillax.me/product-api/rust:b81829a@sha256:6845269cdf086d8f98840259adb01cf5b6c3829a969eea4182839ef62aa1d2b8
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-bench-db
                  key: password
            - name: DATABASE_URL
              value: postgres://catalog:$(DB_PASSWORD)@postgres:5432/catalog
            - name: DB_POOL_SIZE
              value: "16"
            - name: EMBEDDINGS
              value: live
            - name: TEI_URL
              value: http://tei
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 90
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-rust
  labels:
    app: api-rust
spec:
  selector:
    app: api-rust
  ports:
    - name: http
      port: 8080
      targetPort: http
