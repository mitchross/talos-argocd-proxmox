# Rust: the bake-off storefront API on Postgres, embedding typed searches live.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-rust
  labels:
    app: api-rust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-rust
  template:
    metadata:
      labels:
        app: api-rust
    spec:
      enableServiceLinks: false # Services here would inject *_PORT/POSTGRES_* env over the app's own
      containers:
        - name: api
          image: registry.vanillax.me/product-api/rust:14cc92a@sha256:eab16ff7753e54c8935f79af98e39d036a3de7ea41f58114fe93a1649908c6bd
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-bench-db
                  key: password
            - name: DATABASE_URL
              value: postgres://catalog:$(DB_PASSWORD)@postgres:5432/catalog
            - name: DB_POOL_SIZE
              value: "16"
            - name: EMBEDDINGS
              value: live
            - name: TEI_URL
              value: http://tei
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 90
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-rust
  labels:
    app: api-rust
spec:
  selector:
    app: api-rust
  ports:
    - name: http
      port: 8080
      targetPort: http
