# TypeScript: the bake-off storefront API on Postgres, embedding typed searches live.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-ts
  labels:
    app: api-ts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-ts
  template:
    metadata:
      labels:
        app: api-ts
    spec:
      containers:
        - name: api
          image: registry.vanillax.me/product-api/ts:1b0e0c2@sha256:cd82cd7161eab83d3c5e438442ce0a95e70618cd2bcafa99c0b53c57f1e8e22f
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-bench-db
                  key: password
            - name: DATABASE_URL
              value: postgres://catalog:$(DB_PASSWORD)@postgres:5432/catalog
            - name: DB_POOL_SIZE
              value: "16"
            - name: EMBEDDINGS
              value: live
            - name: TEI_URL
              value: http://tei
            - name: WORKERS
              value: "2"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 90
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api-ts
  labels:
    app: api-ts
spec:
  selector:
    app: api-ts
  ports:
    - name: http
      port: 8080
      targetPort: http
