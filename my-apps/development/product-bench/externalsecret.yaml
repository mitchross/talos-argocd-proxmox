# The catalog database password: add product_bench_db_password to the postgres-secrets item (letters and digits only).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: product-bench-db
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: product-bench-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: postgres-secrets
        property: product_bench_db_password
