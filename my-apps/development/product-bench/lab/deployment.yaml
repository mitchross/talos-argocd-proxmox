# Bench Workbench in cluster mode: REST/GraphQL client, cross-language compare and search against the apps above.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab
  labels:
    app: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab
  template:
    metadata:
      labels:
        app: lab
    spec:
      serviceAccountName: lab # the bake-off runner (lab/rbac.yaml)
      enableServiceLinks: false # Services here would inject *_PORT/POSTGRES_* env over the app's own
      containers:
        - name: lab
          image: registry.vanillax.me/product-api/lab:139bbc0@sha256:4f68b73a7a48817b5ce9a975a7bcae3627f0a9c6bd86d542a71c2577f799a0fc
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: LAB_TARGETS
              value: '{"rust/postgres": "http://api-rust:8080", "go/postgres": "http://api-go:8080", "dotnet/postgres": "http://api-dotnet:8080", "java/postgres": "http://api-java:8080", "ts/postgres": "http://api-ts:8080", "python/postgres": "http://api-python:8080", "bun/postgres": "http://api-bun:8080", "deno/postgres": "http://api-deno:8080", "express/postgres": "http://api-express:8080", "nest/postgres": "http://api-nest:8080"}'
            - name: LAB_RUNNER
              value: kubernetes
            - name: LAB_IMAGES # contenders run exactly the images deployed above
              value: '{"bun": "registry.vanillax.me/product-api/bun:14cc92a@sha256:f052162112a9f095f890352f4190a2b7f07f70370465a910159dcda54cb39827", "deno": "registry.vanillax.me/product-api/deno:14cc92a@sha256:bb4c5dc0c4f8a4320aa56c09aeef9d9a6046e13471f3c783f2e99ffd6abf8b25", "dotnet": "registry.vanillax.me/product-api/dotnet:14cc92a@sha256:92b969142688c3abdfed7d658c87dab64f851f9428633538300ee018dfb25297", "express": "registry.vanillax.me/product-api/express:14cc92a@sha256:a38412c8d130785af5da7e77100c9c8421ac24b32a81bf7e93250e6d13403faf", "go": "registry.vanillax.me/product-api/go:14cc92a@sha256:0565441223e6d8b7d471b0c28ca2d526e0c5c6b99475fe46b4a9053d3424c625", "java": "registry.vanillax.me/product-api/java:14cc92a@sha256:7e66acd351d5c1d702954c45eb72663ce06e5a651b89558db3c0a4a7631510d5", "nest": "registry.vanillax.me/product-api/nest:14cc92a@sha256:ef8f50fa18675a8a79e7b5c05398aa1e546fc10a9b3f11c517d1bbe87c453e0b", "python": "registry.vanillax.me/product-api/python:14cc92a@sha256:a762e3931e33aa849135830d19a1d61417c3f8007d9dc8130df6083d3d96cf00", "rust": "registry.vanillax.me/product-api/rust:14cc92a@sha256:eab16ff7753e54c8935f79af98e39d036a3de7ea41f58114fe93a1649908c6bd", "ts": "registry.vanillax.me/product-api/ts:14cc92a@sha256:76de4cdb2df7e091b50bfa15b14052087263a5b409bfe280e3ee9dcf9f68f3df"}'
            - name: LAB_K6_IMAGE
              value: registry.vanillax.me/product-api/k6:14cc92a@sha256:0f2ea1d144989d1fc4332ad9dca9d58439f338f6a15df0192e8dc92a0cb626be
            - name: LAB_RUNS_DIR
              value: /runs
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LAB_EXTERNAL_AUTH # visitors through Cloudflare need the password; none set = turned away
              value: required
            - name: LAB_PASSWORD_FILE # re-read every 30 s: a password added or changed later works without a restart
              value: /secrets/lab/password
            - name: LAB_SERVICES
              value: '{"postgres": "postgres:5432", "tei": "http://tei/health"}'
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: runs
              mountPath: /runs
            - name: lab-password
              mountPath: /secrets/lab
              readOnly: true
      volumes:
        - name: lab-password # optional: the lab runs (at home) before the 1Password field exists
          secret:
            secretName: product-bench-lab
            optional: true
        - name: runs # run history; lost on restart, which is fine for now
          emptyDir:
            sizeLimit: 256Mi
