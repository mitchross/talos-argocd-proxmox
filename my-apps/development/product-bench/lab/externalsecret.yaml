# The workbench password for visitors from outside the home network: add product_bench_lab_password to the
# postgres-secrets item. Until it exists the lab still runs at home, and outside visitors are turned away.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: product-bench-lab
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: product-bench-lab
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: postgres-secrets
        property: product_bench_lab_password
