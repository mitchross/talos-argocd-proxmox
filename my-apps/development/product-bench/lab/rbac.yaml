# The workbench's bake-off runner: fresh contender Deployments and k6 Jobs, in this namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-runner
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-runner
subjects:
  - kind: ServiceAccount
    name: lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lab-runner
