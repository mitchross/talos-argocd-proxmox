apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels:
    app: postgres
    backup-exempt: "true"
  annotations:
    storage.vanillax.dev/backup-exempt-reason: "Benchmark catalog restored from a pg_dump of the product-api-experiments desktop database; reloadable any time"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 40Gi
  storageClassName: longhorn-flash
