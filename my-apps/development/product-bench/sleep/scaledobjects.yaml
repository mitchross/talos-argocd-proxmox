# Sleep when idle: the embedder and eight of the apps run only while someone uses the bench. Always on: the lab,
# Postgres, Rust (the reference every answer is checked against) and .NET, so the workbench answers at once.
# The lab reports bench_lab_wanted = 1 for 30 minutes after any real use (page loads, requests, bake-offs; not
# probes or the workbench's background polling) and while a bake-off runs. KEDA scales each backend below 0 <-> 1
# on it; waking takes about a minute (the workbench says so, and a bake-off waits). These Deployments set no
# replicas field, so ArgoCD leaves the count to KEDA. To move an app between always-on and sleeping, add or remove
# its ScaledObject here and remove or add replicas: 1 in its Deployment.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: tei
spec:
  scaleTargetRef:
    name: tei
  minReplicaCount: 0
  maxReplicaCount: 1
  pollingInterval: 15
  cooldownPeriod: 120 # the lab already waits 30 idle minutes before reporting 0
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.prometheus-stack.svc:9090
        query: max(bench_lab_wanted{namespace="product-bench"}) or vector(0)
        threshold: "1"
        activationThreshold: "0.5"
---
