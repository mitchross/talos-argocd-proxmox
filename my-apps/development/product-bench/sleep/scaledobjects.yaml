# Sleep when idle: Postgres, the embedder and the apps run only while someone uses the bench.
# The lab (always on, ~0.2 GB) reports bench_lab_wanted = 1 for 30 minutes after any real use (page loads,
# requests, bake-offs; not probes or the workbench's background polling) and while a bake-off runs. KEDA
# scales each backend 0 <-> 1 on it; waking takes a minute or two (the workbench says so). Postgres keeps its
# data on its PVC. The Deployments set no replicas field, so ArgoCD leaves the count to KEDA.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: postgres
spec:
  scaleTargetRef:
    name: postgres
  minReplicaCount: 0
  maxReplicaCount: 1
  pollingInterval: 15
  cooldownPeriod: 120 # the lab already waits 30 idle minutes before reporting 0
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.prometheus-stack.svc:9090
        query: max(bench_lab_wanted{namespace="product-bench"}) or vector(0)
        threshold: "1"
        activationThreshold: "0.5"
---
