# Serves the PMTiles archive the basemap-bootstrap Job writes to the PVC (data split from image so the bbox can change without a rebuild).
# The init container blocks start until the file exists so a fresh deploy never serves "Archive not found" 204s.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: basemap
  namespace: radar-ng
  labels:
    app: basemap
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO PVC; only one writer at a time
  selector:
    matchLabels:
      app: basemap
  template:
    metadata:
      labels:
        app: basemap
    spec:
      # fsGroup so the non-root container can read the file the Job wrote
      # (the Job uses the same uid/gid).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Block pod start until the bootstrap Job has populated the PVC.
        - name: wait-for-pmtiles
          image: busybox:1.38
          command:
            - sh
            - -c
            - |
              echo "waiting for /data/basemap.pmtiles..."
              until [ -s /data/basemap.pmtiles ]; do
                sleep 5
              done
              echo "found $(ls -lh /data/basemap.pmtiles)"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: pmtiles
              mountPath: /data
              readOnly: true
      containers:
        - name: basemap
          # Image still bakes a Michigan-only extract at /data/basemap.pmtiles; the PVC mount shadows it, only PVC contents serve.
          image: ghcr.io/mitchross/radar-ng-basemap:v1.1.5
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8081
              name: http
          volumeMounts:
            - name: pmtiles
              mountPath: /data
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: pmtiles
          persistentVolumeClaim:
            claimName: pmtiles
