# Self-hosted Open-Meteo API. Backed by model data synced into the PVC by
# the open-meteo-sync-gfs and open-meteo-sync-hrrr CronJobs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-meteo
  namespace: radar-ng
  labels:
    app: open-meteo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-meteo
  template:
    metadata:
      labels:
        app: open-meteo
    spec:
      # Keep UID 999 (the image's "openmeteo" user) so PVC writes match the files the sync worker writes.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: open-meteo
          # Pin tag@digest of a verified build: 1.5.3 shipped without libparquet-glib.so.2400 and a bare tag re-pulls broken rebuilds.
          image: ghcr.io/open-meteo/open-meteo:1.5.5@sha256:99978696b7def9d4851d2b9e85ea7a8ba08bd824f6fa6779edd733a164434694
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          args: ["serve", "--bind", "0.0.0.0:8080"]
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: openmeteo-data
              mountPath: /app/data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
        # Sidecar, not a standalone WorkerDeployment: it must share this RWO volume with the serve container (same pod).
        # Runs non-versioned (no TEMPORAL_DEPLOYMENT_NAME/BUILD_ID env).
        - name: sync-worker
          # Base image must match the serve container's (1.5.3 base lacks libparquet-glib.so.2400 -> HRRR sync rc=127).
          image: ghcr.io/mitchross/radar-ng-open-meteo-worker:v1.1.7
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: default
            - name: TEMPORAL_TASK_QUEUE
              value: radar-ng-open-meteo
            - name: OPENMETEO_BIN
              value: /app/openmeteo-api
            - name: OPENMETEO_DATA_DIR
              value: /app/data
          volumeMounts:
            - name: openmeteo-data
              mountPath: /app/data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: openmeteo-data
          persistentVolumeClaim:
            claimName: openmeteo-data
