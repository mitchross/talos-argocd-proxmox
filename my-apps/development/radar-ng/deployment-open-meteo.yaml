# Self-hosted Open-Meteo API backed by model data synced into the PVC by its Temporal worker sidecar.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-meteo
  namespace: radar-ng
  labels:
    app: open-meteo
spec:
  progressDeadlineSeconds: 900
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-meteo
  template:
    metadata:
      labels:
        app: open-meteo
    spec:
      terminationGracePeriodSeconds: 40
      # Keep UID 999 (the image's "openmeteo" user) so PVC writes match the files the sync worker writes.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: open-meteo
          # Both containers use one verified artifact so the sync format matches the served binary.
          image: ghcr.io/mitchross/radar-ng-open-meteo-worker:v1.1.9@sha256:0387cac5a2c691a67680e7d696b687fb91f135b3b6c7a733e7c3d0c1bab422f9
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["/app/openmeteo-api"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          args: ["serve", "--bind", "0.0.0.0:8080"]
          ports:
            - containerPort: 8080
              name: http
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: openmeteo-data
              mountPath: /app/data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
        # Sidecar, not a standalone WorkerDeployment: it must share this RWO volume with the serve container (same pod).
        # Runs non-versioned (no TEMPORAL_DEPLOYMENT_NAME/BUILD_ID env).
        - name: sync-worker
          image: ghcr.io/mitchross/radar-ng-open-meteo-worker:v1.1.9@sha256:0387cac5a2c691a67680e7d696b687fb91f135b3b6c7a733e7c3d0c1bab422f9
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: default
            - name: TEMPORAL_TASK_QUEUE
              value: radar-ng-open-meteo
            - name: OPENMETEO_BIN
              value: /app/openmeteo-api
            - name: OPENMETEO_DATA_DIR
              value: /app/data
          volumeMounts:
            - name: openmeteo-data
              mountPath: /app/data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: openmeteo-data
          persistentVolumeClaim:
            claimName: openmeteo-data
