# Caddy + FastAPI: /tiles/* from the PVC, /basemap/* proxied to basemap, /api/* FastAPI.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tile-server
  namespace: radar-ng
  labels:
    app: tile-server
spec:
  # Replicas are managed by the HPA, currently pinned to one because the API
  # mounts Longhorn RWO publication volumes.
  replicas: 1
  # RWO Longhorn volumes — Recreate, or the replacement pod deadlocks on Multi-Attach.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tile-server
  template:
    metadata:
      labels:
        app: tile-server
      annotations:
        # Bump to force a ReplicaSet roll when only env changes — a stale field-manager can mask env diffs under SSA.
        config-rev: "2026-09-02-alerts-queue"
    spec:
      priorityClassName: app-critical
      affinity:
        # longhorn-flash (tiles/grids/state) sets diskSelector "flash"; only this node carries that disk.
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: gpu-worker
                    operator: In
                    values: ["true"]
      # ScheduleAnyway so the pod still schedules when only one node matches.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: tile-server
      # Satisfies the namespace's PodSecurity "restricted" profile; the image runs as UID 1000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # fsGroup so this non-root pod can read the group-owned files the worker writes on the RWO volumes.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tile-server
          # v1.1.6/v1.1.7 crashloop: caddy binary carried a file capability
          # that exec-fails under drop-ALL. Fixed in v1.1.8 (radar-ng 144dcb9).
          image: ghcr.io/mitchross/radar-ng-tile-server:v1.1.20@sha256:bb7ceb4b93ffbee453a1e59aa069fa8bd006fa087a0536818ca852444d3ace58
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: TILE_DIR
              value: /data/tiles
            - name: GRID_DIR
              value: /data/grids
            - name: STATE_DIR
              value: /data/state
            - name: OPEN_METEO_BASE
              value: http://open-meteo:8080/v1/forecast
            - name: MRMS_MAX_AGE_S
              value: "600"
            # 5 min: polite to Open-Meteo upstream, short enough that pull-to-refresh shows new data.
            - name: FORECAST_TTL_S
              value: "300"
            - name: FORECAST_CACHE_MAX_ENTRIES
              value: "512"
            - name: WIND_CACHE_MAX_ENTRIES
              value: "48"
            - name: API_RATE_LIMIT_RPS
              value: "20"
            - name: API_RATE_LIMIT_BURST
              value: "60"
            # /api/alerts and /api/geocode fetch upstream data server-side so the app only ever talks to this cluster.
            - name: NWS_USER_AGENT
              value: "(radar-ng, mitch@vanillax.me)"
            - name: PHOTON_URL
              value: http://photon.photon.svc.cluster.local:2322
            # Push/watch routes stay closed until the mobile identity provider
            # can issue the per-user HMAC session tokens the API now requires.
            - name: DISABLE_WORKFLOW_ROUTES
              value: "1"
            # Temporal client — used by /v1/push-tokens, /v1/watches, /v1/workflows.
            # See backend/api/api/routes_workflows.py in the radar-ng repo.
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: default
            - name: TEMPORAL_ALERTS_TASK_QUEUE
              value: radar-ng-alerts
          # Probe /api/livez through Caddy so a dead backgrounded uvicorn restarts the pod.
          # Do NOT probe /api/health: it degrades on stale NOAA data fleet-wide and would restart every replica.
          livenessProbe:
            httpGet:
              path: /api/livez
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/livez
              port: 8080
            periodSeconds: 10
          volumeMounts:
            - name: tiles
              mountPath: /data/tiles
              readOnly: true
            - name: grids
              mountPath: /data/grids
              readOnly: true
            - name: state
              mountPath: /data/state
              readOnly: true
          resources:
            requests:
              cpu: 250m
              # Burst path OOMKilled at a 1Gi limit; keep request >=512Mi with the 2Gi limit.
              memory: 512Mi
            limits:
              # Caddy (tiles) and uvicorn (API) share this container. A 2026-09-26
              # load test (200 users, 1,100 req/s) pinned it at 1 core and
              # throttled every period, pushing /api/manifest.json p95 to 537 ms.
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: tiles
          persistentVolumeClaim:
            claimName: tiles
        - name: grids
          persistentVolumeClaim:
            claimName: grids
        - name: state
          persistentVolumeClaim:
            claimName: state
