# DO NOT pin a build date: build.protomaps.com keeps ~6 days and has no `latest`; the image resolves the newest build at run time.
# The ~35-min extract only runs when BBOX/REFRESH differ from the marker on the PVC; otherwise it exits in seconds.
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    # Must be a hook: as a plain resource, TTL GC + selfHeal re-ran the ~35-min CONUS download every day.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: basemap-bootstrap
  namespace: radar-ng
  labels:
    app: basemap
    bbox: "conus"
spec:
  # Hygiene under hook semantics — as a plain resource this TTL was the daily selfHeal re-run trigger.
  ttlSecondsAfterFinished: 86400
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: basemap
        job: basemap-bootstrap
    spec:
      restartPolicy: OnFailure
      # The running basemap Deployment mounts this same Longhorn RWO PVC.
      # Keep the hook on that pod's node or a second worker cannot attach it.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: basemap
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000  # so the non-root container can write to the PVC
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: extract
          # Bump basemap-bootstrap-image/VERSION + this tag together; no :latest (a missing push must fail ImagePullBackOff, not run the old script).
          image: ghcr.io/mitchross/basemap-bootstrap:v1.0.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            # extract bbox: minLon,minLat,maxLon,maxLat (CONUS)
            - name: BBOX
              value: "-125,24,-66,50"
            # Marker key alongside BBOX. Bump to force a re-extract (pull a
            # fresher planet) without changing the bbox.
            - name: REFRESH
              value: "1"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: pmtiles
              mountPath: /data
      volumes:
        - name: pmtiles
          persistentVolumeClaim:
            claimName: pmtiles
