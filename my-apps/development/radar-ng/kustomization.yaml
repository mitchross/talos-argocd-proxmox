apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - vpa.yaml
  - namespace.yaml
  - priorityclass.yaml
  - pvcs.yaml
  - services.yaml
  - httproute.yaml
  - deployment-tile-server.yaml
  - hpa-tile-server.yaml
  - pdb-tile-server.yaml
  - deployment-basemap.yaml
  - deployment-open-meteo.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
  # The open-meteo sync worker is NOT here — it's a sidecar in deployment-open-meteo.yaml (shares that RWO volume).
  # Schedules are seeded once via `python -m temporal.schedules.seed` after rollout.
  - temporal-workers/configmap-temporal-config.yaml
  - temporal-workers/temporal-connection.yaml
  - temporal-workers/worker-pools.yaml
  - temporal-workers/podmonitor.yaml

namespace: radar-ng

configMapGenerator:
  - name: radar-ng-scripts
    files:
      - scripts/fetch-basemap.sh

patches:
  - path: temporal-workers/release-env-patch.yaml
    target:
      group: temporal.io
      kind: WorkerDeployment
