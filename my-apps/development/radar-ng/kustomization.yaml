apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - vpa.yaml
  - namespace.yaml
  - pvcs.yaml
  - services.yaml
  - httproute.yaml
  - deployment-tile-server.yaml
  - hpa-tile-server.yaml
  - pdb-tile-server.yaml
  - deployment-basemap.yaml
  # Sync hook; the basemap Deployment's init container waits for its output, so order doesn't matter.
  - job-basemap-bootstrap.yaml
  - deployment-open-meteo.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
  # The open-meteo sync worker is NOT here — it's a sidecar in deployment-open-meteo.yaml (controller strips podAffinity; RWO volume).
  # Schedules are seeded once via `python -m temporal.schedules.seed` after rollout.
  - temporal-workers/configmap-temporal-config.yaml
  - temporal-workers/temporal-connection.yaml
  - temporal-workers/temporal-worker-deployment.yaml

namespace: radar-ng

configMapGenerator:
  - name: radar-ng-scripts
    files:
      - scripts/wait-for-basemap.sh
