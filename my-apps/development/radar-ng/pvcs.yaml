# tiles/grids/state: small-block random IO — keep on longhorn-flash RWO, not HDD NFS (thrashed at ~100 IOPS).
# RWO shared by several pods only works while they co-locate on one node (worker podAffinity → tile-server); keep that or use real RWX.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tiles
  namespace: radar-ng
  labels:
    backup-exempt: "true"
  annotations:
    storage.vanillax.dev/backup-exempt-reason: "PNG/MVT tiles generated from grids/; rebuildable by re-running tile generation"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-flash
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grids
  namespace: radar-ng
  labels:
    backup-exempt: "true"
  annotations:
    storage.vanillax.dev/backup-exempt-reason: "MRMS NetCDF grids; re-fetchable from upstream MRMS within retention window"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-flash
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: state
  namespace: radar-ng
  labels:
    backup-exempt: "true"
  annotations:
    storage.vanillax.dev/backup-exempt-reason: "Transient ingestion state (last-seen timestamps, partial frames); regenerates on next pull"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-flash
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openmeteo-data
  namespace: radar-ng
  labels:
    backup-exempt: "true"
  annotations:
    storage.vanillax.dev/backup-exempt-reason: "Open-Meteo numerical weather data cache; re-fetchable from open-meteo.com API"
spec:
  # Must be Longhorn RWO (ext4): Open-Meteo's .om writer fails with errno 95 on NFS (truenas-nfs and Longhorn RWX alike).
  # RWO = single-node attach, so the sync worker runs as a sidecar in the serve pod.
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pmtiles
  namespace: radar-ng
  labels:
    backup-exempt: "true"
  annotations:
    storage.vanillax.dev/backup-exempt-reason: "Protomaps basemap extract; rebuildable by re-running basemap-bootstrap Job from a build.protomaps.com daily build"
spec:
  # longhorn-flash RWO: pmtiles mmap random reads thrash on HDD-over-NFS.
  # basemap (reader) + basemap-bootstrap Job (writer) share this RWO volume — they must co-locate on one node (podAffinity).
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-flash
  resources:
    requests:
      storage: 50Gi
