# Scraped with no selector match because kube-prometheus-stack runs serviceMonitorSelectorNilUsesHelmValues: false.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tile-server
  namespace: radar-ng
  labels:
    app: tile-server
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: tile-server
  namespaceSelector:
    matchNames:
      - radar-ng
  endpoints:
    - port: http
      interval: 30s
      path: /api/metrics
      scrapeTimeout: 10s
