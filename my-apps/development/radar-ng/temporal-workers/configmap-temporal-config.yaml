# Non-secret worker tunables, envFrom'd into the worker container (bump CONFIG_REV in the WorkerDeployment to roll).
apiVersion: v1
kind: ConfigMap
metadata:
  name: radar-ng-temporal-config
  namespace: radar-ng
  labels:
    app: radar-ng-worker
data:
  # Drop the missing colorblind palette (no backend/shared/palettes/colorblind.json
  # exists). The muted palette already advertises colorblind-safety.
  PALETTES: "classic,muted,vivid"
  # A frame renders in ~25-40 s; keep 1 so a run stays well inside the 2-min SKIP cadence (backlog >1 stretches the run, not freshness).
  BACKLOG_PER_CYCLE: "1"
  # One process per palette (3 palettes); the 12-CPU limit has the headroom.
  MRMS_RENDER_WORKERS: "3"
  MRMS_PREFIX: "CONUS/MergedBaseReflectivityQC_00.50"
  FORECAST_HOURS: "18"
  EXTENDED_FORECAST_HOURS: "48"
  # Radar is the priority product. Secondary HRRR weather layers stay behind
  # this capacity flag; Open-Meteo serves their point forecasts meanwhile.
  HRRR_ENABLED_LAYERS: "radar-hrrr"
  # nowcast
  NOWCAST_HORIZON_MIN: "60"
  NOWCAST_STEP_MIN: "5"
  NOWCAST_INPUT_FRAMES: "4"
  NOWCAST_GRID_INPUT_LAYER: "radar-nowcast-input"
  NOWCAST_SCIENCE_GRID_MAX_CELLS: "7000000"
  NOWCAST_MAX_INPUT_GAP_MIN: "6"
  # Never present a fading stationary copy as forecast motion.
  NOWCAST_ALLOW_PERSISTENCE_FALLBACK: "0"
  # storm-watch + alerts
  WATCH_RADIUS_KM: "20"
  INTENSIFY_DBZ_DELTA: "10"
  DISSIPATE_DBZ_DELTA: "10"
  HAIL_DBZ_THRESHOLD: "60"
  NWS_ALERTS_URL: "https://api.weather.gov/alerts/active?status=actual"
  NWS_USER_AGENT: "(radar-ng, mitch@vanillax.me)"
  TROPICAL_FEED_URL: "https://www.nhc.noaa.gov/CurrentStorms.json"
  # lightning
  LIGHTNING_RETENTION_MIN: "15"
  LIGHTNING_FLUSH_S: "2.0"
