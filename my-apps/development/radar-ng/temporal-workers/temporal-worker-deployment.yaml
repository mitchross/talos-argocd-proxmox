# Must be `kind: WorkerDeployment`: the controller's deprecated `Temporal*` handlers no-op, so image bumps never roll.
# Controller injects TEMPORAL_ADDRESS/NAMESPACE/DEPLOYMENT_NAME/WORKER_BUILD_ID — do not set them via env.
apiVersion: temporal.io/v1alpha1
kind: WorkerDeployment
metadata:
  name: radar-ng-worker
  namespace: radar-ng
  labels:
    app: radar-ng-worker
    radar-ng.vanillax.dev/worker: "true"
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  workerOptions:
    connectionRef:
      name: cluster-temporal
    temporalNamespace: default
  rollout:
    # Single replica pinned to the RWO node: Progressive would run old+new pods there for 7 min for no traffic-split benefit.
    strategy: AllAtOnce
  sunset:
    scaledownDelay: 10m
    deleteDelay: 1h
  template:
    metadata:
      labels:
        app: radar-ng-worker
        radar-ng.vanillax.dev/worker: "true"
    spec:
      # Shares RWO tiles/grids/state with tile-server — must land on the same node or Longhorn Multi-Attach fails.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: tile-server
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # fsGroup REQUIRED: fresh Longhorn block volumes mount root:root; uid 1000 cannot write without it.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/mitchross/radar-ng-temporal-worker:v1.1.25
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports:
            - { containerPort: 9464, name: metrics, protocol: TCP }
          env:
            # No OTEL endpoint on purpose — set, the worker spams UNAVAILABLE gRPC retries; unset = no-op tracer.
            # CONFIG_REV is a no-op; bump it to roll pods on ConfigMap changes (pod annotations aren't in the controller's hash).
            - name: CONFIG_REV
              value: "2026-09-02-render-workers-3"
            - name: TILE_DIR
              value: /data/tiles
            - name: STATE_DIR
              value: /data/state
            - name: GRID_DIR
              value: /data/grids
            # Re-enable with PUSH_DISABLED=0 AND the push-keys secret mount (see git history of this file).
            - name: PUSH_DISABLED
              value: "1"
            # Stays on the legacy queue until the isolated worker pools are rolled out in the documented order.
            - name: WORKER_ROLE
              value: legacy
            - name: USE_ISOLATED_TASK_QUEUES
              value: "0"
          envFrom:
            - configMapRef: { name: radar-ng-temporal-config }
          # The worker touches this file only while Temporal check_health succeeds; a 4-h poll blackout once left a Ready pod doing nothing.
          livenessProbe:
            exec:
              command: [sh, -c, "test $(find /tmp/temporal-healthy -mmin -3)"]
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - { name: tiles,  mountPath: /data/tiles }
            - { name: grids,  mountPath: /data/grids }
            - { name: state,  mountPath: /data/state }
          resources:
            # CPU-bound (pysteps nowcast + MRMS render) — a tight CPU limit makes nowcast_run time out.
            # Requests track real steady use (~3 CPU / 5-8 Gi); OOMKilled at 12Gi when nowcast+HRRR+airquality overlapped.
            requests: { cpu: "2", memory: "6Gi" }
            limits:   { cpu: "12", memory: "16Gi" }
      volumes:
        - name: tiles
          persistentVolumeClaim: { claimName: tiles }
        - name: grids
          persistentVolumeClaim: { claimName: grids }
        - name: state
          persistentVolumeClaim: { claimName: state }
