metadata:
  name: radar-ng-worker-alerts
  namespace: radar-ng
  labels:
    app: radar-ng-worker-alerts
    radar-ng.vanillax.dev/worker: "true"
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  workerOptions:
    connectionRef:
      name: cluster-temporal
    temporalNamespace: default
  rollout:
    strategy: AllAtOnce
  sunset:
    scaledownDelay: 10m
    deleteDelay: 1h
  template:
    metadata:
      labels:
        app: radar-ng-worker-alerts
        radar-ng.vanillax.dev/worker: "true"
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: tile-server
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # fsGroup REQUIRED: fresh Longhorn block volumes mount root:root; uid 1000 cannot write without it.
