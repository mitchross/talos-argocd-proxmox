apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radar-temporal-web
  namespace: radar-temporal
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal-technitium
      namespace: gateway
  hostnames:
    - "radar-temporal.vanillax.me"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: radar-temporal-web
          port: 8080
          weight: 1
