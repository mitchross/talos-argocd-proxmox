apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-secrets
  namespace: renovate
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: renovate-secrets
    creationPolicy: Owner
  data:
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: renovate
        property: github_token
        # Webhook injects this default; the my-apps AppSet ignoreDifferences omits nullBytePolicy, so leaving it out = OutOfSync.
        nullBytePolicy: Ignore
    # Docker Hub PAT: the anonymous 100/6h/IP limit is shared with kubelet pulls and aborts runs with 429s.
    # 1Password item `renovate-dockerhub`, field `host_rules` = [{"matchHost":"index.docker.io","username":"<dh-user>","password":"<dh-pat>"}]
    - secretKey: RENOVATE_HOST_RULES
      remoteRef:
        key: renovate-dockerhub
        property: host_rules
        nullBytePolicy: Ignore
