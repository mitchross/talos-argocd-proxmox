# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
# temporal-postgres-data backup STUB — uniform fields (repository, copyMethod,
# populator) injected by ../../common/kopiur-backup. The mover securityContext
# is per-PVC and stays in THIS stub (docs/domains/storage/kopiur-mover-permissions.md).
# HOURLY tier: database — caps data loss at ~1h. The before-hook
# CHECKPOINTs Postgres so the CSI capture starts from a flushed state.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: temporal-postgres-data
  namespace: temporal
  annotations:
    # Wave -3: the Restore populator must exist before the wave -2 PVC
    # tries to bind (waves block; see postgres/deployment.yaml).
    argocd.argoproj.io/sync-wave: "-3"
spec:
  sources:
    - pvc:
        name: temporal-postgres-data
  identity:
    username: temporal-postgres-data
    hostname: temporal
  hooks:
    beforeSnapshot:
      - workloadExec:
          podSelector:
            matchLabels:
              app: temporal-postgres
          container: postgres
          command: ["/bin/sh", "-c", "exec psql -v ON_ERROR_STOP=1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -c \"CHECKPOINT\""]
          timeout: 2m
  retention:
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  mover:
    securityContext:
      runAsUser: 999 # postgres uid:gid in the official image
      runAsGroup: 999
      runAsNonRoot: true
    podSecurityContext:
      fsGroup: 999
      supplementalGroups:
        - 999
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: temporal-postgres-data-hourly
  namespace: temporal
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  policyRef:
    name: temporal-postgres-data
  schedule:
    # :6 hourly — distinct minute vs ALL schedules including the 3 AM daily
    # tier (hourly :MM collides with daily 03:MM).
    cron: "6 * * * *"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: temporal-postgres-data-restore
  namespace: temporal
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  source:
    fromPolicy:
      name: temporal-postgres-data
      offset: 0
  mover:
    securityContext:
      runAsUser: 999
      runAsGroup: 999
      runAsNonRoot: true
    podSecurityContext:
      fsGroup: 999
      supplementalGroups:
        - 999
