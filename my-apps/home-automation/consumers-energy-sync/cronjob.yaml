apiVersion: batch/v1
kind: CronJob
metadata:
  name: consumers-energy-sync
  namespace: consumers-energy-sync
spec:
  # CE posts the previous day late morning; a 06:17 run got stale data. 13:17 has margin.
  schedule: "17 13 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # Old failed Jobs otherwise keep KubeJobFailed firing long after a later run succeeds.
      ttlSecondsAfterFinished: 172800
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          # pwuser in the Playwright image; fsGroup makes the PVC writable for it.
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: ghcr.io/mitchross/consumers-energy-sync:v0.1.5@sha256:9cfa465ba236d79c99edbf83b53726926ebaa60947e3f33fc3fb51266f838fce
              envFrom:
                - secretRef:
                    name: consumers-energy-sync
              env:
                - name: HASS_URL
                  value: http://home-assistant.home-assistant.svc.cluster.local:8123
                - name: ENERGY_CSV_DIR
                  value: /data
                - name: TIMEZONE
                  value: America/Detroit
                - name: HOME
                  value: /tmp
                # Bill charges the CE export omits: per-kWh riders minus Distribution, plus tax.
                - name: CE_COST_ADDER_PER_KWH
                  value: "0.028957"
                - name: CE_SALES_TAX_PCT
                  value: "4"
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: consumers-energy-sync-data
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
