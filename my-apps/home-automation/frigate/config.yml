version: "0.18-0"
mqtt:
  host: mosquitto.frigate
  port: 1883
  topic_prefix: frigate
  user: "{FRIGATE_MQTT_USER}"
  password: "{FRIGATE_MQTT_PASSWORD}"
database:
  path: /config/frigate.db
ui:
  timezone: America/New_York
timestamp_style:
  position: "tr"
  format: "%m/%d/%Y %H:%M:%S"
  color:
    red: 255
    green: 255
    blue: 255
snapshots:
  enabled: true
  timestamp: true
  bounding_box: true
  retain:
    default: 14
motion:
  threshold: 45
  contour_area: 20
record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 0
  alerts:
    # Frigate holds at most 6 ten-second segments in its cache, about 60s
    # including the one being written. A pre_capture near 60s overflows it, and
    # Frigate drops segments ("Unable to keep up"). 30s stays well inside.
    pre_capture: 30
    post_capture: 180
    retain:
      days: 10
      # Keep quiet footage inside the pre/post window too.
      mode: all
  detections:
    pre_capture: 30
    post_capture: 180
    retain:
      days: 10
      mode: all
# Object detection is now disabled by default in 0.16.0+
detect:
  enabled: true
detectors:
  ov:
    type: openvino
    device: NPU
# The NPU needs a static-shape model; this is the bundled SSDLite IR. Model config is top-level only.
model:
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt
ffmpeg:
  input_args: preset-rtsp-generic
  hwaccel_args: preset-vaapi
  # Nest streams carry Opus audio; MP4 recordings need AAC. This preset
  # transcodes audio to AAC for the record role (without it, recordings are
  # silent or fail to mux the Opus track).
  output_args:
    record: preset-record-generic-audio-aac
# go2rtc with Nest cameras via direct SDM API
go2rtc:
  ffmpeg:
    # FFmpeg 8 refuses go2rtc's VAAPI hwupload without an explicit device; the Dell has one GPU.
    global: "-hide_banner -vaapi_device /dev/dri/renderD128"
    # Preserve startup reference frames while Nest codec parameters arrive.
    nest-buffered: "-threads 2 -analyzeduration 20000000 -probesize 20000000 -timeout 60000000 -rtsp_transport tcp -i {input}"
    # At 5 FPS, the default GOP of 50 makes new consumers wait up to ten seconds.
    h264: "-c:v libx264 -threads 2 -g 5 -keyint_min 5 -sc_threshold 0 -preset:v superfast -tune:v zerolatency -pix_fmt:v yuv420p"
    # #hardware=vaapi swaps the libx264 template above for this one; keep the GOP in step.
    h264/vaapi: "-c:v h264_vaapi -g 5 -bf 0 -profile:v high -level:v 4.1 -sei:v 0"
  streams:
    shed:
    - "rtsp://wyze-bridge.wyze-bridge.svc.cluster.local:8554/shed"
    # Each raw Nest WebRTC stream feeds a buffered H264 iGPU re-encode for live/detect/record.
    backyard-nest:
    - "nest:?client_id={FRIGATE_NEST_CLIENT_ID}&client_secret={FRIGATE_NEST_CLIENT_SECRET}&refresh_token={FRIGATE_NEST_REFRESH_TOKEN}&project_id={FRIGATE_NEST_PROJECT_ID}&device_id=AVPHwEu-b9WJaOye6XlAOJsVuG4cdrmJC3WIVTtENALQQfkYJSpLEQj4va9k1c1YHqDcgAWUdfaIgvBMIy3--kQBCmq_dDI&protocols=WEB_RTC&video=h264&audio=opus"
    backyard-sub:
    # CPU, not iGPU: backyard's Nest feed switches between 1080p and 360p, and the iGPU re-encode dies on every switch.
    - "ffmpeg:backyard-nest#video=h264#width=1280#height=720#raw=-fpsmax 5#input=nest-buffered"
    garage-inside-nest:
    - "nest:?client_id={FRIGATE_NEST_CLIENT_ID}&client_secret={FRIGATE_NEST_CLIENT_SECRET}&refresh_token={FRIGATE_NEST_REFRESH_TOKEN}&project_id={FRIGATE_NEST_PROJECT_ID}&device_id=AVPHwEuwG9L_DWqqKXGMkSsZWGLHxyieW9NJBmZCARSyBqtpOt2BxS8Un3SYTfuClz3pCd1BS32T-sTRnsRwR3M_ddddZ6s&protocols=WEB_RTC&video=h264&audio=opus"
    garage-inside-sub:
    - "ffmpeg:garage-inside-nest#video=h264#width=1280#height=720#raw=-fpsmax 5#input=nest-buffered#hardware=vaapi"
    garage-outside-nest:
    - "nest:?client_id={FRIGATE_NEST_CLIENT_ID}&client_secret={FRIGATE_NEST_CLIENT_SECRET}&refresh_token={FRIGATE_NEST_REFRESH_TOKEN}&project_id={FRIGATE_NEST_PROJECT_ID}&device_id=AVPHwEv2h0W3viecoGaYuzNnJYw5JpuFl22mo6_2OxWG7xIs8fTPCL0uwgrIOU8WEm7IiTIOQ_cgyzkh18OaR6nBzlTUWQ0&protocols=WEB_RTC&video=h264&audio=opus"
    garage-outside-sub:
    - "ffmpeg:garage-outside-nest#video=h264#width=1280#height=720#raw=-fpsmax 5#input=nest-buffered#hardware=vaapi"
    living-room-nest:
    - "nest:?client_id={FRIGATE_NEST_CLIENT_ID}&client_secret={FRIGATE_NEST_CLIENT_SECRET}&refresh_token={FRIGATE_NEST_REFRESH_TOKEN}&project_id={FRIGATE_NEST_PROJECT_ID}&device_id=AVPHwEvWU1Xm4--F8EQvLgj32449ix_pnGNv82a1xR6gJoWCsdxUyyWk1b3C9Aox-hLzJtQ2rp85L1F_BAw1HYaMgaLIa5U&protocols=WEB_RTC&video=h264&audio=opus"
    living-room-sub:
    - "ffmpeg:living-room-nest#video=h264#width=1280#height=720#raw=-fpsmax 5#input=nest-buffered#hardware=vaapi"
    kitchen-nest:
    - "nest:?client_id={FRIGATE_NEST_CLIENT_ID}&client_secret={FRIGATE_NEST_CLIENT_SECRET}&refresh_token={FRIGATE_NEST_REFRESH_TOKEN}&project_id={FRIGATE_NEST_PROJECT_ID}&device_id=AVPHwEtnbEGv0Bh9GblHDv66SK0jKGBAbQ1Mnnkuki_YW4_XQJGgV_dZ-nlouy_oRShGc1_7PwBFabTHa8ovpRYEyb8CZVk&protocols=WEB_RTC&video=h264&audio=opus"
    kitchen-sub:
    - "ffmpeg:kitchen-nest#video=h264#width=1280#height=720#raw=-fpsmax 5#input=nest-buffered#hardware=vaapi"
  # Keep Nest streams open so a Frigate reader restart doesn't ask Google for a new stream.
  preload:
    backyard-nest: video
    backyard-sub: video
    garage-inside-nest: video
    garage-inside-sub: video
    garage-outside-nest: video
    garage-outside-sub: video
    living-room-nest: video
    living-room-sub: video
    kitchen-nest: video
    kitchen-sub: video
cameras:
  shed:
    # Enable after the bridge produces decoded frames in the cluster.
    enabled: false
    ffmpeg:
      inputs:
      - path: rtsp://127.0.0.1:8554/shed
        roles:
        - detect
        - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    live:
      streams:
        Camera: shed
      height: 1080
  # Add Nest cameras via go2rtc restream
  backyard:
    enabled: true
    ffmpeg:
      # Wall-clock timestamps: a timestamp jump in the restream otherwise makes Frigate's fps filter emit a burst of duplicate frames, and Frigate kills the reader for exceeding its fps limit.
      input_args: -use_wallclock_as_timestamps 1 -avoid_negative_ts make_zero -fflags +genpts+discardcorrupt -rtsp_transport tcp -rtsp_flags prefer_tcp
      inputs:
      - path: rtsp://127.0.0.1:8554/backyard-sub
        roles:
        - detect
        - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    live:
      streams:
        Camera: backyard-sub
      height: 1080
    objects:
      track:
      - person
      - dog
      - cat
      - car
  garage-inside:
    enabled: true
    ffmpeg:
      input_args: -use_wallclock_as_timestamps 1 -avoid_negative_ts make_zero -fflags +genpts+discardcorrupt -rtsp_transport tcp -rtsp_flags prefer_tcp
      inputs:
      - path: rtsp://127.0.0.1:8554/garage-inside-sub
        roles:
        - detect
        - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    live:
      streams:
        Camera: garage-inside-sub
      height: 1080
    objects:
      track:
      - person
      - car
  garage-outside:
    enabled: true
    ffmpeg:
      input_args: -use_wallclock_as_timestamps 1 -avoid_negative_ts make_zero -fflags +genpts+discardcorrupt -rtsp_transport tcp -rtsp_flags prefer_tcp
      inputs:
      - path: rtsp://127.0.0.1:8554/garage-outside-sub
        roles:
        - detect
        - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    live:
      streams:
        Camera: garage-outside-sub
      height: 1080
    objects:
      track:
      - person
      - car
  living-room:
    enabled: true
    ffmpeg:
      input_args: -use_wallclock_as_timestamps 1 -avoid_negative_ts make_zero -fflags +genpts+discardcorrupt -rtsp_transport tcp -rtsp_flags prefer_tcp
      inputs:
      - path: rtsp://127.0.0.1:8554/living-room-sub
        roles:
        - detect
        - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    live:
      streams:
        Camera: living-room-sub
      height: 1080
    objects:
      track:
      - person
      - dog
      - cat
  kitchen:
    enabled: true
    ffmpeg:
      input_args: -use_wallclock_as_timestamps 1 -avoid_negative_ts make_zero -fflags +genpts+discardcorrupt -rtsp_transport tcp -rtsp_flags prefer_tcp
      inputs:
      - path: rtsp://127.0.0.1:8554/kitchen-sub
        roles:
        - detect
        - record
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    live:
      streams:
        Camera: kitchen-sub
      height: 1080
    objects:
      track:
      - person
