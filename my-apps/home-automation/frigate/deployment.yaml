apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: frigate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frigate
  template:
    metadata:
      labels:
        app: frigate
    spec:
      # Dell Pro Micro: NPU for detection, iGPU for decode and the go2rtc re-encode.
      nodeSelector:
        node.vanillax.dev/class: mini-pc-dell-ultra
      initContainers:
      - name: install-go2rtc
        image: ghcr.io/mitchross/frigate-go2rtc:nest-e7600f4-v1
        command: ["/bin/cp", "/go2rtc", "/custom/go2rtc"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: go2rtc-binary
          mountPath: /custom
      containers:
      - name: frigate
        # 0.18.2+ required: earlier 0.18 builds have root RCE via go2rtc (GHSA-93xj-hg88-ffg7).
        # renovate: ignore
        image: ghcr.io/blakeblackshear/frigate:0.18.2@sha256:fd60f99ffd4eb6c42360ed4e14953e270586f239309ab3983e55b2e97ffac09a
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: "America/New_York"
        - name: FRIGATE_MQTT_USER
          valueFrom:
            secretKeyRef:
              name: frigate-secrets
              key: FRIGATE_MQTT_USER
        - name: FRIGATE_MQTT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: frigate-secrets
              key: FRIGATE_MQTT_PASSWORD
        - name: FRIGATE_NEST_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: frigate-secrets
              key: NEST_CLIENT_ID
        - name: FRIGATE_NEST_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: frigate-secrets
              key: NEST_CLIENT_SECRET
        - name: FRIGATE_NEST_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: frigate-secrets
              key: NEST_PROJECT_ID
        - name: FRIGATE_NEST_REFRESH_TOKEN
          valueFrom:
            secretKeyRef:
              name: frigate-secrets
              key: NEST_REFRESH_TOKEN
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            # The tmpfs caches (/tmp/cache, /dev/shm) and SMB write-back cache
            # count against this. At 8Gi, busy hours hit the cap and tmpfs writes
            # failed with "No space left on device", breaking recording segments.
            # Frigate itself uses 4-5Gi; scheduling uses the request, not this.
            memory: 12Gi
            gpu.intel.com/i915: "1"
            # Stays Pending until intel-npu-plugin advertises this on the Dell.
            npu.intel.com/accel: "1"
        securityContext:
          privileged: true
          allowPrivilegeEscalation: true
        livenessProbe:
          httpGet:
            path: /api/version
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/version
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        # Frigate supports /config/go2rtc; the override is rebuilt on every pod start.
        - name: go2rtc-binary
          mountPath: /config/go2rtc
          subPath: go2rtc
          readOnly: true
        - name: config-dir
          mountPath: /config
        - name: frigate-config-volume
          mountPath: /config/config.yml
          subPath: config.yml
        - name: media
          mountPath: /media
        - name: cache
          mountPath: /dev/shm
        # Recording segments stage here before moving to /media; on the root disk this wrote ~100 GB/day.
        - name: tmp-cache
          mountPath: /tmp/cache
      volumes:
      - name: go2rtc-binary
        emptyDir: {}
      - name: config-dir
        persistentVolumeClaim:
          claimName: frigate-config
      - name: frigate-config-volume
        configMap:
          name: frigate-configmap
          defaultMode: 0644
      - name: media
        persistentVolumeClaim:
          claimName: frigate-media
      - name: cache
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
      - name: tmp-cache
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
