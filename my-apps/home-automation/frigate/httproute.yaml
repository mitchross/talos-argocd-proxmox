apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frigate
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal-technitium
      namespace: gateway
  hostnames:
  - "frigate.vanillax.me"
  rules:
  - matches:
    - path:
        type: PathPrefix 
        value: /
    backendRefs:
        - group: ""
          kind: Service
          name: frigate-http
          # 8971 enforces Frigate login; 5000 skips auth and must never be routed.
          port: 8971
          weight: 1

