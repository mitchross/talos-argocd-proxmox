# VPA policy is owned with this application so Argo prunes it with the target.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: frigate
  namespace: frigate
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frigate
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: frigate
        controlledResources: ["cpu", "memory"]
        controlledValues: RequestsOnly
        maxAllowed:
          cpu: "4"
          # Larger reservations stranded the replacement on the pinned HP node.
          memory: 3Gi
      - containerName: install-go2rtc
        mode: "Off"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: mosquitto
  namespace: frigate
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mosquitto
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledResources: ["cpu", "memory"]
        controlledValues: RequestsOnly
        maxAllowed:
          cpu: "1"
          memory: 1Gi
