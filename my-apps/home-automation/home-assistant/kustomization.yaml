apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-assistant

metadata:
  name: home-assistant
  annotations:
    config.kubernetes.io/local-config: "true"

# Kustomize includes these resources; Argo sync waves control deployment order.
resources:
- vpa.yaml
- namespace.yaml
- pvc.yaml
- service.yaml
- deployment.yaml
- httproute.yaml
- kopiur/config.yaml

# Uniform kopiur backup fields (repository, copyMethod, populator) for the per-PVC stub(s) in kopiur/.
components:
  - ../../common/kopiur-backup

labels:
  # Keep true: selectors are immutable on live Deployments/StatefulSets; flipping to false forces delete/recreate.
  - includeSelectors: true
    pairs:
      app.kubernetes.io/managed-by: kustomize
      environment: production

generatorOptions:
  disableNameSuffixHash: false

configMapGenerator:
- name: home-assistant-scripts
  files:
  - scripts/copy-config.sh
  - scripts/install-hacs.sh
  - scripts/repair-power-statistics.py
  - consumers-energy-restore.py=scripts/consumers-energy-restore/__init__.py
  - consumers-energy-snapshot.py=scripts/consumers-energy-restore/snapshot.py
  - consumers-energy-manifest.json=scripts/consumers-energy-restore/manifest.json
  - power-analysis-init.py=scripts/power-analysis/__init__.py
  - power-analysis-sensor.py=scripts/power-analysis/sensor.py
  - power-analysis.py=scripts/power-analysis/analysis.py
  - power-analysis-manifest.json=scripts/power-analysis/manifest.json
- name: config
  files:
  - configuration.yaml
  - automations.yaml
  - scripts.yaml
  - scenes.yaml
  - customize.yaml
  - lovelace-homelab-power.yaml
  - power-insights.yaml
  - lovelace-power-findings.yaml
  # AirCube ZHA quirk — copied to /config/custom_zha_quirks/aircube.py by the
  # copy-config initContainer (see deployment.yaml). Loaded via zha.custom_quirks_path.
  - aircube.py
