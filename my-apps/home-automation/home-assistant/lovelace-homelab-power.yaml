# YAML-mode dashboard, wired via lovelace.dashboards.homelab-power in configuration.yaml.
# Cost = the all-in TOU rate from sensor.current_electricity_rate; long-term trends come from HA LTS.
# Layout: `sections` views, one question per section, most important top-left. The built-in
# Energy dashboard is the per-day ledger; this page is "what is it costing me, live".
title: Homelab Power
views:
  # ───────────────────────── Overview: the money question ─────────────────────────
  - title: Overview
    icon: mdi:server-network
    path: overview
    type: sections
    max_columns: 4
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Power & cost
            heading_style: title
          - type: markdown
            content: |
              **Today is still accumulating; yesterday is a complete day.** Plug costs use the configured time-of-use rate. All plugs = homelab + office. Cooling is a separate estimate; CE reports the house later.

              [Findings](/homelab-power/findings) · [Daily spend](/homelab-power/daily-spend) · [Bill breakdown](/homelab-power/bill-breakdown) · [Rates & savings](/homelab-power/rates-savings)
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: heading
            heading: Today so far
            heading_style: title
          - type: tile
            entity: sensor.homelab_cost_daily
            name: Homelab cost
            color: blue
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: sensor.office_cost_daily
            name: Office cost
            color: purple
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: sensor.ac_cooling_cost_daily
            name: Cooling estimate
            color: cyan
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: sensor.combined_cost_daily
            name: All plugs
            color: amber
            grid_options:
              columns: 6
              rows: 1
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Yesterday · completed day
            heading_style: title
          - type: tile
            entity: sensor.homelab_cost_yesterday
            name: Homelab cost
            color: blue
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: sensor.office_cost_yesterday
            name: Office cost
            color: purple
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: sensor.ac_cooling_cost_yesterday
            name: Cooling estimate
            color: cyan
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: sensor.consumers_energy_cost_yesterday
            name: House · CE reported
            color: grey
            grid_options:
              columns: 6
              rows: 1
            visibility:
              - condition: state
                entity: binary_sensor.power_bill_data_current
                state: on
      - type: grid
        cards:
          - type: heading
            heading: Right now
            heading_style: title
            badges:
              - type: entity
                entity: sensor.electricity_tariff_period
                name: Tariff
              - type: entity
                entity: sensor.current_electricity_rate
                name: Rate
          - type: tile
            entity: sensor.homelab_total_power
            name: Homelab
            grid_options:
              columns: 6
              rows: 1
            color: blue
          - type: tile
            entity: sensor.office_total_power
            name: Office
            grid_options:
              columns: 6
              rows: 1
            color: purple
          - type: tile
            entity: sensor.shed_lab_current_consumption
            name: Shed (solar)
            grid_options:
              columns: 6
              rows: 1
            color: green
          - type: tile
            entity: sensor.combined_cost_rate
            name: Cost per hour now
            grid_options:
              columns: 6
              rows: 1
            color: amber
      - type: grid
        cards:
          - type: heading
            heading: Month to date
            heading_style: title
          - type: tile
            entity: sensor.homelab_cost_monthly
            name: Homelab
            grid_options:
              columns: 6
              rows: 1
            color: blue
          - type: tile
            entity: sensor.office_cost_monthly
            name: Office
            grid_options:
              columns: 6
              rows: 1
            color: purple
          - type: tile
            entity: sensor.combined_cost_monthly
            name: Both together
            grid_options:
              columns: 6
              rows: 1
            color: amber
          - type: tile
            entity: sensor.consumers_energy_cost_month
            name: House · CE reported
            grid_options:
              columns: 6
              rows: 1
            color: grey
          - type: markdown
            grid_options:
              columns: full
            content: |
              CE through **{{ states("sensor.consumers_energy_last_reading") }}**; plug totals include today.
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Cost share today · tracked loads
            heading_style: title
          - type: distribution
            entities:
              - entity: sensor.homelab_cost_daily
                name: Homelab
                color: '#42a5f5'
              - entity: sensor.office_cost_daily
                name: Office
                color: '#ab47bc'
              - entity: sensor.ac_cooling_cost_daily
                name: Cooling estimate
                color: '#26c6da'
            grid_options:
              columns: full
          - type: heading
            heading: Draw, last 24 hours
            heading_style: title
          - type: history-graph
            title:
            hours_to_show: 24
            refresh_interval: 60
            entities:
              - entity: sensor.homelab_total_power
                name: Homelab
                color: '#42a5f5'
              - entity: sensor.office_total_power
                name: Office
                color: '#ab47bc'
              - entity: sensor.shed_lab_current_consumption
                name: Shed (solar)
                color: '#66bb6a'
            grid_options:
              columns: full
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: House vs homelab, by day
            heading_style: title
          - type: statistics-graph
            chart_type: bar
            period: day
            days_to_show: 14
            stat_types:
              - change
            entities:
              - entity: consumers_energy:grid_kwh
                color: '#90a4ae'
              - entity: sensor.homelab_total_energy
                color: '#42a5f5'
              - entity: sensor.office_total_energy
                color: '#ab47bc'
            grid_options:
              columns: full
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Where the energy goes, by day
            heading_style: title
          - type: statistics-graph
            chart_type: bar
            period: day
            days_to_show: 14
            stat_types:
              - change
            entities:
              - entity: sensor.threadripper_energy
                color: '#42a5f5'
              - entity: sensor.nas_psu_energy
                color: '#ffa726'
              - entity: sensor.truenas_energy
                color: '#26a69a'
              - entity: sensor.hp_sff_energy
                color: '#ef5350'
              - entity: sensor.hp_elite_energy
                color: '#8d6e63'
              - entity: sensor.gaming_pc_energy
                color: '#ab47bc'
              - entity: sensor.macbook_energy
                color: '#ec407a'
              - entity: sensor.shed_lab_energy
                color: '#66bb6a'
            grid_options:
              columns: full
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Cost by month · recorded history
            heading_style: title
          - type: statistics-graph
            chart_type: bar
            period: month
            days_to_show: 365
            stat_types:
              - change
            entities:
              - entity: sensor.homelab_cost
                color: '#42a5f5'
              - entity: sensor.office_cost
                color: '#ab47bc'
            grid_options:
              columns: full
          - type: markdown
            grid_options:
              columns: full
            content: |
              Graphs cover recorded history only. The first month can be partial; meter tiles may include usage from before that history began. Today’s bars are still accumulating.
      - type: grid
        cards:
          - type: heading
            heading: House energy share · yesterday
            heading_style: title
            badges:
              - type: entity
                entity: sensor.consumers_energy_last_reading
                name: CE data through
          - type: markdown
            content: |
              {% if not is_state('binary_sensor.power_bill_data_current', 'on') %}
              **Waiting for matching utility data.** Latest CE day: {{ states('sensor.consumers_energy_last_reading') }}. House shares appear when CE reaches yesterday.
              {% else %}
              CE date: **{{ states('sensor.consumers_energy_last_reading') }}**. Shares below compare kWh.
              {% endif %}
            grid_options:
              columns: full
          - type: tile
            entity: sensor.homelab_share_of_house
            name: Homelab
            grid_options:
              columns: 6
              rows: 1
            color: blue
          - type: tile
            entity: sensor.combined_share_of_house
            name: Homelab + office
            grid_options:
              columns: 6
              rows: 1
            color: amber
          - type: tile
            entity: sensor.consumers_energy_kwh_yesterday
            name: House yesterday
            grid_options:
              columns: 6
              rows: 1
            color: grey
            visibility:
              - condition: state
                entity: binary_sensor.power_bill_data_current
                state: on
          - type: tile
            entity: sensor.homelab_total_energy_yesterday
            name: Homelab yesterday
            grid_options:
              columns: 6
              rows: 1
            color: blue
  - !include lovelace-power-findings.yaml
  - title: Daily spend
    path: daily-spend
    icon: mdi:calendar-compare
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Today vs yesterday
            heading_style: title
          - type: markdown
            content: |
              Today: **{{ now().date() }}**, through **{{ now().strftime("%H:%M") }}**. Yesterday: **{{ (now() - timedelta(days=1)).date() }}**, full day.

              A smaller total today does not yet mean a saving. Costs below are estimates from metered energy and the configured rate. **—** means unavailable, not zero.
            grid_options:
              columns: full
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Cost by group · USD
            heading_style: title
          - type: markdown
            content: |
              {% macro num(v, digits=2, prefix='', suffix='') -%}
              {{ prefix ~ ('%.*f' | format(digits, v | float)) ~ suffix if is_number(v) else '—' }}
              {%- endmacro %}
              {% macro yesterday(entity, digits=2, prefix='') -%}
              {%- set reset = state_attr(entity, 'last_reset') | as_datetime(none) -%}
              {{ num(state_attr(entity, 'last_period'), digits, prefix) if reset is not none and (reset | as_local).date() == now().date() else '—' }}
              {%- endmacro %}
              <table width="100%">
              <tr><th>Load</th><th>Today so far</th><th>Yesterday</th></tr>
              <tr><td>Homelab</td><td>{{ num(states('sensor.homelab_cost_daily'), 2, '$') }}</td><td>{{ yesterday('sensor.homelab_cost_daily', 2, '$') }}</td></tr>
              <tr><td>Office</td><td>{{ num(states('sensor.office_cost_daily'), 2, '$') }}</td><td>{{ yesterday('sensor.office_cost_daily', 2, '$') }}</td></tr>
              <tr><td>Cooling · estimate</td><td>{{ num(states('sensor.ac_cooling_cost_daily'), 2, '$') }}</td><td>{{ yesterday('sensor.ac_cooling_cost_daily', 2, '$') }}</td></tr>
              </table>
            grid_options:
              columns: full
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Energy by group
            heading_style: title
          - type: markdown
            content: |
              {% macro num(v, digits=2, prefix='', suffix='') -%}
              {{ prefix ~ ('%.*f' | format(digits, v | float)) ~ suffix if is_number(v) else '—' }}
              {%- endmacro %}
              {% macro yesterday(entity, digits=2, prefix='') -%}
              {%- set reset = state_attr(entity, 'last_reset') | as_datetime(none) -%}
              {{ num(state_attr(entity, 'last_period'), digits, prefix) if reset is not none and (reset | as_local).date() == now().date() else '—' }}
              {%- endmacro %}
              <table width="100%">
              <tr><th>Load</th><th>Today kWh</th><th>Yesterday kWh</th></tr>
              <tr><td>Homelab</td><td>{{ num(states('sensor.homelab_total_energy_daily'), 3) }}</td><td>{{ yesterday('sensor.homelab_total_energy_daily', 3) }}</td></tr>
              <tr><td>Office</td><td>{{ num(states('sensor.office_total_energy_daily'), 3) }}</td><td>{{ yesterday('sensor.office_total_energy_daily', 3) }}</td></tr>
              <tr><td>Cooling · estimate</td><td>{{ num(states('sensor.ac_cooling_energy_daily'), 3) }}</td><td>{{ yesterday('sensor.ac_cooling_energy_daily', 3) }}</td></tr>
              </table>
            grid_options:
              columns: full
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Every plug · USD
            heading_style: title
          - type: markdown
            content: |
              {% macro num(v, digits=2, prefix='', suffix='') -%}
              {{ prefix ~ ('%.*f' | format(digits, v | float)) ~ suffix if is_number(v) else '—' }}
              {%- endmacro %}
              {% macro yesterday(entity, digits=2, prefix='') -%}
              {%- set reset = state_attr(entity, 'last_reset') | as_datetime(none) -%}
              {{ num(state_attr(entity, 'last_period'), digits, prefix) if reset is not none and (reset | as_local).date() == now().date() else '—' }}
              {%- endmacro %}
              <table width="100%">
              <tr><th>Plug</th><th>Today</th><th>Yesterday</th></tr>
              <tr><td>Threadripper</td><td>{{ num(states('sensor.threadripper_cost_daily'), 2, '$') }}</td><td>{{ yesterday('sensor.threadripper_cost_daily', 2, '$') }}</td></tr>
              <tr><td>NAS drive PSU</td><td>{{ num(states('sensor.nas_psu_cost_daily'), 2, '$') }}</td><td>{{ yesterday('sensor.nas_psu_cost_daily', 2, '$') }}</td></tr>
              <tr><td>TrueNAS</td><td>{{ num(states('sensor.truenas_cost_daily'), 2, '$') }}</td><td>{{ yesterday('sensor.truenas_cost_daily', 2, '$') }}</td></tr>
              <tr><td>HP SFF + Optiplex</td><td>{{ num(states('sensor.hp_sff_cost_daily'), 2, '$') }}</td><td>{{ yesterday('sensor.hp_sff_cost_daily', 2, '$') }}</td></tr>
              <tr><td>HP Elite Mini</td><td>{{ num(states('sensor.hp_elite_cost_daily'), 2, '$') }}</td><td>{{ yesterday('sensor.hp_elite_cost_daily', 2, '$') }}</td></tr>
              <tr><td>Gaming PC</td><td>{{ num(states('sensor.gaming_pc_cost_daily'), 2, '$') }}</td><td>{{ yesterday('sensor.gaming_pc_cost_daily', 2, '$') }}</td></tr>
              <tr><td>MacBook + monitor</td><td>{{ num(states('sensor.macbook_cost_daily'), 2, '$') }}</td><td>{{ yesterday('sensor.macbook_cost_daily', 2, '$') }}</td></tr>
              </table>
            grid_options:
              columns: full
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Every plug · kWh
            heading_style: title
          - type: markdown
            content: |
              {% macro num(v, digits=2, prefix='', suffix='') -%}
              {{ prefix ~ ('%.*f' | format(digits, v | float)) ~ suffix if is_number(v) else '—' }}
              {%- endmacro %}
              {% macro yesterday(entity, digits=2, prefix='') -%}
              {%- set reset = state_attr(entity, 'last_reset') | as_datetime(none) -%}
              {{ num(state_attr(entity, 'last_period'), digits, prefix) if reset is not none and (reset | as_local).date() == now().date() else '—' }}
              {%- endmacro %}
              <table width="100%">
              <tr><th>Plug</th><th>Today kWh</th><th>Yesterday kWh</th></tr>
              <tr><td>Threadripper</td><td>{{ num(states('sensor.threadripper_energy_daily'), 3) }}</td><td>{{ yesterday('sensor.threadripper_energy_daily', 3) }}</td></tr>
              <tr><td>NAS drive PSU</td><td>{{ num(states('sensor.nas_psu_energy_daily'), 3) }}</td><td>{{ yesterday('sensor.nas_psu_energy_daily', 3) }}</td></tr>
              <tr><td>TrueNAS</td><td>{{ num(states('sensor.truenas_energy_daily'), 3) }}</td><td>{{ yesterday('sensor.truenas_energy_daily', 3) }}</td></tr>
              <tr><td>HP SFF + Optiplex</td><td>{{ num(states('sensor.hp_sff_energy_daily'), 3) }}</td><td>{{ yesterday('sensor.hp_sff_energy_daily', 3) }}</td></tr>
              <tr><td>HP Elite Mini</td><td>{{ num(states('sensor.hp_elite_energy_daily'), 3) }}</td><td>{{ yesterday('sensor.hp_elite_energy_daily', 3) }}</td></tr>
              <tr><td>Gaming PC</td><td>{{ num(states('sensor.gaming_pc_energy_daily'), 3) }}</td><td>{{ yesterday('sensor.gaming_pc_energy_daily', 3) }}</td></tr>
              <tr><td>MacBook + monitor</td><td>{{ num(states('sensor.macbook_energy_daily'), 3) }}</td><td>{{ yesterday('sensor.macbook_energy_daily', 3) }}</td></tr>
              </table>
            grid_options:
              columns: full
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Daily cost · homelab, office and cooling
            heading_style: title
          - type: statistics-graph
            chart_type: bar-stack
            period: day
            days_to_show: 14
            stat_types:
              - change
            entities:
              - entity: sensor.homelab_cost
                name: Homelab
                color: '#42a5f5'
              - entity: sensor.office_cost
                name: Office
                color: '#ab47bc'
              - entity: sensor.ac_cooling_cost
                name: Cooling · estimate
                color: '#26c6da'
            grid_options:
              columns: full
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Who contributes most today?
            heading_style: title
          - type: distribution
            entities:
              - entity: sensor.threadripper_cost_daily
                name: Threadripper
                color: '#42a5f5'
              - entity: sensor.nas_psu_cost_daily
                name: NAS drive PSU
                color: '#ffa726'
              - entity: sensor.truenas_cost_daily
                name: TrueNAS
                color: '#26a69a'
              - entity: sensor.hp_sff_cost_daily
                name: HP SFF + Optiplex
                color: '#ef5350'
              - entity: sensor.hp_elite_cost_daily
                name: HP Elite Mini
                color: '#8d6e63'
              - entity: sensor.gaming_pc_cost_daily
                name: Gaming PC
                color: '#ab47bc'
              - entity: sensor.macbook_cost_daily
                name: MacBook + monitor
                color: '#ec407a'
            grid_options:
              columns: full
          - type: markdown
            content: |
              {% macro num(v, digits=2, prefix='', suffix='') -%}
              {{ prefix ~ ('%.*f' | format(digits, v | float)) ~ suffix if is_number(v) else '—' }}
              {%- endmacro %}
              {% macro yesterday(entity, digits=2, prefix='') -%}
              {%- set reset = state_attr(entity, 'last_reset') | as_datetime(none) -%}
              {{ num(state_attr(entity, 'last_period'), digits, prefix) if reset is not none and (reset | as_local).date() == now().date() else '—' }}
              {%- endmacro %}
              {% set total = states('sensor.combined_cost_daily') | float(0) %}
              <table width="100%">
              <tr><th>Plug</th><th>Share of plug cost today</th></tr>
              <tr><td>Threadripper</td><td>{{ num(states('sensor.threadripper_cost_daily') | float(0) / total * 100, 1, '', '%') if total > 0 and has_value('sensor.threadripper_cost_daily') else '—' }}</td></tr>
              <tr><td>NAS drive PSU</td><td>{{ num(states('sensor.nas_psu_cost_daily') | float(0) / total * 100, 1, '', '%') if total > 0 and has_value('sensor.nas_psu_cost_daily') else '—' }}</td></tr>
              <tr><td>TrueNAS</td><td>{{ num(states('sensor.truenas_cost_daily') | float(0) / total * 100, 1, '', '%') if total > 0 and has_value('sensor.truenas_cost_daily') else '—' }}</td></tr>
              <tr><td>HP SFF + Optiplex</td><td>{{ num(states('sensor.hp_sff_cost_daily') | float(0) / total * 100, 1, '', '%') if total > 0 and has_value('sensor.hp_sff_cost_daily') else '—' }}</td></tr>
              <tr><td>HP Elite Mini</td><td>{{ num(states('sensor.hp_elite_cost_daily') | float(0) / total * 100, 1, '', '%') if total > 0 and has_value('sensor.hp_elite_cost_daily') else '—' }}</td></tr>
              <tr><td>Gaming PC</td><td>{{ num(states('sensor.gaming_pc_cost_daily') | float(0) / total * 100, 1, '', '%') if total > 0 and has_value('sensor.gaming_pc_cost_daily') else '—' }}</td></tr>
              <tr><td>MacBook + monitor</td><td>{{ num(states('sensor.macbook_cost_daily') | float(0) / total * 100, 1, '', '%') if total > 0 and has_value('sensor.macbook_cost_daily') else '—' }}</td></tr>
              </table>

              Denominator: homelab + office cost today. Cooling and the solar shed are excluded. This is not a share of the whole-house bill.
            grid_options:
              columns: full
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Solar shed · separate supply
            heading_style: title
          - type: markdown
            content: |
              {% macro num(v, digits=2, prefix='', suffix='') -%}
              {{ prefix ~ ('%.*f' | format(digits, v | float)) ~ suffix if is_number(v) else '—' }}
              {%- endmacro %}
              {% macro yesterday(entity, digits=2, prefix='') -%}
              {%- set reset = state_attr(entity, 'last_reset') | as_datetime(none) -%}
              {{ num(state_attr(entity, 'last_period'), digits, prefix) if reset is not none and (reset | as_local).date() == now().date() else '—' }}
              {%- endmacro %}
              Today: **{{ num(states('sensor.shed_lab_energy_daily'), 3) }} kWh** · yesterday: **{{ yesterday('sensor.shed_lab_energy_daily', 3) }} kWh**. No grid electricity cost is assigned to the shed.
            grid_options:
              columns: full
  - title: Bill breakdown
    path: bill-breakdown
    icon: mdi:receipt-text
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Where yesterday’s bill went
            heading_style: title
          - type: markdown
            content: |
              **Homelab + office + cooling + other = whole house.** These are separate loads; gaming is already inside office. The solar shed is outside the grid bill.

              CE provides reported whole-house cost. Plug costs use the configured rate; AC energy and cost are modeled.
            grid_options:
              columns: full
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Energy allocation · yesterday
            heading_style: title
          - type: markdown
            content: |
              {% macro num(v, digits=2, prefix='', suffix='') -%}
              {{ prefix ~ ('%.*f' | format(digits, v | float)) ~ suffix if is_number(v) else '—' }}
              {%- endmacro %}
              {% macro yesterday(entity, digits=2, prefix='') -%}
              {%- set reset = state_attr(entity, 'last_reset') | as_datetime(none) -%}
              {{ num(state_attr(entity, 'last_period'), digits, prefix) if reset is not none and (reset | as_local).date() == now().date() else '—' }}
              {%- endmacro %}
              {% if is_state('binary_sensor.power_bill_data_current', 'on') %}
              CE date: **{{ states('sensor.consumers_energy_last_reading') }}**

              <table width="100%">
              <tr><th>Load</th><th>kWh</th><th>Energy share</th></tr>
              <tr><td>Homelab</td><td>{{ num(states('sensor.homelab_total_energy_yesterday'), 3) }}</td><td>{{ num(states('sensor.homelab_energy_share_yesterday'), 1, '', '%') }}</td></tr>
              <tr><td>Office</td><td>{{ num(states('sensor.office_total_energy_yesterday'), 3) }}</td><td>{{ num(states('sensor.office_energy_share_yesterday'), 1, '', '%') }}</td></tr>
              <tr><td>Cooling · estimate</td><td>{{ num(states('sensor.ac_cooling_energy_yesterday'), 3) }}</td><td>{{ num(states('sensor.ac_cooling_energy_share_yesterday'), 1, '', '%') }}</td></tr>
              <tr><td>Other / model difference</td><td>{{ num(states('sensor.house_other_energy_yesterday'), 3) }}</td><td>{{ num(states('sensor.house_other_energy_share_yesterday'), 1, '', '%') }}</td></tr>
              <tr><td><strong>Whole house · CE</strong></td><td><strong>{{ num(states('sensor.consumers_energy_kwh_yesterday'), 3) }}</strong></td><td><strong>100%</strong></td></tr>
              </table>

              {% else %}
              **Waiting for yesterday's CE data.** Latest CE day: {{ states('sensor.consumers_energy_last_reading') }}. Shares are unavailable until the dates match.
              {% endif %}
