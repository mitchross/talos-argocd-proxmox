              <tr><td>TrueNAS</td><td>{{ num(states('sensor.truenas_current_consumption'), 0) }}</td><td>{{ num(states('sensor.truenas_cost_rate') | float(0) * 720, 2, '$') if has_value('sensor.truenas_cost_rate') else '—' }}</td></tr>
              <tr><td>HP SFF + Optiplex</td><td>{{ num(states('sensor.hp_sff_current_consumption'), 0) }}</td><td>{{ num(states('sensor.hp_sff_cost_rate') | float(0) * 720, 2, '$') if has_value('sensor.hp_sff_cost_rate') else '—' }}</td></tr>
              <tr><td>HP Elite Mini</td><td>{{ num(states('sensor.hp_elite_current_consumption'), 0) }}</td><td>{{ num(states('sensor.hp_elite_cost_rate') | float(0) * 720, 2, '$') if has_value('sensor.hp_elite_cost_rate') else '—' }}</td></tr>
              <tr><td>Gaming PC</td><td>{{ num(states('sensor.gaming_pc_current_consumption'), 0) }}</td><td>{{ num(states('sensor.gaming_pc_cost_rate') | float(0) * 720, 2, '$') if has_value('sensor.gaming_pc_cost_rate') else '—' }}</td></tr>
