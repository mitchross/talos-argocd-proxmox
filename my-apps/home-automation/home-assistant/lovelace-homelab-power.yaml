            entity: sensor.current_electricity_rate
            name: Rate now
            color: amber
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: sensor.combined_cost_rate
            name: Plugs · $/h
            color: amber
            grid_options:
              columns: 6
              rows: 1
          - type: markdown
            content: |
              Start with watts that run for many hours. **100 W for 24 hours = 2.4 kWh**. Use Daily spend for actual accumulated cost; use the scenarios below to assess a possible change.
            grid_options:
              columns: full
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Configured electricity prices
            heading_style: title
          - type: markdown
            content: |
              {% macro num(v, digits=2, prefix='', suffix='') -%}
              {{ prefix ~ ('%.*f' | format(digits, v | float)) ~ suffix if is_number(v) else '—' }}
              {%- endmacro %}
              {% macro yesterday(entity, digits=2, prefix='') -%}
              {%- set reset = state_attr(entity, 'last_reset') | as_datetime(none) -%}
              {{ num(state_attr(entity, 'last_period'), digits, prefix) if reset is not none and (reset | as_local).date() == now().date() else '—' }}
              {%- endmacro %}
              {% set riders = states('input_number.rate_delivery_riders') | float(0) %}
              {% set tax = 1 + states('input_number.rate_sales_tax_pct') | float(0) / 100 %}
              <table width="100%">
              <tr><th>Configured tariff</th><th>Energy $/kWh</th><th>With riders + tax</th></tr>
              {% for key, label in [('rate_nonsummer', 'Sep–May'), ('rate_summer_offpeak', 'Summer off-peak'), ('rate_summer_onpeak', 'Summer on-peak')] %}
              <tr><td>{{ label }}</td><td>{{ num(states('input_number.' ~ key), 4, '$') }}</td><td>{{ num((states('input_number.' ~ key) | float(0) + riders) * tax, 4, '$') }}</td></tr>
              {% endfor %}
              </table>

              Summer: June–August. On-peak: weekdays 14:00–19:00, local time. Riders: **{{ num(riders, 4, '$') }}/kWh**; tax: **{{ states('input_number.rate_sales_tax_pct') }}%**.

              These are the configured assumptions, not a fresh tariff quote. Usage cost excludes fixed monthly fees. Permanent rate changes go through GitOps.
            grid_options:
              columns: full
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Always-on scenarios
            heading_style: title
          - type: markdown
            content: |
              {% macro num(v, digits=2, prefix='', suffix='') -%}
              {{ prefix ~ ('%.*f' | format(digits, v | float)) ~ suffix if is_number(v) else '—' }}
              {%- endmacro %}
              {% macro yesterday(entity, digits=2, prefix='') -%}
              {%- set reset = state_attr(entity, 'last_reset') | as_datetime(none) -%}
              {{ num(state_attr(entity, 'last_period'), digits, prefix) if reset is not none and (reset | as_local).date() == now().date() else '—' }}
              {%- endmacro %}
              {% set rate = states('sensor.current_electricity_rate') %}
              <table width="100%">
              <tr><th>Constant load</th><th>Per day</th><th>30 days</th></tr>
              {% for watts in [10, 50, 100, 200, 500] %}
              <tr><td>{{ watts }} W</td><td>{{ num(watts / 1000 * 24 * rate | float(0), 2, '$') if is_number(rate) else '—' }}</td><td>{{ num(watts / 1000 * 720 * rate | float(0), 2, '$') if is_number(rate) else '—' }}</td></tr>
              {% endfor %}
              </table>

              What-if: the same watts and today's rate for every hour. These are not bill forecasts; tariff changes and actual runtime matter.
            grid_options:
