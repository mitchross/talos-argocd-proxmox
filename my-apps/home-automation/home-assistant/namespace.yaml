apiVersion: v1
kind: Namespace
metadata:
  name: home-assistant
  labels:
    # enforce=privileged: the HA container runs privileged to open the Zigbee dongle (hostPath /dev/ttyUSB0).
    # audit/warn stay at baseline to keep surfacing any other regressions.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    # kopiur-managed: ClusterExternalSecret cred fanout + ClusterRepository
    # tenancy (allowedNamespaces selector). Replaces pvc-plumber labels.
    kopiur.home-operations.com/repo: cluster-kopia
  annotations:
    # root-uid mover gate — required because this app's kopiur stub runs the
    # mover as uid 0 (data is root-owned); NOT a component default.
    kopiur.home-operations.com/privileged-movers: "true"
