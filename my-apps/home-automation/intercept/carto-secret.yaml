apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: intercept-carto
  namespace: intercept
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: intercept-carto
    creationPolicy: Owner
  data:
    - secretKey: CARTO_API_KEY
      remoteRef:
        key: intercept
        property: carto_api_key
