apiVersion: apps/v1
kind: Deployment
metadata:
  name: intercept
  namespace: intercept
  labels:
    app.kubernetes.io/name: intercept
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: intercept
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intercept
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      # Both RTL-SDRs are USB-passed to one VM; NFD labels whichever node
      # enumerates them (rtl-sdr-rule). Never pin this to a node class.
      nodeSelector:
        feature.node.kubernetes.io/custom-usb.rtl-sdr: "true"
      tolerations:
        - key: node.vanillax.dev/link
          operator: Equal
          value: wifi
          effect: NoSchedule
      initContainers:
        - name: initialize-data
          image: docker.io/library/alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
          command:
            - /bin/sh
            - -c
            - /opt/repo-scripts/initialize-data.sh
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: data
              mountPath: /persist
      containers:
        - name: intercept
          image: ghcr.io/smittix/intercept:2.33.84@sha256:a600b07004e75e340feb317d5b625ea04b964a8369fca42e371aab65fbbe4b13
          imagePullPolicy: IfNotPresent
          securityContext:
            # Upstream requires privileged access for libusb-based SDR tools.
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
            runAsNonRoot: false
          env:
            - name: TZ
              value: America/Detroit
            - name: INTERCEPT_HOST
              value: 0.0.0.0
            - name: INTERCEPT_PORT
              value: "5050"
            - name: INTERCEPT_LOG_LEVEL
              value: INFO
            - name: INTERCEPT_ADSB_AUTO_START
              value: "false"
            - name: INTERCEPT_ADSB_HISTORY_ENABLED
              value: "true"
            - name: INTERCEPT_ADSB_DB_HOST
              value: intercept-postgres
            - name: INTERCEPT_ADSB_DB_PORT
              value: "5432"
            - name: INTERCEPT_ADSB_DB_NAME
              value: intercept_adsb
            - name: INTERCEPT_ADSB_DB_USER
              value: intercept
            - name: INTERCEPT_ADSB_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: intercept-postgres-secret
                  key: password
            - name: INTERCEPT_SHARED_OBSERVER_LOCATION
              value: "true"
            - name: INTERCEPT_REGION
              value: US
            # Intentional for LAN-only use. Do not bind the HTTPRoute to the
            # external Gateway without restoring application authentication.
            - name: INTERCEPT_DISABLE_AUTH
              value: "true"
            - name: CARTO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: intercept-carto
                  key: CARTO_API_KEY
                  optional: true
          ports:
            - name: http
              containerPort: 5050
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            # Persist the application database, credentials, settings, and
            # generated output without masking the Python modules in /app/data.
            - name: data
              mountPath: /app/instance
              subPath: instance
            - name: data
              mountPath: /app/data/weather_sat
              subPath: weather_sat
            - name: data
              mountPath: /app/data/radiosonde
              subPath: radiosonde
            - name: data
              mountPath: /app/data/subghz
              subPath: subghz
            - name: data
              mountPath: /app/data/adsb
              subPath: adsb
            # Mount the bus, not 001/003 and 001/004: USB device numbers can
            # change after a VM or hub restart, while both RTL2838s remain here.
            - name: usb-bus
              mountPath: /dev/bus/usb
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
          lifecycle:
            postStart:
              exec:
                command: ["python3", "/opt/repo-scripts/set-carto-key.py"]
      volumes:
        - name: repo-scripts
          configMap:
            name: intercept-scripts
            defaultMode: 0555
        - name: data
          persistentVolumeClaim:
            claimName: intercept-data
        - name: usb-bus
          hostPath:
            path: /dev/bus/usb
            type: Directory
