---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: intercept-postgres-19-data
  namespace: intercept
spec:
  sources:
    - pvc:
        name: intercept-postgres-19-data
  identity:
    username: intercept-postgres-19-data
    hostname: intercept
  hooks:
    beforeSnapshot:
      - workloadExec:
          podSelector:
            matchLabels:
              app.kubernetes.io/name: intercept-postgres-19
          container: postgres
          command: ["/bin/sh", "-c", "exec psql -v ON_ERROR_STOP=1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -c \"CHECKPOINT\""]
          timeout: 2m
  retention:
    keepDaily: 7
    keepWeekly: 8
  mover:
    securityContext:
      runAsUser: 999
      runAsGroup: 999
      runAsNonRoot: true
    podSecurityContext:
      fsGroup: 999
      supplementalGroups:
        - 999
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: intercept-postgres-19-data-daily
  namespace: intercept
spec:
  policyRef:
    name: intercept-postgres-19-data
  schedule:
    cron: "3 3 * * *"
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: intercept-postgres-19-data-restore
  namespace: intercept
spec:
  source:
    fromPolicy:
      name: intercept-postgres-19-data
      offset: 0
  mover:
    securityContext:
      runAsUser: 999
      runAsGroup: 999
      runAsNonRoot: true
    podSecurityContext:
      fsGroup: 999
      supplementalGroups:
        - 999
