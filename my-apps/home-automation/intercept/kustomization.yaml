apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: intercept

resources:
  - namespace.yaml
  - postgres-secret.yaml
  - carto-secret.yaml
  - pvc.yaml
  - kopiur/intercept-data.yaml
  - postgres-19/deployment.yaml
  - postgres-19/service.yaml
  - postgres-19/pvc.yaml
  - kopiur/postgres-19-data.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - vpa.yaml

components:
  - ../../common/kopiur-backup

configMapGenerator:
  - name: intercept-scripts
    files:
      - scripts/initialize-data.sh
      - scripts/fix-carto-tiles.py
