apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyze-bridge
  namespace: wyze-bridge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wyze-bridge
  template:
    metadata:
      labels:
        app: wyze-bridge
    spec:
      containers:
      - name: wyze-bridge
        image: ghcr.io/idisposable/docker-wyze-bridge:sha-c4991b1e6980b94d9ee2636533c97b0d72f73000@sha256:a03a9651d398f3ea93717718d32c8587310548ed24502ebe6173b6789cbd6e1b
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: wyze-bridge-config
        # Keep Secret keys stable; translate upstream environment names here.
        env:
        - name: WYZE_EMAIL
          valueFrom:
            secretKeyRef:
              name: wyze-bridge-secrets
              key: WYZE_EMAIL
        - name: WYZE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wyze-bridge-secrets
              key: WYZE_PASSWORD
        - name: WYZE_API_ID
          valueFrom:
            secretKeyRef:
              name: wyze-bridge-secrets
              key: API_ID
        - name: WYZE_API_KEY
          valueFrom:
            secretKeyRef:
              name: wyze-bridge-secrets
              key: API_KEY
        - name: WYZE_TOTP_KEY
          valueFrom:
            secretKeyRef:
              name: wyze-bridge-secrets
              key: WYZE_TOTP_KEY
        - name: BRIDGE_USERNAME
          valueFrom:
            secretKeyRef:
              name: wyze-bridge-secrets
              key: WB_USERNAME
        - name: BRIDGE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wyze-bridge-secrets
              key: WB_PASSWORD
        - name: BRIDGE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: wyze-bridge-secrets
              key: WB_API
        ports:
        - containerPort: 8554
          name: rtsp
        - containerPort: 8888
          name: hls
        - containerPort: 8889
          name: webrtc
        - containerPort: 8189
          name: webrtc-ice
          protocol: UDP
        - containerPort: 5080
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: rtsp
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: wyze-config
          mountPath: /config
      volumes:
      - name: wyze-config
        emptyDir: {}
