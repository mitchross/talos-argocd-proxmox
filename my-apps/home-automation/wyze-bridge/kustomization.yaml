apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - vpa.yaml

  - namespace.yaml
  - external-secret.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - web-session-secret.yaml
  - web-session-pvc.yaml
  - kopiur/wyze-web-session.yaml

components:
  - ../../common/kopiur-backup

configMapGenerator:
  - name: wyze-bridge-config
    envs:
      - wyze-bridge-config.env

namespace: wyze-bridge
