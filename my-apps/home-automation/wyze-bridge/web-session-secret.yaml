apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wyze-web-session-seed
  namespace: wyze-bridge
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: wyze-web-session-seed
    creationPolicy: Owner
  data:
    - secretKey: WEB_SESSION
      remoteRef:
        key: wyze-bridge
        property: WEB_SESSION
