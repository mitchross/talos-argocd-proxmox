apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: frigate
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frigate
  template:
    metadata:
      labels:
        app: frigate
    spec:
      # Keep Frigate on the Dell because its camera traffic stays in the yard
      # failure domain. The Dell is CPU-only; decode falls back to software.
      nodeSelector:
        node.vanillax.dev/class: dell-worker
      containers:
      - name: frigate
        # 0.17.2 rolled back to 0.17.1: the 0.17.2 bump auto-merged 2026-06-28 while
        # frigate sat at replicas:0 and its first real run (2026-07-19) could never
        # decode the Nest WebRTC streams (keyframe starvation on every consumer
        # type; go2rtc 1.9.9/1.9.10/1.9.14 all identical). 0.17.1 is the stack
        # that demonstrably served these cameras through April 2026. Keep Renovate
        # off this until the regression is bisected.
        # renovate: ignore
        image: ghcr.io/blakeblackshear/frigate:0.17.2
        imagePullPolicy: IfNotPresent
        env:
        - name: TZ
          value: "America/New_York"
        - name: FRIGATE_MQTT_USER
          valueFrom:
            secretKeyRef:
              name: frigate-secrets
              key: FRIGATE_MQTT_USER
        - name: FRIGATE_MQTT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: frigate-secrets
              key: FRIGATE_MQTT_PASSWORD
        - name: FRIGATE_NEST_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: frigate-secrets
              key: NEST_CLIENT_ID
        - name: FRIGATE_NEST_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: frigate-secrets
              key: NEST_CLIENT_SECRET
        - name: FRIGATE_NEST_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: frigate-secrets
              key: NEST_PROJECT_ID
        - name: FRIGATE_NEST_REFRESH_TOKEN
          valueFrom:
            secretKeyRef:
              name: frigate-secrets
              key: NEST_REFRESH_TOKEN
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            memory: 12Gi
        securityContext:
          privileged: true
          allowPrivilegeEscalation: true
        livenessProbe:
          httpGet:
            path: /api/version
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/version
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: config-dir
          mountPath: /config
        - name: frigate-config-volume
          mountPath: /config/config.yml
          subPath: config.yml
        - name: media
          mountPath: /media
        - name: cache
          mountPath: /dev/shm
        # - name: usb
        #   mountPath: /dev/bus/usb
      volumes:
      - name: config-dir
        persistentVolumeClaim:
          claimName: frigate-config
      - name: frigate-config-volume
        configMap:
          name: frigate-configmap
          defaultMode: 0644
      - name: media
        persistentVolumeClaim:
          claimName: frigate-media
      - name: cache
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
      # - name: usb
      #   hostPath:
      #     path: /dev/bus/usb
      #     type: Directory
