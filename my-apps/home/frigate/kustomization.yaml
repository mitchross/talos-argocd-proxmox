apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - vpa.yaml
  - deployment.yaml
  - namespace.yaml
  - pvc.yaml
  - mqtt/mqtt.yaml
  - service.yaml
  - servicemonitor.yaml
  - httproute.yaml
  - externalsecret.yaml
  - kopiur/frigate-config.yaml
namespace: frigate

# Uniform kopiur backup fields (repository, copyMethod, populator) for the per-PVC stub(s) in kopiur/.
components:
  - ../../common/kopiur-backup

# Hash-suffixed ConfigMaps roll the consumer on data change; do not set disableNameSuffixHash.
configMapGenerator:
  - name: frigate-configmap
    files:
      - config.yml
  - name: mosquitto-configmap
    files:
      - mqtt/mosquitto.conf
