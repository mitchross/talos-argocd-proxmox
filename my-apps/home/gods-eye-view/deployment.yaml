apiVersion: apps/v1
kind: Deployment
metadata:
  name: gods-eye-view
  labels:
    app.kubernetes.io/name: gods-eye-view
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gods-eye-view
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gods-eye-view
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gods-eye-view
          image: registry.vanillax.me/gods-eye-view:7596522-r1@sha256:8ed8ab155c10b43a3cd93adf9ac589f2fc102c5c0329cdb69194f208b93bf1e0
          command: [node, /opt/repo-scripts/start.mjs]
          env:
            - name: OPENSKY_AUTH_MODE
              value: anon
          ports:
            - name: http
              containerPort: 4173
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.gev-cache
            - name: logs
              mountPath: /app/.gev-logs
      volumes:
        - name: scripts
          configMap:
            name: gods-eye-view-scripts
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: cache
          emptyDir:
            sizeLimit: 1Gi
        - name: logs
          emptyDir:
            sizeLimit: 128Mi
