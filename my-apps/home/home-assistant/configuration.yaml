# Loads default set of integrations. Do not remove.
default_config:

# Apply per-entity overrides (friendly names, hide flags for homelab switches).
homeassistant:
  customize: !include customize.yaml

# Raise bellows/zigpy to debug HERE, not via the ZHA UI toggle — that toggle is runtime-only
# (in neither git nor .storage) and floods the log until someone clicks it off.
logger:
  default: info
  logs:
    bellows: warning
    zigpy: warning
    zha: info

# The ZHA integration itself is added via the UI (lives in .storage); this only loads the vendored
# AirCube quirk. Keep the trailing slash on the path — required on HA 2026.x.
zha:
  custom_quirks_path: /config/custom_zha_quirks/
  enable_quirks: true

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Text to speech
tts:
  - platform: google_translate

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# rssi/lqi excluded: they churn every update and bloat SQLite; long-term statistics are unaffected.
recorder:
  db_url: sqlite:////config/home-assistant_v2.db
  exclude:
    entity_globs:
      - sensor.*_rssi
      - sensor.*_lqi

# Only the metered plugs and the derived totals are exported. Household plugs stay out.
prometheus:
  requires_auth: false
  filter:
    include_entity_globs:
      - sensor.threadripper_*
      - sensor.nas_psu_*
      - sensor.truenas_*
      - sensor.hp_sff_*
      - sensor.hp_elite_*
      - sensor.gaming_pc_*
      - sensor.macbook_*
      # Solar-fed shed plug: watts/kWh only, no cost sensors.
      - sensor.shed_lab_*
      - sensor.solar_*
      - binary_sensor.solar_*
      - binary_sensor.gaming_pc_*
      - sensor.homelab_*
      - sensor.office_*
      - sensor.combined_*
      - sensor.current_electricity_rate
      - sensor.electricity_tariff_period
      # House-level data pushed by the consumers-energy-sync CronJob.
      - sensor.consumers_energy_*
      # StuckAtPrototype AirCube Zigbee air-quality monitor (temp/humidity/eCO2/
      # tVOC + rssi/lqi). Feeds the aircube-dashboard.json Grafana dashboard.
      - sensor.stuckatprototype_aircube_*

# Energy dashboard is configured in the UI: add each sensor.<dev>_energy sensor as Individual devices.
energy:

# Shed solar: the rpi4 (github.com/mitchross/epsolar) polls the EPEVER MPPT over Modbus and serves
# this JSON. kWh counters are the controller's own; sensors go unavailable if the Pi is down.
rest:
  - resource: http://192.168.10.174:8080/api/v1/status
    scan_interval: 30
    timeout: 10
    sensor:
      - name: "Solar PV Power"
        unique_id: solar_pv_power
        value_template: "{{ value_json.telemetry.pv_power }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "Solar PV Voltage"
        unique_id: solar_pv_voltage
        value_template: "{{ value_json.telemetry.pv_voltage }}"
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
      - name: "Solar Battery Voltage"
        unique_id: solar_battery_voltage
        value_template: "{{ value_json.telemetry.battery_voltage }}"
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
      - name: "Solar Battery SOC"
        unique_id: solar_battery_soc
        value_template: "{{ value_json.soc.percent | round(1) }}"
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
      - name: "Solar Battery SOC Controller"
        unique_id: solar_battery_soc_controller
        value_template: "{{ value_json.telemetry.battery_soc }}"
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
      - name: "Solar Battery Power"
        unique_id: solar_battery_power
        value_template: "{{ value_json.telemetry.net_battery_power | round(1) }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:battery-charging
      - name: "Solar Charge Power"
        unique_id: solar_charge_power
        value_template: "{{ value_json.telemetry.controller_charge_power }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
      - name: "Solar Load Power"
        unique_id: solar_load_power
        value_template: "{{ value_json.telemetry.load_power }}"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:power-plug
      - name: "Solar Charging State"
        unique_id: solar_charging_state
        value_template: "{{ value_json.telemetry.charging_state }}"
        icon: mdi:solar-power
      - name: "Solar Automation State"
        unique_id: solar_automation_state
        value_template: "{{ value_json.automation.state }}"
        icon: mdi:robot
      - name: "Solar Automation Reason"
        unique_id: solar_automation_reason
        value_template: "{{ value_json.automation.reason }}"
        icon: mdi:text
      - name: "Solar Generated Today"
        unique_id: solar_generated_today
        value_template: "{{ value_json.telemetry.generated_today_kwh }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
      - name: "Solar Generated Month"
        unique_id: solar_generated_month
        value_template: "{{ value_json.telemetry.generated_month_kwh }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
      - name: "Solar Generated Year"
        unique_id: solar_generated_year
        value_template: "{{ value_json.telemetry.generated_year_kwh }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
      - name: "Solar Generated Total"
        unique_id: solar_generated_total
        value_template: "{{ value_json.telemetry.generated_total_kwh }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
      - name: "Solar Consumed Today"
        unique_id: solar_consumed_today
        value_template: "{{ value_json.telemetry.consumed_today_kwh }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
      - name: "Solar Consumed Month"
        unique_id: solar_consumed_month
        value_template: "{{ value_json.telemetry.consumed_month_kwh }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
      - name: "Solar Consumed Total"
        unique_id: solar_consumed_total
        value_template: "{{ value_json.telemetry.consumed_total_kwh }}"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
      - name: "Solar Battery Energy Remaining"
        unique_id: solar_battery_energy_remaining
        value_template: "{{ value_json.energy.estimated_energy_remaining_wh | round(0) }}"
        unit_of_measurement: "Wh"
        device_class: energy_storage
        state_class: measurement
      - name: "Solar Runtime Remaining"
        unique_id: solar_runtime_remaining
        value_template: "{{ value_json.energy.estimated_runtime_minutes | round(0) }}"
        unit_of_measurement: "min"
        device_class: duration
        state_class: measurement
        icon: mdi:timer-sand
      - name: "Solar Battery Temperature"
        unique_id: solar_battery_temperature
        value_template: "{{ value_json.telemetry.battery_temperature }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      - name: "Solar Controller Temperature"
        unique_id: solar_controller_temperature
        value_template: "{{ value_json.telemetry.controller_temperature }}"
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
      - name: "Solar Last Update"
        unique_id: solar_last_update
        value_template: "{{ value_json.telemetry.timestamp }}"
        device_class: timestamp
    binary_sensor:
      - name: "Solar Load On"
        unique_id: solar_load_on
        value_template: "{{ value_json.telemetry.load_on }}"
        device_class: power
      - name: "Solar Controller Online"
        unique_id: solar_controller_online
        value_template: "{{ value_json.telemetry.connected }}"
        device_class: connectivity
      - name: "Solar Fault"
        unique_id: solar_fault
        value_template: "{{ value_json.telemetry.fault_active }}"
        device_class: problem
      - name: "Solar Automation Armed"
        unique_id: solar_automation_armed
        value_template: "{{ value_json.automation_armed }}"

# Enable the person integration
person:

# YAML-defined extra dashboard for homelab power (default Lovelace dashboard
# stays in storage mode so the UI editor keeps working).
lovelace:
  dashboards:
    homelab-power:
      mode: yaml
      title: Homelab Power
      icon: mdi:server-network
      show_in_sidebar: true
      filename: lovelace-homelab-power.yaml

# Git is the source of truth: `initial:` resets each slider on HA restart, so permanent rate
# changes go here, not the UI. All-in rate = (energy + delivery_riders) * (1 + tax).
input_number:
  rate_summer_onpeak:
    name: "Rate — Summer On-Peak Energy"
    min: 0
    max: 1
    step: 0.000001
    mode: box
    unit_of_measurement: "USD/kWh"
    icon: mdi:cash-clock
    initial: 0.151904
  rate_summer_offpeak:
    name: "Rate — Summer Off-Peak Energy"
    min: 0
    max: 1
    step: 0.000001
    mode: box
    unit_of_measurement: "USD/kWh"
    icon: mdi:cash
    initial: 0.103970
  rate_nonsummer:
    name: "Rate — Non-Summer Energy"
    min: 0
    max: 1
    step: 0.000001
    mode: box
    unit_of_measurement: "USD/kWh"
    icon: mdi:cash
    initial: 0.082996
  rate_delivery_riders:
    name: "Rate — Delivery Riders (per kWh)"
    min: 0
    max: 1
    step: 0.000001
    mode: box
    unit_of_measurement: "USD/kWh"
    icon: mdi:transmission-tower
    initial: 0.122077
  rate_sales_tax_pct:
    name: "Rate — Sales Tax"
    min: 0
    max: 20
    step: 0.1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:percent
    initial: 4.0
  # The Gaming PC idles ~200 W and games at 450-600 W; above this counts as a session.
  gaming_pc_active_threshold_w:
    name: "Gaming PC — Active Threshold"
    min: 200
    max: 800
    step: 10
    mode: box
    unit_of_measurement: "W"
    icon: mdi:controller
    initial: 350

# Cost integrates a live USD/h cost-rate (power * current TOU rate), not a fixed tariff.
# Every integral starts at 0 when first created; totals only fill in as data accumulates.
# Each `name:` slug MUST equal the entity prefix: HA derives the entity_id from `name`, and a
# mismatch makes every template/dashboard reference silently read nothing.
sensor:
  # --- energy (kWh): one integral per plug, one per group ---
  - platform: integration
    source: sensor.threadripper_current_consumption
    name: "Threadripper Energy"
    unique_id: threadripper_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.nas_psu_current_consumption
    name: "NAS PSU Energy"
    unique_id: nas_psu_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.truenas_current_consumption
    name: "TrueNAS Energy"
    unique_id: truenas_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.hp_sff_current_consumption
    name: "HP SFF Energy"
    unique_id: hp_sff_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.hp_elite_current_consumption
    name: "HP Elite Energy"
    unique_id: hp_elite_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.gaming_pc_current_consumption
    name: "Gaming PC Energy"
    unique_id: gaming_pc_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.macbook_current_consumption
    name: "MacBook Energy"
    unique_id: macbook_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.shed_lab_current_consumption
    name: "Shed Lab Energy"
    unique_id: shed_lab_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.homelab_total_power
    name: "Homelab Total Energy"
    unique_id: homelab_total_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.office_total_power
    name: "Office Total Energy"
    unique_id: office_total_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.combined_total_power
    name: "Combined Total Energy"
    unique_id: combined_total_energy
    unit_prefix: k
    round: 3
    method: left

  # --- cost (USD): integrates the USD/h cost-rate ---
  - platform: integration
    source: sensor.threadripper_cost_rate
    name: "Threadripper Cost"
    unique_id: threadripper_cost
    unit_time: h
    round: 4
    method: left
  - platform: integration
    source: sensor.nas_psu_cost_rate
    name: "NAS PSU Cost"
    unique_id: nas_psu_cost
    unit_time: h
    round: 4
    method: left
  - platform: integration
    source: sensor.truenas_cost_rate
    name: "TrueNAS Cost"
    unique_id: truenas_cost
    unit_time: h
    round: 4
    method: left
  - platform: integration
    source: sensor.hp_sff_cost_rate
    name: "HP SFF Cost"
    unique_id: hp_sff_cost
    unit_time: h
    round: 4
    method: left
  - platform: integration
    source: sensor.hp_elite_cost_rate
    name: "HP Elite Cost"
    unique_id: hp_elite_cost
    unit_time: h
    round: 4
    method: left
  - platform: integration
    source: sensor.gaming_pc_cost_rate
    name: "Gaming PC Cost"
    unique_id: gaming_pc_cost
    unit_time: h
    round: 4
    method: left
  - platform: integration
    source: sensor.macbook_cost_rate
    name: "MacBook Cost"
    unique_id: macbook_cost
    unit_time: h
    round: 4
    method: left
  # --- gaming sessions: only the watts drawn while binary_sensor.gaming_pc_gaming is on ---
  - platform: integration
    source: sensor.gaming_pc_gaming_power
    name: "Gaming PC Gaming Energy"
    unique_id: gaming_pc_gaming_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.gaming_pc_gaming_cost_rate
    name: "Gaming PC Gaming Cost"
    unique_id: gaming_pc_gaming_cost
    unit_time: h
    round: 4
    method: left
  # 1 while gaming, else 0, integrated over hours = hours gamed. Survives the recorder purge.
  - platform: integration
    source: sensor.gaming_pc_gaming_flag
    name: "Gaming PC Gaming Hours"
    unique_id: gaming_pc_gaming_hours
    unit_time: h
    round: 3
    method: left
  - platform: history_stats
    name: "Gaming PC Sessions Today"
    unique_id: gaming_pc_sessions_today
    entity_id: binary_sensor.gaming_pc_gaming
    state: "on"
    type: count
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: integration
    source: sensor.homelab_cost_rate
    name: "Homelab Cost"
    unique_id: homelab_cost
    unit_time: h
    round: 4
    method: left
  - platform: integration
    source: sensor.office_cost_rate
    name: "Office Cost"
    unique_id: office_cost
    unit_time: h
    round: 4
    method: left
  - platform: integration
    source: sensor.combined_cost_rate
    name: "Combined Cost"
    unique_id: combined_cost
    unit_time: h
    round: 4
    method: left

