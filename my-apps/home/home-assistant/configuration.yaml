# Loads default set of integrations. Do not remove.
default_config:

# Apply per-entity overrides (friendly names, hide flags for homelab switches).
homeassistant:
  customize: !include customize.yaml

# Raise bellows/zigpy to debug HERE, not via the ZHA UI toggle — that toggle is runtime-only
# (in neither git nor .storage) and floods the log until someone clicks it off.
logger:
  default: info
  logs:
    bellows: warning
    zigpy: warning
    zha: info

# The ZHA integration itself is added via the UI (lives in .storage); this only loads the vendored
# AirCube quirk. Keep the trailing slash on the path — required on HA 2026.x.
zha:
  custom_quirks_path: /config/custom_zha_quirks/
  enable_quirks: true

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Text to speech
tts:
  - platform: google_translate

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# rssi/lqi excluded: they churn every update and bloat SQLite; long-term statistics are unaffected.
recorder:
  db_url: sqlite:////config/home-assistant_v2.db
  exclude:
    entity_globs:
      - sensor.*_rssi
      - sensor.*_lqi

# Only the metered plugs and the derived totals are exported. Household plugs stay out.
prometheus:
  requires_auth: false
  filter:
    include_entity_globs:
      - sensor.threadripper_*
      - sensor.nas_psu_*
      - sensor.truenas_*
      - sensor.hp_sff_*
      - sensor.hp_elite_*
      - sensor.gaming_pc_*
      - sensor.macbook_*
      - sensor.homelab_*
      - sensor.office_*
      - sensor.combined_*
      - sensor.current_electricity_rate
      - sensor.electricity_tariff_period
      # House-level data pushed by the consumers-energy-sync CronJob.
      - sensor.consumers_energy_*
      # StuckAtPrototype AirCube Zigbee air-quality monitor (temp/humidity/eCO2/
      # tVOC + rssi/lqi). Feeds the aircube-dashboard.json Grafana dashboard.
      - sensor.stuckatprototype_aircube_*

# Energy dashboard is configured in the UI: add each sensor.<dev>_energy sensor as Individual devices.
energy:

# Enable the person integration
person:

# YAML-defined extra dashboard for homelab power (default Lovelace dashboard
# stays in storage mode so the UI editor keeps working).
lovelace:
  dashboards:
    homelab-power:
      mode: yaml
      title: Homelab Power
      icon: mdi:server-network
      show_in_sidebar: true
      filename: lovelace-homelab-power.yaml

# Git is the source of truth: `initial:` resets each slider on HA restart, so permanent rate
# changes go here, not the UI. All-in rate = (energy + delivery_riders) * (1 + tax).
input_number:
  rate_summer_onpeak:
    name: "Rate — Summer On-Peak Energy"
    min: 0
    max: 1
    step: 0.000001
    mode: box
    unit_of_measurement: "USD/kWh"
    icon: mdi:cash-clock
    initial: 0.151904
  rate_summer_offpeak:
    name: "Rate — Summer Off-Peak Energy"
    min: 0
    max: 1
    step: 0.000001
    mode: box
    unit_of_measurement: "USD/kWh"
    icon: mdi:cash
    initial: 0.103970
  rate_nonsummer:
    name: "Rate — Non-Summer Energy"
    min: 0
    max: 1
    step: 0.000001
    mode: box
    unit_of_measurement: "USD/kWh"
    icon: mdi:cash
    initial: 0.082996
  rate_delivery_riders:
    name: "Rate — Delivery Riders (per kWh)"
    min: 0
    max: 1
    step: 0.000001
    mode: box
    unit_of_measurement: "USD/kWh"
    icon: mdi:transmission-tower
    initial: 0.122077
  rate_sales_tax_pct:
    name: "Rate — Sales Tax"
    min: 0
    max: 20
    step: 0.1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:percent
    initial: 4.0

# Cost integrates a live USD/h cost-rate (power * current TOU rate), not a fixed tariff.
# Every integral starts at 0 when first created; totals only fill in as data accumulates.
# Each `name:` slug MUST equal the entity prefix: HA derives the entity_id from `name`, and a
# mismatch makes every template/dashboard reference silently read nothing.
sensor:
  # --- energy (kWh): one integral per plug, one per group ---
  - platform: integration
    source: sensor.threadripper_current_consumption
    name: "Threadripper Energy"
    unique_id: threadripper_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.nas_psu_current_consumption
    name: "NAS PSU Energy"
    unique_id: nas_psu_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.truenas_current_consumption
    name: "TrueNAS Energy"
    unique_id: truenas_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.hp_sff_current_consumption
    name: "HP SFF Energy"
    unique_id: hp_sff_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.hp_elite_current_consumption
    name: "HP Elite Energy"
    unique_id: hp_elite_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.gaming_pc_current_consumption
    name: "Gaming PC Energy"
    unique_id: gaming_pc_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.macbook_current_consumption
    name: "MacBook Energy"
    unique_id: macbook_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.homelab_total_power
    name: "Homelab Total Energy"
    unique_id: homelab_total_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.office_total_power
    name: "Office Total Energy"
    unique_id: office_total_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.combined_total_power
    name: "Combined Total Energy"
    unique_id: combined_total_energy
    unit_prefix: k
    round: 3
    method: left

  # --- cost (USD): integrates the USD/h cost-rate ---
  - platform: integration
    source: sensor.threadripper_cost_rate
    name: "Threadripper Cost"
    unique_id: threadripper_cost
    unit_time: h
    round: 4
    method: left
  - platform: integration
    source: sensor.nas_psu_cost_rate
    name: "NAS PSU Cost"
    unique_id: nas_psu_cost
    unit_time: h
    round: 4
    method: left
  - platform: integration
    source: sensor.truenas_cost_rate
    name: "TrueNAS Cost"
    unique_id: truenas_cost
    unit_time: h
    round: 4
    method: left
  - platform: integration
    source: sensor.hp_sff_cost_rate
    name: "HP SFF Cost"
    unique_id: hp_sff_cost
    unit_time: h
    round: 4
    method: left
  - platform: integration
    source: sensor.hp_elite_cost_rate
    name: "HP Elite Cost"
    unique_id: hp_elite_cost
    unit_time: h
    round: 4
    method: left
  - platform: integration
    source: sensor.gaming_pc_cost_rate
    name: "Gaming PC Cost"
    unique_id: gaming_pc_cost
    unit_time: h
    round: 4
    method: left
  - platform: integration
    source: sensor.macbook_cost_rate
    name: "MacBook Cost"
    unique_id: macbook_cost
    unit_time: h
    round: 4
    method: left
  - platform: integration
    source: sensor.homelab_cost_rate
    name: "Homelab Cost"
    unique_id: homelab_cost
    unit_time: h
    round: 4
    method: left
  - platform: integration
    source: sensor.office_cost_rate
    name: "Office Cost"
    unique_id: office_cost
