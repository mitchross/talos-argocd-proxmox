# Loads default set of integrations. Do not remove.
default_config:

# Apply per-entity overrides (friendly names, hide flags for homelab switches).
homeassistant:
  customize: !include customize.yaml

# Raise bellows/zigpy to debug HERE, not via the ZHA UI toggle — that toggle is runtime-only
# (in neither git nor .storage) and floods the log until someone clicks it off.
logger:
  default: info
  logs:
    bellows: warning
    zigpy: warning
    zha: info

# The ZHA integration itself is added via the UI (lives in .storage); this only loads the vendored
# AirCube quirk. Keep the trailing slash on the path — required on HA 2026.x.
zha:
  custom_quirks_path: /config/custom_zha_quirks/
  enable_quirks: true

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# Text to speech
tts:
  - platform: google_translate

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# rssi/lqi excluded: they churn every update and bloat SQLite; long-term statistics are unaffected.
recorder:
  db_url: sqlite:////config/home-assistant_v2.db
  exclude:
    entity_globs:
      - sensor.*_rssi
      - sensor.*_lqi

# Metered homelab + workstation plugs. Household plugs and the garage fridge are
# deliberately excluded. Entity prefixes are frozen to preserve history: gpu_psu is
# the Threadripper host, basement_homelab_* is the garage fridge.
prometheus:
  requires_auth: false
  filter:
    include_entity_globs:
      - sensor.gpu_psu_*
      - sensor.nas_psu_*
      - sensor.truenas_server_*
      - sensor.hp_sff_*
      - sensor.shed_lab_*
      - sensor.gaming_pc_*
      - sensor.hp_elite_estimated_*
      - sensor.homelab_total_*
      - sensor.homelab_grid_*
      - sensor.homelab_cost_*
      - sensor.current_electricity_rate
      - sensor.electricity_tariff_period
      # StuckAtPrototype AirCube Zigbee air-quality monitor (temp/humidity/eCO2/
      # tVOC + rssi/lqi). Feeds the aircube-dashboard.json Grafana dashboard.
      - sensor.stuckatprototype_aircube_*
    exclude_entity_globs:
      - sensor.basement_homelab_* # garage fridge — plug was renamed, entity_ids were not
      - sensor.dryer_smart_plug_*
      - sensor.office_smart_plug_*
      - sensor.office2_smart_plug_*
      - sensor.tv_smart_plug_*

# Energy dashboard is configured in the UI: add each sensor.<dev>_energy sensor as Individual devices.
energy:

# Enable the person integration
person:

# YAML-defined extra dashboard for homelab power (default Lovelace dashboard
# stays in storage mode so the UI editor keeps working).
lovelace:
  dashboards:
    homelab-power:
      mode: yaml
      title: Homelab Power
      icon: mdi:server-network
      show_in_sidebar: true
      filename: lovelace-homelab-power.yaml

# Git is the source of truth: `initial:` resets each slider on HA restart, so permanent rate
# changes go here, not the UI. All-in rate = (energy + delivery_riders) * (1 + tax).
input_number:
  rate_summer_onpeak:
    name: "Rate — Summer On-Peak Energy"
    min: 0
    max: 1
    step: 0.000001
    mode: box
    unit_of_measurement: "USD/kWh"
    icon: mdi:cash-clock
    initial: 0.151904
  rate_summer_offpeak:
    name: "Rate — Summer Off-Peak Energy"
    min: 0
    max: 1
    step: 0.000001
    mode: box
    unit_of_measurement: "USD/kWh"
    icon: mdi:cash
    initial: 0.103970
  rate_nonsummer:
    name: "Rate — Non-Summer Energy"
    min: 0
    max: 1
    step: 0.000001
    mode: box
    unit_of_measurement: "USD/kWh"
    icon: mdi:cash
    initial: 0.082996
  rate_delivery_riders:
    name: "Rate — Delivery Riders (per kWh)"
    min: 0
    max: 1
    step: 0.000001
    mode: box
    unit_of_measurement: "USD/kWh"
    icon: mdi:transmission-tower
    initial: 0.120887
  rate_sales_tax_pct:
    name: "Rate — Sales Tax"
    min: 0
    max: 20
    step: 0.1
    mode: box
    unit_of_measurement: "%"
    icon: mdi:percent
    initial: 6.0
  hp_elite_estimated_watts:
    name: "HP Elite (estimated) — Assumed Draw"
    min: 0
    max: 400
    step: 1
    mode: box
    unit_of_measurement: "W"
    icon: mdi:help-circle-outline
    initial: 30

# Cost integrates a live USD/h cost-rate (power * current TOU rate), not a fixed tariff.
# Every integral starts at 0 when first created; totals only fill in as data accumulates.
sensor:
  # --- per-device energy (kWh) ---
  - platform: integration
    source: sensor.gpu_psu_current_consumption
    name: "GPU PSU Energy"
    unique_id: gpu_psu_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.nas_psu_current_consumption
    name: "NAS PSU Energy"
    unique_id: nas_psu_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.truenas_server_current_consumption
    name: "TrueNAS Server Energy"
    unique_id: truenas_server_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.hp_sff_current_consumption
    name: "HP SFF Energy"
    unique_id: hp_sff_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.shed_lab_current_consumption
    name: "Shed Lab Energy"
    unique_id: shed_lab_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.gaming_pc_current_consumption
    name: "Gaming PC Energy"
    unique_id: gaming_pc_energy
    unit_prefix: k
    round: 3
    method: left
  - platform: integration
    source: sensor.hp_elite_estimated_current_consumption
    name: "HP Elite Estimated Energy"
    unique_id: hp_elite_estimated_energy
    unit_prefix: k
    round: 3
    method: left

  # --- homelab total energy (kWh) — feeds weekly/monthly/yearly meters ---
  - platform: integration
    source: sensor.homelab_total_power
    name: "Homelab Total Energy"
    unique_id: homelab_total_energy
    unit_prefix: k
    round: 3
    method: left

  # --- per-device cumulative cost (USD) — integrates the USD/h cost-rate ---
  - platform: integration
    source: sensor.gpu_psu_cost_rate
    name: "GPU PSU Cost"
    unique_id: gpu_psu_cost
    unit_time: h
    round: 4
    method: left
  - platform: integration
    source: sensor.nas_psu_cost_rate
    name: "NAS PSU Cost"
    unique_id: nas_psu_cost
    unit_time: h
    round: 4
    method: left
  - platform: integration
    source: sensor.truenas_server_cost_rate
    name: "TrueNAS Server Cost"
    unique_id: truenas_server_cost
    unit_time: h
    round: 4
    method: left
  - platform: integration
    source: sensor.hp_sff_cost_rate
    name: "HP SFF Cost"
    unique_id: hp_sff_cost
    unit_time: h
    round: 4
    method: left
  - platform: integration
    source: sensor.shed_lab_cost_rate
    name: "Shed Lab Cost"
    unique_id: shed_lab_cost
    unit_time: h
    round: 4
    method: left
  - platform: integration
    source: sensor.gaming_pc_cost_rate
    name: "Gaming PC Cost"
    unique_id: gaming_pc_cost
    unit_time: h
    round: 4
    method: left
  - platform: integration
    source: sensor.hp_elite_estimated_cost_rate
    name: "HP Elite Estimated Cost"
    unique_id: hp_elite_estimated_cost
    unit_time: h
    round: 4
    method: left

  # --- homelab total cumulative cost (USD) ---
  - platform: integration
    source: sensor.homelab_cost_rate
    name: "Homelab Cost"
    unique_id: homelab_cost
    unit_time: h
    round: 4
    method: left

