        unit_of_measurement: "USD/h"
        state_class: measurement
        icon: mdi:cash-fast
        state: >
          {{ (states('sensor.gaming_pc_current_consumption') | float(0) / 1000
            * states('sensor.current_electricity_rate') | float(0)) | round(4) }}

      - name: "MacBook Cost Rate"
