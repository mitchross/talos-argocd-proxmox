# Template sensors: live all-in rate, tariff window, group totals, per-device cost-rate and share.
template:
  # Gaming = plug draw above the threshold; 5 min of quiet ends the session (menus, loading).
  - binary_sensor:
      - name: "Gaming PC Gaming"
        unique_id: gaming_pc_gaming
        icon: mdi:controller
        delay_off: "00:05:00"
        state: >
          {{ states('sensor.gaming_pc_current_consumption') | float(0)
             > states('input_number.gaming_pc_active_threshold_w') | float(350) }}
  - sensor:
      - name: "Gaming PC Gaming Flag"
        unique_id: gaming_pc_gaming_flag
        state_class: measurement
        icon: mdi:controller
        state: "{{ 1 if is_state('binary_sensor.gaming_pc_gaming', 'on') else 0 }}"

      - name: "Gaming PC Gaming Power"
        unique_id: gaming_pc_gaming_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ states('sensor.gaming_pc_current_consumption') | float(0)
             if is_state('binary_sensor.gaming_pc_gaming', 'on') else 0 }}

      - name: "Gaming PC Gaming Cost Rate"
        unique_id: gaming_pc_gaming_cost_rate
        unit_of_measurement: "USD/h"
        state_class: measurement
        icon: mdi:cash-fast
        state: >
          {{ (states('sensor.gaming_pc_gaming_power') | float(0) / 1000
            * states('sensor.current_electricity_rate') | float(0)) | round(4) }}

      # Idle tax: what the PC costs when nobody is gaming (total minus gaming).
      - name: "Gaming PC Idle Cost Daily"
        unique_id: gaming_pc_idle_cost_daily
        unit_of_measurement: "USD"
        state_class: total
        icon: mdi:sleep
        state: >
          {{ (states('sensor.gaming_pc_cost_daily') | float(0)
            - states('sensor.gaming_pc_gaming_cost_daily') | float(0)) | round(4) }}

      - name: "Gaming PC Idle Cost Monthly"
        unique_id: gaming_pc_idle_cost_monthly
        unit_of_measurement: "USD"
        state_class: total
        icon: mdi:sleep
        state: >
          {{ (states('sensor.gaming_pc_cost_monthly') | float(0)
            - states('sensor.gaming_pc_gaming_cost_monthly') | float(0)) | round(4) }}

      - name: "Gaming PC Gaming Cost Last Month"
        unique_id: gaming_pc_gaming_cost_last_month
        unit_of_measurement: "USD"
        icon: mdi:calendar-check
        state_class: total
        state: >
          {{ state_attr('sensor.gaming_pc_gaming_cost_monthly', 'last_period') | float(0) | round(4) }}

      - name: "Gaming PC Gaming Hours Last Month"
        unique_id: gaming_pc_gaming_hours_last_month
        unit_of_measurement: "h"
        icon: mdi:calendar-check
        state_class: total
        state: >
          {{ state_attr('sensor.gaming_pc_gaming_hours_monthly', 'last_period') | float(0) | round(2) }}

      - name: "Gaming PC Cost Per Gaming Hour"
        unique_id: gaming_pc_cost_per_gaming_hour
        unit_of_measurement: "USD/h"
        state_class: measurement
        icon: mdi:cash-clock
        availability: "{{ states('sensor.gaming_pc_gaming_hours_monthly') | float(0) > 0.25 }}"
        state: >
          {{ (states('sensor.gaming_pc_gaming_cost_monthly') | float(0)
            / states('sensor.gaming_pc_gaming_hours_monthly') | float(1)) | round(3) }}

      # now()-based templates re-render every minute; float(<bill default>) keeps this right
      # before the input_number sliders are first touched.
      # Summer is June-August: September bills at the non-summer rate.
      - name: "Current Electricity Rate"
        unique_id: current_electricity_rate
        unit_of_measurement: "USD/kWh"
        state_class: measurement
        icon: mdi:cash-multiple
        state: >
          {% set n = now() %}
          {% set summer = n.month in [6, 7, 8] %}
          {% set onpeak = summer and n.weekday() < 5 and 14 <= n.hour < 19 %}
          {% if onpeak %}
            {% set e = states('input_number.rate_summer_onpeak') | float(0.151904) %}
          {% elif summer %}
            {% set e = states('input_number.rate_summer_offpeak') | float(0.103970) %}
          {% else %}
            {% set e = states('input_number.rate_nonsummer') | float(0.082996) %}
          {% endif %}
          {% set r = states('input_number.rate_delivery_riders') | float(0.122077) %}
          {% set t = states('input_number.rate_sales_tax_pct') | float(4) %}
          {{ ((e + r) * (1 + t / 100)) | round(5) }}

      - name: "Electricity Tariff Period"
        unique_id: electricity_tariff_period
        icon: mdi:clock-outline
        state: >
          {% set n = now() %}
          {% set summer = n.month in [6, 7, 8] %}
          {% set onpeak = summer and n.weekday() < 5 and 14 <= n.hour < 19 %}
          {% if onpeak %}Summer On-Peak
          {% elif summer %}Summer Off-Peak
          {% else %}Non-Summer{% endif %}

      # ----- group totals (W). homelab = always-on servers, office = workstations, combined = both -----
      - name: "Homelab Total Power"
        unique_id: homelab_total_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.threadripper_current_consumption') not in ['unknown','unavailable']
             or states('sensor.nas_psu_current_consumption') not in ['unknown','unavailable']
             or states('sensor.truenas_current_consumption') not in ['unknown','unavailable']
             or states('sensor.hp_sff_current_consumption') not in ['unknown','unavailable']
             or states('sensor.hp_elite_current_consumption') not in ['unknown','unavailable'] }}
        state: >
          {{ (states('sensor.threadripper_current_consumption') | float(0)
            + states('sensor.nas_psu_current_consumption') | float(0)
            + states('sensor.truenas_current_consumption') | float(0)
            + states('sensor.hp_sff_current_consumption') | float(0)
            + states('sensor.hp_elite_current_consumption') | float(0)) | round(1) }}

      - name: "Office Total Power"
        unique_id: office_total_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.gaming_pc_current_consumption') not in ['unknown','unavailable']
             or states('sensor.macbook_current_consumption') not in ['unknown','unavailable'] }}
        state: >
          {{ (states('sensor.gaming_pc_current_consumption') | float(0)
            + states('sensor.macbook_current_consumption') | float(0)) | round(1) }}

      - name: "Combined Total Power"
        unique_id: combined_total_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: >
          {{ states('sensor.threadripper_current_consumption') not in ['unknown','unavailable']
             or states('sensor.nas_psu_current_consumption') not in ['unknown','unavailable']
             or states('sensor.truenas_current_consumption') not in ['unknown','unavailable']
             or states('sensor.hp_sff_current_consumption') not in ['unknown','unavailable']
             or states('sensor.hp_elite_current_consumption') not in ['unknown','unavailable']
             or states('sensor.gaming_pc_current_consumption') not in ['unknown','unavailable']
             or states('sensor.macbook_current_consumption') not in ['unknown','unavailable'] }}
        state: >
          {{ (states('sensor.threadripper_current_consumption') | float(0)
            + states('sensor.nas_psu_current_consumption') | float(0)
            + states('sensor.truenas_current_consumption') | float(0)
            + states('sensor.hp_sff_current_consumption') | float(0)
            + states('sensor.hp_elite_current_consumption') | float(0)
            + states('sensor.gaming_pc_current_consumption') | float(0)
            + states('sensor.macbook_current_consumption') | float(0)) | round(1) }}

      # ----- live USD/h cost-rate (power_kW * current all-in rate) -----
      - name: "Homelab Cost Rate"
        unique_id: homelab_cost_rate
        unit_of_measurement: "USD/h"
        state_class: measurement
        icon: mdi:cash-fast
        state: >
          {{ (states('sensor.homelab_total_power') | float(0) / 1000
            * states('sensor.current_electricity_rate') | float(0)) | round(4) }}

      - name: "Office Cost Rate"
        unique_id: office_cost_rate
        unit_of_measurement: "USD/h"
        state_class: measurement
        icon: mdi:cash-fast
        state: >
          {{ (states('sensor.office_total_power') | float(0) / 1000
            * states('sensor.current_electricity_rate') | float(0)) | round(4) }}

      - name: "Combined Cost Rate"
        unique_id: combined_cost_rate
        unit_of_measurement: "USD/h"
        state_class: measurement
        icon: mdi:cash-fast
        state: >
          {{ (states('sensor.combined_total_power') | float(0) / 1000
            * states('sensor.current_electricity_rate') | float(0)) | round(4) }}

      - name: "Threadripper Cost Rate"
        unique_id: threadripper_cost_rate
        unit_of_measurement: "USD/h"
        state_class: measurement
        icon: mdi:cash-fast
        state: >
          {{ (states('sensor.threadripper_current_consumption') | float(0) / 1000
            * states('sensor.current_electricity_rate') | float(0)) | round(4) }}

      - name: "NAS PSU Cost Rate"
        unique_id: nas_psu_cost_rate
        unit_of_measurement: "USD/h"
        state_class: measurement
        icon: mdi:cash-fast
        state: >
          {{ (states('sensor.nas_psu_current_consumption') | float(0) / 1000
            * states('sensor.current_electricity_rate') | float(0)) | round(4) }}

      - name: "TrueNAS Cost Rate"
        unique_id: truenas_cost_rate
