apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/component: home-automation
    app.kubernetes.io/part-of: smart-home
    app.kubernetes.io/version: stable
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
        app.kubernetes.io/component: home-automation
        app.kubernetes.io/part-of: smart-home
        app.kubernetes.io/version: stable
    spec:
      # Pod-level security context
      securityContext:
        fsGroup: 0
        fsGroupChangePolicy: "OnRootMismatch"
      # Add restart policy for better reliability
      restartPolicy: Always
      # Follow the Zigbee dongle: NFD labels whichever node it is USB-passed to
      # (zigbee-dongle-rule). A hardcoded node class breaks when the dongle moves VMs.
      nodeSelector:
        feature.node.kubernetes.io/custom-usb.zigbee-coordinator: "true"
      tolerations:
        - key: node.vanillax.dev/link
          operator: Equal
          value: wifi
          effect: NoSchedule
      initContainers:
        - name: copy-config
          image: alpine:latest@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          command: ["/bin/sh", "-c"]
          args:
            - /opt/repo-scripts/copy-config.sh
          volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: config
              mountPath: /config
            - name: config-files
              mountPath: /config-source
        - name: install-hacs
          image: alpine:latest@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          command: ["/bin/sh", "-c"]
          args:
            - /opt/repo-scripts/install-hacs.sh
          volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: config
              mountPath: /config
      containers:
        - name: home-assistant
          image: "ghcr.io/home-assistant/home-assistant:2026.8.3" # pinned (was :stable — floating tag defeats Renovate + makes rollback/diff impossible)
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            # Needed to open the hostPath Zigbee device /dev/ttyUSB0; namespace PSS must stay enforce=privileged.
            privileged: true
          env:
            - name: TZ
              value: "America/New_York"
          ports:
            - containerPort: 8123
              name: http
              protocol: TCP
          # Health checks for better reliability
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          volumeMounts:
            - name: config
              mountPath: /config
            # SONOFF Zigbee coordinator passed through to ZHA.
            - name: zigbee-dongle
              mountPath: /dev/ttyUSB0
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
      volumes:
        - name: repo-scripts
          configMap:
            name: home-assistant-scripts
            defaultMode: 0555
        - name: config
          persistentVolumeClaim:
            claimName: config
        - name: config-files
          configMap:
            name: config
        # SONOFF Zigbee dongle char device (cp210x). If a second serial device ever
        # appears, switch to the stable /dev/serial/by-id/usb-… symlink target.
        - name: zigbee-dongle
          hostPath:
            path: /dev/ttyUSB0
            type: CharDevice
