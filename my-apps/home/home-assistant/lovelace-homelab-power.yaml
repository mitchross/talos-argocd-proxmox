# YAML-mode dashboard, wired via lovelace.dashboards.homelab-power in configuration.yaml.
# Cost = the all-in TOU rate from sensor.current_electricity_rate; long-term trends come from HA LTS.
# Layout: `sections` views, one question per section, most important top-left. The built-in
# Energy dashboard is the per-day ledger; this page is "what is it costing me, live".
title: Homelab Power
views:
  # ───────────────────────── Overview: the money question ─────────────────────────
  - title: Overview
    icon: mdi:server-network
    path: overview
    type: sections
    max_columns: 4
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Right now
            heading_style: title
            badges:
              - type: entity
                entity: sensor.electricity_tariff_period
                name: Tariff
              - type: entity
                entity: sensor.current_electricity_rate
                name: Rate
          - type: tile
            entity: sensor.homelab_total_power
            name: Homelab
            grid_options:
              columns: 6
              rows: 1
            color: blue
          - type: tile
            entity: sensor.office_total_power
            name: Office
            grid_options:
              columns: 6
              rows: 1
            color: purple
          - type: tile
            entity: sensor.shed_lab_current_consumption
            name: Shed (solar)
            grid_options:
              columns: 6
              rows: 1
            color: green
          - type: tile
            entity: sensor.combined_cost_rate
            name: Burn rate
            grid_options:
              columns: 6
              rows: 1
            color: amber
      - type: grid
        cards:
          - type: heading
            heading: This month
            heading_style: title
            badges:
              - type: entity
                entity: sensor.homelab_cost_last_month
                name: Homelab last month
          - type: tile
            entity: sensor.homelab_cost_monthly
            name: Homelab
            grid_options:
              columns: 6
              rows: 1
            color: blue
          - type: tile
            entity: sensor.office_cost_monthly
            name: Office
            grid_options:
              columns: 6
              rows: 1
            color: purple
          - type: tile
            entity: sensor.combined_cost_monthly
            name: Both together
            grid_options:
              columns: 6
              rows: 1
            color: amber
          - type: tile
            entity: sensor.consumers_energy_cost_month
            name: Whole house (CE)
            grid_options:
              columns: 6
              rows: 1
            color: grey
      - type: grid
        cards:
          - type: heading
            heading: Today
            heading_style: title
            badges:
              - type: entity
                entity: sensor.homelab_cost_yesterday
                name: Homelab yesterday
          - type: tile
            entity: sensor.homelab_cost_daily
            name: Homelab cost
            grid_options:
              columns: 6
              rows: 1
            color: blue
          - type: tile
            entity: sensor.office_cost_daily
            name: Office cost
            grid_options:
              columns: 6
              rows: 1
            color: purple
          - type: tile
            entity: sensor.homelab_total_energy_daily
            name: Homelab kWh
            grid_options:
              columns: 6
              rows: 1
            color: blue
          - type: tile
            entity: sensor.office_total_energy_daily
            name: Office kWh
            grid_options:
              columns: 6
              rows: 1
            color: purple
      - type: grid
        cards:
          - type: heading
            heading: Share of the house
            heading_style: title
            badges:
              - type: entity
                entity: sensor.consumers_energy_last_reading
                name: CE data through
          - type: tile
            entity: sensor.homelab_share_of_house
            name: Homelab
            grid_options:
              columns: 6
              rows: 1
            color: blue
          - type: tile
            entity: sensor.combined_share_of_house
            name: Homelab + office
            grid_options:
              columns: 6
              rows: 1
            color: amber
          - type: tile
            entity: sensor.consumers_energy_kwh_yesterday
            name: House yesterday
            grid_options:
              columns: 6
              rows: 1
            color: grey
          - type: tile
            entity: sensor.homelab_total_energy_yesterday
            name: Homelab yesterday
            grid_options:
              columns: 6
              rows: 1
            color: blue
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: House vs homelab, by day
            heading_style: title
          - type: statistics-graph
            title: 
            chart_type: bar
            period: day
            days_to_show: 30
            stat_types:
              - change
            entities:
              - consumers_energy:grid_kwh
              - sensor.homelab_total_energy
              - sensor.office_total_energy
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Draw, last 24 hours
            heading_style: title
          - type: history-graph
            title: 
            hours_to_show: 24
            refresh_interval: 60
            entities:
              - entity: sensor.homelab_total_power
                name: Homelab
              - entity: sensor.office_total_power
                name: Office
              - entity: sensor.shed_lab_current_consumption
                name: Shed (solar)
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Where the energy goes, by day
            heading_style: title
          - type: statistics-graph
            title: 
            chart_type: bar
            period: day
            days_to_show: 30
            stat_types:
              - change
            entities:
              - sensor.threadripper_energy
              - sensor.nas_psu_energy
              - sensor.truenas_energy
              - sensor.hp_sff_energy
              - sensor.hp_elite_energy
              - sensor.gaming_pc_energy
              - sensor.macbook_energy
              - sensor.shed_lab_energy
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Cost by month
            heading_style: title
          - type: statistics-graph
            title: 
            chart_type: bar
            period: month
            days_to_show: 365
            stat_types:
              - change
            entities:
              - sensor.homelab_cost
              - sensor.office_cost

