      - type: history-graph
        title: Power draw (24h)
        hours_to_show: 24
        refresh_interval: 30
        entities:
          - entity: sensor.threadripper_current_consumption
            name: Threadripper Host
          - entity: sensor.nas_psu_current_consumption
