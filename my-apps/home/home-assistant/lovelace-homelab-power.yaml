            heading_style: title
            badges:
              - type: entity
                entity: sensor.consumers_energy_last_reading
                name: Data through
          - type: tile
            entity: sensor.consumers_energy_kwh_yesterday
            name: kWh yesterday
            grid_options:
              columns: 6
              rows: 1
            color: grey
          - type: tile
            entity: sensor.consumers_energy_cost_yesterday
            name: Cost yesterday
            grid_options:
              columns: 6
              rows: 1
            color: grey
          - type: tile
            entity: sensor.consumers_energy_kwh_month
            name: kWh this month
            grid_options:
              columns: 6
              rows: 1
            color: grey
          - type: tile
            entity: sensor.consumers_energy_cost_month
            name: Cost this month
            grid_options:
              columns: 6
              rows: 1
            color: grey
          - type: tile
            entity: sensor.consumers_energy_kwh_last_month
            name: kWh last month
            grid_options:
              columns: 6
              rows: 1
            color: grey
          - type: tile
            entity: sensor.consumers_energy_cost_last_month
            name: Cost last month
            grid_options:
              columns: 6
              rows: 1
            color: grey
      - type: grid
        cards:
          - type: heading
            heading: Is the model right?
            heading_style: title
          - type: tile
            entity: sensor.consumers_energy_effective_rate
            name: CE charged (per kWh)
            grid_options:
              columns: 6
              rows: 1
            color: grey
          - type: tile
            entity: sensor.current_electricity_rate
            name: Model says
            grid_options:
              columns: 6
              rows: 1
            color: amber
          - type: tile
            entity: sensor.homelab_share_of_house
            name: Homelab share
            grid_options:
              columns: 6
              rows: 1
            color: blue
          - type: tile
            entity: sensor.combined_share_of_house
            name: Homelab + office
            grid_options:
              columns: 6
              rows: 1
            color: amber
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: House vs homelab, by day
            heading_style: title
          - type: statistics-graph
            title: 
            chart_type: bar
            period: day
            days_to_show: 60
            stat_types:
              - change
            entities:
              - consumers_energy:grid_kwh
              - sensor.homelab_total_energy
              - sensor.office_total_energy
      - type: grid
        cards:
          - type: heading
            heading: How this works
            heading_style: subtitle
          - type: markdown
            content: |
              A job logs into the Consumers Energy portal every afternoon and pulls the daily usage CSV.
              Consumers posts each day late the next morning, so **yesterday** is the newest number and
              today is always blank on the Energy dashboard. Cost is what CE actually billed for the day.

  # ───────────────────────── Solar: the shed ─────────────────────────
  - title: Solar
    icon: mdi:solar-power-variant
    path: solar
    type: sections
    max_columns: 4
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Right now
            heading_style: title
            badges:
              - type: entity
                entity: sensor.solar_charging_state
                name: Charging
              - type: entity
                entity: binary_sensor.solar_load_on
                name: LOAD
          - type: tile
            entity: sensor.solar_pv_power
            name: Watts in (PV)
            grid_options:
              columns: 6
              rows: 1
            color: green
          - type: tile
            entity: sensor.solar_battery_power
            name: Battery (+charge)
            grid_options:
              columns: 6
              rows: 1
            color: teal
          - type: tile
            entity: sensor.solar_load_power
            name: LOAD → Anker
            grid_options:
              columns: 6
              rows: 1
            color: orange
          - type: tile
            entity: sensor.shed_lab_current_consumption
            name: HP micro (Tapo)
            grid_options:
              columns: 6
              rows: 1
            color: green
      - type: grid
