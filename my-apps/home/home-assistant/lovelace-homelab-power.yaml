  # ───────────────────────── House: what Consumers Energy says ─────────────────────────
  - title: House
    icon: mdi:home-lightning-bolt
    path: house
    type: sections
    max_columns: 4
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
