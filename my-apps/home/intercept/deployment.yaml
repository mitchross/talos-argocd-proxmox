apiVersion: apps/v1
kind: Deployment
metadata:
  name: intercept
  namespace: intercept
  labels:
    app.kubernetes.io/name: intercept
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: intercept
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intercept
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      # Both Proxmox RTL-SDR mappings terminate on this Talos VM. The hostPath
      # below is node-local, so the pod must never move to another worker.
      nodeSelector:
        node.vanillax.dev/class: dell-gpu
      initContainers:
        - name: initialize-data
          image: docker.io/library/alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command:
            - /bin/sh
            - -c
            - >-
              mkdir -p /persist/instance
              /persist/weather_sat
              /persist/radiosonde
              /persist/subghz
              /persist/adsb
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: data
              mountPath: /persist
      containers:
        - name: intercept
          image: ghcr.io/smittix/intercept:main@sha256:72bb71edf69a6e26b356edcc83911f523029fc3eb6249d5b9a08857740afb3bf
          imagePullPolicy: IfNotPresent
          securityContext:
            # Upstream requires privileged access for libusb-based SDR tools.
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0
            runAsNonRoot: false
          env:
            - name: TZ
              value: America/Detroit
            - name: INTERCEPT_HOST
              value: 0.0.0.0
            - name: INTERCEPT_PORT
              value: "5050"
            - name: INTERCEPT_LOG_LEVEL
              value: INFO
            - name: INTERCEPT_ADSB_AUTO_START
              value: "false"
            - name: INTERCEPT_ADSB_HISTORY_ENABLED
              value: "true"
            - name: INTERCEPT_ADSB_DB_HOST
              value: intercept-postgres
            - name: INTERCEPT_ADSB_DB_PORT
              value: "5432"
            - name: INTERCEPT_ADSB_DB_NAME
              value: intercept_adsb
            - name: INTERCEPT_ADSB_DB_USER
              value: intercept
            - name: INTERCEPT_ADSB_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: intercept-postgres-secret
                  key: password
            - name: INTERCEPT_SHARED_OBSERVER_LOCATION
              value: "true"
            - name: INTERCEPT_REGION
              value: US
            # Intentional for LAN-only use. Do not bind the HTTPRoute to the
            # external Gateway without restoring application authentication.
            - name: INTERCEPT_DISABLE_AUTH
              value: "true"
          ports:
            - name: http
              containerPort: 5050
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 8Gi
          volumeMounts:
            # Persist the application database, credentials, settings, and
            # generated output without masking the Python modules in /app/data.
            - name: data
              mountPath: /app/instance
              subPath: instance
            - name: data
              mountPath: /app/data/weather_sat
              subPath: weather_sat
            - name: data
              mountPath: /app/data/radiosonde
              subPath: radiosonde
            - name: data
              mountPath: /app/data/subghz
              subPath: subghz
            - name: data
              mountPath: /app/data/adsb
              subPath: adsb
            # Mount the bus, not 001/003 and 001/004: USB device numbers can
            # change after a VM or hub restart, while both RTL2838s remain here.
            - name: usb-bus
              mountPath: /dev/bus/usb
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: intercept-data
        - name: usb-bus
          hostPath:
            path: /dev/bus/usb
            type: Directory
