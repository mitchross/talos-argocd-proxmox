apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: intercept

resources:
  - namespace.yaml
  - postgres-secret.yaml
  - pvc.yaml
  - kopiur/intercept-data.yaml
  - postgres/deployment.yaml
  - postgres/service.yaml
  - postgres/pvc.yaml
  - kopiur/postgres-data.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - vpa.yaml

components:
  - ../../common/kopiur-backup

configMapGenerator:
  - name: intercept-scripts
    files:
      - scripts/initialize-data.sh

# Recovery must never bind an empty volume when no backup matches.
patches:
  - target:
      group: kopiur.home-operations.com
      kind: Restore
      name: intercept-postgres-data-restore
    patch: |-
      - op: replace
        path: /spec/policy/onMissingSnapshot
        value: Fail
