apiVersion: apps/v1
kind: Deployment
metadata:
  name: intercept-postgres
  namespace: intercept
  labels:
    app.kubernetes.io/name: intercept-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: intercept-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intercept-postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          # Major upgrades require a dump/restore; the data directory is not
          # compatible across PostgreSQL major versions.
          image: docker.io/library/postgres:18.6
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_DB
              value: intercept_adsb
            - name: POSTGRES_USER
              value: intercept
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: intercept-postgres-secret
                  key: password
            - name: POSTGRES_INITDB_ARGS
              value: --data-checksums
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "intercept", "-d", "intercept_adsb"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "intercept", "-d", "intercept_adsb"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "intercept", "-d", "intercept_adsb"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
          env:
          - name: DATA_SOURCE_URI
            value: 127.0.0.1:5432/intercept_adsb?sslmode=disable
          - name: DATA_SOURCE_USER
            value: intercept
          - name: DATA_SOURCE_PASS
            valueFrom:
              secretKeyRef:
                name: intercept-postgres-secret
                key: password
          ports:
          - name: metrics
            containerPort: 9187
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: intercept-postgres-data
