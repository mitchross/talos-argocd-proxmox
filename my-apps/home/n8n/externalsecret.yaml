apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-litellm
  namespace: n8n
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: n8n-litellm
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: litellm
        property: master_key
