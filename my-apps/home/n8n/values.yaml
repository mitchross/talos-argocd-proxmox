image:
  repository: n8nio/n8n
  pullPolicy: IfNotPresent
  # Pinned (was :latest — floating tag defeats Renovate + makes rollback/diff impossible).
  # Renovate helm-values manager tracks minor/patch bumps from here.
  tag: "2.39.4"

main:
  replicaCount: 1
  deploymentStrategy:
    type: Recreate
  command: ["node", "/opt/repo-scripts/start-with-workflows.cjs"]
  extraVolumes:
    - name: gitops-scripts
      configMap:
        name: n8n-gitops-scripts
    - name: gitops-workflows
      configMap:
        name: n8n-gitops-workflows
    - name: litellm-credential
      secret:
        secretName: n8n-litellm
        defaultMode: 0440
  extraVolumeMounts:
    - name: gitops-scripts
      mountPath: /opt/repo-scripts
      readOnly: true
    - name: gitops-workflows
      mountPath: /opt/repo-workflows
      readOnly: true
    - name: litellm-credential
      mountPath: /var/run/litellm
      readOnly: true

  service:
    type: ClusterIP
    port: 80

  persistence:
    enabled: true
    type: existing
    existingClaim: data

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  extraEnv:
    N8N_BLOCK_ENV_ACCESS_IN_NODE:
      value: "true"
    N8N_HOST:
      value: n8n.vanillax.me
    N8N_PORT:
      value: "5678"
    N8N_PROTOCOL:
      value: https
    EXECUTIONS_MODE:
      value: regular
    EXECUTIONS_TIMEOUT:
      value: "3600"
    EXECUTIONS_TIMEOUT_MAX:
      value: "7200"
    N8N_METRICS:
      value: "true"
    N8N_DIAGNOSTICS_ENABLED:
      value: "false"
    WEBHOOK_URL:
      value: https://n8n.vanillax.me/
    GENERIC_TIMEZONE:
      value: America/New_York
    TZ:
      value: America/New_York

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - n8n
        topologyKey: kubernetes.io/hostname

  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

worker:
  extraEnv:
    N8N_BLOCK_ENV_ACCESS_IN_NODE:
      value: "true"
