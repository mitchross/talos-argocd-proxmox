# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
# Uniform fields come from ../../common/kopiur-backup; the mover securityContext stays per-PVC here (kopiur-mover-permissions.md).
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: paperless-postgres-data
  namespace: paperless-ngx
spec:
  sources:
    - pvc:
        name: paperless-postgres-data
  identity:
    username: paperless-postgres-data
    hostname: paperless-ngx
  hooks:
    beforeSnapshot:
      - workloadExec:
          podSelector:
            matchLabels:
              app: paperless-postgres
          container: postgres
          command: ["/bin/sh", "-c", "exec psql -v ON_ERROR_STOP=1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -c \"CHECKPOINT\""]
          timeout: 2m
  retention:
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  mover:
    securityContext:
      runAsUser: 999 # postgres uid:gid in the official image
      runAsGroup: 999
      runAsNonRoot: true
    podSecurityContext:
      fsGroup: 999
      supplementalGroups:
        - 999
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: paperless-postgres-data-hourly
  namespace: paperless-ngx
spec:
  policyRef:
    name: paperless-postgres-data
  schedule:
    # :4 hourly — distinct minute vs ALL schedules including the 3 AM daily
    # tier (hourly :MM collides with daily 03:MM).
    cron: "4 * * * *"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: paperless-postgres-data-restore
  namespace: paperless-ngx
spec:
  source:
    fromPolicy:
      name: paperless-postgres-data
      offset: 0
  mover:
    securityContext:
      runAsUser: 999
      runAsGroup: 999
      runAsNonRoot: true
    podSecurityContext:
      fsGroup: 999
      supplementalGroups:
        - 999
