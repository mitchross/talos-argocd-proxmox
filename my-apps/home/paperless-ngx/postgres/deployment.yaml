# In-app plain Postgres + kopiur (gitea pattern) — replaced the CNPG
# paperless-database cluster 2026-08-13 as a greenfield cutover (fresh empty
# database; no dump/restore). Document originals live on the media/data PVCs
# (kopiur-backed) and can be re-consumed; DB-side tags/metadata start fresh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-postgres
  namespace: paperless-ngx
  labels:
    app: paperless-postgres
spec:
  strategy:
    type: Recreate # RWO PVC — RollingUpdate deadlocks on Multi-Attach
  replicas: 1
  selector:
    matchLabels:
      app: paperless-postgres
  template:
    metadata:
      labels:
        app: paperless-postgres
    spec:
      # SIGINT (the image's STOPSIGNAL) triggers Postgres "fast shutdown":
      # it aborts open transactions and flushes cleanly. 60s covers a busy
      # checkpoint before the kubelet escalates to SIGKILL.
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999 # postgres uid:gid in the official image
      containers:
        - name: postgres
          # Pin MAJOR.MINOR — Renovate bumps patches/minors; MAJOR upgrades
          # need a manual dump/restore (Postgres data dirs are not
          # major-version compatible; majors are gated in renovate.json5).
          image: postgres:18.6
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5432
              name: postgres
          env:
            # First boot on an EMPTY volume creates this DB + user — the
            # whole database is declared right here. User/password come
            # from the same 1Password-fed secret the app already consumes
            # (PAPERLESS_DBUSER/PAPERLESS_DBPASS). On a restored
            # (non-empty) volume these are ignored and the restored data
            # wins.
            - name: POSTGRES_DB
              value: "paperless"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: paperless-app-secret
                  key: PAPERLESS_DBUSER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-app-secret
                  key: PAPERLESS_DBPASS
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            # Subdirectory keeps initdb happy on a fresh PVC (top-level
            # mount contains lost+found).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Probes expand $POSTGRES_USER rather than hardcoding it, because
          # the username lives in the secret (immich pattern).
          # A restored or crash-recovering database can take longer than a
          # fresh start; the startup probe suppresses liveness restarts
          # while PostgreSQL replays WAL after restore.
          startupProbe:
            exec:
              command:
                ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
        # Metrics sidecar — same pattern as gitea-postgres (reference:
        # docs/domains/cnpg/run-postgres-plain-english.md § Metrics).
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: DATA_SOURCE_URI
              value: "localhost:5432/paperless?sslmode=disable"
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: paperless-app-secret
                  key: PAPERLESS_DBUSER
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: paperless-app-secret
                  key: PAPERLESS_DBPASS
          ports:
            - containerPort: 9187
              name: metrics
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: paperless-postgres-data
