apiVersion: v1
kind: Service
metadata:
  name: paperless-postgres
  namespace: paperless-ngx
  labels:
    app: paperless-postgres
spec:
  selector:
    app: paperless-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
    - name: metrics
      port: 9187
      targetPort: 9187
