apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-nomad
  namespace: project-nomad
  labels:
    app: project-nomad
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: project-nomad
  template:
    metadata:
      labels:
        app: project-nomad
    spec:
      initContainers:
        - name: init-storage
          image: busybox:1.38
          command: ["sh", "-c", "mkdir -p /app/storage/logs"]
          volumeMounts:
            - name: nomad-storage
              mountPath: /app/storage
        - name: migrate
          image: ghcr.io/mitchross/project-nomad:sha-35016fd
          command: ["sh", "-c", "/opt/repo-scripts/migrate.sh"]
          envFrom:
            - configMapRef:
                name: project-nomad-config
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: project-nomad-secrets
                  key: APP_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: project-nomad-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: nomad-storage
              mountPath: /app/storage
      containers:
        - name: project-nomad
          image: ghcr.io/mitchross/project-nomad:sha-35016fd
          command: ["sh", "-c", "/opt/repo-scripts/start.sh"]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: project-nomad-config
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: project-nomad-secrets
                  key: APP_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: project-nomad-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 25m
              memory: 384Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: nomad-storage
              mountPath: /app/storage
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: repo-scripts
          configMap:
            name: project-nomad-scripts
            defaultMode: 0555
        - name: nomad-storage
          persistentVolumeClaim:
            claimName: nomad-storage
