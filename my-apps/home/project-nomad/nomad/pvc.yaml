apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nomad-storage-nas
  namespace: project-nomad
  annotations:
    storage.vanillax.dev/backup-exempt-reason: "Bulk project-nomad downloads (ZIM libraries, maps); disposable by owner decision, re-downloads after a rebuild"
  labels:
    app: project-nomad
    type: storage
    # Exempt PVC has no Restore: never add a dataSourceRef here, it would deadlock the PVC Pending on namespace recreate.
    backup-exempt: "true"
spec:
  # Bulk, read-mostly files live on the NAS (BigTank HDDs + RAM cache), not on node SSDs.
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  storageClassName: truenas-nfs
