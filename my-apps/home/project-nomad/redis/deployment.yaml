apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: project-nomad
  labels:
    app: project-nomad-redis
  annotations:
    # NOMAD's blocking queue pops park longer than 10s — Coroot's max latency
    # bucket — so no threshold works; latency SLO off, availability SLO stays.
    coroot.com/slo-latency-objective: "0%"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: project-nomad-redis
  template:
    metadata:
      labels:
        app: project-nomad-redis
    spec:
      containers:
        - name: redis
          image: ghcr.io/valkey-io/valkey:9.1-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 15m
              memory: 128Mi
            limits:
              memory: 256Mi
