apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: project-nomad
  labels:
    app: project-nomad-redis
  annotations:
    # Blocking queue pops (~5s) read as slow requests to Coroot's L7 eBPF
    # latency SLI at the 500ms default; 10s keeps a real stall visible.
    coroot.com/slo-latency-threshold: "10s"
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: project-nomad-redis
  template:
    metadata:
      labels:
        app: project-nomad-redis
    spec:
      containers:
        - name: redis
          image: ghcr.io/valkey-io/valkey:9.1-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 15m
              memory: 128Mi
            limits:
              memory: 256Mi
