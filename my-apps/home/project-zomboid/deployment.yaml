apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-zomboid
  namespace: project-zomboid
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: project-zomboid
  template:
    metadata:
      labels:
        app: project-zomboid
    spec:
      terminationGracePeriodSeconds: 180
      initContainers:
        - name: steamcmd-update
          image: indifferentbroccoli/projectzomboid-server-docker:latest@sha256:8e13816b92fdd3e1fac3044b8b9228b255e6deb4d28b268f93a911fbd58ca6e8
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -c
            - /opt/repo-scripts/prewarm-steamcmd.sh
          volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: steam-cache
              mountPath: /steam-cache
        - name: copy-config
          image: busybox:1.38@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command:
            - sh
            - -c
            - /opt/repo-scripts/copy-config.sh
          volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: config-data
              mountPath: /project-zomboid-config
            - name: config
              mountPath: /config
      containers:
        - name: project-zomboid
          image: indifferentbroccoli/projectzomboid-server-docker:latest@sha256:8e13816b92fdd3e1fac3044b8b9228b255e6deb4d28b268f93a911fbd58ca6e8
          imagePullPolicy: Always
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: SERVER_NAME
              value: "vanillax"
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: zomboid-secrets
                  key: admin-username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zomboid-secrets
                  key: admin-password
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zomboid-secrets
                  key: server-password
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zomboid-secrets
                  key: rcon-password
            - name: SERVER_BRANCH
              value: "unstable"
            - name: DEFAULT_PORT
              value: "16261"
            - name: UDP_PORT
              value: "16262"
            - name: RCON_PORT
              value: "27015"
            - name: MEMORY_XMX_GB
              value: "16"
            - name: MEMORY_XMS_GB
              value: "8"
            - name: UPDATE_ON_START
              value: "true"
            - name: GENERATE_SETTINGS
              value: "false"
            - name: STEAM_VAC
              value: "true"
            - name: MODS
              value: "SkillRecoveryJournal;ChuckleberryFinnAlertSystem;errorMagnifier;lgd_antibodies;RealisticDash;ArmorMakesSense;B42Horticulture;PHLockpicking"
            - name: WORKSHOP_ITEMS
              value: "2503622437;2896041179;3077900375;2392676812;3635591071;3677430162;3650168851;3687010721"
          ports:
            - name: game
              containerPort: 16261
              protocol: UDP
            - name: game2
              containerPort: 16262
              protocol: UDP
            - name: rcon
              containerPort: 27015
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - /opt/repo-scripts/stop-server.sh
          startupProbe:
            exec:
              command:
                - pgrep
                - -f
                - ProjectZomboid
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - rcon-cli
                - -c
                - /home/steam/server/rcon.yml
                - "players"
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - ProjectZomboid
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: server-files
              mountPath: /project-zomboid
            - name: config-data
              mountPath: /project-zomboid-config
            - name: steam-cache
              mountPath: /home/steam/steamcmd
          resources:
            requests:
              memory: 4Gi
              cpu: "1"
            limits:
              memory: 20Gi
      volumes:
        - name: repo-scripts
          configMap:
            name: project-zomboid-scripts
            defaultMode: 0555
        - name: server-files
          persistentVolumeClaim:
            claimName: zomboid-server-files
        - name: config-data
          persistentVolumeClaim:
            claimName: zomboid-data
        - name: config
          configMap:
            name: zomboid-server-config
        - name: steam-cache
          emptyDir:
            sizeLimit: 1Gi
