apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyze-bridge
  namespace: wyze-bridge
spec:
  # Parked at 0 — crashlooping (263 restarts). Diagnose before restoring to 1.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wyze-bridge
  template:
    metadata:
      labels:
        app: wyze-bridge
    spec:
      containers:
      - name: wyze-bridge
        image: ghcr.io/thatdaveguy1/docker-wyze-bridge:latest@sha256:eed5f5f82c04b79a75b6d6a2921d8ae96d9821756d7463a0a406ab39dbf11dd3
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: wyze-bridge-config
        - secretRef:
            name: wyze-bridge-secrets
        ports:
        - containerPort: 8554
          name: rtsp
        - containerPort: 8888
          name: hls
        - containerPort: 8889
          name: webrtc
        - containerPort: 8189
          name: webrtc-ice
          protocol: UDP
        - containerPort: 5000
          name: web-ui
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: wyze-config
          mountPath: /config
      volumes:
      - name: wyze-config
        emptyDir: {}
