# argocd-inactive: disabled (treehouses/kolibri:0.12.8 is broken on Python 2.7); commented out in ../kustomization.yaml.
# When re-enabling, add a kopiur stub + component + dataSourceRef (mover uid = data owner, was 568).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kolibri-data
  namespace: project-nomad
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=false
  labels:
    app: project-nomad
    type: kolibri
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: longhorn
