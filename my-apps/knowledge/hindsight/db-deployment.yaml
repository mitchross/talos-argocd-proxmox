apiVersion: apps/v1
kind: Deployment
metadata:
  name: hindsight-db
  namespace: hindsight
  labels:
    app: hindsight-db
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate # RWO PVC — old pod must release the volume first
  selector:
    matchLabels:
      app: hindsight-db
  template:
    metadata:
      labels:
        app: hindsight-db
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: hindsight
            - name: POSTGRES_USER
              value: hindsight
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hindsight-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "hindsight"]
            periodSeconds: 10
            timeoutSeconds: 10
          # Busy is not dead: a consolidation backlog makes pg_isready slow, and a kill mid-write forces crash recovery.
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "hindsight"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            # 1Gi filled during a large consolidation run (1.2M links), probes stalled and the pod looped.
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hindsight-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: hindsight-db
  namespace: hindsight
  labels:
    app: hindsight-db
spec:
  selector:
    app: hindsight-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
