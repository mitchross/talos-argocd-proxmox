apiVersion: apps/v1
kind: Deployment
metadata:
  name: hindsight
  namespace: hindsight
  labels:
    app: hindsight
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # Recreate: one worker at a time, because both pods would share the fixed HINDSIGHT_API_WORKER_ID below.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hindsight
  template:
    metadata:
      labels:
        app: hindsight
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hindsight
          # Full (non-slim) image: bundled local embedding + reranker models,
          # so only the LLM is external (in-cluster LiteLLM gateway).
          image: ghcr.io/vectorize-io/hindsight:1.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hindsight-secrets
                  key: POSTGRES_PASSWORD
            - name: HINDSIGHT_API_DATABASE_URL
              value: "postgresql://hindsight:$(POSTGRES_PASSWORD)@hindsight-db:5432/hindsight"
            - name: HINDSIGHT_API_VECTOR_EXTENSION
              value: "pgvector"
            # Fact extraction runs on cloud DeepSeek via LiteLLM/OpenRouter so memory saves keep working when the GPU node is down.
            - name: HINDSIGHT_API_LLM_PROVIDER
              value: "openai"
            - name: HINDSIGHT_API_LLM_BASE_URL
              value: "http://litellm-service.litellm.svc.cluster.local:4000/v1"
            - name: HINDSIGHT_API_LLM_MODEL
              value: "deepseek-flash"
            # OpenRouter reasoning off: same JSON, ~60% fewer billed output tokens.
            - name: HINDSIGHT_API_LLM_EXTRA_BODY
              value: '{"reasoning":{"enabled":false}}'
            - name: HINDSIGHT_API_LLM_TIMEOUT
              value: "600"
            - name: HINDSIGHT_API_LLM_MAX_RETRIES
              value: "1"
            - name: HINDSIGHT_API_LLM_MAX_CONCURRENT
              value: "4"
            # Stable id so a new pod reclaims the old pod's in-flight jobs on start. The default
            # (pod hostname) strands them in 'processing' and blocks consolidation (upstream #1719).
            - name: HINDSIGHT_API_WORKER_ID
              value: hindsight
            - name: HINDSIGHT_API_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-litellm
                  key: LITELLM_API_KEY
            - name: HINDSIGHT_API_TENANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-secrets
                  key: HINDSIGHT_API_TENANT_API_KEY
          ports:
            - containerPort: 8888
              name: http
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60 # first boot loads embedding models
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              memory: 3Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
