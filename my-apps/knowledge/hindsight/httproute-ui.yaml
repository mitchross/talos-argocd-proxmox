# Hindsight control-plane UI (Next.js, port 9999 in the same container).
# INTERNAL route only (gateway-internal-technitium), same policy as the API:
# memory data stays off the Cloudflare tunnel. The UI has no login by default,
# so it is reachable unauthenticated from the LAN only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hindsight-ui-route
  namespace: hindsight
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal-technitium
      namespace: gateway
  hostnames:
    - "hindsight-ui.vanillax.me"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 5m # UI actions (reflect, consolidation views) can chain LLM round-trips
        backendRequest: 5m
      backendRefs:
        - group: ""
          kind: Service
          name: hindsight-service
          port: 9999
          weight: 1
