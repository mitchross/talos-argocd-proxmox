apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hindsight

resources:
  - litellm-externalsecret.yaml
  - namespace.yaml
  - externalsecret.yaml
  - db-19-pvc.yaml
  - db-19-deployment.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - httproute-ui.yaml
  - vpa.yaml
  - kopiur/hindsight-db-19.yaml

# Uniform kopiur backup fields (repository, copyMethod, populator) for the per-PVC stub(s) in kopiur/.
components:
  - ../../common/kopiur-backup
