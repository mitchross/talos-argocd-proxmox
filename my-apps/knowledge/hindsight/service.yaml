apiVersion: v1
kind: Service
metadata:
  name: hindsight-service
  namespace: hindsight
  labels:
    app: hindsight
spec:
  selector:
    app: hindsight
  ports:
    - name: http # CRITICAL — HTTPRoute matches by port name; fails silently without it
      port: 8888
      targetPort: 8888
    - name: ui
      port: 9999
      targetPort: 9999
