apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep-chrome
  labels:
    app: karakeep-chrome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karakeep-chrome
  template:
    metadata:
      labels:
        app: karakeep-chrome
    spec:
      nodeSelector:
        node.vanillax.dev/pool: general
      containers:
        - name: chrome
          image: ghcr.io/karakeep-app/karakeep-chrome:157.0.8103.78-r1@sha256:00fb4fa9c37aa74c58e74d0bdd16c4e3b81dddb5f264917c879f9579c3b3ad95
          imagePullPolicy: IfNotPresent
          # The image entrypoint sets headless, no-sandbox and the 9222 forwarder; do not override it with command.
          args:
            - --disable-gpu
            - --disable-dev-shm-usage
            - --hide-scrollbars
