apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep-chrome
  labels:
    app: karakeep-chrome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karakeep-chrome
  template:
    metadata:
      labels:
        app: karakeep-chrome
    spec:
      containers:
        - name: chrome
          image: ghcr.io/karakeep-app/karakeep-chrome:156.0.8078.47-r1@sha256:4ad61127638dd27bfe685222787c5780dd1d083d23a7658c39af657775814c44
          imagePullPolicy: IfNotPresent
          # The image entrypoint sets headless, no-sandbox and the 9222 forwarder; do not override it with command.
          args:
            - --disable-gpu
            - --disable-dev-shm-usage
            - --hide-scrollbars
