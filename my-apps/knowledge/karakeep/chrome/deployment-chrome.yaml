apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep-chrome
  labels:
    app: karakeep-chrome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karakeep-chrome
  template:
    metadata:
      labels:
        app: karakeep-chrome
    spec:
      nodeSelector:
        node.vanillax.dev/pool: general
      containers:
        - name: chrome
          image: ghcr.io/karakeep-app/karakeep-chrome:157.0.8103.38-r1@sha256:6c80ed470871bb8c129dc58692ca1714cddbc1392faad3ebf59aecd2e6e58eac
          imagePullPolicy: IfNotPresent
          # The image entrypoint sets headless, no-sandbox and the 9222 forwarder; do not override it with command.
          args:
            - --disable-gpu
            - --disable-dev-shm-usage
            - --hide-scrollbars
