apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep-chrome
  labels:
    app: karakeep-chrome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karakeep-chrome
  template:
    metadata:
      labels:
        app: karakeep-chrome
    spec:
      nodeSelector:
        node.vanillax.dev/pool: general
      containers:
        - name: chrome
          image: ghcr.io/karakeep-app/karakeep-chrome:158.0.8127.88-r1@sha256:4f23c2630fbcea09c4a8a5272490855f2dd25686017ab379fbec78615782782d
          imagePullPolicy: IfNotPresent
          # The image entrypoint sets headless, no-sandbox and the 9222 forwarder; do not override it with command.
          args:
            - --disable-gpu
            - --disable-dev-shm-usage
            - --hide-scrollbars
