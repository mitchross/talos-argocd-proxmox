apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep-secrets
  namespace: karakeep
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: karakeep-secret
    creationPolicy: Owner
  # Omit ignored defaults so ArgoCD does not restore the old data list during sync.
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: litellm
        property: master_key

    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: karakeep-secret
        property: karakeep-nextauth
    - secretKey: MEILI_MASTER_KEY
      remoteRef:
        key: karakeep-secret
        property: karakeep-meili
    - secretKey: WEBHOOK_SECRET
      remoteRef:
        key: karakeep-secret
        property: karakeep-webhook
    - secretKey: NEXTAUTH_PUBLIC_SECRET
      remoteRef:
        key: karakeep-secret
        property: karakeep-nextauth-public_secret
