apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiwix
  namespace: kiwix
  labels:
    app.kubernetes.io/name: kiwix
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kiwix
  replicas: 1
  strategy:
    # Surge first: RWX/no PVC, so the old pod serves until the new one is Ready.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kiwix
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      containers:
        - name: kiwix
          image: ghcr.io/kiwix/kiwix-serve:latest@sha256:2ebf0615402bd6ad803ab39f738246cd10619b280d34621dea646112c53194bf
          imagePullPolicy: IfNotPresent
          command: ["kiwix-serve"]
          args:
            - --port=8080
            - --library
            - --monitorLibrary
            - /library/library.xml
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: library
              mountPath: /library
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
        - name: library-indexer
          image: ghcr.io/kiwix/kiwix-serve:latest@sha256:2ebf0615402bd6ad803ab39f738246cd10619b280d34621dea646112c53194bf
          command: ["sh", "/opt/library/index-library.sh"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: library
              mountPath: /library
            - name: library-scripts
              mountPath: /opt/library
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kiwix-data
        - name: library
          emptyDir: {}
        - name: library-scripts
          configMap:
            name: kiwix-library-scripts
      initContainers:
        - name: initialize-library
          image: ghcr.io/kiwix/kiwix-serve:latest@sha256:2ebf0615402bd6ad803ab39f738246cd10619b280d34621dea646112c53194bf
          command: ["sh", "/opt/library/index-library.sh"]
          args: ["--once"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: library
              mountPath: /library
            - name: library-scripts
              mountPath: /opt/library
              readOnly: true
