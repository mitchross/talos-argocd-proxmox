apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cronjob-library-download.yaml
  - vpa.yaml
  - ns.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - anubis-policy-externalsecret.yaml
  - anubis-deployment.yaml
  - anubis-service.yaml
  - anubis-vpa.yaml
  - anubis-podmonitor.yaml

namespace: kiwix

configMapGenerator:
  - name: kiwix-library-scripts
    files:
      - collections.tsv
      - scripts/download-library.sh
      - scripts/index-library.sh
  # ESO renders this template into the anubis-policy Secret; the hash suffix rolls Anubis.
  - name: anubis-policy-template
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    files:
      - botPolicy.yaml=anubis-policy.yaml

configurations:
  - kustomizeconfig.yaml
replacements:
  - source:
      kind: ConfigMap
      name: anubis-policy-template
      fieldPath: metadata.name
    targets:
      - select:
          kind: Deployment
          name: anubis
        fieldPaths:
          - spec.template.metadata.annotations.anubis-policy-revision
        options:
          create: true
