apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-ngx-credentials
  namespace: paperless-ngx
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: paperless-app-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        PAPERLESS_REDIS: "redis://:{{ .redis_password }}@redis-master.redis-instance.svc.cluster.local:6379"
  data:
    - secretKey: PAPERLESS_DBUSER
      remoteRef:
        key: paperless-ngx-credentials
        property: db_username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: PAPERLESS_DBPASS
      remoteRef:
        key: paperless-ngx-credentials
        property: db_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # paperless-ngx >= 2.18 refuses to start without a non-default PAPERLESS_SECRET_KEY.
    - secretKey: PAPERLESS_SECRET_KEY
      remoteRef:
        key: paperless-ngx-credentials
        property: secret_key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: redis_password
      remoteRef:
        key: redis-instance
        property: password
