---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
# Backup STUB — uniform fields injected by ../../common/kopiur-backup; the mover securityContext is per-PVC and stays here.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: perplexica-data
  namespace: perplexica
spec:
  sources:
    - pvc:
        name: perplexica-data
  identity:
    username: perplexica-data
    hostname: perplexica
  retention:
    keepDaily: 14
    keepWeekly: 6
    keepMonthly: 3
  mover:
    # config.json is 0:568/0600; db.sqlite is 568:568/0664.
    # UID 0 reads the config; GID 568 reads the database without DAC capabilities.
    securityContext:
      runAsUser: 0
      runAsGroup: 568
      runAsNonRoot: false
    podSecurityContext:
      fsGroup: 568
      supplementalGroups:
        - 568
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: perplexica-data-daily
  namespace: perplexica
spec:
  policyRef:
    name: perplexica-data
  schedule:
    cron: "7 3 * * *"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: perplexica-data-restore
  namespace: perplexica
spec:
  source:
    fromPolicy:
      name: perplexica-data
      offset: 0
  mover:
    # Restore as the root-running application, retaining the shared data group.
    securityContext:
      runAsUser: 0
      runAsGroup: 568
      runAsNonRoot: false
    podSecurityContext:
      fsGroup: 568
      supplementalGroups:
        - 568
