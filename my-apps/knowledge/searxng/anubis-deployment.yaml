apiVersion: apps/v1
kind: Deployment
metadata:
  name: anubis
  namespace: searxng
  labels:
    app.kubernetes.io/name: anubis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anubis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anubis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anubis
          image: ghcr.io/techarohq/anubis:v1.28.1@sha256:1744c03a918160a28b0d2e8c1656de6585f4071b30b4c3b0d51d02282c9b7c25
          env:
            - name: BIND
              value: ":8923"
            - name: METRICS_BIND
              value: ":9090"
            - name: TARGET
              value: "http://searxng:8080"
            - name: POLICY_FNAME
              value: "/data/cfg/botPolicy.yaml"
            # cloudflared sets CF-Connecting-IP; without this every visitor shares the gateway's pod IP.
            - name: CUSTOM_REAL_IP_HEADER
              value: "CF-Connecting-IP"
            # Off: with it on, every challenged request (including bots that never
            # solve) made Anubis fetch the page from redlib, i.e. a Reddit API call.
            - name: OG_PASSTHROUGH
              value: "false"
            # Without this Anubis will bounce a solved challenge to any host (open redirect).
            - name: REDIRECT_DOMAINS
              value: "search.vanillax.me"
            # Signing key is generated per pod: a rollout re-challenges everyone once (cookie lasts 7 d).
          ports:
            - name: http
              containerPort: 8923
            - name: metrics
              containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            exec:
              command: ["/ko-app/anubis", "--healthcheck"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/ko-app/anubis", "--healthcheck"]
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # Idle is ~60Mi, but bot surges hit 256Mi and OOM-killed it; keep the VPA maxAllowed in step.
              memory: 512Mi
          volumeMounts:
            - name: bot-policy
              mountPath: /data/cfg
              readOnly: true
      volumes:
        - name: bot-policy
          configMap:
            name: anubis-policy
