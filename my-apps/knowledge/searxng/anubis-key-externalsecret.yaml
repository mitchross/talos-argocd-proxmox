apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anubis-key
  namespace: searxng
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: anubis-key
    creationPolicy: Owner
  data:
  # 64 hex chars from `openssl rand -hex 32`; one key per Anubis instance.
  - secretKey: ED25519_PRIVATE_KEY_HEX
    remoteRef:
      key: anubis
      property: searxng_ed25519_key_hex
