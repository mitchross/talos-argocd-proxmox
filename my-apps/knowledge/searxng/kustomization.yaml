apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - vpa.yaml
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - externalsecret.yaml
  - redis.yaml
  - anubis-deployment.yaml
  - anubis-service.yaml
  - anubis-vpa.yaml
  - anubis-podmonitor.yaml
configMapGenerator:
  - name: searxng-scripts
    files:
      - scripts/wait-for-redis.sh
  - name: searxng-config-settings
    files:
      - settings.yaml
      - limiter.toml
    options:
      disableNameSuffixHash: true
  - name: searxng
    envs:
      - searxng.env
  # Hash suffix rolls Anubis when the policy changes.
  - name: anubis-policy
    files:
      - botPolicy.yaml=anubis-policy.yaml
namespace: searxng
