apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - vpa.yaml
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - externalsecret.yaml
  - redis.yaml
  - anubis-deployment.yaml
  - anubis-policy-externalsecret.yaml
  - anubis-key-externalsecret.yaml
  - anubis-service.yaml
  - anubis-vpa.yaml
  - anubis-podmonitor.yaml
configMapGenerator:
  - name: searxng-scripts
    files:
      - scripts/wait-for-redis.sh
  - name: searxng-config-settings
    files:
      - settings.yaml
      - limiter.toml
    options:
      disableNameSuffixHash: true
  - name: searxng
    envs:
      - searxng.env
  # ESO renders this template into the anubis-policy Secret; the hash suffix rolls Anubis.
  - name: anubis-policy-template
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    files:
      - botPolicy.yaml=anubis-policy.yaml
namespace: searxng

configurations:
  - kustomizeconfig.yaml
replacements:
  - source:
      kind: ConfigMap
      name: anubis-policy-template
      fieldPath: metadata.name
    targets:
      - select:
          kind: Deployment
          name: anubis
        fieldPaths:
          - spec.template.metadata.annotations.anubis-policy-revision
        options:
          create: true
