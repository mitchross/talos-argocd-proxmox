apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: imagery

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - vpa.yaml

configMapGenerator:
  # Hash suffix rolls the Deployment when the proxy config changes.
  - name: imagery-nginx
    files:
      - default.conf=nginx-imagery.conf
