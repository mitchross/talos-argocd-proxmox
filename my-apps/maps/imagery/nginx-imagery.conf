# Caching proxy for public-domain USGS orthoimagery. Clients only ever talk to
# maps.vanillax.me; USGS is contacted once per tile, then served from the PVC.
proxy_cache_path /var/cache/imagery levels=1:2 keys_zone=imagery:64m max_size=18g inactive=365d use_temp_path=off;

server {
    listen       8080;
    server_name  _;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # MapLibre asks for XYZ /imagery/{z}/{x}/{y}.jpg; ArcGIS tiles are {z}/{y}/{x}. z0-16 only.
    location ~ "^/imagery/([0-9]|1[0-6])/([0-9]+)/([0-9]+)\.jpg$" {
        rewrite "^/imagery/([0-9]+)/([0-9]+)/([0-9]+)\.jpg$" /arcgis/rest/services/USGSImageryOnly/MapServer/tile/$1/$3/$2 break;
        proxy_pass https://basemap.nationalmap.gov;
        proxy_set_header Host basemap.nationalmap.gov;
        proxy_ssl_server_name on;
        proxy_ssl_name basemap.nationalmap.gov;

        proxy_cache imagery;
        proxy_cache_key $uri;
        proxy_cache_lock on;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header X-Cache;
        proxy_hide_header Via;

        add_header Cache-Control "public, max-age=604800" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        return 404;
    }
}
