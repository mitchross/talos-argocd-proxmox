apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: imagery-cache
  namespace: imagery
  labels:
    backup-exempt: "true"
  annotations:
    storage.vanillax.dev/backup-exempt-reason: "Cache of public USGS imagery tiles; refills on demand from the source"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 100Gi
