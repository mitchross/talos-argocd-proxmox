apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: imagery-tiles
  namespace: imagery
  labels:
    backup-exempt: "true"
  annotations:
    storage.vanillax.dev/backup-exempt-reason: "Cache of public USGS imagery tiles; refills on demand from the source"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      # Keep nginx's max_size in nginx-imagery.conf (18g) below this, or the cache fills the volume.
      storage: 20Gi
