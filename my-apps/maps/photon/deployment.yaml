# First start downloads and unpacks the north-america index (~30 GB compressed) before Photon listens.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: photon
  namespace: photon
  labels:
    app.kubernetes.io/name: photon
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO PVC — RollingUpdate deadlocks on Multi-Attach
  selector:
    matchLabels:
      app.kubernetes.io/name: photon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: photon
    spec:
      # Run as the image's own photon user (9011). As root, the entrypoint
      # re-owns the whole ~150Gi index (find -exec chgrp/chown, chown -R) on
      # every start, which took well over 10 minutes after a node reboot.
      # Non-root skips that entirely; OnRootMismatch re-groups the volume once.
      securityContext:
        runAsUser: 9011
        runAsGroup: 9011
        runAsNonRoot: true
        fsGroup: 9011
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: photon
          image: rtuszik/photon-docker:2.4.0@sha256:21549c60f9e6488fff3217e40429a652c4b445f374800333fe32859e47cec293
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: REGION
              value: north-america  # US, Canada and Mexico
            - name: UPDATE_STRATEGY
              value: SEQUENTIAL
            - name: UPDATE_INTERVAL
              value: 60d
          ports:
            - containerPort: 2322
              name: http
          startupProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 30
            failureThreshold: 480  # up to 4 h for the first download + unpack
          readinessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 60
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 3Gi
            limits:
              # The North America index is ~22 GB and Photon memory-maps it; the
              # JVM heap is under 1 GB. At 10Gi only ~9.9 GB of index fit in page
              # cache and uncached searches took 4–7 s reading from Longhorn.
              # Page cache is reclaimable, and the VPA keeps the request small.
              memory: 28Gi
          volumeMounts:
            - name: data
              mountPath: /photon/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: photon-data
