# ONLY cors lives here; sources/static frontend/port stay on CLI args (upstream config.yaml schema still maturing).
# allowed_origins: exact origins, domain globs, or /regex/; anything not listed is blocked — there is no default_policy field.
cors:
  allowed_origins:
    # any https vanillax.me subdomain (maps itself, radar, home-assistant, ...)
    - '/^https://([a-z0-9-]+\.)?vanillax\.me$/'
    # local development (MapLibre dev servers on any port)
    - '/^https?://localhost(:[0-9]+)?$/'
    - '/^https?://127\.0\.0\.1(:[0-9]+)?$/'
