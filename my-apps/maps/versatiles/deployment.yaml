# Image ENTRYPOINT is `versatiles serve --static /app/frontend-dev.br.tar`; k8s `args` APPEND to it.
# Never set `command:` — it replaces the entrypoint and drops the bundled frontend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: versatiles
  namespace: versatiles
  labels:
    app.kubernetes.io/name: versatiles
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO PVC — RollingUpdate deadlocks on Multi-Attach
  selector:
    matchLabels:
      app.kubernetes.io/name: versatiles
  template:
    metadata:
      labels:
        app.kubernetes.io/name: versatiles
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Block pod start until the map-bootstrap hook Job has populated the PVC instead of crashlooping on a missing archive.
        - name: wait-for-map
          image: busybox:1.38
          command:
            - sh
            - -c
            - /opt/repo-scripts/wait-for-map.sh
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: map-data
              mountPath: /data
              readOnly: true
      containers:
        - name: versatiles
          image: versatiles/versatiles-frontend:v4.12.3@sha256:865bc72b95401bbf55e2c5387c070d62303285da1422e6d336a641f02ff53b28
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/config/config.yaml"
            - "/data/osm.versatiles"
          ports:
            - containerPort: 8080
              name: http
          # No dedicated health endpoint upstream; /tiles/index.json is served
          # once the tile source is loaded, which is exactly "ready".
          startupProbe:
            httpGet:
              path: /tiles/index.json
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /tiles/index.json
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /tiles/index.json
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: map-data
              mountPath: /data
              readOnly: true  # the bootstrap Job is the only writer
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: repo-scripts
          configMap:
            name: versatiles-scripts
            defaultMode: 0555
        - name: map-data
          persistentVolumeClaim:
            claimName: map-data-smb
        - name: config
          configMap:
            name: versatiles-config
