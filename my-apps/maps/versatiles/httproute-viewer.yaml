# Exact `/` beats versatiles-route's PathPrefix `/` by Gateway API precedence, so only the bare root is intercepted.
# Separate single-rule route on purpose: growing an existing HTTPRoute's rules does NOT converge here. DNS is owned by versatiles-route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: map-viewer-route
  namespace: versatiles
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-external
      namespace: gateway
      sectionName: https
  hostnames:
    - "maps.vanillax.me"
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: map-styles
          port: 8080
          weight: 1
