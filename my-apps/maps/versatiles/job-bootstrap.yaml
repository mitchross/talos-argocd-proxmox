# Sync hook, NOT a plain Job: plain-Job ttl GC + AppSet selfHeal = daily 62GB re-download loop.
# Changing DATASET_URL in kustomization.yaml IS the update trigger (ConfigMap hash -> hook re-run -> marker mismatch). See README.md.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: map-bootstrap
  namespace: versatiles
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app.kubernetes.io/name: versatiles
spec:
  ttlSecondsAfterFinished: 86400  # hygiene only; hooks aren't selfHeal-recreated
  backoffLimit: 4
  # download.versatiles.org throttles to ~2.7MB/s per connection (measured
  # 2026-07-19), so the 62GB pull needs ~6.5h — a 4h ceiling killed it mid-run
  activeDeadlineSeconds: 28800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: versatiles
        job: map-bootstrap
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000  # non-root container writes to the PVC
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: download
          # Same pinned alpine base the repo already uses; busybox wget +
          # sha256sum are all this needs.
          image: alpine:3@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command:
            - sh
            - -c
            - /opt/repo-scripts/bootstrap-map.sh
          envFrom:
            - configMapRef:
                name: bootstrap-env
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
            - name: map-data
              mountPath: /data
      volumes:
        - name: repo-scripts
          configMap:
            name: versatiles-scripts
            defaultMode: 0555
        - name: map-data
          persistentVolumeClaim:
            claimName: map-data-smb
