# Sync hook, NOT a plain Job: plain-Job ttl GC + AppSet selfHeal = daily 62GB re-download loop.
# Changing DATASET_URL in kustomization.yaml IS the update trigger (ConfigMap hash -> hook re-run -> marker mismatch). See README.md.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: map-bootstrap
  namespace: versatiles
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app.kubernetes.io/name: versatiles
spec:
  ttlSecondsAfterFinished: 86400  # hygiene only; hooks aren't selfHeal-recreated
  backoffLimit: 4
  # download.versatiles.org throttles to ~2.7MB/s per connection (measured
  # 2026-07-19), so the 62GB pull needs ~6.5h — a 4h ceiling killed it mid-run
  activeDeadlineSeconds: 28800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: versatiles
        job: map-bootstrap
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000  # non-root container writes to the PVC
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: download
          # Same pinned alpine base the repo already uses; busybox wget +
          # sha256sum are all this needs.
          image: alpine:3@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command:
            - sh
            - -c
            - |
              set -eu
              TARGET="/data/${TARGET_FILE}"
              TMP="${TARGET}.tmp"
              MARKER="/data/.bootstrap-marker"

              # Fast path: the hook re-runs every sync; a marker matching DATASET_URL means nothing to do.
              if [ -s "$TARGET" ] && [ -f "$MARKER" ] && [ "$(head -n1 "$MARKER")" = "$DATASET_URL" ]; then
                echo "marker matches (${DATASET_URL}); archive already present, nothing to do"
                exit 0
              fi

              # The origin drops long single streams; restarting from byte 0 never finishes 62GB, so resume with wget -c.
              # A stale partial from a different DATASET_URL is caught by the sha256 check (mismatch deletes the tmp).
              echo "downloading ${DATASET_URL} -> ${TMP}"
              attempt=0
              while ! wget -q -c -O "$TMP" "$DATASET_URL"; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 200 ]; then
                  echo "FATAL: download did not complete after ${attempt} resume attempts" >&2
                  exit 1
                fi
                echo "connection dropped at $(wc -c <"$TMP" 2>/dev/null || echo 0) bytes, resuming (attempt ${attempt})"
                sleep 5
              done

              echo "verifying sha256 (${DATASET_SHA256_URL})"
              EXPECTED="$(wget -q -O - "$DATASET_SHA256_URL" | cut -d' ' -f1)"
              ACTUAL="$(sha256sum "$TMP" | cut -d' ' -f1)"
              if [ "$EXPECTED" != "$ACTUAL" ]; then
                echo "FATAL: sha256 mismatch: expected ${EXPECTED}, got ${ACTUAL}" >&2
                rm -f "$TMP"
                exit 1
              fi

              # Atomic swap (same filesystem); a running server keeps the OLD file open until the Deployment restarts.
              mv -f "$TMP" "$TARGET"
              printf '%s\nsize=%s downloaded=%s\n' "$DATASET_URL" "$(wc -c <"$TARGET")" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >"$MARKER"
              echo "done: ${TARGET} ($(wc -c <"$TARGET") bytes)"
          envFrom:
            - configMapRef:
                name: bootstrap-env
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: map-data
              mountPath: /data
      volumes:
        - name: map-data
          persistentVolumeClaim:
            claimName: map-data-smb
