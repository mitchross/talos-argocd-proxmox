apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: versatiles

resources:
  - vpa.yaml
  - namespace.yaml
  - pvc.yaml
  - job-bootstrap.yaml
  - deployment.yaml
  - service.yaml
  - style-server.yaml
  - style-server-service.yaml
  - httproute.yaml
  - httproute-styles.yaml
  - httproute-viewer.yaml

configMapGenerator:
  - name: versatiles-scripts
    files:
      - scripts/bootstrap-map.sh
      - scripts/wait-for-map.sh
  # Hash suffix is the update mechanism: changing DATASET_URL (+ sha256) or config.yaml re-runs the bootstrap hook.
  # Newer planet snapshots: https://download.versatiles.org/ (see README).
  - name: versatiles-config
    files:
      - config.yaml
  - name: bootstrap-env
    literals:
      - DATASET_URL=https://download.versatiles.org/osm.20260608.versatiles
      - DATASET_SHA256_URL=https://download.versatiles.org/osm.20260608.versatiles.sha256
      - TARGET_FILE=osm.versatiles
  # Editing a style (re-run styles/generate.mjs) or the nginx config rolls the map-styles Deployment via the hash suffix.
  - name: map-styles-nginx
    files:
      - default.conf=nginx-styles.conf
  - name: map-styles-files
    files:
      - styles/light.json
      - styles/dark.json
  # Fullscreen MapLibre viewer served at `/` (see httproute-viewer.yaml). Hash
  # suffix rolls the map-styles Deployment when index.html changes.
  - name: map-styles-index
    files:
      - index.html
