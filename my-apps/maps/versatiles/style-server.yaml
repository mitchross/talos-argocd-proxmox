# Separate nginx for the pre-generated MapLibre style JSONs — the versatiles pod is readOnlyRootFilesystem off a read-only PVC.
# Styles + nginx config come from configMapGenerators in kustomization.yaml (hash suffix = rollout trigger).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: map-styles
  namespace: versatiles
  labels:
    app.kubernetes.io/name: map-styles
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: map-styles
  template:
    metadata:
      labels:
        app.kubernetes.io/name: map-styles
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101   # nginx-unprivileged's built-in non-root nginx user
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:901e944d1f4fc2bd077e8f5568b98c1f6f8cdacf6b97a87747c43134a339b9a7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: styles
              mountPath: /usr/share/nginx/html/styles
              readOnly: true
            - name: index
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: conf
          configMap:
            name: map-styles-nginx
        - name: styles
          configMap:
            name: map-styles-files
        - name: index
          configMap:
            name: map-styles-index
