apiVersion: apps/v1
kind: Deployment
metadata:
  name: cobalt
  namespace: cobalt
  labels:
    app.kubernetes.io/name: cobalt
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cobalt
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cobalt
    spec:
      containers:
      - name: cobalt
        image: ghcr.io/imputnet/cobalt:11
        imagePullPolicy: IfNotPresent
        env:
        - name: API_URL
          value: "https://cobalt.vanillax.me/"
        ports:
        - name: http
          containerPort: 9000
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ "ALL" ]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
