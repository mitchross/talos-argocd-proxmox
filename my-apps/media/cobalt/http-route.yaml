apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # Renamed from "cobalt": re-parenting an HTTPRoute in place silently no-ops, a rename forces create+prune.
  name: cobalt-api
  namespace: cobalt
  labels:
    external-dns: "true"
  annotations:
    external-dns.alpha.kubernetes.io/target: "vanillax.me"
spec:
  # Must be external: the browser calls this API directly, so internal-only breaks dl.vanillax.me off-LAN.
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gateway-external
    namespace: gateway
    sectionName: https
  hostnames:
  - cobalt.vanillax.me
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: cobalt
      port: 9000
      weight: 1
