apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cobalt
  namespace: cobalt
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gateway-internal-technitium
    namespace: gateway
  hostnames:
  - cobalt.vanillax.me
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: cobalt
      port: 9000
      weight: 1
