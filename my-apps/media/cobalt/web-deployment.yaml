apiVersion: apps/v1
kind: Deployment
metadata:
  name: cobalt-web
  namespace: cobalt
  labels:
    app.kubernetes.io/name: cobalt-web
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cobalt-web
  replicas: 1
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cobalt-web
    spec:
      containers:
      # Builds at container start, not image build: rootfs must stay writable, ~1-2 min cold start.
      - name: cobalt-web
        image: ghcr.io/spotdemo4/cobalt-web:11.7@sha256:30392487965b2c96f70f04ec5e3ef24a7804eec6ef0c7b9fd7d1e19ed955d1c9
        imagePullPolicy: IfNotPresent
        env:
        # Must be the public hostname — the browser calls this, not the cluster.
        - name: WEB_DEFAULT_API
          value: "https://cobalt.vanillax.me/"
        - name: WEB_HOST
          value: "dl.vanillax.me"
        ports:
        - name: http
          containerPort: 8787
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ "ALL" ]
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            # Sized by the startup build, not by serving.
            memory: 3Gi
        startupProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
