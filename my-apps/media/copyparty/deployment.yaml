apiVersion: apps/v1
kind: Deployment
metadata: 
  name: copyparty
  namespace: copyparty
  labels:
    app: copyparty
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: copyparty
  template:
    metadata:
      labels:
        app: copyparty
    spec:
      containers:
      - name: copyparty
        image: copyparty/ac:latest@sha256:aeee7412bd737598c31386778aae3e617a7f96fd42cde8d2d79d98012b58b737
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3923
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /cfg/copyparty.conf
          subPath: copyparty.conf
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Detroit"
        - name: X_CFG
          value: "/cfg/copyparty.conf"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /
            port:  http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe: 
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name:  data
        persistentVolumeClaim:
          claimName:  copyparty-data
      - name: config
        secret:
          secretName: copyparty-config
