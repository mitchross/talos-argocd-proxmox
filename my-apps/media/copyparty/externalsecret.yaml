apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: copyparty-config
  namespace: copyparty
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: copyparty-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        copyparty.conf: |
          [global]
            p: 3923
            e2dsa
            e2ts
            qr
            no-robots
            fk: 10
            allow-csrf

          [accounts]
            {{ .username }}: {{ .password }}

          [/]
            /data
            accs:
              r: *
              rwda: {{ .username }}
  data:
    - secretKey: username
      remoteRef:
        key: copyparty
        property: username
    - secretKey: password
      remoteRef:
        key: copyparty
        property: password
