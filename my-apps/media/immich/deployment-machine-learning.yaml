apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: immich
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/component: machine-learning
spec:
  replicas: 1
  strategy:
    # Surge first: the RWX cache lets the old pod serve until the new one is Ready.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: immich
      app.kubernetes.io/component: machine-learning
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich
        app.kubernetes.io/component: machine-learning
    spec:
      nodeSelector:
        feature.node.kubernetes.io/pci-0300_8086.present: "true"
        node.vanillax.dev/class: hp-elite-worker
      containers:
      - name: machine-learning
        image: ghcr.io/immich-app/immich-machine-learning:v3.3.5-openvino@sha256:1dbac7f811b51b80c55ee0cf678e0089d3532c798f14a65747d5d7b473a4f9d6
        ports:
        - name: http
          containerPort: 3003
          protocol: TCP
        env:
        - name: REDIS_HOSTNAME
          value: "immich-valkey.immich.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: MPLCONFIGDIR
          value: "/cache/matplotlib"
        - name: TRANSFORMERS_CACHE
          value: "/cache"
        - name: HF_XET_CACHE
          value: "/cache/huggingface-xet"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
            gpu.intel.com/i915: 1
          limits:
            memory: 4Gi
            gpu.intel.com/i915: 1
        livenessProbe:
          httpGet:
            path: /ping
            port: 3003
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ping
            port: 3003
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /ping
            port: 3003
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 60
        volumeMounts:
        - name: cache
          mountPath: /cache
      volumes:
      # Model cache only. ML receives image bytes over HTTP from the server, so it
      # must NOT mount the RWO library PVC — that would Multi-Attach across nodes.
      - name: cache
        persistentVolumeClaim:
          claimName: immich-ml-cache-rwx
