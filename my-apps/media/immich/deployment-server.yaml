apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    # One server at a time: two would run Immich background jobs against the same library.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: immich
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich
        app.kubernetes.io/component: server
    spec:
      # No podAffinity on machine-learning: ML is pinned to the iGPU node while the
      # server stays where the CPU is. They talk over the ClusterIP Service.
      initContainers:
      # An empty library fails immich's integrity check (missing .immich markers); idempotently seed subdirs + markers.
      - name: init-library-markers
        image: alpine:latest@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - /opt/repo-scripts/prepare-library.sh
        volumeMounts:
        - name: repo-scripts
          mountPath: /opt/repo-scripts
          readOnly: true
        - name: library
          mountPath: /library
      # Holds the pod in Init until Postgres answers (e.g. while restore-before-bind hydrates the PVC) instead of crash-looping.
      - name: wait-for-db
        image: ghcr.io/mitchross/immich-postgres:sha-0bcadcf7a1d31bb3982fb9dec3bedbb1f6c80bcb-44771347706-1@sha256:ecf4a48961b7c644ab38bebc26c96e5d3fea2cbf1fb1d570b3a3ef7579b753e7
        command: ["sh", "-c", "until pg_isready -h immich-postgres -p 5432 -t 5; do sleep 2; done"]
        resources:
          requests: {cpu: 5m, memory: 8Mi}
          limits: {memory: 32Mi}
      containers:
      - name: immich-server
        image: ghcr.io/immich-app/immich-server:v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
        ports:
        - name: http
          containerPort: 2283
          protocol: TCP
        - name: metrics-api
          containerPort: 8081
          protocol: TCP
        - name: metrics-ms
          containerPort: 8082
          protocol: TCP
        env:
        - name: TZ
          value: "America/Los_Angeles"
        - name: IMMICH_TRUSTED_PROXIES
          value: "172.31.0.0/16"
        - name: IMMICH_MEDIA_LOCATION
          value: /library
        - name: DB_HOSTNAME
          value: "immich-postgres.immich.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: immich-db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: immich-db-credentials
              key: password
        - name: DB_DATABASE_NAME
          value: "immich"
        - name: REDIS_HOSTNAME
          value: "immich-valkey.immich.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: IMMICH_PORT
          value: "2283"
        - name: IMMICH_MACHINE_LEARNING_URL
          value: "http://immich-machine-learning.immich.svc.cluster.local:3003"
        - name: IMMICH_TELEMETRY_INCLUDE
          value: "all"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 6Gi
        livenessProbe:
          httpGet:
            path: /api/server/ping
            port: 2283
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/server/ping
            port: 2283
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/server/ping
            port: 2283
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        volumeMounts:
        - name: library
          mountPath: /library
        - name: nfs-photos
          mountPath: /mnt/photos
          readOnly: true
        - name: geocoding
          mountPath: /usr/src/app/.reverse-geocoding-dump
        - name: transformers
          mountPath: /usr/src/app/.transformers_cache
      volumes:
      - name: repo-scripts
        configMap:
          name: immich-scripts
          defaultMode: 0555
      - name: library
        persistentVolumeClaim:
          claimName: library-nas
      - name: nfs-photos
        persistentVolumeClaim:
          claimName: nfs-photos
      - name: geocoding
        emptyDir: {}
      - name: transformers
        emptyDir: {}
