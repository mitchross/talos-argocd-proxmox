apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich
labels:
  - pairs:
      app.kubernetes.io/name: immich
      app.kubernetes.io/managed-by: argocd

resources:
  - vpa.yaml
  - namespace.yaml
  - externalsecret.yaml
  - nfs-photos-pvc.yaml
  - library-pvc.yaml
  - ml-cache-pvc.yaml
  - httproute.yaml
  - deployment-server.yaml
  - deployment-machine-learning.yaml
  - deployment-valkey.yaml
  - services.yaml
  - postgres/pvc.yaml
  - postgres/service.yaml
  - postgres/deployment.yaml
  - kopiur/library.yaml
  - kopiur/immich-postgres-data.yaml

configMapGenerator:
  - name: immich-scripts
    files:
      - scripts/prepare-library.sh

# Injects the uniform kopiur fields (repository, copyMethod, populator) into the per-PVC stubs in kopiur/.
components:
  - ../../common/kopiur-backup
