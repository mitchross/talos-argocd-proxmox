apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich
labels:
  - pairs:
      app.kubernetes.io/name: immich
      app.kubernetes.io/managed-by: argocd

resources:
  - vpa.yaml
  - namespace.yaml
  - externalsecret.yaml
  - nfs-photos-pvc.yaml
  - library-pvc.yaml
  - ml-cache-pvc.yaml
  - httproute.yaml
  - deployment-server.yaml
  - deployment-machine-learning.yaml
  - deployment-valkey.yaml
  - services.yaml
  - postgres/pvc.yaml
  - postgres/service.yaml
  - postgres/deployment.yaml
  - kopiur/library.yaml
  - kopiur/immich-postgres-data.yaml

# Uniform kopiur backup fields (repository, copyMethod, populator) for the
# per-PVC stubs in kopiur/. Backs up `library` (daily) and the plain-Postgres
# `immich-postgres-data` (hourly). Immich left CNPG/Barman for this pattern —
# see docs/domains/cnpg/plain-postgres-migration.md.
components:
  - ../../common/kopiur-backup
