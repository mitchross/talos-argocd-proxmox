apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: library-nas
  namespace: immich
  annotations:
    # Immutable dataSourceRef on a Bound PVC — mask the SSA dry-run diff
    # (the AppSet ignoreDifferences handles the live compare).
    argocd.argoproj.io/compare-options: ServerSideDiff=false
    argocd.argoproj.io/sync-options: ServerSideApply=false
    # Bind (and restore) before the Deployment switches to it in wave 0.
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/component: library
spec:
  # Immich's own files (phone uploads, thumbnails, transcodes, DB dumps) on the NAS instead of a node SSD.
  # NFS is slow at creating files (~50/s) but fast at reading them, which is how Immich uses this folder.
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  storageClassName: truenas-nfs
  # kopiur restore-before-bind: a new PVC stays Pending until the latest `library` snapshot is restored into it.
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: library-nas-restore
