apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: library
  namespace: immich
  annotations:
    # Immutable dataSourceRef on a Bound PVC — mask the SSA dry-run diff
    # (the AppSet ignoreDifferences handles the live compare).
    argocd.argoproj.io/compare-options: ServerSideDiff=false
    argocd.argoproj.io/sync-options: ServerSideApply=false
    storage.vanillax.dev/backup-exempt-reason: "Old Longhorn library, kept only as the source for the one-time copy to library-nas; delete after verifying the NAS copy"
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/component: library
    backup-exempt: "true"
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 150Gi
  storageClassName: longhorn
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: library-restore
