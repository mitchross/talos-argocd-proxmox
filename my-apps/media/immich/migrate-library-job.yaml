# After immich-server moves to library-nas, copy anything newer than the last backup from the old Longhorn volume.
# PostSync = runs once the Deployment is healthy, so the old RWO volume is already detached. A marker file makes re-runs no-ops.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-library-to-nas
  namespace: immich
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich
        app.kubernetes.io/component: library-migration
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: alpine:latest@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
        command: ["/bin/sh", "/opt/repo-scripts/migrate-library-to-nas.sh"]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: repo-scripts
          mountPath: /opt/repo-scripts
          readOnly: true
        - name: old
          mountPath: /old
          readOnly: true
        - name: new
          mountPath: /new
      volumes:
      - name: repo-scripts
        configMap:
          name: immich-scripts
          defaultMode: 0555
      - name: old
        persistentVolumeClaim:
          claimName: library
          readOnly: true
      - name: new
        persistentVolumeClaim:
          claimName: library-nas
