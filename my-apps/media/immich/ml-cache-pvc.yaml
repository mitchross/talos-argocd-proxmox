apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-ml-cache-rwx
  namespace: immich
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/component: machine-learning
    backup-exempt: "true"
  annotations:
    storage.vanillax.dev/backup-exempt-reason: "Immich ML model cache; downloads on demand if missing"
spec:
  # Longhorn RWX (share-manager NFS) so a surge rollout can mount it on two nodes.
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: longhorn
