# Plain Postgres + kopiur hourly tier (gitea/postgres pattern); runbook: docs/domains/cnpg/plain-postgres-migration.md
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: immich
  labels:
    app: immich-postgres
spec:
  strategy:
    type: Recreate # RWO PVC — RollingUpdate deadlocks on Multi-Attach
  replicas: 1
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      # SIGINT = Postgres fast shutdown; 60s covers a busy checkpoint before SIGKILL.
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999 # postgres uid:gid in the official image
      initContainers:
        - name: postgres-extension-base
          image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
          command: ["/bin/sh", "/scripts/stage-postgres-extensions.sh", "base"]
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: postgres-extensions
              mountPath: /staged
            - name: postgres-extension-scripts
              mountPath: /scripts
              readOnly: true
        - name: immich-vector-extensions
          image: ghcr.io/immich-app/postgres:17-vectorchord0.4.3@sha256:79b95b795f0911e95ffa4d092a2162c4d81a984d5629bc8f786afe0bc0657671
          command: ["/bin/sh", "/scripts/stage-postgres-extensions.sh", "immich"]
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: postgres-extensions
              mountPath: /staged
            - name: postgres-extension-scripts
              mountPath: /scripts
              readOnly: true
      containers:
        - name: postgres
          # Retain the tested vector extensions while patching the PostgreSQL 17 server independently.
          image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
          args: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5432
              name: postgres
          env:
            # First boot on an EMPTY volume creates DB + user; on a restored volume these are ignored.
            # Same secret immich-server reads, so role and client credential cannot drift apart.
            - name: POSTGRES_DB
              value: "immich"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: immich-db-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db-credentials
                  key: password
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            # Subdirectory keeps initdb happy on a fresh PVC (top-level mount
            # contains lost+found).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Probes expand $POSTGRES_USER — the username is secret-sourced; a literal would silently break.
          startupProbe:
            exec:
              command:
                ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-extensions
              mountPath: /usr/share/postgresql/17/extension
              subPath: share/extension
              readOnly: true
            - name: postgres-extensions
              mountPath: /usr/lib/postgresql/17/lib/vector.so
              subPath: lib/vector.so
              readOnly: true
            - name: postgres-extensions
              mountPath: /usr/lib/postgresql/17/lib/vchord.so
              subPath: lib/vchord.so
              readOnly: true
            - name: postgres-config
              mountPath: /etc/postgresql
              readOnly: true
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DATA_SOURCE_URI
              value: "127.0.0.1:5432/immich?sslmode=disable"
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: immich-db-credentials
                  key: username
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: immich-db-credentials
                  key: password
          ports:
            - containerPort: 9187
              name: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: immich-postgres-data
        - name: postgres-extensions
          emptyDir:
            sizeLimit: 256Mi
        - name: postgres-extension-scripts
          configMap:
            name: immich-postgres-scripts
        - name: postgres-config
          configMap:
            name: immich-postgres-config
