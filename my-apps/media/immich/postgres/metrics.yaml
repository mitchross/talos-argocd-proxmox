apiVersion: v1
kind: Service
metadata:
  name: immich-postgres-metrics
  namespace: immich
  labels:
    app: immich-postgres
    app.kubernetes.io/component: database-metrics
spec:
  selector:
    app: immich-postgres
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: immich-postgres
  namespace: immich
spec:
  selector:
    matchLabels:
      app: immich-postgres
      app.kubernetes.io/component: database-metrics
  endpoints:
    - port: metrics
      interval: 30s
