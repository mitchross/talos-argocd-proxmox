apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
  namespace: karakeep
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=false
    # Immutable dataSourceRef on a Bound PVC — SSA dry-run compare fails app-wide, so compare client-side (AppSet ignoreDifferences masks drift).
    argocd.argoproj.io/sync-options: ServerSideApply=false
  labels:
    app: karakeep
    type: data-storage
    restore-policy: "strict"
    # Backup + restore are driven by the kopiur CR bundle in
    # ../kopiur/data-pvc.yaml (SnapshotPolicy + SnapshotSchedule + Restore).
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
  # kopiur restore-before-bind: on recreate binds Pending until the Restore populator hydrates it; no-op while Bound.
  # dataSourceRef is IMMUTABLE — it only takes effect on RECREATE; the masking annotations above hide interim diff.
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: data-pvc-restore
