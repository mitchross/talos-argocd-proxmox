apiVersion: apps/v1
kind: Deployment
metadata:
  name: metube
  labels:
    app.kubernetes.io/name: metube
spec:
  replicas: 1
  # One writer for the queue state; RWX volume, so no Multi-Attach risk.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metube
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metube
    spec:
      # CHOWN_DIRS is off (SMB), so pre-create the emptyDir folders for the gosu'd uid.
      initContainers:
        - name: work-dirs
          image: ghcr.io/alexta69/metube:2026.10.27@sha256:845a67373a9f9e62b88e5f9067867202200d63db3615a051acbd77b09e86b9ce
          command: ["sh", "-c", "mkdir -p /work/state /work/tmp && chown 1000:1000 /work/state /work/tmp"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: work
              mountPath: /work
      containers:
        - name: metube
          # Starts as root only to self-update yt-dlp nightly, then drops to PUID:PGID via gosu.
          image: ghcr.io/alexta69/metube:2026.10.27@sha256:845a67373a9f9e62b88e5f9067867202200d63db3615a051acbd77b09e86b9ce
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: TZ
              value: America/Detroit
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            # SMB ownership comes from the uid/gid mount options; a recursive chown over SMB is slow and a no-op.
            - name: CHOWN_DIRS
              value: "false"
            - name: DOWNLOAD_DIR
              value: /downloads/metube
            # Partial files stay off the inbox so the transcriber only sees finished downloads.
            - name: TEMP_DIR
              value: /work/tmp
            - name: STATE_DIR
              value: /work/state
            - name: YTDL_NIGHTLY_UPDATE_TIME
              value: "04:30"
            - name: OUTPUT_TEMPLATE
              value: "%(title)s [%(id)s].%(ext)s"
            - name: MAX_CONCURRENT_DOWNLOADS
              value: "2"
          readinessProbe:
            httpGet:
              path: /version
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /version
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: inbox
              mountPath: /downloads
            - name: work
              mountPath: /work
      volumes:
        - name: inbox
          persistentVolumeClaim:
            claimName: media-inbox
        - name: work
          emptyDir:
            sizeLimit: 30Gi
