apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: metube
spec:
  # LAN only: MeTube has no login.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal-technitium
      namespace: gateway
  hostnames:
    - metube.vanillax.me
  rules:
    - backendRefs:
        - name: metube
          port: 8081
