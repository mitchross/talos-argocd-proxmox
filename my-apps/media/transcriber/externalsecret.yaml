apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: transcriber-litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password
    kind: ClusterSecretStore
  target:
    name: transcriber-litellm
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: litellm
        property: master_key
