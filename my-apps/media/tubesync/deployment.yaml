apiVersion: apps/v1
kind: Deployment
metadata:
  name: tubesync
  namespace: tubesync
  labels:
    app: tubesync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tubesync
  template:
    metadata:
      labels:
        app: tubesync
    spec:
      initContainers:
      # SponsorBlock is a per-source DB setting with no env override; cuts force a full VP9 re-encode.
      - name: disable-sponsorblock
        image: ghcr.io/meeb/tubesync:v0.18.5
        imagePullPolicy: IfNotPresent
        workingDir: /app
        command:
        - python3
        - manage.py
        - shell
        - -c
        - from sync.models import Source; Source.objects.update(enable_sponsorblock=False)
        env:
        - name: TZ
          value: America/New_York
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /downloads
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
      containers:
      - name: tubesync
        image: ghcr.io/meeb/tubesync:v0.18.5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4848
        env:
        - name: TZ
          value: America/New_York
        - name: PUID
          value: "0"
        - name: PGID
          value: "0"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /downloads
        - name: hat-run
          mountPath: /etc/s6-overlay/s6-rc.d/hat-syslog-server/run
          subPath: hat-syslog-server-run
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 4Gi
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: config-pvc
      - name: media
        persistentVolumeClaim:
          claimName: media-pvc
      - name: hat-run
        configMap:
          name: tubesync-scripts
          defaultMode: 0755
