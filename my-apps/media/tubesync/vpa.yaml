# VPA policy is owned with this application so Argo prunes it with the target.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: tubesync
  namespace: tubesync
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tubesync
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledResources: ["cpu", "memory"]
        controlledValues: RequestsOnly
        maxAllowed:
          # Downloads burst far above any request; with no CPU limit, a higher request only blocks scheduling.
          cpu: "1"
          memory: 4Gi
