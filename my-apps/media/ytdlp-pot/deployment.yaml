apiVersion: apps/v1
kind: Deployment
metadata:
  name: bgutil-pot
  labels:
    app.kubernetes.io/name: bgutil-pot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bgutil-pot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bgutil-pot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bgutil-pot
          image: brainicism/bgutil-ytdlp-pot-provider:2.0.2-node@sha256:d7d34108b76e52c7d3b575fe9e797e4bf41c1b2a08f80c5292eff6f851ce8472
          ports:
            - name: http
              containerPort: 4416
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
