apiVersion: apps/v1
kind: Deployment
metadata:
  name: deal-scout
  namespace: deal-scout-beta
  labels:
    app: deal-scout
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate # RWO PVC (SQLite) — old pod must release the volume first
  selector:
    matchLabels:
      app: deal-scout
  template:
    metadata:
      labels:
        app: deal-scout
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: deal-scout
          # Source: github.com/mitchross/deal-scout, crates/dashboard/ (Rust)
          image: ghcr.io/mitchross/deal-scout:v0.35.1@sha256:76befdafe97d6d23af8ca87f7d68d67353cfc11723bc62174893b2d0e38d36e0
          imagePullPolicy: IfNotPresent
          env:
            # Fewer glibc malloc arenas: each Tokio blocking thread otherwise keeps its own,
            # and big JSON responses leave them full (suspected cause of the high RSS).
            - name: MALLOC_ARENA_MAX
              value: "2"
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: deal-scout-secrets
                  key: LITELLM_API_KEY
            - name: DATA_DIR
              value: /data
            # eBay Partner Network campaign; public in every affiliate link, so not a secret.
            - name: EPN_CAMPAIGN_ID
              value: "5339215873"
            # A request with no X-Deal-Scout-Mode header (neither gateway route) is a visitor.
            - name: DEAL_SCOUT_DEFAULT_MODE
              value: public
            # Pin both values: the digest call is best-effort and silently falls
            # back to facts-only prose when a backend or model id is stale.
            - name: DIGEST_LLM_URL
              value: http://litellm-service.litellm.svc.cluster.local:4000/v1/chat/completions
            - name: DIGEST_LLM_MODEL
              value: qwen3.8-27b
            - name: INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: deal-scout-secrets
                  key: INGEST_TOKEN
          ports:
            - containerPort: 8000
              name: http
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            # Rust v0.35.0 sits at ~500-600Mi idle and was OOMKilled at 768Mi under concurrent
            # /api/listings?limit=10000 load (deal-scout#144). VPA only moves requests, so keep headroom here.
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: deal-scout-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
