# LAN only (internal Technitium gateway), operator mode. Add a gateway-external route to make it public.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: deal-scout-beta-route
  namespace: deal-scout-beta
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal-technitium
      namespace: gateway
  hostnames:
    - "beta-dealscout.vanillax.me"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # SET, not add, so a client-supplied value never survives the gateway.
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Deal-Scout-Mode
                value: operator
      backendRefs:
        - group: ""
          kind: Service
          name: deal-scout
          port: 8000
          weight: 1
