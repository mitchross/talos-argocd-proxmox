---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
# Seeds the beta DB from prod's newest deal-scout-data snapshot (policy in namespace deal-scout).
# onMissingSnapshot: Continue (from the component) binds an empty volume if no snapshot is found.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: deal-scout-data-restore
  namespace: deal-scout-beta
spec:
  source:
    fromPolicy:
      name: deal-scout-data
      namespace: deal-scout
      offset: 0
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
    podSecurityContext:
      fsGroup: 1000
      supplementalGroups:
        - 1000
