apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deal-scout-data
  namespace: deal-scout-beta
  labels:
    backup-exempt: "true"
  annotations:
    # MUST be the fully-qualified key — bare `backup-exempt-reason` is silently ignored.
    storage.vanillax.dev/backup-exempt-reason: "Beta copy of deal-scout-data, seeded once from prod's nightly kopiur snapshot; re-seedable by recreating the PVC"
    # Immutable dataSourceRef on a Bound PVC — mask the SSA dry-run diff
    # (the AppSet ignoreDifferences handles the live compare).
    argocd.argoproj.io/compare-options: ServerSideDiff=false
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
  # One-time seed: restore prod's latest nightly snapshot (cross-namespace). No-op once Bound.
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: deal-scout-data-restore
