# Internal route: full read/write, and X-Deal-Scout-Mode: operator. The public route below is GET-only and sets public.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: deal-scout-route
  namespace: deal-scout
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal-technitium
      namespace: gateway
  hostnames:
    - "deals.vanillax.me"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # The app decides operator vs public per request from this header. SET,
      # not add, so a client-supplied value never survives the gateway.
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Deal-Scout-Mode
                value: operator
      backendRefs:
        - group: ""
          kind: Service
          name: deal-scout
          port: 8000
          weight: 1
---
# Public: GET/HEAD, plus POST to exactly the three stateless visitor tools (the app
# rate-limits and size-caps them). Every other write stays internal-only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: deal-scout-public
  namespace: deal-scout
  labels:
    external-dns: "true"
  annotations:
    external-dns.alpha.kubernetes.io/target: vanillax.me
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-external
      namespace: gateway
      sectionName: https
  hostnames:
    - "deals.vanillax.me"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          method: GET
        - path:
            type: PathPrefix
            value: /
          method: HEAD
        - path:
            type: Exact
            value: /api/builder/suggestions
          method: POST
        - path:
            type: Exact
            value: /api/assist/parse
          method: POST
        - path:
            type: Exact
            value: /api/assist/explain
          method: POST
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Deal-Scout-Mode
                value: public
      backendRefs:
        - group: ""
          kind: Service
          name: deal-scout
          port: 8000
          weight: 1
