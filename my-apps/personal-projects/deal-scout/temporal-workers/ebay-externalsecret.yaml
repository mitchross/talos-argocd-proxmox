apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: deal-scout-ebay
  namespace: deal-scout
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: deal-scout-ebay
    creationPolicy: Owner
  data:
    - secretKey: EBAY_CLIENT_ID
      remoteRef:
        key: ebay-developer
        property: client_id
    - secretKey: EBAY_CLIENT_SECRET
      remoteRef:
        key: ebay-developer
        property: client_secret
