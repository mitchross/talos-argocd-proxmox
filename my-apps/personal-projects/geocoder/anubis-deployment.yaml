apiVersion: apps/v1
kind: Deployment
metadata:
  name: anubis
  namespace: geocoder
  labels:
    app.kubernetes.io/name: anubis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anubis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anubis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anubis
          image: ghcr.io/techarohq/anubis:v1.28.2@sha256:5fcbce70ee6168be5b226d19bec90111d0acd0daf13028fa06b044cf3ebbbd5f
          env:
            - name: BIND
              value: ":8923"
            - name: METRICS_BIND
              value: ":9090"
            - name: TARGET
              value: "http://geocoder-api:8000"
            - name: POLICY_FNAME
              value: "/data/cfg/botPolicy.yaml"
            # cloudflared sets CF-Connecting-IP; without this every visitor shares the gateway's pod IP.
            - name: CUSTOM_REAL_IP_HEADER
              value: "CF-Connecting-IP"
            - name: OG_PASSTHROUGH
              value: "false"
            # Without this Anubis will bounce a solved challenge to any host (open redirect).
            - name: REDIRECT_DOMAINS
              value: "geocode.vanillax.me"
            # Fixed signing key, so passes survive restarts and rollouts (cookie lasts 7 d).
            # optional: until the 1Password field exists Anubis falls back to a random per-pod key.
            - name: ED25519_PRIVATE_KEY_HEX
              valueFrom:
                secretKeyRef:
                  name: anubis-key
                  key: ED25519_PRIVATE_KEY_HEX
                  optional: true
          ports:
            - name: http
              containerPort: 8923
            - name: metrics
              containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            exec:
              command: ["/ko-app/anubis", "--healthcheck"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/ko-app/anubis", "--healthcheck"]
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # Idle is ~60Mi, but bot surges hit 256Mi and OOM-killed it; keep the VPA maxAllowed in step.
              memory: 512Mi
          volumeMounts:
            - name: bot-policy
              mountPath: /data/cfg
              readOnly: true
      volumes:
        - name: bot-policy
          secret:
            secretName: anubis-policy
