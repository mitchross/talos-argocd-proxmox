apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: anubis
  namespace: geocoder
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: anubis
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: anubis
        controlledResources: ["cpu", "memory"]
        controlledValues: RequestsOnly
        maxAllowed:
          cpu: 500m
          memory: 512Mi
