# Web UI + JSON API (FastAPI). Anubis fronts it; see anubis-policy.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geocoder-api
  labels:
    app: geocoder-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: geocoder-api
  template:
    metadata:
      labels:
        app: geocoder-api
    spec:
      # Same spread as my-apps/demo/nginx: one copy per host zone, tainted nodes left out of the count.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              app: geocoder-api
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Holds the pod in Init until Postgres answers instead of crash-looping. -U: uid 1000 has no passwd entry, so libpq "no attempt".
        - name: wait-for-db
          image: postgis/postgis:18-3.6@sha256:4a43e3c3e5d55b9208240fc71db543b79c638766280c625a425bd0a2390989c4
          command: ["sh", "-c", "until pg_isready -U postgres -h geocoder-postgres -p 5432 -t 5; do sleep 2; done"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: registry.vanillax.me/geocoder/geocoder:v0.1.8@sha256:a0815f511e97899edaa65207d41c517e5b7591a1e428a86b8a2d8175c6d9e663
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geocoder
                  key: db_password
            - name: DATABASE_URL
              value: postgresql://geocoder:$(DB_PASSWORD)@geocoder-postgres:5432/geocoder
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: geocoder
                  key: api_keys
            # Buckets are per uvicorn process (2 pods x 2 workers); 30 keeps one client's total near 120 requests/min.
            - name: RATE_LIMIT_PER_MIN
              value: "30"
            # Batch addresses per UTC day shared by everyone using the UI's rotating demo key; 0 turns it off.
            - name: DEMO_KEY_ADDRESSES
              value: "500"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          # Serves a static page, so a database outage does not restart the API.
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: geocoder-api
  labels:
    app: geocoder-api
spec:
  selector:
    app: geocoder-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: geocoder-api
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: geocoder-api
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: geocoder-api
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: geocoder-api
  updatePolicy:
    updateMode: InPlaceOrRecreate
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: api
        controlledResources: ["cpu", "memory"]
        controlledValues: RequestsOnly
        maxAllowed:
          cpu: "1"
          memory: 768Mi
