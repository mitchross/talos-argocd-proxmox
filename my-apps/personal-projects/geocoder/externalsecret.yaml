# 1Password item "geocoder": db_password (letters and digits only) and api_keys (comma-separated).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: geocoder
spec:
  refreshInterval: "1h"
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: geocoder
    creationPolicy: Owner
  data:
    - secretKey: db_password
      remoteRef:
        key: geocoder
        property: db_password
    - secretKey: api_keys
      remoteRef:
        key: geocoder
        property: api_keys
