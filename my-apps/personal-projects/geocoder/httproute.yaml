apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: geocoder
  labels:
    external-dns: "true"
  annotations:
    external-dns.alpha.kubernetes.io/target: vanillax.me
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-external
      namespace: gateway
      sectionName: https
  hostnames:
    - "geocode.vanillax.me"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          # Anubis fronts the app (proof-of-work for browsers); geocoder-api:8000 is its TARGET.
          name: anubis
          port: 8923
          weight: 1
