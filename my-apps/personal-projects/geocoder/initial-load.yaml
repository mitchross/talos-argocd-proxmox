# First data load without kubectl: runs after each Argo sync, and skips in seconds when the source and states match
# the last load (ingest_state). A sync during a load restarts it (BeforeHookCreation). Progress: GET /v1/ingest.
# Monthly refreshes stay with the geocoder-ingest CronJob.
apiVersion: batch/v1
kind: Job
metadata:
  name: geocoder-initial-load
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 14400
  template:
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingest
          image: registry.vanillax.me/geocoder/geocoder:v0.1.4@sha256:1b1436507a0177b2e4b2016595c7b9ac446efb13e548b1c5902f5c17872757b8
          command: ["sh", "-c", "python -m geocoder.ingest zcta && python -m geocoder.ingest nad"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geocoder
                  key: db_password
            - name: DATABASE_URL
              value: postgresql://geocoder:$(DB_PASSWORD)@geocoder-postgres:5432/geocoder
            - name: STATES
              value: ALL
            - name: INGEST_WORKERS
              value: "4"
            - name: DATA_DIR
              value: /data
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "4" # INGEST_WORKERS parse in parallel
              memory: 2Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: geocoder-downloads
