# Self-hosted geocoder from public data (Census ZCTA + USDOT NAD + GeoNames places). Source: gitea.vanillax.me geocoder repo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: geocoder

resources:
  - namespace.yaml
  - externalsecret.yaml
  - postgres/pvc.yaml
  - postgres/service.yaml
  - postgres/deployment.yaml
  - postgres/vpa.yaml
  - api.yaml
  - ingest.yaml
  - anubis-deployment.yaml
  - anubis-policy-externalsecret.yaml
  - anubis-key-externalsecret.yaml
  - anubis-service.yaml
  - anubis-vpa.yaml
  - anubis-podmonitor.yaml
  - httproute.yaml

configMapGenerator:
  # ESO renders this template into the anubis-policy Secret; the hash suffix rolls Anubis.
  - name: anubis-policy-template
    options:
      annotations:
        argocd.argoproj.io/sync-wave: "-1"
    files:
      - botPolicy.yaml=anubis-policy.yaml

configurations:
  - kustomizeconfig.yaml
replacements:
  - source:
      kind: ConfigMap
      name: anubis-policy-template
      fieldPath: metadata.name
    targets:
      - select:
          kind: Deployment
          name: anubis
        fieldPaths:
          - spec.template.metadata.annotations.anubis-policy-revision
        options:
          create: true
