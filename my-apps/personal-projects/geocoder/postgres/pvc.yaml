apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: geocoder-postgres-data
  labels:
    app: geocoder-postgres
    backup-exempt: "true"
  annotations:
    storage.vanillax.dev/backup-exempt-reason: "Rebuilt from public Census and USDOT NAD downloads by the geocoder-ingest CronJob"
spec:
  # Six states measured 4.9 GB; a reload holds the old and new table at once, plus WAL (max_wal_size 8GB).
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
