apiVersion: v1
kind: Service
metadata:
  name: geocoder-postgres
  labels:
    app: geocoder-postgres
spec:
  # Points at the Postgres 19 pod (postgres-19/); the Service keeps the old host name.
  selector:
    app: geocoder-postgres-19
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
