# Frontend only; the Temporal worker Deployments are managed by the worker controller.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: news-reader
  namespace: news-reader
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app: news-reader
