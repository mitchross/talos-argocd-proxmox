# The old web radar pods (nginx). Nothing routes here now: `radar api` serves the page.
# Kept for one step so the route change has a fallback; a follow-up PR deletes this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radar-ng-web
  namespace: radar-ng
  labels:
    app: radar-ng-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: radar-ng-web
  template:
    metadata:
      labels:
        app: radar-ng-web
    spec:
      tolerations:
        - key: node.vanillax.dev/link
          operator: Equal
          value: wifi
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: radar-ng-web
      containers:
        - name: web
          image: ghcr.io/mitchross/radar-ng-web:v0.1.35@sha256:5b7d4ba25691a777c50e121f95562fb41254c70c5ebcbec4235e8f40544dace6
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 96Mi
          volumeMounts:
            # nginx's pid and temp files; the image root stays read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: radar-ng-web
  namespace: radar-ng
  labels:
    app: radar-ng-web
spec:
  selector:
    app: radar-ng-web
  ports:
    - { port: 8080, targetPort: 8080, name: http }
  type: ClusterIP
