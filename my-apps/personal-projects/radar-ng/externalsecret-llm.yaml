apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radar-ng-llm
  namespace: radar-ng
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: radar-ng-llm
    creationPolicy: Owner
  data:
    - secretKey: LLM_API_KEY
      remoteRef:
        key: litellm
        property: master_key
