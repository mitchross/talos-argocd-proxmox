# Bearer token radar api requires on /api/telemetry/v1/* (TELEMETRY_TOKEN); the app ships the same value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radar-ng-telemetry
  namespace: radar-ng
  annotations:
    # Before the Deployment, whose TELEMETRY_TOKEN secretKeyRef is required.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: radar-ng-telemetry
    creationPolicy: Owner
  data:
    - secretKey: TELEMETRY_TOKEN
      remoteRef:
        key: radar-ng
        property: telemetry_token
