# Public HTTPRoute via gateway-external (Cloudflare tunnel + external-dns).
# Publishes https://radar-ng-api.vanillax.me → tile-server Service :8080.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radar-ng-api
  namespace: radar-ng
  labels:
    external-dns: "true"
  annotations:
    external-dns.alpha.kubernetes.io/target: vanillax.me
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-external
      namespace: gateway
      sectionName: https
  hostnames:
    - "radar-ng-api.vanillax.me"
  rules:
    # Prometheus scrapes /api/metrics via the Service, never the Gateway; the public gets the API's own 404.
    - matches:
        - path:
            type: PathPrefix
            value: /api/metrics
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /api/blocked
      backendRefs:
        - group: ""
          kind: Service
          name: tile-server
          port: 8080
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: tile-server
          port: 8080
          weight: 1
---
# The web radar. `radar api` serves the page and its data, so the whole host goes to the tile-server.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radar-ng-web
  namespace: radar-ng
  labels:
    external-dns: "true"
  annotations:
    external-dns.alpha.kubernetes.io/target: vanillax.me
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-external
      namespace: gateway
      sectionName: https
  hostnames:
    - "radar.vanillax.me"
  rules:
    # Same /api/metrics block as radar-ng-api above.
    - matches:
        - path:
            type: PathPrefix
            value: /api/metrics
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /api/blocked
      backendRefs:
        - group: ""
          kind: Service
          name: tile-server
          port: 8080
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: tile-server
          port: 8080
          weight: 1
