apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - vpa.yaml
  - namespace.yaml
  - priorityclass.yaml
  - pvcs.yaml
  - services.yaml
  - httproute.yaml
  - deployment-tile-server.yaml
  - externalsecret-llm.yaml
  - pdb-tile-server.yaml
  - deployment-basemap.yaml
  - deployment-open-meteo.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
  - job-replay-import.yaml
  # The open-meteo sync worker is NOT here — it's a sidecar in deployment-open-meteo.yaml (shares that RWO volume).
  # The aux worker pool seeds the Temporal Schedules on start (SEED_SCHEDULES=1).
  - temporal-workers/configmap-temporal-config.yaml
  - temporal-workers/temporal-connection.yaml
  - temporal-workers/worker-pools.yaml
  - temporal-workers/podmonitor.yaml

namespace: radar-ng

configMapGenerator:
  - name: radar-ng-scripts
    files:
      - scripts/fetch-basemap.sh
  # Separate from radar-ng-scripts so adding it does not roll the basemap pod.
  - name: radar-ng-replay-scripts
    files:
      - scripts/replay-import.sh

patches:
  - path: temporal-workers/release-env-patch.yaml
    target:
      group: temporal.io
      kind: WorkerDeployment
