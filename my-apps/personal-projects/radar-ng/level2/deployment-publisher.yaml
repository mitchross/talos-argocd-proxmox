# `radar level2-publish`: builds ready viewports and collects expired objects; leases work in Postgres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: level2-publisher
  namespace: radar-ng
  labels:
    app: level2-publisher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: level2-publisher
  template:
    metadata:
      labels:
        app: level2-publisher
        # Scraped on the level2 port by the radar-ng-workers PodMonitor.
        radar-ng.vanillax.dev/worker: "true"
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: gpu-worker
                    operator: DoesNotExist
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: publisher
          image: ghcr.io/mitchross/radar-ng-temporal-worker:v2.0.71@sha256:1d3ffeebc04c5fedf687d02465a40f067cb0bb314a4f46bfaafec0e4d1b8983a
          imagePullPolicy: IfNotPresent
          args: [level2-publish]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 9466
              name: level2
              protocol: TCP
          envFrom:
            - configMapRef:
                name: radar-ng-level2
            - secretRef:
                name: radar-ng-level2
          env:
            - name: TMPDIR
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
