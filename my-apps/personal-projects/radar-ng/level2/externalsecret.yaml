# Level II app credentials: Postgres URL plus the shared RustFS workload key (bucket radar-ng-level2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radar-ng-level2
  namespace: radar-ng
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: radar-ng-level2
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        LEVEL2_PG_URL: 'postgres://radar_level2:{{ .dbPassword | urlquery }}@level2-postgres.radar-ng.svc.cluster.local:5432/radar_level2?sslmode=disable'
        LEVEL2_S3_ACCESS_KEY: '{{ .s3AccessKey }}'
        LEVEL2_S3_SECRET_KEY: '{{ .s3SecretKey }}'
  data:
    - secretKey: dbPassword
      remoteRef:
        key: postgres-secrets
        property: radar_ng_level2_db_password
    - secretKey: s3AccessKey
      remoteRef:
        key: rustfs
        property: rustfs-workload-access-key
    - secretKey: s3SecretKey
      remoteRef:
        key: rustfs
        property: rustfs-workload-secret-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radar-ng-level2-db
  namespace: radar-ng
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: radar-ng-level2-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: postgres-secrets
        property: radar_ng_level2_db_password
