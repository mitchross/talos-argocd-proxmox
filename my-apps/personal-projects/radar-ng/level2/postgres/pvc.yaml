apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: level2-postgres-data
  namespace: radar-ng
  annotations:
    # Immutable dataSourceRef on a Bound PVC: mask the SSA dry-run diff (AppSet ignoreDifferences does the live compare).
    argocd.argoproj.io/compare-options: ServerSideDiff=false
    argocd.argoproj.io/sync-options: ServerSideApply=false
  labels:
    app: level2-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn
  # kopiur restore-before-bind: binds Pending until the Restore populator hydrates it; no-op while Bound.
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: level2-postgres-data-restore
