apiVersion: v1
kind: Service
metadata:
  name: level2-postgres
  namespace: radar-ng
  labels:
    app: level2-postgres
spec:
  selector:
    app: level2-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
    - name: metrics
      port: 9187
      targetPort: 9187
---
# Scrapes the postgres-exporter sidecar; Prometheus uses empty serviceMonitor*Selectors, so no release label needed.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: level2-postgres
  namespace: radar-ng
  labels:
    app: level2-postgres
spec:
  selector:
    matchLabels:
      app: level2-postgres
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
