# Owned here, not by a shared app, so this namespace never depends on another Application's render.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: app-critical
  annotations:
    description: "Production data pipelines: above general homelab apps, below primary AI workloads"
    # Cluster-scoped and referenced by every workload here, so it must exist before them.
    argocd.argoproj.io/sync-wave: "-5"
value: 500
globalDefault: false
preemptionPolicy: PreemptLowerPriority
