# One WorkerDeployment per Temporal task queue. Every pool polls only its own queue;
# Release settings are embedded in each pod template by release-env-patch.yaml.
# Exactly one pool seeds Schedules: aux carries SEED_SCHEDULES=1, every other pool keeps SKIP_SCHEDULE_SEED=1.
# All pools share the RWO tiles/grids/state volumes, so they must land on tile-server's node (podAffinity).
# Controller injects TEMPORAL_ADDRESS/NAMESPACE/DEPLOYMENT_NAME/WORKER_BUILD_ID — do not set them via env.
---
apiVersion: temporal.io/v1alpha1
kind: WorkerDeployment
metadata:
  name: radar-ng-worker-mrms
  namespace: radar-ng
  labels:
    app: radar-ng-worker-mrms
    radar-ng.vanillax.dev/worker: "true"
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  workerOptions:
    connectionRef:
      name: cluster-temporal
    temporalNamespace: radar-ng
  rollout:
    strategy: AllAtOnce
    gate:
      workflowType: RadarDeploymentSmokeWorkflow
  sunset:
    scaledownDelay: 10m
    deleteDelay: 1h
  template:
    metadata:
      labels:
        app: radar-ng-worker-mrms
        radar-ng.vanillax.dev/worker: "true"
    spec:
      priorityClassName: app-critical
      affinity:
        # longhorn-flash (tiles/grids/state) sets diskSelector "flash"; only this node carries that disk.
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: gpu-worker
                    operator: In
                    values: ["true"]
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: tile-server
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # fsGroup REQUIRED: fresh Longhorn block volumes mount root:root; uid 1000 cannot write without it.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Lets in-flight activities finish on rollout; TEMPORAL_GRACEFUL_SHUTDOWN_S stays 5 s under it.
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/mitchross/radar-ng-temporal-worker:v2.0.25@sha256:bd763cabbada66ee22ae7845e75eab96f03b0399328acd25219d5775ed87706b
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports:
            - { containerPort: 9464, name: metrics, protocol: TCP }
          env:
            - { name: WORKER_ROLE, value: mrms }
            - { name: TEMPORAL_GRACEFUL_SHUTDOWN_S, value: "55" }
            # Indexed-PNG renderer canary, single role per docs/reliability-and-scale-plan.md: both keys
            # on every pod that polls this queue, and only this pool polls radar-ng-mrms.
            - { name: TILE_RENDERER, value: indexed }
            - { name: TILE_RENDERER_CANARY_ROLE, value: mrms }
            - { name: SKIP_SCHEDULE_SEED, value: "1" }
            # Slots cover 2 frames x 2 layers plus list/mark.
            - { name: TEMPORAL_MAX_CONCURRENT_ACTIVITIES, value: "6" }
            - { name: TILE_DIR, value: /data/tiles }
            - { name: GRID_DIR, value: /data/grids }
            - { name: STATE_DIR, value: /data/state }
            - { name: PUSH_DISABLED, value: "1" }
          # Local event-loop liveness is independent of Temporal connectivity.
          livenessProbe:
            exec:
              command: [sh, -c, "test $(find /tmp/worker-alive -mmin -3)"]
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command: [sh, -c, "test $(find /tmp/temporal-healthy -mmin -3)"]
            periodSeconds: 30
            failureThreshold: 2
          volumeMounts:
            - { name: tiles, mountPath: /data/tiles }
            - { name: grids, mountPath: /data/grids }
            - { name: state, mountPath: /data/state }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "6", memory: "6Gi" }
      volumes:
        - name: tiles
          persistentVolumeClaim: { claimName: tiles }
        - name: grids
          persistentVolumeClaim: { claimName: grids }
        - name: state
          persistentVolumeClaim: { claimName: state }
---
