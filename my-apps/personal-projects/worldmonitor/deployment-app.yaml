apiVersion: apps/v1
kind: Deployment
metadata:
  name: worldmonitor
  namespace: worldmonitor
  labels:
    app.kubernetes.io/name: worldmonitor
    app.kubernetes.io/component: app
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: worldmonitor
      app.kubernetes.io/component: app
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worldmonitor
        app.kubernetes.io/component: app
    spec:
      # Same spread as my-apps/demo/nginx: one copy per host zone, tainted nodes left out of the count.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: worldmonitor
              app.kubernetes.io/component: app
      containers:
        - name: worldmonitor
          image: ghcr.io/mitchross/worldmonitor:sha-6326bc1@sha256:553345987c439c9e43577cf216bc9819bba03bcc47cd88a9b50748ea27a98509
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: worldmonitor-env
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: worldmonitor-secrets
                  key: LLM_API_KEY
            # Map secret keys to the names the app expects
            - name: RELAY_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: worldmonitor-secrets
                  key: RELAY_SHARED_SECRET
            - name: UPSTASH_REDIS_REST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: worldmonitor-secrets
                  key: REDIS_TOKEN
            - name: WM_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: worldmonitor-secrets
                  key: WM_SESSION_SECRET
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/sidecar-health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/sidecar-health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
