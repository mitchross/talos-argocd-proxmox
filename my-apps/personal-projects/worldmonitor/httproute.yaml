apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: worldmonitor
  namespace: worldmonitor
  labels:
    external-dns: "true"
  annotations:
    external-dns.alpha.kubernetes.io/target: vanillax.me
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-external
      namespace: gateway
      sectionName: https
  hostnames:
    - "worldmonitor.vanillax.me"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: worldmonitor
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
