apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng
  namespace: searxng
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: searxng
    creationPolicy: Owner
  data:
    - secretKey: SEARXNG_SECRET
      remoteRef:
        key: searxng
        property: password
