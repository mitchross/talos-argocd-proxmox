apiVersion: batch/v1
kind: CronJob
metadata:
  name: pod-cleanup
  namespace: pod-cleanup
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: pod-cleanup
          restartPolicy: Never
          containers:
          - name: cleanup
            image: bitnami/kubectl:latest@sha256:9962c17eecf0e7668327171223f3cad4d6f9005b98c47d8af2d77c095e269b97
            command:
            - /bin/sh
            - -c
            - /opt/repo-scripts/cleanup-completed-pods.sh
            volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
          volumes:
          - name: repo-scripts
            configMap:
              name: pod-cleanup-scripts
              defaultMode: 0555
