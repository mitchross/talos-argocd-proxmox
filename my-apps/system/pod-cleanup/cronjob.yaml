apiVersion: batch/v1
kind: CronJob
metadata:
  name: pod-cleanup
  namespace: pod-cleanup
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: pod-cleanup
          restartPolicy: Never
          containers:
          - name: cleanup
            image: bitnami/kubectl:latest@sha256:f7f9e4f64d9e114650c115a4ac6fd383394b3d494061a8f17b1a0f6c8d55bc25
            command:
            - /bin/sh
            - -c
            - /opt/repo-scripts/cleanup-completed-pods.sh
            volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
          volumes:
          - name: repo-scripts
            configMap:
              name: pod-cleanup-scripts
              defaultMode: 0555
