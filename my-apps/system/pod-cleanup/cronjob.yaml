apiVersion: batch/v1
kind: CronJob
metadata:
  name: pod-cleanup
  namespace: pod-cleanup
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: pod-cleanup
          restartPolicy: Never
          containers:
          - name: cleanup
            image: bitnami/kubectl:latest@sha256:ab90e1058e5a658cc94b4e7eb6d48e5758cfd6d77b5dd1869513aec3a3054673
            command:
            - /bin/sh
            - -c
            - /opt/repo-scripts/cleanup-completed-pods.sh
            volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
          volumes:
          - name: repo-scripts
            configMap:
              name: pod-cleanup-scripts
              defaultMode: 0555
