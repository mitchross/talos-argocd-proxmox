apiVersion: batch/v1
kind: CronJob
metadata:
  name: pod-cleanup
  namespace: pod-cleanup
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: pod-cleanup
          restartPolicy: Never
          containers:
          - name: cleanup
            image: bitnami/kubectl:latest@sha256:6d9e8ad566a6d2dcb4a7a6120d030bd65bddbcc952246f4b31022834d9be7e02
            command:
            - /bin/sh
            - -c
            - /opt/repo-scripts/cleanup-completed-pods.sh
            volumeMounts:
            - name: repo-scripts
              mountPath: /opt/repo-scripts
              readOnly: true
          volumes:
          - name: repo-scripts
            configMap:
              name: pod-cleanup-scripts
              defaultMode: 0555
