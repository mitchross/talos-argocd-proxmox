# Sleeper keeps the canary volume attached (Longhorn snapshots are most reliable on attached volumes)
# and is the kubectl exec target for the drill's sentinel write/verify.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restore-canary
  namespace: restore-canary
  labels:
    app.kubernetes.io/name: restore-canary
    app.kubernetes.io/component: dr-canary
spec:
  replicas: 1
  # RWO PVC — Recreate is mandatory (RollingUpdate Multi-Attach deadlock).
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: restore-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: restore-canary
        app.kubernetes.io/component: dr-canary
    spec:
      securityContext:
        runAsNonRoot: true
        # 568:568:568 cluster storage convention; fsGroup makes /data group-writable for the sentinel.
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sleeper
          image: ghcr.io/home-operations/busybox:1.38.0@sha256:7e2c04dd50ede647bf4a7a4c8dbd629dd4971cd139b9b88fb22bfc3c7a6c13df
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: restore-canary-data
