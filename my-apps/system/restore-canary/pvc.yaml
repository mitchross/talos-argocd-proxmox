# Canary PVC: holds only the drill sentinel. With no snapshot in the repo a first restore binds EMPTY (mover no-op),
# so the drill must ADVANCE the latest snapshot past the fresh sentinel before any delete (docs/disaster-recovery.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: restore-canary-data
  namespace: restore-canary
  annotations:
    # Immutable dataSourceRef on a Bound PVC — mask the SSA dry-run diff
    # (the AppSet ignoreDifferences handles the live compare).
    argocd.argoproj.io/compare-options: ServerSideDiff=false
    argocd.argoproj.io/sync-options: ServerSideApply=false
  labels:
    app.kubernetes.io/name: restore-canary
    app.kubernetes.io/component: dr-canary
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # kopiur restore-before-bind: on recreate binds Pending until the Restore populator hydrates it; no-op while Bound. CRs in kopiur/restore-canary-data.yaml.
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: restore-canary-data-restore
