# Cluster-side scraping: Slickdeals RSS + MSU/Comprenew Shopify — no browser
# needed, runs whether the desktop is on or not. Browser-bound eBay/FB scans
# run on the desktop via the deal-scout-runner systemd user timer, which polls
# the dashboard's /api/scan-request.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: deal-scout-scraper
  namespace: deal-scout
spec:
  schedule: "0 13,16,19,22,1 * * *" # 9a/12p/3p/6p/9p EDT
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: deal-scout-scraper
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scraper
              # Source: deal-scout repo, scraper/ — build & push:
              #   docker build -t registry.vanillax.me/deal-scout-scraper:v0.1.0 scraper/
              image: registry.vanillax.me/deal-scout-scraper:v0.1.0
              imagePullPolicy: IfNotPresent
              env:
                - name: DEAL_SCOUT_API
                  value: "http://deal-scout:8000"
                - name: DEAL_SCOUT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: deal-scout-secrets
                      key: INGEST_TOKEN
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 192Mi
