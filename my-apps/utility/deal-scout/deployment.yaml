apiVersion: apps/v1
kind: Deployment
metadata:
  name: deal-scout
  namespace: deal-scout
  labels:
    app: deal-scout
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate # RWO PVC (SQLite) — old pod must release the volume first
  selector:
    matchLabels:
      app: deal-scout
  template:
    metadata:
      labels:
        app: deal-scout
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: deal-scout
          # Source: github.com/mitchross/deal-scout, dashboard/
          image: ghcr.io/mitchross/deal-scout:v0.10.0@sha256:c45549a631fdf88a86da5cf832ece835996c8555c465e6d8180b62e9be25fd21
          imagePullPolicy: IfNotPresent
          env:
            - name: DATA_DIR
              value: /data
            # dashboard/app.py defaults this to `qwen3.6-27b`, which the vLLM
            # endpoint no longer serves — it 404s and the digest silently drops
            # to facts-only prose. The digest LLM call is best-effort by design,
            # so nothing errors; it just quietly stops using the model. Pin the
            # served id explicitly so a backend rename can't fail silently again.
            - name: DIGEST_LLM_MODEL
              value: qwen3.8-27b
            - name: INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: deal-scout-secrets
                  key: INGEST_TOKEN
          ports:
            - containerPort: 8000
              name: http
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: deal-scout-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
