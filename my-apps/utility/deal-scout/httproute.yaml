# Internal-only: dashboard read endpoints are unauthenticated — add auth before moving to gateway-external.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: deal-scout-route
  namespace: deal-scout
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal-technitium
      namespace: gateway
  hostnames:
    - "deals.vanillax.me"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: deal-scout
          port: 8000
          weight: 1
