# Internal route: full read/write. The public route below is GET-only because the writes are unauthenticated.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: deal-scout-route
  namespace: deal-scout
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-internal-technitium
      namespace: gateway
  hostnames:
    - "deals.vanillax.me"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: deal-scout
          port: 8000
          weight: 1
---
# Public read-only: GET/HEAD only. PUT /api/config, DELETE /api/learned/*,
# POST /api/{scan-request,digest/generate,feedback} are unauthenticated, so the
# internet gets the dashboard and none of the writes. Ingest/scan-job POSTs are
# token-gated but stay internal too; workers use the in-cluster Service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: deal-scout-public
  namespace: deal-scout
  labels:
    external-dns: "true"
  annotations:
    external-dns.alpha.kubernetes.io/target: vanillax.me
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-external
      namespace: gateway
      sectionName: https
  hostnames:
    - "deals.vanillax.me"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
          method: GET
        - path:
            type: PathPrefix
            value: /
          method: HEAD
      backendRefs:
        - group: ""
          kind: Service
          name: deal-scout
          port: 8000
          weight: 1
