---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
# deal-scout-data backup STUB (deals.db SQLite: feedback + learned reject signals are NOT re-scrapable) — uniform fields from ../../common/kopiur-backup; mover uid:gid stays HERE.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: deal-scout-data
  namespace: deal-scout
spec:
  sources:
    - pvc:
        name: deal-scout-data
  identity:
    username: deal-scout-data
    hostname: deal-scout
  retention:
    keepDaily: 14
    keepWeekly: 6
    keepMonthly: 3
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
    podSecurityContext:
      fsGroup: 1000
      supplementalGroups:
        - 1000
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: deal-scout-data-daily
  namespace: deal-scout
spec:
  policyRef:
    name: deal-scout-data
  schedule:
    cron: "55 3 * * *"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: deal-scout-data-restore
  namespace: deal-scout
spec:
  source:
    fromPolicy:
      name: deal-scout-data
      offset: 0
  mover:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
    podSecurityContext:
      fsGroup: 1000
      supplementalGroups:
        - 1000
