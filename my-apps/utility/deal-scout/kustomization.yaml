apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: deal-scout

resources:
  - namespace.yaml
  - externalsecret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - temporal-workers/temporal-connection.yaml
  - temporal-workers/ebay-externalsecret.yaml
  - temporal-workers/temporal-worker-deployment.yaml
  - temporal-version-retirement.yaml
  - vpa.yaml
  - kopiur/deal-scout-data.yaml

configMapGenerator:
  - name: temporal-version-retirement-scripts
    files:
      - scripts/maintenance.py
      - scripts/retire_inactive_versions.py

# Uniform kopiur backup fields (repository, copyMethod, populator) for the per-PVC stub(s) in kopiur/.
components:
  - ../../common/kopiur-backup
