apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal-version-retirement
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: temporal-version-retirement
rules:
  - apiGroups: [temporal.io]
    resources: [workerdeployments]
    resourceNames: [deal-scout]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: temporal-version-retirement
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: temporal-version-retirement
subjects:
  - kind: ServiceAccount
    name: temporal-version-retirement
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: temporal-version-retirement
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 240
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: temporal-version-retirement
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: temporal-cli
              image: temporalio/admin-tools:1.31.2@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
              command: [cp, /usr/local/bin/temporal, /tools/temporal]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tools
                  mountPath: /tools
          containers:
            - name: retire-inactive-versions
              image: python:3.13-alpine@sha256:7415fbc3c9e4979cc717d92377ab2bc7b2b4a2af1ac03cc52b5f3f88efedaf3a
              command: [python3, -B, -u, /scripts/retire_inactive_versions.py]
              env:
                - name: TEMPORAL_ADDRESS
                  value: temporal-frontend.temporal.svc.cluster.local:7233
                - name: TEMPORAL_NAMESPACE
                  value: default
                - name: DRY_RUN
                  value: "false"
              resources:
                requests:
                  cpu: 10m
                  memory: 768Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tools
                  mountPath: /tools
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: temporal-version-retirement-scripts
            - name: tools
              emptyDir:
                sizeLimit: 1Gi
