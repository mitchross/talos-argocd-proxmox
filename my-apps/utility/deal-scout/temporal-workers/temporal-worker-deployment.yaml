# One worker owns both schedules; the Facebook schedule hands off to the outbound-only CachyOS runner via the API.
apiVersion: temporal.io/v1alpha1
kind: WorkerDeployment
metadata:
  name: deal-scout
  namespace: deal-scout
spec:
  replicas: 1
  workerOptions:
    connectionRef:
      name: cluster-temporal
    temporalNamespace: default
  rollout:
    strategy: Progressive
    gate:
      workflowType: DealScoutDeploymentSmokeWorkflow
    steps:
      - rampPercentage: 50
        pauseDuration: 2m
  sunset:
    scaledownDelay: 10m
    deleteDelay: 1h
  template:
    metadata:
      labels:
        app: deal-scout-worker
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          # Source: deal-scout repo worker/. No personal browser profile is
          # present; eBay authentication is application-only OAuth.
          image: ghcr.io/mitchross/deal-scout-worker:sha-b4c3b979aae74781f7806a854fc88dd1383bde6d@sha256:f339dd2a0e51ed43ce8638f4157d44b4d5d30f5daa68b8b467fdc1ff193f3fb6
          imagePullPolicy: IfNotPresent
          env:
            - name: DEAL_SCOUT_API
              value: "http://deal-scout:8000"
            - name: CLUSTER_SOURCES
              value: "ebay,slickdeals,msu,comprenew,lowcostminipcs"
            - name: DEAL_SCOUT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: deal-scout-secrets
                  key: INGEST_TOKEN
            - name: EBAY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: deal-scout-ebay
                  key: EBAY_CLIENT_ID
            - name: EBAY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: deal-scout-ebay
                  key: EBAY_CLIENT_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
