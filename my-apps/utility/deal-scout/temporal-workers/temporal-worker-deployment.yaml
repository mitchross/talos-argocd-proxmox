# One cluster worker owns both schedules. Cluster-capable sources run as
# isolated activities here; eBay uses its application-only Browse API token.
# The Facebook schedule writes a durable job to the
# Deal Scout API for the outbound-only CachyOS runner. Temporal's unauthenticated
# frontend remains cluster-internal.
apiVersion: temporal.io/v1alpha1
kind: WorkerDeployment
metadata:
  name: deal-scout
  namespace: deal-scout
spec:
  replicas: 1
  workerOptions:
    connectionRef:
      name: cluster-temporal
    temporalNamespace: default
  rollout:
    strategy: Progressive
    steps:
      - rampPercentage: 50
        pauseDuration: 2m
  sunset:
    scaledownDelay: 10m
    deleteDelay: 1h
  template:
    metadata:
      labels:
        app: deal-scout-worker
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          # Source: deal-scout repo worker/. No personal browser profile is
          # present; eBay authentication is application-only OAuth.
          image: ghcr.io/mitchross/deal-scout-worker:v0.7.0@sha256:c771d8b2a4936fe487ff006caed91b2235cd2d660443f3480b7d6a63e3a99307
          imagePullPolicy: IfNotPresent
          env:
            - name: DEAL_SCOUT_API
              value: "http://deal-scout:8000"
            - name: CLUSTER_SOURCES
              value: "ebay,slickdeals,msu,comprenew"
            - name: DEAL_SCOUT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: deal-scout-secrets
                  key: INGEST_TOKEN
            - name: EBAY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: deal-scout-ebay
                  key: EBAY_CLIENT_ID
            - name: EBAY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: deal-scout-ebay
                  key: EBAY_CLIENT_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
