apiVersion: apps/v1
kind: Deployment
metadata:
  name: vert
  namespace: vert
  labels:
    app.kubernetes.io/name: vert
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vert
  replicas: 1
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vert
    spec:
      tolerations:
        - key: node.vanillax.dev/link
          operator: Equal
          value: wifi
          effect: NoSchedule
      containers:
        - name: vert
          image: ghcr.io/vert-sh/vert:latest@sha256:df3a22efeccf0e37adc3b4d01ecc1bd4ad2bc00ec44dc4672f74b23ba8f3ede9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          # No env: the prebuilt image bakes in its PUB_* config, so runtime env is ignored (PUB_VERTD_URL would
          # need a browser-reachable HTTPS URL at image build time).
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
