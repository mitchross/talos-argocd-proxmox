apiVersion: apps/v1
kind: Deployment
metadata:
  name: vert
  namespace: vert
  labels:
    app.kubernetes.io/name: vert
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vert
  replicas: 1
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vert
    spec:
      containers:
        - name: vert
          image: ghcr.io/vert-sh/vert:latest@sha256:ed2afd55ef8207ddf9029b57ac0c1b63e0ab21cf493a56f787a13e1ea2ac056f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          # No env: the prebuilt image bakes in its PUB_* config, so runtime env is ignored (PUB_VERTD_URL would
          # need a browser-reachable HTTPS URL at image build time).
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
