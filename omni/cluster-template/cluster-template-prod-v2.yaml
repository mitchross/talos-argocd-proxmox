kind: Workers
name: gpu-workers
machineClass:
  name: threadripper-gpu-worker
  size: 1
systemExtensions:
- siderolabs/iscsi-tools # renovate: datasource=docker depName=siderolabs/iscsi-tools
- siderolabs/util-linux-tools # renovate: datasource=docker depName=siderolabs/util-linux-tools
- siderolabs/nonfree-kmod-nvidia-production # renovate: datasource=docker depName=siderolabs/nonfree-kmod-nvidia-production
- siderolabs/nvidia-container-toolkit-production # renovate: datasource=docker depName=siderolabs/nvidia-container-toolkit-production
patches:
- name: gpu-worker-labels
  inline:
    apiVersion: v1alpha1
    kind: KubeNodeConfig
    labels:
      gpu-worker: 'true'
      nvidia.com/gpu: 'true'
      node.vanillax.dev/gpu-class: rtx-3090
      node.vanillax.dev/pool: gpu
      topology.kubernetes.io/zone: house
- name: longhorn-node-disks
  inline:
    apiVersion: v1alpha1
    kind: KubeNodeConfig
    labels:
      node.longhorn.io/create-default-disk: config
    annotations:
      node.longhorn.io/default-disks-config: >-
        [{"name":"talos-ephemeral","path":"/var/lib/longhorn","allowScheduling":true,"diskType":"filesystem","storageReserved":0,"tags":[]},{"name":"ssd-flash","path":"/var/mnt/longhorn-ssd-flash","allowScheduling":true,"diskType":"filesystem","storageReserved":0,"tags":["flash"]}]
- file: patches/threadripper-gpu-workers.yaml
- name: kubelet-performance
  inline:
    machine:
      kubelet:
        extraConfig:
          serializeImagePulls: false
          maxPods: 250
- name: longhorn-storage
  inline:
    machine:
      kubelet:
        extraMounts:
        - destination: /var/lib/longhorn
          type: bind
          source: /var/local/longhorn
          options:
          - bind
          - rshared
          - rw
# Exact GiB sizes keep the 434 GiB EPHEMERAL, 450 GiB model and 300 GiB flash selectors disjoint.
- name: ai-model-cache-volume
  inline:
    apiVersion: v1alpha1
    kind: UserVolumeConfig
    name: ai-model-cache
    provisioning:
      diskSelector:
        match: '!system_disk && disk.size == 450u * GiB'
      minSize: 400GiB
      grow: true
- name: longhorn-ssd-flash-volume
  inline:
    apiVersion: v1alpha1
    kind: UserVolumeConfig
    name: longhorn-ssd-flash
    provisioning:
      diskSelector:
        match: '!system_disk && disk.size == 300u * GiB'
      minSize: 250GiB
      grow: true
# /var stays on NVMe0; the separate 16 GiB boot disk is uniquely smallest for Omni.
- name: gpu-ephemeral-volume
  inline:
    apiVersion: v1alpha1
    kind: VolumeConfig
    name: EPHEMERAL
    provisioning:
      diskSelector:
        match: '!system_disk && disk.size == 434u * GiB'
      minSize: 400GiB
      grow: true
