- siderolabs/qemu-guest-agent # renovate: datasource=docker depName=siderolabs/qemu-guest-agent
- siderolabs/i915 # renovate: datasource=docker depName=siderolabs/i915
patches:
- name: hp-sff-worker
  inline:
