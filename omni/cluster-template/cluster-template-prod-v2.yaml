    annotations:
      node.longhorn.io/default-node-tags: '["wired-storage"]'
      node.longhorn.io/default-disks-config: >-
        [{"name":"talos-ephemeral","path":"/var/lib/longhorn","allowScheduling":false,"diskType":"filesystem","storageReserved":17179869184,"tags":[]},{"name":"hp-sff-ssd","path":"/var/mnt/longhorn-hp-sff-ssd","allowScheduling":true,"diskType":"filesystem","storageReserved":0,"tags":["hp-sff-ssd"]},{"name":"hp-sff-ssd2","path":"/var/mnt/longhorn-hp-sff-ssd2","allowScheduling":true,"diskType":"filesystem","storageReserved":0,"tags":["hp-sff-ssd2","clone-ok"]}]
- name: hp-sff-kubelet
  inline:
    apiVersion: v1alpha1
    kind: KubeletConfig
    config:
      serializeImagePulls: false
- name: hp-sff-longhorn-ssd-volume
  inline:
