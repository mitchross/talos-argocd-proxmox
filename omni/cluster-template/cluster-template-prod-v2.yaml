    labels:
      node.vanillax.dev/class: hp-sff-worker
      node.vanillax.dev/pool: general
      topology.kubernetes.io/zone: hp-sff
      node.vanillax.dev/link: wired
    nodeIP:
      validSubnets:
      - 192.168.10.0/24
- name: hp-sff-worker-machine
  inline:
