kind: Workers
name: gpu-workers
machineClass:
  name: threadripper-gpu-worker
  size: 1
systemExtensions:
- siderolabs/iscsi-tools # renovate: datasource=docker depName=siderolabs/iscsi-tools
- siderolabs/util-linux-tools # renovate: datasource=docker depName=siderolabs/util-linux-tools
- siderolabs/nonfree-kmod-nvidia-production # renovate: datasource=docker depName=siderolabs/nonfree-kmod-nvidia-production
- siderolabs/nvidia-container-toolkit-production # renovate: datasource=docker depName=siderolabs/nvidia-container-toolkit-production
patches:
- name: gpu-worker-labels
  inline:
    apiVersion: v1alpha1
    kind: KubeNodeConfig
    labels:
      gpu-worker: "true"
      nvidia.com/gpu: "true"
      node.vanillax.dev/gpu-class: rtx-3090
      node.vanillax.dev/pool: gpu
      topology.kubernetes.io/zone: house
- name: longhorn-node-disks
  inline:
    apiVersion: v1alpha1
    kind: KubeNodeConfig
    labels:
      node.longhorn.io/create-default-disk: config
    annotations:
      node.longhorn.io/default-node-tags: '["wired-storage"]'
      node.longhorn.io/default-disks-config: >-
        [{"name":"talos-ephemeral","path":"/var/lib/longhorn","allowScheduling":false,"diskType":"filesystem","storageReserved":0,"tags":[]},{"name":"ssd-flash","path":"/var/mnt/longhorn-ssd-flash","allowScheduling":true,"diskType":"filesystem","storageReserved":0,"tags":["flash","clone-ok"]},{"name":"gpu-bulk","path":"/var/mnt/longhorn-gpu-bulk","allowScheduling":true,"diskType":"filesystem","storageReserved":0,"tags":["gpu-bulk"]}]
- file: patches/threadripper-gpu-workers.yaml
# Omni patches this machine's previous config, which has no KubeletConfig: keep the image
# aligned with kubernetes.version.
- name: kubelet-performance
  inline:
    apiVersion: v1alpha1
    kind: KubeletConfig
    image: ghcr.io/siderolabs/kubelet:v1.37.1
    config:
      serializeImagePulls: false
      maxPods: 250
# Exact GiB sizes keep the 434 GiB EPHEMERAL, 450 GiB model, 440 GiB flash and 800 GiB bulk selectors disjoint.
- name: ai-model-cache-volume
  inline:
    apiVersion: v1alpha1
    kind: UserVolumeConfig
    name: ai-model-cache
    provisioning:
      diskSelector:
        match: '!system_disk && disk.size == 450u * GiB'
      minSize: 400GiB
      grow: true
- name: longhorn-ssd-flash-volume
  inline:
    apiVersion: v1alpha1
    kind: UserVolumeConfig
    name: longhorn-ssd-flash
    provisioning:
      diskSelector:
        match: '!system_disk && disk.size == 440u * GiB'
      minSize: 250GiB
      grow: true
# /var stays on NVMe0; the separate 16 GiB boot disk is uniquely smallest for Omni.
- name: gpu-ephemeral-volume
  inline:
    apiVersion: v1alpha1
    kind: VolumeConfig
    name: EPHEMERAL
    provisioning:
      diskSelector:
        match: '!system_disk && disk.size == 434u * GiB'
      minSize: 400GiB
      grow: true
# Append new patches below: patch IDs are positional. Consumer PNY for ordinary app volumes; clones go to clone-ok disks.
- name: longhorn-gpu-bulk-volume
  inline:
    apiVersion: v1alpha1
    kind: UserVolumeConfig
    name: longhorn-gpu-bulk
    provisioning:
      diskSelector:
        match: '!system_disk && disk.size == 800u * GiB'
      minSize: 700GiB
      grow: true
# The previous config still carries .machine.kubelet, which Talos 1.14 rejects next to KubeletConfig.
- name: drop-legacy-kubelet
  inline:
    machine:
      kubelet:
        $patch: delete
---
# Bare metal (PXE via booter on the Pi): pinned by UUID, no provider or MachineClass.
kind: Workers
name: mini-pc-ultra-workers
machines:
- 4c4c4544-004a-4210-8037-b9c04f314b34
systemExtensions:
- siderolabs/intel-ucode # renovate: datasource=docker depName=siderolabs/intel-ucode
- siderolabs/i915 # renovate: datasource=docker depName=siderolabs/i915
- siderolabs/intel-npu # renovate: datasource=docker depName=siderolabs/intel-npu
- siderolabs/iscsi-tools # renovate: datasource=docker depName=siderolabs/iscsi-tools
- siderolabs/nfs-utils # renovate: datasource=docker depName=siderolabs/nfs-utils
- siderolabs/nfsrahead # renovate: datasource=docker depName=siderolabs/nfsrahead
- siderolabs/util-linux-tools # renovate: datasource=docker depName=siderolabs/util-linux-tools
patches:
- name: mini-pc-ultra-watchdog
  inline:
    # Bare metal only: the Intel TCO watchdog resets the box if Talos hangs for 2 minutes.
    # monitoring/logs/boot-reason reports a watchdog reset after the next boot.
    apiVersion: v1alpha1
    kind: WatchdogTimerConfig
    device: /dev/watchdog0
    timeout: 2m0s
- name: mini-pc-ultra-worker
  inline:
    apiVersion: v1alpha1
    kind: KubeNodeConfig
    labels:
      node.vanillax.dev/class: mini-pc-dell-ultra
      node.vanillax.dev/pool: general
      topology.kubernetes.io/zone: mini-pc-dell-ultra
      node.vanillax.dev/link: wired
    nodeIP:
      validSubnets:
      - 192.168.10.0/24
- name: mini-pc-ultra-kubelet
  inline:
    apiVersion: v1alpha1
    kind: KubeletConfig
    config:
      serializeImagePulls: false
      systemReserved:
        cpu: 500m
        memory: 1Gi
      kubeReserved:
        cpu: 250m
        memory: 512Mi
# Longhorn reads default-disks-config only when its node first registers; add disks to a live node in its nodes.longhorn.io spec.
- name: mini-pc-ultra-longhorn-disks
  inline:
    apiVersion: v1alpha1
    kind: KubeNodeConfig
    labels:
      node.longhorn.io/create-default-disk: config
    annotations:
      node.longhorn.io/default-node-tags: '["wired-storage"]'
      node.longhorn.io/default-disks-config: >-
        [{"name":"talos-ephemeral","path":"/var/lib/longhorn","allowScheduling":false,"diskType":"filesystem","storageReserved":17179869184,"tags":[]},{"name":"dell-ultra-ssd","path":"/var/mnt/longhorn-dell-ultra-ssd","allowScheduling":true,"diskType":"filesystem","storageReserved":0,"tags":["dell-ultra-ssd"]}]
# The Apple SATA SSD reports no serial, so match it by model.
- name: mini-pc-ultra-longhorn-ssd-volume
  inline:
    apiVersion: v1alpha1
    kind: UserVolumeConfig
    name: longhorn-dell-ultra-ssd
    provisioning:
      diskSelector:
        match: disk.model == "APPLE SSD SM0256" && !system_disk
      minSize: 200GB
      grow: true
---
