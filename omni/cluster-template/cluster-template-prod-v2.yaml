# Fresh Talos 1.14 rebuild template; do not sync onto the existing 1.13 generation contract.
---
kind: Cluster
name: talos-prod-cluster-v2
labels:
  cluster-id: "2"
kubernetes:
  version: v1.37.1
talos:
  version: v1.14.5
patches:
# Never set .machine.kubelet: Talos 1.14 rejects it next to this document, and Omni's
# Kubernetes upgrade patch always adds a KubeletConfig. The image follows kubernetes.version.
- name: kubelet
  inline:
    apiVersion: v1alpha1
    kind: KubeletConfig
    defaultRuntimeSeccompProfileEnabled: true
    config:
      imageGCHighThresholdPercent: 70
      imageGCLowThresholdPercent: 55
- name: dns-resolver
  inline:
    apiVersion: v1alpha1
    kind: ResolverConfig
    nameservers:
    - address: 192.168.10.1
# Disabling these offloads prevents the observed cross-node VXLAN TCP checksum failures.
- name: vxlan-inner-checksum
  inline:
    apiVersion: v1alpha1
    kind: EthernetConfig
    name: eth0
    features:
      tx-checksum-ip-generic: false
      tx-udp_tnl-csum-segmentation: false
- file: patches/docker-hub-auth.yaml
- name: node-performance
  inline:
    machine:
      sysctls:
        fs.inotify.max_user_watches: "1048576"
        fs.inotify.max_user_instances: "8192"
        fs.file-max: "2097152"
        vm.swappiness: "10"
        vm.max_map_count: "524288"
        net.core.somaxconn: "65535"
        net.core.rmem_max: "67108864"
        net.core.wmem_max: "67108864"
        net.ipv4.tcp_congestion_control: bbr
        net.ipv4.tcp_fastopen: "3"
        net.ipv4.tcp_rmem: 4096 87380 33554432
        net.ipv4.tcp_wmem: 4096 65536 33554432
        net.ipv4.tcp_slow_start_after_idle: "0"
        net.ipv4.tcp_mtu_probing: "1"
        net.ipv4.tcp_tw_reuse: "1"
        net.core.netdev_max_backlog: "16384"
        sunrpc.tcp_slot_table_entries: "128"
        sunrpc.tcp_max_slot_table_entries: "65536"
      udev:
        rules:
        - SUBSYSTEM=="bdi", ACTION=="add", ATTR{read_ahead_kb}="131072"
- name: node-service-logs
  inline:
    machine:
      logging:
        destinations:
        - endpoint: tcp://127.0.0.1:6050
          format: json_lines
- name: node-kernel-logs
  inline:
    apiVersion: v1alpha1
    kind: KmsgLogConfig
    name: grafana
    url: tcp://127.0.0.1:6050
- name: lan-time-sync
  inline:
    apiVersion: v1alpha1
    kind: TimeSyncConfig
    ntp:
      # Firewalla intercepts NTP; sync directly with the LAN gateway.
      servers:
      - 192.168.10.1
      useNTS: false
---
kind: ControlPlane
machineClass:
  name: hp-sff-control-plane
  size: 1
systemExtensions:
- siderolabs/iscsi-tools # renovate: datasource=docker depName=siderolabs/iscsi-tools
- siderolabs/nfs-utils # renovate: datasource=docker depName=siderolabs/nfs-utils
- siderolabs/nfsrahead # renovate: datasource=docker depName=siderolabs/nfsrahead
- siderolabs/util-linux-tools # renovate: datasource=docker depName=siderolabs/util-linux-tools
patches:
- name: disable-flannel
  inline:
    apiVersion: v1alpha1
    kind: KubeFlannelCNIConfig
    $patch: delete
- name: disable-kube-proxy
  inline:
    apiVersion: v1alpha1
    kind: KubeProxyConfig
    enabled: false
- name: hp-sff-topology
  inline:
    apiVersion: v1alpha1
    kind: KubeNodeConfig
    labels:
      topology.kubernetes.io/zone: hp-sff
- name: control-plane-api-server
  inline:
    apiVersion: v1alpha1
    kind: KubeAPIServerConfig
    extraArgs:
      max-requests-inflight: "800"
      max-mutating-requests-inflight: "400"
- name: control-plane-controller-manager
  inline:
    apiVersion: v1alpha1
    kind: KubeControllerManagerConfig
    extraArgs:
      concurrent-deployment-syncs: "10"
      concurrent-replicaset-syncs: "10"
      concurrent-namespace-syncs: "20"
      bind-address: 0.0.0.0
- name: control-plane-scheduler
  inline:
    apiVersion: v1alpha1
    kind: KubeSchedulerConfig
    extraArgs:
      kube-api-qps: "100"
      bind-address: 0.0.0.0
    # Score memory 3:1 over CPU: with 6-30 vCPU nodes the equal default sends pods to the big-vCPU box even at 85% memory requests.
    config:
      profiles:
        - schedulerName: default-scheduler
          pluginConfig:
            - name: NodeResourcesFit
              args:
                scoringStrategy:
                  type: LeastAllocated
                  resources:
                    - name: memory
                      weight: 3
                    - name: cpu
                      weight: 1
- name: control-plane-performance
  inline:
    cluster:
      etcd:
        extraArgs:
          quota-backend-bytes: "8589934592"
          snapshot-count: "5000"
          auto-compaction-mode: periodic
          auto-compaction-retention: 5m
          listen-metrics-urls: http://0.0.0.0:2381
- name: control-plane-ephemeral
  inline:
    apiVersion: v1alpha1
    kind: VolumeConfig
    name: EPHEMERAL
    provisioning:
      diskSelector:
        match: system_disk
      minSize: 64GiB
      maxSize: 64GiB
# Bound EPHEMERAL above so ETCD can reserve space on the same 100 GiB system disk.
- name: control-plane-etcd
  inline:
    apiVersion: v1alpha1
    kind: VolumeConfig
    name: ETCD
    provisioning:
      diskSelector:
        match: system_disk
      minSize: 32GiB
      maxSize: 32GiB
# The default Metadata-level policy logged every API request to the control-plane disk (~11 GB/day); nothing reads it.
- name: control-plane-audit-policy
  inline:
    apiVersion: v1alpha1
    kind: KubeAuditPolicyConfig
    configuration:
      apiVersion: audit.k8s.io/v1
      kind: Policy
      rules:
      - level: None
---
kind: Workers
name: hp-micro-workers
machineClass:
  name: hp-micro-worker
  size: 1
systemExtensions:
- siderolabs/iscsi-tools # renovate: datasource=docker depName=siderolabs/iscsi-tools
- siderolabs/nfs-utils # renovate: datasource=docker depName=siderolabs/nfs-utils
- siderolabs/nfsrahead # renovate: datasource=docker depName=siderolabs/nfsrahead
- siderolabs/util-linux-tools # renovate: datasource=docker depName=siderolabs/util-linux-tools
- siderolabs/qemu-guest-agent # renovate: datasource=docker depName=siderolabs/qemu-guest-agent
patches:
# Keep the Wi-Fi worker tainted and both Longhorn disks unschedulable.
- name: hp-micro-worker
  inline:
    apiVersion: v1alpha1
    kind: KubeNodeConfig
    labels:
      node.vanillax.dev/class: hp-micro-worker
      node.vanillax.dev/pool: edge
      topology.kubernetes.io/zone: shed
      node.vanillax.dev/link: wifi
    taints:
      node.vanillax.dev/link: wifi:NoSchedule
    nodeIP:
      validSubnets:
      - 192.168.10.0/24
- name: hp-micro-worker-machine
  inline:
    machine:
      sysctls:
        net.core.bpf_jit_harden: 1
# This annotation replaces the full Longhorn disk list; include the disabled default disk.
- name: hp-micro-longhorn-disks
  inline:
    apiVersion: v1alpha1
    kind: KubeNodeConfig
    labels:
      node.longhorn.io/create-default-disk: config
    annotations:
      node.longhorn.io/default-disks-config: >-
        [{"name":"talos-ephemeral","path":"/var/lib/longhorn","allowScheduling":false,"diskType":"filesystem","storageReserved":17179869184,"tags":[]},{"name":"hp-micro-ssd","path":"/var/mnt/longhorn-hp-micro-ssd","allowScheduling":false,"diskType":"filesystem","storageReserved":0,"tags":["hp-micro-ssd"]}]
- name: hp-micro-kubelet
  inline:
    apiVersion: v1alpha1
    kind: KubeletConfig
    config:
      serializeImagePulls: false
- name: hp-micro-longhorn-ssd-volume
  inline:
    apiVersion: v1alpha1
    kind: UserVolumeConfig
    name: longhorn-hp-micro-ssd
    provisioning:
      diskSelector:
        match: "!system_disk && disk.size >= 700u * GB"
      minSize: 700GB
      grow: true
---
kind: Workers
name: hp-sff-workers
machineClass:
  name: hp-sff-worker
  size: 1
systemExtensions:
- siderolabs/iscsi-tools # renovate: datasource=docker depName=siderolabs/iscsi-tools
- siderolabs/nfs-utils # renovate: datasource=docker depName=siderolabs/nfs-utils
- siderolabs/nfsrahead # renovate: datasource=docker depName=siderolabs/nfsrahead
