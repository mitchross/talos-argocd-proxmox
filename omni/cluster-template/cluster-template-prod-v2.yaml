    kind: UserVolumeConfig
    name: longhorn-hp-sff-ssd
    provisioning:
      diskSelector:
        match: "!system_disk && disk.size >= 600u * GB"
      minSize: 600GB
      grow: true
# Second PNY (920 GiB VM disk); 900 GB floor keeps it off the 690 GiB disk above.
- name: hp-sff-longhorn-ssd2-volume
  inline:
    apiVersion: v1alpha1
    kind: UserVolumeConfig
    name: longhorn-hp-sff-ssd2
    provisioning:
      diskSelector:
        match: "!system_disk && disk.size >= 900u * GB"
      minSize: 900GB
      grow: true
---
# Bare metal (PXE via booter on the Pi): HP Elite Mini 600 G9, pinned by UUID.
kind: Workers
name: hp-elite-gen13-workers
machines:
- 00e0d31e-1f61-4281-80e0-713248293ae8
systemExtensions:
- siderolabs/intel-ucode # renovate: datasource=docker depName=siderolabs/intel-ucode
- siderolabs/iscsi-tools # renovate: datasource=docker depName=siderolabs/iscsi-tools
- siderolabs/nfs-utils # renovate: datasource=docker depName=siderolabs/nfs-utils
- siderolabs/nfsrahead # renovate: datasource=docker depName=siderolabs/nfsrahead
- siderolabs/util-linux-tools # renovate: datasource=docker depName=siderolabs/util-linux-tools
