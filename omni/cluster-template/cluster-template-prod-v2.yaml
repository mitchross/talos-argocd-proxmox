# talos-prod-cluster-v2: Threadripper (1 CP + 1 general worker + 1 GPU worker),
# HP micro in the shed (wifi, USB radios), HP SFF (wired) and Dell (wired).
# See omni/docs/threadripper-gpu-cluster.md for rebuild notes and sizing rationale.
#
#   omnictl cluster template sync -v -f cluster-template-prod-v2.yaml
---
kind: Cluster
name: talos-prod-cluster-v2
labels:
  cluster-id: "2"
kubernetes:
  version: v1.36.4
talos:
  version: v1.13.9
patches:
- name: disable-default-cni
  inline:
    cluster:
      network:
        cni:
          name: none
      proxy:
        disabled: true
- name: dns-resolver
  inline:
    apiVersion: v1alpha1
    kind: ResolverConfig
    nameservers:
    - address: 192.168.10.1
- name: install-disk
  inline:
    machine:
      install:
        disk: /dev/sda
# NEVER remove: without this the inner VXLAN TCP checksum is never completed
# and cross-node pod TCP silently black-holes (Tcp: InCsumErrors, no drops
# logged). Check with `talosctl get ethernetstatus`.
- name: vxlan-inner-checksum
  inline:
    apiVersion: v1alpha1
    kind: EthernetConfig
    name: eth0
    features:
      tx-checksum-ip-generic: false
      tx-udp_tnl-csum-segmentation: false
- file: patches/docker-hub-auth.yaml
- name: node-performance
  inline:
    machine:
      sysctls:
        fs.inotify.max_user_watches: "1048576"
        fs.inotify.max_user_instances: "8192"
        fs.file-max: "2097152"
        vm.swappiness: "10"
        vm.max_map_count: "524288"
        net.core.somaxconn: "65535"
        net.core.rmem_max: "67108864"
        net.core.wmem_max: "67108864"
        net.ipv4.tcp_congestion_control: bbr
        net.ipv4.tcp_fastopen: "3"
        net.ipv4.tcp_rmem: 4096 87380 33554432
        net.ipv4.tcp_wmem: 4096 65536 33554432
        net.ipv4.tcp_slow_start_after_idle: "0"
        net.ipv4.tcp_mtu_probing: "1"
        net.ipv4.tcp_tw_reuse: "1"
        net.core.netdev_max_backlog: "16384"
        sunrpc.tcp_slot_table_entries: "128"
        sunrpc.tcp_max_slot_table_entries: "65536"
      udev:
        rules:
        - SUBSYSTEM=="bdi", ACTION=="add", ATTR{read_ahead_kb}="131072"
- name: image-gc-thresholds
  inline:
    machine:
      kubelet:
        # Trim the image cache long before the 10%-free eviction line: a full
        # nodefs taints the node AND flips every Longhorn disk on it NotReady.
        extraConfig:
          imageGCHighThresholdPercent: 70
          imageGCLowThresholdPercent: 55
---
kind: ControlPlane
machineClass:
  name: threadripper-control-plane
  size: 1
systemExtensions:
- siderolabs/iscsi-tools # renovate: datasource=docker depName=siderolabs/iscsi-tools
- siderolabs/nfs-utils # renovate: datasource=docker depName=siderolabs/nfs-utils
- siderolabs/nfsrahead # renovate: datasource=docker depName=siderolabs/nfsrahead
- siderolabs/util-linux-tools # renovate: datasource=docker depName=siderolabs/util-linux-tools
patches:
- name: house-topology
  inline:
    machine:
      # Control plane and RTX 3090 worker share the Threadripper/Proxmox
      # failure domain; each other box carries its own zone.
      nodeLabels:
        topology.kubernetes.io/zone: house
- name: control-plane-performance
  inline:
    cluster:
      apiServer:
        extraArgs:
          max-requests-inflight: "800"
          max-mutating-requests-inflight: "400"
      etcd:
        extraArgs:
          quota-backend-bytes: "8589934592"
          snapshot-count: "5000"
          auto-compaction-mode: "periodic"
          auto-compaction-retention: "5m"
          listen-metrics-urls: "http://0.0.0.0:2381"
      controllerManager:
        extraArgs:
          concurrent-deployment-syncs: "10"
          concurrent-replicaset-syncs: "10"
          concurrent-namespace-syncs: "20"
          bind-address: "0.0.0.0"
      scheduler:
        extraArgs:
          kube-api-qps: "100"
          bind-address: "0.0.0.0"
---
kind: Workers
name: hp-micro-workers
machineClass:
  name: hp-micro-worker
  size: 1
systemExtensions:
- siderolabs/iscsi-tools # renovate: datasource=docker depName=siderolabs/iscsi-tools
- siderolabs/nfs-utils # renovate: datasource=docker depName=siderolabs/nfs-utils
- siderolabs/nfsrahead # renovate: datasource=docker depName=siderolabs/nfsrahead
- siderolabs/util-linux-tools # renovate: datasource=docker depName=siderolabs/util-linux-tools
- siderolabs/qemu-guest-agent # renovate: datasource=docker depName=siderolabs/qemu-guest-agent
patches:
- name: hp-micro-worker
  inline:
    machine:
      # Shed, behind the AX86U wifi media bridge. Plain DHCP-on-all-links is
      # kept (it works through the bridge); never pin a NIC name — see the
      # removed gpu-network-dhcp note under gpu-workers.
      nodeLabels:
        node.vanillax.dev/class: hp-micro-worker
        # Own failure domain: the shed's wifi link, shared with nothing else.
        topology.kubernetes.io/zone: shed
        node.vanillax.dev/link: wifi
      # Bad wifi: only pods that tolerate this land here (USB-bound apps, DaemonSets).
      nodeTaints:
        node.vanillax.dev/link: wifi:NoSchedule
      kubelet:
        nodeIP:
          validSubnets:
          - 192.168.10.0/24
        extraConfig:
          serializeImagePulls: false
      sysctls:
        net.core.bpf_jit_harden: 1
- name: hp-micro-longhorn-disks
  inline:
    machine:
      # All-or-nothing annotation: every disk the node should register must be
      # listed here. Omitting talos-ephemeral does not leave it at defaults —
      # it leaves the node with zero usable disks.
      nodeLabels:
        node.longhorn.io/create-default-disk: "config"
      # hp-micro-ssd stays unschedulable: a replica here puts app data behind the shed wifi
      # (the Dell collected 32 single replicas that way). Opt in later via a tagged StorageClass.
      nodeAnnotations:
        node.longhorn.io/default-disks-config: >-
          [{"name":"talos-ephemeral","path":"/var/lib/longhorn","allowScheduling":false,"diskType":"filesystem","storageReserved":17179869184,"tags":[]},{"name":"hp-micro-ssd","path":"/var/mnt/longhorn-hp-micro-ssd","allowScheduling":false,"diskType":"filesystem","storageReserved":0,"tags":["hp-micro-ssd"]}]
      kubelet:
        extraMounts:
        - destination: /var/lib/longhorn
          type: bind
          source: /var/local/longhorn
          options:
          - bind
          - rshared
          - rw
- name: hp-micro-longhorn-ssd-volume
  inline:
    apiVersion: v1alpha1
    kind: UserVolumeConfig
    name: longhorn-hp-micro-ssd
    provisioning:
      # Size is the only thing distinguishing this 850 GiB scsi1 device from
      # the 64 GiB boot disk. Do NOT add a `disk.transport == 'scsi'` clause:
      # Proxmox virtio-scsi disks never match it and the volume silently goes
      # unprovisioned.
      diskSelector:
        match: "!system_disk && disk.size >= 700u * GB"
      minSize: 700GB
      grow: true
---
kind: Workers
name: hp-sff-workers
machineClass:
  name: hp-sff-worker
  size: 1
systemExtensions:
- siderolabs/iscsi-tools # renovate: datasource=docker depName=siderolabs/iscsi-tools
- siderolabs/nfs-utils # renovate: datasource=docker depName=siderolabs/nfs-utils
- siderolabs/nfsrahead # renovate: datasource=docker depName=siderolabs/nfsrahead
- siderolabs/util-linux-tools # renovate: datasource=docker depName=siderolabs/util-linux-tools
- siderolabs/qemu-guest-agent # renovate: datasource=docker depName=siderolabs/qemu-guest-agent
patches:
- name: hp-sff-worker
  inline:
    machine:
      # House, wired 2.5GbE. Plain DHCP-on-all-links; never pin a NIC name —
      # see the removed gpu-network-dhcp note under gpu-workers.
      nodeLabels:
        node.vanillax.dev/class: hp-sff-worker
        # Own failure domain: a separate box from the Threadripper (house).
        topology.kubernetes.io/zone: hp-sff
        node.vanillax.dev/link: wired
        # Coroot backend + agents pin here (monitoring/coroot nodeSelector).
        coroot.vanillax.dev/enabled: "true"
      kubelet:
        nodeIP:
          validSubnets:
          - 192.168.10.0/24
        extraConfig:
          serializeImagePulls: false
      sysctls:
        net.core.bpf_jit_harden: 1
- name: hp-sff-longhorn-disks
  inline:
    machine:
      # All-or-nothing annotation: every disk the node should register must be
      # listed here. Omitting talos-ephemeral does not leave it at defaults —
      # it leaves the node with zero usable disks.
      nodeLabels:
        node.longhorn.io/create-default-disk: "config"
      nodeAnnotations:
        node.longhorn.io/default-disks-config: >-
          [{"name":"talos-ephemeral","path":"/var/lib/longhorn","allowScheduling":false,"diskType":"filesystem","storageReserved":17179869184,"tags":[]},{"name":"hp-sff-ssd","path":"/var/mnt/longhorn-hp-sff-ssd","allowScheduling":true,"diskType":"filesystem","storageReserved":0,"tags":["hp-sff-ssd"]}]
      kubelet:
        extraMounts:
        - destination: /var/lib/longhorn
          type: bind
          source: /var/local/longhorn
          options:
          - bind
          - rshared
          - rw
- name: hp-sff-longhorn-ssd-volume
  inline:
    apiVersion: v1alpha1
    kind: UserVolumeConfig
    name: longhorn-hp-sff-ssd
    provisioning:
      # Size alone distinguishes the 690 GiB scsi1 device from the 128 GiB boot
      # disk. No `disk.transport` clause: virtio-scsi never matches it.
      diskSelector:
        match: "!system_disk && disk.size >= 600u * GB"
      minSize: 600GB
      grow: true
---
kind: Workers
name: dell-workers
machineClass:
  name: dell-worker
  size: 1
systemExtensions:
- siderolabs/iscsi-tools # renovate: datasource=docker depName=siderolabs/iscsi-tools
- siderolabs/nfs-utils # renovate: datasource=docker depName=siderolabs/nfs-utils
- siderolabs/nfsrahead # renovate: datasource=docker depName=siderolabs/nfsrahead
- siderolabs/util-linux-tools # renovate: datasource=docker depName=siderolabs/util-linux-tools
- siderolabs/qemu-guest-agent # renovate: datasource=docker depName=siderolabs/qemu-guest-agent
patches:
- name: dell-worker
  inline:
    machine:
      # Wired 2.5GbE (rtl8125b); the onboard I219 is unused after its e1000e
      # hang bug. Plain DHCP-on-all-links; never pin a NIC name.
      nodeLabels:
        node.vanillax.dev/class: dell-worker
        # Own failure domain: a separate box from the Threadripper and the HPs.
        topology.kubernetes.io/zone: dell
        node.vanillax.dev/link: wired
      kubelet:
        nodeIP:
          validSubnets:
          - 192.168.10.0/24
        extraConfig:
          serializeImagePulls: false
      sysctls:
        net.core.bpf_jit_harden: 1
- name: dell-longhorn-disks
  inline:
    machine:
      # All-or-nothing annotation: every disk the node should register must be
      # listed here. Omitting talos-ephemeral does not leave it at defaults —
      # it leaves the node with zero usable disks.
      nodeLabels:
        node.longhorn.io/create-default-disk: "config"
      nodeAnnotations:
        node.longhorn.io/default-disks-config: >-
          [{"name":"talos-ephemeral","path":"/var/lib/longhorn","allowScheduling":false,"diskType":"filesystem","storageReserved":17179869184,"tags":[]},{"name":"dell-ssd","path":"/var/mnt/longhorn-dell-ssd","allowScheduling":true,"diskType":"filesystem","storageReserved":0,"tags":["dell-ssd"]}]
      kubelet:
        extraMounts:
        - destination: /var/lib/longhorn
          type: bind
          source: /var/local/longhorn
          options:
          - bind
          - rshared
          - rw
- name: dell-longhorn-ssd-volume
  inline:
    apiVersion: v1alpha1
    kind: UserVolumeConfig
    name: longhorn-dell-ssd
    provisioning:
      # Size alone distinguishes the 400 GiB scsi1 device from the 128 GiB boot
      # disk. No `disk.transport` clause: virtio-scsi never matches it.
      diskSelector:
        match: "!system_disk && disk.size >= 350u * GB"
      minSize: 350GB
      grow: true
---
kind: Workers
name: workers
machineClass:
  name: threadripper-worker
  size: 1
systemExtensions:
- siderolabs/iscsi-tools # renovate: datasource=docker depName=siderolabs/iscsi-tools
- siderolabs/nfs-utils # renovate: datasource=docker depName=siderolabs/nfs-utils
- siderolabs/nfsrahead # renovate: datasource=docker depName=siderolabs/nfsrahead
- siderolabs/util-linux-tools # renovate: datasource=docker depName=siderolabs/util-linux-tools
- siderolabs/qemu-guest-agent # renovate: datasource=docker depName=siderolabs/qemu-guest-agent
patches:
- name: general-worker
  inline:
    machine:
      nodeLabels:
        node.vanillax.dev/class: general-worker
        topology.kubernetes.io/zone: house
      kubelet:
        nodeIP:
          validSubnets:
          - 192.168.10.0/24
        extraConfig:
          serializeImagePulls: false
          maxPods: 150
      sysctls:
        net.core.bpf_jit_harden: 1
- name: general-longhorn-disks
  inline:
    machine:
      # All-or-nothing annotation: every disk the node should register must be
      # listed here. Omitting one leaves the node with zero usable disks.
      nodeLabels:
        node.longhorn.io/create-default-disk: "config"
      nodeAnnotations:
        node.longhorn.io/default-disks-config: >-
          [{"name":"talos-ephemeral","path":"/var/lib/longhorn","allowScheduling":false,"diskType":"filesystem","storageReserved":17179869184,"tags":[]},{"name":"tr-ssd","path":"/var/mnt/longhorn-tr-ssd","allowScheduling":true,"diskType":"filesystem","storageReserved":0,"tags":[]}]
      kubelet:
        extraMounts:
        - destination: /var/lib/longhorn
          type: bind
          source: /var/local/longhorn
          options:
          - bind
          - rshared
          - rw
- name: general-longhorn-ssd-volume
  inline:
    apiVersion: v1alpha1
    kind: UserVolumeConfig
    name: longhorn-tr-ssd
    provisioning:
      # The only non-system disk is the 140 GiB ssd-ent device. Do NOT add a
      # `disk.transport == 'scsi'` clause: virtio-scsi never matches it.
      diskSelector:
        match: "!system_disk && disk.size >= 100u * GB"
      minSize: 100GB
      grow: true
---
kind: Workers
name: gpu-workers
machineClass:
  name: threadripper-gpu-worker
  size: 1
# Do not add nfs-utils to GPU nodes; use the CSI NFS path instead.
systemExtensions:
- siderolabs/iscsi-tools # renovate: datasource=docker depName=siderolabs/iscsi-tools
- siderolabs/util-linux-tools # renovate: datasource=docker depName=siderolabs/util-linux-tools
- siderolabs/nonfree-kmod-nvidia-production # renovate: datasource=docker depName=siderolabs/nonfree-kmod-nvidia-production
- siderolabs/nvidia-container-toolkit-production # renovate: datasource=docker depName=siderolabs/nvidia-container-toolkit-production
patches:
- name: gpu-worker-labels
  inline:
    machine:
      nodeLabels:
        gpu-worker: "true"
        nvidia.com/gpu: "true"
        node.vanillax.dev/gpu-class: rtx-3090
        topology.kubernetes.io/zone: house
- name: longhorn-node-disks
  inline:
    machine:
      nodeLabels:
        node.longhorn.io/create-default-disk: "config"
      nodeAnnotations:
        node.longhorn.io/default-disks-config: >-
          [{"name":"talos-ephemeral","path":"/var/lib/longhorn","allowScheduling":true,"diskType":"filesystem","storageReserved":0,"tags":[]},{"name":"nvme1","path":"/var/mnt/longhorn-nvme1","allowScheduling":true,"diskType":"filesystem","storageReserved":0,"tags":[]},{"name":"ssd-flash","path":"/var/mnt/longhorn-ssd-flash","allowScheduling":true,"diskType":"filesystem","storageReserved":0,"tags":["flash"]}]
- file: patches/threadripper-gpu-workers.yaml
- name: kubelet-performance
  inline:
    machine:
      kubelet:
        extraConfig:
          serializeImagePulls: false
          maxPods: 250
- name: longhorn-storage
  inline:
    machine:
      kubelet:
        extraMounts:
        - destination: /var/lib/longhorn
          type: bind
          source: /var/local/longhorn
          options:
          - bind
          - rshared
          - rw
- name: longhorn-nvme1-volume
  inline:
    apiVersion: v1alpha1
    kind: UserVolumeConfig
    name: longhorn-nvme1
    provisioning:
      # Upper bound added when longhorn-ssd-flash was introduced: without it this
      # selector would ALSO match the 300GB enterprise-SSD disk and the two volumes
      # would race for the same device. Sizes are the only thing that distinguishes
      # them — both are virtio-scsi disks reporting the same model to Talos.
      diskSelector:
        match: "!system_disk && disk.size >= 400u * GB"
      minSize: 400GB
      grow: true
# Fast local flash tier: a 300GB Proxmox disk on `ssd-ent` — 2x HPE MK000480GWCEV
# enterprise SATA SSDs (power-loss protected) in mdadm RAID1, exposed as a **thick**
# LVM VG. Backs the `longhorn-flash` StorageClass via Longhorn disk tag `flash`.
#
# Measured 4K QD1 fsync (a durable write / DB commit): 3,069 IOPS @ 0.32ms here, vs
# 259 IOPS @ 1.25ms on the default EDILOCA-backed disk. ~12x.
#
# The 300GB size is load-bearing: it is what separates this disk from the 450GB
# longhorn-nvme1 disk in the selectors above. Do not resize it without fixing both.
- name: longhorn-ssd-flash-volume
  inline:
    apiVersion: v1alpha1
    kind: UserVolumeConfig
    name: longhorn-ssd-flash
    provisioning:
      diskSelector:
        match: "!system_disk && disk.size >= 250u * GB && disk.size < 400u * GB"
      minSize: 250GB
      grow: true
