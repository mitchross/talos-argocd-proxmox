# Worker sets own DHCP/static addressing; this patch selects kubelet addresses and loads NVIDIA modules.
# Do not pin DHCP to PCI-derived NIC names, which can change after passthrough hardware moves.
machine:
  kubelet:
    nodeIP:
      validSubnets:
      - 192.168.10.0/24
  kernel:
    modules:
    - name: nvidia
    - name: nvidia_uvm
    - name: nvidia_drm
    - name: nvidia_modeset
  sysctls:
    net.core.bpf_jit_harden: 1
