---
# omnictl apply -f omni/machine-classes/dell-worker.yaml
# Worker on the Dell OptiPlex 7060 (192.168.10.16), wired 2.5GbE.
metadata:
  namespace: default
  type: MachineClasses.omni.sidero.dev
  id: dell-worker
spec:
  matchlabels: []
  autoprovision:
    providerid: proxmox-dell
    # Keep empty: a static `ip=` arg binds to Talos bond0 and blackholes the
    # guest. DHCP registers the ISO; the machine config takes over after.
    kernelargs: []
    metavalues: []
    providerdata: |
      # Leave host RAM and CPU headroom for Proxmox, the provider agent, and QEMU.
      cores: 6
      sockets: 1
      memory: 30720
      # Boot disk carries Talos + the container image cache; 64 GiB put this node
      # in permanent DiskPressure. Must stay under the 151 GiB local-lvm pool.
      disk_size: 128
      storage_selector: name == "local-lvm"
      network_bridge: vmbr0
      disk_ssd: true
      disk_discard: true
      disk_iothread: true
      disk_cache: none
      disk_aio: io_uring
      # Place Longhorn on dell-ssd-vmstore, separate from the boot disk, with capacity headroom.
      # Keep thick LVM: thin metadata commits reduce fsync performance.
      additional_disks:
        - storage_selector: name == "dell-ssd-vmstore"
          disk_size: 400
          disk_ssd: true
          disk_discard: true
          disk_iothread: true
          disk_cache: none
          disk_aio: io_uring
      cpu_type: host
      machine_type: q35
      bios: seabios
      vga: std
      balloon: false
      # Proxmox PCI resource mapping for this host's Intel iGPU.
      pci_devices:
        - mapping: intel-igpu
          pcie: true
