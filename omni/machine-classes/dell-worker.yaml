---
# omnictl apply -f omni/machine-classes/dell-worker.yaml
# CPU-only worker on the Dell OptiPlex 7060 (192.168.10.16), wired 2.5GbE.
metadata:
  namespace: default
  type: MachineClasses.omni.sidero.dev
  id: dell-worker
spec:
  matchlabels: []
  autoprovision:
    providerid: proxmox-dell
    # Keep empty: a static `ip=` arg binds to Talos bond0 and blackholes the
    # guest. DHCP registers the ISO; the machine config takes over after.
    kernelargs: []
    metavalues: []
    providerdata: |
      # i5-8500, 6 physical cores / 54.7 GiB usable (56 GB installed, iGPU
      # reserved). All six cores and 46 GiB leave ~8 GiB for Proxmox, the
      # provider agent, and qemu overhead.
      cores: 6
      sockets: 1
      memory: 47104
      # Boot disk carries Talos + the container image cache; 64 GiB put this node
      # in permanent DiskPressure. Must stay under the 151 GiB local-lvm pool.
      disk_size: 128
      storage_selector: name == "local-lvm"
      network_bridge: vmbr0
      disk_ssd: true
      disk_discard: true
      disk_iothread: true
      disk_cache: none
      disk_aio: io_uring
      # Longhorn disk on the Samsung 500 GB SSD (/dev/sda), a different spindle
      # from the boot pool: replica writes never contend with image pulls. Needs
      # a thick-LVM Proxmox storage `dell-ssd-vmstore`; 400 GiB of 465 leaves
      # ~65 GiB headroom. Do not use LVM-thin: this repo has measured its
      # metadata commits collapsing fsync performance.
      additional_disks:
        - storage_selector: name == "dell-ssd-vmstore"
          disk_size: 400
          disk_ssd: true
          disk_discard: true
          disk_iothread: true
          disk_cache: none
          disk_aio: io_uring
      cpu_type: host
      machine_type: q35
      bios: seabios
      vga: std
      balloon: false
