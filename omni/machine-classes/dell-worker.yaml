---
# omnictl apply -f omni/machine-classes/dell-worker.yaml
# CPU-only Dell worker behind the AX86U media bridge (192.168.10.16).
# See docs/domains/networking/wifi-proxmox-talos-worker.md.
metadata:
  namespace: default
  type: MachineClasses.omni.sidero.dev
  id: dell-worker
spec:
  matchlabels: []
  autoprovision:
    providerid: proxmox-dell
    # DHCP is required for ISO registration; the Talos machine config takes
    # over with static 192.168.10.119 after installation.
    kernelargs: []
    metavalues: []
    providerdata: |
      cores: 4
      sockets: 1
      # The OptiPlex has 64 GiB physical RAM. Keep 16 GiB for Proxmox and the
      # provider; the live VM was already proven at this 48 GiB allocation.
      memory: 49152
      # Boot disk carries Talos + the container image cache; 64 GiB put this node
      # in permanent DiskPressure. Must stay under the local-lvm thin pool size.
      disk_size: 128
      storage_selector: name == "local-lvm"
      network_bridge: vmbr0
      disk_ssd: true
      disk_discard: true
      disk_iothread: true
      disk_cache: none
      disk_aio: io_uring
      # Dedicated Longhorn disk on the added Samsung 500 GB SSD. Before
      # applying this class, create a Proxmox thick-LVM storage named
      # `dell-ssd-vmstore` on the currently unused /dev/sda. 400 GiB leaves
      # about 66 GiB of device headroom. Do not use LVM-thin: this repo has
      # measured its metadata commits collapsing fsync performance.
      additional_disks:
        - storage_selector: name == "dell-ssd-vmstore"
          disk_size: 400
          disk_ssd: true
          disk_discard: true
          disk_iothread: true
          disk_cache: none
          disk_aio: io_uring
      cpu_type: host
      machine_type: q35
      bios: seabios
      vga: std
      balloon: false
