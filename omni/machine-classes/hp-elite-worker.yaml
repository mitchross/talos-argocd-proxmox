---
# omnictl apply -f omni/machine-classes/hp-elite-worker.yaml
# Large CPU worker on the HP Elite Mini 600 G9 (192.168.10.22), wired LAN.
# Carries the Zigbee coordinator.
metadata:
  namespace: default
  type: MachineClasses.omni.sidero.dev
  id: hp-elite-worker
spec:
  matchlabels: []
  autoprovision:
    providerid: proxmox-hp-elite
    kernelargs: []
    metavalues: []
    providerdata: |
      # 16 of 20 logical CPUs and 24 of 30 GiB leave host headroom.
      cores: 16
      sockets: 1
      memory: 24576
      # The 128 GiB boot disk fits the otherwise-empty 141 GiB local-lvm pool.
      disk_size: 128
      storage_selector: name == "local-lvm"
      network_bridge: vmbr0
      disk_ssd: true
      disk_discard: true
      disk_iothread: true
      disk_cache: none
      disk_aio: io_uring
      # The worn Intel 512 GB NVMe is a dedicated thick-LVM Longhorn disk.
      additional_disks:
        - storage_selector: name == "hp-elite-vmstore"
          disk_size: 440
          disk_ssd: true
          disk_discard: true
          disk_iothread: true
          disk_cache: none
          disk_aio: io_uring
      cpu_type: host
      machine_type: q35
      bios: seabios
      vga: std
      balloon: false
      # Proxmox USB Resource Mapping, attached as usb0.
      # The name must exist in this host's Datacenter -> Resource Mappings.
      usb_devices:
        - mapping: zigbee
          usb3: true
