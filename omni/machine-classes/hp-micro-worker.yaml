---
# omnictl apply -f omni/machine-classes/hp-micro-worker.yaml
# CPU worker on the HP 600 G4 micro (192.168.10.20), in the shed behind the
# AX86U wifi media bridge. Carries the SDR radios and the USB wifi adapter.
metadata:
  namespace: default
  type: MachineClasses.omni.sidero.dev
  id: hp-micro-worker
spec:
  matchlabels: []
  autoprovision:
    providerid: proxmox-hp-micro
    kernelargs: []
    metavalues: []
    providerdata: |
      # i5-8500T, 6 physical cores / 16 GiB on the host. 4 cores + 12 GiB keeps
      # two cores and ~4 GiB for Proxmox, the provider agent, and qemu overhead
      # so a 16 GiB box never reaches for swap.
      cores: 4
      sockets: 1
      memory: 12288
      # Boot disk carries Talos + the container image cache; 64 GiB put the peer
      # workers in DiskPressure. Must stay under the local-lvm thin pool size.
      disk_size: 128
      storage_selector: name == "local-lvm"
      network_bridge: vmbr0
      disk_ssd: true
      disk_discard: true
      disk_iothread: true
      disk_cache: none
      disk_aio: io_uring
      # Dedicated Longhorn disk on the 931 GiB PNY CS900 SSD (/dev/sda),
      # exposed as the thick-LVM Proxmox storage `hp-ssd-vmstore`. 850 GiB
      # leaves ~81 GiB of device headroom. Do not use LVM-thin: this repo has
      # measured its metadata commits collapsing fsync performance.
      additional_disks:
        - storage_selector: name == "hp-ssd-vmstore"
          disk_size: 850
          disk_ssd: true
          disk_discard: true
          disk_iothread: true
          disk_cache: none
          disk_aio: io_uring
      cpu_type: host
      machine_type: q35
      bios: seabios
      vga: std
      balloon: false
      # Proxmox USB Resource Mappings, attached as usb0/usb1/usb2 in list order.
      # Each name must exist in this host's Datacenter -> Resource Mappings.
      usb_devices:
        - mapping: sdr-blogv4
          usb3: true
        - mapping: sdr-adsb
          usb3: true
        - mapping: wifi-usb
          usb3: true
