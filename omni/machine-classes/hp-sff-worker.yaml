---
# omnictl apply -f omni/machine-classes/hp-sff-worker.yaml
# CPU worker on the HP ProDesk SFF (192.168.10.21), wired LAN.
metadata:
  namespace: default
  type: MachineClasses.omni.sidero.dev
  id: hp-sff-worker
spec:
  matchlabels: []
  autoprovision:
    providerid: proxmox-hp-sff
    kernelargs: []
    metavalues: []
    providerdata: |
      # i5-8500, 6 physical cores / 62 GiB on the host, shared with the
      # control-plane VM: 40 + 12 GiB leaves ~10 GiB for Proxmox and qemu.
      cores: 6
      sockets: 1
      memory: 40960
      # Boot disk carries Talos + the container image cache; 64 GiB put the peer
      # workers in DiskPressure.
      disk_size: 128
      storage_selector: name == "hp-prodesk-vmstore"
      network_bridge: vmbr0
      disk_ssd: true
      disk_discard: true
      disk_iothread: true
      disk_cache: none
      disk_aio: io_uring
      # Single 931 GiB PNY CS900 SSD shared with Proxmox (root 96 + swap 8 GiB).
      # The stock local-lvm thin pool was removed and the VG exposed as thick-LVM
      # storage `hp-prodesk-vmstore`; 128 + 690 leaves ~8 GiB of VG headroom.
      # Do not use LVM-thin: thin metadata commits collapse fsync performance.
      additional_disks:
        - storage_selector: name == "hp-prodesk-vmstore"
          disk_size: 690
          disk_ssd: true
          disk_discard: true
          disk_iothread: true
          disk_cache: none
          disk_aio: io_uring
      cpu_type: host
      machine_type: q35
      bios: seabios
      vga: std
      balloon: false
