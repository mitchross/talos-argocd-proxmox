---
# omnictl apply -f omni/machine-classes/threadripper-control-plane.yaml
# Dedicated Threadripper control-plane VM.
metadata:
  namespace: default
  type: MachineClasses.omni.sidero.dev
  id: threadripper-control-plane
spec:
  matchlabels: []
  autoprovision:
    providerid: proxmox-threadripper
    kernelargs: []
    metavalues: []
    providerdata: |
      cores: 4
      sockets: 1
      # Steady state is ~7.5 GiB; 12 GiB keeps etcd headroom while holding the
      # three Threadripper guests to a 100 GiB total against 125.67 GiB of RAM.
      memory: 12288
      disk_size: 100
      storage_selector: name == "nvme0-vmstore"
      network_bridge: vmbr0
      disk_ssd: true
      disk_discard: true
      disk_iothread: true
      disk_cache: none
      disk_aio: io_uring
      cpu_type: host
      machine_type: q35
      balloon: false
