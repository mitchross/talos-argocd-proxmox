services:
  omni-infra-provider-proxmox:
    # Upstream now cuts real releases (v0.1.0 2026-05-22, v0.2.0 2026-07-23),
    # so this is pinned to a release tag rather than the rolling :latest it
    # used to track. The previous pin was a mid-stream :latest digest from
    # 2026-06-11 — a build between the two releases, with no changelog to
    # reason about. The digest is kept alongside the tag so the running
    # version stays reproducible even if the tag is ever re-pushed.
    #
    # The 7-character tags on ghcr (e.g. da2f853, 410ed22) are commit-SHA
    # refs, not semver — do not pin to those. Renovate tracks this image.
    #
    # To bump manually, resolve the digest for the tag you want:
    #   docker buildx imagetools inspect \
    #     ghcr.io/siderolabs/omni-infra-provider-proxmox:v0.2.0 \
    #     | grep -i digest
    # then update below and `docker compose up -d`.
    image: ghcr.io/siderolabs/omni-infra-provider-proxmox:v0.2.0@sha256:c0d0687e87d9f2fb77c7a9d6d7263820953d20441200f3de64b22afaa7ff273e
    container_name: omni-infra-provider-proxmox
    env_file:
      - .env
    volumes:
      - ./config.yaml:/config.yaml:ro
    command: >
      --config-file /config.yaml
      --omni-api-endpoint ${OMNI_API_ENDPOINT}
      --omni-service-account-key ${OMNI_INFRA_PROVIDER_KEY}
    restart: unless-stopped
    network_mode: host
