# One Sidero Proxmox provider container per Proxmox host, one compose project.
# All five run the same build: the image line is repeated per service (not an
# anchor) so Renovate sees and bumps every pin in a single PR.
# Per-service ops: `docker compose up -d hp-sff`; bare `down` takes all five.
x-provider: &provider
  env_file:
    - .env
  restart: unless-stopped
  network_mode: host

services:

  threadripper:
    <<: *provider
    image: ghcr.io/siderolabs/omni-infra-provider-proxmox:v0.2.0-3-g7cefedd@sha256:5dcddc67c3793aa9f0ea693733e1293639b036595ed599c46e30033b5e112e3c
    container_name: omni-infra-provider-proxmox-threadripper
    volumes:
      - ./threadripper.config.yaml:/config.yaml:ro
    command: >
      --config-file /config.yaml
      --omni-api-endpoint ${OMNI_API_ENDPOINT}
      --omni-service-account-key ${OMNI_INFRA_PROVIDER_KEY_THREADRIPPER}
      --id proxmox-threadripper
      --provider-name "Proxmox Threadripper"
      --provider-description "Threadripper host (192.168.10.14): control plane, general worker, GPU worker"


  hp-micro:
    <<: *provider
    image: ghcr.io/siderolabs/omni-infra-provider-proxmox:v0.2.0-3-g7cefedd@sha256:5dcddc67c3793aa9f0ea693733e1293639b036595ed599c46e30033b5e112e3c
    container_name: omni-infra-provider-proxmox-hp-micro
    volumes:
      - ./hp-micro.config.yaml:/config.yaml:ro
    command: >
      --config-file /config.yaml
      --omni-api-endpoint ${OMNI_API_ENDPOINT}
      --omni-service-account-key ${OMNI_INFRA_PROVIDER_KEY_HP_MICRO}
      --id proxmox-hp-micro
      --provider-name "Proxmox HP Micro"
      --provider-description "HP 600 G4 micro host (192.168.10.20), shed, wifi media bridge, USB radios"

  hp-sff:
    <<: *provider
    image: ghcr.io/siderolabs/omni-infra-provider-proxmox:v0.2.0-3-g7cefedd@sha256:5dcddc67c3793aa9f0ea693733e1293639b036595ed599c46e30033b5e112e3c
    container_name: omni-infra-provider-proxmox-hp-sff
    volumes:
      - ./hp-sff.config.yaml:/config.yaml:ro
    command: >
      --config-file /config.yaml
      --omni-api-endpoint ${OMNI_API_ENDPOINT}
      --omni-service-account-key ${OMNI_INFRA_PROVIDER_KEY_HP_SFF}
      --id proxmox-hp-sff
      --provider-name "Proxmox HP SFF"
      --provider-description "HP ProDesk SFF host (192.168.10.21), house, wired"

  hp-elite:
    <<: *provider
    image: ghcr.io/siderolabs/omni-infra-provider-proxmox:v0.2.0-3-g7cefedd@sha256:5dcddc67c3793aa9f0ea693733e1293639b036595ed599c46e30033b5e112e3c
    container_name: omni-infra-provider-proxmox-hp-elite
    volumes:
      - ./hp-elite.config.yaml:/config.yaml:ro
    command: >
      --config-file /config.yaml
      --omni-api-endpoint ${OMNI_API_ENDPOINT}
      --omni-service-account-key ${OMNI_INFRA_PROVIDER_KEY_HP_ELITE}
      --id proxmox-hp-elite
      --provider-name "Proxmox HP Elite"
      --provider-description "HP Elite Mini 600 G9 host (192.168.10.22), house, wired, large CPU worker"

  dell:
    <<: *provider
    image: ghcr.io/siderolabs/omni-infra-provider-proxmox:v0.2.0-3-g7cefedd@sha256:5dcddc67c3793aa9f0ea693733e1293639b036595ed599c46e30033b5e112e3c
    container_name: omni-infra-provider-proxmox-dell
    volumes:
      - ./dell.config.yaml:/config.yaml:ro
    command: >
      --config-file /config.yaml
      --omni-api-endpoint ${OMNI_API_ENDPOINT}
      --omni-service-account-key ${OMNI_INFRA_PROVIDER_KEY_DELL}
      --id proxmox-dell
      --provider-name "Proxmox Dell"
      --provider-description "Dell OptiPlex 7060 host (192.168.10.16), wired 2.5GbE, CPU worker"
