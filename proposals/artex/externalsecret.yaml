# One 1Password field feeds both sides: Postgres creates the role from `password` on an empty volume,
# and ARTEX reads the same value inside ARTEX_PG_DSN (URL-escaped).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: artex-db
  namespace: artex
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password
  target:
    name: artex-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password: '{{ .dbPassword }}'
        ARTEX_PG_DSN: 'postgres://artex:{{ .dbPassword | urlquery }}@artex-postgres-16.artex.svc.cluster.local:5432/artex?sslmode=disable'
  data:
    - secretKey: dbPassword
      remoteRef:
        key: postgres-secrets
        property: artex_db_password
