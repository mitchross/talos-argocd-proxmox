apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: artex

resources:
- namespace.yaml
- vpa.yaml
- externalsecret.yaml
- network-policy.yaml
- pvc.yaml
- deployment.yaml
- service.yaml
# In-app Postgres (plain postgres + kopiur); runbook: docs/domains/cnpg/run-postgres-plain-english.md
- postgres-16/postgres.yaml
- kopiur/artex.yaml
- kopiur/artex-postgres-16-data.yaml

# Uniform kopiur backup fields (repository, copyMethod, populator). In my-apps/development/artex this is ../../common/kopiur-backup.
components:
- ../../my-apps/common/kopiur-backup

configMapGenerator:
- name: artex-config
  envs:
  - artex.env
